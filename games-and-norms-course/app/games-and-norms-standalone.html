s case sits on both. IF the job is to hold a costly norm THEN keep the unit small, dense and bounded, which Core is [E for the mechanism]. IF the job is to move a rare skill THEN build bridges, and for a resisting cluster seed inside it with more than one adopter, because a lone reviewer on a team of eight is the lone cooperator in a stag hunt, worse off for having tried (t04) [E for the model; H here]. Paul's two-per-team gives every team the Growth outcome and dissolves Core's pocket: the file's named mistake of reorganizing for cross-pollination while a young norm sits in a few dense pockets. So: two seniors move together to Growth for two quarters and two to Billing, cohorts not tokens (`05`) [H]; Core keeps three [H]; the demonstrators' reviews are visible, so the norm spreads because it visibly pays (`07`, ledger #36) [H]; their delivery targets drop for the term (`02`) [E in the tournament; V that skill spread is worth two quarters of throughput, Paul's freeze the dissent].\n\nTo Paul: the sorting is the structure's doing and will reproduce itself after any freeze; assign explicit ownership of team composition to your office, because sorting externalities have no natural owner (`05`) [V]. Balancing measure: measure the 2pq ratio for senior-junior review ties across teams; fewer cross-team ties than chance is the homophily being bridged (`10`) [E, theorem].\n\nSwitch signal: toward closure if the seeded pairs' norm fails because nobody around them adopts it, or they ask to return early; toward bridges if Core's incidents rise because rare knowledge sat with someone who left. Register entry [H]: \"Growth's review-catchable incidents fall during the two quarters with a senior pair; at least two Growth engineers review at the demonstrated standard by term's end.\"","novice_error":"Break up the club, because seven seniors on one team looks like a fairness problem and a spread looks like an obvious fix. It scatters the one place the review norm is dense and recreates the lone-reviewer situation on six teams instead of two. The mirror is to protect Core until Growth and Billing are permanently junior teams with no one to catch the incidents.","sources":["05-micromotives-and-macrobehavior","10-networks-crowds-markets","03-social-psychology","07-stag-hunt"]},{"id":"k14","title":"The bounty split that costs contributors every quarter","scenario":"The Kestrel foundation pays a quarterly bounty pool of $20,000 to contributors of its open-source runtime. Three maintainers split it at their discretion among about 40 contributors, and post the amounts. Every quarter the forum thread on the split runs to over a hundred replies, and three to five contributors leave, usually the ones who received less than they expected. Last quarter one contributor who had merged the largest feature received the same as one who fixed typos, because the maintainers \"wanted to encourage newcomers.\"\n\nKemal, the treasurer, has a fix for the next split in five weeks: \"People are just greedy. Equal shares for everyone who merged anything; nobody can argue with equal.\" Hana, a maintainer, wants the opposite: shares proportional to lines of code merged, computed by a script, \"so it's objective.\" A third maintainer points out that nobody has ever asked the contributors what they think a fair split is, and that the foundation's own contributors include people from several countries with different norms about pay and credit.","tension":"t05","module":"m5","question":"What rule governs the next split, and how do you find out what \"fair\" means to these forty people?","considerations":["What do people punish in the ultimatum game: unequal outcomes or unfair intentions? What does that say about last quarter's \"encourage newcomers\" split?","What do the ledger's numbers say about the fairness baseline: is there a universal 50-50, or does the content vary?","What is t05's rule for choosing a fairness baseline, and which four questions elicit it?","What does Hana's script do to unmeasured contribution (t12)? What does Kemal's equal split assume about the norm?","What does \"seed early rounds deliberately\" mean for the first split under a new rule?"],"model_answer":"Decision: elicit the group's fairness norm before the next split, then publish a procedurally impartial rule built from what it says, with the first split under it chosen deliberately. Draw the game first: a repeated allocation in which recipients retaliate by exit, and people punish intended unfairness far more than unlucky outcomes (`06`, Blount 1995) [E in the lab]. Last quarter's split was read as an intention (a large feature paid the same as typo fixes), so the exits were retaliation, not greed.\n\nt05's rule: IF you are choosing a fairness baseline THEN elicit it from the group; never a lab or 50-50 default (ledger #25). The content of fairness is local: mean ultimatum offers ran from about 26% to about 58% across fifteen small-scale societies (Henrich et al. 2001, verified), while student offers average about 40%, mode 40-50% [E]. So this month, Bicchieri's four questions anonymously: what split rule would you use; what do most contributors here consider fair; what do most think the maintainers should do; what happens when a split is seen as unfair [E for the method, design-sensitive]. Then a rule that makes the allocation procedurally impartial, removing the intention signal: a published rubric (merged changes weighted by an impact score set at merge time, before anyone knows the pool) and a lottery for ties (`06`) [E for the mechanism; H for this rubric]. Seed the first round deliberately, since first splits set the fairness attractor (`08`) [H, shown in simulation].\n\nTo Kemal: equal shares import one norm without asking. To Hana: lines of code is a partial metric that displaces review, triage and documentation and is gamed within a quarter (t12, `04`) [E as theory]. A small, stated newcomer share is legitimate if it is a visible rule rather than a surprise [V, that process fairness is a good in itself, Kemal dissenting]. Balancing measure: the norm is conditional until it survives a collapse of expectations (ledger #10), so treat the elicited baseline as the group's current norm, not its character.\n\nSwitch signal: toward norms if complaints track what contributors believe others received rather than what they value, and exits fall once the rule is public and unchanged; toward preferences if the same people complain under every rule and framing. Register entry [H]: \"under a published rubric, exits after a split fall to at most one per quarter for three quarters.\"","novice_error":"Pick a rule that sounds unarguable, equal or by lines of code, because the pain is the argument and any objective rule seems to end it. Both impose a fairness content nobody elicited, and the script one pays for exactly the contribution that is easiest to fake. The mirror is to keep discretion and simply explain the reasoning better, which leaves the intention signal in every split.","sources":["06-behavioral-game-theory","08-grammar-of-society","04-games-of-strategy"]},{"id":"k15","title":"Sixteen sign-offs and one late reviewer","scenario":"A monthly release of Orrery's platform requires sign-off from sixteen component owners. The release goes out when the last signature lands. Six months ago the median time from release-candidate to full sign-off was one day; it is now four, and the last two releases slipped a week. Yara, the release manager, has asked around: owners say, in nearly the same words, \"There's no point rushing; someone is always late, and if I sign early and then a bug turns up I've wasted the review.\" Each owner's review takes about three hours if done carefully.\n\nYara's proposal to the VP, due Friday: a team bonus paid when a release ships on time, and a \"release hero\" award. The VP's instinct is a hard deadline with escalation to managers for late signatures. One component owner, Femi, suggests quietly that the problem is the sixteen, not the people: when the process had six signatories two years ago, nobody was ever more than a day late.","tension":"t04","module":"m6","question":"What do you change about the sign-off process before the next release, and is Femi right?","considerations":["What game is a release that ships when the slowest of sixteen signs? What does the lab say such groups converge to, and at what size?","What is the cost of signing early, and how does it compare with the reward for a fast release? Which does the bonus touch?","What are the two structural fixes t04 names for a large weak-link group?","What could a visible sign-off board do, and what does a leader naming the target do?","What does escalation to managers do to the shadow of the future between owners?"],"model_answer":"Decision: Femi is right; change the aggregation rule so the release no longer waits for the slowest of sixteen, and cap the group whose minimum matters at a handful. Draw the game first: sixteen players each choosing how fast to review, and the release's timing is the minimum of their choices. That is a weak-link game with an unambiguous lab record: groups of 14-16 fell to the lowest effort within about ten rounds while fixed pairs reached the top (Van Huyck, Battalio and Beil 1990; group-size result verified, round counts background) [E]. The owners have said the mechanism aloud: signing early is wasted if someone else is late, so waiting is risk-dominant.\n\nt04's first branch applies: IF matching is near-random, the group is large, people best-respond to what they last saw and there is no channel for commitment THEN plan for risk dominance: cap the group whose minimum matters at a handful, or change the aggregation rule from minimum to median or average. Nest the sixteen: four area leads sign the release; the other twelve sign to their lead asynchronously during the candidate week, so the release-critical minimum is over four (`06`, cap the group; `09`, nesting) [E for the group-size effect; H for this structure]. For low-risk components, silence by the deadline is consent, so a late owner delays only their own component [E for the lever in the model; V that shipping without the slowest signature is acceptable, the VP dissenting]. Then the cheap levers: re-review scoped to the diff since signing, so an early signature is never wasted [H]; Yara names the target, \"two days\" (`06`) [E in the lab].\n\nTo Yara: the bonus sweetens the joint payoff, the weakest lever, and pays for a measurable outcome while displacing careful review (t12, `04`) [E as theory]. To the VP: escalation makes late signatures a manager's problem and removes owners' repeated dealings with each other; it is enforcement for a trust problem. Balancing measure: the four leads are now a weak-link group of four; keep them stable and give them the board.\n\nSwitch signal: if median sign-off keeps rising toward the minimum with four leads, more components move to consent; if it falls and holds, ask whether any early signature was re-done, the lone-cooperator cost measured directly. Register entry [H]: \"median candidate-to-ship under two days for three consecutive releases with four release-critical signatures.\"","novice_error":"Pay a bonus and name a hero, because the release is late and money is the obvious accelerator. The bonus touches the payoff nobody was short of (joint success) and ignores the one that decides the game (the cost of signing early), and the award turns sixteen colleagues into competitors. The mirror is the VP's deadline, which punishes the slowest signer and removes the peer accountability that could have held the group.","sources":["06-behavioral-game-theory","04-games-of-strategy","09-governing-the-commons"]},{"id":"k16","title":"The quarterly rotation to spread the culture","scenario":"At Marrow, one team of six, Atlas, runs blameless incident reviews: a write-up within 24 hours of every incident, no names, a public list of fixes, read by the whole team. The other five teams, 34 engineers, do not; their incidents are discussed in private and rarely written up. Atlas's practice is eight months old and its lead, Ben, says it took five months before the team stopped flinching at writing down their own mistakes.\n\nMei, the COO, has seen the difference in Atlas's incident recurrence and wants the culture everywhere. Her proposal, starting next quarter: rotate 25% of every team, chosen at random, to another team every quarter, for a year. \"Mix the people and the culture spreads.\" Ben's objection is that Atlas would lose two of six each quarter and the practice would dilute before it spread. A second team lead adds that the last person who tried to introduce write-ups on his team stopped after two months because \"writing down your incident when nobody else does just makes you look bad.\"","tension":"t09","module":"m9","question":"Do you support the rotation? If not, how do you get blameless reviews into the other five teams over the year?","considerations":["What is the Atlas team, structurally, for an eight-month-old costly norm? What does random rotation do to the basin it sits in (t04)?","Is a blameless write-up a simple or a complex contagion? How many adopting neighbours does the lone adopter on another team have?","What does the file say about the speed of contagion under local imitation versus random mixing, and under which learning rule?","Which of t09's branches applies, and what is the difference between seeding a cohort and rotating individuals?","What has to be visible for success-biased copying to work?"],"model_answer":"Decision: no random rotation; seed the practice into one team at a time with a pair from Atlas, keep Atlas above four, and make the practice's payoff visible so it spreads by success, not headcount. Draw the game first: writing up your own incident is costly and pays only when others do it too; the second lead's story is the lone cooperator in a stag hunt. Atlas is a dense cluster in which every member has five adopting neighbours; a cluster with density above 1 − q protects a norm inside and blocks one from outside (`10`, ledger #3) [E, theorem]. Random rotation of 25% a quarter is the t04 mistake verbatim: assuming a small group has secured the good outcome for good, then rotating people randomly across teams, which hands the basin back to risk dominance.\n\nt09's first branch: IF the job is to hold a costly norm and spread it neighbour by neighbour THEN keep units small, dense and bounded, and when spreading to a resisting cluster build wide bridges or seed inside it. A blameless write-up is a complex contagion needing several adopting neighbours; one rotated engineer on a team of seven has zero (ledger #34) [E for the direction]. So: two Atlas engineers move together into one target team for two quarters, run its incident reviews jointly, and return; Atlas stays at four (`07`) [H]. Check the learning rule: local structure spreads cooperation only under success-copying (ledger #3, #36), so publish Atlas's recurrence numbers and follow the target team's first write-up with a visible fix within the week (`02`) [E for the mechanism; H for the effect size].\n\nTo Mei: mixing people spreads information, not a habit that punishes the first adopter. To Ben: four is the floor, and two people gone for two quarters is the price of spreading it at all [V, that spreading the practice is worth Atlas's throughput, Ben dissenting]. Balancing measure: rotate a demonstrator in from the converted team afterwards so Atlas does not become a silo [H].\n\nSwitch signal: toward closure if the seeded pair's write-ups stop because nobody around them follows; toward bridges if Atlas's practice stalls in isolation or another team invents a worse version. Register entry [H]: \"the first seeded team produces write-ups within 24 hours for at least three of four incidents in its second quarter; recurrence falls.\"","novice_error":"Rotate people, because culture \"lives in people\" and a quarter of every team moving looks like decisive spreading. It dissolves the only cluster where the norm is dense and drops single adopters into teams where writing up your incident makes you look bad. The mirror is Ben's, unmodified: keep Atlas intact and wait for the others to notice, which they will not, because a costly norm does not jump on its own.","sources":["07-stag-hunt","10-networks-crowds-markets","01-secret-of-our-success"]},{"id":"k17","title":"A pledge round before the allocation","scenario":"Eleven research groups share a quarterly allocation of GPU hours on a consortium cluster. Each group submits a request; the facilitator, Rosa, scales all requests down to fit. Every group knows that a group which overstates its need gets more after scaling, and last quarter total requests were about three times the cluster's capacity. Two groups then left a large share of their allocation unused.\n\nRosa's plan for the next allocation meeting in three weeks: open with a round in which each group's lead says aloud what they will request and commits, in front of the other ten, to requesting only what they will use. \"Once people say it to each other's faces, they keep to it.\" Diego, who leads the group that underused most last quarter, is blunt: \"Pledges are cheap talk. Everyone will nod and then pad their number. What we need is an audit and penalties.\" A third lead thinks both are overkill and the scaling formula just needs tweaking.","tension":"t07","module":"m6","question":"Do you keep Rosa's pledge round? What has to sit beside it for it to survive past one quarter?","considerations":["Does a group gain by padding when the other ten are honest? What game is that, and what does the diagnostic in t07 say to do about talk?","What did the lab find about relevant discussion before a dilemma, and what does the ledger say happens after it where defection pays?","In Bicchieri's account, what does a face-to-face pledge round create inside each lead, and why does that matter for a prisoner's dilemma?","What counts as fast detection here, and what is the cheapest graduated sanction the data already supports?","What does Diego's audit-and-penalty plan risk if it arrives without the talk?"],"model_answer":"Decision: keep the pledge round, and pair it with by-product monitoring and an automatic graduated sanction, because the game is a prisoner's dilemma and talk alone will decay. Draw the game with t07's diagnostic: does a group gain by overstating when the other ten request honestly? Yes, it takes a larger share after scaling. So this is a prisoner's dilemma, and the second branch applies: IF a member does gain THEN still hold relevant talk before the mixed-motive decision and extract explicit promises, but pair it with what stops decay: repetition with fast detection, graduated sanctions, or a payoff change [E for the diagnostic].\n\nRosa is right about the first quarter: relevant face-to-face discussion is the strongest single lever on dilemma cooperation in the lab, roughly doubling it in an eight-person dilemma (Dawes, McTavish and Shaklee 1977, background; Sally 1995 and Balliet 2010 behind it) [E in the lab], because a public promise creates empirical and normative expectations that turn the dilemma toward coordination for human subjects (`08`) [E for the lab effect; H for persistence here]. Diego is right about the third quarter: where defection dominates, cheap talk decays without sanctions or repetition (ledger #12) [E]. So beside the round: Rosa publishes each group's requested hours against hours used, monitoring as a by-product of use, not an audit (`09`) [E for the principle in bounded commons; H for transfer]; unused allocation reduces next quarter's request ceiling by the unused amount, by formula, so nobody has to be the punisher (`09`) [E]; a cheap dispute channel for cancelled projects [E for dispute forums].\n\nTo Diego: penalties without the talk land on groups merely uncertain how much to ask, lowering expectations and manufacturing the padding they fear. Balancing measure: the sanction is a ceiling, not a fine, and the round repeats every quarter, because repetition keeps the promise alive [V, that assurance should lead and enforcement follow, Diego dissenting].\n\nSwitch signal: measure requests-to-capacity at the meeting and two quarters on. If the ratio falls and drifts back up with pledge-keepers ending up with less than padders, decay is the dilemma's signature and the ceiling tightens; if padding comes in waves after a group is seen to underuse, it is doubt, and the fix is more visible usage data. Register entry [H]: \"total requests below 1.5 times capacity within two quarters of pledge round plus published usage; unused share below 10%.\"","novice_error":"Choose between Rosa and Diego, because the meeting frames it as talk versus teeth. Talk alone is a first-quarter fix for a game where padding pays; penalties alone signal distrust to groups that would have kept a promise. The mirror is the third lead's: adjust the formula and treat padding as an arithmetic problem, leaving the dilemma untouched.","sources":["07-stag-hunt","08-grammar-of-society","06-behavioral-game-theory","09-governing-the-commons"]},{"id":"k18","title":"Weekend messages nobody likes","scenario":"Lantern is a 90-person remote company. Weekend Slack messages are routine: an anonymous survey run by the people team found that 78% of respondents dislike sending them and 85% believe most colleagues expect a reply within a few hours. Tomas, the CEO, sends several every weekend, usually prefixed \"no rush.\" Two managers have told their teams privately to ignore weekend messages, and both teams still reply.\n\nThe people team has drafted a \"right to disconnect\" policy for the handbook, to be announced at the next all-hands in two weeks. Sofia, a team lead, says the policy is beside the point: \"This is a values problem. Run a workshop on boundaries and let people commit to them.\" A third view, from an engineer: \"Nobody wants this, everybody does it, and it will stop the day Tomas stops.\" The people team's own count shows weekend traffic is highest in the two teams whose managers told them to ignore it, because their managers keep replying to Tomas.","tension":"t05","module":"m7","question":"What do you do at the all-hands, and what happens to the policy and the workshop?","considerations":["Classify the norm with Bicchieri's taxonomy: what sustains weekend replying, empirical expectations, normative expectations or both? What does the survey show about the normative ones?","What is the gap between private attitudes and perceived norms called, and what collapses it?","Is this a moral norm that a values workshop could address, or a social norm? What does t05 say to assume until proven otherwise?","Who is the credible source in this reference network, and what is Tomas's \"no rush\" doing in Henrich's terms?","What convention (a self-enforcing default) could replace the norm?"],"model_answer":"Decision: make the attitude gap common knowledge at the all-hands through the one credible source, Tomas, backed by a visible change in his own behaviour and a scheduled-send default; shelve the workshop and shrink the policy to a one-line convention. Draw the situation with Bicchieri's taxonomy (ledger #11): weekend replying is a social norm held up by empirical expectations (everyone sees the messages) and by normative expectations the survey shows are false: 85% believe others expect a reply, 78% dislike sending. That is pluralistic ignorance (`08`, `03`) [E for the phenomenon].\n\nt05's rule: IF you are diagnosing a norm THEN assume it is conditional until it survives a collapse of expectations, and never run values workshops for a norm not first diagnosed as moral rather than social (ledger #10). This norm is social: nobody holds weekend replying as a value; they hold a belief about others. So Sofia's workshop is aimed at the wrong bin, and the policy is a memo (t01). Tomas publishes the two survey numbers and says he was wrong, the gap made common knowledge by a credible source [E for the diagnosis; H for the intervention]. Then a costly display: he stops sending weekend messages and says so, because \"no rush\" from the CEO is a credibility-enhancing display pointing the wrong way; the message beats the prefix (`01`) [E for the mechanism]. Then a convention needing no heroism: scheduled-send as the default outside working hours, so the cue that fires the script disappears (`08`) [H, the cue-to-norm mapping must be tested locally].\n\nTo Sofia: a workshop produces commitments about a norm people already privately reject; what they lack is a belief about the other 89. That the company owes people their weekends is a value [V, Sofia dissenting only on the means]. Balancing measure, from t10: publish the attitude (\"most of us would rather not\"), pair it with approval, and never publish \"most of us send weekend messages\" [E for the pairing rule].\n\nSwitch signal: toward norms, confirmed, if weekend traffic tracks what people believe others do and falls within weeks; toward preferences if it persists in a team whose members can state the numbers and whose lead sends nothing, and the lever moves to hours. Register entry [H]: \"weekend messages fall by more than half within six weeks of the announcement and Tomas's stop; the four-question survey shows perceived expectation aligned with private attitude.\"","novice_error":"Announce the policy and run the workshop, because a handbook clause and a values session are what companies do about culture. Both leave the belief about the other 89 exactly where it was, and the CEO's weekend messages will refute the clause by Saturday. The mirror is to publish the raw behaviour count as a wake-up call, which tells everyone the norm is universal.","sources":["08-grammar-of-society","03-social-psychology","01-secret-of-our-success"]},{"id":"k19","title":"CI quotas with automatic lockout","scenario":"Fourteen teams share one continuous-integration cluster at Tessellate. Two teams, Search and Mobile, have started running very large test matrices on every commit; median queue time for everyone else has gone from four minutes to forty. Ingrid, who leads the platform team that owns the cluster, has written the fix: a per-team quota of compute minutes per day, with automatic lockout for the rest of the day when a team exceeds it. It ships in two weeks. There has been no consultation; \"we own the cluster, and consultation is how nothing ships.\"\n\nThree team leads have objected in a thread. One says the quota will lock out a team mid-incident. Another says teams will simply stand up their own runners and stop using the shared cluster at all. Search's lead says he had no idea his matrix was the cause, because nobody can see per-team usage. Ingrid's manager wants the queue fixed before the quarterly review in six weeks.","tension":"t06","module":"m8","question":"Does the quota ship as designed? What do you change about who writes the rule and what the cluster shows?","considerations":["What kind of resource is a CI cluster (subtractable, costly to exclude from)? Does a team gain by running a big matrix when others restrain themselves?","Can the fourteen teams currently observe each other's use? Which of Ostrom's channels does the course say to fix first?","What does t06 predict for a rule designed by the platform team and enforced automatically, and what is the exit option?","What is a graduated ladder for a compute overrun, and what is a nuclear first strike?","What role does the platform team keep under Ostrom's principle 7?"],"model_answer":"Decision: the platform team designs the structure and ships the visibility this week; the fourteen leads write the operational quota rule within three weeks; automatic lockout becomes a graduated ladder. Draw the game first: a CI cluster is a common-pool resource, subtractable and costly to exclude from, and a team gains by running a large matrix while others restrain, so at the margin this is a real prisoner's dilemma, (ledger #13) [E]. Search's lead did not know he was the cause because nobody can see per-team usage: the observation channel is broken, and Ostrom's file says fix that before treating anything as free-riding [E].\n\nt06's rule: IF the group is large or the problem is an externality members cannot see THEN design the structure (boundaries, by-product monitoring, a graduated ladder, a cheap dispute forum), but hand operational rules to members within weeks. Ingrid's lockout skips to external authorship, whose prediction is compliance only while enforced (Cardenas, background) plus exit, teams stand up their own runners [E for the crowding-out pattern; H here]. In order: this week, a per-team usage dashboard on the cluster's front page, monitoring as a by-product of use (`09`) [E for the principle in bounded cases; H for transfer, scope flagged]. Then the ladder: warning at 80% of share, deprioritized queue above 100%, throttling only for repeated overruns, never a same-day lockout, the nuclear first strike that hits a team mid-incident [E for graduated sanctions in durable cases]. Then authorship: the leads set shares against capacity, with the platform team as backstop and data source; its ownership is what makes the leads' rule legitimate (principle 7) [E for the principle; V that the pen belongs to those bound by the rule, Ingrid dissenting].\n\nTo Ingrid: consultation on a voluntary practice is how nothing ships; consultation on the rule that fixes a dilemma is welcomed by people who would not have complied voluntarily (`05`) [H]. Balancing measure: the leads have three weeks; if they cannot agree, the platform team's draft ladder applies as the default.\n\nSwitch signal: toward design if the fourteen cannot agree by the date; toward self-governance if teams comply only under throttling or appeal every sanction upward. Register entry [H]: \"median queue time under ten minutes within six weeks, with the quota rule authored by the leads and no team leaving the shared cluster.\"","novice_error":"Ship the lockout, because the platform team owns the cluster, the fix is technically simple, and the review is in six weeks. It fixes the queue for as long as the lockout is enforced and pushes the biggest users off the cluster entirely. The mirror is to hand the whole thing to a fourteen-lead working group with no structure, no data and no default, and watch the queue stay at forty minutes while they meet.","sources":["09-governing-the-commons","04-games-of-strategy","10-networks-crowds-markets"]},{"id":"k20","title":"Staff-only moderation and the appeals queue","scenario":"Quill is a question-and-answer platform with about 60,000 registered users and four staff moderators who handle every report, from duplicate questions to harassment. Bans are issued by whichever staff member picks up the report; the community has documented cases where near-identical behaviour got a warning from one moderator and a permanent ban from another. Appeals have tripled in a year, the moderation backlog is eleven days, and a group of 40 long-standing users has petitioned for elected community moderators.\n\nLeo, Head of Trust and Safety, has to present a plan to the board in six weeks. His position: \"We cannot hand enforcement to users. It's a legal exposure, and volunteers will play favourites.\" His plan is two more staff moderators and a longer written policy. The petitioners' lead, Marguerite, says the community already runs an unofficial flagging network in a chat group that catches most spam before staff do, and that staff bans are the only thing on the platform nobody understands.","tension":"t06","module":"m8","question":"What do you propose to the board, and what do the four staff moderators do afterward?","considerations":["Which enforcement decisions on Quill are operational (duplicates, tagging, spam) and which carry the legal exposure Leo names? Must they have the same author?","What does Ostrom's principle 7 say about the surrounding authority's role, and what does nesting look like on a platform?","Why are inconsistent sanctions worse than lenient ones (`06`, intention versus outcome)?","What does the unofficial flagging network tell you about where by-product monitoring already exists?","What does the ledger say about the transfer of Ostrom's principles to digital commons?"],"model_answer":"Decision: propose a nested moderation system to the board: community moderators author and apply the operational tier, staff keep the flagrant and legal tier as recognised backstop, and both work from a published ladder and log. Draw the situation first: a platform of 60,000 is not one group, and four staff cannot observe it; the community's unofficial flagging network is where by-product monitoring already exists (`09`) [E for the principle; H for transfer to a digital commons, flagged per ledger #29]. The inconsistency is the acute damage: people punish intended unfairness far more than unlucky outcomes (`06`) [E in the lab], which is why appeals have tripled.\n\nt06's rule: IF the group already communicates, observes itself and can change its rules THEN fix those channels first, then let members craft operational rules against the eight principles, with external authority as recognition, backstop and data; IF an external authority insists on writing the rules THEN expect compliance only while enforced. Leo's plan is the platform default, a rulebook written centrally and treated as someone else's law [E for the pattern; H here]. Tier by exposure. Tier one, operational: elected community moderators, a published graduated ladder (note, short restriction, longer restriction), a public sanctions log [E for graduated sanctions, supported in the 91-study review (Cox et al. 2010, verified); H for a platform]. Tier two, flagrant and legal: staff only, fast track, same log. Appeals go first to a peer panel of three community moderators [E for dispute forums]. Principle 7 is the board's job: an explicit statement that the community may govern tier one, so its sanctions cannot be appealed over its head [E for the principle; V that polycentric arrangements beat one decision centre, Leo dissenting].\n\nTo Leo: tiering answers the legal point; the ladder and log answer favouritism, since a published first step is harder to bend than a discretionary ban. Balancing measure: the community tier needs a written boundary (who may vote, serve, for how long) naming whom it excludes and why [V], and a dated first revision.\n\nSwitch signal: toward design if elected moderators cannot agree a ladder within a quarter; toward more self-governance if tier-one sanctions are still appealed upward or staff keep overriding the panel. Register entry [H]: \"appeals per hundred sanctions halve and backlog falls under three days within two quarters, with no rise in tier-two incidents.\"","novice_error":"Hire two more staff and lengthen the policy, because moderation is a liability and the board wants control. Six staff cannot observe 60,000 users any better than four, and the longer policy makes inconsistency more visible, not rarer. The mirror is to hand everything, harassment included, to elected volunteers with no recognition from the platform, so the first serious case is appealed to a legal team that never agreed to the arrangement.","sources":["09-governing-the-commons","04-games-of-strategy","06-behavioral-game-theory"]},{"id":"k21","title":"The documentation norm that never crossed the liaison","scenario":"Two departments at Halyard share a data warehouse. Data Engineering, 30 people, adopted a norm a year ago: every dataset has a named owner and a README, and a pull request that adds a dataset without them is not merged. Adoption inside Data is complete. Product Analytics, 45 people, creates about half of the new datasets and has adopted none of it: zero owners, zero READMEs, after twelve months in which Omar, the one analyst who sits with Data Engineering, has presented the norm at three Product all-hands and posted the template four times.\n\nElif, Head of Data, wants the CTO to mandate the norm company-wide with a merge check. Omar says he is tired of being \"the docs guy\" and that his colleagues agree with him in the meeting and do nothing after. Product Analytics' lead, Chen, points out that his analysts review each other's work, almost never Data's, and that an analyst who writes a README is the only one on her squad who does, \"and it's not obvious what she gets for it.\"","tension":"t09","module":"m9","question":"Why has a norm that is universal on one side of Omar not crossed to the other, and what do you do instead of the mandate?","considerations":["What is Omar, in network terms? What crosses a single bridge and what does not (ledger #34)?","What does the analyst who writes a README get, and how many of her review neighbours also do? What is q for her?","Which of `10`'s levers lower q, seed inside a cluster and widen a bridge, and what does each look like here?","What does the ledger say about clusters blocking a norm from outside while protecting one inside?","What does t13 say about running an expectations campaign across clusters that cannot see each other?"],"model_answer":"Decision: stop evangelising through Omar, build three parallel ties between the departments, seed inside the most cohesive analytics squad, and lower the cost of the norm; hold the mandate in reserve. Draw the situation first: two dense clusters, one bridge. Owners and READMEs are a costly behaviour whose value depends on neighbours doing it too, so it is a complex contagion: information crosses one weak tie, costly behaviour needs several adopting neighbours and wide bridges (ledger #34) [E for the direction]. The analyst who writes a README has zero adopting neighbours among those who review her, so she sits below q = b/(a+b) and is the lone cooperator (`10`, theorem; t04) [E for the theorem; H for the value of q].\n\nt09's first branch applies: IF the job is to hold a costly norm and spread it to a resisting cluster THEN build wide bridges or seed inside it. Lower q: a README template the tooling generates from the schema and an owner field filled by default, so one adopting neighbour tips a node (`10`) [E for the lever in the model; H for its size]. Seed inside: the analytics squad with the most joins to Data's tables co-owns three shared datasets with two Data engineers, who become its review neighbours [E for the mechanism; H for the choice of squad]. Widen the bridge: joint review of cross-department datasets, three parallel ties where there was one [E for bridges being weak and decaying unattended].\n\nTo Elif: a merge check written by Data and applied to Product produces the thinnest README that passes, complied with while checked (t06) [E for the pattern]; keep it as the dated fallback. To Omar: three all-hands were an expectations campaign across clusters that cannot see each other, which t13 says never to run [E]. Balancing measure: cap seeding at one squad per quarter so Data's own cluster keeps its density [V, that cross-department flow is worth some of Data's review budget, Elif dissenting].\n\nSwitch signal: toward structure, confirmed, if adoption in the seeded squad rises once two neighbours adopt; toward expectations if, with tooling and neighbours in place, analysts can state the norm and still believe nobody in Product expects it. Register entry [H]: \"the seeded squad reaches owner-and-README on at least three of four new datasets within one quarter; a second squad follows within two, without a merge check.\"","novice_error":"Escalate to a mandate, because a year of evangelism has failed and a merge check reaches all 45 analysts on Monday. It reaches them as a rule from another department and gets the minimum document that passes. The mirror is to send Omar to a fourth all-hands with a better slide, which is the same single tie carrying the same information to a cluster that has heard it.","sources":["10-networks-crowds-markets","07-stag-hunt","08-grammar-of-society"]},{"id":"k22","title":"Show of hands after the two most senior said yes","scenario":"The architecture guild at Sorrel, twenty engineers, decides on cross-cutting technical changes. Last month it voted on migrating the message queue to a new system. The two most senior members spoke first, both in favour, at some length. The chair then called a show of hands: 18 in favour, 2 against. Three weeks later, a junior member tells Priyanka, the guild chair, that \"at least half the room had doubts\" and that the two who voted against have been treated coolly since. Two teams have quietly deferred their part of the migration.\n\nPriyanka's plan for the next guild meeting in two weeks: re-run the vote after a reminder about the guild's value of candour, and ask the two seniors to say explicitly that dissent is welcome. \"If people know it's safe to disagree, they will.\" A senior member thinks the vote should stand: \"18-2 is a mandate; doubts after the fact are just cold feet.\" The migration's first milestone is due in six weeks.","tension":"t13","module":"m7","question":"Do you re-run the vote, and how? Is the problem what people expected of each other, or the way the decision was structured?","considerations":["What is a decision in which people signal publicly in sequence after two confident signals? Which kind of copying is this (ledger #19), and what is its fix?","In the urn model, how often does a cascade go wrong with fairly accurate signals, and what does that say about 18-2?","Which of t13's branches applies: is this one reference network with an attitude-expectation gap, or a structural problem in who sees what signal first?","What do `03` and `10` prescribe for sequential public decisions, and what does a \"candour\" reminder change about the sequence?","How would you find out whether the 18 believed the migration was right or believed the seniors did?"],"model_answer":"Decision: re-run the decision, not the vote: collect private written positions before any discussion, reveal them together, have the seniors speak last, and drop the candour reminder. Draw the situation first: twenty people signalling in public, in sequence, after two long confident signals from the most senior. That is an informational cascade (ledger #19, the copying kind whose fix is to collect private signals first): once two people you respect have said yes, following is individually reasonable whatever your own signal, and the show of hands records the cascade, not the room. The urn model puts the chance of a wrong cascade at about 1/5 with signals 2/3 accurate (`10` ch 16, a computation, illustrative) [E for the mechanism; the figure is a model].\n\nt13's rule sorts the fix. The failure is not an attitude-expectation gap a credible publication would close; it is the order in which private signals became public. So the structure branch applies: IF the outcome is decided by who sees the signal first THEN change the structure and let expectations follow; for any sequential public decision, collect private judgments first, reveal them simultaneously, reverse speaking order (`10`, `03`) [E]. Priyanka's candour reminder is an expectations intervention aimed at a structural cause: it invites dissent and then runs the same sequence, seniors first. Concretely: written positions and main risk submitted beforehand; the distribution published before anyone speaks; discussion opens with the risks; an assigned credible dissenter; seniors last; the decision re-taken on the same basis (`03`) [E for each mechanism; H for the package].\n\nTo the senior member: if the private-first count comes back 18-2, the room did agree and the migration proceeds with the deferring teams told the count [V, that a decision reached by independent signals is worth two weeks against a milestone, which he disputes]. Balancing measure: `11` adds that persistent disagreement between the deferring teams and the guild on the same data indicates different priors, aligned by shared definitions, not re-voting [H].\n\nSwitch signal: toward structure, confirmed, if the private-first count differs materially from 18-2; toward expectations if it matches and the deferring teams still doubt the room, and the lever becomes publishing it credibly. Register entry [H]: \"private-first positions are collected before every guild decision; on this migration, the private count is published and at least one deferring team recommits or the decision is revised.\"","novice_error":"Re-run the show of hands after a speech about candour, because the problem looks like courage and a leader can ask for courage. The sequence that produced the cascade is untouched, and the two seniors still speak first. The mirror is to let 18-2 stand as a mandate and push the milestone, then discover at week six that half the room built the migration they did not believe in.","sources":["10-networks-crowds-markets","03-social-psychology","11-bounds-of-reason"]},{"id":"k23","title":"Two squads, same dashboard, opposite conclusions","scenario":"At Cinder, the Growth squad and the Retention squad read the same weekly product dashboard every Monday and, for three months, have reached opposite conclusions. Growth: activation is fine, push acquisition. Retention: activation is broken, pause acquisition. Both cite the same activation chart. Each squad has its own definition of \"activated\" in its own notebooks, and each believes the other's is wrong. The argument has consumed part of every planning meeting, and the quarterly plan is due in four weeks.\n\nChen, VP of Data, proposes two more dashboards and a \"source of truth\" document listing every metric. \"More data will settle it.\" Growth's lead says the squads should just each pursue their own conclusion. Retention's lead wants an executive to rule. A data scientist points out that the two squads have never sat in the same room to agree what \"activated\" means, and that each squad's definition makes its own conclusion follow.","tension":"t03","module":"m10","question":"Is this a disagreement more data can settle? What do you put in place before the quarterly plan?","considerations":["Two groups reading the same data and reaching opposite conclusions every week: in Gintis's terms, what differs between them? What does he say fixes it?","Is the current Monday argument a stable pattern (a stability test)? What does anyone gain by conceding?","What is the public signal that would tell both squads which equilibrium is in play, and who authors it?","What does t03 say to do when the signal exists and compliance is still low?","Which of the three proposals (more dashboards, go separate ways, executive ruling) is a choreographer, and which is a poster?"],"model_answer":"Decision: name the signal, not the data: one definition of \"activated,\" one owner, and a written decision rule that both squads accept before the plan, authored jointly in a room. Draw the situation first and check stability: the Monday argument is stable because nobody gains by conceding; each squad's definition makes its conclusion follow, so this is two equilibria with no shared cue. Gintis's diagnosis (`11`) fits: persistent disagreement across sub-teams on the same data indicates different priors, fixed by cultural alignment (shared definitions, training, narrative), not more data [H, from the common-priors model].\n\nt03's rule: IF the pattern passes the stability test but the group is not there THEN stop reasoning people toward it and name the signal: a public cue that tells each person which equilibrium is in play; ambiguity, not incentives, is the usual failure. This is the choreographer idea: a public signal aligns conjectures where rationality alone cannot (ledger #31, framework, never \"the unification\") [E for the formal relation; H that this layer is what bites here]. Concretely: the two leads and the data scientist define \"activated\" once, give it one owner, and pair it with a decision rule (\"if seven-day activation is below X, acquisition spend is capped until it recovers\") that both squads sign before they know this week's number (`05`) [E for the mechanism; H for the threshold]. Then Bicchieri's layer: IF the signal exists and compliance is still low THEN measure the expectations; ask each squad what it thinks the other will do when the rule bites, because a choreographer nobody believes is a poster (`08`) [E for expectations as the mechanism].\n\nTo Retention: an executive ruling is a signal imposed from outside both reference networks, followed while watched (t06) [E for the pattern; H here]. Balancing measure: the definition is dated and revisable by the two squads together, not by Data alone [V, Chen dissenting because he holds that Data should own metrics].\n\nSwitch signal (t11): toward beliefs, confirmed, if the squads converge within weeks of the shared definition under unchanged incentives; toward preferences or constraints if they still diverge with one definition, which means the goals genuinely conflict and the fix is the budget rule, not the metric. Register entry [H]: \"one activation definition, one owner and a signed decision rule before the quarterly plan; planning meetings stop re-litigating activation within two cycles.\"","novice_error":"Build more dashboards, because the argument is about a chart and charts are what the data team makes. Both squads will read the new charts through the definitions that produced the disagreement. The mirror is to ask an executive to pick a winner, which ends the meeting and leaves two definitions alive in two sets of notebooks.","sources":["11-bounds-of-reason","08-grammar-of-society","04-games-of-strategy"]},{"id":"k24","title":"Nobody owns core-lib","scenario":"`core-lib` is a shared library used by eight teams at Wren. The team that wrote it was dissolved eighteen months ago, and since then it has no owner. Pull requests to it either sit unreviewed for weeks or become fights: two teams, Payments and Catalog, each behave as if they own it, revert each other's changes, and in the last quarter three production incidents traced to conflicting changes merged the same week. Six other teams contribute occasionally and avoid the fights. There is no CODEOWNERS file, no release process, and no forum where a disputed change is decided.\n\nMara, the CTO, has been asked to assign an owner and has declined twice: \"Ownership should emerge from whoever cares most. If I assign it, the other team stops contributing.\" Payments' lead wants ownership because they make the most changes. Catalog's lead says Payments would break Catalog's use cases within a month. The next incident review is in three weeks, and the platform director wants a decision before it.","tension":"t03","module":"m11","question":"Run the full diagnostic path. What is the game, which equilibrium is missing, what structure holds it, and what accountability does it need? What do you tell Mara?","considerations":["Two teams contesting a resource, each escalating: what game is that, and what is the evolutionarily stable convention for it (`11`)?","What does Ostrom's first principle say about ambiguous membership and resource boundaries, and what does the course say it is the commonest cause of?","What is the public signal here (t03), and does it matter whether the assignment is \"fair\" or merely salient (ledger #32)?","Who should hold the pen on core-lib's operational rules once an owner exists (t06), and at what unit size (t14)?","Why does \"let it emerge\" not work for a convention among eight teams (`07`)?"],"model_answer":"Decision: assign an owner now by a public, impartial rule, and surround it with a small council, a cheap dispute forum and by-product monitoring; tell Mara emergence has had eighteen months. First, the game: Payments and Catalog are in a Hawk-Dove contest; the evolutionarily stable resolution is a bourgeois convention, \"owner wins,\" which needs ownership to be salient, not fair (`11`, ledger #32) [E as a model; H for organizations]. Ambiguous membership violates Ostrom's first principle, the commonest structural cause of decay (`09`) [E].\n\nSecond, the signal, t03's rule: IF the pattern passes the stability test but the group is not there THEN name the signal, a public cue that tells each person which equilibrium is in play, because ambiguity, not incentives, is the failure. The signal is a CODEOWNERS file and a written rule for who decides a disputed change; assign clear owners even when the assignment is somewhat arbitrary (`11`) [E for the bourgeois-strategy results; H here]. Make the rule procedurally impartial so it reads as a rule, not an intention (`06`): the team with the most merged changes over the past year owns it, reviewed annually, Payments now [E for intention-sensitivity; V that a salient owner by rule beats a contested \"fair\" outcome, Mara dissenting]. Third, the structure (t06, t14): the owner holds the pen on operational rules, but a council of one representative per consuming team, eight people, meets monthly, the unit size at which repeated dealings work [E for nesting in Ostrom's cases; H for transfer to code], and a council-written compatibility rule as the cheap local dispute forum [E for the principle]. Fourth, accountability (t12): a reviewer of record on every merge and a public note plus revert as the graduated first sanction [E; H for this design].\n\nTo Mara: emergent conventions among eight teams are arbitrary and may fork (`07`), and this one forked into two [H]. Balancing measure: a dated revision of ownership in a year and a stated exit for consumers, because a boundary that gives one team the pen excludes seven [V].\n\nSwitch signal: if Payments and Catalog still revert each other with file and rule in place, the signal is not believed, so measure expectations before changing anything else. Register entry [H]: \"no cross-team revert on core-lib for two quarters after CODEOWNERS plus council; contributions from the six other teams do not fall.\"","novice_error":"Wait for ownership to emerge, because assigning it looks like taking sides and Mara's reasoning sounds principled. Eighteen months of emergence produced two claimants and three incidents; the convention that ends a Hawk-Dove fight is salience, and nobody can make themselves salient without a fight. The mirror is to hand core-lib to Payments outright, with no council, no compatibility rule and no forum, and lose seven contributing teams to the exact fear Catalog named.","sources":["11-bounds-of-reason","09-governing-the-commons","04-games-of-strategy","07-stag-hunt"]}],"tensions":[{"id":"t01","name":"Copying vs teaching","pole_a":"people adopt behaviour by copying models, not by understanding arguments; route norms through prestige, conformity and credibility-enhancing displays. Henrich (`01-secret-of-our-success`): evolved learning biases, prestige (Cheng et al. 2013, robust), conformist transmission, self-similarity and costly displays of belief. Over-imitation, replicated in many labs though mostly with one puzzle box, shows people copy opaque practice adaptively. The file's design line: treat \"we explained it\" as zero adoption.","pole_b":"copying is one general-purpose strategy among several, and skills with hidden causal structure need explicit teaching. Laland (`02-darwins-unfinished-symphony`): copying rules (copy when uncertain, copy the successful, copy the majority, discount stale information) are ecologically shaped strategies found even in sticklebacks; humans differ in fidelity, teaching and language. The tournament (Rendell et al. 2010, verified; 104 entries; the winner copied almost exclusively) shows copying pays because demonstrators pre-filter, but it was a simulation. The stone-tool experiment (Morgan et al. 2015, verified; N = 184) found imitation added little over reverse engineering while teaching and language produced the largest gains.","rule":"IF the target is a norm (its value depends on others doing it, or its payoff is diffuse) THEN put a prestigious, self-similar model visibly doing it and succeeding, make leaders' costly displays point the same way, and do not count a memo or training as adoption. IF the target is a skill with non-obvious causal structure THEN budget for explicit teaching of reasons and put expiry dates on the playbooks. IF the group is young with little accumulated practice THEN documentation is overhead; make the best behaviour visible first. Never collapse the two into \"explanation does not work\" or \"just document it\" (ledger #8).","switch_signal":"Toward teaching: people reproduce the surface of a practice while the outcome it exists for does not move, or it breaks when conditions change. Toward modelling: the practice is documented, everyone can state the reason, and adoption is still confined to whoever wrote the document. Count separately how many can explain the practice and how many do it.","evidence":"The two agree on far more than they dispute: cumulative culture is the human distinction, copying is selective, and cooperation itself spreads as a copied behaviour. The ledger resolves X1 as mostly compatible: Henrich's biases are the levers, Laland's tournament the reason copying pays (ledger #8, #39). The narrow disagreement, X13, is about what is transmitted, and once that is read properly this is mostly a false tension. Norm adherence spreads through visible models, prestige and expectations, and explanation is a weak channel for it: Henrich is right. Skill with hidden causal structure needs explicit teaching: Laland is right, on one modest study of modern adults plus his lab's fidelity models. Neither ran a horse race against the other; over-imitation's developmental universality is unclear (Aka children emulated, Berl and Hewlett 2015); and \"copying wins\" must be paired with \"pay someone to innovate\" (ledger #39). [E for both mechanisms in their scope; H for the weight of any bias in your group; V for preferring prestige to dominance as the channel.]","sources":["01-secret-of-our-success","02-darwins-unfinished-symphony"]},{"id":"t02","name":"Strong reciprocity as a trait vs conditional behaviour","pole_a":"humans have an evolved disposition to cooperate conditionally and punish defectors at personal cost, even one-shot; design can rely on it. Gintis (`11-bounds-of-reason`, with Bowles, Boyd and Fehr): strong reciprocity evolved by gene-culture coevolution and group selection. Henrich (`01`) supplies norm psychology and costly third-party punishment. Camerer (`06-behavioral-game-theory`) supplies the lab: rejection of low ultimatum offers is among the best-replicated results in the field (mean offer about 40%, mode 40-50%, Oosterbeek et al. 2004, verified; about half of offers below 20% rejected, background), and people punish intended unfairness far more than unlucky outcomes (Blount 1995).","pole_b":"one-shot lab punishment reflects heuristics tuned for repeated play, and real-world sanctioning is mostly cheap; design on the cheap, graduated version. The critic's position, from Gintis's own evidence section. Binmore and Shaked (2010, background): the lab data fit misapplied repeated-play rules, and learning erodes cooperation. Guala (2012, background): field evidence for costly punishment is thin; sanctioning in the wild is gossip and ostracism. Camerer adds that rejections fall substantially at high stakes (Andersen et al. 2011, background) and positive reciprocity to a gift decayed within hours in the field (Gneezy and List 2006, verified). Ostrom (`09-governing-the-commons`): durable commons use graduated sanctions, small and quick and public first, applied by participants; supported in the 91-study review (Cox et al. 2010, verified).","rule":"IF you are budgeting enforcement THEN assume members sanction only when the channel is cheap, fast and proportionate (a quiet word, a public log, a known escalation ladder), and make monitoring a by-product of participation rather than a police function. IF the violation is an unfair intention rather than an unlucky outcome THEN expect costly retaliation and pre-empt it with procedurally impartial allocation (rules, rotation, lottery). IF stakes are high or the group is experienced THEN discount the lab punishment rate further and rely on reputation and repetition. Never build a design that only works if members reliably punish at personal cost without institutional support, and never let peer punishment run without a legitimate process, because antisocial punishment is real.","switch_signal":"Toward the trait pole: members pay observable costs to sanction with no expectation of future dealings, repeatedly, and the behaviour falls. Toward the conditional pole: violations accumulate with nobody acting, punishment goes underground into feuds, or sanctioning collapses when stakes rise or anonymity increases. Count violations observed against violations sanctioned, and by whom.","evidence":"Everyone agrees on the behaviour: people pay something to punish unfair intentions, public-goods contributions decay over rounds and recover with punishment, and pure self-interest is rejected as securely as anything in behavioural science. The narrow disagreement is origin and magnitude: an unconditional evolved trait, or a conditional disposition that shrinks with stakes, experience and anonymity? The ledger splits the claim (X4, ledger #4, #30): willingness to pay to punish unfair intentions in the lab is [E]; evolved strong reciprocity is [H] (the 11 file: contested, a weaker version is supported); real-world sanctioning is mostly cheap and graduated, [E]. The trait side's studies were run by the strong-reciprocity school itself (Fehr, Gächter, Henrich, Gintis); the field evidence is Ostrom's and the Cox review. Even robust lab effects are smaller than first reported: 61% of 18 top-journal experiments replicated at about two-thirds of original size (Camerer et al. 2016, verified). This is also the punishment-versus-reputation choice: the trait reading makes punishment the engine; the conditional reading makes observation, reputation and cheap disapproval the engine, with formal penalty as backstop. [E for lab punishment and cheap field sanctions; H for the evolved trait and how much costly punishment your members will do; V for constraining peer punishment with a legitimate process.]","sources":["01-secret-of-our-success","03-social-psychology","06-behavioral-game-theory","09-governing-the-commons","11-bounds-of-reason"]},{"id":"t03","name":"Rational equilibrium vs norm-choreographed order","pole_a":"a group settles where no one gains by deviating alone; model members as rational players, find the Nash equilibria, patch selection with focal points. Dixit, Skeath and McAdams (`04-games-of-strategy`): write the matrix, find the equilibria, use rollback and the folk theorem; where equilibria are multiple, add focal points or dynamics, a seam the book admits. Rationality is consistent pursuit of whatever the payoffs contain, fairness included (ledger #16). Skyrms (`07-stag-hunt`): basins and correlation select the pattern, with no beliefs at all.","pole_b":"Nash cannot be derived from rationality alone; groups reach order because a social signal aligns conjectures, and the signal must live inside the agents as expectations. Gintis (`11`) proves, via Aumann and Brandenburger, that common knowledge of rationality yields correlated equilibrium, not Nash; the correlating device is the norm, the choreographer. Bicchieri (`08-grammar-of-society`) specifies what must be true inside agents: a conditional preference keyed to empirical expectations (what others do) and normative expectations (what others think one should do). Camerer (`06`): first-contact play is norm-driven with one to two steps of reasoning (beauty-contest first-round average about 35-36, Nagel 1995, verified; mean thinking steps about 1.5, Camerer, Ho and Chong 2004, verified).","rule":"IF you are checking whether a proposed pattern can last THEN apply the stability test (does any member gain by deviating alone?) and treat failure as fatal however good the pattern is. IF the pattern passes but the group is not there THEN stop reasoning people toward it and name the signal: a public cue (rota, written rule, default, dashboard) that tells each person which equilibrium is in play; ambiguity, not incentives, is the usual failure. IF the signal exists and compliance is still low THEN measure the expectations; a choreographer nobody believes is a poster. Never present one layer as \"the\" theory of norms, and never contrast \"rational\" with \"fair\".","switch_signal":"Toward the rational pole: behaviour is stable across labels and framings and responds only to payoff changes; these are experienced players in a familiar game. Toward the norm pole: the same matrix produces different behaviour under different labels (a \"Community Game\" label roughly doubled prisoner's-dilemma cooperation against \"Wall Street Game\", Liberman, Samuels and Ross 2004, background) or under different observation; or a meeting derived the \"obviously rational\" plan and behaviour did not move.","evidence":"The course's central reconciliation, binding in the ledger (X5, #1): four layers, not four rivals. Nash or ESS is the stability test for any candidate pattern; Skyrms and Camerer predict which stable pattern is reached absent intervention (t04); Gintis names what a norm does (a public signal aligning conjectures, the theorem-backed part of his book); Bicchieri specifies and measures the expectations that make the signal bite. The real disagreement is narrower: whether an explicit choreographer is needed or history plus a focal point suffices (Schelling, `05`: focal points are choreographers without an author), and whether order arrives by learning (Camerer) or by norms (Gintis). The 11 file concedes the choreographer is weaker than Bicchieri on diagnosis, Ostrom on authorship and Skyrms on origins; Vanderschraaf's review notes the selection gap was moved up a level, not closed. The formal results are theorems; the claim that correlated equilibrium fits data better than Nash is not made by the book and must not be made here (ledger #31). Nash is a stability test, not a prediction or an endorsement (ledger #14). [E for the formal relations and norm-driven first-contact play; H for which layer bites in your group; V for preferring a designed choreographer to an emergent one.]","sources":["04-games-of-strategy","05-micromotives-and-macrobehavior","06-behavioral-game-theory","07-stag-hunt","08-grammar-of-society","11-bounds-of-reason"]},{"id":"t04","name":"Risk dominance vs payoff dominance","pole_a":"under uncertainty the safe equilibrium wins; expect the low-effort, low-trust outcome as the structural default. Skyrms (`07`): under replicator dynamics with random mixing the risk-dominant equilibrium wins because its basin is larger (the file's illustration: p* = 3/4 stag hunters needed with payoffs Stag/Stag 4, Stag/Hare 0, Hare 3). Under best-response updating local interaction accelerates risk dominance (Ellison 1993); with noise it is stochastically stable (Kandori, Mailath and Rob 1993; Young 1993). Camerer (`06`): without communication play converges to the risk-dominant or minimum-effort outcome (Cooper et al. 1990/92); weak-link groups of 14-16 fell to effort 1 within about ten rounds while fixed pairs reached 7 (Van Huyck, Battalio and Beil 1990; group-size result verified, round counts background).","pole_b":"the payoff-dominant outcome is reachable, because correlation (structure, talk, history, partner choice) expands the good basin. Skyrms Parts I-III: local interaction with imitate-the-best, cheap-talk handshakes and partner choice let stag hunting spread from small clusters (fairness contagion in tens of generations under local imitation against hundreds under random mixing, Alexander and Skyrms 1999, background). Camerer's post-2003 evidence: two-way talk, a leader naming the target, gradual growth from a small core with visible history (Weber 2006, verified, single-lab lineage) and a lower payoff to the safe action select the efficient equilibrium. Easley and Kleinberg (`10-networks-crowds-markets`): adoption spreads when a node's adopting-neighbour fraction exceeds q = b/(a+b) (theorem), so lowering q or seeding inside a cluster spreads costly behaviour.","rule":"IF matching is near-random, the group is large, people best-respond to what they last saw and there is no channel for talk or history THEN plan for risk dominance: cap the group whose minimum matters at a handful, or change the aggregation rule from minimum to median or average. IF you can create correlation THEN do the cheap things first, in order: lower the cost of being the lone cooperator, have a leader publicly name the target, take public opt-in pledges, grow from a small core with a visible success record, keep neighbourhoods small and stable while the norm is young. IF you rely on clusters THEN check the learning rule and make cooperators' success visible; if people copy the majority instead, clusters entrench the safe outcome. Never write \"the efficient equilibrium is the rational one\" or treat its absence as irrationality (ledger #2).","switch_signal":"Toward risk dominance (stop pushing, restructure): effort falls round on round toward the minimum in a group above roughly a dozen; those who tried first are visibly worse off than those who waited. Toward payoff dominance (the levers are working): a small core's success is visible and the adopting fraction among members' neighbours is rising past the point where switching pays. Watch the lone-cooperator payoff directly.","evidence":"The poles agree on the game: in a stag hunt payoffs already favour cooperation, so failure is strategic uncertainty plus history (ledger C37), and the default absent intervention is risk dominance. The real disagreement is whether the payoff-dominant outcome is a stable destination or a transient that noise erodes, and it hinges on the learning rule: Skyrms's optimism rests on imitation dynamics and transient analysis; the pessimistic theorems assume best response with noise (open, ledger section 6). The binding wording (ledger #2): risk dominance wins under random mixing, best-response updating, large groups and no communication; payoff dominance is reachable through correlation (small stable groups, success-visible imitation, public pledges, gradual growth, lower cost of being the lone cooperator). Sweetening the joint payoff is the weakest lever; lowering the lone-cooperator loss moves the watershed most (Stag/Hare from 0 to 2 moves p* from 3/4 to 1/2 in the illustration). Clustering is the same conditional in network form (X7, ledger #3): local structure helps only under success-copying, and a cluster of density above 1 − q blocks a norm entering from outside while protecting one adopted inside. Lab work is Cooper's, Van Huyck's and Weber's; models are Skyrms's, Ellison's, Young's and Kleinberg's. [E for models and lab; H for which regime your group is in and whether the good outcome is stable long-run.]","sources":["06-behavioral-game-theory","07-stag-hunt","10-networks-crowds-markets"]},{"id":"t05","name":"Stable social preferences vs cued norm compliance","pole_a":"fairness and reciprocity are stable preferences; put them in the payoffs and model members as types. Camerer (`06`) models social preferences as utility parameters (Fehr-Schmidt, Charness-Rabin, intention-based models); Dixit et al. (`04`) and Gintis (`11`, BPC) say \"put fairness in the payoffs\". The type summary (roughly 30% self-interested, about 50% conditional cooperators, a small tail of altruists, background; Bruhin, Fehr and Schunk 2019 put about 40% strongly other-regarding, background) is a design tool: let conditional cooperators see others cooperating. Henrich and Gintis add that norms are genuinely internalized.","pole_b":"fair behaviour is norm compliance activated by cues and expectations, not a taste of fixed size; every norm is conditional until proved otherwise. Bicchieri (`08`): fixed preferences cannot explain how fair behaviour varies with anonymity, entitlement, moral wiggle room (Dana, Weber and Kuang 2007) and information. Dictator giving (mean about 28%, about 64% give something, Engel 2011, verified) collapses under double-blind anonymity and shifts when a take option is added (List 2007; Bardsley 2008): the signature of a cued norm. Bicchieri and Xiao (2009, verified) found expectations of selfishness reduced giving even under pro-giving messages. Henrich's cross-cultural data (mean ultimatum offers about 26% to 58% across 15 societies, verified) show the disposition to have norms is universal but the content is not.","rule":"IF you are choosing a fairness baseline THEN elicit it from the group (what do most people here do; what do most think you should do), never a lab or 50-50 default (ledger #25). IF you want contribution to persist THEN design the cues and the observation: identifiability, visible consequences for others, no exits that let people dodge unseen. IF you want to know whether a norm can be leaned on THEN run the collapse test: tell a subgroup, truthfully, that compliance elsewhere has fallen, and watch whether they hold; design for the conditional case because it is cheaper to lose. Never state a member-type share as a fact about your group, and never run values workshops for a norm you have not first diagnosed as moral rather than social (ledger #10).","switch_signal":"Toward preferences: behaviour holds across anonymity, framing and reported changes in others' behaviour; the same people are generous in every context. Toward norms: contribution tracks what people believe others do more closely than what they say they value; anonymity or a new exit changes it; the elicitation shows an attitude-expectation gap.","evidence":"Broad agreement: people are neither selfish nor saintly, behaviour is heterogeneous, reciprocity and intention-sensitivity dominate over unconditional altruism (ledger C33). Two narrow disagreements. X8: are the parameters stable? Camerer's own verdict is that no social-preference model wins and parameters are unstable across games, which nearly concedes Bicchieri's point; the ledger rules (#9) that fairness is [E] as cue- and expectation-dependent behaviour with a distribution of sensitivities, and \"a taste for fairness of fixed size\" is not [E]. X9: is anything internalized? Bicchieri confines unconditional compliance to the moral-norm bin; Henrich and Gintis think the bin is large. The operational test all files accept (ledger #10): assume a norm is conditional until it survives a collapse of expectations. Caveats: Bicchieri's superiority over inequity aversion is argued from fit, not shown, and critics say a substantive fairness concept sneaks back in (ledger #38); her taxonomy is cleaner than her own field data. Camerer's corpus is student-lab and one-shot; Bicchieri's later field work is in sanitation programmes. [E for cue-dependence and type heterogeneity as qualitative facts; H for any parametric model and the internalized share; V for process fairness as a good in itself.]","sources":["04-games-of-strategy","06-behavioral-game-theory","08-grammar-of-society","11-bounds-of-reason"]},{"id":"t06","name":"Designed rules vs self-governed rules","pole_a":"institutions are designed; a competent designer with the right toolkit writes rules that make contribution a best response. Dixit et al. (`04`): choose decision rules on purpose, make sanctions subgame-perfect, randomize monitoring at a probability roughly gain divided by penalty, sort types with costly signals. Easley and Kleinberg (`10`) endorse institutional edits over exhortation. The strong form is external authorship: a central authority or platform owner writes and enforces the rules, the prescription Ostrom's book was written against.","pole_b":"durable rules are crafted incrementally by those bound by them, and mostly copied from neighbours rather than invented. Ostrom (`09`): appropriators in Törbel (the 1517 cap: no more cows on the alp than one can winter), the huertas, the zanjeras and the California basins crafted, monitored and revised their rules incrementally, with courts and enabling law as backstop, not author. Principle 3 (those affected can change the rules) is the core; the Cox review (91 studies, verified) supports the principles, with the caveat that cases were selected on the dependent variable. Henrich (`01`): institutions were mostly copied from successful neighbours and modified, with designers rationalizing afterwards; Cleaver's institutional bricolage (in `09`'s critiques) says rules are assembled from existing practice.","rule":"IF the group already communicates, observes itself and can change its rules THEN fix those channels first, then let members craft operational rules against the eight principles used as questions, with external authority as recognition, backstop and data. IF the group is new, large, or the problem is one members cannot see (an accounting constraint, a sorting externality) THEN design the structure (boundaries, by-product monitoring, a graduated ladder, a cheap dispute forum), copy the package from a successful peer group, but hand operational rules to members within weeks and date the first revision. IF an external authority insists on writing the rules THEN expect compliance only while enforced and budget accordingly. Never present the principles as a recipe, as anti-state or as evidence of fairness (ledger #29).","switch_signal":"Toward design: members cannot agree or observe each other, or the problem is an externality nobody experiences directly; consultation has produced a half-launch. Toward self-governance: imposed rules are complied with only under watch, sanctions are appealed over the group's head, or members already run workarounds that work better than the official rule. Ask who changed the last rule, and whether compliance changed when enforcement attention moved.","evidence":"The ledger resolves X10 as conditional and mostly compatible: Ostrom's cases show incremental crafting rather than a constitutional act, and Henrich's copy-and-modify includes the modification. Copy the norm package of a visibly successful peer group, then craft with the people bound by the rules; neither \"design from scratch\" nor \"just copy\" is [E]. The real disagreement is authorship and legitimacy: Ostrom's principle 7 (external recognition of the right to organize) and her field evidence that weakly enforced external regulation crowds out communication-driven cooperation (Cardenas, background) say imposed rules are followed only while enforced; the mechanism-design toolkit is silent on who may change the rules, and Dixit's file concedes that with many players \"who punishes whom\" is hard and Ostrom's monitoring principles are the empirical answer. The 09 critiques matter: the principles describe structure, not the processes (trust, legitimacy) that make it work; Agrawal counted around 30 or more success conditions across the literature; Ostrom warned against panaceas; durable cases lean on courts and several are inegalitarian. This is one of two tensions where the learner's values enter explicitly: \"those bound by a rule may change it\" is [E] for durability and [V] for polycentric arrangements; a designer who prefers control is making a value choice. [E for participant authorship and graduated sanctions in durable institutions; H for transfer to teams and digital commons (ledger #29); V for who holds the pen.]","sources":["01-secret-of-our-success","04-games-of-strategy","09-governing-the-commons","10-networks-crowds-markets"]},{"id":"t07","name":"Assurance and talk
