erges to the risk-dominant, inefficient equilibrium unless communication is allowed. One-way cheap talk helps; two-way cheap talk helps more; pre-play talk almost always raises stag-hunting. Strategic uncertainty, the fear that the other will play safe, beats payoff dominance, and later work found the payoff to the safe action is a strong predictor of outcomes. This is why the manager's bonus in the Module 3 hook did nothing: the payoffs already favoured cooperation.\n\n**Weak-link games** (Van Huyck, Battalio and Beil 1990). Each of n players chooses an effort from 1 to 7; the group payoff depends on the *minimum* effort, and each unit of one's own effort is costly. Every common effort level is an equilibrium, ranked with 7 best. Groups of 14 to 16 collapsed to effort 1 within about ten rounds (group-size result verified; round count background): first-round efforts were spread, one low chooser dragged the minimum down, and everyone raced to the bottom. Fixed pairs converged to 7. Large groups never coordinate efficiently in the baseline game, and the pattern has been replicated many times. In **median-effort games** (1991), where payoff depends on the median rather than the minimum, groups lock in on whatever the first-round median was: strong history dependence and no drift to the worst outcome. The aggregation rule decides how fragile coordination is to one defector.\n\n**Selection devices.** Camerer's synthesis: equilibrium selection is driven by salience and labels (focal points, which people find far above chance using cultural cues), by strategic uncertainty and the payoff to the safe action, by history (early rounds lock in), by group size, and by communication, which works partly by changing beliefs and partly by creating social commitment. Post-2003 additions the course uses: Weber (2006, verified, a single lab lineage) showed that large groups that *start* small and grow gradually, with entrants shown the group's history, can reach and sustain high effort, while groups that start large fail. Brandts and Cooper found that a manager's public message asking for high effort and stressing mutual benefit rescued stuck groups as well as or better than money. Chaudhuri, Schotter and Sopher found that advice between generations of players helps only when it is common knowledge, read aloud publicly, not when it is private.\n\n**Design consequences**, [E] for the lab, [H] for your group. Any process where the worst performer sets the outcome (security, release pipelines, joint sign-offs, on-call) is a weak-link game and is fragile at scale. Either shrink the set whose minimum matters, change the aggregation rule to a median or a quorum, or grow the group from a coordinated core with a visible history. Make the intended equilibrium focal: name it, put a leader's public suggestion on it, and give it a history of success. Reduce the payoff to the safe action rather than only raising the reward for success. And over-invest in the first few cycles of a new team, because early rounds decide the steady state.\n\nThe social-psychology cooperation chapter agrees: relevant talk before a public-goods decision is the strongest single lever in the meta-analyses. Cheap talk, as the next module shows, decays without sanctions where defection dominates; in a stag hunt it is exactly the handshake the game needs."},{"title":"Lab results transfer as mechanisms and directions, not point estimates","tag":"E","body":"Everything in this module comes from undergraduates in the United States, Europe, Israel and Japan playing unfamiliar one-shot games for small stakes, with the cross-cultural work as the main exception. The course's rule for using it is fixed: lab results transfer as mechanisms and directions, never as field point estimates. Here is the evidence for the rule itself, and the three cases where it bites hardest.\n\n**Replication.** Camerer and colleagues (2016, verified) replicated 18 laboratory experiments in economics from top journals: 61% showed a significant effect in the same direction, and the replicated effects averaged about two thirds of the originals. That is a better rate than social psychology's, and the incentivised cooperation-game results are among the most replicable findings around. It is also a reminder that effect sizes in the original literature are inflated. Quote the figure as 61% of 18 and two thirds; the social-psychology textbook's \"about 60%\" is a background rounding of the same study.\n\n**Gift exchange.** In lab labour markets, \"firms\" that pay above the market-clearing wage get higher costly effort from \"workers\"; the wage-effort correlation is robust in the lab. Gneezy and List (2006, verified) took it to the field: higher-than-promised wages raised output in library data entry and door-to-door fundraising for the first few hours only, after which effort fell back, and the gift cost the employer more than it earned. Later field work found that wage *cuts* and non-monetary gifts have larger and more persistent effects than raises (background). The course's rule: treat positive reciprocity to a pay raise as weak and decaying, and negative reciprocity to cuts and broken promises as strong. A manager who cites lab gift exchange to justify above-market pay for sustained extra effort has the direction right and the persistence wrong, and framing the raise as a gift does not rescue persistence.\n\n**Stakes.** High-stakes ultimatum studies, up to months of income, show rejection rates falling substantially as stakes rise; costly punishment is real but bounded. Expect resistance to terms perceived as far below a fair share; expect it to shrink, not vanish, as the stakes grow.\n\n**Type heterogeneity as the finding.** The parametric social-preference models are the contested part of the book. Estimated inequity-aversion parameters are unstable across games; efficiency-concern models fit allocation data better; intention-based models are needed for the computer-offer results; Bruhin, Fehr and Schunk (2019, background) estimate that about 40% of subjects are strongly other-regarding while a large minority are close to selfish. Camerer's \"no winner\" verdict has held. So \"most people are inequity averse with fixed parameters\" may not be tagged [E]; \"the group contains a distribution of types whose behaviour depends on cues and expectations\" may.\n\n**One more hedge.** Dictator giving is not evidence of altruism: adding a take option or changing the action set shifts it dramatically, so it reflects the experimenter-created norm of the situation more than a stable preference, which is the bridge to Bicchieri's norms in Module 7.\n\nWhat this means for a brief. When you write \"people will pay to punish unfairness\" you may tag it [E] as a lab mechanism with a stated direction. When you write \"our contributors will reject a split below thirty percent\", you are asserting a field point estimate in your own group, and it is [H] with a prediction attached. The critics' position, that many lab anomalies are artefacts of one-shot unfamiliar play and that with experience standard theory does fine, is half conceded by Camerer's own learning chapter for converged play. Use both halves: first contact is norm- and fairness-driven; the steady state depends on what the first rounds taught."}],"worked_example":{"title":"Decision (partially faded: you write steps 4 and 5): a platform must split a fixed pool of contributor rewards unequally; complaints and exits follow each round","steps":["Diagnose with the evidence. People punish intended unfairness far more than unlucky or rule-based outcomes: the same low offer from a random device is rejected far less often than from a person. So the diagnosis is the perceived intention behind the split, not its inequality as such.","Which amendment? Social preferences, with a cue-dependent norm: the split is seen as a proposer's choice, so each round activates the responder's script and the intention-punishing response, and the exits are the field version of rejection.","The fix set is procedural. Make the rule impersonal and public before contributions happen, so the allocation is an outcome of a rule rather than a choice; if some discretion must remain, use a lottery for the discretionary part, since unlucky outcomes are tolerated where intended ones are punished.","You write the prediction. State what happens to complaints, to exits of the top contributors, and to average contribution, over the next three rounds, if the rule is published before contributions begin. (The design expects: complaints fall, exits of top contributors fall, average contribution unchanged or up.)","You write the tags. Tag the intention-sensitivity claim, the magnitude claim for this platform, and the choice of a rule over discretion, and justify each in one line. (The design expects: [E] for intention-sensitivity in the lab; [H] for the magnitude here, since field effects run about two thirds of lab effects or smaller; [V] for preferring a rule to discretion.)"]},"hinge":[{"q":"A manager cites lab gift-exchange results to justify above-market pay for sustained extra effort. What does the evidence support?","options":["The lab result transfers: pay more and effort rises durably, because reciprocity is a stable human trait.","Reciprocity is a lab artefact; only incentives matter in the field, so tie the pay to measured output.","Positive reciprocity to a raise is real but weak and decays within hours in the field; negative reciprocity is strong.","It works only if the raise is framed as a gift, because the gift framing is what triggers the reciprocal response."],"answer":2,"diagnoses":["Lab numbers transferring to the field. The lab wage-effort correlation is robust; its field magnitude and persistence are modest, and the gift cost more than it returned.","An over-correction to 'people are payoff maximisers'. The ultimatum and trust results are robust across decades and countries; reciprocity is real, and it is asymmetric.","Correct. The field effort boost lasted the first few hours; cuts and broken promises produce stronger and more persistent responses than raises. Direction right, persistence wrong.","Partly right, wrong level. Framing matters in the lab, but the field finding is about persistence, and framing a raise as a gift does not make its effect last."]},{"q":"A new community's first credit-allocation round is contested and the founders say \"it will settle down with experience.\" Which amendment does the evidence invoke, and what should they do?","options":["Learning: play converges to equilibrium with experience, so wait a few rounds before intervening.","Social preferences: people are altruists at heart, so the contest will fade once they see the shares are fair.","Limited reasoning: explain the equilibrium to them so they can compute it, since the contest comes from confusion.","Learning: the steady state is path-dependent, so seed the first rounds and give feedback on forgone payoffs."],"answer":3,"diagnoses":["Convergence as automatic. Learning drifts toward equilibrium and stalls, and its direction depends on early rounds; waiting chooses the steady state by default.","'People are altruists.' Dictator giving is fragile norm compliance that collapses under anonymity; the plurality type is the conditional cooperator, who needs to see others cooperate.","Expecting deep iterated reasoning on first contact. People reason one to two steps; explaining an equilibrium does not make it the naive best response, and the problem here is history, not computation.","Correct. Median-effort groups locked in on their first-round median; early rounds decide the steady state, and forgone-payoff feedback speeds learning toward the good one."]},{"q":"A group of sixteen reviewers must all sign off before a release; releases slip because one reviewer is always late, and everyone else has started reviewing less carefully. What is the best-supported structural fix?","options":["Shrink the set whose minimum matters, or change the rule from \"all must sign\" to a median or quorum rule.","Pay a bonus for on-time sign-off, so that the late reviewer has a reason to move and the others to stay careful.","Replace the late reviewer, since the collapse traces to one person and the others will recover once they are gone.","Remind everyone of the standard, since the careful reviewers have drifted and need the expectation restated."],"answer":0,"diagnoses":["Correct. Groups of 14 to 16 collapsed to the minimum where fixed pairs reached the top, and median-effort groups did not collapse at all; the aggregation rule and the size of the set whose minimum matters are the design variables.","'Coordination failure is a payoff problem.' In weak-link games the payoffs already favour high effort; a bonus is the least-supported first lever, and the collapse is driven by strategic uncertainty about the slowest member.","A dispositional diagnosis. The collapse pattern is structural and recurs with any sixteen; the others reviewing less carefully is the race to the bottom, not a second character problem.","Exhortation without common knowledge. Advice works when it is public and common knowledge (read aloud to everyone), and a reminder is neither; a leader's public request naming the target is the version with evidence."]},{"q":"Which statement about fairness may be tagged [E] in a brief?","options":["People everywhere expect a fifty-fifty split, since the ultimatum result replicates across countries.","Fairness norms are cultural: the disposition to have them is universal, the content varies with daily economic life.","Market exposure makes people fair, since offers rise with market integration across the fifteen small-scale societies studied.","Most people are inequity averse with fixed parameters, since one model fits the ultimatum and dictator data."],"answer":1,"diagnoses":["Fairness as a universal fifty-fifty. Across fifteen small-scale societies mean ultimatum offers ran from about 26% to about 58%; students are mid-range, not the human default.","Correct. The direction is verified in Henrich and colleagues 2001 and 2010: offers track market integration and the payoffs to cooperation in daily life; the disposition is universal, the content is not.","Stating the causal direction the data cannot fix. Market integration correlates with fairer offers; whether markets make people fair or fair people build markets is unresolved.","A single social-preference model as [E]. Camerer's own verdict is that no model wins; parameters are unstable across games and the real finding is a distribution of types."]}],"brief_prompt":"Add to the brief (section s6, 'population of types and fairness baseline'): your estimate of the group's type mix in words (mostly conditional cooperators? a large selfish minority?) and what conditional cooperators can currently see of others' contributions; the group's own fairness reference point for the allocations that matter (not the lab's); any weak-link process (where the worst performer sets the outcome) and its group size; which of the three amendments best explains the main v0 failure. Tag each. Prediction: what happens to contributions if others' contributions become visible.","deeper":["books/06-behavioral-game-theory.md#Ch 3 — Mixed-Strategy Equilibrium (one paragraph)","books/06-behavioral-game-theory.md#Ch 4 — Bargaining (one paragraph)","books/06-behavioral-game-theory.md#Ch 8 — Signaling and Reputation (one paragraph)","books/06-behavioral-game-theory.md#Evidence strength & limits","books/03-social-psychology.md#Ch 14 — Morality, Altruism, and Cooperation"]},{"id":"m6","num":6,"title":"How populations settle: risk dominance, correlation, signals","level":"Order","minutes":100,"sources":["07-stag-hunt","06-behavioral-game-theory","04-games-of-strategy"],"hook":"Two teams would both be better off adopting a shared standard and both know it. Left alone, they will not. Nobody is stupid and nobody is selfish. Where does the outcome come from, if not from anyone's preference?","attempt":{"prompt":"Use these illustrative payoffs (the ledger's own worked numbers, not an evidence claim): hunting stag with another stag hunter pays 4, hunting stag with a hare hunter pays 0, hunting hare pays 3 against anyone. A population of one hundred starts with sixty stag hunters. People are matched at random and copy whichever strategy is visibly earning more. Predict where the population ends up and say why. Then propose one change to the payoffs and one change to the matching that would reverse the outcome. Ten lines, no reading.","minutes":12},"objectives":["State the risk-dominance rule with its conditions (random mixing, best-response updating, large groups, no communication or history) and list the levers that make payoff dominance reachable: correlation through small stable groups, success-visible imitation, public pledges, gradual growth, and a lower cost of being the lone cooperator.","Explain why local interaction helps cooperation only under success-copying, and why a dense cluster both blocks a norm entering from outside and protects one adopted inside.","Say what cheap talk does in a stag hunt, why it does not rescue a true prisoner's dilemma, and how long to expect its effect to last without sanctions.","Pace a rollout so that structure re-sorts faster than behaviour is re-evaluated, and write the pacing rule as a testable hypothesis in the brief."],"ideas":[{"title":"Basin size decides, not the attractiveness of the good outcome","tag":"E","body":"Rousseau's parable: each hunter can take a hare alone, or stay at his post and share a stag that is caught only if everyone stays. The stag hunt has two strict equilibria. All-stag is **payoff dominant** (better for everyone if reached). All-hare is **risk dominant** (the best reply if you give the other player a 50/50 chance of either move). The prisoner's dilemma has one equilibrium and cooperation is never a best reply; the stag hunt has two, and which one a group reaches depends on what each member expects of the others. Skyrms's thesis is that most of what political philosophy calls \"the problem of cooperation\" has this shape once repetition and reputation are included: it is a problem of *trust*, not *temptation*.\n\nNow put a population, not a pair, into the game. **Replicator dynamics** is the baseline model: a strategy's share grows in proportion to how much its average payoff exceeds the population average. It is the formal picture of success-biased imitation, and \"the group learns\" means this. Under random pairing the population goes to whichever pure equilibrium's basin it starts in; the mixed equilibrium in between is an unstable **watershed**.\n\nThe arithmetic is worth doing once by hand, using the ledger's illustrative payoffs (stag with stag 4, stag with hare 0, hare 3 against anyone). Let p be the share of stag hunters. Expected payoff of stag is 4p; of hare, 3. Stag wins only when 4p > 3, so the watershed is p* = 3/4. A population that starts at sixty in a hundred is *below* it and slides to all-hare, even though a majority is cooperating and stag pays more. The payoff-dominant equilibrium's basin is only the top quarter of the state space, so a random start almost always ends at hare. This is why the module's cold attempt is designed to be got wrong: \"sixty is a majority and stag pays more\" is the folk reasoning, and it fails.\n\nNow change one number. Raise the lone cooperator's payoff (stag against hare) from 0 to 2: expected stag payoff becomes 4p + 2(1 − p) = 2 + 2p, which beats 3 when p > 1/2. The watershed drops to one half and the sixty-percent start tips to all-stag. Raising the joint payoff (stag with stag) from 4 to 5 instead moves the watershed only to 3/5. The ratio of \"loss from being duped\" to \"gain from cooperating\" sets the watershed, and **cutting the cost of being the lone cooperator moves it more than sweetening the joint outcome.** The ledger (rule 2, C37) makes this a course rule: \"sweeten the joint payoff\" is the weakest lever.\n\nTwo cautions on tagging. The model and the lab counterpart (Cooper et al.'s stag-hunt experiments converge to the risk-dominant outcome without communication; see the fifth idea) are [E]. Which regime *your* group is in, and where its watershed sits, is [H] until you have looked at how people are matched and how they update. And never write \"the efficient equilibrium is the rational one\": under uncertainty about the others, the safe choice is defensible, the failure is structural, and so is the fix."},{"title":"Correlation is the master variable, and the learning rule decides whether structure helps","tag":"E","body":"Random mixing is the assumption under which cooperation is hardest. Almost any real structure departs from it, and Skyrms's three parts (Location, Signals, Association) are three ways of producing the same thing: **correlation**, meaning that like meets like more often than chance. Correlation expands the cooperative basin because a stag hunter who mostly meets stag hunters earns the high joint payoff and becomes the visibly successful model that others copy.\n\n**Location.** Put the game on a lattice where each agent plays its neighbours. Here the result depends entirely on *what an agent looks at when updating*. Under **best-response** revision (\"what does my neighbourhood mostly do?\"), Ellison (1993) showed the risk-dominant equilibrium wins, and local interaction actually *speeds* convergence to the safe outcome: a cluster of hare hunters spreads through stag hunters. Under **imitate-the-best-neighbour** revision (\"who near me is doing well?\"), a small cluster of stag hunters can spread through a hare-hunting population if the stag payoff is high enough. A stag hunter inside a cluster earns the stag payoff from every neighbour and is the most successful agent that boundary hare hunters can see, so they copy it. The book file's illustration: with eight neighbours and hare paying 3 against anyone, a hare hunter earns 24 regardless; a stag hunter on the edge of a cluster earns 5 times the stag payoff, so the cluster grows when stag pays 5 and shrinks when it pays 4, even though hare is still risk dominant in both cases. Growth or dissolution is decided by local arithmetic and by the learning rule, not by the global fraction.\n\nThis is ledger rule 3, and the course asks you to state the condition every time local interaction or clustering is invoked: **structure helps cooperation only under success-copying; under majority-copying (conformist transmission, in the Origins books' vocabulary) or best response, cooperator clusters get swamped.** The same density that stops a good norm entering a cluster from outside protects one that is already adopted inside. m9 gives the exact cluster-density condition; here the point is that the Origins-level learning rule (m1) decides whether the Order-level structure does anything.\n\n**Association.** Drop geography and let agents *choose* partners, learning by simple reinforcement: the propensity to visit a partner grows by the payoff the visit produced. Skyrms and Pemantle showed that even when every interaction pays everyone the same, reinforcement produces structure: visiting probabilities do not stay uniform, and forgetting old reinforcement freezes the network into pairs and cliques. With stag-hunt payoffs and fixed strategies, stag hunters reinforce visits to stag hunters (4 there, 0 elsewhere) and quickly associate; hare hunters earn 3 anywhere and drift. Result: stag hunters out-earn hare hunters on average, the reverse of random mixing. Partner choice manufactures the correlation that Location needed geography for.\n\nThe two qualifications the file insists on: with persistent noise and best-response updating, Kandori, Mailath and Rob and Young show the risk-dominant equilibrium is the long-run stochastically stable one. Skyrms's optimism rests on imitation dynamics and on transient rather than long-run analysis. So the design mantra from the postscript, *do not try to change preferences; change who meets whom, what they can signal, and how fast they can re-sort*, is [E] as a model result and [H] as a claim about your group, whose learning rule you have to check."},{"title":"Cheap talk is a transient handshake: it moves a stag hunt and does not rescue a PD","tag":"E","body":"Cheap talk is costless, non-binding pre-play messaging. The classical objection (Aumann) is that in a stag hunt everyone says \"I will hunt stag\" whatever they intend, so the message carries no information; and in a prisoner's dilemma talk cannot help because defection dominates anyway. Skyrms's reply is dynamic. Even if talk carries no information *at equilibrium*, it carries *transient* information along the path, and that changes which equilibrium is reached.\n\nThe model: a strategy is a triple (which signal to send; what to do on receiving signal A; what to do on receiving signal B). Signals start meaningless. Under replicator dynamics the basin of stag hunting expands dramatically; in the simulations most random starts now end at all-stag. The mechanism is Robson's **secret handshake**: \"send A; hunt stag with A-senders; hunt hare with everyone else.\" Against a B-sending hare hunter the handshake earns 3, no worse than a plain hare hunter; against another handshaker it earns 4. So it weakly dominates plain hare hunting and grows from a small share. The threat is a mimic that sends A and hunts hare, earning 3 while the handshaker earns 0 against it. In the stag hunt, once handshakers are common, handshaker pairs earn 4 to the mimic's 3, so the mimic is a nuisance only if it grows enough to push the population below the watershed. Once stag dominates, the signal loses content, but the population is already at the good equilibrium.\n\nIn the prisoner's dilemma the same story ends differently: the mimic's advantage is decisive, because the cooperative outcome is not an equilibrium even when reached. **Cheap talk helps the stag hunt because the good outcome is stable once you get there; in the PD it is not.**\n\nThe lab agrees on direction. Cooper, DeJong, Forsythe and Ross found stag-hunt play converging to the risk-dominant outcome without communication; one-way cheap talk helped, two-way helped more, and pre-play talk almost always raised stag hunting. For public-goods and PD games, Bicchieri's reading (m7) explains why talk still works among *human* subjects: relevant discussion creates the empirical and normative expectations a cooperation norm requires, so the game is reclassified in the players' heads. Dawes, McTavish and Shaklee's eight-person dilemma roughly doubled cooperation with ten minutes of relevant discussion (from about three in ten to about seven in ten; a background figure, quote it as \"roughly doubled\"). Skyrms's agents have no normative term, which is why in his models talk is transient in a PD.\n\nThe course's rule (ledger 12) puts the two together: cheap talk is [E] in the lab for humans in PDs and public goods, [E] in models for stag hunts, and should be expected to **decay without sanctions or repetition where defection dominates** (Camerer's public-goods contributions fall over rounds and recover with punishment). For the brief: public pledges, stand-up declarations of intent and visible sign-ups are not empty in a trust problem even when non-binding; they create a temporary correlation between pledge-makers and cooperators long enough to move the group into the good equilibrium. Write down what the pledge is expected to do, and how long it lasts if the interaction turns out to be a PD.\n\nTwo misreadings to avoid: \"communication works only through binding commitment\" (every relevant model and experiment uses non-binding talk), and \"at equilibrium everyone sends the same message, so talk cannot matter\" (that assesses only the endpoint)."},{"title":"The speed ratio: let structure re-sort faster than behaviour is re-evaluated","tag":"H","body":"Skyrms's last chapter lets both the network (by reinforcement, as in partner choice) and the strategies (by imitation of successful others) evolve at the same time. The result depends on their **relative speed**, and this is the module's most directly usable design variable.\n\nIf structure adapts fast relative to strategy revision, stag hunters find each other before they are tempted to switch, out-earn hare hunters, get imitated, and the population goes to all-stag. If strategy revision is fast and structure sluggish (matching still near random when people re-judge their behaviour), the chapter 1 dynamics return and the risk-dominant outcome tends to win. The book file's illustrative construction makes it concrete: ten agents, half stag and half hare, choosing partners by reinforcement, and every k rounds each agent copies the strategy of its best-earning recent partner. With k large (structure learns first), by the first imitation step stag hunters average near 4 and hare hunters 3, so hare hunters convert and the population tips to all-stag. With k = 1, stag hunters are still visiting hare hunters half the time, averaging 2 against 3, and they convert to hare before association can help. Same payoffs, opposite outcomes, set by k alone.\n\nSo \"which equilibrium\" is set not by payoffs alone but by the ratio of structural to strategic fluidity. Most evolutionary game theory fixes structure and evolves strategies; letting structure move is a qualitatively different regime, and generally friendlier to cooperation. In the prisoner's dilemma the machinery helps less: defectors also learn to seek cooperators, so association alone cannot rescue cooperation; the cooperators' protection is that partners choose too and reinforce visits to those who cooperated with them. The book is candid that the PD remains hard.\n\nThe design translation. When introducing a cooperative practice, **slow strategy churn and speed partnership formation**: give cooperators time and channels to find each other before the practice is judged. Concretely, that means forming and protecting a pilot cluster first, letting people opt in to it, making the cluster's payoffs visible, and only then opening the org-wide evaluation. The failure mode is the opposite sequence: a monthly \"is this working?\" survey from week one, while teams are still randomly composed, produces exactly the k = 1 regime. People re-judge the practice while the average cooperator is still meeting hare hunters half the time, see poor average payoffs, and switch to hare before association can rescue them. Quarterly team rotation \"to spread the culture\" is the same mistake at organisational scale: it destroys the correlation that lets cooperators meet cooperators and re-evaluates strategies before association can help.\n\nThis idea is tagged [H] for a reason. It is grounded in simulations, not field data; the lab literature on free neighbourhood choice in stag hunts reports better coordination on the payoff-dominant outcome, consistent with the model, but that literature is young. In the brief, the pacing rule goes in as a hypothesis with a prediction: name the pilot cluster, the date its interior should be stable, the date evaluation opens, and what you expect to see if the org evaluates early instead."},{"title":"Scope: Skyrms's agents have no beliefs, and the lab is the counterpart","tag":"E","body":"Every result in *The Stag Hunt* is a model result: analytic (replicator dynamics on small games, urn limits for partner choice) or simulation (lattice bargaining and stag hunt, cheap talk, coevolution). Within their assumptions they are robust, and convergence to signalling systems in the simplest Lewis game was later proved. But the models are dynamics over *behaviour*, with no beliefs, motives or norms as experienced. Alexander's review of the book made exactly this point: it identifies basins for strategies that are behaviourally cooperative and says nothing about motivation. That is why the course pairs Skyrms with Bicchieri (m7, what a norm is to the agent: her empirical expectations are the psychology of his basin of attraction) and with Ostrom (m8, the institutions that create local interaction, signalling and partner choice on purpose). Ledger C41 is the misreading to avoid: \"Skyrms shows cooperation evolves naturally, so groups do not need institutions.\" The results hold for stag hunts under specific learning rules and structures; they do not rescue true PDs; and institutions are precisely the things that build correlation.\n\nThe interpretive thesis, that the social contract *is* a stag hunt rather than a PD, is plausible and untested. Some real commons problems are genuinely PDs at the margin (Ostrom's open-access cases). So the classification question from m3 stays live: ask whether a member gains by defecting when everyone else cooperates. If yes, it is a PD and needs payoff change, repetition or sanctions; if no, it is a stag hunt and the problem is expectation management. Many \"free rider\" complaints are hare hunting by people who do not trust the team to show up.\n\n**The lab counterpart** (re-read from Camerer, m5) is what lets the module tag the direction [E]. In the weak-link (minimum-effort) game each player picks an effort from 1 to 7, the group payoff depends on the *minimum*, and every common effort level is an equilibrium, with 7 the best. Van Huyck, Battalio and Beil found groups of 14 to 16 collapsing to effort 1 within about ten rounds (group-size result verified; the round count is background), while fixed pairs reached 7. One low chooser drags the minimum down and everyone races to the bottom. That is a threshold phenomenon: the population's watershed, met in a laboratory. In median-effort games, where the payoff depends on the median, groups converge quickly to whatever the first-round median was: strong history dependence with no drift to the worst outcome. The aggregation rule matters enormously.\n\nThe post-2003 selection devices map one-to-one onto Skyrms's levers. Weber (2006, verified, a single lab lineage) found that large groups that *start* small and grow gradually, with entrants shown the group's history, reach and sustain high effort, while groups that start large fail: that is correlation through pacing. Two-way cheap talk and a leader's message asking for high effort work as well as or better than money (Brandts and Cooper): that is the handshake. Advice helps only when it is common knowledge, read aloud, not private (Chaudhuri et al.): that is the signal seen by everyone. And the payoff to the safe action is a strong predictor of outcomes: that is the lone-cooperator cost. Everything the model says about levers, the lab says about direction. Neither gives you a point estimate for your group; that is the [H] you write into the brief and test."}],"worked_example":{"title":"Rolling out blameless post-mortems across a forty-person org (you supply the pacing decision)","steps":["Classify before prescribing (ledger rule 13). Does anyone gain by running a blame-free review alone while the rest of the org still blames? No: the lone adopter looks naive and gets no benefit. Does everyone gain if all adopt? Yes. Two equilibria, the good one needing trust: a stag hunt, not a PD. Enforcement is the wrong tool; assurance and correlation are the right ones. Tag the classification [H], since it rests on your reading of the members' payoffs.","Correlation lever one, location. Do not assign volunteers from across the org; that reproduces random mixing. Start in two stable teams of five to eight, so that adopters mostly meet adopters. Make the piloting teams' outcomes visible (incident recurrence, time to root cause) so that success-copying, not majority-copying, can operate on the boundary (ledger rule 3). If the org's habit is to copy what most teams do, add success-visibility first or the pilot will be swamped.","Correlation lever two, signals. A public opt-in pledge by the pilot teams, understood as a transient handshake and not as a binding commitment. Its job is to let would-be adopters recognise each other during the transition; once the practice is established the pledge can lose content without harm. Predict its decay if the interaction turns out to be a PD (someone gains by quietly blaming): then the pledge needs a sanction or repetition behind it.","Correlation lever three, association and cost. Let people choose to join a piloting team before the org evaluates the practice, and cut the cost of being the lone cooperator: a facilitator attends the first reviews, a template removes the awkwardness, leadership states that a blameless review is expected. Lowering the lone-cooperator cost moves the watershed more than any bonus for the joint outcome.","Now you write the pacing rule. Form and protect the pilot cluster first; evaluate the practice only after the cluster's interior is stable (say, three reviews in). Then predict what happens if the org instead runs a monthly 'is this working?' survey from week one: strategy re-evaluation outruns structural sorting, adopters see poor average payoffs while still meeting blamers, and the practice is abandoned before association can rescue it (the k = 1 regime).","Tags. [E] that correlation expands the cooperative basin in models and that communication and gradual growth select the efficient equilibrium in the lab. [H] that these two teams, this pledge and this pace are right for this org. [V] that a slower spread through a protected pilot is preferred to a mandate that would be faster and more brittle."]},"hinge":[{"q":"A CTO says: \"Adopting the standard is obviously the rational choice, so teams that do not are being irrational.\" Which correction applies?","options":["Under uncertainty about the other team, the safe choice is defensible; the failure is structural, and so is the fix.","They are being selfish rather than irrational, because hare hunting protects their own team at the org's expense.","They are irrational, and a payoff sweetener will fix it, because a bigger prize makes the rational choice obvious to anyone.","They lack information; publish the benefits, because a team that saw the numbers would adopt without prompting."],"answer":0,"diagnoses":["Correct. Hare is risk dominant: it is the best reply against a 50/50 opponent. Which equilibrium a population reaches is set by basin size under its matching regime, not by anyone's rationality, and the levers are correlation, signals, pacing and lone-cooperator cost (ledger rule 2; `07` common misreadings).","Rationality equals selfishness (ledger rule 16). Hare hunting under uncertainty is consistent with any preferences, including cooperative ones; it is a bet on what others will do.","\"The efficient equilibrium is the rational one\" plus \"coordination failure is a payoff problem\" (ledger C37). Sweetening the joint payoff is the weakest lever; the watershed moves with the lone-cooperator cost.","Information deficit as the problem. In the scenario the payoffs are already common knowledge; what is missing is confidence about the other team's move, which more benefit data does not supply."]},{"q":"A large org reorganises so that everyone rotates teams every quarter, expecting cooperation norms to spread faster. What does Skyrms predict?","options":["Faster spread, since more people meet the cooperators and a good norm carries on contact with them.","No effect, since norms are about beliefs, not structure, and rotation leaves what people believe untouched.","Faster spread, provided the org is large enough for the collective-brain effect to outweigh the churn.","Slower or failed spread: rotation destroys the correlation that lets cooperators meet cooperators."],"answer":3,"diagnoses":["\"More mixing spreads good norms.\" Random mixing is the assumption under which cooperation is hardest; every lever in the book is a departure from it.","Expectations as the whole story. Skyrms shows that basin size decides outcomes with no beliefs at all; Bicchieri adds expectations, she does not replace structure (ledger X5).","Confuses collective-brain connectivity (information flow and skill retention, m1) with correlation (enforcement and complex contagion). Size does not manufacture correlation; structure does (ledger X15).","Correct. Rotation pushes the regime toward random matching and fast strategy revision (the k = 1 case): cooperators meet hare hunters half the time, see poor average payoffs and convert before partnerships can sort (`07` ch 6-7, postscript)."]},{"q":"A pilot cluster of cooperators sits inside a larger group. The larger group's habit is to do \"what most people here do\". What happens to the cluster?","options":["It spreads, since local interaction favours cooperation and neighbours copy the cluster's better payoffs.","It gets swamped, because majority-copying looks at what the neighbourhood does, not at who is thriving.","It spreads if the cluster's members are the prestigious ones, since people copy the prestigious wherever they are.","It is protected by its density and stays as it is, since a dense cluster is above threshold from the inside."],"answer":1,"diagnoses":["Local interaction as unconditionally helpful (ledger C39). Under best response or majority-copying, local interaction accelerates the risk-dominant outcome (Ellison 1993).","Correct. Best responders and conformists ask \"what does my neighbourhood do?\"; only imitators ask \"who near me is doing well?\", and only then is the cluster's interior stag hunter the visible model that boundary cells copy (`07` ch 3; ledger rules 3 and 36).","Substitutes Henrich's whom-to-copy bias for Skyrms's learning rule. Prestige decides whom people watch, but under majority-copying the boundary cells still act on what most of their neighbours do (`01` ch 8 vs `07` ch 3).","Partly right, wrong level. Density protects an adopted behaviour under threshold dynamics (`10` ch 19), but under majority-copying the boundary cells see a hare-hunting majority among their neighbours and defect; the cluster erodes from its edge."]},{"q":"Before a resource-allocation decision, a manager gets everyone to state publicly that they will contribute their share. Under what condition does Skyrms say this is nearly worthless?","options":["When the group is large, since in a big group no single pledge can be checked against what its maker does.","In every case, because at equilibrium everyone sends the same message and a universal message carries nothing.","When defection dominates (a true PD): a mimic who pledges and defects invades, so the handshake needs sanctions.","When the pledges are not binding, since a promise nobody can enforce is empty and only a real commitment changes play."],"answer":2,"diagnoses":["Size as the condition. Size matters in weak-link games (`06` ch 7), but Skyrms's condition is the shape of the game: whether the pledged outcome is an equilibrium once reached.","Assesses only the equilibrium. The information a pledge carries is transient and changes which equilibrium is reached; that the signal is empty afterwards does no harm.","Correct. In the stag hunt the handshake weakly dominates hare hunting and the mimic is a nuisance; in the PD the mimic's advantage is decisive because cooperation is not stable even when reached (`07` ch 5; ledger rule 12).","\"Communication works only through binding commitment\" (`08` misreading). The pledges in every relevant model and experiment are non-binding; what makes them work is transient correlation and, in humans, the expectations they create."]}],"brief_prompt":"Add section s7, the equilibrium selection plan. For the group's main stag-hunt interaction record: the current regime (near-random mixing with frequent re-evaluation, or stable subgroups with visible success?); your watershed estimate in words (is the group above or below the fraction of cooperators needed?); which correlation device (location, signal, partner choice) is cheapest here; how you will reduce the cost of being the lone cooperator; and the rollout pacing rule (what is protected first, when evaluation opens). Tag each line. Prediction: what a public pledge will do in this group, and how long its effect lasts without sanctions if the interaction is really a PD.","deeper":["books/07-stag-hunt.md#ch-2--bargaining-with-neighbors","books/07-stag-hunt.md#ch-4--evolution-of-inference","books/07-stag-hunt.md#evidence-strength--limits","books/04-games-of-strategy.md#part-three--ch-12--evolutionary-games","books/06-behavioral-game-theory.md#ch-7--coordination"]},{"id":"m7","num":7,"title":"Norms: expectations, measurement, change","level":"Order","minutes":70,"sources":["08-grammar-of-society","03-social-psychology","10-networks-crowds-markets"],"hook":"Seven in ten members of a team privately think weekend messages are inappropriate; eight in ten believe most colleagues think they are fine; three quarters send them. Nobody is lying. What is the norm made of, and what single intervention would collapse it? (Scenario numbers.)","attempt":{"prompt":"A startup's engineers all write thorough pull-request descriptions. A new lead joins and writes terse ones; within a month everyone does. In ten lines: name what kind of norm the thorough-description practice was and explain the collapse. Then design the measurement you would run before trying to restore it: the exact questions, who answers them, and what result would tell you which lever to pull. No reading first.","minutes":12},"objectives":["Classify any 'norm' as descriptive, convention, social or moral by the expectations that sustain it, and say which expectation to shift to change it.","Design a two-step expectation measurement (what you do; what most do; what most think you should do; what happens if you do not) and read a pluralistic-ignorance gap from the result.","Explain why relevant talk changes the game without changing material payoffs, and how informational cascades make unpopular norms both fast to form and fragile.","Distinguish cue-driven norm activation (scripts) from behavioural priming, and tag any specific cue-to-norm mapping as a hypothesis."],"ideas":[{"title":"A social norm is a conditional preference keyed to two expectations","tag":"E","body":"Most accounts of norms fail in one of two ways. They reduce norm-following to self-interest (norms as equilibria enforced by sanctions), which cannot explain conformity without monitoring; or to internalised values, which cannot explain how quickly norm-following collapses when expectations change. Bicchieri's definition is built to explain conformity *and* its fragility with the same machinery.\n\nLet R be a behavioural rule for situations of type S. R is a **social norm** in a population when a sufficiently large subset of people (i) know the rule exists and applies to S, and (ii) prefer to conform to it *on condition that* (a) they believe enough others conform (an **empirical expectation**) and (b) they believe enough others expect them to conform, and may be willing to sanction deviation (a **normative expectation**). The norm is *followed* when these conditions are actually met. Two consequences that the folk theory misses: a social norm can exist while widely violated, and a widespread behaviour can fail to be a norm at all.\n\nThe definition sorts every \"norm\" your group says it has into four kinds, by the expectations required:\n\n- **Descriptive norm.** Followed because you expect others to follow it and prefer to match. Empirical expectations only. \"Most people here leave at six.\" Fragile: it flips when the visible majority changes.\n- **Convention.** A descriptive norm that is also a coordination equilibrium: everyone prefers to conform given that others do, and nobody gains by deviating alone. Formats, naming, meeting times, driving on the right. Self-enforcing; needs no monitoring.\n- **Social norm.** Runs *against* what you would do absent the norm, because the underlying game is mixed-motive (a PD, a trust game, an ultimatum game): tipping, reciprocity, sharing credit. Needs normative expectations, not just empirical ones, to get compliance. Needs maintenance, and collapses when people stop believing others expect it.\n- **Moral norm.** Followed unconditionally: you would not steal even if everyone did and nobody cared. Cannot be engineered by changing expectations.\n\nThe taxonomy is ledger rule 11 and the course applies it to every \"norm\" mentioned. The commonest error (ledger C42) is \"a social norm is what most people do\": that is a descriptive norm, and treating it as a social norm leads you to punish violators of a rule nobody expects anyone to keep. The second commonest (C43) is \"norms are internalised values\", which leads to values workshops when the thing to change is a belief about other people.\n\nThe book file's own example makes the diagnosis concrete. A \"no-blame post-mortem\" that actually happens is a social norm only if people *would* blame in its absence and comply because they expect others to comply and to disapprove of blaming. If people simply do not want to blame, it is a moral norm and needs no maintenance. If they copy what the loudest person does, it is a descriptive norm and will flip when that person changes, which is exactly what the cold attempt's pull-request practice did.\n\nWhy this is tagged [E]: the definition is a definition, but it comes with a validated measurement (the next idea) and its predictions about fragility are borne out across the experimental corpus in the third idea. What is not [E] is any claim that a *particular* practice in your group falls into a particular bin; that is what you measure."},{"title":"Assume every norm is conditional until it survives a collapse of expectations; diagnose by expectations, not behaviour","tag":"E","body":"Two questions in the wrong order sink most norm interventions. People ask \"what do these members value?\" and act on the answer. Bicchieri's introduction tells you to ask instead: what do they expect of each other, and what do they think is expected of them? The same observed behaviour can be a descriptive norm, a convention, a social norm or a moral norm, and each responds to a different lever. Observation cannot tell you which; only the expectations can.\n\n**The two-step elicitation.** For the behaviour in question, ask each person, privately: (1) what do *you* do; (2) what do *most people here* do (empirical expectation); (3) what do most people here think you *should* do (normative expectation); (4) what happens if you do not (perceived sanction). The four answers place the practice in the taxonomy. If (2) is high and (3) is low, you have a descriptive norm or a convention: people are matching, not complying. If (3) is high and people say they would disapprove of deviation, you have a social norm. If people say they would comply whatever the answers to (2) and (3), you have something moral or internalised. If both (2) and (3) are low, the \"norm\" is a dead rule and the lever is to create both expectations, starting with visible compliance by credible members and expressed expectations.\n\nThe method is validated with caveats. Bicchieri and Xiao (2009, verified) manipulated expectations in a dictator game with messages about what earlier participants did or said should be done: **empirical expectations of selfishness reduced giving even when normative messages endorsed giving.** Later independent work finds the two-step method usable but sensitive to design details (question order, social-desirability bias), and a competing coordination-game elicitation exists (Krupka and Weber). In Bicchieri's own field work on sanitation, empirical and normative expectations were highly correlated and hard to disentangle; the clean taxonomy is a model, not a field observation. So the *method* is [E]; the *result* for your group is [H] until you have run it.\n\n**The internalisation test.** Whether norms are genuinely internalised (the Henrich and Gintis position: an evolved norm psychology with shame, guilt and willingness to punish) or conditional preferences that only look internalised while expectations hold (Bicchieri, who confines internalisation to the moral-norm bin) is an open theoretical dispute (ledger X9). The course does not settle it; it uses an operational rule the sources agree on (ledger rule 10). **Assume a norm is conditional until it survives a collapse of expectations.** If compliance persists after people come to believe that others no longer comply or care, treat the norm as moral or internalised for those members. Until then, design for the conditional case, because it is cheaper to lose: a conditional norm can be destroyed by one visible defector in a credible position, and rebuilt only by rebuilding two beliefs.\n\nTwo things follow for the brief. First, a values statement targets the wrong object when the norm is conditional; stated values predict behaviour poorly (that part is [E]), and building norms through expectations rather than declarations is a [V] the course makes explicit. Second, wherever a practice *can* be made a convention (a coordination equilibrium: formats, defaults, templates), make it one; conventions are self-enforcing and free up your maintenance budget for the genuinely mixed-motive behaviours where normative expectations have to be kept alive."},{"title":"Norms transform games without changing material payoffs","tag":"E","body":"A social norm does not alter what people are paid; it alters the *utility* they attach to outcomes given their expectations. Bicchieri's norm-based utility function says a player's utility is her material payoff minus a penalty proportional to her **sensitivity to the norm** (call it k) times the largest loss any other player suffers from her deviation, relative to what the norm prescribed. The penalty applies only when she expects the norm to apply.\n\nThe ledger's illustrative example. Take a two-person prisoner's dilemma with payoffs 3 each for mutual cooperation, 5 for defecting on a cooperator (who gets 0), and 1 each for mutual defection. Suppose a cooperation norm is expected to apply. If you defect while your partner cooperates, the partner's loss relative to the norm is 3, so your utility from defecting is 5 − 3k. With **k at least two thirds**, defecting yields at most 3, and cooperate-cooperate becomes an equilibrium. But mutual defection is still an equilibrium too. The game now has two equilibria: it has become a stag hunt (m6), not a PD, and everything m6 said about basins and correlation now applies to it. And if expectations that the norm applies are absent, the penalty term does not bite, defection is dominant again, and the game reverts. **Norms change games only while the expectations that they apply are live.**\n\nThis is why relevant talk works, and why Skyrms's agents cannot explain the lab effect on their own. In Bicchieri's fourth chapter, the most robust finding in experimental public-goods and PD research is that costless, non-binding pre-play discussion raises cooperation substantially: Dawes, McTavish and Shaklee's eight-person dilemma went from roughly three in ten cooperating to roughly seven in ten after ten minutes of relevant discussion (background figures; quote as \"roughly doubled\"), and irrelevant discussion did almost nothing; Sally's meta-analysis finds communication the strongest lever. Her account: discussion lets people discover that a cooperation norm applies to this situation, form empirical expectations that others will cooperate, and form normative expectations by hearing others say what ought to be done and by making promises others will hold them to. The sword behind the covenant is the anticipated disapproval of the people you just talked to.\n\nNow the fairness evidence. Ultimatum offers cluster around 40 percent with a mode at 40 to 50 percent; low offers are rejected. The usual explanation is a taste for fairness of fixed size. Bicchieri's argument (and the course's rule 9) is that fixed-preference models cannot explain the *variability*: offers fall when proposers earn the role via a quiz; dictator giving collapses under double-blind anonymity; many dictators pay to exit rather than share, or take \"moral wiggle room\" when the link between choice and outcome is hidden; and mean offers across fifteen small-scale societies ran from about 26 to about 58 percent (Henrich 2001, verified) in line with local norms. The \"taste\" is norm compliance activated by cues of observation, entitlement and expectation; remove the cues and it evaporates.\n\nCaveats the course insists on (ledger rule 38, C45). Norm-based utility is the working model, argued from fit and parsimony rather than shown to beat inequity aversion; its free parameters accommodate a lot; and a substantive fairness concept still sneaks back in, because expectations alone do not say *which* split people expect. Cue-dependence is [E]; the parametric model is [H]. Bicchieri does not deny that fairness behaviour is real, only that a fixed taste is needed to explain it."},{"title":"Unpopular norms live on pluralistic ignorance, and cascades cut both ways","tag":"E","body":"Many norms persist although most people privately dislike them: hazing, campus drinking, \"always look busy\", crunch. The mechanism is **pluralistic ignorance**. Each person privately rejects the norm but believes most others accept it, because she infers others' attitudes from their public behaviour, and their behaviour is itself conformity driven by the same mistaken inference. Everyone complies with a norm nobody supports. It is stable because the behaviour it produces confirms the false belief. Prentice and Miller's Princeton study is the canonical case: students overestimated peers' comfort with campus drinking, and the gap predicted conformity and, for men, drift toward the perceived norm.\n\nPluralistic ignorance is an *informational* failure about normative expectations, which is why the intervention is informational: disapproval has to become **common knowledge**. This is ledger C44 and diagnostic item d1: \"if most people privately disapprove, the practice will die out on its own\" is false. Private disapproval that stays private changes nothing.\n\nBicchieri connects this to **informational cascades** (formalised in Easley and Kleinberg's chapter 16). When people act in sequence and see others' choices but not their private signals, early choices swamp later private information and everyone falls in line even though the pooled information points the other way. The urn model shows the logic: with signals that are right two thirds of the time, once two early movers agree, the third rationally ignores her own contrary draw, and from then on nobody's choice adds information; a wrong cascade occurs about one time in five (an illustrative computation). Add a normative-expectation term and you get conformity to a norm a majority privately judges wrong. Cascades explain how an unpopular norm arises quickly and, because it rests on almost no information, why a credible public signal can collapse it fast. **Cascades cut both ways**: fragility is the reason for optimism.\n\nThe levers, then, are two. Shift empirical expectations by showing that others already deviate; shift normative expectations by showing that others do not approve. Practically: run the anonymous expectation survey of the previous idea, and if private attitudes reject the practice while perceived normative expectations support it, **publish the gap credibly** and recruit a **trendsetter**: a first mover with low sensitivity to the norm, high autonomy and enough visibility in the relevant reference network to be credible. Consider a coordinated, simultaneous switch so no one bears the first-mover cost alone. If instead private attitudes *support* the practice, it is not pluralistic ignorance, and the intervention is a rule (m8), not a revelation.\n\nThe caveats are important enough to be a rule (ledger 24, X14). Social-norms marketing has mixed results, including boomerangs, which is itself consistent with Bicchieri's claim that empirical expectations alone do not make a social norm. Cialdini's Petrified Forest sign (\"many visitors take wood\") raised theft; Schultz's descriptive energy feedback pulled low users *up* toward the average unless an injunctive smiley was added, and Allcott's large-scale version produced about a 2 percent reduction (background). So: always pair the descriptive channel with the injunctive one, and **never publish the share who misbehave**. The diagnosis (measure and read the gap) is [E]; the trendsetter intervention in your group is [H], resting on case studies rather than controlled tests."},{"title":"Norm activation is cue-driven: design the scripts, not just the rules","tag":"H","body":"Norm-following is mostly automatic, not deliberated. People do not consult their expectations and run a cost-benefit calculation; they categorise the situation, retrieve a **script** (a stored sequence of expected roles and actions) or **schema** (a structured knowledge representation), and the script carries default expectations and the norm with it. This is the second chapter of *The Grammar of Society*, and it does a lot of explanatory work. Whether a norm is activated depends on how the situation is interpreted, which depends on salience, labelling, the presence of others and small features of the environment. The same objective situation can trigger different scripts and hence different norms, or no norm at all. Nothing about the person changed; the categorisation did.\n\nThis explains two things that trouble both rational-choice and value-internalisation theories. First, the apparent inconsistency of behaviour across contexts: the generous sharer in one framing is a calculating maximiser in another. Second, why people are poor at predicting their own norm-following: asked in the abstract, they report values; in the situation, the script fires. The social-psychology parallel from m2 is construal (the \"Community Game\" label roughly doubled PD cooperation against \"Wall Street Game\", background): what people think the situation *is* moves behaviour as much as payoffs do.\n\nFor a designer, the consequence is that **norm design is largely cue design**. If you want the review norm followed, the pull-request template, the channel name, the meeting opener and the first comment in a thread matter more than the policy document, because they decide which script fires. Ask, for each of the group's artifacts, which script it summons. A retro that opens with \"whose fault was it?\" retrieves a blame script whatever the written policy says; one that opens with a timeline template retrieves an analysis script. Close **moral wiggle room** the same way: remove the situational features that let someone dodge a norm without visibly violating it (hidden links between choices and consequences, exits that avoid the observed act).\n\nNow the caveat that gives this idea its [H] tag, and that the ledger states as a rule (37, C12). Much of the psychology of \"priming\" (elderly-related words slowing walking, money cues, cleanliness cues) has replicated poorly or not at all; the course never builds on behavioural priming. Bicchieri's script story is imported from cognitive psychology (Schank and Abelson) and situationism (Darley and Batson's Good Samaritan study), and it is more robust than specific priming effects: that situations are categorised and categorisation carries expectations is well supported. But it is asserted more than tested in the book, and **any specific cue-to-norm mapping in your group is a hypothesis** to be checked locally, not a fact to be installed. Do not write \"priming\" in the brief for what Bicchieri means by activation; write \"cue\" or \"script\", and attach a test: change the template, measure the expectation items again, see whether the classification moved.\n\nOne more distinction worth holding. Norm-based utility might suggest that people calculate; chapter 2 argues the opposite. The utility function is the analyst's description of the resulting preference, not the agent's deliberation. That is why the lever is the cue and not the argument: you are not persuading anyone, you are changing which stored template the situation retrieves."}],"worked_example":{"title":"Addressing a 'crunch is normal' culture with a leadership statement (you write the measurement items)","steps":["Classify before acting. Is crunch a descriptive norm (people match the hours they see), a social norm (people believe others expect it and would disapprove of leaving on time), or a convention (nobody gains by leaving alone, because the work is genuinely coupled)? A leadership statement targets only normative expectations, and only if the source is credible in the relevant reference network. If crunch is a descriptive norm, the statement changes nothing that anyone is matching.","Measure before acting. Draft the four two-step items for 'leaving at a normal hour when the sprint is behind': what do you do; what do most people on this team do; what do most people on this team think you should do; what would happen if you left at six today. Add one item on sanctions: who, if anyone, would notice and what would they say. Decide who answers (the team, not the org), and that answers are anonymous and reported only in aggregate.","Read the result. If private attitudes reject crunch but perceived normative expectations support it, it is pluralistic ignorance: publish the gap credibly and recruit a visible, credible trendsetter with low sensitivity to the norm to leave on time first, ideally in a coordinated switch. If private attitudes support crunch, it is not pluralistic ignorance; the intervention is a rule with monitoring and standing (m8), not a revelation, and the statement alone will be read as words.","Pair the channels and mind the cues. Whatever is published, pair the descriptive signal with the injunctive one, and never publish the share who crunch (ledger rule 24). Check which script the team's artifacts summon: a sprint board that shows late-night commits as heroics is a cue for the crunch script; change it before expecting the statement to hold.","Tags. [E] for the diagnosis method (two-step elicitation, validated with design caveats). [H] for the trendsetter intervention (case studies, not controlled tests) and for the specific cue changes. [V] that crunch should be reduced at all; the measurement cannot tell you that."]},"hinge":[{"q":"A community's rule says \"cite sources\". Most posts do not. Members, asked privately, say others do not care. Which classification and lever?","options":["It is a social norm being violated; punish the violators, since a sanction is what restores a rule's force.","It is a moral norm that needs values work, since citing sources is about integrity rather than what others do.","It is a descriptive norm; publish that most posts lack sources, so members realise how far the rule has been allowed to slip.","It is a dead rule with neither expectation behind it; build both, starting with visible compliance by credible members."],"answer":3,"diagnoses":["\"A social norm is what the rules say\" plus sanctions as the only lever. The normative expectation is absent (members say others do not care), so the norm does not exist in Bicchieri's sense; punishing violators of a rule nobody expects anyone to keep reads as arbitrary.","Norms as internalised values (ledger C43). Nothing here is unconditional; values work targets the wrong object when the missing pieces are beliefs about other members.","Advertising the prevalence of misbehaviour (ledger rule 24). Publishing that most posts lack sources strengthens the empirical expectation of non-compliance; it is the Petrified Forest sign.","Correct. A rule with neither expectation is not a norm of any kind. Both expectations have to be built: visible compliance by credible members supplies the empirical one, expressed expectations and mild sanctions the normative one (`08` ch 1)."]},{"q":"A team's \"no blame in post-mortems\" practice holds firm even after the manager who introduced it leaves and a new manager visibly blames. What can you now conclude?","options":["It survived a collapse of expectations, so treat it as internalised or moral for these members.","It was a convention, since a practice that outlives its founder is a coordination habit rather than a norm.","It is proof that norms are always internalised, since this one survived the loss of both its sponsor and its model.","It will collapse within a month, so wait, since conditional norms lag the visible change in what others do."],"answer":0,"diagnoses":["Correct. The agreed operational test (ledger rule 10): a norm is assumed conditional until compliance persists after people believe others no longer comply or care. Here a credible visible defector changed the expectations and compliance held.","Convention as any stable practice. A convention is a coordination equilibrium sustained by empirical expectations; it would flip with the visible majority, since nobody gains by deviating only while others conform. This one did not flip.","Generalising from one survival to the Henrich/Gintis position. The internalisation debate is open (ledger X9); the course's rule is a default assumption and a test, not a law in either direction.","\"All norms are conditional\" as a law rather than a default assumption. The default exists because conditional norms are cheaper to lose; when the test has been passed, the default is overridden."]},{"q":"Why does ten minutes of relevant discussion before a public-goods round raise cooperation, according to Bicchieri?","options":["It lets people make binding commitments, since a promise made in front of the group is enforceable by it.","It creates or makes salient the empirical and normative expectations a cooperation norm needs.","It builds group identity, which is the whole effect, since people cooperate with those they feel part of.","It does not; talk is empty at equilibrium, since anyone can promise and the promise costs nothing to make."],"answer":1,"diagnoses":["Commitment as binding (`08` misreading). The promises in these experiments are unenforceable; there is no sword.","Correct. Talk lets people discover that a norm applies, form empirical expectations that others will cooperate, and form normative expectations by hearing what others think ought to be done and by making promises they will be held to; the sword is anticipated disapproval (`08` ch 4).","Partly right, wrong level. Identity accounts cannot explain why only *relevant* talk works and irrelevant talk does almost nothing; the expectations account can.","\"Talk is empty\" (ledger rule 12). Relevant discussion roughly doubled cooperation in Dawes, McTavish and Shaklee 1977 (background figure) and communication is the strongest lever in the meta-analyses; the decay caveat applies where defection dominates, but the effect is real."]},{"q":"Bicchieri's account of fair behaviour in experiments is best summarised as:","options":["People have a taste for fairness of fixed size, which shows up as a stable share given away across games and settings.","People are selfish and fairness is an illusion, since giving collapses once the experimenter cannot see.","Fair behaviour is norm compliance cued by observation, entitlement and expectation; remove the cues and it fades.","Fairness is primed by subtle cues like words and images, so the right poster in the room raises giving."],"answer":2,"diagnoses":["Fixed social preferences (ledger X8). A fixed taste cannot explain why giving collapses under double-blind anonymity, falls with earned entitlement and shifts with moral wiggle room; the course's rule 9 says no single social-preference model is [E].","Over-reading \"no taste for fairness needed\" as \"no fairness\". Bicchieri allows moral norms as a residual category, and the behaviour is real; her claim is only that a fixed preference is not needed to explain most of it.","Correct, with the critics' caveat included: the course presents norm-based utility as its working model, argued from fit rather than shown, and notes that expectations alone do not say which division people expect (`08` ch 3; ledger rule 38).","Equating script activation with behavioural priming (ledger rule 37). Much priming work has failed to replicate; the course never builds on it. Cue-driven categorisation is more robust, and any specific cue-to-norm mapping is [H]."]}],"brief_prompt":"Add section s8, the norm register. Build a table of the group's three most important 'norms'. For each: the classification (descriptive, convention, social, moral) by the expectations that sustain it; the measurement you will run (the four two-step items plus a sanction item, and who answers); the pluralistic-ignorance gap you expect; the current descriptive and injunctive signals and whether they agree; and the cue set (templates, openers, channel names) that summons the script. Tag each row: [E] for the method, [H] for your classification until measured. Prediction: which one norm will collapse if a visible member deviates, and which will not.","deeper":["books/08-grammar-of-society.md#ch-2--habits-of-the-mind","books/08-grammar-of-society.md#ch-6--the-evolution-of-a-fairness-norm-with-appendix","books/08-grammar-of-society.md#common-misreadings-of-this-book","books/03-social-psychology.md#ch-9--social-influence-5e-numbering","books/10-networks-crowds-markets.md#ch-16--information-cascades"]},{"id":"m8","num":8,"title":"Institutions for the commons: design principles, sanctions, polycentricity","level":"Order","minutes":70,"sources":["09-governing-the-commons","04-games-of-strategy"],"hook":"A village capped how many cows each household could send to the shared alp in a rule dated 1517, and the rule is still in use. No state wrote it and nobody privatised the pasture. What did the villagers have that the textbook herders did not? (The date is background, via Netting.)","attempt":{"prompt":"An engineering org shares a CI cluster. Queues are long, some teams submit huge jobs, and the platform team plans per-team quotas enforced by automatic lockout. In ten lines, predict what happens in three months and propose an alternative. Say who would monitor, who could change the rule, and what the first response to a violation would be. No reading first.","minutes":12},"objectives":["Say why the tragedy of the commons is a tragedy of open access, and check whether members can communicate, observe each other and change their rules before calling anything a free-rider problem.","Run the eight design principles (in Cox's split version) as a diagnostic checklist against a real group, mark each present, absent or not applicable, and flag scope where the shared thing is not a subtractable resource.","Design graduated sanctions, by-product monitoring and a cheap dispute forum, and say why a small first sanction keeps a rule alive where a severe one kills the information flow.","Say which level of rules (operational, collective-choice, constitutional) a stalled reform is failing at, and who has standing to change it."],"ideas":[{"title":"The tragedy is one of open access, not of shared property: check the channels before the matrix","tag":"E","body":"Three models dominated policy thinking about shared resources in 1990, and Ostrom's first chapter shows each is a special case misused as a general law. Hardin's **tragedy of the commons**: each herder adds cattle to a shared pasture because the gain is private and the cost is shared, until the pasture is ruined. The **prisoner's dilemma**: two players, one shot, a dominant strategy to defect. Olson's **logic of collective action**: in a large group no rational individual contributes to a public good, because the contribution is imperceptible and non-contributors cannot be excluded. All three forecast overuse and no cooperation, and they are structurally the same game.\n\nThe models are valid; their assumptions do the work. Users are assumed unable to communicate, unable to change the rules of the game they are in, unable to make binding agreements, unable to monitor and exclude, with no shared past or future. Hardin's pasture is *open access with no rules*, which is not what most real commons are. The tragedy is right for open access and wrong as a description of communal property. Because the models were read as universal, two prescriptions followed, each claiming to be the only way: a central authority must impose and enforce rules, or the commons must be privatised.\n\nThe empirical counter-example that opens the book is the inshore fishery at Alanya, Turkey. Fishers list eligible boats, name the fishing spots, assign them by lot in September and rotate boats through the spots daily, so everyone gets the best sites in season. A violator is displacing the boat entitled to the spot, so monitoring is a **by-product of fishing**. No state design, no private ownership of the sea. The same situation (many boats, few good spots) is a PD if you assume no communication and no rule-making, and a solvable assignment problem if users can meet, agree and observe each other. The error is treating a model of a situation as if the participants could not change the situation.\n\nOstrom does not claim self-organisation always works. The claim is that a third class of solutions exists, succeeds and fails for identifiable reasons, and was ruled out by the dominant prescriptions by assumption rather than evidence. Ledger C49 gives the exact wording the course uses: **\"PD as a law of nature is wrong; PD as the open-access case is right.\"** She refuted the PD as a law; it remains valid for open access; participants can, and do, move themselves into a different game.\n\nSo the designer's first move, before treating any problem as free-riding, is to ask whether members can talk, see each other's behaviour and change their own rules. If any of the three is blocked, that is the problem; the payoff matrix is the symptom. \"Centrally imposed process with no team ownership\" blocks the third channel; \"staff-only moderation\" blocks the second and third.\n\nA scope note the ledger requires (C48). The book is about **common-pool resources**: a resource *system* (fishery, basin, canal) producing a flow of *units* (fish, acre-feet, water turns) that are **subtractable** (what I take, you cannot) and from which exclusion is costly. That separates *appropriation* problems (who gets how much, when) from *provision* problems (who maintains the stock). A codebase, an on-call rota or a shared budget may be a CPR; a community's attention and civility are not subtractable in the same way, and knowledge commons and open source found only partial fit. Flag the scope whenever you apply the checklist to something digital."},{"title":"Monitoring and commitment are one problem, and first sanctions are small","tag":"E","body":"Any theory of self-organisation has to solve three puzzles that standard theory says cannot be solved. **Institutional supply**: new rules are a public good, so who supplies them? **Credible commitment**: why keep a rule when defecting pays and no state enforces? **Mutual monitoring**: monitoring is costly and a public good, so why does anyone monitor? The prediction is that none happens; the cases show all three. The key to the second and third is that they are not two puzzles but one.\n\nOstrom's appropriators are boundedly rational, fallible, norm-following people under uncertainty about the resource and about each other. They adopt a **contingent strategy**: \"I follow the rule if most others do and I expect to be caught if I do not.\" Commitment is therefore cond
