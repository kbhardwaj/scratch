vs enforcement and commitment","pole_a":"most cooperation problems are trust problems; with repetition and reputation they are stag hunts, and what they need is assurance, which cheap talk provides. Skyrms (`07`): the social contract is a stag hunt, not a prisoner's dilemma; talk is a transient handshake that expands the stag basin. Dixit et al. (`04`): most cooperation problems are not PDs; visible pledges and thresholds (\"we start when ten sign up\") reach the good outcome cheaply. Bicchieri (`08`): relevant face-to-face discussion is the strongest lever on public-goods and PD cooperation, from roughly 30% to roughly 70% in an eight-person dilemma (Dawes, McTavish and Shaklee 1977, background; quote as \"roughly doubled\"), with Sally 1995 and Balliet 2010 behind it; Gilovich et al. (`03`) and Ostrom's lab work agree.","pole_b":"many group problems are genuine multi-person PDs, talk does not fix them, and what they need is a payoff change, repetition with fast detection, sanctions or a costly commitment. Ostrom (`09`): open-access commons and the California pumping race were real PDs; she refuted the PD as a law, not as the open-access case (ledger C49). Schelling (`05`) built the binary-choice diagram to tell MPDs from coordination and warns communication will not fix an MPD. Dixit et al.: cheap talk informs only when interests align; the alternatives are costly signals that separate committed from opportunistic types, commitment devices and credible sanctions. Skyrms concedes mimics invade talkers in a true PD; Camerer (`06`) shows contributions decay over rounds and recover with punishment.","rule":"IF nobody gains by defecting against full cooperation THEN build assurance and stop building enforcement: public intent statements, opt-in pledges, threshold launches, a leader naming the target. IF a member does gain THEN still hold relevant talk before the mixed-motive decision (extract explicit promises), but pair it with what stops decay: repetition with defection detected within a round or two, graduated sanctions, or a payoff change; where membership is the lever, screen with a costly signal whose cost is higher for opportunists. IF you cannot tell THEN run the talk first because it is cheap and watch whether cooperation decays over the following rounds; decay is the PD's signature. Never treat \"we discussed it and agreed\" as durable where defection pays (ledger #12), and never build sanctions for a trust problem.","switch_signal":"Toward enforcement: cooperation after a good discussion sags round on round; promise-keepers end up worse off than promise-breakers; free riders increase rather than persist. Toward assurance: defections come in waves triggered by doubt about others rather than by opportunity, and sanctions when tried hit people who were merely uncertain. Measure cooperation at the meeting and again several rounds later.","evidence":"The poles agree on the diagnostic, binding in the ledger (X11, #13): does a member gain by defecting when everyone else cooperates? Yes: PD, needing payoff change, repetition or sanctions. No: stag hunt, needing assurance. Skyrms's thesis that the social contract is a stag hunt is interpretive and untested; some commons are PDs at the margin. On talk the disagreement is narrower than it looks (X12, ledger #12): Skyrms's agents have no normative term, so talk is transient in his PD models; Bicchieri's account, that relevant talk creates empirical and normative expectations and turns the PD into a coordination game for human subjects, explains the lab effect. Cheap talk is [E] in the lab for humans in PDs and public goods, [E] in models for stag hunts, and expected to decay without sanctions or repetition where defection dominates. Costly signals and commitment are theorems in `04` with the [H] caveat that any given ritual has the required cost asymmetry. Studies: Dawes, Sally's meta-analysis, Ostrom-Walker-Gardner, Camerer's decay curves. [E for the diagnostic and the lab effect of talk; H for persistence and any group's classification; V for preferring assurance to enforcement where both would work.]","sources":["03-social-psychology","04-games-of-strategy","05-micromotives-and-macrobehavior","06-behavioral-game-theory","07-stag-hunt","08-grammar-of-society","09-governing-the-commons"]},{"id":"t08","name":"Group-level selection vs within-group mechanisms","pole_a":"cooperative norms exist because groups carrying them out-competed, out-grew or were imitated over groups without them; the unit of design is the group's norm package and identity. Henrich (`01`): cultural group selection (war, migration, imitation, differential growth) selected cooperation-enhancing norm packages; the Nuer and Ilahita are the cases. Gintis (`11`) leans on group selection for strong reciprocity. The Origins books share a second hypothesis, that culture drove brain expansion (Henrich: the payoff of learning from others; Laland: a fidelity threshold plus teaching; Street et al. 2017, verified, correlational).","pole_b":"cooperation is scaffolded by socially learned norms and within-group mechanisms (reciprocity, reputation, punishment), which suffice; group selection is weakly evidenced and the brain story is contested. Laland (`02`) is explicitly sceptical of cultural group selection; the 2016 Richerson et al. target article drew many critical commentaries asking whether between-group variation is large and stable enough and whether imitating successful groups is selection at all. On brains, DeCasien et al. 2017 found diet predicts primate brain size better than sociality.","rule":"IF you are choosing between an identity intervention (rivalry, superordinate identity, \"our way\") and a within-group mechanism THEN build the within-group mechanism first and treat identity work as an accelerant tagged [H]. IF you use inter-group competition as a motivator THEN pair it with structured contact and a superordinate goal across the boundary, because the psychology that binds the in-group generates hostility across it. IF you import a norm package THEN copy from a visibly successful peer group and craft locally (t06). Never justify a design by \"groups with this norm out-compete groups without it\" (ledger #5).","switch_signal":"Toward the group-level pole: cooperation inside is already reciprocal and monitored and the residual problem is commitment to the collective as such (turnover, indifference, no shared story). Toward the within-group pole: strong identity coexists with free-riding, or identity work has produced hostility to adjacent teams without raising contribution. Track contribution and identification separately.","evidence":"The poles agree on within-group mechanisms and on their being the evidenced part; they agree culture and brains co-evolved in some direction; they agree Nuer and Ilahita are illustrative, not statistical (the 01 file says so). The ledger fixes the design consequence (X2, X3; ledger #5, #7): within-group mechanisms are [E]; cultural group selection is [H] and never the load-bearing explanation for a design recommendation; culture-drove-brains is [H]. The tension is kept because it changes what a designer reaches for: a group-selection lens suggests inter-group competition, a superordinate identity and copying whole norm packages; a within-group lens suggests reciprocity, observation, reputation and sanctions. The files support both partially at the design level: minimal-group favouritism and intergroup contact (reliable moderate effect across 500+ studies, Pettigrew and Tropp 2006, background; rigorous field experiments fewer and smaller) are robust in `03`; Robbers Cave is a demonstration, not an estimate (ledger C19); copying a peer group's package is [H] (t06). The Origins evidence is Henrich's, Boyd's and Richerson's against Laland's and DeCasien's; none of it tests team-level interventions. [H for group selection and culture-drove-brains; E for within-group reciprocity, reputation and sanctions; H for identity interventions in your group.]","sources":["01-secret-of-our-success","02-darwins-unfinished-symphony","03-social-psychology","11-bounds-of-reason"]},{"id":"t09","name":"Closure and homophily vs bridges and diversity","pole_a":"dense, closed, similar groups are where trust, enforcement and complex contagion work; protect closure and bounded membership. Easley and Kleinberg (`10`): closure gives trust and enforcement (ch 3); costly behaviour needs several adopting neighbours and does not jump a single weak tie (complex contagion, ledger #34); a cluster of density above 1 − q blocks an outside norm and protects an inside one; homophily is pervasive and measurable (fewer cross-boundary edges than 2pq, theorem). Skyrms (`07`) makes correlation his master variable. Ostrom (`09`) finds the principles hold in small, dense, bounded groups.","pole_b":"connectivity, bridges and heterogeneity are where information, innovation and skill retention come from; silos lose skills and homogeneous groups polarize. Henrich and Laland (`01`, `02`): better-connected learning networks retain and innovate more; isolation loses skills (Tasmania, contested; lab transmission chains, small scale). Easley and Kleinberg: bridges tend to be weak ties (Onnela et al. 2007, robust) and carry novelty. Gilovich et al. (`03`): homogeneous groups polarize; inject outside views before decisions and guarantee a credible dissenter. Laland's tournament: pure-copier populations stagnate; pay for innovation.","rule":"IF the job is to hold a costly norm, enforce it and spread it neighbour by neighbour THEN keep units small, dense and bounded, and when spreading to a resisting cluster build wide bridges (several parallel ties) or seed inside it. IF the job is information, innovation or retaining rare skills THEN find and protect the local bridges (usually weak ties, which decay unattended), rotate demonstrators into silos, and pay explicitly for innovators. IF a homogeneous group is about to decide THEN inject outside views before, not after, and have leaders speak last. Never say \"clusters are bad\" or \"more connection is always better\" (ledger #3, X15), and never infer influence from similarity.","switch_signal":"Toward closure: a seeded norm keeps failing because nobody's neighbours have adopted it, or enforcement fails because violators have no repeated dealings with anyone who saw them. Toward bridges: the same solutions are reinvented in different subteams, a rare skill sits with one person, or decisions are unanimous fast and wrong. Counts: the 2pq ratio for the traits you care about; parallel ties between subgroups; holders per critical skill.","evidence":"The ledger's resolution of X15 is \"both\": connectivity for information and skill retention; closure and bounded membership for enforcement and complex contagion. Two corrections discipline it: the population-size claim is contested (Vaesen et al. 2016) and reframed as connectivity, not head-count (ledger #6); and \"useful information comes from weak ties\" is not robust (Gee et al. 2017 found most jobs via strong ties, background), only the structural claim that bridges tend to be weak (ledger #33). The disagreement is a design trade-off, not a factual one: every unit of closure added for enforcement and costly-norm spread is a unit of bridging forgone for information. Homogeneity and diversity map onto it: homophily produces the clusters that hold norms and block them (X7) and the polarization `03` warns about; diversity produces dissent and novelty and weakens complex contagion. Influence versus selection is unresolved for any observed similarity (Shalizi and Thomas 2011; ledger #35). Studies: Granovetter, Onnela, Centola, McPherson; Henrich's and Laland's transmission work; the polarization literature. [E for the trade-off and each mechanism; H for the right mix; V for how much diversity of view you want at the cost of speed of alignment.]","sources":["01-secret-of-our-success","02-darwins-unfinished-symphony","03-social-psychology","07-stag-hunt","09-governing-the-commons","10-networks-crowds-markets"]},{"id":"t10","name":"Broadcasting the majority vs building normative expectations","pole_a":"make the target behaviour look like majority behaviour; people copy the majority under uncertainty. Henrich (`01`): conformist transmission; publish counts where adoption is high and never advertise low adoption, because \"most people don't do this\" is itself transmitted. Gilovich et al. (`03`): descriptive-norm feedback on energy use gives about a 2% reduction, small but reliable at scale (Allcott 2011, background); Asch conformity holds across 133 studies in 17 countries (Bond and Smith 1996, verified), with about a third of critical trials and about 75% of participants conforming at least once in the original (background).","pole_b":"empirical expectations alone do not make a social norm; without the normative channel descriptive messaging misfires and can boomerang. Bicchieri (`08`) defines the social norm by both expectations and reads the mixed results of social-norms marketing, boomerangs included, as confirmation. Gilovich et al. agree from the other side: Schultz et al. 2007 found below-average users increased consumption when told the average unless an injunctive smiley was added; the Petrified Forest sign advertising theft raised theft.","rule":"IF the target behaviour is already the majority's THEN publish the count and pair it with a visible approval signal so the two channels align. IF it is a minority's THEN publish no prevalence; measure the expectation gap (what do you do; what do most do; what do most think you should do; what happens if you don't) and, where private attitudes are better than perceived norms, make the gap common knowledge through a credible source. IF the behaviour is mixed-motive THEN never rely on the descriptive channel alone; add the normative one, backed where needed by t02's sanctions. Never advertise how common misbehaviour is in order to shame it (ledger #24).","switch_signal":"Toward broadcasting: private attitudes and behaviour are both good and only perceived prevalence is wrong. Toward the normative channel: after a favourable count is published, above-norm members regress toward it, or people can state the count and still do not believe anyone expects them to comply. Run the four-question elicitation before and after any messaging.","evidence":"The file's clearest false tension once the taxonomy is read properly. The ledger records X14 as agreement once stated carefully (ledger #24): descriptive and injunctive signals must point the same way, and the injunctive channel is required for mixed-motive behaviour. Henrich's \"use conformity deliberately\" and Bicchieri's \"empirical expectations are necessary, not sufficient\" are one rule stated from two levels. The residue is small: Henrich's conformist bias operates where payoffs are uncertain and matching the majority is informative; Bicchieri's social norms operate where one gains by deviating and must believe others disapprove. Pluralistic ignorance (`08` ch 5, `03`) is the failure mode both recognize: most privately reject a norm, believe others accept it, and comply; disapproval must become common knowledge (ledger C44). Studies: Cialdini and Schultz on the boomerang; Allcott's field trial; Asch and Bond-Smith; Prentice and Miller on campus drinking; Bicchieri and Xiao 2009 (verified). [E for the pairing rule and the boomerang; H for the effect size in your group; V for whether nudging by counts is a legitimate way to treat members.]","sources":["01-secret-of-our-success","03-social-psychology","08-grammar-of-society"]},{"id":"t11","name":"Mis-specified preferences vs unstable beliefs","pole_a":"behavioural anomalies (loss aversion, hyperbolic discounting, social preferences) are state-dependent consistent preferences; write down beliefs, preferences and constraints and the anomalies dissolve into the model. Gintis (`11`) keeps the rational actor and widens the utility function (BPC). Its design payoff, tagged [E] in the 11 file, is a discipline: for any failure ask what members believe about each other, what they value and what constrains them; most \"incentive\" fixes change constraints while beliefs about others stay put. Camerer's parametric programme (`06`) is the empirical cousin.","pole_b":"many anomalies are shifts in belief with presentation, mood and motive, not preferences of any shape; and learning is path-dependent rather than a fixed point. Gilovich et al. (`03`): construal, framing, naive realism, motivated reasoning; the same matrix roughly doubles cooperation under a \"Community Game\" label (Liberman, Samuels and Ross 2004, background, on `03`'s robust list). Camerer's learning chapter: convergence is path-dependent; feedback and early rounds matter, while EWA's parameters do not carry the load (ledger C64).","rule":"IF a behaviour persists across labels, framings and experience THEN treat it as a preference and change payoffs or constraints. IF it moves with the label, the order of information or the first rounds THEN treat it as a belief: relabel the game, seed the first rounds deliberately (first splits set the attractor, `08`, [H]), show forgone payoffs, expect convergence with feedback. IF you do not know THEN write the BPC table for the puzzling members and check which column your intended fix touches; the usual error is changing a constraint when the problem is a belief about others. Never build a belief intervention on priming, depletion or posture (ledger #20).","switch_signal":"Toward preferences: relabelling and re-sequencing have been tried and behaviour is unchanged; experienced members behave like novices. Toward beliefs: behaviour differs between two teams under identical incentives, shifts when a respected member's public stance shifts, or converges over rounds toward what the payoff model predicts. Run the same decision under two labels and compare.","evidence":"The 11 file's own verdict on the reframing is \"partially holds up; overstated\", and the ledger follows (X16): use BPC as bookkeeping, do not claim it explains construal effects, and note the falsifiability worry (once preferences may be state-dependent and norm-inclusive, what observation refutes the model?). The poles agree rationality is not selfishness and the anomalies are real; they disagree whether calling them preferences adds anything. The stakes are practical: a preference means change payoffs; a belief means change information, framing and the first rounds. The record is asymmetric. The construal effect and Nagel's beauty-contest result (first-round average about 35-36, verified, converging toward zero with repetition) are clean demonstrations that first-contact behaviour is belief-driven and learnable. But `03`'s broader belief-manipulation literature contains failures the course must not build on (priming; ego depletion at d = 0.04 with CI including zero, Hagger et al. 2016, verified; power posing; ledger #20), so \"it's all framing\" is not a licence either. Gintis ran no experiments for this claim; the framing evidence is Ross's; the learning evidence is Camerer's. [H for BPC as explanation; E for framing and first-round belief effects; E for BPC as a bookkeeping discipline.]","sources":["03-social-psychology","06-behavioral-game-theory","08-grammar-of-society","11-bounds-of-reason"]},{"id":"t12","name":"Explicit incentives and metrics vs norm-based motivation","pole_a":"make contribution a best response with explicit incentives and measurable accountability. Dixit et al. (`04`): prices, penalties, monitoring at a probability roughly gain divided by penalty, screening. Easley and Kleinberg (`10`): institutional edits over exhortation. Ostrom (`09`): monitoring is a design principle, a by-product of participation in every durable case, and sanctions are graduated but real. Camerer (`06`): contributions decay without punishment and recover with it.","pole_b":"norms exploit an existing disposition, are cheaper to maintain, and explicit payment and scorekeeping can crowd them out. Gintis (`11`) tags \"prefer the norm to the incentive when both are available\" [H]: crowding out is real but context-dependent. Gilovich et al. (`03`): overjustification; introducing scorekeeping into a communal team damages it ([E] for the mechanism); use small voluntary public commitments and modest rewards. Ostrom's field evidence (Cardenas, background): weakly enforced external regulation crowds out communication-driven cooperation. Camerer's field result: above-market pay boosted effort for the first few hours only and cost more than it returned (Gneezy and List 2006, verified), while cuts and non-monetary gestures have larger, more persistent effects (Kube et al. 2012, background; ledger #28). Dixit's own caveat: partial-metric incentives displace unmeasured effort; with noisy output, lean on norms and reputation.","rule":"IF the behaviour is a genuine PD contribution people will not make on trust (t07) THEN attach real accountability, but make monitoring a by-product of the work (visible commits, public rotas) and the first sanction cheap and graduated; reserve financial incentives for measurable, low-noise outputs. IF the behaviour is one you want members to own (review quality, mentoring, speaking up) THEN use small public commitments, modest recognition and norms; never introduce individual scorekeeping into a communal team without expecting damage, and if a metric is needed make it collective. IF you must use a metric THEN name the unmeasured effort it will displace and monitor that too, and treat any reward cut or broken promise as a strong negative-reciprocity event. Never buy contribution with a raise and expect it to last (ledger #28), and never leave a PD to run on norms alone without observation.","switch_signal":"Toward incentives: contribution decays despite talk and visibility, free riders are stable and identifiable, output is measurable with low noise. Toward norms: after a metric or reward appeared, the measured behaviour rose and an unmeasured one fell, members began asking what they get for things they used to do, or the boost faded within days. Track the measured behaviour and at least one unmeasured behaviour that shares its effort budget.","evidence":"This is the measurement-and-accountability tension, and the files agree more than the poles suggest. Everyone accepts that some observation is necessary (t02 needs monitoring, t05 needs identifiability, Ostrom's principle 4) and that money is a weak, decaying lever for positive reciprocity and a strong one for negative. The narrow disagreement is form: accountability as an explicit metric with attached reward, or as by-product visibility (public logs, turn-taking that exposes cheaters) that keeps empirical expectations accurate without turning a communal relationship into an exchange one. The ledger's rules lean to the by-product form (#28, #30) while keeping `04`'s credible-sanction requirement. Caveats: crowding out is context-dependent ([H] in `11`); the scorekeeping warning is [E] for the mechanism and [H] for your group; measurement displacement is theory plus [H]. No single study pits a metric against a norm in a team; this paragraph is assembled from five files' side remarks. Studies: Gneezy and List, Kube, Cardenas, the overjustification paradigms, the Cox review. [E for monitoring and cheap sanctions being necessary and for pay as a weak positive lever; H for crowding out in your group; V for whether members are exchange partners or a community.]","sources":["03-social-psychology","04-games-of-strategy","06-behavioral-game-theory","09-governing-the-commons","10-networks-crowds-markets","11-bounds-of-reason"]},{"id":"t13","name":"Shifting expectations vs changing structure","pole_a":"change a norm by changing what people expect of each other; the levers are measurement, publicity, talk and trendsetters, inside one reference network. Bicchieri (`08-grammar-of-society`): a norm lives in empirical and normative expectations, so elicit them (what do you do; what do most do; what do most think you should do; what happens if you don't), publish the gap where private attitudes are better than perceived norms, hold relevant talk, and recruit trendsetters (low sensitivity to the bad norm, high credibility in the reference network; [H], case studies from sanitation and child-marriage programmes). Bicchieri and Xiao (2009, verified) showed expectations of selfishness reduced giving even under pro-giving messages, which is why expectations, not attitudes, are the target. Gilovich et al. (`03`) supply pluralistic ignorance and the Community Game relabelling (roughly doubled cooperation, background).","pole_b":"change the structure that decides who sees the signal and whether switching pays; the levers are thresholds, payoffs, seeding, clusters, bridges and rules. Schelling (`05-micromotives-and-macrobehavior`): aggregate outcomes are properties of threshold distributions and payoff curves; a tipping point is an unstable equilibrium and the scarce resource is low-threshold actors, not charismatic ones (ledger #18, C30); attitudes move the tipping point but do not remove the dynamic (Card, Mas and Rothstein 2008, verified: tipping at roughly 5-20% minority share, higher where measured tolerance is higher). Easley and Kleinberg (`10-networks-crowds-markets`): adoption spreads when the adopting-neighbour fraction exceeds q = b/(a+b) (theorem); a cluster of density above 1 − q blocks it; the fixes are lower q, seed inside the cluster, build wide bridges. Skyrms (`07`): correlation, not persuasion, moves a population between basins. Ostrom (`09`): change rules, boundaries and monitoring, and expectations follow. The `10` file names the tension directly: Bicchieri targets expectations; Easley and Kleinberg target structure and payoffs.","rule":"IF the group is one reference network (members see each other and the same signal reaches everyone) and the elicitation shows a gap between private attitudes and perceived norms THEN shift expectations: publish the gap through a credible source, hold relevant talk, extract public commitments, and seed with low-threshold high-credibility members chosen for position, not charisma. IF the group is several clusters, adoption is stuck below q in the cluster that matters, or the lone adopter pays a real cost THEN change structure first: lower q (tooling, defaults, compatibility), seed inside the resisting cluster, build wide bridges, change the rule or the monitoring, and let expectations follow. IF the outcome looks like a character problem THEN model the interaction before blaming anyone: is behaviour contingent, does an accounting constraint force the outcome, where is the threshold. Never run an expectations campaign across clusters that cannot see each other, and never use the Gladwell sense of \"influencer\" (ledger #18).","switch_signal":"Toward structure: expectations have been measured and published, people can state the correct count and the norm, and adoption is still stuck in specific subgroups, or those who switched first are visibly worse off. Toward expectations: the structure has been changed (q lowered, seeds placed, rules rewritten) and the same behaviour persists among people who see each other daily and still believe the others do not care. In both directions: swap the people and keep the structure, then the reverse, and see which the pattern follows.","evidence":"The poles agree on more than they admit. Bicchieri's trendsetters are Easley and Kleinberg's seed set and Schelling's low-threshold nodes (glossary; `10` connections); Schelling's thresholds are Bicchieri's conditional preferences in population form (`05` connections); Ostrom's monitoring is how empirical expectations stay accurate (`09` connections). Both reject the dispositional reading: the fundamental attribution error is robust (`03`), Schelling's model shows mild preferences can produce extreme sorting, and the course's rule is to diagnose situationally before dispositionally (ledger #17, C23). The narrow disagreement is scope and sequence. Expectation work assumes everyone is in one reference network and can see the same signal; the `03` file adds that Bicchieri is more optimistic about correcting beliefs alone than the identity and dissonance literature warrants, and social-norms marketing has mixed results including boomerangs (t10). Structure work assumes payoff and network conditions are what block adoption; it says nothing about what a norm is to the agent, and `07`'s dynamics have no beliefs in them at all. The seed list's resolution is the course's: expectations where the group is one reference network; structure where clusters and bridges decide who sees the signal. Schelling's claim that structure explains most group failures is a hypothesis in any given group, and the model's fragility to preference shape is disputed (Bruch and Mare 2006 against Van de Rijt et al. 2009). Studies: Bicchieri's field programmes and elicitation experiments; Schelling's demonstrations and the Card-Mas-Rothstein tract data; Granovetter's threshold model; Kleinberg's theorems; Centola's clustered-network experiment (direction only). [E for each mechanism; H for which one blocks your norm and for trendsetter interventions; V for whether the equilibrium you steer toward is one the members would choose.]","sources":["03-social-psychology","05-micromotives-and-macrobehavior","07-stag-hunt","08-grammar-of-society","09-governing-the-commons","10-networks-crowds-markets"]},{"id":"t14","name":"Small bounded groups vs open scale","pole_a":"cooperation is a small-group phenomenon; the evidence lives in bounded, dense, stable groups, and scale is handled by nesting, not growing. Ostrom (`09`): clear boundaries are principle 1 (ambiguous membership is the commonest structural cause of decay, [E]) and nested enterprises principle 8; her cases are small and bounded, outsiders are excluded, and several durable systems are inegalitarian. Camerer (`06`): weak-link groups of 14-16 collapsed while fixed pairs reached the top (Van Huyck et al. 1990); cap the group whose minimum matters. Gilovich et al. (`03`): working units of 2-5 to limit loafing (a rule of thumb, [H]). Skyrms (`07`): small stable neighbourhoods are the correlation device. Dixit et al. (`04`): with many players, who punishes whom is hard.","pole_b":"larger, connected populations retain more knowledge and innovate more; open membership is where growth, information and legitimacy come from, and gradual growth can carry coordination to scale. Henrich and Laland (`01`, `02`): cumulative culture depends on the size and connectivity of the learning network (contested as head-count, ledger #6). Camerer: large groups grown from a small core with visible history sustain high effort (Weber 2006, verified, single-lab lineage). Easley and Kleinberg (`10`): short paths exist in any large network; a network-effect practice is worth more the more use it, and adoption above the tipping point self-sustains. Ostrom's own scope note: the book concerns subtractable resources with costly exclusion; knowledge commons and open source found partial fit with principles 1 and 2 reinterpreted (ledger C48), which is the learner's platform case.","rule":"IF a behaviour depends on the minimum contributor, on mutual observation or on sanctions THEN keep the unit small (a handful; 2-5 is `03`'s rule of thumb, [H]), bounded and stable, and scale by nesting: local units govern local problems, a higher layer handles conflict between units and shared infrastructure. IF the goal is knowledge, innovation or a network-effect practice THEN grow, but from a small core with a visible success record, and estimate whether adoption is above the tipping point before opening the doors. IF you apply Ostrom to a digital or knowledge commons THEN flag the scope and reinterpret boundaries as membership and contribution roles. Never scale a weak-link process by adding people to the unit whose minimum matters, and never define a boundary without writing down, as a value, whom it excludes and why that is acceptable.","switch_signal":"Toward small and bounded: minimum-effort outcomes appear as the unit passes a dozen; violations go unsanctioned because nobody has repeated dealings with the violator; membership is ambiguous and decay tracks it. Toward scale: rare skills sit with single people, the same problems are solved repeatedly in isolation, or a network-effect practice is stuck below its tipping point. Counts: unit size against the minimum-effort trend; fraction of violations sanctioned; holders per critical skill.","evidence":"Agreement: every mechanism in this course (observation, reputation, sanctions, complex contagion, assurance) weakens as the group grows and interaction becomes anonymous, and every knowledge-and-innovation benefit strengthens. Nobody claims Ostrom's principles are proven at scale (the 09 file names scale as where they are least tested; transfer to digital commons is an open question in the ledger). Nobody claims small groups innovate. Two narrow disagreements. First, whether scale is reached by nesting (Ostrom) or by growth from a core (Weber); treating these as compatible sequencing is this file's reading, not a book's claim. Second, the boundary itself, where the learner's values enter most directly: a boundary that makes monitoring and sanctions work also excludes; durability and fairness are different criteria (`09` misreadings); open platforms trade enforcement for reach. The course cannot settle how much exclusion a learner should accept for how much cooperation; it insists the trade be named and tagged [V]. Studies: Van Huyck's and Weber's lab lineages; the Cox review; Kline and Boyd's Oceania correlation (clean, single-region). [E for the small-group results and the boundary principle; H for nesting and gradual growth beyond one lab; V for who is in and who is out.]","sources":["01-secret-of-our-success","02-darwins-unfinished-symphony","03-social-psychology","04-games-of-strategy","06-behavioral-game-theory","07-stag-hunt","09-governing-the-commons","10-networks-crowds-markets"]}],"brief":[{"id":"s1","title":"The group and its boundary","guidance":"Name the group precisely enough that every later section has a referent: who is a member, a user, an outsider; what is shared; and whether one person's use reduces another's (subtractable) or not. Durable commons have clear boundaries (`09` ch 3; Cox et al. 2010) [E], but open-source projects, platforms and knowledge commons are open by design at the outer layer. The founding mistake is answering \"open or closed\" for the whole group instead of layer by layer (`primer §6, §8`). Facts about the group are [E: own data]; every open/closed decision that is a design choice is [H], and a boundary chosen on principle is [V]. Revise this section at v4, once s9 and s10 have shown which boundary the institution and the seeding plan actually need.\n\n**What good looks like:** three layers (core, regulars, periphery) each with a membership rule; a resource table marking subtractable versus non-subtractable; the scarce resource named in one sentence; churn and newcomer ratio; the open/closed answer per layer, tagged [H] where it is a choice.\n\n**Common failures:** \"the community\" with no membership rule; treating code or docs as the scarce resource when it is attention; deciding openness once for the whole group.","default_tag":"E","prompts":["Who says \"I am part of this\", and whom does the core say is part of it? Where do the two lists differ?","Which resources are used up by use (review time, moderator time, a channel's signal) and which are not (docs, code, reputation)?","What is churn per quarter, and how many newcomers arrive per experienced member?","Which boundary is open now that a later section will want to close, and which is closed that should open?"]},{"id":"s2","title":"Diagnosis: the games being played","guidance":"Draw the two or three central interactions before proposing anything (law 1): players, options, payoffs as members construe them, order, information. Then ask the one test: does a member gain by defecting when everyone else cooperates? Yes means a dilemma, and the fix set is payoffs, repetition, detection and sanctions; no means a stag hunt, and the fix set is assurance, correlation and pledges (`04` ch 4, 10; `07` ch 1; ledger rule 13) [E for the theorems]. Your group's classification is always [H], before and after the defection question is answered with its own payoffs. This section governs assurance and talk versus enforcement (t07). The founding mistake is a stag-hunt fix for a dilemma, or sanctions for a stag hunt, where they signal distrust and raise the lone cooperator's cost. Check one existing sanction for credibility and separation (`04` ch 8, 9).\n\n**What good looks like:** a payoff matrix or two-curve sketch per interaction; the defection question answered in one sentence; the shape tagged [H]; the fix set listed; at least one v0 fix marked \"withdrawn: wrong shape\".\n\n**Common failures:** proposing fixes before drawing the game; tagging the shape [E]; explaining one-shot players as bad types.","default_tag":"H","prompts":["What does the cooperator get when all others defect, and the defector when all others cooperate?","Is the interaction repeated with the same people, and how fast is defection detected?","Which existing threat would its enforcer actually carry out, and does it separate careful from careless members?","If you reclassified the main interaction, which v0 fix would you withdraw?"]},{"id":"s3","title":"The collective brain","guidance":"Map the actual learning network, never the org chart: whom newcomers watch, whom they ask, and which processes live in one head. Humans copy prestigious and successful models more than they follow explanations (`01` ch 3–5, 8) [E]; norm adherence spreads by modelling, whereas skills with hidden structure need explicit teaching (`02` ch 8; Morgan et al. 2015, one study, N = 184; ledger rule 8). This section governs copying versus teaching (t01). The founding mistake is \"just document it\" for a norm, or \"just model it\" for a skill. Name the single points of failure, the prestigious members and whether they model the target behaviour, and at least one place where a leader's costly actions contradict the stated norm: credibility-enhancing displays cut both ways (`01` ch 8). Claims about who copies whom in your group are [H] until observed.\n\n**What good looks like:** a learning-network sketch; a single-point-of-failure list; a prestige list with a \"models the target?\" column; one behaviour predicted to change if a prestigious member adopts it, and one that will not change however well it is explained.\n\n**Common failures:** mapping reporting lines; a documentation fix for a modelling problem; ignoring what the most-copied member actually does.","default_tag":"H","prompts":["When someone new needs to learn how things are done, whom do they watch and whom do they ask?","Which critical process lives in one head, and what happens when that person leaves?","Which prestigious member visibly does the opposite of the stated norm?","Which target behaviours are norms (model them) and which are skills with hidden structure (teach them)?"]},{"id":"s4","title":"Situational audit and folk-psychology check","guidance":"For every v0 failure, write the situational alternative to the dispositional story: workload, ambiguity, visibility, ownership, deliberation design (`03` ch 1, 5, 12; the attribution error; loafing under low identifiability) [E for the mechanisms; H that they explain your case]. This section governs dispositions versus structure (t14). The founding mistake is \"the people are the problem\", closely followed by a lever from the failed-replication list (ego depletion, priming, power posing, watching eyes, Stanford Prison, groupthink as a syndrome, IAT training; ledger rule 20). Strike those levers through with the reason; the strike-through is the learning. Record the current descriptive and injunctive signals per target behaviour and whether they agree, and never advertise low adoption (`03` ch 9; Schultz et al. 2007; rule 24; law 5).\n\n**What good looks like:** a two-column table per failure (v0 story, situational alternative); a signal audit with an \"agree?\" column; struck levers with reasons; one structural change with a predicted effect size in words.\n\n**Common failures:** character explanations left standing; a \"we're drowning, please help\" message that advertises the low rate; a lever that rests on a failed finding.","default_tag":"E","prompts":["For each \"they don't care\" line, what would the same behaviour look like from someone who cared but faced this workload, ambiguity and visibility?","What tells a member what most people here do, and what is approved? Do the two signals agree?","Which v0 lever rests on a failed finding, and what replaces it?","Where is effort unidentifiable, and what one change would make it identifiable?"]},{"id":"s5","title":"Threshold and tipping map","guidance":"Decide whether the target behaviour is contingent on how many others do it, and where the group sits relative to the crossing. Mild individual contingency produces two stable states, low and high, with an unstable tipping point between them (`05` ch 3, 7; `10` ch 17) [E for the model]; the scarce resource is low-threshold actors, never \"influencers\" (ledger rule 18). This is tension t04 in population form. The founding mistake is ignoring arithmetic: mentors per mentee, reviewers per review, hours per unit of work. Sketch the two curves and mark the current state. Estimate the minimum viable coalition k as [H]. State one accounting identity v0 ignored (`05` ch 2). Separate conventions, which are self-enforcing, from norms that need a rule.\n\n**What good looks like:** a two-curve sketch with the group's position marked; k with reasoning and the pilot that tests it; one identity in numbers; the convention/rule split; a sentence on what happens if the coalition falls one short.\n\n**Common failures:** a plan with no number, so no way to know it succeeded; recruiting the most visible member instead of the lowest-threshold one; a pilot whose game differs from the game at scale.","default_tag":"H","prompts":["If a third of the group did it, would you? If two-thirds? Whose threshold is lower than yours?","Units of work per week divided by people willing and able: does the plan add up?","What is the smallest coalition that could run a pilot where the game is the same as at scale?","Which norms survive if nobody is watching (conventions) and which collapse (need a rule)?"]},{"id":"s6","title":"Population of types and fairness baseline","guidance":"State the type mix in words, what conditional cooperators can see of others' contributions, and the group's own fairness reference point. Lab populations are roughly a third self-interested and about half conditional cooperators (Camerer's summary, background; direction only) [E as direction; H for your mix]; fairness is cue- and expectation-dependent, not a fixed taste (ledger rule 9). This section governs t05 and t11. The founding mistake is explaining by selfishness what is strategic uncertainty among conditional cooperators who cannot see each other. Find any weak-link process and its size: pairs reach the top, groups of 14–16 collapsed within about ten rounds (`06` ch 7; Van Huyck et al. 1990). Pick the amendment that explains the v0 failure: social preferences, limited reasoning, or learning and history.\n\n**What good looks like:** the type mix with the visibility gap named; the reference point and comparison group; weak-link processes with their sizes; the amendment defended in a sentence; a prediction for what changes when contributions become visible.\n\n**Common failures:** quoting an ultimatum-game figure as your group's; calling one-shot newcomers selfish; a committee where a pair would do.","default_tag":"H","prompts":["Of the under-contributors, how many would contribute if they could see others doing so?","What allocation do members compare, and against whom?","Which process aggregates by the minimum, and how many people are in it?","What would members read as a broken promise, and has one occurred?"]},{"id":"s7","title":"Equilibrium selection plan","guidance":"For the main stag hunt, plan how to reach the payoff-dominant state. Risk dominance wins under random mixing, best-response updating, large groups and no communication; payoff dominance is reachable through correlation: small stable groups, success-visible imitation, public pledges, gradual growth from a core, and a lower cost of being the lone cooperator (`07` ch 1, 3; `06` ch 7; Weber 2006, one lab lineage; ledger rule 2) [E for the mechanisms; H for the regime and rate here]. Sweetening the joint payoff is the weakest lever (law 3). The founding mistake is a big-bang rollout to a mixed audience with a bonus attached. State the regime, choose the cheapest correlation device (location, signal, or partner choice), and remember that local interaction helps only under success-copying (rules 3, 36). Cheap talk roughly doubles cooperation, then decays without repetition or sanctions (rule 12; law 6).\n\n**What good looks like:** regime named; the watershed in words; the device chosen and costed; the lone cooperator's loss today and the change that halves it; a pacing rate from a named core; a dated prediction of pledge decay.\n\n**Common failures:** money as the first lever; a big-bang rollout; a pledge round with nothing to sustain it.","default_tag":"H","prompts":["Who interacts with whom, how often does it change, and is success visible when it happens?","What is the cheapest way to make cooperators meet cooperators more than chance?","What does the lone cooperator lose today, and what change halves it?","From which core, at what rate per period, does the rollout grow?"]},{"id":"s8","title":"Norm register","guidance":"Classify each \"norm\" by the expectations that sustain it: descriptive norm, convention, social norm (conditional on expectations, and able to exist while widely violated), or moral norm (`08` ch 1; ledger rule 11) [E for the taxonomy and method; H for every result in your group]. This section governs broadcasting the majority versus building normative expectations (t10). The founding mistake is a values campaign aimed at pluralistic ignorance, or a \"most people do it\" message where nobody does (`primer §1`). Run the four-question battery per behaviour in the reference network, not the org chart: what you do, what most of them do, what they think you should do, what happens to a deviator, plus a sanction item. Measure the perceived-versus-actual gap (Tankard & Paluck 2016). Record cues as [H] for any cue-to-norm mapping (rule 37); name trendsetters by nomination.\n\n**What good looks like:** at least three N-nn rows, each classified, with expectations, gap direction, signals, cues and trendsetters; one expectation measured before v3; a prediction of which norm collapses if one visible member deviates.\n\n**Common failures:** surveying the org chart; a dead rule mistaken for pluralistic ignorance; cues asserted as evidence.","default_tag":"H","prompts":["For each norm: what do members do, think others do, think others expect, and expect to happen to a deviator? Where does the pattern show pluralistic ignorance?","Whose opinion would a member actually notice? That is the reference network.","What template, label or bot message activates the norm at the moment of action?","Which norm collapses if one visible member deviates?"]},{"id":"s9","title":"Institutional design","guidance":"Run Ostrom's eight principles as a diagnostic checklist, not a recipe: boundaries, congruence, collective choice, monitoring, graduated sanctions, conflict resolution, recognition, nesting (`09` ch 3; Cox et al. 2010, 91 studies, with caveats; rule 29) [E for the regularity; H for each rule here; V for legitimacy choices]. Governs t06 (designed versus self-governed rules) and t12 (incentives versus norms). The founding mistake is a rule announced by the wrong person with a first sanction so severe nobody applies it. First sanctions are small and graduated; monitoring is a by-product of use (rule 30; law 9). Write the ladder with a trigger per rung. Pilot before opening peer sanctions (anti-social punishment, Herrmann et al. 2008); fines can price a norm (Gneezy & Rustichini 2000). Elected sanctioners beat appointed ones (Baldassarri & Grossman 2011; `primer §3`). State each rule's legitimacy source, the rule level of each fix, who has standing to change it (`09` ch 2), and the external backstop.\n\n**What good looks like:** eight rows with scope notes; a ladder with triggers; the by-product monitoring channel; forum and appeal; legitimacy per rule; backstop; the first cheap change that produces both information and standing.\n\n**Common failures:** close-or-nothing sanctions; a bounty where credit would do.","default_tag":"H","prompts":["For each principle: present, absent, or not applicable, with a scope note?","Who can sanction whom, at what cost to themselves, with what appeal?","What is the first, smallest sanction, and how many members climbed each rung last quarter?","Who decided the rules, and can members show where their input changed them?","Which v0 fix was an operational rule, and who has standing to change it?"]},{"id":"s10","title":"Network map and seeding plan","guidance":"Sketch clusters and bridges, estimate the adoption threshold q, and place the seed. A node adopts when at least q = b/(a+b) of its neighbours have; a cluster of density above 1 − q blocks a cascade from outside and protects one adopted inside (`10` ch 19, theorem; rule 3) [E for the theorem; H for your q and map]. Information crosses one weak tie; costly behaviour needs several adopting neighbours and wide bridges (rule 34). This section governs closure versus bridges (t09). The founding mistake is announcing a costly norm across weak ties. Name the copying kind and its fix: an informational cascade (collect private signals first), a network effect (cross the tipping point), or coordination on a graph (lower q or seed inside clusters; rule 19). Assume selection over influence (rule 35); seed inside clusters and grow slowly (law 8).\n\n**What good looks like:** a map with bridge holders named; q with reasoning; the blocking cluster and the protecting one; the seed placed inside a cluster; the copying kind and its fix; which sub-group never adopts through current bridges.\n\n**Common failures:** a broadcast to the whole network; one bridge holder carrying the whole rollout; homophily read as influence.","default_tag":"H","prompts":["Which sub-groups talk mostly to themselves, who holds the ties between them, and how many such ties are there?","How many adopting neighbours does a typical member need before adopting?","Which cluster blocks the norm, and which protects it once adopted?","Is convergence here a cascade, a network effect, or coordination on a graph, and what does that imply for the fix?"]},{"id":"s11","title":"The signal and the BPC statement","guidance":"Name the public signal per coordination problem and check its visibility. Nash equilibrium is a social achievement: aligned conjectures come from a public signal, a choreographer (`11` ch 7; Aumann & Brandenburger 1995; rule 31) [E for the mechanism; H for what serves as the signal here]. Run the two-part norm test on the main norm: epistemic (can everyone say what it requires of them and of others) and motivational (does anyone gain by deviating, and is there a cheap sanction). Write one BPC line: beliefs about each other, preferences including status and fairness, constraints. Then audit which of the four layers v0 addressed: the stability test, selection absent intervention, the signal, and the expectations inside agents (rule 1). This section governs t03. The founding mistake is a vague value in place of a specific signal (law 11).\n\n**What good looks like:** a signal per problem with who can and cannot see it; pass/fail on each half of the norm test; a one-line BPC; a four-layer audit of v0; a prediction of what each layer alone would move.\n\n**Common failures:** a document mistaken for a choreographer; a norm nobody can state in one sentence; fixes that touch layer three only.","default_tag":"H","prompts":["What one public thing tells everyone what to do and what others will do? Who cannot see it?","Can a newcomer state the main norm's requirement in one sentence?","Who gains by deviating while others comply, and what cheap sanction meets them?","Which layer did v0 touch, and which layer alone would move behaviour here?"]},{"id":"s12","title":"Open hypotheses register","guidance":"Every [H] in s1–s11 gets a row here. This register is the brief's experimental design; without it, hypotheses are opinions with a label. \"Why H not E\" names the missing step: a lab result not observed in this group, a classification not checked against the group's own payoffs, or a parameter the sources leave open. \"Decision rule\" says what result keeps, revises or abandons the row, written before the test. Every row needs a balancing measure, because an intervention that is wrong does harm somewhere, and the register is where you commit to seeing it. Statuses are updated each version, and a row that resolves moves to \"supported here\" with date and evidence, never to a general [E].\n\n**Row fields:** Id (H-nn, never reused), Hypothesis, Section, Why H not E, Test, Prediction, Practical measure, Balancing measure, Decision rule, Review date, Status.\n\n**What good looks like:** every column filled; no row without a balancing measure; no duplicate hypotheses; the riskiest bets scheduled first; every row also appearing as an s14 line.\n\n**Common failures:** an [H] in the body with no row; a prediction with no direction or size; \"we'll see how it goes\" in place of a decision rule.","default_tag":"H","prompts":["Have you found every [H] in s1–s11 and given it a row?","What would you see in ninety days if the hypothesis is true, and if it is false?","What cheap observation moves this toward E for this group, or kills it?","What harm would the intervention cause if the row is wrong, and how would you see it?"]},{"id":"s13","title":"Value commitments register","guidance":"Every [V] in the brief gets a row of the form \"We choose X over Y\". A value with no reasonable dissenter is a platitude; one with no cost is a description. The point is not to defend values with evidence but to hold them knowingly, see what they cost, and stop values being laundered as findings (law 12). Evidence can inform a commitment by revealing its consequences; it cannot settle it. Apply `primer §10` to each intervention the value licenses: is it reflective or automatic, disclosed or not; who consented; who bears the cost when it misfires; what is the exit. Name the real dissenter and their strongest argument, not a straw man.\n\n**Row fields:** Id (V-nn), Commitment (\"We choose X over Y\"), Section, Who reasonably disagrees and their best argument, Cost, Evidence that informs it, Conflicts with, Owner and review.\n\n**What good looks like:** four to eight rows, each with a named dissenter and a cost; no row that restates evidence; the conflicts column non-empty for at least two rows; an owner who can reopen each commitment.\n\n**Common failures:** \"everyone agrees contributors matter\"; a value tagged [E] because a source approves; an undisclosed nudge with no row.","default_tag":"V","prompts":["What are we optimising for, and what are we knowingly giving up?","Who would object, and what is the strongest version of their objection?","Which interventions sit in the automatic-and-undisclosed quadrant, and who consented?","Who can change this rule, and who can leave at what cost?"]},{"id":"s14","title":"Measurement plan and ninety-day predictions","guidance":"Convert the registers into three measures per intervention: the practical measure (the behaviour or expectation expected to move, from logs or the battery), the predicted value (direction and size in words, or a number from your own baseline, with a date), and the balancing measure (what would show harm: newcomer rejection, reviewer churn, anti-social sanctioning, the boomerang, load shifting onto the already loaded). Surveys measure beliefs and logs measure behaviour; report both, because the mismatch is diagnostic (`primer §1`). Then re-measure and revise: if both moved, scale gradually; if behaviour only, the change rides on observation and will decay; if expectations only, the game is unstable at layer one, so return to s2 (`unified-model` §4). Every s12 row must appear here, and the main hypothesis must carry an abandonment condition.\n\n**Row fields:** Intervention (id), Practical measure, Baseline (own data, date), Predicted at day 90, Balancing measure, Harm threshold, Abandon if, Owner, Cadence.\n\n**What good looks like:** three dated predictions; a balancing measure per intervention; an abandonment condition for the main hypothesis; the re-measurement date.\n\n**Common failures:** a measure the intervention can satisfy without behaviour changing; no baseline; no number that would make you stop.","default_tag":"H","prompts":["What is the first cheap change that produces both information and standing?","For each intervention, what number do you expect on day 90, and what number makes you stop?","What could go up that you would not want, and are you logging it?","Which measure can the intervention satisfy without the behaviour changing, and what replaces it?"]}],"diagnostic":[{"id":"d1","statement":"A team has kept a practice for years that most members, asked privately, say they dislike. The practice can persist indefinitely, because each member reads the others' compliance as approval.","correct":true,"folk_theory":"Disapproval kills norms: a practice nobody likes cannot last.","explanation":"Pluralistic ignorance keeps disliked norms alive. Each person infers that others approve from the fact that others comply, and that compliance is itself driven by the same inference. The norm is a shared misperception, and it dies only when the private disapproval becomes common knowledge, through a credible published measurement or a visible trendsetter; it does not fade because each person knows their own view (Bicchieri, The Grammar of Society, ch 5; ledger C44).","module":"m7"},{"id":"d2","statement":"People will pay out of their own pocket to punish someone who treated them unfairly, even when they will never meet again.","correct":true,"folk_theory":"People are payoff maximisers: nobody spends money on revenge against a stranger.","explanation":"Ultimatum-game rejections are robust across decades and countries. In Western student samples about half of offers below a fifth of the pie are rejected (an approximate background figure), and rejection falls sharply when the same low offer is generated by a computer, so what is punished is the inferred intention (Blount 1995). The lab willingness to punish is [E]; what it says about evolution is a separate question (Camerer, Behavioral Game Theory, ch 2; ledger rules 4 and 25).","module":"m5"},{"id":"d3","statement":"Humans evolved to punish cheats at personal cost, and that evolved trait is what keeps cooperation stable in real communities.","correct":false,"folk_theory":"Strong reciprocity is settled science and explains real-world cooperation.","explanation":"Two claims are bundled here. Willingness to pay to punish unfair intentions in the lab is [E]. The claim that this is an evolved trait, strong reciprocity, is contested (Guala 2012; Binmore 2006) and is [H] in this course. Field evidence from durable commons shows that real-world sanctioning is mostly cheap, graduated and run by participants, so designs should rest on the cheap version (Gintis, evidence section; Ostrom ch 3; ledger X4, rule 4).","module":"m10"},{"id":"d4","statement":"Because Schelling's checkerboard produces segregation from mild preferences, a city's observed segregation is evidence that residents' preferences, not discrimination, produced it.","correct":false,"folk_theory":"Schelling proved that preferences, not discrimination, produce segregation.","explanation":"The checkerboard is a possibility proof. It shows that mild preferences plus interdependence can produce extreme sorting, and that homogeneity is weak evidence of intolerance. It says nothing about the real-world share due to discrimination, prices, lending or law, and Schelling says so. Real tipping does exist in US census tracts at roughly 5 to 20 percent minority share, higher where measured tolerance is higher (Card, Mas and Rothstein 2008), which is evidence for the dynamic, not for the cause (Schelling ch 4; ledger C29, rule 17).","module":"m4"},{"id":"d5","statement":"Two teams both prefer a shared standard to their separate ones, and each knows the other prefers it too. They can still fail to adopt it, because each fears switching while the other does not.","correct":true,"folk_theory":"The efficient equilibrium is the rational one, so sensible people find it.","explanation":"A stag hunt has two equilibria, and which one a population reaches depends on the basin of attraction it starts in, not on how attractive the good outcome is. Under random mixing, best-response updating, large groups and no communication the risk-dominant equilibrium usually has the larger basin and wins; laboratory groups converge to it without communication (Cooper et al.; Van Huyck et al.). Choosing the safe action under uncertainty about the others is defensible, so the failure is structural and so is the fix (Skyrms ch 1; Camerer ch 7; ledger X6, rule 2).","module":"m6"},{"id":"d6","statement":"Ten minutes of relevant, non-binding talk before a public-goods decision roughly doubles cooperation in the lab.","correct":true,"folk_theory":"Talk is cheap and therefore empty: only binding commitments change behaviour.","explanation":"In Dawes, McTavish and Shaklee (1977) relevant discussion raised cooperation from roughly a third to roughly seven in ten (approximate background figures), and communication is the strongest single lever in the Sally 1995 meta-analysis. The promises were unenforceable; talk works by creating the empirical and normative expectations a cooperation norm needs. Expect the effect to decay without sanctions or repetition where defection dominates (Bicchieri ch 4; Gilovich et al. ch 14; ledger rule 12).","module":"m7"},{"id":"d7","statement":"A costly new practice adopted by a tight-knit sub-team of ten is more likely to survive and spread than the same practice seeded in ten well-connected people scattered across the organisation.","correct":true,"folk_theory":"Clusters are bad: insular sub-groups hold new practices back.","explanation":"Clusters cut both ways. A cluster whose density exceeds one minus the adoption threshold blocks a cascade entering from outside, and by the same arithmetic it protects a behaviour adopted inside it. Costly behaviour is a complex contagion needing several adopting neighbours, so a scattered seed leaves each adopter below threshold and reverting, while a clustered seed holds and can spread through wide bridges (Centola 2010, background). The rule is: seed inside dense clusters and build wide bridges out of them (Easley and Kleinberg ch 19; ledger X7, rule 3).","module":"m9"},{"id":"d8","statement":"The reason weak ties matter is that an acquaintance is a better source of job leads and useful information than a close friend is.","correct":false,"folk_theory":"Weak ties are about job-hunting: acquaintances beat close friends as sources of jobs and information.","explanation":"The robust claim is structural: by strong triadic closure a local bridge must be a weak tie, and Onnela et al. (2007) confirmed the pattern in phone-network data. The popular job-search claim rests on a small retrospective sample, and later large-scale work found a mixed picture: most jobs still arrive through weak ties in aggregate, because people have many more of them, but any single strong tie is more valuable at the margin (Gee et al. 2017) and moderately weak ties do best (Rajkumar et al. 2022). Quote the structural claim only, and remember that weak ties carry information, not costly behaviour (Easley and Kleinberg ch 3; ledger C51, rule 33).","module":"m9"},{"id":"d9","statement":"A team schedules its hardest cooperative decisions for the morning, on the grounds that self-control is a resource that gets used up over the day.","correct":false,"folk_theory":"Ego depletion: self-control is a muscle that tires.","explanation":"The registered replication of the ego-depletion effect across 23 labs with N = 2,141 found d = 0.04 with a confidence interval including zero (Hagger et al. 2016, verified), and a later multi-lab effort was similar. The course's replication rule is to build nothing on ego depletion, social priming, power posing, watching eyes, the Stanford Prison Experiment as usually told, groupthink as a syndrome or IAT-based training (Gilovich et al., evidence section; ledger C11, rule 20).","module":"m2"},{"id":"d10","statement":"In Milgram's obedience studies, most participants went to the maximum shock even when a peer beside them refused to continue.","correct":false,"folk_theory":"Blind obedience: most people will hurt others when told to, whoever else is in the room.","explanation":"The baseline behaviour replicates: 70 percent continued past 150 volts in Burger's 2009 partial replication (verified) against roughly 82 percent at the same point in Milgram. But obedience fell sharply with victim proximity, an absent authority or a disobedient peer: with two peers refusing, only about one in ten went to the maximum (background figure). Participants were distressed, and archival work shows engaged followership rather than sadism. The design lesson is exits, peers and legitimacy of refusal, not a verdict on human nature (Gilovich et al. ch 9; ledger C21, rule 22).","module":"m2"},{"id":"d11","statement":"Two parties expect to keep dealing with each other indefinitely, and each can see what the other did last time. Permanent mutual defection is still an equilibrium of their game.","correct":true,"folk_theory":"Repetition solves the PD: the shadow of the future guarantees cooperation.","explanation":"The folk theorem is an existence result. With a long, uncertain and observable future, cooperation becomes one equilibrium among many, including permanent mutual defection. The group must still coordinate on the cooperative equilibrium and detect defection fast enough for retaliation to bite, and under noise it needs forgiving strategies. Repetition permits cooperation; selection is a separate problem (Dixit, Skeath and McAdams ch 10; ledger C27, rule 15).","module":"m3"},{"id":"d12","statement":"A practice that most members follow and that newcomers copy can fail to be a social norm of the group, if nobody expects disapproval for skipping it.","correct":true,"folk_theory":"Norm equals majority: the norm is what people do.","explanation":"What most people do is a descriptive norm, sustained by empirical expectations alone and liable to flip when the visible majority changes. A social norm in Bicchieri's sense is a conditional preference that also needs normative expectations, the belief that others think one ought to comply and may sanction; without them a widely followed practice is not a social norm, and a social norm can exist while widely violated. The four-way taxonomy (descriptive, convention, social, moral) tells you which lever to pull (Bicchieri ch 1; ledger C42, rule 11).","module":"m7"},{"id":"d13","statement":"In durable self-governed commons, the first sanction for a rule violation is usually small.","correct":true,"folk_theory":"Deterrence needs big penalties: make cheating unprofitable from the first offence.","explanation":"Across Ostrom's long-enduring cases first-offence sanctions are graduated and small. Compliance is quasi-voluntary and contingent on believing that others comply and that violations are likely to be seen, so the first sanction's job is to signal that the rule is alive, to the violator and to everyone watching. Harsh first sanctions drive violations and reports underground and erode the information flow monitoring depends on; escalation is held for repeat offenders (Ostrom ch 3, principle 5; ledger rule 30).","module":"m8"},{"id":"d14","statement":"A commons whose rules satisfy each of Ostrom's eight design principles can be expected to hold.","correct":false,"folk_theory":"The principles are a recipe: adopt all eight and the commons will hold.","explanation":"The principles specify no rules; Törbel, the Japanese villages, Valencia and the Philippine zanjeras run different rules under the same structural conditions. They are conditions found in durable cases, not a recipe: a review of 91 empirical studies (Cox, Arnold and Villamayor-Tomás 2010, verified) found them well supported and split three of them, while warning of publication bias and that they capture structure, not processes such as trust and legitimacy. Association in selected cases does not license a guarantee. Use them as a diagnostic checklist, and flag scope for digital or knowledge commons (Ostrom ch 3 and evidence section; ledger C47, rule 29).","module":"m8"},{"id":"d15","statement":"In a population where everyone learns by copying others, average performance is higher than in a population where everyone learns by trial and error.","correct":false,"folk_theory":"Copying is a free lunch: a group that copies well outperforms a group that experiments.","explanation":"Copying pays for the individual: in the social-learning tournament (104 entries, Rendell et al. 2010, verified) copying won even when observing cost no less than innovating, because demonstrators perform their best-known action, so what an observer sees is a sample already filtered toward high payoffs. But the benefit is parasitic on innovators. A population of pure copiers sits on a stale pool and does no better than a population of trial-and-error learners (Rogers's paradox); in the tournament, populations with very high copying rates had lower average fitness. Someone must be paid to innovate, and the winner discounted stale information. The tournament was a simulation, not people (Laland ch 3; ledger rule 39).","module":"m1"},{"id":"d16","statement":"To tip a group into a new practice, the scarce resource is a small number of members with wide influence.","correct":false,"folk_theory":"Influencers cause tipping: find the few with wide influence and the rest follow.","explanation":"Schelling's tipping point is an unstable equilibrium in a threshold distribution or adoption curve: below it participation decays, above it snowballs. Whether a cascade can start depends on whether there are enough low-threshold actors and no gap at the low end, so the scarce resource is people who will act when few others have, not charismatic ones. The influencer framing inverts the model (Schelling ch 3; Easley and Kleinberg ch 17; ledger C30, rule 18).","module":"m4"}],"model":{"bands":[{"id":"origins","title":"Origins: why humans are cultural, social learners and where cooperation comes from","certainty":"Mostly [E] (5 [E], 3 [H]): cumulative culture, copying strategies, a content-neutral norm psychology and norm-versus-skill transmission are evidenced, while cultural group selection, the collective-brain effect, culture-drove-brains and Rogers's paradox are hypotheses; the mechanisms are [E], the evolutionary story connecting them is [H].","nodes":[{"id":"cumulative-culture","label":"Competence lives in inherited practice, not in individuals","summary":"Know-how ratchets across generations because each learner starts from the best available model; no individual could derive it, and explorers cut off from it died. Young children match chimpanzees on physical cognition and are far ahead on social learning. A group's competence sits in its practices and learning network, and turnover can lose it silently.","tag":"E","links":["copying-strategies","fidelity-and-teaching","learning-network-connectivity"],"sources":["01-secret-of-our-success","02-darwins-unfinished-symphony"]},{"id":"copying-strategies","label":"People copy by rules, and the rules are the levers","summary":"Whom and what people copy follows strategies: the successful, the prestigious, the majority when uncertain, the similar, with stale information discounted. Copying pays because demonstrators pre-filter what they display (Rendell et al. 2010, a simulation). Change what is visibly successful and who is visibly prestigious; explanation is the weak channel for norm adherence.","tag":"E","links":["cumulative-culture","rogers-paradox","correlation-master-variable","network-structure","situation-and-construal"],"sources":["01-secret-of-our-success","02-darwins-unfinished-symphony"]},{"id":"rogers-paradox","label":"Populations of pure copiers stagnate; someone must be paid to innovate","summary":"Copiers out-compete innovators individually, yet populations that copy too much sit on a stale knowledge pool and do worse on average. It is a model result, so a hypothesis for any group, but the symptom is familiar: best practice that circulates faster than anyone tests it. Pair every copy-the-successful lever with a protected budget for trying things.","tag":"H","links":["copying-strategies","learning-network-connectivity","limited-reasoning-and-history"],"sources":["02-darwins-unfinished-symphony"]},{"id":"learning-network-connectivity","label":"Skill retention and innovation track the connectivity of the learning network","summary":"Both Origins books argue that larger, better-connected learning populations retain and innovate more, and isolation loses skills. Lab transmission chains support the mechanism at small scale; the Tasmania case is contested and the variable is reframed from head-count to effective connectivity. Silos shrink the learning network; how much that costs is a hypothesis.","tag":"H","links":["cumulative-culture","network-structure","rogers-paradox"],"sources":["01-secret-of-our-success","02-darwins-unfinished-symphony"]},{"id":"fidelity-and-teaching","label":"Fidelity is the bottleneck for accumulation; hidden-structure skills need teaching, norms do not","summary":"Below a threshold of transmission accuracy, skills are lost as fast as gained; teaching and language are fidelity technologies, and in the stone-tool experiment (Morgan et al. 2015) they gained most while imitation added little. Over-imitation shows the reverse for practices with hidden payoffs: people copy without understanding and explanation does not produce adherence. Teach skills; model norms.","tag":"E","links":["cumulative-culture","copying-strategies","norm-psychology"],"sources":["02-darwins-unfinished-symphony","01-secret-of-our-success"]},{"id":"norm-psychology","label":"Humans carry a content-neutral norm psychology: learn rules, expect them of others, feel shame, sanction violators","summary":"Henrich's self-domestication and Gintis's normative predisposition agree that humans acquire and enforce rules, including as third parties; the disposition is universal, the content is not (small-scale-society ultimatum offers ran from about 26% to about 58%). How deeply norms are internalized is open, so assume a norm is conditional until it survives a collapse of expectations. Reputation and ostracism often move people more than fines, and people enforce rules you did not intend.","tag":"E","links":["norm-anatomy","social-preferences-conditional","strong-reciprocity-split","within-group-enforcement"],"sources":["01-secret-of-our-success","11-bounds-of-reason"]},{"id":"within-group-enforcement","label":"Reciprocity, reputation and sanction are the evidenced engines of cooperative norms; cultural group selection is the hypothesis","summary":"Within-group mechanisms are evidenced across all three lower bands. Cultural group selection, where groups with cooperative norm packages out-compete and are imitated by others, is defended by Henrich and Gintis, doubted by Laland, and heavily criticised; it is [H] and never the sole basis of a design claim. Copy a peer's norm package as a starting point, but justify the design by within-group mechanisms.","tag":"E","links":["norm-psychology","shadow-of-the-future","graduated-sanctions-monitoring","institutions-incremental"],"sources":["01-secret-of-our-success","02-darwins-unfinished-symphony","11-bounds-of-reason"]},{"id":"culture-drove-brains","label":"Reliance on culture selected for the capacities that make culture richer","summary":"The shared Origins hypothesis (Henrich's cultural brain, Laland's cultural drive) holds that brains, long lives and sociality are consequences of reliance on social learning. Support is correlational (Street et al. 2017) and diet and social-brain accounts remain live. It grounds the claim that cultural learning is fast and automatic but licenses no design decision on its own.","tag":"H","links":["cumulative-culture","norm-psychology"],"sources":["01-secret-of-our-success","02-darwins-unfinished-symphony"]}]},{"id":"mechanisms","title":"Mechanisms: individuals in groups and the formal language of strategic interaction","certainty":"9 [E] with [H] sub-claims inside risk dominance and tipping: Nash and ESS, risk dominance under random mixing, the folk theorem, costly-signal logic, intention-sensitive fairness, limited first-contact reasoning and the robust social-psychology list are solid, but no parametric social-preference or learning model wins and lab point estimates do not transfer; relations are theorems, behavioural regularities are directions, not sizes.","nodes":[{"id":"draw-the-game","label":"Write down players, strategies, payoffs, order and information before arguing about the outcome, then classify","summary":"Most disputes about why people will not cooperate dissolve once the matrix is drawn. The one agreed diagnostic: does a member gain by defecting when everyone else cooperates? Yes means prisoner's dilemma (payoffs, repetition, sanctions); no means stag hunt (assurance); chicken and battle-of-the-sexes need turn-taking or tie-breaks. Schelling's binary-choice diagram is the population version of the test.","tag":"E","links":["nash-stability-test","risk-dominance-default","shadow-of-the-future","contingent-behaviour-tipping","norms-transform-games","ostrom-principles"],"sources":["04-games-of-strategy","05-micromotives-and-macrobehavior"]},{"id":"nash-stability-test","label":"Nash and ESS certify stability, not prediction and not goodness","summary":"A Nash equilibrium is a profile from which no one gains by deviating alone; mutual defection is one because it is stable, not because anyone wants it. With several equilibria the concept predicts nothing, history and salience pick, and ESS is the population form, so which stable norm a group holds depends on where it started. Never use \"equilibrium\" as approval and never contrast \"rational\" with \"fair\".","tag":"E","links":["draw-the-game","risk-dominance-default","contingent-behaviour-tipping","nash-is-social-achievement","four-layers"],"sources":["04-games-of-strategy","07-stag-hunt"]},{"id":"risk-dominance-default","label":"Absent intervention, groups drift to the risk-dominant outcome, not the best one","summary":"The payoff-dominant equilibrium is best for all if reached, but the risk-dominant one is the best reply against a 50/50 opponent and has the larger basin; under random mixing
