itional on believing that others comply and that violations are likely detected, and monitoring is what generates that belief. Conversely, people monitor because they benefit from knowing whether their own contingent compliance is warranted. Neither is explicable alone. Read with m7's vocabulary: this **quasi-voluntary compliance** is Bicchieri's conditional preference plus empirical and normative expectations, in field clothing, and monitoring is what keeps the empirical expectation accurate.\n\nMonitoring is near-universal in the durable cases, done by users or by agents they appoint, and it is cheap because it is a **by-product of use**: the boat waiting for its spot, the farmer next in turn on the canal, the public cattle count. The design rule is to make monitoring a by-product of participation (visible queues, public logs, turn-taking that exposes cheaters) rather than a separate policing function, and to make monitors accountable to the people they monitor or drawn from them (principle 4).\n\nNow the finding organisations most often violate. **First-offence sanctions in durable systems are surprisingly small.** The Japanese village commons escalated from small fines paid in sake to confiscation of tools and, at the extreme, ostracism; the Valencian water tribunal levies modest fines in public. Ostrom's explanation: sanctions exist to sustain contingent compliance, not to make every defection unprofitable. A small first fine tells the violator that they were seen and tells everyone else that the rule is alive; severe escalation is reserved for repeat or flagrant violators. The two failure modes are either no sanction (the norm decays because nobody can tell whether the rule is still in force) or a nuclear first sanction (violations and reports go underground, monitors stop reporting, and the information flow that compliance depends on is destroyed). That is why \"six months later nobody reports handover problems\" after an HR warning is evidence of silence, not of compliance.\n\nThis connects to m3's credibility logic (Dixit's chapter 8): a sanction that costs the enforcer more than ignoring the violation will not be applied and will not deter. Graduated sanctions are credible because they are cheap to apply; the ladder is what makes the threat subgame-perfect. And it connects to the strong-reciprocity dispute (ledger X4, rule 4). Willingness to pay to punish unfair intentions is [E] in the lab; \"evolved strong reciprocity\" is [H]; and Guala's field review finds real-world sanctioning mostly cheap (gossip, withdrawal, reputation). Ostrom's cases are the strongest field evidence, and they show graduated, low-cost, participant-run sanctioning rather than heroic costly punishment. **Design on the cheap version** (ledger rule 30): a small, quick, public first response applied by whoever is on rotation; escalation scheduled and delegated so no single enforcer chooses it alone; a cheap route back to good standing. Give members a legitimate, proportionate channel for sanctioning, or the punishing will happen anyway, informally and underground."},{"title":"The eight principles are a diagnostic checklist supported by a review, not a recipe","tag":"E","body":"Ostrom picked cases that had persisted for centuries, on the argument that survival across generations under changing conditions is the closest a field study gets to a robustness test: Törbel's alpine pastures in Switzerland, Japanese village forests and grasslands, the Spanish irrigation huertas of Valencia, Murcia, Orihuela and Alicante, and the zanjera irrigation communities of the Philippines. Their rules differ wildly (turn-taking by land share; auctioned water rights; labour obligations tied to shares; opening dates and permitted tools). What they share is structure. In the Cox, Arnold and Villamayor-Tomás split version, now standard:\n\n1A. **User boundaries**: who has rights to withdraw is clearly defined. 1B. **Resource boundaries**: the edge of the resource is clear.\n2A. **Congruence with local conditions**: rules on time, place, technology and quantity fit the local resource. 2B. **Proportionality**: the costs users bear (labour, materials, money) are proportional to the benefits they get.\n3. **Collective-choice arrangements**: most individuals affected by operational rules can participate in modifying them.\n4A. **Monitoring users** and 4B. **monitoring the resource**, by monitors accountable to the users or drawn from them.\n5. **Graduated sanctions**.\n6. **Conflict-resolution mechanisms**: rapid, low-cost local arenas for disputes among users or between users and officials.\n7. **Minimal recognition of rights to organise**: external authorities do not challenge the users' right to devise their own institutions.\n8. **Nested enterprises** for resources that are part of larger systems: appropriation, provision, monitoring, enforcement, conflict resolution and governance organised in multiple layers.\n\nHer reasoning matters more than the list. Boundaries are necessary, not sufficient: without them outsiders capture the gains of any restraint. Congruence is why rules are accepted; a rule copied from elsewhere that does not fit is seen as illegitimate. Collective choice keeps rules congruent as conditions change. Conflict resolution exists because rules are ambiguous at the margins and honest disagreement otherwise becomes a stream of unpunished violations. External recognition separates a working institution from an arrangement an agency can override on the first complaint. Nesting handles scale.\n\n**Evidence status, exactly as the ledger requires (rule 29, C47).** The book shows that durable self-organised commons exist and share these features. It *argues*, but cannot prove from these cases, that the principles cause durability: cases were selected on the dependent variable, the sample is small, failures are compared informally. The later systematic evidence is Cox, Arnold and Villamayor-Tomás (2010, verified): a review of **91 empirical studies** found the principles well supported, in that where a study assessed a principle, its presence was mostly associated with success and its absence with failure. Their caveats: publication bias toward fitting cases; loose, qualitative coding; and the principles describe *structure*, not the processes (trust, legitimacy, transparency) that make structure work.\n\nHence the three \"nevers\". **Never a recipe**: the principles specify no rules; every durable case has different ones, and Ostrom said rules must be locally crafted and the list is provisional. **Never anti-state**: her durable cases lean on courts, enabling legislation and recognised property rights; the claim is that neither central control nor privatisation is the *only* solution, and she warned explicitly against panaceas. **Never evidence of fairness**: several durable systems have hereditary shares, unequal holdings and exclusion of outsiders; durability and fairness are different criteria, and political ecologists argue the book underplays power. In the brief, the checklist is run against the group, each principle marked present, absent or not applicable with a scope note, and tagged [E] as a diagnostic and [H] as a prediction that supplying a missing one will help."},{"title":"Institutions are supplied incrementally; external authority is backstop and data supplier, not rule-writer","tag":"H","body":"Institutions are rarely created in one constitutional moment. Ostrom's fourth chapter, drawn from her own doctoral research on the groundwater basins under the Los Angeles area, tells institutional change as a sequence of games, each small change lowering the cost of the next.\n\nThe starting point was a **pumping race**. California law left rights ambiguous between overlying landowners and appropriators; with rising demand and saltwater intrusion, every pumper's dominant strategy was to pump before others did. A real PD with a real tragedy under way, and the reason the course says Ostrom's open-access cases *are* PDs (ledger rule 13). The path out: *litigation*, in which Raymond Basin pumpers sued, obtained a state-referee investigation (the state bore much of the information cost) and negotiated a stipulated judgment defining shares and cutting extraction to safe yield, with a court-appointed watermaster to monitor; West Basin followed with a longer, costlier suit, and Central Basin used a lighter formula. *Entrepreneurship*: water associations formed to gather data, negotiate and lobby. *Polycentric public enterprise*: special districts were created under enabling legislation to import water, build seawater barriers and tax pumping to fund replenishment. The result is a layered system of private pumpers, courts, a watermaster, districts and the state agency. The litigation game turned \"pump before others do\" into \"negotiate shares under a judge who can impose something worse\". Participants used the state as a **facilitator** (information, credible threat, legal standing), not as a Leviathan writing the rules.\n\nInstitutional supply was solved not by a heroic collective act but by low-cost external arenas that cut transformation costs; leadership by the large pumpers with the most to lose; incremental rule changes that reshaped payoffs and information for the next round; and a visibly collapsing resource that raised expected benefits. The contrast case in chapter 5 is the Mojave basin: same legal environment, but a far larger, more heterogeneous group with poorer shared information and greater hydrological uncertainty, and adjudication failed at the time. Supply is sensitive to size, heterogeneity and information, not just legal opportunity.\n\nThe design translation. **Do not wait for the whole institution.** Find the first cheap change that produces *information* and *standing* (a shared dashboard of the resource's state, a recognised forum with authority over one class of decisions) and let it lower the cost of the next. Use the surrounding authority (management, platform owner, funder) as backstop and data source: \"court plus enabling legislation\", not \"central plan\". Lengthen horizons: users who expect to be there in thirty years weigh the future, while migrants, absentee owners and politically insecure users discount it heavily, so turnover raises discount rates and undermines every other principle.\n\nThis idea is tagged [H] because it sits on an open tension (ledger X10). Ostrom's appropriators deliberately craft, monitor and revise rules; Henrich's picture (m1) is that institutions were mostly copied from successful neighbours and modified, with designers rationalising afterwards; and Cleaver's \"institutional bricolage\" holds that rules are assembled from existing social practice rather than designed. The resolution the course adopts is that neither \"design from scratch\" nor \"just copy\" is [E]: **copy the norm package of a visibly successful peer group, then craft incrementally with the people bound by the rules** (principle 3), because Ostrom's own cases show incremental crafting using external arenas rather than one constitutional act, and Henrich's copy-and-modify picture includes the modification. Write the first cheap change into the brief with a prediction of what it will reveal in three months."},{"title":"Rules live at three levels, and most stalled reforms fail a level above where the fix was proposed","tag":"E","body":"Ostrom's second chapter supplies a piece of vocabulary that dissolves a lot of confusion about \"who changed the game\". Rules operate at three nested levels. **Operational rules** govern daily appropriation, provision, monitoring and enforcement: the rotation of fishing spots, the on-call rota, the review requirement. **Collective-choice rules** govern how operational rules are made and changed: the cooperative meeting that can alter the rotation, the team forum that can change the rota. **Constitutional-choice rules** govern who may make collective-choice rules and how: the law and state tolerance that give the cooperative standing to bind its members; the management decision that a team may govern its own process. Changing a rule at one level is an action taken under the rules of the level above; this is what lets Ostrom say \"the players changed the game\" without contradiction.\n\nTwo corollaries. First, **rules-in-use, not rules-in-form**: a written rule nobody monitors is not part of the institution, and an audit should look at what is followed rather than what is written. Second, and this is the diagnostic the module wants you to carry: **most proposed fixes are operational (a new rule), and most failures are at the collective-choice level (nobody affected can legitimately change the rule) or the constitutional level (the group has no recognised standing to govern itself).** Ask: do the people bound by the rota have a legitimate, low-cost way to change it, and does anyone outside recognise their right to?\n\nThe failure cases in chapter 5 are each paired with missing principles, and the level diagnosis shows in every one. Bodrum's fishery was flooded by new entrants with no way to define a boundary, and conflict between artisanal and industrial fishers went unresolved (1, 3, 6 missing, 7 partly). Mawelle's beach-seine rotation broke as nets multiplied with outside political patrons backing entrants. Port Lameron Harbour's informal rules were unrecognised by federal licensing and survived only as long as the state ignored them (7 missing). And **Kirindi Oya**, the pattern the cold attempt is designed to surface: a large, externally designed and funded irrigation scheme where settlers had no role in rule-making, officers monitored without accountability to farmers, head-end farmers took water and tail-enders went short, and maintenance decayed (2, 3, 4, 5, 6 missing). Ostrom's summary: failure is the absence of a specific subset of principles, most often boundaries, congruence and external recognition, and central governments were often a cause of fragility.\n\nThe Kirindi Oya pattern recurs far from irrigation. \"Outside sponsor sets up the group, appoints the monitor, and lets no member change the rules\" describes a centrally imposed engineering process with no team ownership, and a platform whose moderation is run by staff unaccountable to the community. A per-team CI quota enforced by automatic lockout is an operational rule imposed from outside with an unaccountable monitor, a nuclear first sanction, and no forum for arguing whether a job was necessary. Growth is the classic killer: a turn-taking norm that works for twenty breaks at sixty unless boundaries or nesting are introduced.\n\nThe chapter 6 framework tells you where to intervene. An individual supports a rule change depending on expected benefits (state of the resource, information flow), expected costs (transformation plus ongoing monitoring), and internal norms and discount rates. So: lower the cost of rule change (recognised forums, cheap information), raise the perceived benefit (make the state of the shared resource visible), and lengthen horizons (tenure, stakes, stable membership). The levels are [E] as a description; the discount-rate claim for any given group is [H]."}],"worked_example":{"title":"A growing online community whose moderation is run entirely by platform staff (you supply the nesting step)","steps":["Run the checklist. Principle 3 missing: members cannot change the rules. 4 missing: monitors are unaccountable to users. 5 missing: bans are not graduated; a first offence gets the same response as a tenth. 6 missing: there is no cheap dispute forum, so every contested ban becomes a public fight or a silent exit. 7 ambiguous: has the platform recognised the members' right to govern any domain at all? This is the Kirindi Oya pattern (`09` ch 5).","Flag scope (ledger C48). A community's attention and civility are not a subtractable resource in Ostrom's sense, so 1 and 2 need reinterpretation: 1A becomes 'who counts as a member with standing', 2B becomes 'are the obligations of moderation proportional to the benefits of membership'. Tag the transfer to a digital commons [H].","Find the first cheap change that produces information and standing. A public moderation log is by-product monitoring: every decision becomes visible without a separate policing function, and it makes the state of the 'resource' visible. A recognised member forum with authority over one class of decisions (say, appeals of first-offence actions) is the smallest possible collective-choice arrangement. Neither requires redesigning the community; each lowers the cost of the next change.","Build the sanctions ladder as in m3's worked example, applied by rotating members rather than staff alone: first violation, a public templated note within a day; second, a fixed short restriction; third, a review by three members; bans never a first response. Cheap to apply, therefore credible; escalation scheduled and delegated.","Now you design the nesting (principle 8). Sub-communities handle local disputes and first-line moderation with their own logs; a higher layer handles cross-community conflict, shared infrastructure and appeals against sub-community decisions; platform staff sit at the top as backstop and data supplier, not as rule-writer. Say who has standing at each layer and where a member goes when two layers disagree.","Tags. [E] for the principles as a diagnostic (91-study review, with publication-bias and structure-not-process caveats). [H] for transfer to a digital commons and for the prediction that the log and forum outperform staff-only moderation here. [V] for member governance over staff efficiency; the checklist cannot tell you that the slower, member-run arrangement is worth it."]},"hinge":[{"q":"A funder says: \"Ostrom showed communities manage shared resources better than states or markets, so we should just hand the resource to the community.\" What is wrong?","options":["Self-governance is a third option that works under identifiable conditions; durable cases lean on courts and law.","Nothing; that is the book's thesis, and the cases show communities outperforming both states and markets.","Communities fail because the PD is a law of nature; only privatisation aligns incentives with the resource.","It works if the community adopts all eight principles, since those are the conditions that the durable cases have in common."],"answer":0,"diagnoses":["Correct. Self-organisation succeeds and fails for identifiable reasons (`09` ch 4, ch 5, evidence section); the supply of institutions is sensitive to size, heterogeneity and information; and external arenas are what lowered transformation costs in the California basins.","Ostrom as anti-state and pro-panacea (ledger C47). Her durable cases use courts, enabling legislation and recognised property rights; she said neither central control nor privatisation is the *only* solution, not that community management always wins.","The PD as a law of nature (ledger C49). She refuted the PD as a law; it stays valid for open access, and participants move themselves into a different game when they can communicate, monitor and change rules.","Principles as a recipe to install (ledger rule 29). They specify no rules; they are structural conditions found in durable cases, supported by a review with caveats, and the processes (trust, legitimacy) that make structure work are not on the list."]},{"q":"A team's first response to a missed on-call handover is a formal HR warning. Six months later nobody reports handover problems. What happened?","options":["The warning worked and the problems stopped, since a credible consequence is what a missed handover needed.","The team lacks a norm psychology and needs stronger penalties, since one warning was not enough to deter.","A nuclear first sanction drove violations and reports underground and cut the information that monitoring needs.","The warning was not credible; make it a firing, since a sanction people doubt will ever be applied changes nothing."],"answer":2,"diagnoses":["Silence as compliance; rules-in-form confused with rules-in-use. The absence of reports is exactly what a severe first sanction produces, because reporting a colleague now means triggering HR.","\"Deterrence needs big penalties.\" The field pattern is the reverse: small first sanctions, escalation held for repeat offenders, and cheap sanctioning (gossip, withdrawal) doing most of the work.","Correct. First sanctions in durable systems are small because their job is to signal that the violator was seen and the rule is alive; a severe first response makes monitors stop reporting and destroys the shared belief compliance depends on (`09` ch 3, principle 5; ledger rule 30).","Partly right, wrong level. Credibility matters (`04` ch 8), but it is achieved by making the sanction cheap enough to be applied every time, not by making it bigger; a firing threat is less credible still."]},{"q":"A reform (a new rota rule) stalls for a year although everyone agrees it is better. Where does Ostrom say to look first?","options":["At the operational rule: rewrite it more clearly, since a rule everyone agrees with stalls only when it is unclear.","At the individuals blocking it, since a reform everyone agrees with can stall only if someone is standing in the way.","At the discount rate: people do not care enough about the future for a rule that pays off later to be adopted.","At the collective-choice level: do the people bound by the rota have a legitimate, low-cost way to change it?"],"answer":3,"diagnoses":["Most fixes are operational; most failures are a level up. A clearer rule that nobody has standing to adopt stalls exactly as the unclear one did.","Dispositional diagnosis (m2). The situational alternative here is structural: the reform has no legitimate route to adoption, so anyone in the way looks like a blocker.","Partly right, wrong level. Discount rates affect willingness to invest in rule change, but \"everyone agrees it is better\" says the benefit is already perceived; what is missing is the arena in which agreement becomes a rule.","Correct. Most fixes are operational and most failures are a level up: nobody affected can legitimately change the rule, or the group has no recognised standing (`09` ch 2, ch 6). \"Everyone agrees\" tells you the block is standing, not wording."]},{"q":"Which claim about Ostrom's principles may be tagged [E]?","options":["They cause durability, since the cases were selected for endurance and the principles were found in each one of them.","Where a study assessed a principle, its presence was mostly associated with success, across 91 studies, with caveats.","They transfer directly to open-source projects and knowledge commons, since a commons is a commons.","Durable commons are egalitarian, since equal shares are what keeps the participants willing to comply."],"answer":1,"diagnoses":["Causal reading of cases selected on the dependent variable. The book argues the causal claim; the review supports association, with caveats; neither licenses \"cause\".","Correct. Cox, Arnold and Villamayor-Tomás 2010 (verified): well supported, with publication bias, loose qualitative coding, and structure-not-process as the stated limits. That is the [E] wording (ledger rule 29).","Scope over-extension (ledger C48). The book concerns subtractable resources with costly exclusion; knowledge commons found partial fit with principles 1 and 2 reinterpreted, so transfer is [H] with a scope flag.","Durability as fairness (`09` misreadings). Several durable systems have hereditary shares, unequal holdings and exclusion of outsiders; durability and fairness are different criteria."]}],"brief_prompt":"Add section s9, institutional design. Run the eight-principle checklist (Cox's split version) against the group, marking each present, absent or not applicable with a scope note where the shared thing is not a subtractable resource. Then record: the sanctions ladder (first response, escalation, who applies it, the route back to good standing); the by-product monitoring channel; the dispute forum; which rule level the v0 fix lives at and who has standing to change it; and the recognised external backstop. Tag each: [E] for the checklist as diagnostic, [H] for any prediction that supplying a missing principle will help, [V] for governance choices. Prediction: the first cheap change that will produce information and standing, and what it will reveal in three months.","deeper":["books/09-governing-the-commons.md#ch-4--analyzing-institutional-change","books/09-governing-the-commons.md#ch-5--analyzing-institutional-failures-and-fragilities","books/09-governing-the-commons.md#ch-6--a-framework-for-analysis-of-self-organizing-and-self-governing-cprs","books/04-games-of-strategy.md#part-three--ch-8--strategic-moves","books/04-games-of-strategy.md#part-four--ch-14--incentive-design"]},{"id":"m9","num":9,"title":"Networks: ties, homophily, cascades, small worlds","level":"Order","minutes":70,"sources":["10-networks-crowds-markets","07-stag-hunt"],"hook":"A documentation norm is adopted enthusiastically by one sub-team and by the one person who liaises with the other four sub-teams. A year later it lives in one sub-team. The liaison was diligent. Why did it not cross?","attempt":{"prompt":"Five sub-teams of eight rarely interact; each has one liaison to the others. A new review norm pays 3 to each pair that both use it and 2 to each pair that both keep the old way (illustrative payoffs; a mismatched pair gets nothing). Where do you seed it, how many seeds, and through whom? Show any arithmetic you use. Ten lines, no reading first.","minutes":12},"objectives":["Distinguish the three kinds of copying (informational cascade, network effect, coordination on a graph) and name the fix for each.","Compute the cascade threshold q = b/(a+b) from payoffs and apply the cluster-density theorem in both directions to decide where to seed a norm and why a single liaison will not carry it.","Tell closure from bridging, quote the robust form of the weak-ties claim, run the 2pq homophily test, and assume selection over influence until longitudinal data say otherwise.","Say what makes a group navigable and why short paths are never the bottleneck."],"ideas":[{"title":"The threshold and the cluster-density theorem: where a norm catches and where it stalls","tag":"E","body":"Chapter 19 of Easley and Kleinberg is the most actionable chapter in the book for norm design, because it gives an exact stall condition. Here each person sees and cares only about **neighbours**, and copies for payoff (a coordination game on each edge), not for information.\n\n**The model, plainly.** On each edge the two endpoints play a coordination game: both use A, each gets a; both use B, each gets b; mismatch, 0. A node with d neighbours, a fraction p of them on A, gets p·d·a from choosing A and (1 − p)·d·b from choosing B. So it prefers A when **p ≥ q = b / (a + b)**. Start with a seed set on A in a network of B-users; every other node switches to A when at least a fraction q of its neighbours use A (switches are one-way). If eventually everyone uses A, the seed set causes a **complete cascade** at threshold q. Note what q is: the fraction of a node's *neighbours*, not of the population; Schelling's population thresholds (m4) are cousins, so say which you mean.\n\n**Cluster, defined.** A set of nodes is a *cluster of density p* if every node in it has at least a fraction p of its neighbours inside the set.\n\n**The theorem, both directions.** (i) If the network *outside the seed set* contains a cluster of density greater than 1 − q, the seed set does *not* cause a complete cascade. (ii) Conversely, if the seed set does not cause a complete cascade, the network outside it contains a cluster of density greater than 1 − q. Why (i): the first cluster member to switch would have all its A-neighbours outside the cluster, fewer than a fraction q of its neighbours since more than 1 − q are inside; so it cannot switch, and nobody does. The obstacle is not distance but the density of tightly-knit communities.\n\n**Arithmetic on the cold attempt (illustrative payoffs).** With review paying 3 and the old way 2, q = 2/5 and 1 − q = 3/5. A sub-team of eight in which each member has seven internal ties and at most one external tie is a cluster of density seven eighths, far above three fifths. Seeds placed outside it never get in; one seed inside converts nobody, because each neighbour still sees seven of eight on B; three seeds inside bring each remaining member to 3/7 ≥ 2/5 and the sub-team tips.\n\nHence the four design moves. (a) **Lower the threshold** by making A cheaper or B costlier (tooling, templates, compatibility, or \"bilinguality\", adopting both at a cost), so impenetrable clusters become porous. (b) **Seed inside dense clusters**: a cluster blocks only while none of its members has switched. (c) **Do not expect a norm to jump a single weak tie**; build wide bridges (several parallel ties between sub-groups) or move whole sub-teams.\n\nThe rule the ledger attaches (3, and the `10` misreading list): never read the theorem as \"clusters are bad\". The density that stops a good norm entering also protects an established one. And every time you invoke clustering, state the learning-rule condition from m6: threshold dynamics are a form of best response, and success-copying and majority-copying still diverge at the boundary. The theorem is [E]; Centola's finding that clustered networks spread costly behaviour faster than random ones is background; your group's q and cluster densities are [H]."},{"title":"Simple versus complex contagion, and the robust form of the weak-ties claim","tag":"E","body":"Two claims about weak ties are constantly run together, and only one survives. Start with the structure.\n\n**Triadic closure**: if A is strongly tied to B and to C, B and C are likely to become tied, through opportunity, trust and the strain of an open triangle. **Strong Triadic Closure** makes it a rule: if a node has strong ties to two others, at least a weak tie must exist between them. From this alone follows the structural claim: every **local bridge** (an edge whose endpoints share no neighbours, so that neighbourhood overlap is zero) is a weak tie, because a strong bridge from A to B plus any other strong tie of A would force a closing edge, and the bridge would stop being local. Strong ties get closed into triangles; weak ties are disproportionately the bridges between clusters. Onnela and colleagues confirmed this on a national mobile-phone graph: ties with high neighbourhood overlap carried the most call time, and deleting weak ties first shattered the network while deleting strong ties first merely thinned it. **Weak ties tend to be the bridges: robust** (ledger rule 33, C51).\n\nGranovetter's original paper also reported that most jobs in his interviews came through acquaintances rather than close friends, and \"useful information comes from weak ties\" became folklore. That finding is small-sample and retrospective; later large-scale work found that in aggregate most jobs still arrive through weak ties, because people have so many of them, while any single strong tie is more likely to lead to a job than any single weak tie (Gee, Jones and Burke, Facebook); Rajkumar et al. (LinkedIn) found moderately weak ties most effective. **Quote the structural claim only.** Novelty enters through bridges because your close friends know what you know; that is the sound part.\n\nNow the second distinction, which is ledger rule 34 and diagnostic item d7. **Simple contagion** (information, awareness, a rumour, a disease) needs one exposure, so one bridge into a cluster is enough and clusters merely slow it. **Complex contagion** (costly behaviour, a norm that pays only if neighbours match) needs several adopting neighbours, because the node switches only when a fraction q of its neighbours has. A bridge is one of many edges for the node it reaches, so it rarely makes that node *switch*. Weak ties carry awareness across clusters; they do not carry behaviour. Centola and Macy's work on complex contagions needing wide bridges is the theoretical statement; Centola's online experiment (background) found clustered networks spread costly behaviour faster than random ones, the reverse of information. The hook's diligent liaison failed for exactly this reason: for every node on the far side, the liaison was one neighbour among seven still on the old practice.\n\nThree practical rules follow. First, **find the group's local bridges and protect the people who hold them**: they are usually weak ties, hence fragile, decay unattended, and losing one can cut off a sub-group from all novelty. Second, when the goal is *information flow* (who knows what is happening elsewhere), a few weak bridges suffice and the intervention is to keep them alive. Third, when the goal is *norm adoption*, single liaisons are the wrong instrument; the choices are wide bridges (several parallel ties between the sub-groups), moving whole sub-teams, or seeding inside each cluster. The worked example asks you to decide which face of connectedness is actually the problem before choosing.\n\nA note on \"six degrees\" (ledger C50). Milgram's \"six\" is a median over the minority of chains that completed; most chains in the email replication died; full-graph measurements give roughly four to seven. Say \"short paths exist in any large network\"; never quote the number as a fact."},{"title":"Closure gives trust and enforcement; bridges give information; cooperation needs both","tag":"E","body":"Coleman and Burt describe two kinds of social capital that trade off against each other. A **closed cluster**, in which everyone's friends are friends with each other, gives trust, enforceability and shared norms: violations are seen by people who talk to each other, reputations are common knowledge, and sanctions (m8) are cheap because they are by-products of ordinary interaction. **Spanning a structural hole** between clusters gives information and brokerage power: the person on the only route between two groups sees what neither sees and controls what passes (the market chapters make the same point about intermediaries who are the only path between buyer and seller). All-closure groups enforce stale norms; all-bridge groups enforce nothing.\n\nThis is the network face of a tension the whole course keeps meeting (ledger X15, tension t09). The Origins books (m1) say larger, better-connected learning networks retain and innovate more, and silos cause skill loss; that claim is about **connectivity for information and skill retention**, and it is itself contested at the archaeological scale (the population-size effect is reframed as learning-network connectivity, lab-demonstrated). Skyrms (m6) says correlation, meaning non-random structure that makes like meet like, is what rescues cooperation; Ostrom (m8) says small, dense, bounded groups are where the design principles hold; and this module's theorem says costly behaviours do not jump single weak ties. Those claims are about **closure for enforcement and complex contagion**. The two variables are different, and a design that maximises one degrades the other. The right mix is [H] for any group; that there is a trade-off is [E].\n\nSo the brief has to answer two questions separately. Where does the group need *information* to flow (across teams, from outside the org, from users), and are the bridges that carry it alive and held by people who will stay? Where does the group need *enforcement* (the mixed-motive behaviours from m7 that need normative expectations kept live), and is there enough closure there for monitoring to be a by-product and sanctions to be cheap? A norm that lives in a closed sub-team is protected by its density (the theorem's second direction) and invisible to the rest of the org; a norm announced across a sparse org has bridges but no closure and decays because nobody can see who is complying.\n\nOne more piece of structure worth holding, from the chapter on positive and negative relationships. **Structural balance** in signed graphs: triangles with three positive edges, or exactly one positive edge, are stable; the others (two friends who share an enemy is fine; two enemies who share a friend is strained) are not. Harary's theorem says a fully balanced network splits into at most two mutually hostile camps. Balance pressure predicts a two-faction split unless cross-cutting positive ties are maintained; when a group starts talking about \"us\" and \"them\", the structural remedy is deliberate positive ties that cut across the emerging boundary, which is what m2's structured-contact conditions look like on a graph.\n\nAnd a warning about power. Bargaining power in exchange networks depends on **outside options, not degree**: a node whose partners have no alternatives is powerful. If one person holds all the group's bridges, they are the only route, and only-routes capture surplus. To flatten power, give people alternatives: parallel ties, the same prescription complex contagion gave for a different reason."},{"title":"Homophily has two sources; assume selection until longitudinal data show influence","tag":"E","body":"**Homophily** is the pervasive regularity that ties form disproportionately between similar people; Moody's school-friendship maps, where race predicts community structure, are the book's example, and McPherson, Smith-Lovin and Cook's review documents it across traits and settings. It matters for the course for two reasons. Homophily turns a network into clusters, and clusters (the first idea) block cascades of new behaviour. And homophily invites the most common causal mistake in reasoning about groups.\n\n**Measuring it.** If a fraction p of nodes have a trait and q = 1 − p do not, random mixing would put 2pq of the edges across the boundary. The book's tiny example: 40 percent women, 60 percent men, so 0.48 of edges should be mixed-gender; if only 0.20 are, the network is strongly homophilous. The **2pq test** is a quick measure of how siloed a group is along any trait you care about (seniority, function, tenure, location), and it goes in the brief as a number you can actually compute from a contact graph or a survey of who talks to whom.\n\n**Two mechanisms, hard to separate.** *Selection*: people choose similar friends. *Social influence*: friends make each other similar. Both produce identical cross-sectional patterns, and only longitudinal data can distinguish them. The book flags this for Christakis and Fowler's claim that obesity spreads through friendship networks; Shalizi and Thomas later showed that latent homophily (similarity on an unmeasured trait that drives both tie formation and the outcome) produces exactly the same patterns, so influence versus selection there remains unresolved. Crandall and colleagues' Wikipedia-editor study is the design that *can* separate them: similarity between editors rises sharply *before* their first interaction (selection) and keeps rising after it (influence); both are real. Ledger rule 35 makes the default explicit: **assume selection until shown otherwise.**\n\nThe organisational version is the inference \"the people who thrive here are strikingly similar, so this community shapes people into that type\". The weak-inference reading: similarity may be who was recruited, who self-selected in and who stayed, rather than anything membership did. The design consequence is not that influence is absent but that the levers differ: selection is fixed at the recruiting boundary (who is admitted, who is retained), influence by changing who talks to whom. A brief that proposes \"culture change\" without saying which of the two it is targeting has not diagnosed anything. And the humility consequence is that most claims about a group's \"culture shaping people\" are [H] unless someone has before-and-after data on the same people.\n\n**Foci.** Feld's idea that people are tied to activities and groups gives three closures running in parallel: *triadic* (a friend of a friend), *focal* (sharing an activity) and *membership* (joining a friend's activity); Kossinets and Watts found the chance of a new tie rises with each shared friend. This is the cheapest lever for building the parallel ties the second idea asked for: create shared foci (a rotation, a joint review, a cross-team on-call pairing) and closure does the rest. It is also the structural reading of m2's contact conditions: equal-status contact around a shared goal is a focus; proximity alone is not.\n\nA last caution against inferring mechanism from shape. Popularity is heavy-tailed, and a simple copying model (preferential attachment) produces heavy tails. But it is one generator among many (ledger C53): a heavy tail does not establish copying, and extreme inequality of attention is the default outcome of copying rather than evidence of quality differences. Salganik, Dodds and Watts's artificial music markets are the demonstration: the same songs ranked very differently across eight worlds once download counts were visible."},{"title":"Three kinds of copying with three fixes, and why short paths are never the bottleneck","tag":"E","body":"The book contains three models of people copying each other, and the ledger (rule 19) requires you to name which one you mean every time, because the fixes differ.\n\n**Informational cascade (chapter 16).** People act in sequence and see what others *did* but not what they *knew*. Once two or three early movers agree, it is rational for everyone after to ignore their own signal and copy. The urn model shows the logic exactly: with private signals that are right two thirds of the time, the third person who sees two \"blue\" guesses and draws red should still guess blue, and from then on nobody's guess adds information; a wrong cascade happens about one time in five (illustrative computation). Cascades are wrong even when everyone reasons correctly, and they are *shallow*: choices after the cascade starts carry no new information, so a public signal or credible dissenter reverses them. Any sequential public decision (the senior person speaks first, a show of hands, a thread with visible early reactions) is an urn model. **Fix: collect private signals before anyone announces; randomise or reverse speaking order; make dissent cheap.**\n\n**Network effect (chapter 17).** Copying pays *because* others copy: the value of a tool, a format or a norm of showing up rises with the number of users. Aggregate adoption then has multiple equilibria, and the unstable one is a **tipping point**: below it adoption decays to zero, above it grows to a high stable level. Expectations are self-fulfilling. m4 met this model in population form (the Z-shaped curve). **Fix: cross the tipping point**, with a concentrated push in one subgroup rather than diffuse encouragement that leaks away, then stop.\n\n**Coordination on a graph (chapter 19).** Copying pays because matching neighbours pays; the first idea's threshold and cluster theorem. **Fix: lower q, or seed inside the resisting clusters, or build wide bridges.**\n\nConfusing them is the book's first listed misreading. Treating a show-of-hands vote as a tipping problem, or a documentation norm as an information problem, applies the wrong fix. The worked example asks you to say which of the three is producing the convergence you observe before proposing anything.\n\n**Small worlds.** Two facts about large networks are surprising, and only one is usually understood. Short paths exist despite heavy clustering: Watts and Strogatz showed that a clustered lattice plus a few random long-range links has logarithmic average distance while keeping its clustering; homophily gives the lattice, weak ties give the shortcuts. But ordinary people can also *find* those paths with only local knowledge, and Watts-Strogatz cannot explain that. Kleinberg's theorem: with uniformly random shortcuts a greedy forwarder cannot home in; decentralised search is efficient only when the probability of a long-range link falls with distance to the power of the dimension of the space (one contact at every *scale* of distance, so each step can halve the remaining distance), and then greedy forwarding takes about (log n)² steps.\n\nThe design consequence is that the coordination bottleneck in any group larger than a village is never distance; it is awareness (simple contagion) and thresholds (complex contagion). **Findability** is a separate, designable property: a group is navigable when each member has contacts at every scale (team, department, org, industry), a homophilous lattice with one cross-cutting tie per scale rather than random ones. Ask, in the brief, whether a person on one side of the org could route a question to the right person on the other side in a few hops; if not, the missing ties are at a specific scale, and that is where to add them."}],"worked_example":{"title":"A distributed organisation wants to reduce silos (rubric only: you reason it through)","steps":["Which face of connectedness is the problem: structure (few cross-ties between sub-teams) or behaviour (cross-ties exist but people do not act on what crosses them)? Draw the two separately. A structural fix for a behavioural problem adds ties nobody uses; a behavioural fix for a structural problem exhorts people who cannot see each other.","Is the goal information flow or norm adoption? Information is a simple contagion: a few weak bridges suffice, and the intervention is to find the people holding them and protect them. Norm adoption is a complex contagion: single liaisons cannot carry it; you need wide bridges (several parallel ties between sub-teams), moved sub-teams, or seeds inside each cluster.","Homophily check. For the trait that matters (function, seniority, site), compute or estimate whether cross-boundary edges fall below 2pq. Then say whether the similarity is selection (fixed at recruiting: who joined and stayed) or influence (membership changed people), and default to selection unless you have before-and-after data on the same people.","Navigability. Does each person have a contact at every scale (team, department, org)? If a question from one side cannot be routed to the right person on the other side in a few hops, name the scale where ties are missing and add cross-cutting ties there, not random ones.","Which of the three copying kinds is producing the convergence you observe? Sequential public decisions (informational cascade: collect private signals first, reverse speaking order); a tool or practice whose value rises with users (network effect: cross the tipping point in one subgroup); a norm that pays when neighbours match (coordination on a graph: lower q or seed inside clusters). Name it, then name the matching fix.","Required tags. [E] for the theorems (threshold, cluster density, 2pq, navigability exponent) and the structural weak-tie claim. [H] for the group's q, its cluster densities and any influence claim. [V] for how much closure (enforcement, trust) the org is willing to give up for bridging (information)."]},"hinge":[{"q":"Twelve engineers vote by show of hands; the two most senior vote first, both yes; ten follow. Which kind of copying, and which fix?","options":["Network effect; the vote is above its tipping point, so break the meeting up before the count reaches it.","Informational cascade; collect private judgments before anyone announces and reverse the speaking order.","Coordination on a graph; lower the threshold, so that fewer prior yes votes are needed before people commit.","Conformity as weakness; tell people to be independent, since ten engineers should be able to think for themselves."],"answer":1,"diagnoses":["Confuses the three kinds of copying (ledger rule 19). There is no payoff externality in a vote: nobody's outcome improves because more people voted yes; the copying here is informational.","Correct. After two visible agreeing signals, each later voter's rational move is to copy regardless of private judgment, so the ten votes may carry no information (`10` ch 16). Private simultaneous votes and juniors speaking first restore the signals.","Applies the chapter 19 fix to an informational problem. Thresholds and clusters concern behaviour that pays when neighbours match; a vote is a sequence of public signals.","Rational herding read as irrationality. The third person's copy is correct Bayesian play given what she can see; exhortation to independence does not change what she can see, the procedure does."]},{"q":"A norm has been adopted by a dense sub-team of ten. Management worries the sub-team's insularity will \"hold the norm back\" and proposes breaking it up across the org. Is that right?","options":["Wrong: the cluster's density protects the adopted norm; keep it together and build wide bridges from it.","Right: clusters slow spread, since an insular group keeps the norm inside its own walls.","Right, provided the members are influential, since dispersed influencers each seed their new team.","Wrong: norms spread by information, so a newsletter is enough and the sub-team can stay exactly where it is."],"answer":0,"diagnoses":["Correct. Dispersed, each former member has mostly non-adopting neighbours and reverts; kept together, the cluster is a stable seed set, and parallel ties from it to each neighbouring sub-team are what a complex contagion needs (`10` ch 19; `07` ch 3).","\"Clusters are bad\" (ledger X7, `10` misreadings). The density that would stop a norm entering from outside is the density that protects one adopted inside; the theorem runs both ways.","Influencer model of spread (ledger C30). Under threshold dynamics a scattered influential member is one neighbour among many for each node they reach; what matters is the fraction of each node's neighbours converted, not the prestige of any one.","Weak ties carry behaviour because they carry information (ledger C54). A newsletter is simple contagion: awareness crosses one tie, adoption of a costly practice needs several adopting neighbours."]},{"q":"The people who thrive in a community are strikingly similar. A member concludes the community \"shapes people into that type\". What is the correct default?","options":["Accept it; influence is visible, since the members can name the moments the community changed them.","Reject it; communities cannot change people, since personality is set before anyone joins anything.","Accept it if the community is large, since a large group cannot have selected its members so precisely.","Assume selection (who joined and stayed) until longitudinal data show similarity rising after joining."],"answer":3,"diagnoses":["Influence assumed over selection (ledger C52). Cross-sectional similarity is produced identically by choosing similar members and by members changing each other; latent homophily mimics influence exactly.","Over-correction. Both mechanisms are real where they have been measured; the rule is a default, not a denial.","Size as evidence of mechanism. Community size says nothing about whether similarity arose before or after joining.","Correct (`10` ch 4; ledger rule 35). Only before-and-after data on the same people, as in Crandall et al.'s Wikipedia design, separates the two; absent that, selection is the parsimonious default and the levers are at the recruiting boundary."]},{"q":"Which is the robust version of the weak-ties claim?","options":["Most useful information and most jobs come through weak ties, since acquaintances outnumber close friends.","Weak ties are more valuable than strong ties, since a strong tie tells you what you already know.","Weak ties tend to be the local bridges between clusters, so novelty enters through them; protect them.","Everyone is six steps from everyone, via weak ties, since the small-world experiments measured it."],"answer":2,"diagnoses":["The job-search claim as robust (ledger C51). Granovetter's finding was small-sample and retrospective; later large-scale work found most jobs still arrive via weak ties in aggregate, while a single strong tie is more valuable at the margin and moderately weak ties do best. Quote the structural claim only.","\"Weak ties beat strong ties\" (`10` misreadings). Closure supplies trust and enforcement; bridges supply information; neither is more valuable in general and cooperation needs both.","Correct. Every local bridge is a weak tie by Strong Triadic Closure, and Onnela et al. 2007 confirmed on a national phone graph that removing weak ties first shatters the network (`10` ch 3; ledger rule 33).","Six degrees as fact (ledger C50). The number is a median over the minority of completed chains; say \"short paths exist\" and leave the number out."]}],"brief_prompt":"Add section s10, the network map and seeding plan. Sketch the group's clusters and bridges: who holds each bridge, and how many parallel ties exist between each pair of sub-groups. Record the homophily estimate (the 2pq comparison) for the trait that matters and whether you are assuming selection or influence. For the target norm, estimate q from the payoffs as members see them, name the cluster(s) that will block it, and place the seed set inside them. Say which of the three copying kinds is currently producing the group's convergence and the matching fix. Tag each: [E] for the theorems and the structural weak-tie claim, [H] for your q, densities and any influence claim. Prediction: which sub-group adopts first, and which never adopts through the current bridges.","deeper":["books/10-networks-crowds-markets.md#ch-5--positive-and-negative-relationships","books/10-networks-crowds-markets.md#ch-12--bargaining-and-power-in-networks","books/10-networks-crowds-markets.md#ch-20--the-small-world-phenomenon","books/10-networks-crowds-markets.md#ch-21--epidemics","books/07-stag-hunt.md#ch-6--choosing-partners"]},{"id":"m10","num":10,"title":"The four accounts reconciled and Gintis assessed","level":"Synthesis","minutes":70,"sources":["11-bounds-of-reason","04-games-of-strategy","07-stag-hunt","08-grammar-of-society"],"hook":"A traffic light tells each driver something different and nobody would gain by disobeying, given the others obey. A rule book tells everyone the same thing and is ignored. What does the light have that the book lacks, and what is your group's light?","attempt":{"prompt":"Two product squads look at identical weekly metrics and reach opposite conclusions every week. Separately, a release cadence is half-assumed weekly and half-assumed fortnightly, and merges keep colliding. Diagnose each in one paragraph and say what you would change. Resist the first fix that comes to mind for each. No reading first.","minutes":12},"objectives":["State the four layers of 'how a group settles on a way of behaving' (Nash/ESS as stability test; Skyrms and Camerer for which stable state is reached absent intervention; Gintis for the public signal that aligns conjectures; Bicchieri for what must be true inside agents and how to measure it) and refuse to present any one as the theory.","Run Gintis's two-part norm test (epistemic: can everyone say what the norm requires of them and of others; motivational: does anyone gain by deviating given others comply, and is there a cheap sanction) and write a BPC line (beliefs, preferences, constraints) for a real group.","Assess each of Gintis's eight claims against the rest of the reading list, carrying out the two that hold and declining the unification.","Explain why persistent disagreement on shared data indicates different priors, and why the remedy is cultural alignment rather than more data."],"ideas":[{"title":"Nash equilibrium is a social achievement, not a rational deduction","tag":"E","body":"Gintis's most durable contribution is a negative result with a constructive consequence. Rational choice, read modestly, is a theory of *consistent* preferences (the BPC model: beliefs, preferences, constraints), not of selfishness or cognitive perfection. Game theory is the indispensable grammar of interaction. But **game theory plus rationality cannot by itself predict what people do**, because Nash equilibrium cannot be justified from rationality alone.\n\nThe argument runs through epistemic game theory. Rationality plus **common knowledge of rationality** (everyone is rational, everyone knows it, everyone knows everyone knows, and so on) licenses only **rationalizability**: the strategies that survive iterated deletion of never-best-responses (Bernheim, Pearce). In most coordination games, in Chicken and in matching pennies, that leaves almost everything on the table. In a two-by-two coordination game every strategy is rationalizable. Nash requires additionally that players' *conjectures about each other* coincide, and nothing in individual rationality delivers that. The theorem is Aumann and Brandenburger (1995): for two players, mutual knowledge of rationality plus mutual knowledge of conjectures yields Nash; for more players, add a common prior and common knowledge of conjectures. These are *epistemic* conditions on what players know about each other, and no theory of individual reasoning produces them. So Nash is not \"what rational agents do\" but \"what agents do once a social process has aligned their conjectures\".\n\nThe rest of the reading list supports the corollary at every level. Camerer's coordination experiments (m5) show slow, path-dependent convergence rather than deduction; first-contact play is norm- and fairness-driven with one to two steps of reasoning. Schelling's focal points (m4) and Skyrms's dynamics (m6) do the selecting. The 1980s **refinement program** (perfect, proper, sequential, stable equilibria) tried to fix multiplicity with rationality-flavoured conditions and, in Gintis's reading, failed on its own terms: the refinements conflict, depend on arbitrary tremble structures, and lack an epistemic justification. Multiplicity is real, and its resolution is *social*, not logical. No book on the list dissents. Backward induction fares no better in sequential games: it requires common knowledge of rationality to hold even after moves that common knowledge says would never happen, and in the centipede game subjects go several rounds where the theory says take the pot at once.\n\nThe design consequence is a license the course uses everywhere: **stop trying to reason a group into equilibrium.** Meetings that derive the \"obviously rational\" plan reproduce the refinement program's failure; if you want a group to land on an equilibrium, something outside the players' rationality has to point at it. Pick a focal option, announce it, make it the default, and name the signal (the next idea). Ledger rule 14 states the same thing from the m3 side: Nash is a stability test, not a prediction and not an endorsement; with multiple equilibria it predicts nothing.\n\nA note on what Gintis is *not* saying, since the misreading is common: he does not reject rational choice or game theory, and he does not show that people are irrational. He rejects selfishness as an add-on and the claim that rationality yields Nash; he keeps consistent-preference rationality as the core and wants game theory embedded in a theory of norms, not discarded. \"Rational\" is never contrasted with \"fair\" in this course (ledger rule 16), and the falsifiability worry about a model in which anything can be a preference is real and comes back in the fourth idea."},{"title":"A norm is a choreographer: a public signal that makes an equilibrium focal and self-enforcing","tag":"E","body":"If aligned conjectures come from outside the players' heads, what supplies them? Gintis's answer is Aumann's **correlated equilibrium**, presented as a first-class concept rather than a footnote. A public signal draws a joint recommendation from a distribution over strategy profiles and privately tells each player their part. If, given the recommendation and what it implies about others' recommendations, no player wants to deviate, the distribution is a correlated equilibrium. And Aumann's 1987 result closes the loop with the previous idea: Bayesian rationality plus a common prior yields exactly correlated (not Nash) equilibrium.\n\nThe worked example is Chicken. Two pure Nash equilibria (one swerves, the other does not) and a mixed one with a poor expected payoff. A traffic light saying \"go\" or \"wait\" with equal probability gives each driver the good outcome half the time, better on average than the mixed equilibrium, and self-enforcing, because when it says \"wait\" you believe the other was told \"go\". That is the template for every norm in the book. **A social norm is a choreographer**: an external signal telling each player what to do and what others will do, such that following it is a best response when others follow it.\n\nChapter 10 says a working choreographer has two components, and the course turns them into a test. (1) **Epistemic**: the norm supplies the common conjecture; each person knows what others will do because the norm says so. Can every member state what the norm requires of *them* and of *others*? (2) **Motivational**: given that others comply, does anyone gain by deviating, and if so, is there a cheap sanction or a disposition that makes compliance a best response anyway? Most failed norms fail one of the two. A vague norm is a choreographer that does not choreograph; a clear norm nobody has reason to follow is a rule book.\n\nChapter 11 applies it to property. The **bourgeois strategy** in Hawk-Dove (defend as incumbent, yield as intruder) is a low-conflict convention and a correlated equilibrium with \"who arrived first\" as the signal. For a group, ownership norms (who owns a codebase, a channel, a decision) reduce conflict primarily by being *clear and salient*, not by being fair; ambiguous ownership is a Hawk-Dove game without a correlating signal. Fairness matters for other reasons (legitimacy, willingness to sanction), which Ostrom and Bicchieri supply. The ledger's tags (rule 32, C57): the model is [E]; the endowment effect as the evolved psychology of property is [H]; commons regimes are rule systems with monitoring, not possession cues alone.\n\nNow the course's assessment. The choreographer model holds up *as a model*, and it is formally compatible with Bicchieri (a norm transforms a game via conditional preferences and expectations) and with Skyrms's Lewis conventions. But it is **weaker than Bicchieri on diagnosis** (she separates empirical from normative expectations and tells you which to measure when a norm fails; Gintis treats compliance as a lump), **weaker than Ostrom on authorship** (her commons show choreographers written, monitored and revised by the players themselves), and **weaker than Skyrms on origins** (he shows how correlation emerges without anyone designing it). Vanderschraaf's review presses the point that the account still owes an explanation of *which* correlated equilibrium a society lands on: the Nash multiplicity gap, moved one level up. And the book runs no data horse race, so never write that correlated equilibrium \"fits the data better than Nash\" (ledger C58). What survives is one sharp design question: **what is the signal, and why does each person comply given the others do?**"},{"title":"Four layers, not four rivals: how a group settles on a way of behaving","tag":"E","body":"By this point the course has met four accounts of the same question, and a learner who has read them as competitors will write a brief that picks a favourite. The ledger (X5, rule 1) says they are layered, and the ordering is the course's own reconciliation.\n\n**Layer 1: the stability test (Dixit et al., m3; Skyrms's ESS, m6).** Nash equilibrium asks whether any single member gains by deviating from a candidate pattern; an evolutionarily stable strategy asks whether a small group of mutants can invade it. This is a test applied to any proposed pattern of behaviour, a condition and not a verdict on goodness (mutual defection passes it). It says nothing about which of several stable patterns a group will reach.\n\n**Layer 2: selection absent intervention (Skyrms and Camerer, m5 and m6).** Given the group's regime (how people are matched, how they update, how large the group is, whether they can talk), which stable pattern do the dynamics deliver? Under random mixing, best response, large groups and no communication: the risk-dominant one. Under correlation (small stable groups, success-visible imitation, public pledges, gradual growth, lower lone-cooperator cost): the payoff-dominant one becomes reachable.\n\n**Layer 3: the signal (Gintis, this module).** What a norm *does*: supply a public signal that aligns conjectures, so that the good pattern is focal and each person's compliance is a best response given the others'. Theorem-backed as a claim about equilibrium; silent on where the signal comes from and on what happens inside people when it fails.\n\n**Layer 4: the expectations inside agents (Bicchieri, m7).** What must be true inside people for the signal to work: an empirical expectation that enough others comply and a normative expectation that enough others expect them to, possibly sanction-backed; and how to measure both, so that when a norm fails you can say which expectation is missing.\n\nOstrom (m8) and the network book (m9) sit across the layers rather than in one: Ostrom shows how participants build and repair the signal and the sanctions (layers 3 and 4, authored from inside), and Easley and Kleinberg decide whether the signal is *seen* across the whole network (a choreographer not visible across the network does not correlate play; a group with weak cross-ties can host two priors).\n\nWhy the order matters. Teaching Bicchieri before Skyrms would make the learner treat expectations as the whole story and miss that basin size decides outcomes with no beliefs at all. Ledger rule 1 is precise: never present one of the four as \"the\" theory of norms. The formal relations between the layers are [E]; **which layer bites in a given group is [H]**, and it is the single most useful hypothesis the brief can state. A contribution norm posted on a visible board that everyone can recite and nobody follows has passed layer 3's epistemic half and failed its motivational half; the repair comes from layer 4 (are the normative expectations live?) and from Ostrom (is there a cheap, graduated sanction?). A rollout that fails although the pledge was clear and the norm was measured has a layer-2 problem: the regime delivers risk dominance regardless. The worked example walks the learner's own v0 fix through all four in order.\n\nThis is also why the module declines the unification (the fourth idea). The layering *is* a map of how the books fit together. Chapter 12 of Gintis lists five compatible principles and asserts they suffice; compatibility is not unification, and the ordering of interventions comes from the other books and from your own diagnostic, not from the framework."},{"title":"Strong reciprocity and BPC: what to carry, what to decline","tag":"H","body":"Two of Gintis's claims are contested in ways that matter for the brief, and the course's verdicts on them are fixed by the ledger.\n\n**Strong reciprocity.** Chapter 3 marshals the experimental economics that shows people are not selfish: ultimatum rejections, public goods with costly punishment, trust games, and the cross-cultural games in fifteen small-scale societies that Gintis co-authored, where offer *levels* vary with market integration and everyday cooperation while pure self-interest is rejected everywhere. He reads the evidence as support for **strong reciprocity**: an evolved predisposition to cooperate conditionally and to punish defectors at personal cost, even in one-shot anonymous settings, and this supplies the motivational half of the choreographer.\n\nThe lab facts replicate well; rejection of pure self-interest is about as secure as anything in behavioural science. The *evolutionary* claim is disputed. Binmore and Shaked argue that one-shot lab behaviour is consistent with subjects mis-applying heuristics tuned for repeated interaction, and that learning erodes cooperation in many designs; Guala's field review argues that evidence for *costly* punishment in small-scale societies is thin, and that sanctioning in the wild is mostly cheap (gossip, ostracism, withdrawal). Both are background references, not verified this session, but a well-known dispute. And Ostrom's cases, the strongest field evidence on the list, show graduated, low-cost, participant-run sanctioning rather than heroic costly punishment. The ledger splits the claim (X4, rule 4): **willingness to pay to punish unfair intentions in the lab is [E]; \"strong reciprocity is an evolved trait\" is [H]; real-world sanctioning is mostly cheap and graduated, so design on the cheap version.** The design lesson survives the dispute: members will sanction free riders at some cost to themselves, so give them a low-cost, legitimate, proportionate channel, or punishment goes underground. Diagnostic item d3 is built from this correction, and the misreading to avoid is \"the book proves that norms are internalised by evolution\"; it argues it, and provides no evolutionary models of its own.\n\n**BPC and the anomalies.** Chapter 1 reframes prospect-theory anomalies (loss aversion, reference dependence) and hyperbolic discounting as *state-dependent* preferences: if the current endowment is part of the state, a loss-averse agent can still be consistent. The move is productive as bookkeeping. But the ledger (X16) records the tension with the social-psychology material: construal, framing, motivated reasoning and naive realism are shifts in *beliefs* with presentation and mood, not tidily captured as state-dependent preferences; Camerer's learning chapter shows adaptive, path-dependent behaviour rather than fixed-point rationality; and Henrich shows preferences are culturally acquired and vary across societies, which BPC accommodates as data but does not predict. The verdict is Gintis's own on claim 3: partially holds up, overstated. Once anything can be a preference the model constrains little without auxiliary theory, which is what the rest of the reading list is; Gintis's reply that revealed-preference axioms such as transitivity are testable is correct but weaker than the rhetoric.\n\nWhat to carry into the brief, then, is the **BPC line as a discipline**: before proposing an intervention, write down what members believe about each other, what they value (including status and fairness, not just money), and what constrains them. Most \"incentive\" fixes change constraints while beliefs about what others will do stay the same, which is why they fail. Do not carry the claim that BPC *explains* construal effects, and note the falsifiability worry in the tag. Prefer the norm to the incentive when both are available (the disposition already exists and is cheaper to maintain; large explicit incentives can crowd it out), tagged [H] because crowding-out is real but context-dependent; this is tension t12 in m11."},{"title":"Common priors are culture: align beliefs by shared frames, not more dashboards","tag":"E","body":"Savage's axioms make a rational agent Bayesian, but they say nothing about where the prior comes from. The **common-prior assumption** (the Harsanyi doctrine: all players' beliefs derive from one prior updated on private information) is not derivable from rationality; it is a substantive claim that agents share a *culture*. Aumann's agreeing-to-disagree theorem shows how much work the assumption does: Bayesians with a common prior whose posteriors are common knowledge cannot disagree. Gintis's move is to replace \"common prior\" with \"shared cultural frame\", which is empirically checkable, and to locate the source of shared priors in cultural transmission, imitation and language: his most direct link to the Origins level.\n\nThis is the one place where the synthesis is well supported by the rest of the list, and the course's verdict on claim 4 is that it holds up. Conformist and prestige-biased learning (m1) are exactly how priors converge within groups and diverge between them; the cross-cultural game results show that \"priors\" about fair offers are socially shared and vary with the economics of daily life. Easley and Kleinberg (m9) add the qualifier: convergence follows network structure, so a group with weak cross-ties can host two priors, and the 2pq test tells you where the boundary is.\n\nThe diagnostic reading is the one the cold attempt targets. When two sub-teams keep reaching different conclusions from the same data, week after week, the first instinct is an information intervention: more metrics, a better dashboard, a shared report. If the disagreement persists on *shared* data, that instinct is wrong; the problem is different priors, that is, different cultures. The intervention is cultural: shared definitions of the metrics, joint training, shared stories about what past numbers meant, a common vocabulary. Aligning beliefs is a cultural intervention, not an information intervention, and it is tagged [E] for the direction (supported by Henrich and Laland) and [H] for the specific alignment intervention in your group.\n\nA related reframing: at a mixed Nash equilibrium nothing motivates mixing in exactly the equilibrium proportions, so Gintis reads a mixed equilibrium as a *conjecture about the opponent population*. A fraction who monitor and a fraction who do not is a **population fact** stabilised by norms and learning, not a coin each member flips; it is something to measure and shift.\n\nFinally, what to carry out of *The Bounds of Reason*. Two things. (1) The epistemic critique of Nash and the choreographer idea, which sharpen every Order-level book into one design question: *what is the signal, and why does each person comply given the others do?* (2) The discipline of writing down beliefs, preferences and constraints before proposing an intervention. Do not carry out the claim that the behavioural sciences have been unified, or that norm-following is settled evolutionary fact. Reviewers (Tyran, Rouchier, Field, Vanderschraaf; existence verified) praise the exposition of epistemic game theory and call the unification programmatic: chapter 12 lists five compatible principles (gene-culture coevolution, norms, game theory, the rational actor model, complexity theory) and asserts they suffice, but derives no result that sociology or anthropology lacked, and the complexity principle is not used at all. Rouchier's generous reading is the right one: game theory as a *complement* that keeps social theory honest about incentives and expectations. Per ledger rule 31: never write \"the unification\", and never attribute a review to Binmore; none was found, and Binmore and Gintis agree on the epistemic critique while fighting over strong reciprocity and group selection."}],"worked_example":{"title":"Your own v0 fix, re-run through the four layers (rubric only)","steps":["Stability. Is the pattern your v0 fix proposes an equilibrium at all? Ask the m3 question of the fixed state: would any single member gain by deviating alone, once everyone else is doing it? If yes, the fix is not a resting point and will need continuous enforcement; say so, and decide whether that is what you want.","Selection. Absent the fix, which stable state does the group's regime deliver? Name the regime: how members are matched (random or stable subgroups), how they update (success-copying or majority-copying), how large the group is, whether they can talk. Then say whether your fix changes the *regime* or only the *payoffs*. A fix that only sweetens the joint payoff leaves a risk-dominant regime risk-dominant.","Signal. What public cue tells each member which equilibrium is in play (a rota, a pinned cadence, a dashboard, a template, a ritual)? Run the two-part test: can everyone state what the norm requires of them and of others; does anyone gain by deviating given others comply, and is there a cheap sanction? Then check with m9 whether the signal is visible across the whole network or only inside one cluster.","Expectations. Which empirical and normative expectations must be live for the signal to work, and how will they be measured (the m7 two-step items)? If the normative expectation is absent, the choreographer's motivational half has failed and no amount of signal clarity repairs it.","Write the BPC line for the group: what members believe about each other, what they value (including status and fairness), what constrains them. Then say which layer the v0 fix addressed and which it ignored.","Required tags. [E] for the formal relations between the layers. [H] for which layer bites in this group. [V] for any claim about which equilibrium ought to be chosen; the layers tell you what is stable and reachable, not what is good."]},"hinge":[{"q":"A contribution norm is posted on a visible board; everyone can state it; compliance is still low. Which half has failed, and which reading repairs it?","options":["The epistemic half; make the board more visible, since compliance follows once the signal is unmistakable.","Neither; people are irrational, since a norm everyone can state and nobody follows defies any consistent preference.","The evolved norm psychology is absent in this group, since a normal group would have enforced it by instinct.","The motivational half: some members gain by deviating and no sanction bites; repair with graduated sanctions."],"answer":3,"diagnoses":["All norm failures as information failures. The epistemic test is passed (everyone can state the norm); more visibility adds nothing to a signal already seen.","\"Gintis shows people are irrational\" (`11` misreadings). He defends consistent-preference rationality; low compliance with a clear norm nobody has reason to follow is exactly what consistent preferences produce.","Strong reciprocity as a settled trait that should have carried compliance (ledger rule 4). The evolved-trait claim is [H]; the design lesson is to supply a cheap sanctioning channel, not to expect an innate disposition to do the work.","Correct. A choreographer needs both halves; here compliance is not a best response given others' compliance, so the repair is a cheap graduated sanction (m8) and live normative expectations (m7), plus Camerer's warning that cooperation decays without feedback (`11` ch 10)."]},{"q":"Which statement about the four accounts is the course's position?","options":["They are layered: stability test, selection absent intervention, the aligning signal, expectations inside agents.","Bicchieri's is the correct theory of norms; the others are approximations that her expectations account absorbs entirely.","Gintis unified them, so the four accounts are now one model and the brief can cite any of them interchangeably.","Skyrms's dynamics make the others redundant, since basin size decides outcomes without any beliefs at all."],"answer":0,"diagnoses":["Correct (ledger X5). The formal relations are [E]; which layer is binding for a particular group is the [H] the brief must state and test.","One account as \"the\" theory (ledger rule 1). Bicchieri is the best of the four on diagnosis and measurement, and says nothing about basin size or where the signal comes from.","\"The unification\" (ledger C55). Chapter 12 shows compatibility and derives no new result; the ordering of interventions comes from the other books.","Dynamics without beliefs as the whole story (ledger C41). Skyrms's agents have no expectations to measure and his results do not rescue true PDs; institutions and expecta
