, best-response updating, large groups and no communication it wins in models and in the lab (weak-link groups of 14 to 16 fell to minimum effort while fixed pairs reached the top). Coordination failure is strategic uncertainty plus history, so sweetening the joint payoff is the weakest lever. Group size and the aggregation rule are design variables, and selection devices (two-way talk, leader communication, focal labels, gradual growth from a small core) beat payoff sweeteners.","tag":"E","links":["nash-stability-test","correlation-master-variable","cheap-talk-expectations","limited-reasoning-and-history","ostrom-principles","four-layers"],"sources":["06-behavioral-game-theory","07-stag-hunt","04-games-of-strategy"]},{"id":"shadow-of-the-future","label":"Repetition permits cooperation as one equilibrium among many; selection and fast detection are separate problems","summary":"Cooperation survives in a repeated dilemma only when the future is long, uncertain and observable; announced endpoints unravel it and noise demands forgiveness. The folk theorem is an existence result, so the group must still coordinate on the cooperative equilibrium and detect defection fast; recommend \"nice, retaliatory, forgiving, clear\", never tit-for-tat by name. Ostrom's field variable for the discount factor is turnover: make users transient and the commons breaks.","tag":"E","links":["draw-the-game","credibility-and-signals","within-group-enforcement","graduated-sanctions-monitoring","institutions-incremental"],"sources":["04-games-of-strategy","09-governing-the-commons"]},{"id":"credibility-and-signals","label":"Threats and promises work only when executing them is in your interest at the time; costly signals reveal type","summary":"Credibility is manufactured by limiting oneself through commitment devices, delegation, reputation and small steps; a sanction that would not actually be applied is not a sanction. Asymmetric information is solved by signals cheaper for the good type and menus that make each type reveal itself, and credibility-enhancing displays are the cultural version. A leader who says \"quality first\" and ships anyway is a non-signal, and members copy the shipping.","tag":"E","links":["shadow-of-the-future","copying-strategies","graduated-sanctions-monitoring","norm-as-choreographer"],"sources":["04-games-of-strategy","01-secret-of-our-success"]},{"id":"social-preferences-conditional","label":"Fairness and generosity are real, intention-sensitive and cue-dependent; model people as a distribution of types","summary":"Ultimatum offers average about 40% and about half of offers below 20% are rejected, falling at high stakes; dictator giving averages about 28% but collapses under double-blind anonymity, which is fragile norm compliance, not altruism. Roughly half of subjects are conditional cooperators and no single social-preference model wins. Treat fairness as a distribution of norm-sensitivities conditional on cues, and never state a baseline without the group's own norms.","tag":"E","links":["norm-psychology","norm-anatomy","situation-and-construal","strong-reciprocity-split","cheap-talk-expectations"],"sources":["06-behavioral-game-theory","03-social-psychology"]},{"id":"limited-reasoning-and-history","label":"First-contact play is one to two steps deep and norm-driven; early rounds lock in the steady state","summary":"Beauty-contest first rounds average about 35 to 36 against a Nash prediction of zero, and cognitive-hierarchy fits give about 1.5 steps of reasoning. Equilibrium is reached, if at all, through path-dependent learning: early rounds determine where weak-link groups settle, and what is robust is that feedback and early rounds matter, not any parametric learning model. The first few interactions of a group are disproportionately valuable.","tag":"E","links":["risk-dominance-default","nash-stability-test","rogers-paradox","institutions-incremental"],"sources":["06-behavioral-game-theory"]},{"id":"situation-and-construal","label":"Situations dominate, we underweight them, and the label on an interaction moves behaviour as much as its payoffs","summary":"The attribution error makes groups blame people for what structures produced; the robust list is conformity, obedience, attribution error, dissonance, polarization, loafing, minimal groups, moderate contact effects and low-risk bystander effects. Construal is the lever: the \"Community Game\" label roughly doubled dilemma cooperation over \"Wall Street Game\", descriptive and injunctive channels must point the same way, and descriptive feedback alone boomerangs above the norm. A single dissenter breaks conformity; do not build on ego depletion, priming, power posing, watching eyes, the prison experiment or IAT training.","tag":"E","links":["copying-strategies","social-preferences-conditional","norm-anatomy","pluralistic-ignorance-cascades","bpc-bookkeeping"],"sources":["03-social-psychology"]},{"id":"contingent-behaviour-tipping","label":"When choices depend on how many others choose, the population has thresholds, multiple equilibria and tipping points nobody intended","summary":"Macro is not micro summed: mild in-group preferences plus refusal to be a small minority can produce near-total sorting, so homogeneity is weak evidence of intolerance (a possibility proof; empirical tipping is roughly 5 to 20% minority share). A tipping point is an unstable equilibrium in the threshold distribution, and the scarce resource is low-threshold actors, not influencers. The binary-choice diagram separates multi-person dilemmas (enforce), coordination games (seed and switch) and stable interior mixes (leave alone); critical mass k is the size of the pilot you need.","tag":"E","links":["draw-the-game","nash-stability-test","network-structure","correlation-master-variable","pluralistic-ignorance-cascades"],"sources":["05-micromotives-and-macrobehavior"]}]},{"id":"order","title":"Order: how norms, institutions and networks turn interaction into stable collective patterns","certainty":"8 [E], 1 [H]: Bicchieri's taxonomy, cheap talk roughly doubling and decaying, pluralistic ignorance, the threshold and cluster theorems, the structural weak-tie claim, Ostrom's checklist and by-product monitoring are backed by models, lab effects and a systematic review, but every prescription about your group is [H] and every choice of what to optimize is [V].","nodes":[{"id":"norm-anatomy","label":"A social norm is a conditional preference plus an empirical expectation plus a normative expectation; diagnose by the expectations, not the behaviour","summary":"Bicchieri's taxonomy is the working vocabulary: a descriptive norm runs on empirical expectations alone and flips when the visible majority changes; a convention is a coordination equilibrium and needs no policeman; a social norm runs against private incentives, needs normative expectations, and collapses when people stop believing others expect it; a moral norm is unconditional and cannot be engineered by changing expectations. The two-step elicitation is usable but design-sensitive. The reference network, not the org chart, is the unit of measurement.","tag":"E","links":["norm-psychology","social-preferences-conditional","norms-transform-games","pluralistic-ignorance-cascades","four-layers","norm-as-choreographer"],"sources":["08-grammar-of-society"]},{"id":"norms-transform-games","label":"A live norm changes the game, not the payoffs, and only while the expectations that it applies are live","summary":"When enough people expect the norm to apply, a dilemma becomes a coordination game with a norm-following equilibrium. Activation is cue-driven: scripts select which norm applies, and framing, observation and salience switch it on without changing values, though any specific cue remains [H]. Norm-based utility is the working model, with the caveat that its superiority over inequity aversion is argued rather than shown.","tag":"E","links":["norm-anatomy","draw-the-game","situation-and-construal","cheap-talk-expectations","norm-as-choreographer"],"sources":["08-grammar-of-society"]},{"id":"cheap-talk-expectations","label":"Relevant talk roughly doubles cooperation by manufacturing expectations; it decays without repetition or sanctions where defection dominates","summary":"In eight-person dilemmas, relevant face-to-face discussion raised cooperation from roughly 30 to roughly 70 percent, and communication is the strongest single lever in the meta-analyses. The mechanism is that talk creates empirical and normative expectations, which is why it works for humans even though Skyrms's motive-free agents show talk only expands the stag basin transiently and cannot rescue a dilemma. Contributions decay over rounds and recover with punishment, so use talk to launch and back it with repetition and graduated sanctions.","tag":"E","links":["norms-transform-games","risk-dominance-default","graduated-sanctions-monitoring","correlation-master-variable"],"sources":["08-grammar-of-society","07-stag-hunt","06-behavioral-game-theory"]},{"id":"pluralistic-ignorance-cascades","label":"Unpopular norms live on shared misperception; measure and publish expectation gaps, and use trendsetters to collapse them","summary":"People infer others' approval from others' compliance, which rests on the same inference, so a norm most privately reject can persist. Because it rests on little information it is fragile: a credible public signal, a visible low-threshold trendsetter, or publishing the measured gap can collapse it fast. Name which kind of copying is meant: informational cascade (collect private signals first), network effect (cross the tipping point), or coordination on a graph (lower q or seed inside clusters).","tag":"E","links":["norm-anatomy","situation-and-construal","contingent-behaviour-tipping","network-structure"],"sources":["08-grammar-of-society","03-social-psychology","10-networks-crowds-markets"]},{"id":"correlation-master-variable","label":"Cooperation spreads when like meets like more than chance, and only under success-copying","summary":"Skyrms's master variable is any departure from random matching: local interaction, partner choice and reinforcement, cheap-talk handshakes and small stable groups all make stag hunters meet stag hunters. The learning rule decides whether structure helps: under imitate-the-best, fair division and stag hunting spread contagiously from small clusters, while under best response local interaction accelerates the risk-dominant outcome. When structure adapts faster than strategies cooperation wins, so the speed ratio is a rollout variable; every result is a model result.","tag":"E","links":["risk-dominance-default","copying-strategies","network-structure","four-layers"],"sources":["07-stag-hunt"]},{"id":"network-structure","label":"Bridges carry information, closure carries enforcement, and costly behaviour needs several adopting neighbours","summary":"Local bridges tend to be weak and carry novelty; closed triangles carry trust and sanction; a group needs both and the bridges are fragile. Adoption pays once a fraction q = b/(a + b) of neighbours have adopted, and a cluster of density greater than 1 - q blocks a cascade from outside and protects one inside, so information crosses one weak tie but costly behaviour needs wide bridges. Assume observed similarity is selection, not influence, without longitudinal data.","tag":"E","links":["copying-strategies","learning-network-connectivity","correlation-master-variable","contingent-behaviour-tipping","pluralistic-ignorance-cascades","ostrom-principles"],"sources":["10-networks-crowds-markets"]},{"id":"ostrom-principles","label":"Durable self-governed commons share eight structural regularities; they are a diagnostic checklist, not a recipe","summary":"Clear boundaries, congruence with local conditions and between benefit and cost, collective-choice arrangements, monitoring accountable to users, graduated sanctions, cheap conflict resolution, recognized right to organize, and nested enterprises; a review of 91 studies found them well supported, with publication bias and loose coding. Cases were selected on the dependent variable, the principles are structure not process, and several durable cases are inegalitarian. Scope is subtractable resources with costly exclusion, and failures most often lack boundaries, congruence or external recognition.","tag":"E","links":["draw-the-game","risk-dominance-default","network-structure","graduated-sanctions-monitoring","institutions-incremental","four-layers"],"sources":["09-governing-the-commons"]},{"id":"graduated-sanctions-monitoring","label":"Compliance is contingent on expected compliance and expected detection; cheap by-product monitoring plus small first sanctions keep the belief that the rule is alive","summary":"Ostrom's appropriators comply quasi-voluntarily: if most others do and violators are likely caught. Monitoring in durable cases is a by-product of use, and first sanctions are small, quick and public, escalating only for repeat offenders, which preserves information flow about violations. This is the field form of the lab's costly punishment: real sanctioning is mostly cheap (gossip, ostracism, small fines), and a harsh first sanction drives violations underground and kills the monitoring.","tag":"E","links":["shadow-of-the-future","credibility-and-signals","within-group-enforcement","cheap-talk-expectations","ostrom-principles","strong-reciprocity-split"],"sources":["09-governing-the-commons","06-behavioral-game-theory"]},{"id":"institutions-incremental","label":"Institutions are copied from successful peers and then crafted incrementally by the people they bind, in an arena recognized from outside","summary":"Ostrom's cases show incremental crafting in external arenas rather than one constitutional act, and Henrich's picture is copy-and-modify with designers rationalizing afterwards; neither \"design from scratch\" nor \"just copy\" is evidenced. Rules live at three levels (operational, collective-choice, constitutional) and most stalled reforms fail at the middle level, where those bound by the rules have no legitimate route to change them. Take-off is predicted by small stable groups, shared information, low discount rates and prior organizing experience.","tag":"H","links":["within-group-enforcement","shadow-of-the-future","limited-reasoning-and-history","ostrom-principles","norm-as-choreographer"],"sources":["09-governing-the-commons","01-secret-of-our-success"]}]},{"id":"synthesis","title":"Synthesis under critique: Gintis's attempted unification and its problems","certainty":"3 [E], 3 [H], with an [H] caveat inside every [E] node: the epistemic critique of Nash, correlated equilibrium with a norm as signal and the layered reconciliation are formal or theorem-backed, while the empirical superiority of correlated equilibrium, BPC as an explanation of construal, evolved strong reciprocity and the complexity program are argued, not shown; the band most argued and least shown.","nodes":[{"id":"nash-is-social-achievement","label":"Rationality plus common knowledge of rationality yields only rationalizability; equilibrium needs aligned conjectures from outside the players' heads","summary":"Theorem-backed and one of the two contributions reviewers credit: Nash cannot be derived from rationality alone, refinements failed to fix multiplicity, and alignment comes from history, focal points and norms. The common-prior doctrine is an empirical claim that people share a belief-forming culture, so belief alignment is a cultural intervention. \"Smart people will converge\" is not a prediction.","tag":"E","links":["nash-stability-test","norm-as-choreographer","four-layers","cumulative-culture"],"sources":["11-bounds-of-reason"]},{"id":"norm-as-choreographer","label":"A norm is a public signal implementing a correlated equilibrium: following it is a best response when others follow it","summary":"Aumann's correlated equilibrium with the norm as correlating device: the signal, not a person. A schedule, rota, dashboard, referee or clearly stated rule can play the role, and a vague norm is a choreographer that does not choreograph. The formal claim holds, but no data horse race was run, so do not claim correlated equilibrium fits behaviour better than Nash; the choreographer is weaker than Bicchieri on diagnosis, Ostrom on authorship and Skyrms on origins.","tag":"E","links":["nash-is-social-achievement","norm-anatomy","norms-transform-games","credibility-and-signals","institutions-incremental","four-layers"],"sources":["11-bounds-of-reason"]},{"id":"four-layers","label":"The four accounts of how a group settles on a pattern are layers, not rivals: stability test, drift prediction, public signal, inner expectations","summary":"Layer 1 (Nash/ESS) tests whether a candidate pattern is stable at all; layer 2 (Skyrms and Camerer) predicts which stable pattern a group reaches absent intervention; layer 3 (Gintis) names what a norm does, supplying a public signal that aligns conjectures; layer 4 (Bicchieri) specifies what must be true inside the agents for the signal to work and how to measure it. The layers are checked in order because a pattern that fails layer 1 cannot be rescued by layers 3 or 4. The relations are [E]; which layer bites in a given group is [H]; never present one as the theory of norms.","tag":"E","links":["nash-stability-test","risk-dominance-default","norm-as-choreographer","norm-anatomy","correlation-master-variable","ostrom-principles"],"sources":["11-bounds-of-reason","07-stag-hunt","08-grammar-of-society","06-behavioral-game-theory"]},{"id":"bpc-bookkeeping","label":"Beliefs, preferences and constraints are the minimal common language, and \"rational\" is not \"selfish\"; the model is bookkeeping, not an explanation of anomalies","summary":"Rational choice means consistent preferences, which may be altruistic, spiteful or norm-following; when a group \"isn't rational\", look for the belief or preference you mis-specified. Gintis's reframing of loss aversion, discounting and social preferences as state-dependent preferences partially holds up but is overstated, and construal and framing are better described as belief shifts. Use BPC to write down assumptions; do not use it to explain construal effects.","tag":"H","links":["situation-and-construal","social-preferences-conditional","nash-stability-test","strong-reciprocity-split"],"sources":["11-bounds-of-reason"]},{"id":"strong-reciprocity-split","label":"Willingness to pay to punish unfair intentions is lab evidence; \"an evolved strong-reciprocity trait\" is a hypothesis; real sanctioning is cheap","summary":"Gintis, with Bowles, Boyd and Fehr, argues for an evolved predisposition to cooperate conditionally and punish at cost even one-shot; Binmore and Shaked argue one-shot lab behaviour reflects heuristics tuned for repeated play, Guala argues field punishment is mostly gossip and ostracism, and rejections fall at high stakes. The lab effect is [E], the evolved trait is [H], and the book's own verdict is that the evidence supports a weaker version. Design on the cheap, graduated version and give the punishing impulse a legitimate channel.","tag":"H","links":["norm-psychology","social-preferences-conditional","graduated-sanctions-monitoring","within-group-enforcement","bpc-bookkeeping"],"sources":["11-bounds-of-reason","06-behavioral-game-theory"]},{"id":"unification-programmatic","label":"The five-part program (gene-culture coevolution, norms, game theory, rational actor, complexity) is a framework and checklist, not a finished theory","summary":"Reviewers call the book programmatic: the final chapter derives no new result and complexity theory is asserted, not used. Its durable contributions are the epistemic critique of Nash and the choreographer idea; the general equilibrium-selection problem is moved up a level, not solved. Its value for the learner is as a checklist of five things any account of a group must address; never write \"the unification\".","tag":"H","links":["four-layers","norm-as-choreographer","culture-drove-brains","within-group-enforcement"],"sources":["11-bounds-of-reason"]}]}],"chain":["Humans are cultural learners: a person's competence and sense of what is normal come from selectively copying others, not from working things out alone (cumulative-culture).","Copying runs on rules, not arguments: people copy the successful, the prestigious, the majority and the similar, especially when uncertain, because what is displayed has already been filtered by the displayer's incentives; persuasion is the weak channel (copying-strategies).","Copying carries norms, and humans are built to hold them: we learn what others expect, feel shame at violation and sanction violators, and the psychology is content-neutral, enforcing whatever rules it finds (norm-psychology).","Therefore what a group does is a stable pattern before it is anyone's choice: once enough people follow a rule, following it is each person's best reply; stability is the only thing equilibrium certifies, several patterns can coexist, and history picks one (nash-stability-test, contingent-behaviour-tipping).","Which pattern a group drifts to is predictable, and it is usually the safe one: under random mixing, best-response learning, large numbers and no communication, the risk-dominant outcome wins because its basin is larger, not because it is better (risk-dominance-default).","Most cooperation problems are trust problems, not temptation problems: ask whether a member gains by defecting when everyone else cooperates; no means stag hunt (assurance), yes means dilemma (payoff change, repetition or sanctions); diagnose before prescribing (draw-the-game, shadow-of-the-future).","Fairness and generosity are real but conditional: people pay to punish unfair intentions, give when observed and cooperate if they expect others to, and most of this is cued norm compliance that moves with framing, anonymity and expectations (social-preferences-conditional, situation-and-construal).","Therefore a norm is a fact about expectations: a social norm exists when people prefer to follow a rule on condition that they believe others follow it and believe others expect them to; remove either belief and the behaviour goes (norm-anatomy).","A live norm changes the game: while both expectations hold, a dilemma becomes a coordination game, and the cheapest way to create the expectations is relevant talk, which roughly doubles lab cooperation but decays without repetition or sanctions where defection dominates (norms-transform-games, cheap-talk-expectations).","Whether the good pattern spreads depends on who meets whom and who copies whom: any departure from random matching that makes cooperators meet cooperators enlarges the good basin, but only under success-copying; dense clusters block a norm entering and protect one adopted inside; costly behaviour needs several adopting neighbours (correlation-master-variable, network-structure).","None of this holds by itself, so durable groups build institutions: commons that last have clear boundaries, rules fitted to conditions, participation in rule-making, cheap by-product monitoring, graduated sanctions, cheap conflict resolution and outside recognition; a checklist, not a recipe (ostrom-principles, graduated-sanctions-monitoring).","Institutions are copied, then crafted incrementally by the people they bind: start from a visibly successful peer's norm package and revise in small steps with the members; rules are as strong as the arena for changing them (institutions-incremental).","A working institution is a choreographer: a public signal that tells each person what to do and expect, so the cooperative pattern is a correlated equilibrium nobody wants to leave; that alignment is a social achievement, not a deduction from rationality (nash-is-social-achievement, norm-as-choreographer).","A designed institution sustains cooperation in a real group when all four layers hold at once: the target pattern is stable (layer 1), the group's matching and learning regime lets it be reached (layer 2), a clear public signal names it (layer 3), and members' measured empirical and normative expectations point at it (layer 4); the learner checks each layer, in order, and keeps checking (four-layers)."],"laws":["Classify before you prescribe. [E] If nobody has written down whether a member gains by defecting when all others cooperate, the fix is a guess between a dilemma and a stag hunt. (draw-the-game, nash-stability-test)","Stability is not approval. [E] A pattern everyone dislikes can be stable and one everyone prefers can be unreachable; watch for \"but it's the equilibrium\" used as a defence. (nash-stability-test, contingent-behaviour-tipping)","Absent intervention, a large mixed group takes the safe outcome, not the good one. [E] A payoff-dominant practice nobody adopts alone is strategic uncertainty, not insufficient reward; sweetening the payoff is the weakest lever. (risk-dominance-default)","A norm is a fact about expectations, so measure expectations, not attitudes. [E] A group that surveys \"buy-in\" and skips \"what do you think others do and expect\" will mispredict behaviour. (norm-anatomy, pluralistic-ignorance-cascades)","Descriptive and injunctive signals must point the same way; never advertise low adoption. [E] Any message of the form \"too many people still do X\" is a violation. (situation-and-construal, norm-anatomy)","Talk launches; repetition and sanction sustain. [E] lab, [H] persistence. Cooperation that rose after a discussion and fell over the following weeks with no payoff change is the expected decay. (cheap-talk-expectations, shadow-of-the-future)","Cooperators must meet cooperators more than chance, and only success-copying makes structure help. [E] A rollout to a large randomly mixed audience, or one where people copy the majority rather than the visibly successful, converges on the risk-dominant practice. (correlation-master-variable, copying-strategies)","Costly behaviour needs several adopting neighbours; seed inside clusters and grow slowly. [E] A practice announced across weak ties that spreads awareness but not adoption is a complex contagion pushed through a simple-contagion channel. (network-structure, contingent-behaviour-tipping)","First sanctions are small, quick and public; monitoring is a by-product of use. [E] Where the first response to a violation is severe, or monitoring needs a monitor nobody wants to be, violations go underground and enforcement lapses. (graduated-sanctions-monitoring, strong-reciprocity-split)","Those bound by the rules must have a legitimate route to change them. [E] as a regularity, [H] as a cause. A rule set with no collective-choice arena, or one unrecognized by the surrounding authority, is abandoned rather than revised. (institutions-incremental, ostrom-principles)","A norm is only as strong as its signal is specific and its signaller credible. [E] formal, [H] for any group. A vague value and a leader whose costly actions contradict the stated rule both align no one; watch what people copy, not what they applaud. (norm-as-choreographer, credibility-and-signals)","Certainty flows upward only as far as the mechanism beneath it, and what to optimize is your choice. [V] A brief that tags a prescription [E] while its mechanism is [H], or presents \"fairness\" as evidence rather than commitment, has broken the tagging discipline; the course adopts this, it does not prove it. (four-layers, unification-programmatic)"],"loop":"The learner runs one loop with five stations, and the four layers of `four-layers` sit inside it; it is the same loop at three scales (a single practice, a group's norms, and the institution that governs who may change the rules). **1. Diagnose the game** (`draw-the-game`): write players, options, payoffs, order and information; ask whether a member gains by defecting when everyone else cooperates (yes is a dilemma, no is a stag hunt), add Schelling's binary-choice diagram for a large population, check layer 1 (is the target pattern an equilibrium at all?) and layer 2 (where does the group drift given size, matching and learning regime?), and record the classification as [H]. **2. Measure expectations** (`norm-anatomy`): run the two-step elicitation in the reference network, not the org chart, asking what people believe others do and what they believe others think they ought to do about specific behaviours; compare with private attitudes to find pluralistic ignorance (`pluralistic-ignorance-cascades`) and classify each rule as descriptive, convention, social or moral; this is layer 4 and the step most groups skip. **3. Choose the lever, by layer**: if layer 1 fails, change the game, not the messaging (payoffs, repetition, detection, boundaries, sanctions: `shadow-of-the-future`, `ostrom-principles`, `graduated-sanctions-monitoring`); if layer 2 fails, use correlation and selection devices (small stable units, success-visible imitation, public pledges, gradual growth from a core, seeding inside clusters: `correlation-master-variable`, `risk-dominance-default`, `network-structure`), where money is the weakest lever; if layer 3 fails, make the norm specific and the signaller credible with a written rule, a rota, a dashboard or a costly leader commitment (`norm-as-choreographer`, `credibility-and-signals`); if layer 4 fails, use relevant talk, publish the measured gap, recruit trendsetters and pair descriptive with injunctive signals, never advertising low adoption (`cheap-talk-expectations`, `situation-and-construal`); tag each lever [E] for the mechanism, [H] for its effect in this group, [V] where a goal rather than a means is being chosen. **4. Test small, with a prediction**: write the prediction the lever implies, a practical measure that would show it and a balancing measure that would show harm, run at the smallest scale where the game is the same (critical mass k, or one cluster), and, because early rounds lock in (`limited-reasoning-and-history`), engineer the pilot's first interactions most carefully with rich feedback, visible history and a core that already coordinates. **5. Re-measure and revise**: if behaviour and expectations both moved, scale gradually and keep the sanction and repetition backing; if behaviour moved but expectations did not, the change rides on observation and will decay when observation lapses; if expectations moved but behaviour did not, the game is unstable at layer 1, so return to station 1. The loop breaks in two predictable ways: skipping station 2 and prescribing values workshops, incentives or messaging without knowing which kind of norm you face (how boomerangs and dead rules are made), and treating a lab or model result as a point estimate for the group, when mechanisms transfer and numbers do not; a quieter third is copying a peer's practice without a test budget (`rogers-paradox`). At institution scale, station 3 is about collective-choice rules, the loop itself is what is being designed, and Ostrom's principles are the checklist for whether it can keep running (`institutions-incremental`)."}}</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("course-data").textContent);
const C = DATA.course || {};
const MODULES = DATA.modules || [];
const TAGS = Object.assign({ E: "supported by evidence", H: "hypothesis to test", V: "value commitment" }, C.tags || {});
const CARDS = DATA.cards || [];
const CASES = DATA.cases || [];
const TENSIONS = DATA.tensions || [];
const BRIEF = DATA.brief || [];
const MODEL = DATA.model || { bands: [] };
const DIAG = DATA.diagnostic || [];
const DAY = 86400000;

/* ---------- state + persistence ---------- */
const blank = () => ({ v: 1, updatedAt: 0, started: Date.now(), modules: {}, cards: {}, cases: {}, brief: {}, diag: [] });
let S = blank();
const LS_KEY = (C.slug || "course") + "-state";
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

let db = null, stateRef = null, syncNote = "Saved in this browser";
let writing = false, pending = false, timer = null;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (!stateRef) return;
  clearTimeout(timer);
  timer = setTimeout(flush, 1200);
}
async function flush() {
  if (!stateRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await stateRef.set(JSON.parse(JSON.stringify(S))); syncNote = "Synced to your account"; }
  catch (e) { syncNote = e && e.code === "quota_exceeded" ? "Account storage is full; saved in this browser" : "Saved in this browser (sync paused)"; }
  writing = false;
  renderSync();
  if (pending) { pending = false; flush(); }
}
async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d;
    stateRef = db.doc("data/users/" + id + "/state");
    const snap = await stateRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(blank(), JSON.parse(JSON.stringify(remote))); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} route(); }
      else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) flush();
    } else if (S.updatedAt) flush();
    syncNote = "Synced to your account";
    renderSync();
  } catch (e) { /* stay local */ }
}

/* ---------- Claude mentor ---------- */
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  return samplePromise;
}
const SAMPLE_MSG = {
  not_granted: "Mentor feedback is turned off for this page.", sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "Too many requests just now. Try again in a minute.", session_expired: "Sign in to claude.ai again, then retry.",
  prompt_too_large: "That was too long to send. Shorten your answer and retry.", refused: "Claude declined this one. Rephrase and retry."
};
async function mentorViaEndpoint(outEl, btn, prompt) {
  // Self-hosted mode: POST the prompt to your own server, which calls the Claude API and streams
  // plain text back (see scripts/mentor-proxy.mjs). Nothing else leaves the browser.
  btn.disabled = true; outEl.hidden = false; outEl.textContent = "Thinking...";
  try {
    const r = await fetch(C.mentor_endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const reader = r.body.getReader(), dec = new TextDecoder(); let text = "";
    for (;;) { const { value, done } = await reader.read(); if (done) break; text += dec.decode(value, { stream: true }); outEl.innerHTML = md(text); }
    if (!text) outEl.textContent = "No reply.";
  } catch (e) { outEl.innerHTML = "<p class='muted'>" + esc("Couldn't reach the mentor service (" + (e && e.message || e) + ").") + "</p>"; }
  finally { btn.disabled = false; }
}
async function mentor(outEl, btn, prompt) {
  if (C.mentor_endpoint && !(window.claude && window.claude.use)) return mentorViaEndpoint(outEl, btn, prompt);
  const sample = await getSample();
  if (!sample) { outEl.hidden = false; outEl.textContent = "Mentor feedback works when this page is opened on claude.ai, or when the course is hosted with a mentor endpoint."; return; }
  btn.disabled = true; outEl.hidden = false; outEl.textContent = "Thinking...";
  try {
    await sample(prompt, { modelTier: "default", cache: false, onText: ({ text }) => { outEl.innerHTML = md(text); } });
  } catch (e) {
    if (e && e.code === "cancelled") return;
    outEl.innerHTML = (e && e.text ? md(e.text) + "<p class='muted'>(interrupted)</p>" : "") + "<p class='muted'>" + esc(SAMPLE_MSG[e && e.code] || "Couldn't reach Claude. Try again.") + "</p>";
  } finally { btn.disabled = false; }
}
const MENTOR_VOICE = C.mentor_voice || "You are a demanding but supportive mentor (high standards, high support). Be specific and concise (under 250 words). Use markdown bullets. Tag claims as [E] evidence, [H] hypothesis, [V] value where useful.";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
          .replace(/\[(E|H|V)\]/g, '<span class="tag $1">$1</span>');
}
function md(src) {
  const lines = esc(src || "").split(/\n/);
  let out = "", list = null, para = [];
  const flushP = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeL = () => { if (list) { out += "</" + list + ">"; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    let m;
    if (!l) { flushP(); closeL(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flushP(); closeL(); out += "<h4>" + inline(m[1]) + "</h4>"; continue; }
    if ((m = l.match(/^[-*]\s+(.*)/))) { flushP(); if (list !== "ul") { closeL(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { closeL(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    closeL(); para.push(l);
  }
  flushP(); closeL();
  return out;
}
const tagChip = t => t ? `<span class="tag ${esc(t)}" title="${esc(TAGS[t] || "")}">${esc(t)}</span>` : "";
const modState = id => (S.modules[id] = S.modules[id] || { hinge: {}, attempt: "", brief: "", done: false });
const L = "ABCDEFGH";
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const saveSoon = debounce(save, 600);
function bookName(slug) {
  const s = String(slug).replace(/^books\//, "").replace(/\.md.*$/, "").replace(/^\d+-/, "").replace(/-/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- SRS (SM-2 lite) ---------- */
function cardState(id) { return S.cards[id]; }
function dueCards() {
  const now = Date.now();
  const unlocked = new Set(MODULES.filter(m => modState(m.id).done || m.id === "m0").map(m => m.id));
  const seen = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].due <= now);
  const fresh = CARDS.filter(c => !S.cards[c.id] && unlocked.has(c.module));
  const newToday = Object.values(S.cards).filter(c => c.firstSeen && now - c.firstSeen < DAY).length;
  return seen.sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).concat(fresh.slice(0, Math.max(0, 20 - newToday)));
}
function grade(id, g) {
  const now = Date.now();
  const c = S.cards[id] || { ease: 2.5, interval: 0, reps: 0, firstSeen: now, lapses: 0 };
  if (g === 0) { c.reps = 0; c.lapses++; c.interval = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = now + 10 * 60000; }
  else {
    c.reps++;
    if (c.reps === 1) c.interval = g === 3 ? 3 : 1;
    else if (c.reps === 2) c.interval = g === 3 ? 7 : 3;
    else c.interval = Math.round(c.interval * c.ease * (g === 1 ? 0.6 : g === 3 ? 1.3 : 1));
    c.ease = Math.max(1.3, c.ease + (g === 1 ? -0.15 : g === 3 ? 0.15 : 0));
    c.due = now + c.interval * DAY;
  }
  S.cards[id] = c; save();
}

/* ---------- nav ---------- */
function renderNav(active) {
  const mods = MODULES.map(m => {
    const st = modState(m.id);
    return `<a href="#${m.id}" class="${active === m.id ? "on" : ""}"><span class="num">${m.id === "m0" ? "START" : "M" + m.num}</span><span>${esc(m.title)}</span><span class="tick">${st.done ? "done" : ""}</span></a>`;
  }).join("");
  const due = dueCards().length;
  const tools = [
    ["home", "Overview", ""], ["cards", "Review deck", due ? due + " due" : ""], ["brief", C.artifact_name || "Design brief", ""],
    ["model", "Unified model", ""], ["tensions", "Tensions", TENSIONS.length], ["cases", "Casebook", CASES.length], ["diagnostic", "Diagnostic", ""]
  ].map(([id, t, x]) => `<a href="#${id}" class="${active === id ? "on" : ""}"><span class="num">&#9679;</span><span>${t}</span><span class="label">${x}</span></a>`).join("");
  $("#rail").innerHTML = `<div class="brand"><span class="label">A course in ${(C.levels || []).length || "three"} levels</span><b>${esc(C.title || "Course")}</b></div>
    <div class="navgroup"><span class="label">Workbench</span><div class="nav">${tools}</div></div>
    <div class="navgroup"><span class="label">Modules</span><div class="nav">${mods}</div></div>
    <p class="sync muted" id="sync">${esc(syncNote)}</p>`;
}
function renderSync() { const el = $("#sync"); if (el) el.textContent = syncNote; }

/* ---------- views ---------- */
function viewHome() {
  const done = MODULES.filter(m => modState(m.id).done).length;
  const next = MODULES.find(m => !modState(m.id).done);
  const due = dueCards().length;
  const learned = Object.values(S.cards).filter(c => c.reps >= 2).length;
  const briefCount = Object.values(S.brief).reduce((n, a) => n + (a || []).length, 0);
  const totalMin = MODULES.reduce((n, m) => n + (m.minutes || 0), 0);
  const levels = C.levels || [...new Set(MODULES.map(m => m.level))];
  return `<div class="sheet wide">
    <header class="head">
      <span class="label">${esc(C.title || "")} &middot; ${MODULES.length} modules &middot; ~${Math.round(totalMin / 60)} hours &middot; ${C.source_count || "?"} sources</span>
      <h1>${esc(C.tagline || "")}</h1>
      <p class="lede">${esc(C.lede || "")}</p>
      <div class="row">${tagChip("E")}<span class="muted">${esc(TAGS.E)}</span>${tagChip("H")}<span class="muted">${esc(TAGS.H)}</span>${tagChip("V")}<span class="muted">${esc(TAGS.V)}</span></div>
    </header>
    <div class="grid">
      <a class="tile" href="#${next ? next.id : "cards"}"><span class="label">Up next</span><span class="big">${next ? (next.id === "m0" ? "Start" : "M" + next.num) : "Capstone"}</span><span>${esc(next ? next.title : "All modules complete")}</span></a>
      <a class="tile" href="#cards"><span class="label">Review deck</span><span class="big">${due}</span><span>cards due today &middot; ${learned} of ${CARDS.length} learned</span></a>
      <div class="tile"><span class="label">Modules complete</span><span class="big">${done}/${MODULES.length}</span><div class="bar"><i style="width:${MODULES.length ? done / MODULES.length * 100 : 0}%"></i></div></div>
      <a class="tile" href="#brief"><span class="label">${esc(C.artifact_name || "Design brief")}</span><span class="big">${briefCount}</span><span>${esc(C.artifact_items || "decisions")} recorded</span></a>
    </div>
    <section class="step"><span class="label">The sequence</span>
      <div class="modlist">${MODULES.map(m => `<a class="modrow" href="#${m.id}"><span class="num">${m.id === "m0" ? "0" : m.num}</span><span><span class="t">${esc(m.title)}</span><br><span class="muted">${esc(m.level)} &middot; ${(m.sources || []).slice(0, 3).map(bookName).join(", ")}</span></span><span class="meta">${m.minutes || ""} min<br>${modState(m.id).done ? "done" : ""}</span></a>`).join("")}</div>
    </section>
    <section class="step"><span class="label">How to work each day (45-60 min)</span>
      <div class="prose"><ol>
        <li><strong>Review deck first</strong>, 5-10 minutes. Spacing is where retention comes from.</li>
        <li><strong>Attempt before you read.</strong> Every module opens with a problem. Write a real answer, even a bad one. The struggle prepares you for the explanation.</li>
        <li><strong>Read the ideas, then do the hinge questions honestly.</strong> A wrong answer tells you which misconception to fix.</li>
        <li><strong>Change your brief.</strong> Every module ends with a decision to add or revise, tagged ${tagChip("E")} ${tagChip("H")} or ${tagChip("V")}.</li>
      </ol></div>
    </section>
  </div>`;
}

function viewModule(m) {
  const st = modState(m.id);
  const hinge = (m.hinge || []).map((h, i) => {
    const pick = st.hinge[i];
    const opts = h.options.map((o, j) => {
      let cls = "";
      if (pick != null) { if (j === h.answer) cls = "right"; else if (j === pick) cls = "wrong"; }
      return `<button class="opt ${cls}" data-h="${i}" data-o="${j}" ${pick != null ? "disabled" : ""}><span class="k">${L[j]}</span><span>${inline(esc(o))}</span></button>`;
    }).join("");
    const diag = pick != null ? `<div class="diag reveal ${pick === h.answer ? "right" : "wrong"}"><strong>${pick === h.answer ? "Right." : "Not quite."}</strong> ${inline(esc((h.diagnoses || [])[pick] || ""))}${pick !== h.answer ? `<br><br><strong>${L[h.answer]}:</strong> ${inline(esc((h.diagnoses || [])[h.answer] || ""))}` : ""}</div>` : "";
    return `<div class="panel hinge"><span class="label">Hinge ${i + 1} of ${m.hinge.length}</span><p class="q">${inline(esc(h.q))}</p><div class="opts">${opts}</div>${diag}</div>`;
  }).join("");
  const answered = Object.keys(st.hinge).length, correct = (m.hinge || []).filter((h, i) => st.hinge[i] === h.answer).length;
  return `<div class="sheet">
    <header class="head">
      <div class="titleblock"><span>SHEET ${m.id === "m0" ? "0" : "M" + m.num}</span><span>LEVEL: ${esc(m.level).toUpperCase()}</span><span>${m.minutes || "?"} MIN</span><span>SOURCES: ${(m.sources || []).map(s => esc(String(s).slice(0, 2))).join(" ")}</span></div>
      <h1>${esc(m.title)}</h1>
      ${m.hook ? `<p class="lede">${inline(esc(m.hook))}</p>` : ""}
    </header>
    ${m.attempt ? `<section class="step"><span class="label">1 &middot; Attempt first${m.attempt.minutes ? " &middot; " + m.attempt.minutes + " min" : ""}</span>
      <div class="panel attempt"><div class="prose">${md(m.attempt.prompt)}</div>
      <label class="label" for="att-${m.id}">Your attempt</label>
      <textarea id="att-${m.id}" data-att placeholder="Write before you read on. Wrong is fine; blank is not.">${esc(st.attempt)}</textarea>
      <div class="row"><button class="btn" id="fb-att">Get mentor feedback</button><span class="saved">Saves as you type</span></div>
      <div class="fb prose" id="fb-att-out" hidden></div></div></section>` : ""}
    ${(m.objectives || []).length ? `<section class="step"><span class="label">2 &middot; What you'll be able to do</span><div class="prose"><ul>${m.objectives.map(o => `<li>${inline(esc(o))}</li>`).join("")}</ul></div></section>` : ""}
    <section class="step"><span class="label">3 &middot; The load-bearing ideas</span>
      ${(m.ideas || []).map((idea, i) => `<details class="idea" ${i === 0 ? "open" : ""}><summary><h3>${esc(idea.title)}</h3>${tagChip(idea.tag)}</summary><div class="prose">${md(idea.body)}</div></details>`).join("")}
    </section>
    ${m.worked_example ? `<section class="step"><span class="label">4 &middot; Worked example</span><div class="panel"><h3>${esc(m.worked_example.title)}</h3><ol class="steps">${(m.worked_example.steps || []).map(s => `<li>${inline(esc(s))}</li>`).join("")}</ol></div></section>` : ""}
    ${hinge ? `<section class="step"><span class="label">5 &middot; Hinge questions &middot; ${correct}/${answered} right</span>${hinge}${answered ? `<div class="row"><button class="btn small" id="resetHinge">Retake hinge questions</button></div>` : ""}</section>` : ""}
    ${m.brief_prompt ? `<section class="step"><span class="label">6 &middot; Update your ${esc((C.artifact_name || "brief").toLowerCase())}</span><div class="panel"><div class="prose">${md(m.brief_prompt)}</div>
      <div class="row"><a class="btn" href="#brief">Open ${esc((C.artifact_name || "design brief").toLowerCase())}</a></div></div></section>` : ""}
    ${(m.deeper || []).length ? `<section class="step"><span class="label">Go deeper</span><div class="prose"><ul>${m.deeper.map(d => `<li><code>${esc(d)}</code></li>`).join("")}</ul><p class="muted">Full breakdowns live in the course repository under <code>${esc(C.repo_path || "the course folder")}/books/</code>.</p></div></section>` : ""}
    <div class="row"><button class="btn primary" id="doneBtn">${st.done ? "Marked complete" : "Mark module complete"}</button>${st.done ? `<button class="btn small" id="undoneBtn">Mark incomplete</button>` : ""}</div>
  </div>`;
}
function bindModule(m) {
  const st = modState(m.id);
  const ta = $("[data-att]");
  if (ta) ta.addEventListener("input", () => { st.attempt = ta.value; saveSoon(); });
  const fb = $("#fb-att");
  if (fb) fb.addEventListener("click", () => {
    if (!st.attempt.trim()) { const o = $("#fb-att-out"); o.hidden = false; o.textContent = "Write an attempt first."; return; }
    const ideas = (m.ideas || []).map(i => "## " + i.title + "\n" + i.body).join("\n\n").slice(0, 12000);
    mentor($("#fb-att-out"), fb, `${MENTOR_VOICE}

The learner just attempted this problem BEFORE studying the module (productive failure: the attempt is meant to activate prior knowledge and expose gaps, so don't grade harshly on missing knowledge).

Module: ${m.title}
Problem: ${m.attempt.prompt}

What the module will teach (for your reference; do not dump it on them):
${ideas}

Learner's attempt:
${st.attempt}

Reply with: (1) what their attempt gets right, (2) the 2-3 intuitive assumptions it reveals that the module will challenge, phrased as questions to hold while reading, (3) one thing to watch for in the ideas section. Don't give away the full answer.`);
  });
  document.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => { st.hinge[+b.dataset.h] = +b.dataset.o; save(); route(); }));
  const rh = $("#resetHinge"); if (rh) rh.addEventListener("click", () => { st.hinge = {}; save(); route(); });
  $("#doneBtn").addEventListener("click", () => { st.done = true; save(); route(); });
  const ud = $("#undoneBtn"); if (ud) ud.addEventListener("click", () => { st.done = false; save(); route(); });
}

let cardQueue = [], showBack = false;
function viewCards() {
  if (!cardQueue.length) cardQueue = dueCards().map(c => c.id);
  const c = CARDS.find(x => x.id === cardQueue[0]);
  const learned = Object.values(S.cards).filter(x => x.reps >= 2).length;
  const head = `<header class="head"><span class="label">Review deck &middot; ${CARDS.length} cards &middot; ${learned} learned</span><h1>Review</h1>
    <p class="lede">New cards unlock as you complete modules (up to 20 new a day). Answer out loud or in your head before you flip. Grade honestly; the schedule depends on it.</p></header>`;
  if (!c) return `<div class="sheet">${head}<div class="panel"><h3>Nothing due right now.</h3><p class="muted">Complete a module to unlock its cards, or come back tomorrow.</p></div></div>`;
  const cs = cardState(c.id);
  const mod = MODULES.find(m => m.id === c.module);
  return `<div class="sheet">${head}
    <div class="row"><span class="label">${cardQueue.length} left in this session</span></div>
    <div class="card">
      <div class="row"><span class="label">${esc(c.type || "")} &middot; ${mod ? (mod.id === "m0" ? "Start" : "M" + mod.num) : ""} &middot; ${esc(bookName(c.source || ""))}</span>${cs ? "" : `<span class="tag H">NEW</span>`}</div>
      <div class="front">${inline(esc(c.front))}</div>
      ${showBack ? `<div class="back prose reveal">${md(c.back)}</div>` : ""}
    </div>
    ${showBack ? `<div class="grades">
        <button class="btn" data-g="0">Again<small>10 min</small></button>
        <button class="btn" data-g="1">Hard<small>shorter</small></button>
        <button class="btn primary" data-g="2">Good<small>on schedule</small></button>
        <button class="btn" data-g="3">Easy<small>longer</small></button></div>`
      : `<div class="row"><button class="btn primary" id="flip">Show answer</button><span class="muted">Space bar also flips</span></div>`}
  </div>`;
}
function bindCards() {
  const f = $("#flip"); if (f) f.addEventListener("click", () => { showBack = true; route(); });
  document.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => {
    const id = cardQueue.shift(), g = +b.dataset.g;
    grade(id, g); if (g === 0) cardQueue.push(id);
    showBack = false; route();
  }));
}
document.addEventListener("keydown", e => {
  if (location.hash !== "#cards" || /TEXTAREA|INPUT/.test(document.activeElement.tagName)) return;
  if (e.code === "Space" && !showBack && cardQueue.length) { e.preventDefault(); showBack = true; route(); }
  else if (showBack && /^[1-4]$/.test(e.key)) { const b = $(`[data-g="${+e.key - 1}"]`); if (b) b.click(); }
});

function viewBrief() {
  const secs = BRIEF.map(s => {
    const entries = S.brief[s.id] || [];
    return `<section class="panel" data-sec="${esc(s.id)}">
      <div class="row" style="justify-content:space-between"><h3>${esc(s.title)}</h3>${tagChip(s.default_tag)}</div>
      ${s.guidance ? `<div class="prose muted">${md(s.guidance)}</div>` : ""}
      ${(s.prompts || []).length ? `<details><summary class="label" style="cursor:pointer">Prompts</summary><div class="prose"><ul>${s.prompts.map(p => `<li>${inline(esc(p))}</li>`).join("")}</ul></div></details>` : ""}
      <div>${entries.map((e, i) => `<div class="entry"><div class="tagpick">${["E", "H", "V"].map(t => `<button class="${t} ${e.tag === t ? "on" : ""}" data-sec="${esc(s.id)}" data-i="${i}" data-t="${t}" aria-label="Tag ${t}">${t}</button>`).join("")}</div>
        <textarea rows="2" style="min-height:0" data-sec="${esc(s.id)}" data-i="${i}" aria-label="Decision">${esc(e.text)}</textarea>
        <button class="x" data-del="${esc(s.id)}" data-i="${i}" aria-label="Remove decision">&times;</button></div>`).join("")}</div>
      <div class="row"><button class="btn small" data-add="${esc(s.id)}">Add decision</button></div>
    </section>`;
  }).join("");
  const n = Object.values(S.brief).reduce((a, x) => a + (x || []).length, 0);
  return `<div class="sheet"><header class="head"><span class="label">Your evolving ${esc((C.artifact_name || "design brief").toLowerCase())} &middot; ${n} ${esc(C.artifact_items || "decisions")}</span><h1>${esc(C.artifact_name || "Design brief")}</h1>
    <p class="lede">${esc(C.artifact_lede || "One document that grows with every module.")} Tag each entry: ${tagChip("E")} ${esc(TAGS.E)}, ${tagChip("H")} ${esc(TAGS.H)}, ${tagChip("V")} ${esc(TAGS.V)}. The capstone asks you to defend it.</p>
    <div class="row"><button class="btn primary" id="critique">Ask the mentor to critique my ${esc((C.artifact_name || "brief").toLowerCase())}</button><button class="btn" id="copyBrief">Copy as text</button></div>
    <div class="fb prose" id="critique-out" hidden></div></header>${secs}</div>`;
}
function briefText() {
  return BRIEF.map(s => "## " + s.title + "\n" + ((S.brief[s.id] || []).filter(e => e.text.trim()).map(e => `- [${e.tag || "?"}] ${e.text.trim()}`).join("\n") || "- (empty)")).join("\n\n");
}
function bindBrief() {
  document.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.add, sec = BRIEF.find(s => s.id === id);
    (S.brief[id] = S.brief[id] || []).push({ text: "", tag: (sec && sec.default_tag) || "H" }); save(); route();
    const tas = document.querySelectorAll(`textarea[data-sec="${id}"]`); if (tas.length) tas[tas.length - 1].focus();
  }));
  document.querySelectorAll("textarea[data-sec]").forEach(t => t.addEventListener("input", () => { S.brief[t.dataset.sec][+t.dataset.i].text = t.value; saveSoon(); }));
  document.querySelectorAll(".tagpick button").forEach(b => b.addEventListener("click", () => { S.brief[b.dataset.sec][+b.dataset.i].tag = b.dataset.t; save(); route(); }));
  document.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => { S.brief[b.dataset.del].splice(+b.dataset.i, 1); save(); route(); }));
  $("#critique").addEventListener("click", e => mentor($("#critique-out"), e.currentTarget, `${MENTOR_VOICE}

${C.artifact_critique_prompt || "Critique this document. Check: (1) tagging discipline: anything tagged [E] that is really [H] or [V], or vice versa; (2) contradictions with the evidence the course teaches; (3) internal inconsistencies between sections; (4) the single most important missing decision. Be direct."}

Tensions and decision rules the course teaches:
${TENSIONS.map(t => "- " + t.name + ": " + t.rule).join("\n").slice(0, 6000)}

The brief:
${briefText()}`));
  $("#copyBrief").addEventListener("click", async e => {
    const btn = e.currentTarget;
    try { await navigator.clipboard.writeText(briefText()); btn.textContent = "Copied"; }
    catch (err) { const o = $("#critique-out"); o.hidden = false; o.innerHTML = `<textarea readonly style="min-height:240px">${esc(briefText())}</textarea>`; o.querySelector("textarea").select(); btn.textContent = "Select the text below to copy"; }
  });
}

let activeNode = null;
function viewModel() {
  const all = {}; MODEL.bands.forEach(b => (b.nodes || []).forEach(n => all[n.id] = n));
  const act = activeNode && all[activeNode];
  const linked = new Set(act ? (act.links || []) : []);
  if (act) Object.values(all).forEach(n => { if ((n.links || []).includes(act.id)) linked.add(n.id); });
  const bands = MODEL.bands.slice().reverse().map(b => `<div class="band"><header><h3>${esc(b.title)}</h3><span class="label">${(b.nodes || []).length} ideas</span></header>
    ${b.certainty ? `<p class="muted" style="font-size:.9rem">${inline(esc(b.certainty))}</p>` : ""}
    <div class="nodes">${(b.nodes || []).map(n => `<button class="node ${activeNode === n.id ? "on" : ""} ${linked.has(n.id) ? "linked" : ""}" data-node="${esc(n.id)}">${esc(n.label)} ${tagChip(n.tag)}</button>`).join("")}</div>
    ${act && (b.nodes || []).some(n => n.id === act.id) ? `<div class="panel reveal"><div class="row" style="justify-content:space-between"><h3>${esc(act.label)}</h3>${tagChip(act.tag)}</div><div class="prose">${md(act.summary)}</div>
      ${linked.size ? `<p class="label">Connected: ${[...linked].map(id => all[id] ? esc(all[id].label) : "").filter(Boolean).join(" &middot; ")}</p>` : ""}</div>` : ""}
  </div>`).join("");
  return `<div class="sheet wide"><header class="head"><span class="label">${(C.levels || []).map(esc).join(" &rarr; ")}</span><h1>The unified model</h1>
    <p class="lede">${esc(C.model_lede || "Read it like a building: the first band is the foundation at the bottom, and each band constrains the one above it.")} Select an idea to see what it connects to.</p></header>
    <div class="bands">${bands}</div>
    ${MODEL.loop ? `<div class="loop"><span class="label">The improvement loop</span><div class="prose">${md(MODEL.loop)}</div></div>` : ""}
    ${(MODEL.chain || []).length ? `<section class="step"><span class="label">The causal chain, in plain words</span><div class="prose"><ol>${MODEL.chain.map(c => `<li>${inline(esc(c))}</li>`).join("")}</ol></div></section>` : ""}
    ${(MODEL.laws || []).length ? `<section class="step"><span class="label">The ${MODEL.laws.length} ${esc(C.laws_noun || "laws")}</span><div class="prose"><ol>${MODEL.laws.map(c => `<li>${inline(esc(c))}</li>`).join("")}</ol></div></section>` : ""}</div>`;
}
function bindModel() { document.querySelectorAll("[data-node]").forEach(b => b.addEventListener("click", () => { activeNode = activeNode === b.dataset.node ? null : b.dataset.node; route(); })); }

function viewTensions() {
  return `<div class="sheet"><header class="head"><span class="label">${TENSIONS.length} live debates</span><h1>Tensions and decision rules</h1>
    <p class="lede">Experts in this field disagree for real reasons. You won't pick a side for good. You'll know which conditions favor which pole, and what signal should make you switch.</p></header>
    ${TENSIONS.map(t => `<section class="panel tension"><h3>${esc(t.name)}</h3>
      <div class="poles"><div><span class="label">Pole A</span><div class="prose">${md(t.pole_a)}</div></div><div><span class="label">Pole B</span><div class="prose">${md(t.pole_b)}</div></div></div>
      ${t.evidence ? `<div class="prose muted">${md(t.evidence)}</div>` : ""}
      <p class="rule">${inline(esc(t.rule))}</p>
      ${t.switch_signal ? `<p><span class="label">Switch signal</span><br>${inline(esc(t.switch_signal))}</p>` : ""}
      ${(t.sources || []).length ? `<p class="label">${t.sources.map(bookName).map(esc).join(" &middot; ")}</p>` : ""}</section>`).join("")}</div>`;
}

let openCase = null;
function viewCases() {
  if (openCase) {
    const k = CASES.find(c => c.id === openCase); const st = S.cases[k.id] = S.cases[k.id] || { answer: "", revealed: false };
    const t = TENSIONS.find(x => x.id === k.tension);
    return `<div class="sheet"><div class="row"><button class="btn small" id="backCases">All cases</button></div>
      <header class="head"><span class="label">Case ${esc(k.id.toUpperCase())}${t ? " &middot; " + esc(t.name) : ""}</span><h1>${esc(k.title)}</h1></header>
      <div class="prose">${md(k.scenario)}</div>
      <div class="panel attempt"><p class="q"><strong>${inline(esc(k.question || "What do you do?"))}</strong></p>
        <label class="label" for="case-ans">Your decision and reasoning</label>
        <textarea id="case-ans" placeholder="Decide, then tag your reasoning [E], [H] or [V].">${esc(st.answer)}</textarea>
        <div class="row"><button class="btn" id="caseFb">Get mentor feedback</button><button class="btn primary" id="reveal">${st.revealed ? "Hide" : "Reveal"} model answer</button></div>
        <div class="fb prose" id="case-out" hidden></div></div>
      ${st.revealed ? `<section class="step reveal"><span class="label">Considerations</span><div class="prose"><ul>${(k.considerations || []).map(c => `<li>${inline(esc(c))}</li>`).join("")}</ul></div>
        <span class="label">Model answer</span><div class="prose">${md(k.model_answer)}</div>
        ${(k.sources || []).length ? `<p class="label">${k.sources.map(bookName).map(esc).join(" &middot; ")}</p>` : ""}</section>` : ""}
    </div>`;
  }
  return `<div class="sheet"><header class="head"><span class="label">${CASES.length} ${esc(C.case_noun || "cases")}</span><h1>Casebook</h1>
    <p class="lede">${esc(C.case_lede || "Realistic situations you will hit.")} Commit to a decision in writing before you look at the model answer.</p></header>
    <div class="modlist">${CASES.map((k, i) => { const t = TENSIONS.find(x => x.id === k.tension); const st = S.cases[k.id];
      return `<a class="modrow" href="#cases" data-case="${esc(k.id)}"><span class="num">${i + 1}</span><span><span class="t">${esc(k.title)}</span><br><span class="muted">${t ? esc(t.name) : ""}</span></span><span class="meta">${st && st.answer ? "answered" : ""}</span></a>`; }).join("")}</div></div>`;
}
function bindCases() {
  document.querySelectorAll("[data-case]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openCase = a.dataset.case; route(); window.scrollTo(0, 0); }));
  const back = $("#backCases"); if (back) back.addEventListener("click", () => { openCase = null; route(); });
  if (!openCase) return;
  const k = CASES.find(c => c.id === openCase), st = S.cases[k.id];
  $("#case-ans").addEventListener("input", e => { st.answer = e.target.value; saveSoon(); });
  $("#reveal").addEventListener("click", () => { st.revealed = !st.revealed; save(); route(); });
  $("#caseFb").addEventListener("click", e => {
    if (!st.answer.trim()) { const o = $("#case-out"); o.hidden = false; o.textContent = "Write your decision first."; return; }
    mentor($("#case-out"), e.currentTarget, `${MENTOR_VOICE}

Evaluate the learner's decision on this ${C.case_singular || "case"} against the model answer. Say what they got right, what they missed (especially evidence they ignored or values they left implicit), whether their [E]/[H]/[V] tags are honest, and give one sharper version of their decision in 2-3 sentences. Don't restate the whole model answer.

Case: ${k.title}
${k.scenario}
Question: ${k.question}
Considerations: ${(k.considerations || []).join("; ")}
Model answer: ${k.model_answer}

Learner's answer:
${st.answer}`);
  });
}

function viewDiagnostic() {
  const runs = S.diag || [];
  const cur = S._diagDraft = S._diagDraft || {};
  const complete = DIAG.every(d => cur[d.id] && cur[d.id].a != null && cur[d.id].c);
  const last = runs[runs.length - 1], first = runs[0];
  const score = r => DIAG.filter(d => r.answers[d.id] && r.answers[d.id].a === d.correct).length;
  const overconf = r => DIAG.filter(d => r.answers[d.id] && r.answers[d.id].a !== d.correct && r.answers[d.id].c >= 4).length;
  const results = last ? `<section class="panel reveal"><span class="label">Last run &middot; ${new Date(last.at).toLocaleDateString()}</span>
      <h3>${score(last)} of ${DIAG.length} right &middot; ${overconf(last)} confident mistakes</h3>
      ${runs.length > 1 ? `<p class="muted">First run: ${score(first)} right, ${overconf(first)} confident mistakes.</p>` : ""}
      <div class="prose"><ul>${DIAG.map(d => { const a = last.answers[d.id]; const ok = a && a.a === d.correct;
        return `<li><strong>${ok ? "Right" : "Wrong"}${a ? ", confidence " + a.c : ""}:</strong> ${inline(esc(d.statement))} <em>(${d.correct ? "true" : "false"})</em><br><span class="muted">${inline(esc(d.explanation))}${d.folk_theory && !ok ? " Folk theory: " + inline(esc(d.folk_theory)) : ""}</span></li>`; }).join("")}</ul></div></section>` : "";
  return `<div class="sheet"><header class="head"><span class="label">Take it on day 1 and again at the end</span><h1>Diagnostic</h1>
    <p class="lede">True or false, then how sure you are. Confident mistakes matter most: they are intuitive theories, and the course is built to change them.</p></header>
    ${results}
    <section class="step"><span class="label">${runs.length ? "Retake" : "Take the diagnostic"}</span>
    ${DIAG.map((d, i) => { const a = cur[d.id] || {}; return `<div class="dstmt"><p><span class="label">${i + 1}.</span> ${inline(esc(d.statement))}</p>
      <div class="row"><div class="tf">${[["True", true], ["False", false]].map(([l, v]) => `<button class="${a.a === v ? "on" : ""}" data-d="${esc(d.id)}" data-a="${v}">${l}</button>`).join(" ")}</div>
      <div class="conf"><span class="label">Sure?</span>${[1, 2, 3, 4, 5].map(c => `<button class="${a.c === c ? "on" : ""}" data-d="${esc(d.id)}" data-c="${c}" aria-label="Confidence ${c}">${c}</button>`).join("")}</div></div></div>`; }).join("")}
    <div class="row"><button class="btn primary" id="scoreDiag" ${complete ? "" : "disabled"}>Score it</button><span class="muted">${complete ? "" : "Answer every item and rate your confidence."}</span></div></section></div>`;
}
function bindDiagnostic() {
  const cur = S._diagDraft;
  document.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { (cur[b.dataset.d] = cur[b.dataset.d] || {}).a = b.dataset.a === "true"; save(); route(); }));
  document.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { (cur[b.dataset.d] = cur[b.dataset.d] || {}).c = +b.dataset.c; save(); route(); }));
  $("#scoreDiag").addEventListener("click", () => { S.diag.push({ at: Date.now(), answers: cur }); S._diagDraft = {}; save(); route(); window.scrollTo(0, 0); });
}

/* ---------- router ---------- */
function route() {
  const h = (location.hash || "#home").slice(1);
  const main = $("#main"); const y = window.scrollY;
  const m = MODULES.find(x => x.id === h);
  if (m) { main.innerHTML = viewModule(m); bindModule(m); }
  else if (h === "cards") { main.innerHTML = viewCards(); bindCards(); }
  else if (h === "brief") { main.innerHTML = viewBrief(); bindBrief(); }
  else if (h === "model") { main.innerHTML = viewModel(); bindModel(); }
  else if (h === "tensions") { main.innerHTML = viewTensions(); }
  else if (h === "cases") { main.innerHTML = viewCases(); bindCases(); }
  else if (h === "diagnostic") { main.innerHTML = viewDiagnostic(); bindDiagnostic(); }
  else { main.innerHTML = viewHome(); }
  renderNav(m ? m.id : (h || "home"));
  if (route.last === h) window.scrollTo(0, y); else window.scrollTo(0, 0);
  route.last = h;
  $("#rail").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
}
window.addEventListener("hashchange", () => { if (location.hash !== "#cases") openCase = null; cardQueue = []; showBack = false; route(); });
$("#menuBtn").addEventListener("click", () => { const r = $("#rail"); r.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(r.classList.contains("open"))); });
route();
connect();
})();
</script>

</body>
</html>
