<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games and Norms</title>
<meta name="description" content="A self-paced course: why humans cooperate, how strategic interaction works, and how norms, networks and institutions turn it into order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drawing-set index down the left (the course's "sheets"), one working sheet on the right. */
:root {
  --paper: #eef1ee;
  --sheet: #fbfcfa;
  --ink: #18262b;
  --ink-2: #4a5a5f;
  --rule: #cfd8d4;
  --accent: #2446b8;
  --accent-ink: #ffffff;
  --accent-soft: #e3e8fa;
  --e: #1f7a5a; --e-soft: #dcefe6;
  --h: #9a6200; --h-soft: #f6ead2;
  --v: #6b3fa8; --v-soft: #ece3f7;
  --bad: #b3261e; --bad-soft: #f8e1df;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111a1d; --sheet: #172226; --ink: #e4ebe8; --ink-2: #9fb0ad; --rule: #2c3b3f;
    --accent: #8ea6ff; --accent-ink: #0d1530; --accent-soft: #1f2a4d;
    --e: #6fd0a8; --e-soft: #16362b; --h: #f0b95a; --h-soft: #3a2c12; --v: #c4a2f2; --v-soft: #2d2140;
    --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111a1d; --sheet: #172226; --ink: #e4ebe8; --ink-2: #9fb0ad; --rule: #2c3b3f;
  --accent: #8ea6ff; --accent-ink: #0d1530; --accent-soft: #1f2a4d;
  --e: #6fd0a8; --e-soft: #16362b; --h: #f0b95a; --h-soft: #3a2c12; --v: #c4a2f2; --v-soft: #2d2140;
  --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1px solid var(--rule); padding: 20px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--r); color: var(--ink); text-decoration: none; font-size: .93rem; line-height: 1.35; }
.nav a:hover { background: var(--accent-soft); }
.nav a.on { background: var(--ink); color: var(--paper); }
.nav a.on .label, .nav a.on .tick { color: var(--paper); }
.nav .num { font-family: var(--mono); font-size: .75rem; color: var(--ink-2); }
.nav a.on .num { color: var(--paper); }
.tick { font-family: var(--mono); font-size: .75rem; color: var(--e); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup > .label { padding: 0 8px 4px; }
.sync { padding: 0 8px; font-size: .8rem; }

main { padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 56px); min-width: 0; }
.sheet { max-width: 780px; display: flex; flex-direction: column; gap: 28px; }
.sheet.wide { max-width: 1080px; }
.head { display: flex; flex-direction: column; gap: 10px; }
.titleblock { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--mono); font-size: .75rem; color: var(--ink-2); letter-spacing: .04em; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 6px 0; }
.lede { font-size: 1.1rem; color: var(--ink-2); max-width: 64ch; }

.step { display: flex; flex-direction: column; gap: 12px; }
.step > .label { display: flex; gap: 10px; align-items: center; }
.step > .label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.prose h4 { font-family: var(--body); font-size: 1rem; margin: 6px 0 0; }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.attempt { border-style: dashed; border-color: var(--accent); }
.idea { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.idea > summary { cursor: pointer; list-style: none; padding: 14px 20px; display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.idea > summary::-webkit-details-marker { display: none; }
.idea > summary h3 { font-size: 1.12rem; }
.idea[open] > summary { border-bottom: 1px solid var(--rule); }
.idea .prose { padding: 16px 20px 20px; }

.tag { font-family: var(--mono); font-size: .7rem; font-weight: 500; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.tag.E { background: var(--e-soft); color: var(--e); }
.tag.H { background: var(--h-soft); color: var(--h); }
.tag.V { background: var(--v-soft); color: var(--v); }

.btn { border: 1px solid var(--ink); background: transparent; border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: .92rem; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 10px; font-size: .82rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
textarea, input[type=text] { width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; line-height: 1.5; }
textarea { min-height: 130px; resize: vertical; }
.saved { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); }

.hinge { display: flex; flex-direction: column; gap: 10px; }
.hinge .q { font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 12px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--mono); color: var(--ink-2); }
.opt.right { border-color: var(--e); background: var(--e-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.diag { font-size: .93rem; padding: 10px 12px; border-left: 3px solid var(--ink-2); background: var(--paper); }
.diag.right { border-color: var(--e); }
.diag.wrong { border-color: var(--bad); }

.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; }
.steps li::marker { font-family: var(--mono); color: var(--ink-2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); min-width: 0; }
a.tile:hover { border-color: var(--accent); }
.tile .big { font-family: var(--display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.modlist { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.modrow { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 14px; align-items: baseline; padding: 12px 4px; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.modrow:hover { background: var(--sheet); }
.modrow .num { font-family: var(--display); font-size: 1.4rem; color: var(--ink-2); }
.modrow .t { font-weight: 700; }
.modrow .meta { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); text-align: right; }

.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 28px; min-height: 240px; display: flex; flex-direction: column; gap: 16px; }
.card .front { font-family: var(--display); font-size: 1.35rem; line-height: 1.35; }
.card .back { border-top: 1px dashed var(--rule); padding-top: 16px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades .btn { display: flex; flex-direction: column; align-items: center; gap: 0; }
.grades .btn small { font-weight: 400; font-family: var(--mono); font-size: .7rem; color: var(--ink-2); }

.bands { display: flex; flex-direction: column; gap: 14px; }
.band { border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.band header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.nodes { display: flex; flex-wrap: wrap; gap: 8px; }
.node { border: 1px solid var(--rule); background: var(--paper); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: .9rem; display: inline-flex; gap: 8px; align-items: center; }
.node.on { border-color: var(--accent); background: var(--accent-soft); }
.node.linked { border-color: var(--accent); }
.loop { font-size: .95rem; padding: 12px 14px; border: 1.5px dashed var(--accent); border-radius: var(--r); }

.tension { display: flex; flex-direction: column; gap: 10px; }
.poles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.poles > div { background: var(--paper); border-radius: var(--r); padding: 10px 12px; font-size: .93rem; min-width: 0; }
.rule { font-weight: 700; border-left: 3px solid var(--accent); padding-left: 12px; }

.entry { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.tagpick { display: flex; gap: 4px; }
.tagpick button { border: 1px solid var(--rule); background: transparent; border-radius: 99px; font-family: var(--mono); font-size: .72rem; padding: 2px 8px; cursor: pointer; }
.tagpick button.on.E { background: var(--e-soft); color: var(--e); border-color: var(--e); }
.tagpick button.on.H { background: var(--h-soft); color: var(--h); border-color: var(--h); }
.tagpick button.on.V { background: var(--v-soft); color: var(--v); border-color: var(--v); }
.x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 1.1rem; line-height: 1; }

.fb { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; }
.dstmt { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.conf { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.conf button, .tf button { border: 1px solid var(--rule); background: transparent; border-radius: var(--r); padding: 3px 10px; cursor: pointer; font-family: var(--mono); font-size: .8rem; }
.conf button.on, .tf button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.mtop { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .rail { display: none; position: fixed; inset: 0; z-index: 20; background: var(--paper); height: 100%; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .rail.open { display: flex; }
  .mtop { display: flex; justify-content: space-between; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 10px 16px; }
  .mtop b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
  .poles { grid-template-columns: minmax(0,1fr); }
  .grades { grid-template-columns: repeat(2, 1fr); }
  .card { padding: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<script type="application/json" id="course-data">{"course":{"slug":"games-and-norms","title":"Games and Norms","subtitle":"From cultural evolution to institutions","description":"A self-paced course: why humans cooperate, how strategic interaction works, and how norms, networks and institutions turn it into order.","tagline":"Learn what 11 books know about cooperation, then design it into a real group.","lede":"Three levels, in order: where human sociality comes from, the psychology and game theory of interaction, and how norms, institutions and networks produce collective order. Then a critical look at one attempt to unify it all. Every decision you make about your own group goes into your cooperation brief, labeled as evidence, hypothesis, or value.","levels":["Origins","Mechanisms","Order","Synthesis"],"source_count":11,"repo_path":"games-and-norms-course","artifact_name":"Cooperation brief","artifact_items":"decisions","artifact_lede":"One document about a real group you choose: a team, a community, a platform, a commons. It grows with every module.","artifact_critique_prompt":"Critique this cooperation brief. Check: (1) tagging discipline: anything tagged [E] that is really [H] or [V], or vice versa; (2) contradictions with what the course teaches (the game structure must be diagnosed before the fix; norms need both empirical and normative expectations; Ostrom's design principles; network structure shapes diffusion and cascades; social preferences are real but conditional; risk-dominance beats payoff-dominance under uncertainty); (3) internal inconsistencies between sections; (4) the single most important missing decision. Be direct.","case_noun":"cooperation dilemmas","case_singular":"cooperation dilemma","case_lede":"Realistic situations you hit when trying to get a team, community, platform or commons to cooperate.","laws_noun":"laws of cooperation","model_lede":"Read it like a building: cultural evolution is the foundation at the bottom, and each band constrains the one above it. Certainty drops as you go up: the formal results are theorems; the institutional prescriptions are mostly hypothesis and value.","mentor_voice":"You are a demanding but supportive mentor (high standards, high support) coaching a learner who is trying to design cooperation into a real group: a team, a community, a platform or a commons. They have a software/product background. Be specific and concise (under 250 words). Use markdown bullets. Tag design claims as [E] evidence, [H] hypothesis, [V] value where useful.","tags":{"E":"supported by evidence","H":"hypothesis to test in your group","V":"value commitment"}},"modules":[{"id":"m0","num":0,"title":"Start here: your cold diagnosis, the map, and the tagging discipline","level":"Start","minutes":60,"sources":[],"hook":"You already have a theory of why your group cooperates badly. Almost everyone does, and it is almost always one of two things: the wrong people, or the wrong incentives. The most useful thing you can do in the next hour is get that theory onto paper before this course changes it, so that in three weeks you can see exactly what changed and why. The sixteen-item diagnostic comes first (20 minutes); then the cold challenge below.","attempt":{"prompt":"Choose one real group you belong to or know from the inside: a team, a community, a platform, or a shared resource that people draw on. In 40 minutes and one page, with no research, write: (1) what the group is supposed to cooperate or coordinate on, and where it visibly fails; (2) why you think it fails; (3) the three changes you would make; (4) how you would know in three months whether they worked. Use what you already believe. The point is to generate, not to be right; this page will be graded only against your own later versions.\n\nThis page becomes **Cooperation brief v0**. Every module after this one ends with a diff against the current version.\n\nWhen you finish, before reading on: (a) list the assumptions on the page that you could not defend to a sceptic (most people find they have assumed either that the people are the problem or that an incentive would fix it); (b) mark every decision on the page [E], [H] or [V] as best you can. You will do this badly. That is expected; Module 11 returns to these tags with a changelog.\n\nAlso write, in three sentences and unscored: \"What makes a group world-class at cooperating?\" The capstone asks you to rewrite this and diff it against today's version.","minutes":40},"objectives":["Produce Cooperation brief v0: an honest, unresearched diagnosis of a real group that exposes your current folk theory of cooperation.","Name the four levels (Origins, Mechanisms, Order, Synthesis) and explain why a claim at one level constrains the level above it.","Tag any design claim as evidence [E], hypothesis [H] or value [V], and split compound claims into parts before tagging.","Describe how each module runs (hook, attempt, ideas, worked example, hinge questions, brief diff) and why it is built that way."],"ideas":[{"title":"The map: four levels, one spine, and how every module runs","tag":"V","body":"This course compresses roughly 150 hours of reading (eleven books) into about 20 hours of scheduled work plus a three-hour capstone. It does that by putting everything on four levels and teaching them in a deliberate order, bottom-up, because each level constrains the one above it.\n\n**Origins (Module 1).** Humans are cultural learners inside a collective brain. We copy selectively, defer to the prestigious, follow the visible majority, and internalise whatever norm is first and visible. This is the foundation: it says the levers for changing behaviour are models, prestige, visibility and expectations, and that explanation is a weak channel. Every later book takes its players from here.\n\n**Mechanisms (Modules 2 to 5).** What individuals actually do in groups (social psychology, with the replication record), the formal language for strategic interaction (game theory), how micro-choices aggregate into patterns nobody chose (Schelling), and where real behaviour departs from the formal prediction (behavioural game theory). This level constrains Order: any norm, institution or network design has to work on people who reason one or two steps about others, cooperate conditionally, and differ in how much they care about norms.\n\n**Order (Modules 6 to 9).** How populations settle on an equilibrium, what a norm is and how to measure it, what durable commons institutions share, and how network structure decides where behaviour spreads. This is where most of the brief's design decisions live.\n\n**Synthesis (Module 10).** One book's attempt to unify all of this, assessed claim by claim, followed by the course's own reconciliation of the four accounts of how a group settles on a way of behaving. Module 11 integrates.\n\n**Why bottom-up, and why you started top-down.** You cannot judge a norm intervention without a model of how people copy, or a network design without a model of thresholds. So the content runs from foundation to roof. But you started with your own group, on purpose: everything that follows lands as an answer to a question you have already asked. Certainty drops as you climb: the Mechanisms-level formal results are theorems; the Order-level prescriptions are mostly hypotheses and values for any particular group.\n\n**How each module runs.** Every module has the same shape, so that by Module 3 the structure costs you no attention:\n\n- **Hook**: a question whose answer is the module's load-bearing idea. Never a surprising anecdote beside the target.\n- **Attempt**: a real-group scenario you try cold, before the content. Its job is to surface your folk theory so the reading lands on a live mistake. Where you have no priors (a formal definition, say) it is a short prediction task instead.\n- **Ideas**: one or two ideas to hold in memory, marked as such, plus supporting ideas that are reference rather than memory. People reason a step or two about others; the same limit applies to what you can hold of a module.\n- **Worked example**: one design decision reasoned to a tagged policy. Complete in Modules 1 to 4, partially faded from Module 5, rubric-only by Module 10.\n- **Hinge questions**: every wrong option names the folk theory that produced it and points to a five-minute repair in a specific book section, never \"re-read the module\".\n- **Brief diff**: a versioned change to your cooperation brief, tagged, with one prediction you could check in your group within three months.\n\nIf you come from software: v0 is the first commit, each module is a pull request with a test attached, and the hinge questions are the test suite for your own understanding."},{"title":"The discipline: tag every claim as evidence, hypothesis or value","tag":"V","body":"Writing about cooperation is full of confident claims. Some rest on decades of replicated experiments; some are plausible mechanisms shown in a lab or a simulation; some are statements about what a group should want. People get into trouble by mixing these up, most often by **laundering a value as evidence** (\"research shows flat teams cooperate better\") or by **dressing a lab mechanism as a field fact** (\"people will pay to punish free-riders, so our members will police the commons for us\").\n\nThe course uses three tags, and the capstone penalises mis-tags more than it penalises wrong guesses.\n\n**[E] supported by evidence.** Reserved for claims the course's sources establish with a known size and boundary. The boundary is part of the tag. \"People reject unfair ultimatum offers at a cost to themselves\" is [E] for anonymous one-shot lab play across many countries; \"our contributors will reject an unfair credit split\" is not [E], because the field magnitude is smaller and the reference point for fairness is your group's, not the lab's. The most common capstone error is tagging a lab mechanism as [E] for the learner's own group. The rule is: lab results transfer as mechanisms and directions, never as point estimates; for your group, the direction may be [E] and the size is [H].\n\n**[H] hypothesis to test in your group.** A claim about what will happen that has not been established for your setting. Every [H] comes with a prediction and a way to check it within about three months. Most of the design decisions in a good brief are [H], and that is a strength, not a weakness: an untagged assumption is how a hypothesis becomes furniture.\n\n**[V] value commitment.** A statement about what matters, which would be worth keeping even if the outcome evidence turned out small. \"Influence in this community should run through respect rather than through dominance, even if dominance would be faster\" is [V]. Say it openly rather than justify it with borrowed evidence.\n\n**Split compound claims before tagging.** \"We will publish everyone's contribution counts because transparency motivates people\" contains at least three parts: a mechanism (visible contributions reduce loafing: [E]), a parameter (publishing the counts is the right form: [H], and the course will show you a case where it backfires), and a value (members are owed transparency: [V]). Tag each part.\n\n**Where the numbers come from.** Any number quoted in this course as evidence comes from a single table in the course's claims ledger, with its status: verified, background (approximate), or illustrative (a worked example's own arithmetic). Payoff numbers in attempts and worked examples are illustrative and are labelled so. When you write your brief, follow the same rule: if you cannot name where a number came from, write \"small\", \"moderate\" or \"roughly doubled\" instead.\n\n**Why this matters more here than elsewhere.** The final book on the list states argued claims as shown; the course's own defence against doing the same in your brief is this discipline. Your v0 tags will be mostly wrong. Module 11 returns to them with a changelog, and the change is the point."}],"worked_example":{"title":"Tagging one v0 decision: \"We will pay a bonus for on-call shifts because people respond to incentives\"","steps":["Split the claim into parts. (1) People respond to incentives. (2) A bonus is the right lever for this particular failure. (3) The failure is a payoff problem at all. (4) Paying for it will not change how people feel about the shift.","Part 1 is a mechanism claim, and in its bare form it is [E]: people do respond to payoffs. But it is doing no work. The question is whether this failure is one where the payoff is the binding constraint, and that is a separate claim.","Part 3 is the hidden diagnosis. Is the on-call rota a situation where a member gains by skipping when everyone else shows up (a dilemma that needs payoffs, repetition or sanctions), or one where everyone would show up if they trusted the others to (a coordination problem that needs assurance, where money is the weakest lever)? You cannot tag part 2 until you have answered part 3. Write part 3 as [H] with a test: ask three members whether they would still skip if they knew everyone else was covering faithfully.","Part 4 is an outcome prediction. The course will show you evidence that paying for behaviour people were doing anyway can crowd out the motive, and that positive reciprocity to pay is weak and decays. So 'the bonus will not change how people feel about the shift' is [H] at best, and the direction of the evidence is against it.","Write the tagged version into the brief: 'On-call rota is failing. Payoff response exists [E]. Whether the failure is a payoff problem or an assurance problem is undiagnosed [H: ask three members]. Bonus is a candidate fix only if the former [H]. Risk of crowding out noted [H, direction unfavourable].' Notice that the decision has become a diagnosis plus a test, which is what most v0 decisions turn into."]},"hinge":[{"q":"Why does this course ask you to diagnose and fix your own group cold, before any content?","options":["To test whether you already know enough to skip modules, so the course can route you past material you already hold.","Because generating your own answers works better than being taught, so the attempt replaces most of the instruction.","As a warm-up that gets you writing; the real learning starts in Module 1, once there is content to apply it to.","To surface and activate your current folk theory of cooperation, so the later reading lands on a live mistake."],"answer":3,"diagnoses":["Treating the attempt as a placement test. It is graded only against your own later versions; its job is generation, not measurement.","Confuses the attempt with discovery learning. The attempt is short, bounded and followed by explicit teaching; where you have no priors to activate, it is replaced by a prediction task.","Underestimates the attempt. Without v0 you would read later modules as information rather than as answers to decisions you have already made, and you would have no baseline to diff against.","Correct. First-contact behaviour is governed by whatever the person brings to the situation, and early rounds lock in. The attempt exposes what you bring so that the explanation that follows has somewhere specific to land. It works only because instruction follows."]},{"q":"A v0 brief says: \"People will pay out of their own pocket to punish free-riders, so our community will police itself once we give members a flag button.\" Which tag fits the second half?","options":["[H], because the lab mechanism is real but its size and persistence here are untested, and field sanctioning is mostly cheap.","[E], because costly punishment of unfairness is among the most replicated results in experimental economics.","[V], because whether members should police each other is a matter of community philosophy, not of evidence.","No tag, because a flag button is a feature decision and the tags apply to design claims, not to product features."],"answer":0,"diagnoses":["Correct. Willingness to punish unfair intentions is [E] in the lab; 'members will police the commons for us' is a hypothesis with a prediction attached, and the evidence from durable commons says sanctioning there is cheap and graduated, not heroic.","Laundering a lab mechanism as a field fact. The first half is [E] for anonymous one-shot lab play; the second half is a prediction about your community, and lab results transfer as directions, not as point estimates.","Mis-tagging a testable prediction as a value. Whether members should police each other might be [V]; whether they will is a claim about what happens, and that is [H].","A feature is a design claim with a mechanism inside it. Leaving it untagged is how an untested assumption becomes permanent."]},{"q":"Why does the course teach Origins before Mechanisms before Order, when the decisions you care about mostly live in Order?","options":["Because the Origins books are the easiest, so starting there builds the confidence the harder Order material needs.","Because the course follows the publication order of the books, and the Origins titles happen to be the most recent ones.","Because each level constrains the one above: a norm design has to work on the copiers and one-step reasoners below it.","Because the Order-level prescriptions are the most certain, so they are held back as the payoff once the groundwork is done."],"answer":2,"diagnoses":["Reads the order as pedagogy of difficulty. The Origins level is not easier; it is foundational, and its most contested claims are flagged as such.","The order is logical, not chronological; several Order books predate the Origins ones.","Correct. The building metaphor is literal: Origins fixes what the players are, Mechanisms fixes what they do and how choices aggregate, and only then can an Order-level design be checked against them.","Inverted. Certainty drops as you climb: the Mechanisms-level formal results are theorems, the Order-level prescriptions are mostly [H] and [V] for any particular group."]},{"q":"A v0 brief includes: \"Our tipping point is a few influential members; recruit them and the rest follow.\" You have not yet read Module 4. What is the right thing to do with this line now?","options":["Delete it, since Module 4 will probably show it is wrong and a v0 should not carry claims you expect to abandon.","Keep it, tag it [H], and write the prediction it implies, so Module 4 can test it against what tipping is.","Leave it exactly as written, since v0 is not supposed to be corrected and tagging it now would pre-empt the module.","Tag it [E], since tipping points are a well-documented phenomenon and the influencer version is the standard account."],"answer":1,"diagnoses":["Deleting removes the evidence of your own starting theory, which is what the capstone diffs against.","Correct. The claim is a hypothesis about your group. Tag it, state the prediction ('if these three adopt, adoption passes half within a quarter'), and let Module 4 show you why the scarce resource is low-threshold members rather than influential ones.","Half right: v0 is not corrected, but it is tagged, and tagging means writing down the prediction that would make the claim testable.","Laundering a folk theory as evidence. 'Tipping point' names a real structure, but the influencer reading of it is exactly the misconception the course corrects."]}],"brief_prompt":"Save your one-page diagnosis as Cooperation brief v0. Under it, add two lists: (1) the assumptions you could not defend to a sceptic; (2) your three least-certain changes. Then go through the page and tag every decision [E], [H] or [V], splitting compound decisions into parts first. Add your three-sentence answer to \"what makes a group world-class at cooperating?\" at the bottom, dated. Do not fix anything yet. Module 11 comes back to this page.","deeper":[]},{"id":"m1","num":1,"title":"Cultural learners and the collective brain","level":"Origins","minutes":100,"sources":["01-secret-of-our-success","02-darwins-unfinished-symphony"],"hook":"A well-provisioned, well-led expedition of intelligent adults starves in a place where the local population has thrived for centuries. Nobody was stupid. What did they lack, and what is the equivalent in a talented new team that fails in an unfamiliar domain?","attempt":{"prompt":"A twelve-person engineering team has one person who knows the deployment system end to end. She is respected, quiet and leaves in three months. Adoption of the team's written runbook is low: people ask her instead.\n\nDesign the handover in ten lines and predict what the team can do six months after she leaves. No research; use what you believe.","minutes":12},"objectives":["Explain why a group's competence is a property of its learning network rather than of its members, and name the three levers: the size of the pool that actually shares, connectivity, and transmission fidelity.","List the copying rules people run (success, prestige, conformity, self-similarity, credibility-enhancing displays; copy when uncertain; discount stale information) and say which one is operating in a given failure.","State the difference between spreading norm adherence (models and expectations) and transferring a skill with hidden structure (explicit teaching), and choose the channel accordingly."],"ideas":[{"title":"Competence lives in the learning network, and the levers are models, prestige, visibility and expectations","tag":"E","body":"*Hold this one in memory.*\n\nHenrich's opening puzzle is the lost explorer. The Franklin expedition of 1845 was well provisioned and well led, and it died in the Arctic while the Netsilik Inuit lived nearby with tools and skills the British could not reproduce. Burke and Wills, crossing Australia, ate the same nardoo fern the local Aboriginal people ate, but without the leaching and roasting that neutralise its toxin, and starved. The contrast case is Amundsen, who apprenticed himself to the Netsilik and survived. The lesson is not about intelligence. Competence in an environment is a property of a locally adapted cultural package that took generations to accumulate, and no individual, however clever, can derive it in the time available. The team equivalent: a talented new group in an unfamiliar domain fails unless it is connected to a living lineage of practice. \"Hire smart people and let them figure it out\" is the Franklin strategy.\n\nIf competence lives in the package, how does the package move? Not mainly by argument. Humans carry evolved cultural-learning biases that decide whom and what to copy, and because these biases are statistical rather than deliberative, learners acquire adaptive practices without understanding them. The taxonomy to hold:\n\n- **Model-based (whom):** copy the skilled and successful; copy the prestigious (those others defer to); copy the self-similar; copy elders.\n- **Content-based (what):** attend to danger, food, sex, norm violations.\n- **Frequency-based:** conformist transmission, copying the majority disproportionately when uncertain.\n- **Credibility-enhancing displays (CREDs):** a belief is copied more when the model acts as if it is true at personal cost. A leader who says \"quality first\" and then ships a known-broken feature to hit a date has produced a CRED for the opposite norm, and the costly action transmits more strongly than the announcement.\n\nPrestige is the lever most worth understanding. Humans have two routes to status. Dominance is ape-inherited: fear-based, enforced by threat, producing compliance under observation and suppressing information flow, because nobody approaches or copies the bully. Prestige is a human adaptation: deference freely paid to the skilled, in exchange for proximity and copying access. Prestigious people are watched, imitated and expected to be generous in return. Prestige and dominance as distinct routes to influence is one of the better-supported findings in this book (Cheng and colleagues, 2013, in small task groups). The design consequence: route norms through prestigious models, and protect prestige from capture by dominance, because dominance produces compliance that looks like adoption and is not.\n\nSo the primary levers for changing what a group does are: who is visibly successful, who is prestigious, what the majority appears to do, and whether leaders' costly actions match their words. Explanation is a weak fourth channel for adherence. This is [E] for the biases themselves and for the prestige/dominance distinction; how much weight each carries in your particular group is [H]. The reason to install this before the game-theory modules is that game theory models players who already have preferences; this is where the preferences come from, and it is what makes \"we explained it\" count as roughly zero adoption."},{"title":"Copying pays because demonstrators pre-filter, and a population of pure copiers stagnates","tag":"E","body":"*Hold this one in memory.*\n\nCopying is not obviously adaptive. Rogers's paradox (1988) shows why: a population of copiers does no better on average than a population of individual learners, because copiers only parasitise knowledge that others paid to acquire, and when the world changes the copiers track it badly. So indiscriminate copying cannot be what evolved. What evolved is *strategic* social learning: rules that say when and whom to copy. Laland's catalogue includes copy when uncertain, copy when individual learning is costly, copy the majority, copy the successful, copy if dissatisfied.\n\nThe sharpest evidence is the social-learning strategies tournament (Rendell and colleagues, 2010, verified). Modelled on Axelrod's prisoner's-dilemma tournaments, it invited entrants to submit a strategy for an agent in a changing environment. Each round the agent could INNOVATE (try a random new behaviour and learn its payoff, at the cost of a round), OBSERVE (learn another agent's behaviour and payoff, with noise) or EXPLOIT (perform a known behaviour and collect). Payoffs drifted over time. There were 104 entries. The winner, \"discountmachine\", copied almost exclusively, almost never innovated, and weighted what it observed by how recently it was acquired, discounting stale information.\n\nWhy copying won, even though it was not cheaper than innovating, is the single most useful idea in the book. Demonstrators are not random. When an agent exploits, it performs the best behaviour *it* knows. So observation samples from a pre-filtered distribution, what others chose to do, rather than from the raw space of possible behaviours. Copying inherits the demonstrators' selectivity for free. The corollary bites: the value of copying is only as good as the demonstrators' incentive to show their best. If your group's visible examples are the loudest, the most senior or the most political rather than the best-performing, copying propagates the wrong things. Design displays (demos, dashboards, retros) so that what is visible is what actually paid off.\n\nTwo more results from the tournament. First, recency-weighting beat accumulation: in a changing environment, a group that keeps old exemplars alive past their expiry copies the wrong things. Date your playbooks and sunset best practices. Second, the tournament reproduced Rogers's paradox at the population level while resolving it at the individual level: populations with very high copying rates had lower average fitness even though the copiers out-competed the innovators. A population of pure copiers sits on a stale, shrinking pool. Someone must be paid to innovate, and the winners will not volunteer.\n\nThree cautions, which are part of the claim and not footnotes to it. The tournament was a computer simulation of submitted strategies, not an experiment on people; its results are about the logic of learning rules and transfer to humans only with the assumptions stated. It is [E] as a simulation result. And it cuts against a lazy reading of \"copying is lazy\": the best strategies used social learning to decide *when* to innovate, and across primate species the animals that copy well also innovate more (Reader and Laland's comparative work). Do not staff a team as \"creatives\" and \"executors\"; both depend on the same attention to what actually works."},{"title":"Norm psychology is content-neutral: fill the norm slot early","tag":"E","body":"Henrich's account of why humans follow rules at all is called self-domestication. Once norms and reputation-tracking existed in our ancestors' groups, they created a new selection environment: individuals who impulsively violated norms were ostracised, denied mates and allies, or killed. Genes for norm-sensitivity, shame, guilt and self-control were favoured, and reactive aggression was selected against. The result is a species with an evolved **norm psychology**: we learn rules easily, expect others to follow them, feel bad when we break them, and are willing to pay to punish those who do. Three-year-olds spontaneously enforce rules on third parties who did not agree to them (Rakoczy, Warneken and Tomasello, 2008).\n\nThe part of this that matters for design is that the psychology is **content-neutral**. It internalises productive and destructive norms with equal ease. It attaches to whatever pattern is first and visible. And in some norm environments it punishes cooperators: Herrmann, Thöni and Gächter (2008) found \"antisocial punishment\", people paying to punish those who contributed *more* than they did, in several societies. So the assumption that \"because norm psychology evolved to sustain cooperation, people will naturally enforce the cooperative norms we set\" is wrong twice over. People will enforce whatever norm is visible, including one you did not intend; and the enforcement can turn on the people you most want to keep.\n\nTwo consequences follow. First, **fill the norm slot deliberately and early**. The first weeks of observed behaviour in a new team or community set the norms that later rules will fight. A slot left empty will be filled by something, usually by whatever the first prestigious member visibly does. Second, **design sanctions around reputation and inclusion, and channel them through a legitimate process**. Mild public peer disapproval is a strong lever precisely because of this psychology, and a dangerous one for the same reason; unstructured disapproval produces antisocial punishment and honour-style retaliation. The Order modules give the institutional detail (graduated sanctions, monitoring as a by-product); this module gives the reason those designs work on the raw material they work on.\n\nA related point from the chapter on faith. Cultural packages are smarter than individuals, so selection favoured a psychology that trusts inherited practice over its own causal reasoning. Fijian women hold food taboos in pregnancy that reduce exposure to fish toxins and give non-causal reasons for them; Tukanoan manioc processing removes a poison whose harm takes years to appear and could not be discovered by individual trial. People follow practices they cannot justify and confabulate reasons on demand. The design consequence is an evolutionary version of Chesterton's fence: do not assume an unexplained practice is useless, and audit its selection history before removing it. And, again, do not expect explanation to create adherence; adherence comes from models and norms.\n\nEvidence status: the developmental and cross-cultural game evidence for norm psychology is [E]; the specific claim that norm-enforcement drove selection for it is a well-motivated hypothesis with indirect evidence, not a measured selection history. \"Fill the norm slot early\" is [H] as a practice rule."},{"title":"The collective brain is about connectivity, not head-count, and the archaeology is contested","tag":"H","body":"The claim: the rate of cumulative cultural evolution depends on the number of minds in the learning network and how well they are connected. Larger, better-connected populations preserve more complex skills, because more learners can find the rare expert and copy them, and innovate faster, because innovation is recombination across people. Small or isolated populations can *lose* technology.\n\nThe signature case is Tasmania. After separation from mainland Australia roughly 10,000 years ago (background figure), the archaeological record is read by Henrich as showing loss of bone tools, cold-weather clothing and fishing. The Polar Inuit of northwest Greenland lost kayaks, bows and leisters after an 1820s epidemic until contact with Baffin Island Inuit restored them. Kline and Boyd (2010) found tool-kit complexity across Oceanic islands rising with population size and contact. Lab transmission-chain experiments (Derex and colleagues, 2013; Muthukrishna and colleagues, 2014) found larger learner groups maintained more complex skills.\n\nNow the dispute, which the course requires you to carry with the claim. Vaesen, Collard, Cosgrove and Roebroeks (2016) argued that the demographic models produce the predicted link only under implausible assumptions, that most empirical tests do not support it, and that the Tasmanian record has been misread. Henrich and colleagues replied that the critics misunderstood models that concern the effective learning network's size and connectivity, not census size. Collard's work found hunter-gatherer tool-kit complexity tracks environmental risk rather than population. The fair summary, which is the only form in which the course lets you state this: the mechanism is plausible and lab-demonstrated at small scale; the archaeological support is mixed; Tasmania is a live dispute, not a settled example. Tag [H].\n\nWhat survives for design is precise once you read the reply to the critics. The variable is not head-count. It is the **effective learning network**, with three levers: the size of the pool that actually shares knowledge; the connectivity between sub-teams; and transmission fidelity, meaning whether a learner can watch a skilled model closely enough to copy. A company that grows from 40 to 400 people and finds a signature practice decaying has not gained a collective brain; it has diluted one, because new people cannot watch a skilled model and the few who could are spread thin. Growth without connection shrinks the effective network. Silos, isolation and turnover do not just slow a group; they cause skill loss. And a single copied node, the one person everyone asks instead of reading the runbook, is a Tasmania risk waiting for a departure.\n\nLaland adds the mechanism behind fidelity. Cumulative culture depends on transmission accuracy; below a threshold, skills are lost as fast as they are gained. Documentation, onboarding, apprenticeship and code review are fidelity mechanisms; in a young group with little accumulated practice they are overhead. Invest in fidelity in proportion to what there is to transmit.\n\nFidelity has a second lever for skills whose causal structure is hidden. In Morgan and colleagues' stone-tool transmission experiment (2015, N = 184, five conditions), watching a silent demonstrator added little over reverse engineering; verbal teaching produced the largest gains. One modest study, so [E] with modest size. So: norm adherence spreads by models and expectations; a skill with hidden reasoning spreads by explicit teaching alongside demonstration. Henrich's \"explanation does not produce adherence\" is a claim about norms, not about skills.\n\nTwo misreadings to refuse. \"The collective brain means the wisdom of crowds\": no, the wisdom of crowds needs independent judgments, the collective brain is non-independent selective copying over generations. And \"bigger populations always produce more complex culture\": census size is the wrong variable, and the claim is contested."},{"title":"Cultural group selection is the origin story for norm packages, and it is a hypothesis","tag":"H","body":"Where do cooperative norm packages come from? Henrich's answer is cultural group selection. Because norms and institutions vary across groups and affect group success, competition between groups selects for cooperation-enhancing norms. The channels are not mainly war: differential group survival, differential migration into successful groups, differential imitation of successful groups' practices, differential growth, and prestige-biased transmission between groups. Within-group norms and punishment stabilise variation so that between-group differences persist long enough to be selected on. His cases are the Nuer expansion at Dinka expense in the nineteenth century, attributed to kinship and bridewealth norms that permitted larger coalitions, and the Ilahita Arapesh in New Guinea, who grew unusually large by adopting and modifying a neighbouring group's men's cult to bind sub-groups into a cooperating whole.\n\nThe design reading Henrich draws is that institutions that cooperate at scale were usually copied from a more successful neighbour and modified, not designed from scratch: benchmark the best peer group and copy its *norm package*, because the package was itself selected. And note the corollary: within-group cooperation was forged by between-group rivalry, so a group with no meaningful external comparison has weak pressure toward internal cooperation.\n\nThe course's position on all this is fixed and you should hold it exactly. Cultural group selection is [H]. It was defended in a 2016 target article that drew many critical commentaries: is between-group variation large and stable enough, is imitation of successful groups really \"selection\", and do within-group mechanisms suffice on their own? The Nuer and Ilahita cases are illustrative, not statistical. Laland, the other Origins author, is notably more cautious than Henrich and treats cooperation as scaffolded by socially learned norms rather than as the product of group-level selection. Never make cultural group selection the sole basis of a design claim. The [E] part of the origins story is the within-group mechanisms: reciprocity, reputation and punishment.\n\nTwo related [H] claims that you will see stated confidently elsewhere. \"Culture drove brain expansion\" is the shared Origins hypothesis (Henrich's cultural brain, Laland's cultural drive, with a real comparative correlation in Street and colleagues 2017 that cannot fix causal direction); it is contested by diet and social-brain accounts. And \"over-imitation is a developmental universal\" is less clear than Henrich implies: Aka forager children were found to emulate rather than over-imitate, while Aka adults did over-imitate.\n\nWhy include a hypothesis at all? Because the copy-and-modify reading has a practical edge even as [H]. When you benchmark a peer organisation, copy the norm package (who is expected to do what, what is sanctioned, what is visible), not only the tooling; and modify, because Ilahita modified. Henrich's own warning about \"institutions are designed by smart people\" is that most were copied and rationalised afterwards. Ostrom, in Module 8, is the partial counterweight: she documents deliberate, incremental crafting. Hold both: copied packages as the starting point, incremental crafting as the mechanism of fit, and neither as [E] for your group."}],"worked_example":{"title":"Decision: how should a platform's moderation team get members to flag misinformation, when adoption of a well-written flagging guideline is in the single digits of percent?","steps":["Explanation has been tried. Henrich's chapter on faith predicts adoption from explanation near zero, so stop treating the guideline as the channel. Reclassify it as fidelity support: it raises the accuracy of a behaviour that has to be spread by other means.","Ask which copying rules could carry the behaviour. Success and prestige bias: is a prestigious, self-similar member visibly flagging and visibly benefiting? Conformist transmission: does the interface make flagging look like majority behaviour, or does it advertise that almost nobody does it? The course rule forbids advertising low adoption, because 'most people don't do this' is itself transmitted. CREDs: do the moderators produce credibility-enhancing displays, or do they visibly skip flags themselves?","Ask about the learning network. Can a new member watch a good flagger flag, or is flagging invisible by design? If invisible, there is no model to copy and no fidelity to speak of; the behaviour cannot spread whatever the guideline says.","Ask about norm psychology. Is there any expectation and mild sanction attached to not flagging, or only information? Information without expectation fills no norm slot.","Resulting policy: make three respected, ordinary-looking members' flags visible with attribution and a visible outcome; show the count of flags reviewed, never the adoption rate; have moderators narrate one flag decision weekly in a public thread; add a light expectation ('members here flag; here is what happened to last week's flags').","Tag it. [E] that models and visibility beat explanation for adherence (the biases, CREDs, conformist transmission). [H] that these three members are the right models and that the effect in this community is material. [V] that flagging should be routed through prestige rather than through moderator dominance, even if dominance would be faster, because dominance suppresses the information flow the community runs on. Prediction: flags per active member rise within a quarter in the sub-community where the three models are visible, and do not rise where only the guideline was re-announced."]},"hinge":[{"q":"A 25-person agency merges into a 200-person one; within a year its signature client-handover ritual has decayed. Which diagnosis fits the Origins books best?","options":["The larger firm's staff are lower calibre, so the ritual's standard could not survive contact with them.","The merged firm is bigger, so by the population-size effect it should innovate more; the decay is a management failure.","The effective learning network shrank: new people cannot watch a skilled model, and the few who could are spread thin.","The ritual was never documented well enough, so the larger firm's staff had no explanation of it to follow."],"answer":2,"diagnoses":["'Competence is in the people', the lost-explorer misreading. This is the fundamental attribution error in organisational form; competence was in the inherited practice and the channels for copying it.","'Bigger populations always produce more complex culture.' This reads census size as learning-network size, which is exactly the error Henrich's reply to his critics corrects, and the population-size claim is contested in any case.","Correct. Collective-brain effects are about connectivity and transmission fidelity, not head-count. Growth without connection dilutes the models that new people need to watch.","Explanation as the channel for adherence. Partly right, wrong level: better explanation would raise fidelity, but the missing thing is modelling, and no amount of documentation replaces a skilled model to watch."]},{"q":"A team leader announces \"quality over speed\" and the next week ships a known-broken feature to hit a date. What does the cultural-learning account predict spreads?","options":["The costly action transmits \"speed over quality\" more strongly than the announcement transmitted the reverse.","Nothing changes, because people follow the stated policy and one exception does not overturn a public statement.","People become cynical and stop following any norm, because a leader who breaks their own rule discredits rules.","The team splits into two camps with opposite norms, because some copy the words and others copy the action."],"answer":0,"diagnoses":["Correct. A CRED is a costly action that only makes sense if the model holds the belief; the visible exception is the CRED, and it points the wrong way.","Words as the transmission channel. This ignores credibility-enhancing displays: beliefs are copied from what models do at cost, not from what they say.","Norm psychology as fragile and all-or-nothing. It is content-neutral and attaches to whatever is visible; the team does not stop having norms, it acquires the one the leader modelled.","Conflates this with sorting or dialect forking, which needs local structure and separate neighbourhoods. A single visible model in one team produces one norm, not two."]},{"q":"An organisation copies a rival's \"best practices\" wiki wholesale and mandates it. Two years later nobody has updated it and the practices no longer fit. Which tournament finding applies most directly?","options":["Copying is inferior to innovating, so the wiki should have been written from scratch to fit the organisation.","The rival's practices were selected by cultural group selection, so they were adaptive and were implemented unfaithfully.","The tournament shows people copy whatever is in front of them, so the wiki failed because it was not visible enough.","The winning strategy discounted stale information; a wiki with no expiry copies the wrong things and stays stale."],"answer":3,"diagnoses":["Copying as a fit problem: 'their practices didn't suit us, we should have written our own'. The tournament says the problem is not that the practices were borrowed but that they were never dated and nobody was paid to test alternatives; a home-grown wiki with no expiry goes stale the same way.","Cultural group selection treated as [E] and as a guarantee of fit. It is [H]; and Henrich's own cases copied and *modified*, which is what over-faithful implementation prevents.","'The tournament was an experiment on people' and copying as indiscriminate. It was a simulation of strategies, and its lesson is that copying is strategic: whom, when and how recently.","Correct. Discountmachine weighted information by recency because the environment was restless; and populations with very high copying rates had lower average fitness. Date the practices and fund people to test alternatives."]},{"q":"A team wants to spread a debugging technique with non-obvious reasoning behind it. Which channel does the evidence favour?","options":["Pair new people with an expert and let them watch, because skills are copied from models rather than explained.","Have the expert explain the reasons explicitly while demonstrating, because the technique's structure is hidden.","Write it up rather than teach it, because explanation does not work on cultural learners and a document is cheap.","Make the technique's use visible on a dashboard, because conformity to what others visibly do carries practices."],"answer":1,"diagnoses":["Imitation as sufficient for skills with hidden structure. In the stone-tool transmission experiment (Morgan and colleagues 2015, N = 184, five conditions) imitation of a silent demonstrator added little over reverse engineering.","Correct. Teaching, and most of all verbal teaching, produced the largest gains for a skill whose causal structure is hidden. One modest study, so [E] with a modest size; [H] for your domain.","Collapsing Henrich's 'explanation does not produce adherence' into 'explanation does not work'. Wrong scope: the claim about explanation concerns norm adherence, and this is skill transfer with hidden structure, where explanation is exactly what is needed.","Confusing norm adherence with skill transfer. Visibility and conformity spread *whether* people use the technique; they do not transmit *why* it works, and for a skill with hidden structure the why is the skill."]}],"brief_prompt":"Add to the brief (section s3, 'the collective brain'): a map of who actually learns from whom in the group, not the org chart; the single points of failure for critical skills; the group's visibly successful and prestigious members and whether they are modelling the target behaviour; one place where leaders' costly actions contradict their stated norm. Tag each line. Prediction: name one behaviour that will change within three months if one prestigious member visibly adopts it, and one that will not change however well it is explained.","deeper":["books/01-secret-of-our-success.md#Ch 8 — Prestige, Dominance, and Menopause","books/01-secret-of-our-success.md#Ch 10 — Intergroup Competition Shapes Cultural Evolution","books/01-secret-of-our-success.md#Evidence strength & limits","books/02-darwins-unfinished-symphony.md#Ch 6 — The Evolution of Intelligence","books/02-darwins-unfinished-symphony.md#Ch 9 — Gene-Culture Coevolution"]},{"id":"m2","num":2,"title":"The psychology of individuals in groups, with the replication rules","level":"Mechanisms","minutes":70,"sources":["03-social-psychology"],"hook":"A sign at a national park said, in effect, 'please do not take the petrified wood; many visitors do'. Theft went up. What did the sign transmit, and what does your own group's most recent all-hands announcement transmit?","attempt":{"prompt":"A twelve-person team's output per head fell by about a third after it grew from five (a scenario number, not evidence). Two people are widely described as coasting.\n\nWrite, in ten lines, what you would do in the first month and what you expect to find.","minutes":12},"objectives":["Diagnose a group failure situationally before dispositionally, naming the fundamental attribution error and construal.","Apply the robust levers (descriptive plus injunctive norms, a visible dissenter, small public commitments, identifiable effort, structured contact, exits and peers under authority, the five bystander steps) and refuse the failed ones (ego depletion, social priming, power posing, watching eyes, the Stanford Prison Experiment, groupthink as a syndrome, IAT training).","State the replication status of a classic before building on it."],"ideas":[{"title":"Situations are underestimated, and we do not believe it","tag":"E","body":"*Hold this one in memory.*\n\nThe textbook's master theme is the fundamental attribution error, also called correspondence bias: observers attribute other people's behaviour to disposition even when the situational constraints are obvious. In Jones and Harris (1967), readers inferred a writer's true opinion from a pro-Castro essay even when told the position had been assigned. In Ross, Amabile and Steinmetz (1977), people who had been randomly assigned to write quiz questions were judged more knowledgeable than the people who had to answer them, although everyone could see who chose the questions. Both replicate well across decades and paradigms. Layered on top is naive realism: the sense that one's own view is unmediated reality, so that disagreement must reflect the other side's bias. And there is an actor-observer asymmetry: we explain our own lapses situationally and other people's dispositionally.\n\nThis is why cooperation fails silently. A missed deadline reads as \"unreliable person\", not \"overloaded person\". One lapse types someone as a free-rider, and reciprocity, which is the engine of cooperation in every later module, turns punitive prematurely. The team that concludes \"two people are coasting\" has almost certainly skipped the situational hypothesis: is effort identifiable, are tasks owned, has the group grown to a size where pooled effort is invisible? The course's first design rule follows: diagnose situationally before dispositionally. Map workload, information, incentives and ambiguity before concluding you have free-riders. Designs that force situational information into view, such as visible workload, reasons attached to lapses, and blameless post-mortems, counteract the error.\n\nThe second half of the theme is construal: people respond to their interpretation of a situation, not the situation itself. Two people in the \"same\" situation are in different situations if they read it differently. The cleanest demonstration for this course is Liberman, Samuels and Ross (2004): the identical prisoner's dilemma, labelled the \"Community Game\" rather than the \"Wall Street Game\", roughly doubled cooperation (a background figure; the effect is listed as robust). Nothing in the payoffs changed. The label told people what kind of situation they were in and therefore which norms applied. This is the direct bridge to the norms modules: naming the interaction (\"this is a shared commons\", \"this is what members do here\") can move behaviour as much as a modest payoff change.\n\nNow the boundary, which is part of the claim. Effect sizes are moderate. The book's point is that situations are *underestimated*, not that they are all-powerful, and \"people are infinitely malleable\" is a misreading the course explicitly rejects. The correction is a check, not a veto: after asking whether workload, information and ambiguity were visible to the people making the attribution, you may still conclude that a person is the problem. You just may not start there.\n\nCulture is a parameter on all of this. East Asian participants make more situational attributions and show a weaker attribution error; the mechanism is independent versus interdependent self-construal, which varies within countries and classes, not just between \"East\" and \"West\". For a mixed-culture group, test the levers locally. [E] for the error and for construal; [H] for how much each explains in your case."},{"title":"Norms have two channels, and they must point the same way","tag":"E","body":"*Hold this one in memory.*\n\nCialdini's focus theory splits what people loosely call \"the norm\" into two things. A **descriptive norm** is what people actually do. An **injunctive norm** is what people approve or disapprove of. They are transmitted separately, and people follow what others do more readily than what they are told to approve. When the two conflict, the descriptive channel usually wins.\n\nThe Petrified Forest sign is the clean demonstration. A message that said, in effect, \"please do not take wood; many visitors do\" increased theft, because \"many visitors do\" was a descriptive norm that contradicted the injunctive one. The sign normalised the behaviour it was trying to stop. Any announcement of the form \"over a thousand posts broke the rules last month; please do better\" makes the same mistake, and the course rule is absolute: never advertise that misbehaviour is common in an attempt to shame it.\n\nThe second demonstration is the boomerang. Schultz and colleagues (2007) gave households feedback on their energy use relative to their neighbours. High users cut consumption. Low users *raised* it, toward the norm they had just been told about, unless the feedback carried an injunctive signal (a hand-drawn smiley face for below-average use), which removed the boomerang. Opower replicated this at scale (Allcott 2011), with effects of about 2% of consumption: small, reliable, and dependent on pairing the channels. So descriptive feedback alone boomerangs for people above the norm, and the fix is pairing, not netting. Tell people what most members do *and* that it is approved.\n\nFor a designer this gives a checklist that runs through every later module. Make the wanted behaviour's prevalence visible where it is genuinely prevalent (public counts of tests written, flags reviewed, reviews completed). Pair it with approval (a visible response, a named thank-you, a norm statement from a credible source). And never publish the share who do the wrong thing, because that share is itself transmitted. Henrich's conformist transmission and the Bicchieri module's empirical expectations are the same lever seen from origin and from measurement.\n\nThe same chapter supplies the conformity results, which are among the most replicated in the field. Conformity has two motives. Informational: others are a source of truth, as in Sherif's autokinetic norms, which persisted across generations of participants. Normative: fear of disapproval, as in Asch's line judgments, where about a third of critical trials produced conformity and about three quarters of participants conformed at least once (background figures). Bond and Smith's 1996 meta-analysis of 133 studies across 17 countries (verified) finds the effect robust, higher in collectivist cultures and lower in the United States since the 1950s. Conformity rises with group size up to about three or four confederates and then plateaus, and a single dissenter collapses it. The design consequence is not \"eliminate conformity\", which is usually adaptive; it is to guarantee a visible dissenter whenever a group drifts toward a bad consensus, and to note that private ballots fix only the normative motive, not the informational one.\n\nFoot-in-the-door belongs here too: ask for a tiny visible contribution before the real one. It is a compliance tactic with a replicated effect, and it is how a descriptive norm gets its first data point."},{"title":"Much of the famous material is folklore: the robust list and the failed list","tag":"E","body":"Social psychology is where the replication crisis broke. The Open Science Collaboration (2015) replicated roughly 36 to 39% of a hundred published findings (background figure), and social psychology was the weakest area. The sixth edition acknowledges this in its methods chapter but still leans on some classics. So the course carries a working classification, and the rule is that you may not build a design on anything from the second list.\n\n**Build on these.** Asch-type conformity (Bond and Smith 1996, verified). Milgram-type obedience as a behaviour: Burger's 2009 partial replication found 70% of participants continuing past 150 volts, versus roughly 82% at the same point in Milgram (verified), with Milgram's own 65% full-compliance baseline as a background figure. The fundamental attribution error. Cognitive dissonance in the induced-compliance and effort-justification paradigms, at moderate size. Group polarization, social loafing (Karau and Williams 1993) and social facilitation. Minimal-group favouritism. Intergroup contact, with a reliable moderate effect across more than 500 studies (Pettigrew and Tropp 2006), and the caveat that rigorous field experiments are fewer and smaller (Paluck and colleagues 2019). The bystander effect in the lab and in low-risk field settings. Descriptive-norm interventions at scale. Mere exposure, anchoring, framing, the construal effect on dilemma cooperation, and communication raising public-goods contributions. Incentivised cooperation-game results generally, which replicate at a higher rate than psychology's.\n\n**Do not build on these.** Ego depletion, the idea that willpower is a resource used up during the day: Hagger and colleagues' 2016 registered replication across 23 labs and 2,141 participants found d = 0.04 with the interval including zero (verified). Behavioural priming (elderly words slowing walking, money priming): the flagship failed to replicate and many-labs efforts found most social priming effects near zero. Power posing: Ranehill and colleagues 2015 (N = 200, blinded, verified) found the self-reported feeling of power and no hormonal or behavioural effect. Stereotype threat in its strong form: Flore and Wicherts' 2015 meta-analysis found d = −0.22 before and 0.07, not significant, after correcting for publication bias (verified); quote it as likely real in some populations and high-stakes contexts, never as a large general effect. The Stanford Prison Experiment: guards were coached and results were not systematically recorded; use it as a story about demand characteristics, not as evidence. Groupthink as a causal syndrome: the individual mechanisms (self-censorship, pressure on dissenters, illusion of unanimity) are real; the package, in which cohesion causes bad decisions, is unsupported by controlled studies. The IAT as a predictor of individual discrimination and as a target for training: weak; changing implicit measures does not reliably change behaviour (Forscher and colleagues 2019). Watching-eyes effects on honesty: mostly failed replications. Robbers Cave: a single, partly stage-managed field study with a prior failed attempt; a demonstration, not an estimate.\n\nThree habits follow. First, when a finding looks too cute, ask about sample size, preregistration and direct replication before using it. Second, when a classic is on the failed list, the *mechanism* may still be worth keeping as a checklist (the groupthink antidotes are sensible; assign a critic, have the leader speak last) while the *diagnosis* is refused. Third, the fact that a lever failed to replicate is itself [E], and it belongs in your brief as a struck-through line with the reason, because the next person to read the brief will otherwise propose it again."},{"title":"Behaviour changes attitudes: small free commitments produce belief, big incentives produce compliance","tag":"E","body":"Attitudes predict behaviour weakly in general, better when they are specific, strong and accessible, and when the behaviour is under the person's control. The more useful direction for a designer is the reverse one: behaviour shapes attitudes. This is the chapter on how a norm gets internalised.\n\nTwo mechanisms. **Cognitive dissonance** (Festinger): people change beliefs to justify effort, choices and counter-attitudinal acts done for insufficient reward. In Festinger and Carlsmith (1959), participants paid a small amount to tell the next person that a boring task had been interesting later rated it as more interesting than those paid a large amount; the large payment explained the lie, the small one had to be explained by belief. In Aronson and Mills (1959), a more embarrassing initiation produced more liking for a dull group: effort justification. **Self-perception** (Bem): when internal cues are weak, people infer their attitudes from their own behaviour, as an observer would. Induced-compliance and effort-justification dissonance replicate reasonably well at moderate effect sizes; the free-choice paradigm has a statistical artefact and is not to be leaned on.\n\nThe third mechanism runs the other way. **Overjustification**: rewarding an already-enjoyed activity can undermine intrinsic motivation. Children rewarded for drawing later drew less (Lepper, Greene and Nisbett 1973). The effect is real but moderated (Deci, Koestner and Ryan 1999): expected, tangible rewards for engagement do the damage; unexpected or informational rewards mostly do not.\n\nPut together, these give a rule the course returns to in the incentive discussions of Modules 3 and 8. Small, freely chosen, public commitments produce belief. Heavy incentives produce compliance without belief, and paying people for what they already do can crowd out the motive; this is the psychological twin of Ostrom's finding that externally imposed rules can displace local norms. Cost of entry increases loyalty. If you want engineers to own a testing norm, ask for one visible test before the real commitment (foot-in-the-door), make the prevalence of testing visible, and do not attach a large bonus to it. If you want a rule merely obeyed while it is monitored, pay for it.\n\nPersuasion adds one lever and one warning. Dual-process models say a message travels a central route (argument quality, when the audience is motivated and able) or a peripheral route (source, consistency, apparent consensus). A norm pitched to a busy group travels the peripheral route: who says it, how consistently, and whether everyone already seems to agree matter more than the argument. And **inoculation** replicates well, including in the misinformation literature: pre-expose members to weakened versions of the arguments they will hear against the norm, with rebuttals, and the norm survives contact with those arguments.\n\nEmotion supplies the substrate. Guilt, gratitude and outrage are the emotional side of reciprocity and norm enforcement; embarrassment repairs status; anger signals a violated norm. A group where violations produce no visible emotional response has, in effect, no norms, which is [H] but a useful diagnostic question.\n\nBoundary conditions: the dissonance effects are moderate and Western-sampled; interdependent-self cultures show less self-enhancement and different commitment dynamics. [E] for the mechanisms at moderate size; [H] for the magnitude of any commitment device in your group."},{"title":"Boundaries form on nothing, and cooperation across them needs structured contact, not proximity","tag":"E","body":"The intergroup and groups chapters supply the diagnostic checklist for a team that \"should\" cooperate but underdelivers, and the constraint on any fix that involves two sub-groups.\n\n**Minimal groups.** Tajfel (1971) showed that arbitrary categorisation alone, being told you are in the \"Klee\" group rather than the \"Kandinsky\" group on the flimsiest of grounds, produces in-group favouritism. This is one of the field's most robust results. Its consequence for design is that any sub-group boundary inside a team (frontend and backend, old-timers and newcomers, two merged companies) will generate favouritism unless a superordinate identity and cross-cutting collaboration are engineered. Realistic conflict adds fuel: competition over scarce goods produces hostility, and shared goals that neither side can reach alone reduce it (Sherif's Robbers Cave, which is a demonstration and not an estimate).\n\n**Contact.** The remedy with evidence is contact under Allport's conditions: equal status within the situation, common goals, genuine cooperation, and institutional support. Pettigrew and Tropp (2006) find a reliable moderate effect across more than 500 studies; Paluck, Green and Green (2019) note that the rigorous field experiments are fewer and smaller. What does *not* have the evidence is proximity alone (a social event, a shared floor) or implicit-bias training (the IAT predicts individual behaviour weakly, and changing implicit measures d
