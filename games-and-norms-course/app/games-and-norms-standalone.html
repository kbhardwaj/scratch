,"type":"discriminate","front":"Lab costly punishment versus real-world sanctioning: which should a design rest on?","back":"The field version. Willingness to pay to punish is [E] in the lab; 'evolved strong reciprocity' is [H]. Durable commons sanction cheaply, gradually and through participants, so design a cheap, legitimate, proportionate channel.","source":"09-governing-the-commons"},{"id":"c133","module":"m8","type":"discriminate","front":"'Ostrom showed communities always beat states and markets, so hand them the resource.' What is wrong?","back":"Self-governance is a third option that works under identifiable conditions; durable cases lean on courts and enabling law as backstops; several are inegalitarian; Ostrom warned against panaceas. External authority is best as backstop and data supplier.","source":"09-governing-the-commons"},{"id":"c134","module":"m8","type":"discriminate","front":"Do Ostrom's principles transfer to an open-source project or a knowledge commons?","back":"Only with a scope flag. The book concerns subtractable resources with costly exclusion; knowledge commons found partial fit with the boundary and congruence principles reinterpreted. Tag any transfer [H].","source":"09-governing-the-commons"},{"id":"c135","module":"m9","type":"recall","front":"State the cascade threshold and the cluster-blocking condition.","back":"A node switches when at least a fraction q = b/(a+b) of its neighbours have, where a and b are the payoffs to matching on the new and old behaviour. A cluster of density greater than 1 - q outside the seed set blocks a complete cascade, and conversely.","source":"10-networks-crowds-markets"},{"id":"c136","module":"m9","type":"recall","front":"Name the three kinds of copying and the fix for each.","back":"Informational cascade: collect private signals before anyone announces. Network effect: concentrate to cross the tipping point. Coordination on a graph: lower q or seed inside clusters. Name which one you mean every time.","source":"10-networks-crowds-markets"},{"id":"c137","module":"m9","type":"recall","front":"Simple versus complex contagion: define and give the design consequence.","back":"Simple (information, awareness) crosses one exposure, so one weak tie suffices. Complex (costly behaviour) needs several adopting neighbours, so it needs wide bridges or moving whole sub-teams.","source":"10-networks-crowds-markets"},{"id":"c138","module":"m9","type":"recall","front":"State strong triadic closure and its consequence for local bridges.","back":"If a node has strong ties to two others, they must be at least weakly tied. So every local bridge (an edge whose endpoints share no neighbours) is a weak tie. This structural claim is robust (Onnela et al. 2007).","source":"10-networks-crowds-markets"},{"id":"c139","module":"m9","type":"recall","front":"What is the 2pq homophily test?","back":"With fractions p and q of two types, random mixing gives 2pq cross-type edges. Fewer than that indicates homophily. It measures how siloed a group is, not why.","source":"10-networks-crowds-markets"},{"id":"c140","module":"m9","type":"explain","front":"Why do dense clusters block behavioural cascades but not rumours?","back":"Behaviour is a complex contagion: a node switches only when fraction q of neighbours has, and cluster members have most neighbours inside, so the first would-be switcher never sees enough adopters. A rumour needs one exposure, so one bridge in is enough.","source":"10-networks-crowds-markets"},{"id":"c141","module":"m9","type":"explain","front":"Why does the third person in the urn model rationally ignore her own private draw?","back":"Two earlier public guesses reveal two signals that outweigh her one. Guessing with them is correct Bayesian play, and from then on nobody's guess adds information. Rational herding is real and shallow.","source":"10-networks-crowds-markets"},{"id":"c142","module":"m9","type":"explain","front":"Why do closure and bridging trade off, and what does cooperation need?","back":"Closure (many triangles) gives trust and enforcement because everyone sees everyone. Bridges give novelty because they reach outside. Cooperation needs both; the right mix is [H]. Connectivity for skill retention and closure for enforcement are different variables.","source":"10-networks-crowds-markets"},{"id":"c143","module":"m9","type":"apply","front":"Matching on the new behaviour pays 4 to both, matching on the old pays 1. What fraction of neighbours must switch, and what density blocks? (illustrative)","back":"q = 1/(4+1) = 0.2. A cluster of density greater than 0.8 outside the seed set blocks a complete cascade; a cluster of density 0.8 or less does not.","source":"10-networks-crowds-markets"},{"id":"c144","module":"m9","type":"apply","front":"Five sub-teams rarely interact; each has one liaison to the others. Where do you seed a new review norm?","back":"Inside each dense sub-team, not through the liaisons: a weak bridge cannot carry a complex contagion, and each sub-team blocks entry from outside until a member inside has switched. Also lower q with templates and tooling.","source":"10-networks-crowds-markets"},{"id":"c145","module":"m9","type":"apply","front":"Twelve engineers vote by show of hands; the two most senior vote first, both yes; ten follow. What do you know, and what do you change?","back":"Very little: after two visible agreeing signals the rest may be a cascade carrying no private information. Collect independent private judgments before anyone announces, and reverse the speaking order.","source":"10-networks-crowds-markets"},{"id":"c146","module":"m9","type":"apply","front":"A dense sub-team of ten has adopted a norm; management wants to break the team up so the norm spreads. Advise.","back":"Keep the cluster. Its density protects the adopted norm; dispersing members returns each to a neighbourhood below threshold. Build wide bridges from the cluster outward and make its success visible instead.","source":"10-networks-crowds-markets"},{"id":"c147","module":"m9","type":"discriminate","front":"Clusters block versus clusters protect: how are both true?","back":"Same theorem, two directions. A dense cluster outside the seed set blocks a norm entering from outside; a dense cluster that has adopted protects the norm inside. 'Clusters are bad' and 'clusters are good' are both half the rule.","source":"10-networks-crowds-markets"},{"id":"c148","module":"m9","type":"discriminate","front":"Which weak-ties claim is robust, and which must not be quoted?","back":"Robust: local bridges tend to be weak ties, so novelty enters through them. Not to be quoted as settled: 'most useful information and jobs come through weak ties'; large studies found most jobs arrive via weak ties only because people have many, while a single strong tie is more valuable at the margin.","source":"10-networks-crowds-markets"},{"id":"c149","module":"m9","type":"discriminate","front":"'The people who thrive here are strikingly similar, so the community shapes people.' What is the correct default?","back":"Assume selection (who joined and stayed) until longitudinal data show similarity rising after joining. Latent homophily produces the same patterns as influence; only before-and-after data separate them.","source":"10-networks-crowds-markets"},{"id":"c150","module":"m9","type":"discriminate","front":"Collective-brain connectivity (m1) versus network correlation and closure (m6, m9): why must they not be confused?","back":"Connectivity spreads information and retains skill; it is a simple-contagion variable. Correlation and closure make like meet like and supply enforcement; costly behaviour is a complex contagion. Mixing everyone helps the first and can destroy the second.","source":"10-networks-crowds-markets"},{"id":"c151","module":"m9","type":"discriminate","front":"'Everyone is six steps from everyone.' What may you say instead?","back":"Short paths exist in any large network. The number is unreliable: Milgram's six is a median over the minority of completed chains, and most chains died. Findability is a separate question.","source":"10-networks-crowds-markets"},{"id":"c152","module":"m10","type":"recall","front":"What does common knowledge of rationality license, and why is that not Nash equilibrium?","back":"Only rationalizability: strategies surviving iterated deletion of never-best-responses. Nash additionally needs players' conjectures to coincide (Aumann and Brandenburger 1995), which individual rationality cannot generate. Nash is a social achievement.","source":"11-bounds-of-reason"},{"id":"c153","module":"m10","type":"recall","front":"Define correlated equilibrium and the choreographer.","back":"A distribution over joint actions mediated by a public signal, from which no one profits by deviating. When the signal is a social norm, Gintis calls it a choreographer. The signal, not a person.","source":"11-bounds-of-reason"},{"id":"c154","module":"m10","type":"recall","front":"State the two components a norm must have to function as a choreographer.","back":"Epistemic: it tells each person what to do and what others will do, aligning conjectures. Motivational: people have a disposition, or face sanctions, so that compliance is a best response given others' compliance.","source":"11-bounds-of-reason"},{"id":"c155","module":"m10","type":"recall","front":"What is the BPC model, and what does it say 'rational' means?","back":"Beliefs, preferences, constraints: the rational-actor model stripped of selfishness. Rational means consistent preferences, which may be altruistic, spiteful, fairness-driven or norm-following. It is bookkeeping, not an explanation of construal effects.","source":"11-bounds-of-reason"},{"id":"c156","module":"m10","type":"recall","front":"Name the four layers of 'how a group settles on a way of behaving'.","back":"Stability test (Nash/ESS: 04, 07); selection absent intervention (risk dominance: 07, 06); the public signal that aligns conjectures (11); the expectations inside agents and how to measure them (08). Layered, not rival; which one bites is [H].","source":"11-bounds-of-reason"},{"id":"c157","module":"m10","type":"explain","front":"Why is a traffic light a better analogy for a social norm than a rule book?","back":"The light is a correlating device: it sends each driver a related instruction and obeying is a best response given that others obey. A rule book without a shared signal or a shared belief that others follow it is not self-enforcing.","source":"11-bounds-of-reason"},{"id":"c158","module":"m10","type":"explain","front":"Why does Gintis say the common-prior assumption is really a claim about culture?","back":"Bayesian rationality says nothing about where priors come from. A shared prior can only arise from a shared belief-forming process, which in humans is cultural transmission. Aligning beliefs is therefore a cultural intervention, not a data one.","source":"11-bounds-of-reason"},{"id":"c159","module":"m10","type":"explain","front":"Why is the 'unification of the behavioural sciences' called programmatic rather than achieved?","back":"Chapter 12 lists five compatible principles and asserts they suffice, but derives no new result in any discipline; it re-describes existing findings in a common vocabulary. Compatibility is not a theory that predicts what the parts could not.","source":"11-bounds-of-reason"},{"id":"c160","module":"m10","type":"apply","front":"Two product squads look at identical weekly metrics and reach opposite conclusions every week. Diagnose and intervene.","back":"Persistent disagreement on shared data signals different priors. More dashboards will not help; align by shared definitions, joint training and narrative. Direction is [E] (supported by the Origins books); the specific intervention is [H].","source":"11-bounds-of-reason"},{"id":"c161","module":"m10","type":"apply","front":"Half the engineers assume a weekly release cadence, half fortnightly, and merges collide. Diagnose in Gintis's terms.","back":"Two equilibria, misaligned conjectures, no choreographer. Install a public signal: a published, pinned cadence with a visible calendar, so conforming is each engineer's best response. The epistemic half was missing; incentives are unnecessary.","source":"11-bounds-of-reason"},{"id":"c162","module":"m10","type":"apply","front":"A contribution norm sits on a visible board, everyone can state it, and compliance is still low. Which half failed and who repairs it?","back":"The motivational half: some members gain by deviating and no sanction bites. Repair with Ostrom's graduated, participant-run sanctions and Bicchieri's normative expectations; Camerer warns cooperation decays without feedback.","source":"11-bounds-of-reason"},{"id":"c163","module":"m10","type":"apply","front":"Ambiguous ownership of a shared codebase produces recurring fights. What does the property-rights chapter recommend?","back":"Assign a clear owner, even somewhat arbitrarily: an ambiguous cue leaves a hawk-dove game without a correlating signal. Fairness matters for legitimacy and willingness to sanction, which Ostrom and Bicchieri supply, not for the cue itself.","source":"11-bounds-of-reason"},{"id":"c164","module":"m10","type":"discriminate","front":"Strong reciprocity: which part is [E] and which is [H]?","back":"Lab willingness to pay to punish unfair intentions is [E]. 'An evolved trait that sustains cooperation' is [H] (Guala 2012; Binmore 2006). Real sanctioning is mostly cheap and graduated; design on that.","source":"11-bounds-of-reason"},{"id":"c165","module":"m10","type":"discriminate","front":"'Gintis shows people are irrational, so game theory is useless for real groups.' Two errors?","back":"He defends rational choice as preference consistency and game theory as the lexicon; his target is the claim that rationality alone yields Nash play. He wants game theory embedded in a theory of norms, not discarded.","source":"11-bounds-of-reason"},{"id":"c166","module":"m10","type":"discriminate","front":"Which two claims about The Bounds of Reason may not be made, and why?","back":"That correlated equilibrium fits data better than Nash: the argument is conceptual, no horse race was run. That Binmore panned the book: no such review was found; cite Binmore 2006 and Guala 2012 on strong reciprocity instead.","source":"11-bounds-of-reason"},{"id":"c167","module":"m10","type":"discriminate","front":"'Assign the fairest owner and conflicts will fall most.' Salience or fairness?","back":"Salience. Ownership cues resolve hawk-dove conflict by being mutually recognised, not fair; a fair but ambiguous allocation can cause more fights than a clear arbitrary one. The endowment-effect link to property psychology is [H].","source":"11-bounds-of-reason"},{"id":"c168","module":"m10","type":"discriminate","front":"'Bicchieri's is the correct theory of norms; the others approximate it.' What is the course's position?","back":"No single account is the theory. Stability (Nash), selection (Skyrms, Camerer), signal (Gintis) and expectations (Bicchieri) are layers; Skyrms's agents have no beliefs to measure, and Bicchieri does not say which equilibrium a beliefless dynamic reaches.","source":"11-bounds-of-reason"},{"id":"c169","module":"m11","type":"recall","front":"Recite the ten-step diagnostic path in order.","back":"Arithmetic constraint; situation and construal; game shape; contingency and threshold; which amendment; regime and correlation; norm kind and expectations; missing principles; network position and seeding; the public signal. Diagnose before prescribing.","source":"05-micromotives-and-macrobehavior"},{"id":"c170","module":"m11","type":"recall","front":"Define the three tags [E], [H] and [V].","back":"[E]: supported by evidence the ledger marks [E]. [H]: a hypothesis to test in the group, with a stated test. [V]: a value commitment, such as which equilibrium ought to hold. Mis-tags are the capstone's heaviest penalty.","source":"11-bounds-of-reason"},{"id":"c171","module":"m11","type":"recall","front":"How does certainty change as you climb the unified model?","back":"Formal results are theorems; replicated lab mechanisms are [E] for direction; institutional and network prescriptions are [H] for any particular group; the choice of which equilibrium ought to hold is [V].","source":"06-behavioral-game-theory"},{"id":"c172","module":"m11","type":"explain","front":"Why are the course's tensions conditional decision rules rather than contradictions?","back":"Each disagreement between sources resolves into 'if the group is like X, do A; if like Y, do B'. The condition is a hypothesis about the learner's own group, so it is tagged [H] and paired with a test.","source":"07-stag-hunt"},{"id":"c173","module":"m11","type":"explain","front":"Why is 'our team is a stag hunt' [H] rather than [E]?","back":"The PD/stag-hunt distinction is [E]; any group's classification depends on the members' own payoffs, which are inferred, and stays a hypothesis after the defection question is answered. Self-report of payoffs is not evidence.","source":"04-games-of-strategy"},{"id":"c174","module":"m11","type":"explain","front":"Why must a lab mechanism be tagged [H] when applied to the learner's own group?","back":"Lab results transfer as mechanisms and directions, not magnitudes: replicated effects average about two-thirds of originals and samples are WEIRD. The mechanism is [E]; that it bites in this group at a material size is [H].","source":"06-behavioral-game-theory"},{"id":"c175","module":"m11","type":"apply","front":"Sweeten the joint payoff or cut the lone-cooperator cost? Write the condition.","back":"If the interaction is a stag hunt under near-random mixing, cut the cost of being the lone cooperator: it moves the watershed most. If it is a PD, payoffs and sanctions are the lever. Sweetening the joint outcome is the weakest lever in either case.","source":"07-stag-hunt"},{"id":"c176","module":"m11","type":"apply","front":"Mix people more or keep stable clusters? Write the condition.","back":"Keep stable clusters while a norm is young if members copy success; if they copy the majority, clusters will not spread it and you need success-visibility first. Mix for information flow and skill retention, which are simple contagions.","source":"07-stag-hunt"},{"id":"c177","module":"m11","type":"apply","front":"Explain or model? Write the condition.","back":"To spread adherence to a norm, use models, prestige and expectations; explanation is weak there. To transfer a skill with hidden causal structure, teach the reasons explicitly while demonstrating. Documentation supports fidelity in both.","source":"01-secret-of-our-success"},{"id":"c178","module":"m11","type":"apply","front":"Publish the descriptive norm or never advertise prevalence? Write the condition.","back":"Publish a descriptive norm only when it is favourable and paired with an injunctive signal. Never advertise that misbehaviour is common; descriptive feedback alone boomerangs for those above the norm.","source":"03-social-psychology"},{"id":"c179","module":"m11","type":"apply","front":"Install institutions or let structure do the work? Write the condition.","back":"Where defection dominates (a genuine PD or open-access commons), install cheap graduated sanctions, by-product monitoring and a forum, copying a successful peer's package then crafting incrementally. Where the game is a stag hunt, correlation and signals may suffice.","source":"09-governing-the-commons"},{"id":"c180","module":"m11","type":"discriminate","front":"Incentives versus norms: when does an explicit incentive displace the disposition it was meant to support?","back":"When the disposition already exists and the incentive is large: overjustification and crowd-out of unmeasured effort. Prefer the norm where the disposition exists; expect explicit incentives to displace it when they are big.","source":"03-social-psychology"},{"id":"c181","module":"m11","type":"discriminate","front":"Change expectations or change structure? What decides?","back":"Expectations, where the group is one reference network and the signal is seen by all. Structure, where clusters and bridges decide who sees the signal at all. Networks decide whether a signal is seen; then Bicchieri decides whether it moves anyone.","source":"10-networks-crowds-markets"},{"id":"c182","module":"m11","type":"discriminate","front":"Internalised or conditional? State the operational test the course uses.","back":"Assume every norm is conditional until it survives a collapse of expectations, such as a visible prestigious deviation with no sanction. Only then call it internalised or moral. The theoretical debate stays open.","source":"08-grammar-of-society"},{"id":"c183","module":"m11","type":"discriminate","front":"A brief proposes an offsite to 'reduce groupthink', eyes on the honesty box, and willpower-friendly scheduling. What does the capstone rubric say?","back":"All three sit on the failed-replication list (groupthink as syndrome, watching eyes, ego depletion). Any reliance on that list is penalised after mis-tags and fixes-before-diagnosis. Replace with structured procedures, real identifiability and ownership.","source":"03-social-psychology"},{"id":"c184","module":"m11","type":"discriminate","front":"A learner tags 'the team ought to adopt the cooperative equilibrium' as [E]. Correct the tag.","back":"It is [V]: a value commitment about which equilibrium should hold. Evidence can say which equilibria are stable and which the regime will reach; it cannot say which one ought to hold.","source":"11-bounds-of-reason"}],"cases":[{"id":"k01","title":"The deployment expert leaves in eleven weeks","scenario":"Priya is the only person at Lumen, a 40-person payments company, who runs the weekly production deploy of the ledger service. She has given eleven weeks' notice. Eighteen months ago she wrote a 30-page runbook; the wiki shows it has been opened four times, twice by her. Two engineers, Dev and Marta, have each shadowed two deploys, sitting beside her while she typed.\n\nThe runbook contains steps nobody can explain. Step 14 is a 90-second wait before the cache flush; step 22 restarts a sidecar \"twice, not once\". Priya says the wait \"was for something with the read replicas in 2023\" and is not sure it still matters.\n\nTom, the engineering manager, has a plan and a budget line: Priya records a two-hour video walkthrough, expands the runbook to cover every step, and Dev and Marta watch the video before her last day. \"Documentation is the deliverable,\" he says. \"We can't afford to slow deploys while she's still here; we ship every Thursday.\"\n\nMarta is uneasy. She can perform the steps but cannot say why any of them exist, and she has never done one without Priya in the room. Ten deploys remain before Priya leaves.","tension":"t01","module":"m1","question":"How do you spend the ten remaining Thursdays, and what do you tell Tom about the video? Which two authors are arguing in your head?","considerations":["Is the deploy a norm (its value depends on others doing it) or a skill with hidden causal structure? Which of Henrich's and Laland's mechanisms transfers each?","What did the stone-tool experiment find about imitation alone versus teaching with language, and how much weight does one modest study bear?","What does over-imitation predict Dev and Marta will do with step 14 once Priya is gone?","What should happen to the 90-second wait: keep, delete, or something else? Which book warns about removing \"pointless\" practices?","How would you count, separately, who can explain the deploy and who can do it?"],"model_answer":"Decision: Dev and Marta run the next ten deploys themselves with Priya narrating reasons, and the video is cancelled. No strategic game here: a transmission problem, so first sort what is being transmitted. The deploy is a skill with hidden causal structure, not a norm, so t01's second branch applies: IF the target is a skill with non-obvious causal structure THEN budget for explicit teaching of reasons and put expiry dates on the playbooks. Laland's stone-tool result is the evidence: imitation added little over reverse engineering; teaching and language produced the largest gains (Morgan et al. 2015, verified, one study of 184 adults) [E for the mechanism; H for this domain].\n\nConcretely: from Thursday, Dev and Marta drive the keyboard on alternate weeks while Priya sits behind them and speaks only in reasons (\"we wait here because the replicas lag\") [H, tested by whether they deploy alone by week eight]. Every opaque step gets a one-line \"why\" and a \"review-by\" date; the runbook becomes a checklist they edit after each run, so stale exemplars are discounted the way the tournament winner discounted old information [E as a simulation result; H as practice]. Step 14 is not deleted: Henrich's warning is to audit before removing a practice whose payoff may be delayed, so the wait gets an owner and a date to test against the replica-lag metric [H].\n\nTo Tom: the video is imitation with the model absent. Over-imitation predicts Dev and Marta will reproduce every step, including the wait, and lose the point the day a condition changes; that is t01's mirror error. Ten narrated deploys cost about what the video costs and produce two holders of the skill [E for isolation losing skills at lab scale; H at team scale]. Balancing measure: do not over-document; a young practice makes documentation overhead (`02`), so document reasons, not keystrokes [V, that a system beats a hero].\n\nSwitch signal: if by week six they reproduce the surface while incidents rise, teach more; if they can explain every step but will not deploy without Priya, the problem has become a norm of deference, and the lever is a visible model, not explanation. Register entry [H]: \"two unaided deploys with no rollback by week eight; incident count in the quarter after Priya leaves no higher than the quarter before.\"","novice_error":"Accept Tom's plan, because a recorded walkthrough feels like the responsible artifact and costs Priya nothing on Thursdays. It transmits the surface of the practice perfectly and the reasons not at all, so the team keeps the ritual and loses the point. The mirror error is to strip out every unexplained step in the name of simplification before anyone has checked what the wait was for.","sources":["01-secret-of-our-success","02-darwins-unfinished-symphony"]},{"id":"k02","title":"\"Quality first\", then the March ship","scenario":"In January, Lena, VP of Engineering at a 60-engineer analytics company, announced \"quality first\" at the all-hands: three principles on a slide, a poster in every office, a Slack channel. In March the CEO, Marcus, pushed the new Insights dashboard out for a customer conference on 14 March with 23 open bugs, two of them P1, over the objections of the team lead. The launch went fine commercially.\n\nSince then the retro notes read the same every sprint: \"tests skipped to hit the date.\" Two senior engineers, Ana and Yusuf, who other engineers visibly copy, have started approving PRs with failing checks because \"that's apparently what we do now.\"\n\nLena's proposal, due to the leadership meeting on Monday, is a mandatory \"quality week\": a half-day training for every engineer on the three principles, a quiz, and a signed pledge. Marcus is fine with it as long as the April Exports feature ships on 22 April for a contract milestone. Ana, asked privately, says: \"Nobody believes the poster any more. Another slide will make it worse.\"","tension":"t01","module":"m1","question":"Do you back the quality week? If not, what do you put in its place before 22 April, and what do you tell Marcus?","considerations":["In Henrich's terms, what did the 14 March ship transmit, and through which channel: the poster's or the CEO's?","Is \"quality first\" a norm or a skill, and what does t01 say adoption looks like for each?","What are Ana and Yusuf in the group's learning network, and what are they modelling now?","What would count as a credibility-enhancing display by Lena and Marcus, and what would it cost?","What must you not broadcast about how often builds ship broken (t10)?"],"model_answer":"Decision: cancel the quality week and replace it with one visible, costly reversal by the two people the engineers watch most, before 22 April. Draw the situation first: \"quality first\" is a norm, not a skill; its value depends on everyone holding it and its payoff is diffuse. So t01's first branch applies: IF the target is a norm THEN put a prestigious, self-similar model visibly doing it and succeeding, make leaders' costly displays point the same way, and do not count a memo or training as adoption. The March ship was a credibility-enhancing display pointing the opposite way; one visible costly exception transmits the opposite norm (`01`) [E for the bias; H for the size of the effect here].\n\nThree moves. First, Marcus and Lena publicly hold the Exports release on the first P1 found, and say so in the format they used in January: a display that costs a milestone carries the norm; a display that costs nothing is a poster [E for the mechanism; V that a real cost is the price of credibility]. Second, Ana and Yusuf, not the VP, are the visible refusers: two blocked merges by prestigious engineers, reasons written in the PR, do more than the training [E for prestige-biased copying; H for the intervention]. Third, fill the norm slot with a self-enforcing convention (`08`): merging on red is impossible by default, so the norm needs no daily heroism [E that conventions are cheaper to hold than social norms].\n\nBalancing measure, from t10: never publish how many builds shipped broken; a count of misbehaviour is itself transmitted. Publish the sprints where every check passed, paired with visible approval [E for the pairing rule]. The pledge is dropped: a pledge for a norm nobody's models hold is a filing-cabinet norm.\n\nTo Marcus: 22 April is the test. If a P1 appears and the release ships anyway, the company has told 60 engineers, for the second time, what the norm is. Switch signal: if engineers can recite the principles and merge-on-red continues, the model channel is failing and needs more visible modelling; if skipped tests persist among those who never saw the reversal, the group is more than one reference network and the display must be repeated locally. Register entry [H]: \"after one publicly held release, P1-with-known-bugs ships fall to zero for two quarters.\"","novice_error":"Run the quality week, because training is what you do when people \"don't get it,\" and a quiz produces evidence of completion. Adoption is not a knowledge gap here; everyone knows the rule and watched it lose to a date. The mirror is to shame the March decision in public, which advertises how often quality loses and teaches the same lesson faster.","sources":["01-secret-of-our-success","03-social-psychology","08-grammar-of-society"]},{"id":"k03","title":"The best-practices wiki nobody updates","scenario":"Grainline is an open-source data-tooling project with about 400 contributors on record and 25 active in a typical month. It has a Best Practices wiki: 140 pages, median last edit 26 months ago. New contributors are told to read it in the welcome message. A survey Jonas, the lead maintainer, ran last month found that 8 of the 25 active contributors had read more than five pages, and that the three most-read pages were all out of date (the release process changed in 2024; the wiki describes the old one).\n\nJonas proposes a documentation sprint before the 3.0 release in six weeks: rewrite all 140 pages, then a rule that every pull request must cite the wiki page it follows, enforced by a bot. \"If they don't read it, we make reading it the path of least resistance.\"\n\nWei, a long-tenured contributor whose PRs are the ones newcomers copy, says the opposite: delete the wiki, keep the three pages that matter, and stop pretending. A third maintainer points out that Wei's own PRs are the real style guide and always have been.","tension":"t01","module":"m1","question":"Rewrite, delete, or something else, and what happens to Jonas's citation rule? What do you decide before the 3.0 release?","considerations":["Of the 140 pages, which are norms (review etiquette, style) and which are hidden-structure skills (release, migrations)? Does t01 give them the same channel?","What did the tournament winner do with old information, and what is the wiki doing with it?","Why are Wei's PRs the real style guide, and what does that say about the channel norms travel through?","What is the citation rule, in game terms: assurance, enforcement, or a costly signal? On which problem?","What does Laland say happens to a population of pure copiers, and what does that imply for an exemplar-based guide?"],"model_answer":"Decision: neither rewrite nor delete. Triage the 140 pages into two kinds, give each its own channel, and drop the citation rule. Draw the situation first: there is no defector to sanction; a transmission channel has silted up. The wiki does the opposite of the tournament's winning strategy: it keeps old information at full weight instead of discounting it (Rendell et al. 2010, verified, 104 entries, a simulation) [E as a model result; H for this project]. So the first move is Laland's \"expire old exemplars\": every page gets a date and an owner, and any page without an owner by the 3.0 release is archived with its date visible [H].\n\nThen the split, t01's rule: IF the target is a norm THEN put a prestigious model visibly doing it; IF it is a skill with hidden causal structure THEN teach the reasons. Pages that describe norms (how we review, how we name things) are replaced by visible models: the page becomes a link to three recent exemplar PRs, two of them Wei's. Norm adherence spreads through models and prestige, and explanation is a weak channel for it; the third maintainer has already told you Wei's PRs are the style guide [E for the mechanism; H for the intervention]. Pages that describe skills with hidden causal structure (release, migrations, security disclosure) are kept, rewritten by their owners, and paired with a narrated walkthrough on a recorded release call, where teaching and language beat imitation (Morgan et al. 2015, verified, one study) [E for the mechanism; H for transfer]. Everything else is archived.\n\nJonas's citation rule is enforcement aimed at a transmission problem: a bot demanding a citation manufactures a ritual (cite the page, ignore it). Balancing measure: a project of pure copiers stagnates, so one page is \"experiments we are running,\" and maintainers reserve review time for contributions that break the exemplar on purpose (`02`) [E in the tournament; V that innovation is worth some review cost, Jonas dissenting].\n\nSwitch signal: if after 3.0 newcomers' PRs match the exemplars but the release still breaks in anyone's hands but Jonas's, teach more; if the release process is understood but only its authors follow the review norms, the model channel needs a more visible model. Register entry [H]: \"by 3.1, at least three maintainers have run a release unaided, and the share of first PRs needing style rework falls.\"","novice_error":"Fund the rewrite, because 140 fresh pages look like diligence and a bot rule looks like rigour. Both treat adoption as reading, and the survey already showed reading is not happening. Deleting everything feels honest but throws away the few pages whose reasons cannot be copied from a PR.","sources":["02-darwins-unfinished-symphony","01-secret-of-our-success"]},{"id":"k04","title":"Twelve people, two \"coasters\", and a leaderboard","scenario":"The platform team at Corvid grew from 5 to 12 engineers in nine months. Sam, the manager, has a chart: merged changes per engineer per sprint are down by about a quarter since the team was 5, while total output is flat. He has names: Rick and Jo, both hired in the growth wave, \"coast.\" Performance reviews are in five weeks.\n\nSam's fix is ready to deploy: an individual story-point leaderboard shown at every standup, and a quarterly bonus tied to points. \"Visibility fixes this. People rise to what's measured.\"\n\nOla, the tech lead, objects that this has always been a communal team: people pick up reviews, mentor the new hires and fix each other's bugs without being asked, and none of that shows in story points. She also notes that the team still runs one shared board with one shared backlog; nobody owns any component, and a change to the ingestion service last month had four authors and no reviewer who felt responsible. Rick, asked about his numbers, says he spent most of the last two sprints unblocking the data team.","tension":"t12","module":"m2","question":"Do you ship the leaderboard? If not, what do you do about output per head, and about Rick and Jo, before the review cycle?","considerations":["What does a 12-person team with one backlog and no ownership look like in game terms? Which social-psychology effect does that structure produce, and is it dispositional?","What does the course say to check before concluding \"we have free-riders\"?","What does a partial metric (points) do to the unmeasured effort (reviews, mentoring, unblocking)? Which book states this as theory?","What is the evidence on introducing scorekeeping into a communal relationship, and on bonuses as a lever for positive reciprocity?","If the structure is fixed and two people still contribute little, which tension takes over?"],"model_answer":"Decision: no leaderboard and no individual bonus; restructure into three pods of four with named ownership, make effort visible as a by-product of the work, and only then look at Rick and Jo. Draw the game first: twelve people, one backlog, one shared output and no identifiable contribution is a public-goods game with unidentifiable effort, and that structure produces loafing whoever is in it (`03`, on the robust list) [E]. The course's rule is to diagnose situationally before dispositionally, because the attribution error is among the best-replicated findings in the book [E].\n\nt12's rule: IF the behaviour is one you want members to own (review, mentoring, unblocking) THEN use small public commitments, modest recognition and norms; never introduce individual scorekeeping into a communal team without expecting damage, and if a metric is needed make it collective [E for the mechanism; H for this team]. Dixit adds the theory: a partial metric displaces the unmeasured effort that shares its budget, and Rick's last two sprints are that effort [E as theory; H for magnitude]. The bonus is the weakest lever: positive reciprocity to extra pay boosted effort for the first few hours only and cost more than it returned (Gneezy and List 2006, verified) [E].\n\nConcretely: three pods of four (the `03` figure of 2-5 is a rule of thumb, not a measured optimum) [H], each owning named services; and the Balancing measure, since a PD must never run on norms alone: monitoring as a by-product (CODEOWNERS, reviewer of record) with any metric collective, per pod [E for the principle; H for transfer]. Write the BPC table for Rick and Jo before the review (`11`): Rick's answer is already a constraint, not a preference [E as bookkeeping]. Whether this team is a community or a set of exchange partners is the value under the decision [V, with Sam dissenting].\n\nSwitch signal: if after a quarter of identifiable pods the same two are stable, identifiable non-contributors, t05's self-interested tail is in play and t02's cheap graduated sanctions apply; if the measured behaviour rises and reviews fall, the metric is displacing and goes. To Sam: the leaderboard buys points and sells the mentoring you did not measure. Register entry [H]: \"with pods and ownership, per-head throughput recovers within two quarters without a leaderboard; reviews per engineer do not fall.\"","novice_error":"Ship the leaderboard, because it is the product default (instrument it, rank it) and it visibly \"does something\" before the review cycle. It converts a communal team into an exchange one and rewards the measurable half of the work. The mirror is to refuse all measurement out of trust, so the two who genuinely coast stay invisible and the conditional cooperators quietly stop.","sources":["03-social-psychology","04-games-of-strategy","11-bounds-of-reason"]},{"id":"k05","title":"The banner that made direct pushes worse","scenario":"Farah runs the internal developer platform for 180 engineers. The rule is that nothing goes to `main` without a reviewed pull request. In May she counted 37 direct pushes and put a red banner on the CI dashboard everyone opens each morning: \"Last month: 37 direct pushes to main. Please stop.\" In June there were 52.\n\nHer next proposal, for the July platform meeting, is a bigger banner with the names of the engineers who pushed directly, refreshed daily. \"If shame doesn't work, more shame will.\" A staff engineer, Kwame, says the banner is the problem, not the fix, but cannot say why in a way that convinces her. The raw numbers, which Farah has not put on the banner: about 2,400 changes reached `main` in June, so around 98% went through review. Of the 52 direct pushes, 31 came from four people on one team that runs hotfixes for a legacy service without a working PR pipeline.","tension":"t10","module":"m2","question":"What goes on the dashboard in July, and what do you do about the four engineers and the legacy team?","considerations":["Which channel did the May banner use, descriptive or injunctive, and what did it tell the 176 engineers who never push directly?","What did the Petrified Forest sign and the energy-feedback studies show about advertising the frequency of misbehaviour?","Is reviewed-merging the majority's behaviour here? What does t10 say to publish when it is?","What does a names banner do without a legitimate process (t02)?","Are the 31 pushes from one team a norm problem at all?"],"model_answer":"Decision: take the banner down, publish the 98% with a visible approval signal, fix the legacy team's pipeline, and refuse the names board. Draw the situation: a near-universal convention with a small pocket of deviance, and the May banner told 176 compliant engineers that direct pushes are common. That is the boomerang: descriptive feedback alone pulls people above the norm down toward it, as the energy-feedback experiments found, and the theft sign in the Petrified Forest raised theft (`03`) [E for the boomerang]; \"most people don't do this\" is itself transmitted (`01`) [E].\n\nt10's first branch applies: IF the target behaviour is already the majority's THEN publish the count and pair it with a visible approval signal. So the July dashboard reads \"98% of changes to main last month went through review,\" with a line from the two most-copied staff engineers saying that is how it should be: descriptive and injunctive channels pointing the same way (ledger #24) [E for the pairing rule; H for its size here].\n\nThe four engineers are a structural problem, not a norm problem: 31 of 52 pushes come from a team whose PR pipeline does not work for hotfixes, so their behaviour is a constraint, not a belief or a preference (`11`'s BPC bookkeeping) [E as a discipline]. Fix the pipeline first. Balancing measure, so the descriptive channel never runs alone, t02: a cheap, fast, proportionate channel (a bot comment on any direct push that opens a retroactive PR and pings the author), with a written escalation ladder, and branch protection as the structural backstop [E for graduated sanctions in durable institutions; H for this platform].\n\nThe names board is refused on two grounds: it is descriptive again, with a shaming twist, and public peer punishment without a legitimate process is where antisocial punishment starts [E for the sensitivity; V for the constraint, with Farah dissenting]. To Farah: the banner did not fail because it was small; it worked, and it taught the wrong count.\n\nSwitch signal: run the four-question elicitation before and after July. If above-norm engineers regress after the 98% is published, or people can state the count and still do not believe anyone expects a PR, the normative channel needs backing from t02's ladder. Register entry [H]: \"direct pushes fall below 15 a month within two months of pipeline fix plus paired messaging, without a names board.\"","novice_error":"Make the banner bigger and add names, because the first one \"didn't work\" and escalation feels like resolve. The first one worked exactly as the evidence predicts; it broadcast a minority behaviour as common. The mirror error is to delete the banner and say nothing, leaving the legacy team's pipeline broken and the count to drift.","sources":["03-social-psychology","08-grammar-of-society","01-secret-of-our-success"]},{"id":"k06","title":"The hiring committee that wants bias training","scenario":"Vantage, a 300-person company, has a seven-member engineering hiring committee. All seven studied at the same two universities and came up through backend work. Of the last 20 hires, 18 fit the same profile. Interview debriefs run as open discussion, chaired by Ravi, the most senior member, who usually opens with his read of the candidate; the vote is a show of hands.\n\nDana, Head of People, has a proposal for the end of the quarter: a half-day implicit-bias training built around the Implicit Association Test for all 40 interviewers, plus a values session on \"our inclusive culture.\" Ravi supports it: \"It's cheap and it shows we care.\" A founder on the committee says the opposite: \"Hire for fit; culture is why we ship.\"\n\nTwo hiring managers outside the committee have complained that strong candidates from other pipelines (a bootcamp partnership, two internal transfers from data) were rejected after debriefs in which the first speaker was negative and nobody dissented. The next committee cycle begins in three weeks with 14 candidates.","tension":"t08","module":"m2","question":"Do you fund Dana's training? What do you change about the committee before the 14 debriefs, and what do you tag as a value?","considerations":["What does the ledger say about IAT-based training, and which intergroup intervention does have moderate evidence?","Is the 18-of-20 pattern evidence of bias or of selection and homophily? What does the course assume by default?","What does a homogeneous group do when it deliberates, and what structural fixes does `03` give?","Which of t08's poles is Dana's proposal, and which pole does the rule say to build first?","What does \"hire for fit\" do to a learning network over time (`01`)?"],"model_answer":"Decision: decline the IAT-based training, restructure the debrief before the 14 candidates, add two committee members from outside the cluster, and write the goal down as a value. Draw the situation: no opponent, but a deliberating group whose composition and procedure push the same way. Assume selection over influence for the 18-of-20 similarity (ledger #35) [E as a default]; homogeneous groups polarize when they deliberate (`03`) [E]; Ravi speaking first makes each debrief a sequential public signal, the cascade setup of `10` ch 16 [E for the mechanism].\n\nt08's rule: IF you are choosing between an identity intervention and a within-group mechanism THEN build the within-group mechanism first and treat identity work as an accelerant tagged [H]. Dana's proposal is identity work of the weakest kind: IAT-based training is on the ledger's do-not-build list (#20), while structured contact around shared goals has a reliable moderate effect across 500+ studies (Pettigrew and Tropp 2006, background; rigorous field experiments fewer and smaller) [E for contact; not [E] for the training]. The mechanism is procedural: written independent scores before discussion, revealed together; Ravi speaks last; one assigned credible dissenter; proposal separated from evaluation (`03`, `10`) [E for each mechanism; H for the package]. Then t09: two members from the data organization and the bootcamp partnership as bridges into the rejected pipelines [H for the mix], and a shared calibration task between interviewers and those pipelines' hiring managers, the contact form with evidence [E moderate].\n\nTo Ravi: \"it shows we care\" is a display aimed at the wrong channel. To the founder: a network that hires only self-similar copies narrows what the collective brain retains (`01`) [E at lab scale; H here]. Whether profile diversity is a goal at all is a value; write it as one, with the founder named as dissenter [V]. Balancing measure: procedure fixes deliberation, not sourcing; if the pipelines carry one profile, no debrief rule changes the hires.\n\nSwitch signal: if two cycles of private-first scoring give the same profile share, the problem is upstream in sourcing; if identification with \"our inclusive culture\" rises while hires do not change, identity work has run without a mechanism. Register entry [H]: \"with private scores first and two outside members, non-standard-profile hires among the next 20 exceed 2 of 20.\"","novice_error":"Fund the training, because it is cheap, visible, and hard to argue against in a leadership meeting. It builds on a method the ledger lists as not to be built on and leaves the debrief structure, which is doing the damage, untouched. The mirror is the founder's: declare fit a virtue and never notice that the committee's unanimity is fast and wrong.","sources":["03-social-psychology","10-networks-crowds-markets","01-secret-of-our-success"]},{"id":"k07","title":"Forty people saw the checksum post","scenario":"Sable is an open-source cryptography library with a community Slack of about 2,000 members and nine maintainers. At 09:12 on a Tuesday a new user posted in `#general`: \"The 4.2.1 tarball checksum doesn't match the one on the site. Is this a compromise or am I doing something wrong?\" Slack's view count reached 40 by 10:00. Three people added a thinking-face emoji. Nobody replied. Ines, a maintainer, saw the post at 15:30, verified within twenty minutes that a mirror was serving a stale file, and posted a fix at 16:10. Seven hours of silence on a possible supply-chain compromise.\n\nInes's diagnosis, in the maintainers' channel that evening: \"People just don't care. We need a security champion role and a code-of-conduct clause: if you see a security concern you are required to report it.\" The 4.3 release is in three weeks. Another maintainer, Bruno, points out that at least six of the 40 viewers were experienced contributors who would have known how to check a checksum in two minutes.","tension":"t11","module":"m5","question":"What do you build before the 4.3 release, and is Ines's \"people don't care\" a preference or a belief?","considerations":["What does the bystander literature say is robust, and in which settings? Which three ingredients were present at 09:12?","Write the BPC table for one of the six experienced viewers: what did they believe about the other 39?","Does a code-of-conduct clause change a constraint, a preference or a belief? Which column did the failure live in?","What are `03`'s four bystander fixes, and which of them are structural?","How would you know whether the fix worked before the next real alarm?"],"model_answer":"Decision: build the structure that removes ambiguity and diffusion of responsibility before 4.3, and drop the code-of-conduct clause. Draw the situation: forty people, one ambiguous signal (\"or am I doing something wrong?\"), no named owner, and everyone able to see that nobody else had replied. That is the bystander structure, [E] precisely for ambiguous, low-risk-looking situations (ledger #23); in obvious emergencies someone almost always acts. The thinking-face emoji are pluralistic ignorance in miniature.\n\nt11's rule sorts the fix. Nothing about the six experienced viewers' preferences changed between 09:12 and 16:10; what differed was what each believed the others had done. IF behaviour moves with the order of information or the first rounds THEN treat it as a belief: change the information and the first response, not the payoffs. The BPC table (`11`) for Bruno's six reads: beliefs, \"someone closer will handle this\"; preferences, they care; constraints, none. Ines's clause changes the constraint column for a failure in the belief column, the usual error the rule names [E for BPC as bookkeeping; H for its predictive value here]. The `03` fixes are structural [E for each mechanism; H for the package]: make the problem unambiguous (a `#security-reports` channel with a template); assign named ownership (a rotating maintainer-of-the-week in the channel topic); give a script (\"reply 'checking', run the verify command\"); make the first move cheap (one emoji pages the maintainer of the week). The champion role is fine if it is the rota, not a hero.\n\nTo Ines: \"people don't care\" is the dispositional reading the course tests last; the same six would have acted in a channel with a name on it. Balancing measure: the belief pole has a floor. If reports still do not come once ownership is fixed, the residual is a cost, fear of being wrong in front of 2,000 people, and that is a payoff to change: thank false alarms publicly [H]. That false alarms are welcome is a value; say so [V, Ines dissenting].\n\nSwitch signal: toward beliefs, confirmed, if a drill produces a reply within minutes from someone silent on Tuesday; toward preferences if, with ownership and script in place, experienced viewers still wait. Register entry [H]: \"time to first substantive reply on a planted security report under 15 minutes, twice, before 4.3 ships.\"","novice_error":"Write the clause and appoint a champion, because a rule and a title look like accountability and take an evening. The clause obligates 2,000 people who already wanted to help and were each waiting for someone else; the champion becomes the one person everyone now waits for. The mirror is to conclude that Slack is simply the wrong channel and move security to email, which makes the next report invisible instead of ambiguous.","sources":["03-social-psychology","11-bounds-of-reason","08-grammar-of-society"]},{"id":"k08","title":"The maintenance day that needs eight","scenario":"The Halden Street tool library is a member-run commons: 120 households pay a small annual fee and borrow tools. Once a month a maintenance day sharpens, repairs and inventories the stock. It needs eight volunteers to get through the list; with fewer, the day ends with half the work undone and everyone who came feeling their Saturday was wasted. Attendance over the last four months: 9, 7, 5, 4.\n\nBea, the coordinator, has drafted a rule for the members' meeting in three weeks: every household must attend two maintenance days a year, and no-shows have their borrowing suspended for a month. \"Volunteering is dead. People respond to obligations.\"\n\nKarl, who has attended every session, disagrees: \"People want to come. They just don't know if anyone else is coming, so they don't bother. Send a reminder.\" The next maintenance day is twelve days after the meeting, and the inventory list already shows nine tools waiting on repairs that only get done on those Saturdays.","tension":"t07","module":"m3","question":"What rule, if any, do you propose at the meeting, and what do you do about the next maintenance day?","considerations":["Does a household gain by staying home when eight others show up? Does it gain by staying home when only four will? What game is that?","Where is the critical mass, and what happens to a shared practice launched or continued below it (`05`)?","What are the assurance devices `04` and `07` name, and which is cheapest to try in twelve days?","If attendance recovers after an assurance device and then decays again, what has the decay told you?","What does Ostrom say about matching obligations to benefits, if a rule is eventually needed?"],"model_answer":"Decision: no obligation rule at this meeting; propose a threshold launch with public pledges for the next maintenance day, and hold Bea's rule in reserve with a stated trigger. Draw the game with t07's diagnostic: does a household gain by staying home when everyone else comes? Slightly. But the dominant fact runs the other way: with four present, coming is a wasted Saturday, so each household's willingness depends on believing others will come. That is a stag hunt with a critical mass at eight, not a prisoner's dilemma [E for the formal distinction; H for this group's classification]. Four months of decline is Schelling's half-launch, which decays and poisons the next attempt through self-defeating expectations [H].\n\nThe rule's first branch applies: IF nobody gains by defecting against full cooperation THEN build assurance and stop building enforcement: public pledges, threshold launches, a leader naming the target. For the day twelve days out: a public sign-up list reading \"the day runs if eight households sign up by Wednesday; otherwise it is cancelled and nobody wastes a Saturday\" [E for threshold devices in `04`; H here]; Bea names the target; Karl, who has attended every session, is the visible model. The cancellation clause makes the pledge credible by removing the wasted-Saturday cost of being the lone cooperator, the lever that moves the watershed most (t04) [E for the model].\n\nBalancing measure, and the answer to Bea: run the talk first because it is cheap, and watch the following rounds. If attendance recovers to eight and holds, it was assurance. If it recovers and then sags month by month with the same households absent, decay is the prisoner's-dilemma signature and the second branch applies: a graduated obligation matched to benefits as Ostrom's cases do, with a small first sanction, never a month's suspension [E for graduated sanctions in durable commons; H for transfer]. Suspension as a first strike would land on households that were merely uncertain. Whether the library should ever compel attendance is a value [V, Bea dissenting]. To Karl: a reminder tells people the date, not that others are coming; the sign-up list tells them that.\n\nSwitch signal: cooperation at the meeting against cooperation three sessions later. Register entry [H]: \"with a threshold sign-up, the next three maintenance days each reach eight; if any falls below six without cancellation, the obligation rule goes to the next meeting.\"","novice_error":"Pass Bea's rule, because falling numbers look like free-riding and an obligation with teeth feels like taking the problem seriously. It installs monitoring and penalties on people who were waiting to be assured, and the suspension will land on the uncertain rather than the unwilling. The mirror, Karl's, is to send another reminder and treat the fourth decline as bad luck.","sources":["04-games-of-strategy","07-stag-hunt","05-micromotives-and-macrobehavior","09-governing-the-commons"]},{"id":"k09","title":"Ban or note?","scenario":"Fernhill is a hobbyist electronics forum with about 5,000 members and six volunteer moderators. Its code of conduct has a \"zero tolerance\" clause: demeaning remarks lead to a permanent ban. On Monday a member with the handle Tarn, two years on the forum, about 800 posts, most of them helpful, told a newcomer their question was \"the kind of thing people ask when they shouldn't own a soldering iron.\" The newcomer deleted their account. A complaint thread has 30 replies, several of them abusive toward Tarn.\n\nPolicy gives the moderators 48 hours to decide. Two moderators want the permanent ban: \"The clause says what it says; if we don't apply it, the CoC is theatre.\" Lucia, the longest-serving moderator, wants a private note to Tarn and nothing public: \"He's one of our best people; a ban loses him and gains nothing.\" The remaining three are undecided and, privately, exhausted: in the last year the team has applied the ban clause once and quietly ignored eleven reported violations because nobody wanted to be the one who pulled the trigger.","tension":"t02","module":"m3","question":"Ban, note, or something else by Wednesday, and what do you do about the eleven ignored reports and the abusive thread?","considerations":["What is the sanction in game terms: is a permanent ban a credible threat when the enforcers avoid applying it? What does `04` say about sanctions that cost the enforcer too much?","What do Ostrom's durable commons do for a first violation, and what does the 91-study review say about it?","Was Tarn's remark an unfair intention or an unlucky outcome, and what does `06` say that predicts about the newcomer's exit and the thread?","What is the 30-reply thread, in t02's terms, and what does the course say about peer punishment without a process?","What ladder would the six moderators actually apply?"],"model_answer":"Decision: a graduated, public, quick sanction now, a published ladder by the end of the week, and the zero-tolerance clause rewritten. Draw the game first: a repeated game with reputation, in which a sanction deters only if credible, and a sanction that costs the enforcer more than ignoring the violation will not be applied and will not deter (`04`) [E]. One ban and eleven ignored reports in a year prove it: the permanent ban is a nuclear first strike six volunteers will not fire, so Fernhill has no sanctions in practice.\n\nt02's rule: IF you are budgeting enforcement THEN assume members sanction only when the channel is cheap, fast and proportionate, and make the ladder known. Ostrom's durable cases use graduated sanctions, small and quick and public first, supported in the 91-study review (Cox et al. 2010, verified) [E for the field pattern; H for transfer to a digital forum, scope flagged]. So by Wednesday: a moderator reply in the thread naming the rule Tarn broke, a seven-day posting restriction, and an entry in a public sanctions log [E for the mechanism; H for this calibration]. The rewrite: a three-step ladder (public note and short restriction; longer restriction; ban) with a fast track for flagrant cases and a cheap channel where Tarn can contest the step [E for dispute forums in Ostrom's principles; H for transfer].\n\nThe newcomer's exit and the pile-on are one phenomenon: people punish intended unfairness far more than unlucky outcomes (`06`, Blount 1995) [E in the lab]. The thread is peer punishment without a process, where antisocial punishment starts; close it [E for the sensitivity; V that legitimacy constrains peer sanction, the two ban-minded moderators dissenting]. To Lucia: a private note keeps the sanction invisible, and punishment works largely through what observers learn (`02`) [E/H]. Balancing measure: the ladder must have a top and the fast track must be real, because the mirror error is removing sanctions and watching contributions decay as Camerer's curves predict.\n\nSwitch signal: count violations reported against violations sanctioned, and by whom. If the ratio stays near one in twelve, the first step is still too costly and needs a one-click template; if moderators pay visible personal costs and violations still climb, escalate. Register entry [H]: \"at least three of every four reported violations receive a first-step sanction within 48 hours over the next quarter.\"","novice_error":"Apply the ban, because the clause is written and consistency sounds like fairness. The ban is applied so rarely that consistency is the one thing it lacks, and it would be applied here mainly because the thread demanded it. The mirror, Lucia's, keeps a valued member by making the sanction invisible, which teaches 5,000 observers that reports go nowhere.","sources":["04-games-of-strategy","09-governing-the-commons","06-behavioral-game-theory","01-secret-of-our-success"]},{"id":"k10","title":"\"We've played this game for years\"","scenario":"Amir founded a shared machine-learning compute cooperative three years ago with nine research labs. Members submit jobs to a common queue with a priority flag; the founding norm was that you flag a job urgent only when it is. In year one about 5% of jobs were flagged urgent. The co-op now has 70 member groups, and last quarter 30% of jobs were flagged urgent; queue-jumping complaints reach the ops lead, Hana, weekly, and two founding labs have started overstating their own priorities \"because everyone does.\"\n\nThe compute grant that funds the cluster is up for renewal in two months, and the funder has asked how the co-op governs itself. Hana wants automated per-group quotas enforced by the scheduler, designed and deployed by ops. Amir is against any rule: \"We've played this game for years. Repeat interaction guarantees cooperation. Rules would insult the labs that built this.\" Two of the newer member groups, asked privately, say they overstate because they have never met anyone from the labs whose jobs they are jumping.","tension":"t14","module":"m3","question":"Is Amir right about repeat play? What do you propose to the funder, and what does the scheduler enforce?","considerations":["At nine labs, who observed whom, and how fast was an overstated priority detected? At 70, what is the shadow of the future between any two groups?","What does the ledger say repetition guarantees, and what problems does it leave unsolved (#15)?","Which of t14's rules applies to a behaviour that depends on observation and sanctions?","What does nesting look like for a compute queue, and what is the higher layer for?","Is Hana's quota a designed rule or a self-governed one (t06), and what does that predict about compliance?"],"model_answer":"Decision: Amir is right about year one and wrong about year three; nest the co-op into pods of about ten groups, make queue behaviour visible inside each pod, and hand the quota rule to the pods rather than the scheduler. Draw the game first: overstating priority when others are honest pays, so this is a prisoner's dilemma at the margin, an open-access commons [E]. At nine labs every group saw every other's jobs and each pair had years of dealings ahead, so repetition with fast detection made honesty one equilibrium (`04`) [E for the folk-theorem logic]. At 70 groups no pair meets often and who punishes whom is hard; every mechanism the founders relied on weakened as the group grew [E].\n\nt14's rule: IF a behaviour depends on mutual observation or on sanctions THEN keep the unit small, bounded and stable, and scale by nesting: local units govern local problems, a higher layer handles conflict between units and shared infrastructure. Concretely: seven pods of about ten groups with a steward each; each pod gets a share of the cluster and a visible pod-level queue, so an urgent flag is seen by nine groups who share its consequence, monitoring as a by-product of use (`09`) [E for the principle in bounded field cases; H for transfer to a digital commons, scope flagged]. Each pod sets its urgent share within a cluster-wide cap, with a graduated automatic first sanction: an urgent job that finishes with idle time lowers the group's priority next week [E for graduated sanctions; H for this design]. Boundaries are written down: who is in, what they owe, who is excluded and why [V, because a boundary that makes monitoring work also excludes].\n\nTo Hana: an ops-designed quota imposed on 70 groups is followed while enforced (t06; Cardenas, background) [E for the pattern]. To Amir: repeat play is what the co-op had at nine; at 70 it must be rebuilt in units where people meet. Balancing measure: pods must not become guilds; the higher layer keeps admission open.\n\nSwitch signal: urgent-flag share per pod against pod size, and fraction of flagged violations sanctioned; if pods above a dozen drift back toward 30% while smaller ones hold, the unit is still too large. Register entry [H]: \"urgent-flag share below 10% cluster-wide within two quarters of nesting, without scheduler-enforced quotas.\"","novice_error":"Take Amir at his word, because the founders' cooperation is real and rules feel like an insult to it. Their cooperation was produced by a structure that no longer exists at 70. The mirror is Hana's: a central quota written by ops, which converts a community into a rule it will spend its ingenuity gaming.","sources":["04-games-of-strategy","09-governing-the-commons","06-behavioral-game-theory"]},{"id":"k11","title":"The Friday demo that went from twelve to three","scenario":"Nadia, head of product at a 15-team company, started a Friday cross-team demo in January. Twelve teams presented in the first month. Four months later, three teams present and about ten people attend. Presenting takes each team about two hours of preparation, and a team that presents to ten people gets little back; a team that attends when nobody presents has lost an hour. The three still presenting are the ones whose demos led to decisions being taken in the room.\n\nNadia's plan, for Monday's leadership meeting: attendance mandatory for every team lead, an attendance list emailed to the executive team each week, and a catered lunch. \"It worked when everyone came. We just need everyone to come.\"\n\nRavi, one of the three still presenting, says the mandate will fill the room with people on laptops and that the demo died because teams stopped believing anyone would be there. He has no counter-proposal beyond \"give it time.\"","tension":"t04","module":"m4","question":"Do you support the mandate? What would you do instead to get the demo back above the point where it sustains itself?","considerations":["Draw the payoffs: when is presenting worth two hours, and what is the cost of being one of the few who prepared? Which equilibrium is the group in now?","What does Schelling say happens to a practice that runs below its critical mass for months?","t04 lists cheap correlation levers in order. Which one attacks the cost of the lone cooperator, and which merely sweetens the joint payoff?","What are the three remaining teams, structurally, and how would you grow from them?","What does a mandate change about the lone-cooperator payoff?"],"model_answer":"Decision: no mandate; cut the cost of presenting to near zero, let the three teams be the visible core, and grow the demo back from a smaller, stable unit. Draw the game first: each team's payoff from presenting depends on how many others attend and present; above a critical mass the room is worth two hours, below it presenting is a loss. That is a stag hunt with a threshold, settled in the risk-dominant equilibrium where staying away is safe; under random attendance, a large group and no channel for commitment, that is the predicted default (ledger #2) [E for the model and the coordination lab].\n\nt04's rule: IF you can create correlation THEN do the cheap things first, in order: lower the cost of being the lone cooperator, have a leader publicly name the target, take public opt-in pledges, grow from a small core with a visible success record, keep neighbourhoods small and stable while the norm is young. So: demos become five-minute unrehearsed screen-shares, so presenting to ten people costs nothing [E for the model; H that preparation is the binding cost]. Nadia names the target, \"five teams by end of month\" (`06`, a leader naming the target selects the efficient equilibrium) [E]. A public sign-up for four Fridays is the pledge [E for cheap talk in stag hunts; H here]. A five-team pod demo for a month, then merge: gradual growth from a core (Weber 2006, verified, single lab) [E in the lab; H here].\n\nTo Nadia: the mandate raises attendance without changing the cost of presenting, producing a room of laptops and confirming the presenters' belief that nobody is there for them; the lunch sweetens the joint payoff, the weakest lever. Whether the demo is worth fifteen teams' Friday hour is a value [V, Nadia's mandate the dissent]. Balancing measure: structure can hold the good equilibrium while beliefs stay fragile (`07`), so take a public commitment from the five before opening to fifteen.\n\nSwitch signal: watch the lone-cooperator payoff directly; if presenting teams are visibly worse off than absent ones after the format change, shrink the pods again; if the adopting fraction rises past the point where switching pays, the levers are working. Register entry [H]: \"at least five teams present unprompted on four consecutive Fridays within six weeks of the five-minute format.\"","novice_error":"Mandate attendance and cater lunch, because the demo \"worked when everyone came\" and a full room looks like the January state. The room was never the problem; the belief that the room would be there was, and a mandated audience does not restore it. The mirror is Ravi's patience, which waits for a decayed practice to recover from an equilibrium it will not leave on its own.","sources":["05-micromotives-and-macrobehavior","06-behavioral-game-theory","07-stag-hunt"]},{"id":"k12","title":"ADRs stuck at two teams for a year","scenario":"Twelve months ago the architecture group at a 90-engineer company adopted architecture decision records: a short document per significant decision, kept in the repository. Two of nine teams, Platform and Data, write one for every decision and read each other's. The other seven \"tried it once.\" A count of the last quarter: Platform 14 ADRs, Data 11, the rest 3 in total. Engineers on the seven say the records are not worth writing because nobody on their side reads them, and not worth reading because nobody on their side writes them.\n\nNoor, a staff engineer, proposes adding \"ADR written\" to the company-wide definition of done, checked at sprint review. The CTO prefers an \"ADR champion\" in every team, one person trained to evangelise. Platform's lead notes that the two adopting teams share a floor and review each other's code; the other seven are on other floors and mostly review within their own team.","tension":"t04","module":"m4","question":"Which proposal do you back, or what do you do instead, to get ADRs past two teams this quarter?","considerations":["Write the payoffs: what is the value of an ADR to a team when its neighbours write and read them, and when they do not? What is q here?","What is the Platform-Data pair, structurally, and why has the norm not spread from it?","Is ADR-writing a simple or a complex contagion? What does that say about one champion per team?","Which of the `10` levers lowers q, which seeds, and which builds bridges? Which applies to which team?","What does t06 predict about a rule added to the definition of done by the architecture group?"],"model_answer":"Decision: neither the mandate nor the champions; lower the cost of writing an ADR, seed inside the most connected resisting team, and build several parallel ties between Platform-Data and that team. Draw the game first: an ADR pays a team only when enough of the teams it works with also write and read them. That is a coordination game on a network; a node switches when its fraction of adopting neighbours exceeds q = b/(a+b), a theorem in `10`, and seven teams sit below q in clusters dense enough to block a norm from outside, while the Platform-Data cluster protects it inside (ledger #3) [E for the theorem; H for the actual q].\n\nt04's rule applies, IF you can create correlation THEN do the cheap things first, with t09's structural levers. Lower q: a one-page template in every repository, an ADR auto-linked from any PR touching a listed directory (`10`) [E in the model; H for size]. Seed inside: the team among the seven that ships most against Platform gets two Platform engineers pair-reviewing with it for a quarter, writing ADRs jointly; a cluster blocks only while none of its members has switched [E, theorem]. Widen the bridge: ADR-writing is a costly behaviour, a complex contagion needing several adopting neighbours; it does not cross one weak tie (ledger #34) [E for the direction]. The CTO's single champion per team is one weak tie: information crosses, behaviour does not.\n\nTo Noor: a definition-of-done rule imposed by the architecture group on seven teams gets compliance while checked and a two-line ADR at sprint review (t06) [E for the pattern; H here]; hold it in reserve. Balancing measure: do not scatter the Platform-Data pocket to evangelise, the t09 mistake; and publish the decisions where an ADR saved a reversal, so success is copied (ledger #36) [H]. Whether every decision needs a record is a value the seven teams should be asked, not told [V, Noor dissenting].\n\nSwitch signal (t13): if after q is lowered and the seed team adopts, the remaining six still do not, and their engineers can state the norm and believe nobody expects it of them, the residue is an expectations problem inside one floor, and the lever becomes publishing the gap. Register entry [H]: \"a third team writes at least eight ADRs in the quarter after seeding; a fourth follows within two quarters without a mandate.\"","novice_error":"Add it to the definition of done, because a checkbox reaches all nine teams at once and can be reported upward. It reaches them as someone else's rule, and it will be met with the thinnest document that passes the check. The mirror is the champion model, which sends one person into each dense cluster and expects a costly habit to cross a single tie.","sources":["05-micromotives-and-macrobehavior","10-networks-crowds-markets","09-governing-the-commons"]},{"id":"k13","title":"The seniors all ended up on Core","scenario":"Bramble has 48 engineers across six teams, twelve of them senior. Transfers between teams are self-selected. Over eighteen months, seven of the twelve seniors have moved onto one team, Core; two teams, Growth and Billing, now have no senior engineer at all. Nobody decided this. Asked why they moved, the seniors say the same thing: \"Core is where people review properly; on Growth I was the only one who cared about review, and I was slower for it.\"\n\nPaul, the engineering director, has read the transfer log and concluded the seniors are \"cliquey.\" His proposal for next quarter: forced reallocation, two seniors per team, effective in four weeks, with transfers frozen for a year. \"Spread the talent. Break up the club.\"\n\nCore's lead, Ana, says the forced move will cost her three of the seven and that they will leave the company rather than go back to being the only reviewer on a team of eight. Growth's lead, meanwhile, has had two incidents this quarter that a senior reviewer would have caught.","tension":"t09","module":"m4","question":"Is Paul's diagnosis right? What do you do about Growth and Billing without destroying what Core has?","considerations":["What does Schelling's model show about mild preferences plus interdependence, and what does it not show (ledger #17)?","Is the seniors' similarity influence or selection? What does the course assume by default?","What norm lives on Core, and what does a dense cluster do for it? What happens to a norm held by one person on a team of eight (t04)?","Which of t09's branches is the job here: holding a norm, or moving skills and information?","What is the difference between sending one senior and sending two, in threshold terms?"],"model_answer":"Decision: reject the two-per-team reallocation; send seniors into Growth and Billing in pairs for a fixed term as visible demonstrators, and keep Core above the size that holds its review norm. Draw the situation first: each senior has a mild preference for peers who review at their level; with interdependence (you are slower if you are the only one who cares), mild preferences produce extreme sorting. Schelling's model shows exactly that, and that homogeneity is weak evidence of intolerance (ledger #17) [E for the model; H that it explains this case].\n\nt09's rule has two branches and thi
