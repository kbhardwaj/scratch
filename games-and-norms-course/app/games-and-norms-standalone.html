oes not reliably change behaviour). Change decision procedures instead: criteria fixed before candidates are seen, blind stages, structured comparison.\n\n**Loafing and diffusion.** Effort drops when contributions are pooled and unidentifiable (Latané, Williams and Harkins 1979; Karau and Williams 1993 meta-analysis). It shrinks when effort is identifiable, the task meaningful and the group small, and is weaker in collectivist cultures. The textbook's rule of thumb of working units of two to five people is a design recommendation, not a measured optimum: tag it [H]. Diffusion of responsibility is the same mechanism applied to action rather than effort: the more potential actors, the less any one acts.\n\n**Polarization.** Discussion pushes a group toward a more extreme version of its initial lean, through persuasive arguments (mostly on the side the group already favours) and social comparison (nobody wants to be less committed than the perceived norm). It is among the field's most robust effects and it cuts both ways: good for commitment, dangerous for judgment. Collect independent judgments before discussion, seed dissent, and have the leader speak last. The groupthink antidotes survive as a checklist even though the syndrome does not.\n\n**Obedience.** Milgram's participants mostly complied because they trusted the institution and had no graceful exit, not because they were cruel; obedience dropped sharply with a disobedient peer, a distant authority, or a proximate victim. The design lesson is exits, peers and legitimacy for refusal, installed early. Anonymity (deindividuation) loosens normative restraint, but the SIDE model adds that anonymity can *increase* conformity to whatever group identity is salient, which is why online communities with a strong shared identity can be more norm-abiding than named ones.\n\n**Bystander.** Latané and Darley's five steps (notice, interpret as an emergency, take responsibility, know how, act) are each engineerable: make problems unambiguous, assign named ownership, give a script, make the first move cheap. The effect is [E] only for ambiguous, low-risk situations; in dangerous emergencies someone almost always intervenes (Philpot and colleagues 2020), and the Kitty Genovese story is not to be told as fact."}],"worked_example":{"title":"Decision: a homogeneous eight-person hiring committee keeps making confident, extreme calls that later look wrong; the founder proposes \"implicit-bias training for everyone\"","steps":["Check the proposed fix against the replication rules. IAT-based training does not reliably change behaviour (Oswald and colleagues 2013; Forscher and colleagues 2019). Reject it as the main lever, and record the rejection in the brief with the reason so it is not proposed again.","Name the robust mechanisms in play. Group polarization: deliberation pushes a homogeneous group toward a more extreme version of its lean. Informational conformity: early confident speakers become the group's evidence. Self-censorship under a directive chair. None of these needs bias to produce confident wrong calls; a committee of saints with the same background would produce them.","Design against each. Independent written judgments collected before any discussion (removes the persuasive-arguments channel). Speaking order reversed so the most senior speaks last (removes the anchoring of informational conformity). A rotating assigned critic (manufactures the dissenter that collapses conformity). Criteria fixed and published before the candidate is seen (a structured procedure, which is where the evidence for reducing discrimination actually lives).","Add the injunctive channel. The chair states that dissent is expected and names the last time dissent changed a decision. That pairs the descriptive norm ('people here disagree in writing') with approval of it.","Resulting policy: 'No hiring discussion starts before every member's written score is in; the chair speaks last; one member per meeting is the assigned critic; criteria are published before the loop.'","Tag it. [E] for polarization, conformity and the effect of structured procedures. [H] for the magnitude of improvement in this committee. [V] that procedural fairness is worth the slower meeting. Prediction: within two hiring cycles, the spread of written scores before discussion is wider than the spread of the same members' stated views after discussion used to be, and at least one decision is reversed by the assigned critic."]},"hinge":[{"q":"A community manager wants to reduce rule-breaking posts and drafts a banner: \"Over a thousand posts broke the rules last month. Please do better.\" What does the social-psychology evidence predict?","options":["It works, because people respond to being told the facts and a concrete number makes the problem impossible to ignore.","It works on rule-breakers and backfires on everyone else, so the two effects roughly net out to no change.","It has no effect, because banners are ignored and a message nobody reads cannot change what anyone does.","It backfires for most users, because it advertises that rule-breaking is common and people follow the majority."],"answer":3,"diagnoses":["Information as the lever. The banner's content is an injunctive appeal, but its salient fact is a descriptive norm, and the descriptive channel is the one people follow.","A half-right reading of the Schultz boomerang. The boomerang was removed by adding an injunctive signal, not by hoping the two groups cancel; the fix is pairing the channels, not netting them.","'Situations do not matter.' The boomerang is a replicated effect at scale; banners that transmit a descriptive norm are not ignored, they are followed.","Correct. The descriptive norm ('a thousand people did this') contradicts the injunctive one, exactly as in the Petrified Forest sign. Show the prevalence of the wanted behaviour and pair it with approval; never publish the share who misbehave."]},{"q":"After a bad quarter, a team's retrospective concludes that two named people are unreliable. Which correction should the facilitator apply first?","options":["Accept the diagnosis, because colleagues who work beside someone daily know their reliability better than a facilitator.","Reject the diagnosis outright, because situations determine behaviour and two people cannot be the cause.","Ask whether workload, information and ambiguity were visible to the people making the attribution.","Run a personality assessment, because a validated instrument settles a dispute that anecdotes from a bad quarter cannot."],"answer":2,"diagnoses":["Familiarity as a cure for the attribution error. Colleagues are observers, and the assigned-essay and quiz-show studies show the error survives even when the constraint is visible to the observer; knowing someone well does not tell you their workload last quarter.","'People are infinitely malleable.' Effect sizes are moderate; the point is that situations are underestimated, not all-powerful. The correction is a check, not a veto.","Correct. The fundamental attribution error is the master theme: observers see disposition even when constraints are obvious. Diagnose situationally first; you may still conclude a person is the problem, but not before the situational hypothesis has been checked.","A dispositional model of group failure with better instruments. It still skips the situation, and it will find something, because assessments always do."]},{"q":"Which of these levers has the evidence to be tagged [E] in a brief?","options":["Small, voluntary, public commitments before a behaviour change, with the magnitude in this team tagged [H].","Twenty-minute power-posing sessions before difficult negotiations, since the hormonal effect was measured directly.","Eyes printed on the honour-system snack box, since the watching-eyes effect is a cheap and famous field result.","Diagnosing \"groupthink\" and prescribing a cohesion-reduction offsite, since the syndrome has decades of case studies."],"answer":0,"diagnoses":["Correct. Induced-compliance and effort-justification dissonance replicate at moderate size in Western samples; small, freely chosen, public commitments produce belief where heavy incentives produce compliance. The direction is [E]; the magnitude in any particular team, and in interdependent-self cultures, is [H] and is tested locally.","Power posing as real. Ranehill and colleagues 2015 (N = 200, blinded) found the feeling of power and no hormonal or behavioural effect; the felt-power result is real and trivial.","The watching-eyes effect, which has mostly failed to replicate. Use real identifiability instead: a named owner and visible contributions.","Groupthink as a syndrome. The mechanisms (self-censorship, pressure on dissenters) are real and the antidotes are sensible; the package is unsupported, and cohesion is not the cause, so reducing it is not the fix."]},{"q":"A remote community is worried about a member's safety after alarming posts; forty people saw them and nobody acted. Which reading of the bystander literature is correct?","options":["Crowds make people passive, so the fix is to break the community into groups small enough that people notice each other.","The effect is robust in ambiguous, low-risk cases and each step can be engineered: name an owner, give a script.","In real emergencies someone intervenes, so forty silent viewers means the posts were not read as an emergency.","Make sure such posts are seen by more people, so that among a larger audience someone is bound to act."],"answer":1,"diagnoses":["'Crowds make people passive' and the Genovese story taken as fact. The effect is a sequence of five specific failures, each of which can be fixed without shrinking the community.","Correct. Bystander inaction in ambiguous, low-risk settings is [E]; the fix is to make the problem unambiguous, name an owner, give people a script, and make the first move cheap.","An over-correction from the CCTV studies of real fights. The ambiguous online case is exactly where the effect is strongest, because interpretation and responsibility are both diffuse.","'More bystanders means more help.' Diffusion of responsibility runs the other way: the more people who saw it, the less any one of them feels responsible. The fix is a named owner, not a larger audience."]}],"brief_prompt":"Add to the brief (section s4, 'situational audit and folk-psychology check'): for each failure named in v0, the situational alternative to the dispositional story (workload, ambiguity, visibility, ownership, deliberation design); the group's current descriptive and injunctive signals for the target behaviour and whether they agree; a list of any levers in v0 that appear on the failed-replication list, struck through with the reason. Tag each. Prediction: which one structural change (identifiable effort, named ownership, speaking order) will move the metric you care about, and by roughly how much in words (small, moderate).","deeper":["books/03-social-psychology.md#Ch 3 — The Social Self","books/03-social-psychology.md#Ch 8 — Persuasion","books/03-social-psychology.md#Ch 10 (6e) / Ch 11 (5e) — Stereotyping, Prejudice, and Discrimination","books/03-social-psychology.md#Ch 13 — Aggression","books/03-social-psychology.md#Culture (cross-cutting theme, not a chapter)"]},{"id":"m3","num":3,"title":"The formal toolkit: draw the game before arguing about it","level":"Mechanisms","minutes":100,"sources":["04-games-of-strategy","10-networks-crowds-markets"],"hook":"Two teams both say they want a shared tooling standard and both refuse to move first. A manager offers a bonus for adoption; nothing changes. What shape is this game, and why did more money do nothing?","attempt":{"prompt":"A volunteer community needs eight people to run its monthly event. Everyone wants the event; nobody wants to be one of the eight. Attendance at the organising call has fallen for three months.\n\nWrite the game: who the players are, what each can do, what each gets in the four combinations (I volunteer / I do not, given enough others do / do not). Then name the cheapest fix.","minutes":12},"objectives":["Write down a group interaction as a game (players, strategies as contingent plans, payoffs as the players see them, order, information) and classify it as PD, stag hunt, chicken, battle of the sexes or pure coordination using the one diagnostic question: does a member gain by defecting when everyone else cooperates?","Explain Nash equilibrium as a stability test, not a prediction or an endorsement, and say what the folk theorem does and does not give.","Design a credible sanction, a costly signal or a screening menu, and say why each works only under a stated condition."],"ideas":[{"title":"Draw the matrix first and classify the shape; the shapes need different fixes","tag":"E","body":"*Hold this one in memory.*\n\nA game is any situation where outcomes depend on choices by two or more decision-makers who are aware of each other. To write one down you need five things: the players; their strategies, which are complete contingent plans rather than single moves; the payoffs, as the players themselves rank the outcomes (ordinal is usually enough, and fairness or spite may be inside them); the order of moves; and what each player knows when they move. Most disputes about \"why people won't cooperate\" dissolve once these five are written down, because the disputants turn out to have been describing different games.\n\nThe canonical two-player shapes, in the textbook's own examples. The **prisoners' dilemma**: each player has a dominant strategy (Confess) that is best whatever the other does, and the unique equilibrium is worse for both than mutual cooperation. In the book's matrix, years in prison: both confess 10 and 10; one confesses and the other denies, 1 and 25; both deny, 3 and 3. Confess dominates Deny for each, so the stable outcome is 10 and 10. The **stag hunt** or assurance game: two equilibria, one better for everyone but riskier, because it pays only if the other also chooses it. **Chicken**: each prefers that the other yield; two equilibria, each favouring a different player; the disaster is both refusing. **Battle of the sexes**: both want to coordinate but disagree on which equilibrium. **Pure coordination**: both want to match and do not care which way; a focal point decides.\n\nThese shapes are formally distinct and need different fixes. A PD needs changed payoffs, repetition with observability, or credible sanctions. A stag hunt needs assurance: visible pledges, thresholds, matching. Chicken needs assignment, rotation or a commitment. Battle of the sexes needs a fair tie-break. Coordination needs a focal point. Treating a stag hunt as a PD produces heavy enforcement where cheap reassurance would do; treating a PD as coordination produces communication that decays. The one diagnostic question that separates the two most common cases is: **does a member gain by defecting when everyone else cooperates?** If yes, it is PD-shaped and needs payoffs, repetition or sanctions. If no, it is a stag hunt and needs assurance. This question is the single most used skill in the brief.\n\nFor many players, the collective-action chapter draws two curves: the payoff to a participant and the payoff to a shirker, each as a function of how many others participate. Three shapes again: PD (shirking dominates everywhere; nobody contributes), chicken (someone must act; each hopes another will), assurance (I contribute if enough others do; two equilibria). The equilibrium number of contributors is where the curves cross, and the social optimum is generally higher; the gap is the externality each contributor confers on others without counting it. The book's herders example (illustrative arithmetic): each cow yields its owner 10 and cuts every other cow's yield by 1; adding always pays privately, and the pasture is overgrazed. A norm that is internalised shifts the participant curve up and moves the crossing; that is what Modules 7 and 8 add.\n\nThe classification test is [E]: the distinction is formal. Which shape your group's interaction has is [H] until you have written the payoffs as the members see them and checked the defection question with them."},{"title":"Nash equilibrium is a stability test, not a prediction and not an endorsement","tag":"E","body":"*Hold this one in memory.*\n\nA Nash equilibrium is a profile of strategies where no player gains by switching alone. The best-response method finds them: in each row mark the column player's best cell, in each column mark the row player's best cell, and the doubly marked cells are equilibria. Nash proved every finite game has at least one once players may randomise. That is what the concept is. Here is what it is not, in the three ways that matter for a brief.\n\n**Not a prediction.** With multiple equilibria, which is the normal case, the theory alone does not say which is played. Focal points fill the gap: equilibria that are salient by convention or label. And even with a unique equilibrium, first-contact play is often elsewhere. The book's own \"Discussion and Evidence\" sections, which readers skip, report that in the two-thirds-of-the-average guessing game the equilibrium is zero and people guess roughly 20 to 35 (background figure); that in the centipede game rollback predicts immediate defection and people cooperate for several rounds; and that ultimatum responders reject low offers the theory says they should accept. Module 5 gives the evidence in depth. For now: treat the equilibrium as a hypothesis about experienced behaviour, expect first-round behaviour to be governed by norms, fairness and one or two steps of reasoning, and expect a group's steady state to depend on its early rounds.\n\n**Not an endorsement.** Mutual defection in a PD is an equilibrium because it is stable, not because anyone wants it. A team where everyone under-invests in shared tooling and nobody can improve their lot by investing alone is at an equilibrium, and a manager who says \"so this is what they want\" has confused stability with preference. The state may be one of several, and history picked it. Schelling's version in Module 4: equilibrium is a descriptive term, not a compliment.\n\n**Not about selfishness.** Rationality in this book means consistent pursuit of whatever your payoffs contain. Fairness, spite and concern for the group are allowed in; the framework neither assumes them away nor tells you how to fill them in. So \"game theory proves rational people cannot cooperate\" is wrong on both ends: it shows cooperation is not an equilibrium of a one-shot PD, and also that it is one in indefinitely repeated PDs with patience and observability, in assurance games, and under credible sanctions or norms. Never contrast \"rational\" with \"fair\" or \"cooperative\" in your brief; the course's later books use the word the same way.\n\nTwo more tools from the same part of the book. **Rollback** for sequential games: draw the tree, start at the last decisions, keep each player's best branch, work backward. The surviving path is the equilibrium, and the off-path plans, what a player *would* do at nodes never reached, are what make earlier choices rational. Rollback disciplines wishful thinking: \"if we do X, will they really respond as we hope, given *their* payoffs?\" **Subgame perfection**: an equilibrium that is Nash in every subgame, which rules out incredible threats and is the formal basis of the next idea. And the design variable it exposes: who observes what and when. Making a simultaneous game sequential can create a first-mover advantage; hiding moves can remove one. Sealed versus open pledges, synchronous versus asynchronous decisions, are choices about the game's information structure, not just about convenience."},{"title":"Repetition permits cooperation as one equilibrium among many; selection and detection are separate problems","tag":"E","body":"The book's chapter on the prisoners' dilemma gives three families of solutions: repetition, penalties or rewards that change the payoffs, and leadership, where one large player gains enough to cooperate unilaterally. Repetition is the one people misread.\n\nWith an indefinite horizon and enough weight on the future, cooperation is sustainable as an equilibrium through contingent strategies. Under a grim trigger (\"cooperate until you defect, then defect forever\"), the one-period gain from cheating is outweighed by the discounted stream of lost cooperation. The book's worked example, illustrative arithmetic: per-round payoffs are 3 each for mutual cooperation, 1 each for mutual defection, 5 for defecting on a cooperator. Cheating once yields 5 then 1 forever; cooperating yields 3 forever. With discount factor δ, cooperation holds if 3/(1−δ) is at least 5 + δ/(1−δ), which gives δ of at least one half: next period must be worth at least half of this one, or the game must continue with at least that probability. Raise the temptation from 5 to 8 and the required δ rises to five sevenths. The threshold is a property of the specific payoffs, never a general law.\n\nThree things the theorem does not give. First, **selection**. The folk theorem is an existence result: cooperation *can* be an equilibrium, alongside permanent defection and much else. Repetition permits cooperation; it does not select it. A founder who says \"our engineers will keep working together for years, so repeated-game logic guarantees cooperation\" has mistaken permission for guarantee; the group must also coordinate on the cooperative equilibrium, which is the problem the Order modules address. Second, **detection**. The rescue needs defection to be observed within a round or two, and with more than two players the question of who punishes whom is hard; Ostrom's monitoring principles are the empirical answer. Third, **the horizon**. With a known finite end, rollback unravels cooperation from the last round backward; announced end dates are corrosive, and indefinite, blurred horizons are the design.\n\nOn strategies: tit-for-tat won Axelrod's tournaments by being nice, retaliatory, forgiving and clear, but it is fragile under noise. Two tit-for-tat players who misread one move feud forever, and generous variants do better. The course's rule is to recommend the *properties*, nice, retaliatory, forgiving, clear, and never tit-for-tat as a rule.\n\nThe evidence: one-shot lab PDs show cooperation of 30 to 60% (background), rising with communication, sequential moves and smaller groups; contributions decay across rounds in finite public-goods games and recover when punishment is allowed. Cooperation in repeated PDs rises with the continuation probability. The design summary: lengthen and blur the shadow of the future (no announced endpoints, stable membership), make defection observable fast, keep groups small enough for reputations to travel, and make punishments proportionate and forgiving. Where repetition is impossible, change the payoffs directly or find a leader who gains enough to carry the cost. And treat the predicted equilibrium as a floor, not a forecast: groups usually start more cooperative than the PD predicts, and the job is often to protect initial cooperation from decay rather than to create it."},{"title":"Credibility is manufactured, usually by limiting yourself: make sanctions cheap and subgame-perfect","tag":"E","body":"A strategic move is an action taken before the main game to change what others expect. Following Schelling, there are three kinds: a **commitment** (unconditional), a **threat** (conditional punishment) and a **promise** (conditional reward). Each works only if it is credible: the other side must believe you would carry it out when the moment comes. Since executing a threat usually hurts the threatener too, credibility has to be manufactured.\n\nThe book's entry game shows the problem and the fix. A potential entrant chooses to enter or stay out; if it enters, the incumbent chooses to fight or accommodate. Payoffs (entrant, incumbent), illustrative: stay out gives (0, 10); enter and accommodate gives (3, 5); enter and fight gives (−2, 2). At the incumbent's node, accommodate (5) beats fight (2), so the entrant foresees this and enters; \"we'll fight\" is not credible. Now suppose the incumbent signs a contract paying a penalty of 4 to a third party if it ever accommodates. Fight (2) now beats accommodate (5 − 4 = 1); the entrant stays out; the incumbent earns 10 and never pays. The threat became credible by worsening the threatener's own alternative. The paradox is general: reducing your freedom of action can increase your power. The devices are contracts, reputation, cutting off your own options, delegating to an agent with different incentives, breaking a big move into small steps, and automatic mechanisms.\n\nTwo rules of thumb the book draws. Threats should be no bigger than needed, because oversized threats are less credible: if executing it would be very costly to you, the other side expects you not to. Promises must cost less to keep than the reputation lost by breaking them. And a lab note that anticipates Module 5: people carry out costly threats and keep costly promises more than self-interest predicts, which is part of why cheap talk sometimes works.\n\nThis is the theory of credible rules, and it is the formal reason behind Ostrom's field findings in Module 8. A norm with a penalty nobody would actually impose is not a norm. Immediate bans of established members, large fines, public expulsions: these are threats whose execution costs the enforcer a fight, a contributor and a reputation, so at the moment of enforcement the enforcer prefers to ignore the violation, violators know it, and the rule is decorative. The fix is not a bigger threat. It is to arrange the enforcer's payoff at the moment of enforcement so that enforcing is what they prefer: small, cheap, fast first responses that cost the enforcer almost nothing; rotating or delegated monitors who are not choosing alone; escalation that is scheduled rather than decided; and a cheap route back to good standing, so the sanction is forgiving and clear.\n\nA related tool from the mixed-strategy chapter: unpredictability is a strategy. To deter cheating you need probability of detection times penalty to be at least the gain, not full surveillance. Random audits with a proportionate penalty deter as well as monitoring everything, and the indifference property warns that raising *your* payoff to enforcing does not change *their* cheating rate; it changes your enforcement rate.\n\nBrinkmanship, from the applications chapters, is the probabilistic version: instead of a certain punishment too costly to be credible, create a controlled risk that events get out of hand. For internal disputes it implies designing off-ramps and graduated steps so parties can escalate a little without catastrophe. [E] for the logic throughout; [H] for whether a particular ladder fits your group."},{"title":"Information asymmetry is solved by costly signals and self-selecting menus; equal cost reveals nothing","tag":"E","body":"Every heterogeneous group has to learn who is committed and competent, and the people who know are the people with a reason to misreport. This is asymmetric information: one side knows its type, quality or intentions and the other does not. Two workhorse mechanisms address it. **Signalling**: the informed party takes a costly action that reveals its type. **Screening**: the uninformed party designs a menu of choices that makes types reveal themselves.\n\nThe core result is that a signal is credible only when it is *too costly to fake*: its cost must differ across types, so that only the type you want finds it worthwhile. The book's example, illustrative arithmetic: an employer will pay 100 for a high-ability worker and 50 for a low-ability one but cannot tell them apart. A certification costs the high type 20 in effort and the low type 60. If the employer pays 100 only to certified workers, the high type certifies (100 − 20 = 80, better than 50) and the low type does not (100 − 60 = 40, worse than 50). Types separate, and the certification works even if it teaches nothing. At a cost of 40 for both types, both certify and the signal reveals nothing. That is the difference between a **separating** equilibrium (types act differently and are identified) and a **pooling** one (all act alike). Cheap talk, a statement of commitment on a form, informs only when interests are already aligned.\n\nTwo errors follow directly. \"Charge everyone the same joining fee\" pools types: it screens for willingness to pay, not for commitment, because the cost is the same for the tourist and the lifer. \"Make the joining task as hard as possible\" confuses size with asymmetry: a task that is brutal for everyone screens out the committed too, and is not a better signal. The design question is always: is this cheaper for the type I want than for the type I do not? A multi-week contribution before privileges unlock is cheap for someone who intends to stay and costly for someone who does not. Sustained participation, sunk contributions and time-consuming rituals are the formal version of Henrich's credibility-enhancing displays and of Ostrom's boundary rules.\n\nThe chapter also names the failure modes of markets under hidden information. **Adverse selection** (Akerlof's lemons): when buyers cannot tell quality, they pay an average price, the best sellers exit, the average falls, more exit. Schelling in Module 4 applies the same unravelling to review pools and volunteer rotas whose best members opt out. **Moral hazard**: hidden action rather than hidden type, which is the problem incentive design addresses.\n\nIncentive design, from the applications part of the book, gives the principal-agent version. When effort is unobservable and only noisy output can be seen, you pay on output and thereby shift risk to a risk-averse agent who must be compensated; strong incentives are expensive when output is noisy. With several tasks, incentives on the measurable task crowd out the unmeasured one, so pay on what you can measure only if it tracks what you want. Where output is noisy and members risk-averse, norm- and reputation-based motivation is cheaper, and explicit incentives can crowd it out, as Module 2's overjustification result warned.\n\n[E] for the theory. [H] that any given ritual or onboarding task actually has the cost asymmetry you assume; check it by asking who drops out."}],"worked_example":{"title":"Decision: should a community's code-of-conduct violation be met by an immediate ban?","steps":["Write the enforcement game as a sequential move: the violator acts, then the moderator chooses sanction or ignore. Draw the tree; the question is what happens at the moderator's node.","Rollback. At the moderator's node, does sanctioning pay at the moment of enforcement? An immediate ban of an established member costs the moderator a public fight and possibly the member's contributions; ignoring costs little now. The ban threat is not subgame-perfect, so it is not credible; violators know it, and the rule is a norm with a penalty nobody would impose.","Change the enforcer's payoff at the moment of enforcement rather than the size of the threat. A small, cheap, public first response (a visible templated note) costs the moderator almost nothing and is therefore credible. Escalation is scheduled and delegated so the moderator is not choosing it alone, which removes the personal cost that made the big threat empty.","Check the promise side. Is there a cheap way for the violator to return to good standing? A sanction with no route back is neither forgiving nor clear, and it turns every first offence into a fight over identity rather than behaviour.","Resulting policy: 'First violation: a public, templated note within a day, applied by whoever is on rotation. Second: a fixed one-week restriction. Third: a review by three members. Bans are never a first response.'","Tag it. [E] that oversized threats are less credible and that cheap sanctions get applied (the strategic-moves logic; the field version is Ostrom's graduated sanctions in Module 8). [H] that this specific ladder fits this community. [V] that reversibility is worth the delay. Prediction: within a quarter, the share of first violations that receive any response rises from near zero to near all, and repeat violations by the same member fall."]},"hinge":[{"q":"A team's shared on-call rota is decaying. A skipped shift saves the skipper a night; if the others cover, the skipper loses nothing; if nobody covers, the pager goes to the manager and everyone is chewed out equally. Run the diagnostic question yourself. What follows?","options":["It is a stag hunt, so build assurance through public pledges that each person will take their own shifts.","It is a coordination problem, so a clearer published schedule will fix it by removing confusion about turns.","It is PD-shaped, so the fix set is payoff change, repetition with observability, or credible sanctions.","It is chicken, so rotate the burden so that nobody is the one who has to move first in a given week."],"answer":2,"diagnoses":["Assurance as the default fix for any cooperation problem. The diagnostic question was answered 'yes', which is exactly the case assurance cannot fix: pledges from people who gain by breaking them decay.","'Every group problem is coordination that communication fixes.' A schedule tells people what to do; it does not remove the gain from not doing it.","Correct. When a member gains by defecting while everyone else cooperates, the shape is a dilemma, and only payoffs, observable repetition or credible sanctions change the equilibrium.","Partly right, wrong level. Rotation is already the rule; the question is enforcement of the rota, not assignment of shifts, and chicken describes who moves first, not whether anyone honours the move."]},{"q":"A founder says \"our engineers will keep working together for years, so the repeated-game logic guarantees cooperation.\" Which correction is right?","options":["Repetition permits cooperation as one equilibrium among many; the group must also select it and catch defection.","Repetition guarantees cooperation once the team has been together long enough for reputations to form.","Repetition works only if the team plays tit-for-tat, since that was the strategy that won both of Axelrod's tournaments.","Repetition works if the discount factor is above one half, which is the threshold the textbook derives."],"answer":0,"diagnoses":["Correct. The folk theorem is an existence result. Selection of the cooperative equilibrium and fast detection of defection are separate problems that repetition does not solve on its own.","Reputation as automatic selection. Reputation makes defection costly only if defection is observed and someone is willing to respond; the founder's claim skips both, and a long shared history supplies neither by itself.","Tit-for-tat as optimal. It won Axelrod's tournaments, but it feuds under noise; the properties (nice, retaliatory, forgiving, clear) matter, not the rule.","Quoting the book's illustrative threshold as a general law. One half comes from payoffs of 3, 1 and 5; raise the temptation to 8 and the threshold rises to five sevenths. The number depends on the temptation and the cooperative payoff."]},{"q":"A community wants to tell committed members from tourists before granting privileges. Which proposal works, and why?","options":["Ask applicants to state their commitment in a form, since people who write down a promise tend to keep it.","Charge everyone the same joining fee, since a price at the door is a cost that a tourist will not pay.","Make the joining task as hard as possible for everyone, since a bigger cost makes a stronger signal.","Require a multi-week task that is cheap for people who intend to stay and costly for people who do not."],"answer":3,"diagnoses":["Cheap talk as a signal. A statement costs the tourist nothing, so it is informative only when interests are already aligned, which is precisely when you do not need it.","Cost as the signal regardless of asymmetry. Equal cost for all types pools them: it screens for willingness to pay, not for commitment, and reveals nothing.","'Bigger cost equals better signal.' A task that is brutal for everyone also screens out the type you want; the signal's power comes from the difference in cost between types, not its size.","Correct. A separating equilibrium needs a cost that differs by type; a task that is cheap for the committed and expensive for the uncommitted makes types reveal themselves."]},{"q":"A team reaches a state where everyone under-invests in shared tooling and nobody can improve their lot by investing alone. A manager says \"so this is what they want.\" What does the textbook say?","options":["Correct: the state reveals preference, since nobody deviates and so nobody can want anything else.","Wrong: the state is stable, not preferred; it may be one of several equilibria and history picked it.","Wrong: rational people would not sit in a bad equilibrium, because a better outcome exists that all prefer.","Correct, but only because the engineers are selfish; with other-regarding payoffs it would not be stable."],"answer":1,"diagnoses":["Equilibrium as endorsement. Mutual defection is an equilibrium because it is stable, not because anyone wants it.","Correct. Nash equilibrium is a stability condition; with multiple equilibria the one you observe was chosen by history, and Schelling's version in the next module says the same: equilibrium is a descriptive term, not a compliment.","'Game theory proves rational people cannot cooperate', inverted. Rationality means consistent preferences, and mutual under-investment is exactly what consistent preferences produce in a one-shot dilemma.","Rationality equals selfishness. The framework allows fairness and group concern inside the payoffs; the under-investment is stable whatever the engineers care about, as long as nobody gains by investing alone."]},{"q":"Two departments each keep their own incident template. Each would prefer the shared one if the other used it too, but a department that switches alone eats a quarter of rework. What is the best-supported first lever?","options":["Visible conditional pledges or a threshold (\"we switch when both sign\"), so nobody fears moving alone.","Raise the joint payoff for adoption, so that the shared template is worth enough to make each side move.","A penalty for the department that fails to adopt, so that staying with the old template stops paying.","Let the two departments keep negotiating until they agree, since reasoning will find the better outcome."],"answer":0,"diagnoses":["Correct. Assurance mechanisms (conditional pledges, thresholds, matching) reach the payoff-dominant equilibrium cheaply, because they remove the fear of being the only one who moved.","'Coordination failure is a payoff problem.' In a stag hunt the payoffs already favour cooperation; the failure is uncertainty about the other team, and sweetening the joint payoff is the weakest lever.","Treating a stag hunt as a PD. Enforcement where reassurance would do, and a penalty that the enforcer would not credibly apply against a whole team.","Expecting rationality to select the equilibrium. With multiple equilibria the theory is silent; multiplicity is resolved socially, by a focal point or a pledge, not by further reasoning."]}],"brief_prompt":"Add to the brief (section s2, 'diagnosis: the games being played'): for each of the group's two or three central interactions, a written matrix or two-curve sketch with payoffs as the members see them, the answer to the defection question, the shape, and the fix set that shape allows; one sanction or signal currently in use, checked for credibility (would the enforcer apply it at the moment of enforcement?) or separation (does its cost differ by type?). Tag each. Prediction: which interaction, if reclassified from PD to stag hunt or the reverse, changes the fix you proposed in v0.","deeper":["books/04-games-of-strategy.md#Part Two / Ch 5 — Simultaneous-Move Games: Continuous Strategies, Discussion, and Evidence","books/04-games-of-strategy.md#Part Two / Ch 7 — Simultaneous-Move Games with Mixed Strategies","books/04-games-of-strategy.md#Part Four / Ch 13 — Brinkmanship: The Cuban Missile Crisis","books/04-games-of-strategy.md#Part Four / Ch 14 — Incentive Design","books/04-games-of-strategy.md#Part Four / Ch 16 — Strategy and Voting","books/04-games-of-strategy.md#Part Four / Ch 17 — Bargaining"]},{"id":"m4","num":4,"title":"Micro to macro: thresholds, tipping, sorting","level":"Mechanisms","minutes":70,"sources":["05-micromotives-and-macrobehavior","10-networks-crowds-markets"],"hook":"Everyone on a team says they want the weekly cross-team demo to survive. Attendance falls from twelve to seven to three and it dies. Nobody changed their mind. What killed it?","attempt":{"prompt":"Adoption of architecture decision records in an engineering org has sat at fifteen percent for a year despite two reminders and a template (a scenario number).\n\nDraw, for a person deciding whether to write one, the payoff of writing and the payoff of not writing as the share of others who write goes from none to all. Say which of three shapes you have drawn and what each implies.","minutes":12},"objectives":["Separate micromotives from macrobehaviour and refuse to infer intentions from outcomes or outcomes from intentions.","Draw Schelling's two-curve binary-choice diagram for a target behaviour and read off whether it is a multi-person PD (needs rules), a coordination game with a tipping point (needs seeding above critical mass) or a stable interior mix (leave alone).","State precisely what the checkerboard model shows and does not show, and define a tipping point as an unstable equilibrium in a threshold distribution."],"ideas":[{"title":"Macro is not micro summed: contingent behaviour produces equilibria nobody chose","tag":"E","body":"*Hold this one in memory.*\n\nSchelling's central move is to separate **micromotives**, what individuals prefer and intend, from **macrobehaviour**, the pattern a population produces, and to insist that the second cannot be read off the first. His opening image is a lecture hall in which everyone sits at the back: no one intended an empty front, but it follows from each person's mild preference not to sit in front of others. Rubbernecking traffic: each driver's few seconds of slowing cost the queue behind minutes. The dying seminar: attendance depends on expected attendance, so a slight drop collapses the whole thing, and nobody changed their mind about the seminar.\n\nThe interesting cases are those where behaviour is **contingent**: how I act depends on how many others act. That is the precondition for every model in the book. When behaviour is not contingent, simple aggregation works and there are no surprises. When it is, the aggregate feeds back into each individual decision, and three things follow. Populations settle at equilibria that may be nobody's preference. Several equilibria may exist. And history, not preference, picks which one the group is in. Schelling's two warnings recur throughout: *equilibrium* is a descriptive term, not a compliment, since a stable state can be miserable; and the observed equilibrium is a historical accident, not a revelation of what people want.\n\nTwo failure modes for the naive observer, which are the module's first discipline. **Inferring intentions from outcomes**: senior engineers have clustered on one team, so managers must be sorting by seniority; the front rows are empty, so people must be shy. **Inferring outcomes from intentions**: everyone says they want mixed teams, so mixed teams will happen. Both skip the interaction structure. The social-psychology module said \"diagnose situationally before dispositionally\"; this module says \"model the interaction before diagnosing at all\", and adds a step before even that.\n\nThat step is arithmetic. Some aggregate patterns are forced by accounting identities, not by anyone's motives. If there are a hundred chairs and a hundred and ten people, ten stand regardless of skill or effort. Every overtaking driver is someone else's overtaken driver. The average class size *experienced by students* is larger than the average class size *computed over classes*, because big classes contain more students to experience them (the same logic gives the friendship paradox: your friends have more friends than you do). A closed-system constraint means a policy that moves a quantity for one group must move it oppositely somewhere else if the total is fixed. Before designing an incentive, check whether the outcome is reachable at all: an \"everyone gets a mentor\" programme with ten senior people and sixty juniors will not produce one-to-one pairs whatever the norm. Many \"cultural\" complaints are arithmetic.\n\nSchelling also groups recurring dynamics into families so you can recognise a structure and borrow its known behaviour. **Lemons and unravelling**: when buyers cannot tell quality they pay an average price, the best sellers exit, the average falls, more exit; the equilibrium can be no market. A review pool or on-call rota losing its most reliable members is this. **Self-fulfilling prophecies**: \"this meeting is pointless so I won't prepare\". **Thermostats**: feedback with a lag produces overshoot and oscillation, as in a team that over-hires after a crunch and then over-cuts. **The commons**: many small users, each capturing benefits privately and spreading costs. Once recognised, the known dynamics apply.\n\n[E] that these mechanisms exist; the logic is uncontested. [H] that any one of them explains your case; the book has almost no data, and that is what it is for."},{"title":"The two-curve diagram is the diagnostic: MPD, tipping, or stable mix","tag":"E","body":"*Hold this one in memory.*\n\nEveryone in a population chooses L or R. On the horizontal axis put the number, or fraction, of people choosing L, from none to all. Draw two curves: the **L-curve** gives the payoff to someone who chooses L when that many others have chosen L; the **R-curve** gives the payoff to someone who chooses R at the same population state. Each individual compares the two curves at the current state and picks whichever is higher. The population moves toward states where nobody wants to switch. Three shapes cover most of what a designer meets.\n\n**The multi-person prisoner's dilemma (MPD).** The R-curve lies above the L-curve *everywhere*, but the L-curve at \"everyone chooses L\" is higher than the R-curve at \"everyone chooses R\". R dominates for each person, all-R is the unique equilibrium, and all-L would be better for everyone. Hockey helmets are Schelling's case: around 1969 most NHL players privately wanted helmets but refused to wear one, because a lone wearer looked timid; each would wear one if all did. A collective rule gives everyone what no one would choose alone. The commons, arms races, attending a standup where skipping always pays a little: only a rule, monitoring or a side payment moves an MPD. Communication does not.\n\n**Crossing curves, cooperation winning to the right.** R is above L when few choose L; L is above R when many do. Small numbers of L-choosers switch back to R; large numbers pull everyone to L. There are two stable corners and an unstable interior crossing, which is the **tipping point**; **critical mass** is the crossing. Driving side, daylight saving, a messaging platform, a documentation norm whose value depends on others reading and writing. The fix is seeding above critical mass and one visible switch, not enforcement.\n\n**Crossing curves the other way.** L is above R when few choose L, R is above L when many do. The interior crossing is *stable*: the population settles at a mixed state, and no one wants everyone to switch. Congestion fits: the more who take the highway, the better the side road becomes. If your fifteen percent adoption of decision records is this shape, because only some decisions warrant a record, then pushing for full adoption is a mistake.\n\nOne number comes out of the diagram. **k** is the smallest coalition such that k people choosing L together are each better off than at all-R: the minimum viable coalition, and the size of pilot you need. Whether a partial coalition is *stable* (its members do not defect) and *sufficient* (its choice pulls others in) depends on the curves' shapes, not on goodwill.\n\nThe diagram also separates two kinds of norm. A **self-enforcing convention** is an equilibrium where unilateral deviation hurts the deviator once the convention exists (driving on the left in a right-driving country); it needs a focal point, not a policeman. An MPD needs enforcement because deviation is individually profitable. Diagnosing which you face tells you whether you need a rule with teeth, a coordinated switch, or merely a default. Reserve enforcement budget for genuine MPDs, and expect a rule that fixes an MPD to be welcomed by people who would not have complied voluntarily; consult on the rule, not on voluntary adoption.\n\nMost \"culture\" interventions fail by treating an MPD as if it were coordination: they communicate, seed, and cheer, and the R-curve stays on top. [E] for the logic; [H] for the curve shapes in any real setting, which you estimate by asking people what they would do at different levels of others' participation."},{"title":"A tipping point is an unstable equilibrium in a threshold distribution; the scarce resource is low-threshold actors","tag":"E","body":"Schelling's definition of a tipping point is exact, and the course requires it: an **unstable equilibrium** separating basins of attraction, in a threshold distribution or an adoption curve. Below it, activity collapses; above it, it self-sustains. A small push has a disproportionate effect there, in either direction.\n\nThe threshold reading, which Granovetter formalised in 1978, is the most useful version. Each person has a threshold: how many others must do X before I do. Plot \"number who will do X given that n others do\" against n; where that curve crosses the 45-degree line you have an equilibrium, stable if it crosses from below and unstable if from above. A population's heterogeneity of thresholds decides whether a bandwagon can start. Schelling's own mini-example, constructed rather than measured: ten people attend a weekly demo if at least k others attend, with thresholds spread evenly from 0 to 9. Whatever the first week's turnout, it snowballs to all ten, because each attendee's presence tips the next threshold. Now remove the two people with thresholds 0 and 1. Nobody comes unless someone shows up \"irrationally\". One missing low-threshold actor flips the aggregate from everyone to no one. **A gap at the low end of the threshold distribution kills the cascade.**\n\nThis is why the influencer reading of tipping is wrong, and why the course marks it as a misconception rather than a simplification. The scarce resource is not charisma; it is people who will act when few others have. A colleague who proposes to spread a practice by recruiting \"the three most influential people\" has confused whom people copy (Henrich's prestige bias, which is real and decides where attention goes) with whether the threshold distribution has a gap. Prestige selects the model; the cascade still dies if there is nobody with a low threshold to be the second, third and fourth adopter. Find and protect your low-threshold people.\n\nThe network-effects chapter of the networks book gives the same object with prices. When a good's value to me rises with the number of others using it, aggregate demand has multiple equilibria: nobody, a low unstable level, and a high stable level. In the book's tiny model (illustrative numbers), consumers are ranked by intrinsic interest falling from one to zero, the value is intrinsic interest times the adoption share, and at a price of one fifth the self-consistent adoption levels are zero, about 0.28, and about 0.72. If thirty percent adopt, the marginal user values it above the price and more join; the process converges to the high point. If only a quarter adopt, the marginal value is below the price and adoption unravels to zero. The low interior point is the tipping point; plotted as equilibrium adoption against price the picture is a backwards Z, and near the tipping point a small price cut or a nudge in expectations produces a discontinuous jump.\n\nThe design consequences are the same in both notations. Diffuse encouragement across a whole population below the tipping point leaks away; a concentrated push in one subgroup can cross it locally. Make adoption visible so that perceived adoption tracks real adoption. Lower the threshold itself by cutting switching cost, which moves the tipping point down. And never half-launch: a launch below critical mass decays, and it poisons the next attempt through a self-defeating expectation (\"we tried that; nobody came\"). Launch above critical mass or not at all is [H] as a rule; the tipping logic is [E]. Module 9 puts this on a graph, where the fraction of *neighbours* replaces the fraction of the population."},{"title":"The checkerboard: mild preferences plus interdependence can produce extreme sorting, and that is all it shows","tag":"E","body":"Schelling's most famous model is the checkerboard. Two types of agents sit on a grid with some empty squares. Each looks at its immediate neighbours and is content if at least some fraction, say one third (an illustrative rule, not a measured preference), are of its own type. Discontented agents move to the nearest square that satisfies them. Start from a random mix and iterate. The board resolves into large homogeneous clusters far more segregated than any individual's rule required. Nobody insisted on a majority of own-type neighbours; everyone merely refused to be a small minority. A companion model, the bounded neighbourhood, gives each group a distribution of tolerances for the other group's share; in typical shapes the mixed equilibrium where the two tolerance schedules cross is unstable, and once composition passes it, departures feed on themselves. That is the origin of the ordinary phrase \"tipping point\".\n\nThe course requires you to state what the model shows and does not show in exactly this form. **It shows** that mild preferences plus interdependence *can* produce extreme sorting; that homogeneity is weak evidence of intolerance and strong evidence of interdependence; and that an integrated arrangement is typically not an equilibrium of the process even when most people would prefer it, because early departures change the environment for those who stay. **It does not show** that preferences are the main real-world cause of segregation (real segregation also involves discrimination, prices, lending, zoning and law, which Massey and Denton argue are the main drivers in the United States); that preferences are exogenous (they are shaped by the sorting they produce); or that the outcome is acceptable. Schelling himself is explicit that the model is a demonstration of possibility, not a measurement. \"The checkerboard proves segregation is caused by mild preferences, not discrimination\" is a misuse the book does not license.\n\nLater research fills in the evidence. The qualitative result is robust to grids, neighbourhood sizes and movement rules. Its fragility to the *shape* of preferences is disputed: Bruch and Mare (2006) argued that with smoother, survey-estimated preference functions segregation largely disappears, and Van de Rijt, Siegel and Macy (2009) replied that their simulations contained errors and segregation reappears; the debate is not closed. The strongest empirical support is Card, Mas and Rothstein (2008, verified), who used census tracts from 1970 to 2000 and found tipping-like flows in most US cities, with tipping points at roughly 5 to 20% minority share, higher in cities with more tolerant measured attitudes, and little accompanying discontinuity in house prices.\n\nTwo opposite over-readings follow. \"Attitudes are irrelevant because the outcome is structural\" is wrong: attitudes set the thresholds, and Card, Mas and Rothstein find higher tipping points where tolerance is higher, so attitude work moves the threshold without removing the dynamic. \"Sorting proves preferences caused it, so attitude work is the fix\" is wrong the other way: sufficiency is not cause.\n\nFor groups, the same logic runs on any attribute: senior engineers clustering on one team when no manager assigned by seniority; an all-male channel. Ordered attributes such as skill sort harder than categorical ones, because with asymmetric preferences (everyone wants to be the least experienced person in a slightly stronger group) there may be no stable mixed arrangement at all. What works in the model: lower the threshold (make minority status cheaper: cohort hires rather than token hires, visible allies), change the neighbourhood definition, and seed above critical mass. What fails: exhorting people whose preferences are already mild. And because sorting externalities have no natural owner, assign explicit responsibility for group composition; that is a [V]."},{"title":"Self-enforcing conventions need a focal point, not a policeman; reserve enforcement for genuine MPDs","tag":"H","body":"The cheapest institution there is costs nothing to run: a **self-enforcing convention**, an equilibrium in which unilateral deviation hurts the deviator once the convention exists. Driving on the right where everyone drives on the right needs no enforcer. Daylight saving is pure coordination: the value of any clock setting lies in matching others, and the only collective decision is the switch date, because a piecemeal transition is worse than either uniform state. The Nobel lecture that closes the 2006 edition reads the sixty-year non-use of nuclear weapons the same way: not a treaty but a convention that accumulated through repeated non-use, each decade raising the perceived cost of first use, so that the norm's age became part of its strength. New nuclear states that did not live through the convention's formation may not share it.\n\nThe design question this raises for any group is which of its norms are of this kind and which merely look like it. A code-formatting standard, once adopted, is self-enforcing: a lone deviator's code fails review and their diffs are noisy, so nobody needs to police it beyond making the standard focal. A norm of writing tests is usually not: skipping tests pays the skipper today whatever others do, which makes it an MPD needing a gate, a monitor or a side payment. Groups that confuse the two either spend enforcement budget on conventions that would hold on their own, or assume that a friendly nudge will hold an MPD, which it will not.\n\nThree practical corollaries. First, **publicise long-standing compliance rather than recent violations**; visible non-violation is what makes a convention self-reinforcing, and this is the same lever Module 2 taught as the descriptive norm, seen from the population side. Second, **when a rule does fix an MPD, expect it to be welcomed by people who would not have complied voluntarily**; the helmet case is exactly this, and it means you should consult members on the rule, not on whether they would adopt the behaviour without one. A team that adopts a welcomed rule and then discovers that several members only follow it because it is the rule has not found a problem; it has found the reason the rule was needed. Third, **positional versus absolute attributes** decide whether individual choice over a shared population's composition needs collective rules. Schelling's chapter on choosing children's genes makes the point in the extreme: traits that are positional (height, relative standing) create arms races in which every family choosing more leaves relative position unchanged and the absolute cost paid; traits that are absolute (freedom from disease) do not. Hiring for \"culture fit\", choosing who joins a community, competing for visible status by hours worked: where the good is positional, free individual choice is an arms race by default and the composition is a by-product with no owner.\n\nWhere this idea sits in the evidence: Schelling *shows* that mild micromotives can generate perverse macrobehaviour; he *argues*, more tentatively, that this is common and that policy should therefore target structure. The first is [E] as logic. The second, and every claim about which of your group's norms are conventions and which are MPDs, is [H] until you have drawn the curves and asked members what they would do if others stopped. The Order modules give the institutional detail for the MPD case; this module's job is to stop you spending it on the wrong norms."}],"worked_example":{"title":"Decision: how to launch a shared internal tool whose value to each user rises with the number of other users","steps":["Recognise a network-effect good. Adoption has a Z-shaped willingness curve with equilibria at zero, an unstable interior point and a high stable point. In the networks book's illustrative model, with intrinsic interest falling linearly and value proportional to adoption, a price of one fifth gives a tipping point near three in ten adopters and a stable high point near seven in ten. Illustrative numbers; the shape is what matters.","Therefore diffuse encouragement across the whole org leaks away if adoption sits below the tipping point, because each marginal user values the tool below its cost until enough others are on it. A concentrated push in one subgroup can cross the point locally, where the relevant 'others' are the subgroup.","Identify low-threshold people: those who will use the tool if almost nobody else does. Guarantee their presence at launch. The cascade dies at the low end of the threshold distribution, and the second and third adopters matter more than the most senior one.","Make adoption visible so that perceived adoption tracks real adoption, and do not announce a launch the subgroup cannot carry past the crossing. A half-launch below critical mass decays and creates a self-defeating expectation for the next try.","Lower the threshold itself. Reduce switching cost (import, compatibility, a bilingual period where both tools work) so the tipping point moves down and the coalition needed shrinks.","Resulting policy: 'Launch in one team of about ten with three committed early users pre-recruited; publish adoption within that team only; org-wide launch only once that team is past its crossing; cut switching cost before widening.' Tagged [E] for the tipping logic; [H] for this tool's threshold and for the choice of team; [V] that the slower launch is worth it. Prediction: within the pilot team, weekly active users pass a majority within six weeks; if the same tool is announced org-wide at the same time, org-wide adoption stalls below a fifth."]},"hinge":[{"q":"A company's most senior engineers have ended up clustered on one team, and juniors on the others, although no manager ever assigned by seniority and everyone says they value mixed teams. What does Schelling license you to conclude?","options":["Managers are lying about their preferences, since a pattern this clean cannot arise unless someone intended and arranged it.","The sorting proves that preferences caused it, so the fix is attitude work with the seniors who chose to cluster.","Since the outcome is structural, attitudes are irrelevant, and surveying what people value is wasted effort.","Mild preferences not to be the least experienced person, plus free movement, can sort this way without anyone wanting it."],"answer":3,"diagnoses":["Inferring intentions from outcomes, the first of Schelling's two warnings. A sorted outcome is consistent with everyone having mild preferences and nobody intending it.","'Schelling proved segregation is caused by mild preferences.' The model shows sufficiency, not cause, and attitudes move the threshold without removing the dynamic.","The opposite over-reading. Card, Mas and Rothstein find higher tipping points where measured tolerance is higher; attitudes set the thresholds even though the dynamic is structural.","Correct. The checkerboard and the ordered-attribute chapter show that mild preferences plus interdependence can produce extreme sorting; homogeneity is weak evidence of intolerance and strong evidence of interdependence."]},{"q":"Two curves for \"attend the daily standup\": the not-attend payoff is above the attend payoff at every level of others' attendance, but all-attend beats all-skip for everyone. What follows?","options":["It is a multi-person PD; only a rule, monitoring or a side payment moves it, since skipping dominates throughout.","It is a coordination problem; seed attendance above critical mass and the rest will follow the majority.","It is a stable interior mix; stop pushing for full attendance, since the curves show where it settles.","The curves must be wrong, because everyone says they value the standup and payoffs must follow what people say they value."],"answer":0,"diagnoses":["Correct. One curve above the other everywhere with the cooperative corner better for all is the multi-person prisoner's dilemma, and communication or seeding leaves the dominant curve on top.","'Every group problem is coordination that communication will fix.' With not-attend dominant everywhere there is no crossing to seed past; this is the helmet case, an MPD.","Misreading 'the curves do not cross' as an interior equilibrium. A stable mix needs a crossing with the cooperate curve on top to the left; here there is no crossing at all.","Inferring outcomes from intentions, Schelling's second warning. Everyone valuing the standup is compatible with everyone skipping it, which is the whole point of the MPD."]},{"q":"A colleague proposes to spread a new practice by recruiting \"the three most influential people\" to endorse it. What is the Schelling correction?","options":["Influence is what matters; the correction is to pick the most charismatic three rather than the most senior.","Tipping points are not real; adoption is driven by independent preferences, so pick people who like the practice.","The scarce resource is low-threshold actors, people who adopt when few have; a gap at the low end kills the cascade.","Endorsements from influential people work through prestige bias, so this is the Henrich lever and needs no correction."],"answer":2,"diagnoses":["The Gladwell reading of tipping. Schelling's tipping point is a property of the threshold distribution, not of charismatic individuals.","An over-correction. The logic of thresholds is uncontested; what is contested is how often real behaviour is contingent enough for cascades to matter, which is an empirical question about your group.","Correct. Remove the two lowest-threshold people from Schelling's demo example and attendance goes from everyone to no one; the cascade needs a second and third adopter more than it needs a famous first one.","Partly right, wrong level. Prestige selects whom people watch, but under a threshold rule the cascade still needs the distribution to have no gap at the low end; an influential endorser with nobody at threshold one produces one adopter."]},{"q":"A team adopts a rule that everyone welcomes, then discovers that several members would not have complied voluntarily and only follow it because it is now the rule. What does this tell you?","options":["The rule was unnecessary, since everyone welcomed it and people who welcome a rule would have followed it anyway.","The behaviour was an MPD: each preferred all-comply to all-defect but defect dominated individually.","The members who need the rule are the problem, since people of good will do not need to be made to comply.","The rule will fail, because rules only work where there is buy-in on the behaviour and here there is none."],"answer":1,"diagnoses":["Conflating the preference for the rule with the preference to comply alone. The helmet case: players wanted the rule precisely because none would wear a helmet alone.","Correct. Welcoming a rule you would not follow voluntarily is the signature of a multi-person prisoner's dilemma, and it is why the course says to consult on the rule, not on voluntary adoption.","Moralising a structural outcome. In an MPD the individually dominant choice is defection for everyone; the members who admit it are describing the payoffs, not a character flaw.","Buy-in on the behaviour as necessary. An MPD rule is welcomed by people who would not comply voluntarily; that is the case where rules work best, not worst."]}],"brief_prompt":"Add to the brief (section s5, 'threshold and tipping map'): for the group's key target behaviour, the two-curve sketch and its shape; whether the current state is below or above a crossing; the group's likely low-threshold members; one arithmetic constraint the v0 plan ignored (mentors to mentees, reviewers to reviews); one norm that is self-enforcing and one that needs a rule. Tag each. Prediction: the minimum viable coalition size (Schelling's k) you would need for a pilot, stated as a hypothesis.","deeper":["books/05-micromotives-and-macrobehavior.md#Ch 2 — The Inescapable Mathematics of Musical Chairs","books/05-micromotives-and-macrobehavior.md#Ch 5 — Sorting and Mixing: Age and Income","books/05-micromotives-and-macrobehavior.md#Ch 6 — Choosing Our Children's Genes","books/05-micromotives-and-macrobehavior.md#Ch 8 — An Astonishing Sixty Years: The Legacy of Hiroshima (2006 edition only)","books/05-micromotives-and-macrobehavior.md#Evidence strength & limits","books/10-networks-crowds-markets.md#Ch 17 — Network Effects"]},{"id":"m5","num":5,"title":"What people actually do: social preferences, coordination experiments, learning","level":"Mechanisms","minutes":70,"sources":["06-behavioral-game-theory","03-social-psychology"],"hook":"A responder is offered a fifth of a pie by an anonymous stranger she will never meet; rejecting leaves both with nothing. About half the time she rejects. When the same offer is generated by a computer, she mostly accepts. What is she paying to punish?","attempt":{"prompt":"You run a twenty-person on-call rotation whose outcome is set by the least-prepared engineer on duty; preparation has drifted to the minimum. You have a small budget.\n\nPropose three interventions and rank them by expected effect.","minutes":12},"objectives":["Say which of the three amendments (social preferences, limited iterated reasoning, learning) is driving a departure from the formal prediction and choose the matching fix (payoffs and fairness frame; salience and simplicity; early experience and feedback).","Quote the fairness evidence with the ledger's hedges and describe the group as a distribution of types rather than a representative agent.","Explain weak-link collapse, history lock-in, and the effect of communication and gradual growth on coordination."],"ideas":[{"title":"Three amendments, not a rejection: preferences, limited reasoning, learning","tag":"E","body":"*Hold this one in memory.*\n\nCamerer's thesis is easy to misread. It does not refute game theory. It keeps the structure (games, payoffs, equilibrium as the benchmark) and replaces the selfish, unboundedly rational player with three empirically grounded amendments, each of which can be switched off to recover the standard model. Standard theory is a poor description of first encounters and often a decent description of where experienced players end up. So the equilibrium is a hypothesis about *experienced* behaviour, and the design question is always: which amendment dominates here?\n\n**Social preferences.** People care about fairness and reciprocity, conditionally and in ways that depend on inferred intentions. The next idea gives the evidence. The matching fix is to change the payoffs *and the fairness frame*: an allocation seen as an intentional choice is resisted where the same allocation from an impersonal rule is tolerated.\n\n**Limited iterated reasoning.** People reason a step or two about others, not to a fixed point. The flagship is the beauty contest (Nagel 1995, verified): everyone picks a number from 0 to 100 and the winner is closest to two thirds of the average. Iterated dominance shrinks the choice set to zero, the unique equilibrium. First-round averages are about 35 to 36, with spikes near 33 and 22, consistent with one or two steps of best response from a naive start at 50. Choices fall toward zero with repetition. The cognitive-hierarchy model (Camerer, Ho and Chong 2004, verified) fits many games with a mean of about one and a half thinking steps; it is a fit, not a constant. The matching fix is salience and simplicity: rules that only work if everyone anticipates everyone else's anticipation will not work on first contact; make the intended action a best response to a naive belief about others, and if necessary make the naive option salient.\n\n**Learning.** Given that first-round play is not at equilibrium, how does it move? Camerer compares reinforcement learning (strategies that paid off get chosen more; no knowledge of others' payoffs needed), belief learning (form beliefs from history and best-respond), and a hybrid, experience-weighted attraction, in which each strategy's attraction is updated by both realised and forgone payoffs. The parametric details are not load-bearing; the regularities are. Convergence is faster with rich feedback and strict equilibria; learning often drifts toward equilibrium and stalls; and **the drift's direction depends on early rounds**, so a group's steady state is path-dependent. The matching fix is to engineer early experience and feedback: seed the first interactions deliberately, and show people what they would have earned under other choices, since forgone-payoff information speeds learning (this last is [H]; direct field tests are scarce).\n\nThe discipline this gives you is diagnostic. When your group departs from what the matrix predicts, ask which of the three is operating before reaching for a fix. A contested first credit-allocation round that \"will settle down with experience\" is a learning problem, and waiting chooses the steady state by default. A rule nobody follows because it requires three steps of anticipation is a reasoning problem, not a motivation problem. A split that produces complaints and exits is usually a preferences problem about intention, not about inequality as such.\n\nOne more distinction: **aggregates can look rational when individuals are not**. Mixed-strategy and market-entry games fit equilibrium at the population level because heterogeneous people average out; do not infer individual sophistication from an aggregate fit. [E] for all three amendments as lab regularities; the parametric models are the contested part, and the course does not lean on them."},{"title":"Fairness is real, conditional and cultural: model the group as a distribution of types","tag":"E","body":"*Hold this one in memory.*\n\nThree games isolate three things. The **ultimatum game**: a proposer splits a pie; the responder accepts, or rejects and both get nothing. The subgame-perfect prediction is the smallest positive offer, accepted. The **dictator game**: the same, but the recipient cannot reject; prediction, give zero. The **trust game** (Berg, Dickhaut and McCabe 1995): an investor sends any part of an endowment, it is tripled, and the trustee returns what they like; by rollback nothing is sent.\n\nWhat people do, with the course's hedges attached. Ultimatum: mean offers about 40%, with the mode at 40 to 50% (Oosterbeek, Sloof and van de Kuilen 2004 meta-analysis of 37 papers, verified). Offers below a fifth of the pie are rejected about half the time in Western student samples (background, approximate); rejection falls substantially at very high stakes but proposers still offer about 40%. Dictator: mean giving about 28%, with about 64% giving something (Engel 2011, verified); it collapses under double-blind anonymity, falls when the endowment is earned, and shifts when a *take* option is added. Camerer's reading, which later work strengthened: dictator giving is fragile norm compliance under observation, not altruism. Trust: in the original study 30 of 32 investors sent something, averaging about $5.16 of $10 (verified); trustees returned roughly what was sent (background).\n\nWhy the ultimatum result is not noise is the part to carry. When the same low offer is generated by a computer or a random device rather than a person, it is rejected far less often (Blount 1995). People punish *intentions*, not outcomes. And proposers are partly strategic: dictator giving is far below ultimatum offers, so much ultimatum \"generosity\" is fear of rejection.\n\nThe cross-cultural results turn a lab curiosity into a design constraint. Henrich and colleagues (2001, verified) ran the ultimatum game in fifteen small-scale societies with stakes near a day's wages. Mean offers ranged from about 26% (Machiguenga) to about 58% (Lamalera whale-hunters); students at 40 to 45% sit mid-range, not at the human default. Two variables explained most of the between-group variance: market integration and the payoffs to cooperation in daily life; individual demographics explained little. The 2010 follow-up found market integration and world-religion membership predict fairer offers and community size predicts more punishment (direction verified; causality unresolved, and framing may not be equivalent across cultures). So the *disposition* to have fairness norms is universal; the *content* varies with the economics of daily life, and \"people everywhere expect fifty-fifty\" may not be tagged [E].\n\nWhich model of social preferences wins? None. Inequity aversion (disutility from being behind or ahead) is the tractable workhorse; intention-based reciprocity models are needed for the Blount results; models with a concern for total surplus fit allocation games better; and estimated parameters are unstable across games. Camerer's own verdict is that distributions of types matter more than any representative agent. The rough shape (background, varies by game and population): about three in ten close to self-interested, about half conditional cooperators who contribute if others do, a small tail of unconditional altruists. Design for the middle: conditional cooperators need to *see* others cooperating to function, so visibility of contributions is a lever of the same order as the payoffs.\n\nThree design rules, all [E] for the mechanism and [H] for magnitude in your group. Make allocations that must be unequal look procedurally impartial, rule- or lottery-based, because intended unfairness is punished far more than unlucky outcomes. Use observation and identifiability to sustain generosity; anonymity roughly halves it. Calibrate the fairness baseline to your group's own exchange norms, not to a student lab."},{"title":"Weak-link coordination fails at scale; history locks in; talk, leadership and gradual growth select the good equilibrium","tag":"E","body":"Coordination games have multiple equilibria and the theory says little about which is chosen. Camerer's coordination chapter is the lab counterpart of Schelling's tipping and of the next module's risk dominance.\n\n**Stag hunts.** Two equilibria, one payoff-dominant (both hunt stag) and one risk-dominant (both hunt hare, which is safe whatever the other does). Cooper, DeJong, Forsythe and Ross found that play usually conv
