tions are what the models recommend."]},{"q":"What is the durable contribution of *The Bounds of Reason* for the brief?","options":["That correlated equilibrium fits data better than Nash, which the book establishes against the experimental record.","The epistemic critique of Nash and the choreographer idea: what is the signal, and why does each comply?","That the behavioural sciences now share one theory, so the brief can treat the four accounts as settled.","That Binmore's review discredited the book, so the brief should cite it only for the epistemic critique."],"answer":1,"diagnoses":["An empirical superiority claim the book never tests (ledger C58). The argument for correlated equilibrium is conceptual (Aumann 1987); there is no data horse race.","Correct (`11` net assessment). Carry the critique, the choreographer's two-part test and the BPC discipline; decline the unification and the settled-evolutionary-fact reading of norm-following.","Programmatic unification read as achieved (ledger rule 31). Reviewers call it a framework and a checklist; no discipline has to change a model because of chapter 12.","An attributed review that was not found (ledger C56). Binmore and Gintis agree on the epistemic critique and disagree about strong reciprocity and group selection; do not cite a review that does not exist."]},{"q":"Ambiguous ownership of a shared codebase produces recurring fights. Which reading of Gintis's chapter 11 is right?","options":["Assign the fairest owner and fights will fall most, since a fair allocation is the one nobody contests.","Ownership fights are innate territoriality, so only a manager's dominance stops them for any length of time.","Assign a clear owner, even somewhat arbitrarily, because an ambiguous cue leaves hawk-dove without a signal.","Ownership is a rule system, so write a rule, since a documented owner is what people consult when a dispute starts."],"answer":2,"diagnoses":["Fairness as the mechanism. The bourgeois convention works by being salient and mutually recognised; a fair but ambiguous allocation can produce more fights than a clear arbitrary one.","The endowment effect as evolved property psychology treated as [E] (ledger C57), plus dominance over prestige (`01`). The cue-only story is a model; the psychology is [H]; and dominance is the wrong channel for a convention people must copy.","Correct (ledger rule 32). The signal ends the hawk-dove fight; legitimacy and willingness to sanction are separate goods that the fairness of the allocation and the process supply.","Partly right, wrong level. A rule nobody monitors is not a signal (`09` rules-in-use); the cue has to be visible and acted on to correlate play."]}],"brief_prompt":"Add section s11, the signal and the BPC statement. For each of the group's central coordination problems, name the public signal that tells members which equilibrium is in play and say whether it is visible across the whole network or only inside one cluster. Record the two-part test result (epistemic, motivational) for the group's main norm. Write one BPC line: what members believe about each other, what they value including status and fairness, what constrains them. State which of the four layers the v0 fix addressed and which it ignored. Tag each: [E] for the formal relations, [H] for which layer bites, [V] for any claim about which equilibrium ought to hold. Prediction: which layer, if addressed alone, moves behaviour in this group, and which does nothing without the others.","deeper":["books/11-bounds-of-reason.md#ch-4--rationalizability-and-common-knowledge-of-rationality","books/11-bounds-of-reason.md#ch-6--the-mixing-problem-purification-and-conjectures","books/11-bounds-of-reason.md#ch-9--reflective-reason-and-equilibrium-refinements","books/11-bounds-of-reason.md#ch-12--the-unification-of-the-behavioral-sciences","books/11-bounds-of-reason.md#critical-assessment-which-claims-hold-up-against-the-rest-of-the-reading-list"]},{"id":"m11","num":11,"title":"Integration: tensions, decision rules, the diagnostic path","level":"Integration","minutes":75,"sources":["01-secret-of-our-success","02-darwins-unfinished-symphony","03-social-psychology","04-games-of-strategy","05-micromotives-and-macrobehavior","06-behavioral-game-theory","07-stag-hunt","08-grammar-of-society","09-governing-the-commons","10-networks-crowds-markets","11-bounds-of-reason"],"hook":"Five experts diagnose the same failing community: one says its learning network is broken, one says the game is a PD, one says it is below critical mass, one says the norm lacks normative expectations, one says the seed sat outside the cluster. All five are right. In what order do you act?","attempt":{"prompt":"Take the five disagreements below and, for each, write the condition under which each side is right. Do not pick a side; write an 'if the group is like X, do A; if like Y, do B' rule, and mark the condition as a hypothesis about your own group rather than a fact about groups in general. (i) Sweeten the joint payoff vs cut the lone-cooperator cost. (ii) Mix people more vs keep stable clusters. (iii) Explain vs model. (iv) Publish the descriptive norm vs never advertise prevalence. (v) Install institutions vs let structure do the work.","minutes":15},"objectives":["Walk the diagnostic path from a real failure to a ranked fix set, in order: arithmetic; situation and construal; game shape; curve shape and threshold; type mix and amendment; regime and correlation; norm classification and expectations; institutional checklist; network seeding; signal and layers.","State each of the thirteen tensions (t01-t13) as a conditional decision rule with the condition tagged [H], and say which tension a given disagreement in the brief falls under.","Re-tag Brief v0 line by line with a changelog, fill the open-hypotheses and value-commitments registers, and identify the single most important missing decision.","State the course's certainty gradient (theorems; lab mechanisms for direction; institutional and network prescriptions as hypotheses; the choice of equilibrium as a value) and refuse any [E] that is not a ledger [E]."],"ideas":[{"title":"Diagnose before prescribing: the ten-step path","tag":"V","body":"Most v0 briefs skip to a lever. The learner's first page usually said either that the people were the problem or that an incentive would fix it, and every module since has supplied a reason to distrust that shortcut. The integration module fixes an order of diagnosis. The *order* is the course's own choice and is tagged [V]; each step's content is [E] from the source named. The rule that binds the whole path: **no fix is proposed at any step before that step's diagnosis, and at least one step must conclude \"not the binding constraint here\".**\n\n1. **Is it arithmetic?** (Schelling, m4.) Check accounting identities and constraints before motives: mentors to mentees, reviewers to reviews, seats to attendees. A failure that is a counting problem has no behavioural fix.\n2. **Is it the situation?** (Gilovich et al., m2.) Write the situational alternative to the dispositional story: workload, ambiguity, visibility, ownership, deliberation design, construal. Strike through any lever from the failed-replication list.\n3. **What is the game shape?** (Dixit et al., m3.) Draw the matrix with payoffs as members see them and ask whether a member gains by defecting when everyone else cooperates. PD, stag hunt, chicken, battle of the sexes or coordination; each has its own fix set.\n4. **Is behaviour contingent, and where is the threshold?** (Schelling and the network book's population models, m4.) Draw the two curves. Multi-person PD (needs rules), coordination with a tipping point (needs seeding above critical mass), or stable interior mix (leave alone). Find the low-threshold members.\n5. **Which amendment?** (Camerer, m5.) Is the departure from the formal prediction driven by social preferences and fairness frames, by limited iterated reasoning, or by learning and early-round lock-in? Describe the group as a distribution of types, not a representative agent.\n6. **What regime, and what correlation?** (Skyrms, m6.) Near-random mixing with frequent re-evaluation, or stable subgroups with visible success? Which correlation device is cheapest, and what is the lone-cooperator cost?\n7. **What kind of norm, and which expectations?** (Bicchieri, m7.) Descriptive, convention, social or moral; measure the two expectations; read the pluralistic-ignorance gap; check the cues.\n8. **Which principles are missing, and at which rule level?** (Ostrom, m8.) Run the checklist with a scope flag; find the level (operational, collective-choice, constitutional) where the reform is stalling; design the sanctions ladder and the by-product monitoring.\n9. **Where in the network?** (Easley and Kleinberg, m9.) Clusters, bridges, q, seed set; which of the three copying kinds is producing the convergence; selection before influence.\n10. **What is the signal, and which layer bites?** (Gintis and the four layers, m10.) Name the public cue; run the two-part test; write the BPC line; say which of stability, selection, signal and expectations the fix addresses.\n\nThe hook's five experts are each standing on one step, and each is right about their step. The order of *action* depends on which step is the binding constraint for this group, and that is a hypothesis: rank the fixes, attach one prediction per fix checkable in the group within three months, and state what would make you abandon the main one.\n\nTwo things the path is not. It is not a claim that every group has every problem; \"not the binding constraint here\" is what lets most steps be short. And it is not in the sources; none of the eleven books proposes a diagnostic order across the others, which is why the order carries a [V] and why the capstone scores the discipline of diagnosis before fix more heavily than any particular fix."},{"title":"The tensions are conditional rules, not contradictions","tag":"H","body":"Where two books on the list disagree, the ledger records both and states a conditional resolution. The integration module turns each into a decision rule of the form \"if the group is like X, do A; if like Y, do B\", and the whole point is that the *condition* is a hypothesis about your group, to be tested, never a fact about groups in general. The thirteen tensions, by id:\n\n- **t01 Copying biases vs copying strategies; copying vs teaching** (Henrich vs Laland). Henrich's biases are the levers (whom people copy); Laland's tournament logic is why copying pays (demonstrators pre-filter). Spread *norm adherence* by models, prestige and expectations; transfer a *skill with hidden structure* by explicit teaching.\n- **t02 Strong reciprocity as evolved trait vs cheap graduated sanctioning.** Lab willingness to punish is [E]; the evolved trait is [H]; field sanctioning is mostly cheap. Design on the cheap version.\n- **t03 Four accounts of how a group settles.** Layered, not rival: stability test, selection, signal, expectations. Which layer bites is [H].\n- **t04 Risk vs payoff dominance; clusters block vs help.** Regime and learning rule decide. Risk dominance under random mixing, best response, large groups, no talk; payoff dominance reachable through correlation. Clusters help only under success-copying; a dense cluster blocks entry and protects adoption.\n- **t05 Stable social preferences vs cued norm compliance; internalised vs conditional.** Model fairness as a distribution of sensitivities conditional on cues; assume every norm conditional until it survives a collapse of expectations.\n- **t06 Designed vs copied-and-evolved institutions.** Copy a visibly successful peer's norm package, then craft incrementally with those bound by the rules.\n- **t07 PD vs stag hunt; does cheap talk work.** Classify first by the defection question. Talk is [E] in the lab and in stag-hunt models; expect decay without sanctions or repetition where defection dominates.\n- **t08 Cultural group selection and culture-drove-brains.** [H], never load-bearing; within-group mechanisms are the [E] part.\n- **t09 Connectivity vs closure.** Connectivity for information and skill retention; closure for enforcement and complex contagion. The right mix is [H].\n- **t10 Descriptive-norm messaging.** Always pair descriptive with injunctive; never advertise prevalence of misbehaviour.\n- **t11 Anomalies as preferences vs unstable beliefs.** BPC as bookkeeping only; do not claim it explains construal effects.\n- **t12 Incentives vs norms** (crowd-out). Prefer the norm where the disposition exists; expect a large explicit incentive to displace it. Crowd-out is real but context-dependent, so the condition is [H].\n- **t13 Change expectations vs change structure** (Bicchieri vs Easley-Kleinberg and Skyrms). Expectations where the group is one reference network and the signal is seen by all; structure where clusters and bridges decide who sees the signal.\n\nThe five attempt disagreements, resolved. (i) Cut the lone-cooperator cost; sweeten the joint payoff only when that cost is already low (t04). (ii) Keep stable clusters while a norm is young *if members copy success*; if they copy the majority, add success-visibility first; mix for information flow, never for norm spread (t04, t09). (iii) Model for adherence, teach for hidden structure (t01). (iv) Publish only paired with an injunctive signal and only the compliant share (t10). (v) Let structure do the work in a stag hunt with success-copying and stable subgroups; install institutions where the defection question says PD or the group is too large for by-product monitoring (t06, t07).\n\nA correctly stated rule has a condition, names the source, and tags the condition [H]. \"Always keep stable clusters\" is a side. The open-hypotheses register (s12) is where each condition goes, with its test and date."},{"title":"Certainty drops as you climb: the tag discipline and the changelog","tag":"E","body":"The unified model reads like a building, and certainty falls as you go up. At the foundation, the Origins mechanisms (copying biases, norm psychology) are [E] and their weights in any group are [H]; the deep-time story (cultural group selection, culture-drove-brains) is [H]. In the Mechanisms band, the formal results are theorems and the replicated lab mechanisms are [E], but any group's classification is [H]. In the Order band, the models and the systematic reviews are [E]; every prescription for a particular group is [H]; and the choice of which equilibrium ought to hold is [V]. At the roof, the four layers are a map, and which layer bites is [H]. This is ledger rules 27 and 40 in one sentence: **use lab results for mechanisms and directions, never as field point estimates, and quote no number that is not in the ledger's section 4.**\n\nThe most common capstone error, and the one the scoring penalises most, is tagging a lab mechanism as [E] *for the learner's own group*. \"Communication roughly doubles cooperation\" is [E] as a lab direction; \"our retro will double contributions\" is [H]. \"The stag hunt is formally distinct from the PD\" is [E]; \"our team is a stag hunt\" is [H] until the defection question has been answered with the group's own payoffs, and remains a hypothesis even then, because self-reported payoffs are construal (m2). The second most common error is the reverse: tagging a value as a hypothesis. \"Member governance is worth the slower decisions\" is not testable; it is [V], and pretending it is [H] hides the commitment from the reader who most needs to see it.\n\nThe changelog is how the discipline becomes visible. Brief v0 was tagged on day one, badly, on purpose. Now re-tag v0 line by line against the current version and record, for every tag that changed, why: which module, which ledger rule, which measurement. A typical changelog moves dispositional [E]s (\"two people are coasting\") to situational [H]s after m2; converts an incentive fix tagged [E] into a [V] about what the group should reward after m3 and t12; reverses \"clusters slow spread\" after m9; and, almost always, adds a line that was missing entirely: who has standing to change the rules, and what the public signal is. Those two are the decisions learners skip most (per the worked examples in m8 and m10).\n\nThree registers close the brief. **s12, open hypotheses**: every [H], each with the test that would settle it and a date; this is where the tension conditions live. **s13, value commitments**: every [V], stated plainly so a reader can disagree with the values without disputing the evidence. **s14, measurement plan and ninety-day predictions**: three predictions with dates, the first cheap change that produces information and standing, and what would make the learner abandon the main hypothesis.\n\nA note on the sources' own limits. The ledger's section 6 lists what the eleven books cannot settle: whether cultural group selection is an engine or a redescription; whether norm-following is internalised or conditional-but-looks-internalised; whether one-shot punishment is an evolved trait; whether payoff dominance is stable under noisy best response or only reachable transiently; whether Ostrom's principles transfer to digital commons; whether influence can be separated from selection without longitudinal data. Where the brief touches one of these, the honest tag is [H] with a note that the sources are open, and the honest prediction is one the learner's own group can check. That is the whole method: the reading list gives mechanisms and directions; the group gives the numbers."}],"worked_example":{"title":"Your group through the ten-step path in one page (rubric only)","steps":["Walk the ten steps in order for your own group, one short paragraph each: arithmetic; situation; game shape; curve shape and threshold; amendment; regime and correlation; norm kind and expectations; missing principles and rule level; network position and seeding; signal and layer. Each paragraph names its source module and book.","At each step, write the diagnosis before any fix, and be willing to write 'not the binding constraint here' with a one-line reason. A page in which every step finds a problem has not diagnosed anything; at least one step must be declared non-binding.","For every disagreement you meet between steps (mix or cluster; explain or model; incentive or norm; expectations or structure), name the tension by id (t01-t13) and write its rule with the condition tagged [H] and entered in the open-hypotheses register.","Rank the fixes. Each fix carries: the step it came from, one prediction checkable in the group within ninety days with a date, and a tag per claim. Check the fix set against the failed-replication list (ego depletion, priming, power posing, watching eyes, the Stanford Prison Experiment, groupthink as a syndrome, IAT training) and remove anything that appears on it.","Audit the tags: every [E] must be a ledger [E]; every claim about this particular group is [H]; every claim about which equilibrium ought to hold, or what the group should reward, is [V]. Then write the changelog against Brief v0 and name the single most important decision v0 was missing.","Rubric: every step names its source; no fix precedes its diagnosis; at least one step concludes 'not binding'; nothing on the failed-replication list survives; every [E] is a ledger [E]; the missing-decision line is present. This page is Brief v5, the capstone's input."]},"hinge":[{"q":"A learner's brief tags \"our team is a stag hunt\" as [E]. Correct?","options":["Yes; the stag hunt is a theorem, so a classification that uses it inherits the theorem's status.","No; it is [H] until the defection question has been answered with the group's own payoffs, and then still [H].","No; it should be [V], since how the team's incentives are described is a choice about how the team should be run.","Yes, if the team says so, since members are the best witnesses to their own incentives and payoffs."],"answer":1,"diagnoses":["Tags the formal distinction's status onto the group's classification (ledger rule 13: [E] for the distinction, [H] for the classification). The theorem is about the game; whether this team is playing it is an empirical question.","Correct. Classification depends on payoffs as members see them, which are construal-laden and measured indirectly; the tag stays [H] with a test in the open-hypotheses register (ledger rules 13, 27).","Confuses an empirical hypothesis with a value commitment. Whether the team is a stag hunt is a fact to be tested, not a preference about how it should be run.","Self-report of payoffs as evidence. Construal and naive realism (`03`) mean members' descriptions of their own incentives are data about beliefs, not a settled classification."]},{"q":"Which is a correctly stated tension rule?","options":["\"Always keep stable clusters, because density is what protects a young norm from being swamped by the wider majority.\"","\"Mixing spreads information and norms alike, because both travel across whichever ties the org happens to have.\"","\"Keep stable clusters while a norm is young if members copy success; if they copy the majority, show success first.\"","\"Clusters help because Centola proved it, so keep the sub-team intact whatever the members' learning rule.\""],"answer":2,"diagnoses":["A side, not a condition. A tension rule has an 'if' whose condition is tagged [H]; an unconditional instruction is what the cold attempt is designed to catch.","Simple and complex contagion collapsed (ledger rule 34). Information crosses one weak tie; costly behaviour needs several adopting neighbours, so mixing helps one and hurts the other (t09).","Correct (t04; ledger X7). The condition is the group's learning rule, which is a hypothesis about the group and goes in the open-hypotheses register with a test.","One background study promoted to a theorem, with the condition missing. Centola 2010 is background; the theorem is the cluster-density result, and it comes with the learning-rule condition."]},{"q":"A brief's single most important missing decision is most often:","options":["The incentive scheme, since most briefs leave the payoffs vague and a norm with no reward behind it decays within weeks.","The values statement, since a group that has not written down what it stands for cannot hold a norm.","The team-building event, since contact is what turns a set of colleagues into a group that cooperates.","Who has standing to change the rules, and what the public signal is that tells members which equilibrium is in play."],"answer":3,"diagnoses":["Incentives as the default lever. Most v0 briefs already have one; the capstone penalises fixes proposed before diagnosis, and t12 says a large explicit incentive can displace the norm it is meant to support.","Norms as values (ledger C43). A values statement targets the wrong object when the norm is conditional; it is neither standing nor signal.","Proximity as contact (`03` ch 10). Contact effects need equal-status, goal-directed, institutionally supported interaction; an event supplies proximity and none of the conditions.","Correct. The collective-choice level (`09` ch 2: nobody affected can legitimately change the rule) and the epistemic half of the norm (`11` ch 10: no cue tells members which equilibrium is in play) are the two decisions learners skip most, per the worked examples in m8 and m10."]}],"brief_prompt":"Re-tag Brief v0 line by line against the current version and write a changelog: every tag that changed, and why (module, ledger rule or measurement). Fill s12, the open-hypotheses register, with every [H] in the brief, its test and the date; fill s13, the value-commitments register, with every [V] stated plainly; write s14, the measurement plan and ninety-day predictions (three predictions with dates; the first cheap change that produces information and standing; what would make you abandon the main hypothesis). Name the single most important decision v0 was missing. This is Brief v5, the capstone's input.","deeper":["books/11-bounds-of-reason.md#critical-assessment-which-claims-hold-up-against-the-rest-of-the-reading-list","books/07-stag-hunt.md#connections","books/08-grammar-of-society.md#connections","books/09-governing-the-commons.md#connections","books/10-networks-crowds-markets.md#connections"]}],"cards":[{"id":"c001","module":"m1","type":"recall","front":"What is the collective brain, and which three levers set a group's competence?","back":"The network of people who actually learn from each other. Competence lives there, not in individuals. Levers: the size of the pool that really shares, its connectivity, and transmission fidelity.","source":"01-secret-of-our-success"},{"id":"c002","module":"m1","type":"recall","front":"Name five of Henrich's cultural learning biases.","back":"Success (skill) bias, prestige bias, conformist transmission, self-similarity bias, and credibility-enhancing displays (CREDs). Content biases (danger, food, norm violation) direct attention.","source":"01-secret-of-our-success"},{"id":"c003","module":"m1","type":"recall","front":"Define prestige and dominance, and say what each does to information flow.","back":"Prestige: freely conferred deference paid for copying access; people approach, attend and imitate. Dominance: status held by threat; people avoid and comply under observation. Prestige enables copying and honest signalling; dominance suppresses both.","source":"01-secret-of-our-success"},{"id":"c004","module":"m1","type":"recall","front":"What is a credibility-enhancing display (CRED)?","back":"A costly action that only makes sense if the model genuinely holds the belief, which makes the belief more copyable than any statement of it. Words transmit weakly; visible costly actions transmit strongly.","source":"01-secret-of-our-success"},{"id":"c005","module":"m1","type":"recall","front":"Which social learning strategies does Laland say evolved, in place of indiscriminate copying?","back":"Copy when uncertain, copy the successful, copy the majority, and discount stale information. The rules are cheap; the ecology decides which one pays.","source":"02-darwins-unfinished-symphony"},{"id":"c006","module":"m1","type":"explain","front":"Why did copying win the social-learning tournament even when observing cost no less than innovating?","back":"Demonstrators pre-filter. An agent performing a behaviour performs its best-known one, so observers sample from a distribution already biased toward high payoffs. The value of copying is set by demonstrators' incentive to show their best. It was a simulation, 104 entries (Rendell et al. 2010).","source":"02-darwins-unfinished-symphony"},{"id":"c007","module":"m1","type":"explain","front":"Why is Rogers's paradox a problem for a group where everyone follows the same 'best practices'?","back":"Copiers only exploit knowledge others paid to produce. Copying beats innovating individually, but a population of pure copiers sits on a stale pool and does worse on average. Someone must be induced to innovate and old exemplars must expire.","source":"02-darwins-unfinished-symphony"},{"id":"c008","module":"m1","type":"explain","front":"Why does Henrich say explanation is a weak channel for norm adherence?","back":"People adopt what visibly successful, prestigious or majority models do and what others expect, often without understanding it (over-imitation, faith in tradition). A memo supplies information, not a model or an expectation, so it raises fidelity but rarely adherence.","source":"01-secret-of-our-success"},{"id":"c009","module":"m1","type":"explain","front":"Why is norm psychology 'content-neutral', and what does that imply for a designer?","back":"People internalise and enforce whatever pattern is first visible and expected, including harmful ones, and in some environments punish cooperators (antisocial punishment). The designer must fill the norm slot early and channel enforcement through a legitimate process.","source":"01-secret-of-our-success"},{"id":"c010","module":"m1","type":"apply","front":"A respected, quiet engineer who alone knows the deployment system leaves in three months; the runbook goes unused. Diagnose and fix.","back":"A single copied node with no copying channel: skill-loss risk. Widen the learning network: two people shadow real deployments, she narrates decisions, repeated low-stakes occasions to copy. Documentation raises fidelity but does not replace modelling.","source":"01-secret-of-our-success"},{"id":"c011","module":"m1","type":"apply","front":"A team lead announces 'quality over speed' and a week later ships a known-broken feature to hit a date. What spreads?","back":"'Speed over quality', more strongly than the announcement. The costly visible exception is a CRED; the words were not. Route norms through leaders' costly actions, not statements.","source":"01-secret-of-our-success"},{"id":"c012","module":"m1","type":"apply","front":"An org copied a rival's best-practices wiki wholesale; two years on nobody updates it and it no longer fits. Which tournament findings apply?","back":"Recency-weighting: the winner discounted stale information, so practices need dates and expiry. Rogers's paradox: universal copying with no funded innovation leaves the pool stale. Also copy and modify, never wholesale.","source":"02-darwins-unfinished-symphony"},{"id":"c013","module":"m1","type":"apply","front":"A team wants to spread a debugging technique whose reasoning is non-obvious. Shadowing or explicit teaching?","back":"Explicit teaching while demonstrating. In the stone-tool experiment (Morgan et al. 2015, N = 184, one study) imitation added little over reverse engineering; teaching and language gave the largest gains for skills with hidden structure. Tag [E], modest.","source":"02-darwins-unfinished-symphony"},{"id":"c014","module":"m1","type":"discriminate","front":"Norm adherence versus skill transfer: which channel carries each, and what is the common error?","back":"Adherence spreads through models, prestige and expectations; explanation is weak there. A skill with hidden causal structure needs explicit teaching. The error is collapsing Henrich and Laland into 'explanation does not work' or 'just document it'.","source":"02-darwins-unfinished-symphony"},{"id":"c015","module":"m1","type":"discriminate","front":"'Bigger populations produce more complex culture, so growing the company will make it more innovative.' Where does this go wrong?","back":"The variable is learning-network connectivity and fidelity, not head-count; growth without connection shrinks the effective collective brain. And the population-size effect is lab-demonstrated at small scale, archaeologically contested (Vaesen et al. 2016). Tag [H].","source":"01-secret-of-our-success"},{"id":"c016","module":"m1","type":"discriminate","front":"Cultural group selection: what tag does it carry in this course, and which part of the cooperation story is [E]?","back":"CGS is [H] and never the sole basis for a design claim. The within-group mechanisms, reciprocity, reputation and punishment, are the [E] part. Benchmarking a peer's norm package is fine; 'selection made it adaptive' is not.","source":"01-secret-of-our-success"},{"id":"c017","module":"m2","type":"recall","front":"Define the fundamental attribution error and name the follow-on bias that makes it hard to correct.","back":"Overweighting disposition and underweighting situation when explaining others' behaviour. Naive realism, the sense that one's own view is unmediated reality, makes the attribution feel like observation rather than inference.","source":"03-social-psychology"},{"id":"c018","module":"m2","type":"recall","front":"What are the two channels of a norm in social psychology, and what must be true of them?","back":"Descriptive (what people do) and injunctive (what people approve). They must point the same way; a visible descriptive norm of defection beats any injunctive appeal.","source":"03-social-psychology"},{"id":"c019","module":"m2","type":"recall","front":"List the five steps at which bystander intervention can fail.","back":"Notice; interpret as an emergency; take responsibility; know how to help; act. Each can be engineered: named ownership, a script, clear signals. The effect is [E] for ambiguous, low-risk settings only.","source":"03-social-psychology"},{"id":"c020","module":"m2","type":"recall","front":"Which social-psychology findings are on the course's robust list, and which on the failed list?","back":"Robust: conformity, obedience, attribution error, dissonance, polarization, loafing, minimal groups, contact (moderate), bystander (low-risk), cooperation-game effects. Failed: ego depletion, social priming, power posing, watching eyes, Stanford Prison Experiment, groupthink as syndrome, IAT training.","source":"03-social-psychology"},{"id":"c021","module":"m2","type":"recall","front":"State Allport's conditions for intergroup contact to reduce hostility.","back":"Equal status, a shared goal neither group can reach alone, genuine cooperation, and institutional support. Proximity, a social event or training do not meet them. Effect is moderate (Pettigrew and Tropp 2006), with fewer rigorous field trials.","source":"03-social-psychology"},{"id":"c022","module":"m2","type":"explain","front":"Why did the sign 'please do not take petrified wood; many visitors do' increase theft?","back":"It broadcast a descriptive norm (many people steal) that contradicted the injunctive one. People follow what others do more than what they are told to approve, so the sign normalised the behaviour.","source":"03-social-psychology"},{"id":"c023","module":"m2","type":"explain","front":"Why does a homogeneous committee drift to more extreme, confident decisions?","back":"Group polarization: discussion supplies arguments mostly on the side the group already leans, and members shift to be at least as extreme as the perceived norm. Early confident speakers become the group's evidence; dissent self-censors.","source":"03-social-psychology"},{"id":"c024","module":"m2","type":"explain","front":"Why do small, freely chosen, public commitments produce belief while large incentives produce only compliance?","back":"Dissonance and self-perception: when external pressure is small, people infer their attitude from their behaviour. A large reward supplies an external reason, so no belief change is needed, and it can crowd out the intrinsic motive (overjustification).","source":"03-social-psychology"},{"id":"c025","module":"m2","type":"explain","front":"Why does output per head fall when a team grows from five to twelve, before anyone's character is involved?","back":"Social loafing (pooled, unidentifiable effort) and diffusion of responsibility (no one owns the task). Both are structural; the 'coasters' story forms afterwards via the attribution error. Fix visibility and ownership first.","source":"03-social-psychology"},{"id":"c026","module":"m2","type":"apply","front":"A community manager drafts a banner: 'Over a thousand posts broke the rules last month. Please do better.' Predict the effect.","back":"It backfires for most users: it advertises that rule-breaking is common (descriptive) while asking for compliance (injunctive). Pair a positive descriptive signal with an injunctive one; never publish the prevalence of misbehaviour.","source":"03-social-psychology"},{"id":"c027","module":"m2","type":"apply","front":"A retrospective concludes that two named people are unreliable. What does the facilitator check first?","back":"Whether workload, information, ambiguity and ownership were visible to those making the attribution. Diagnose situationally before dispositionally. The check is a check, not a veto: effect sizes are moderate.","source":"03-social-psychology"},{"id":"c028","module":"m2","type":"apply","front":"Forty members of an online community saw alarming posts from a member and nobody acted. What is the fix?","back":"Diffusion of responsibility in an ambiguous, low-risk setting, exactly where the bystander effect is strongest. Assign named ownership, give a script for the five steps, and do not enlarge the audience.","source":"03-social-psychology"},{"id":"c029","module":"m2","type":"apply","front":"You want engineers to write tests without paying a bonus. Which mechanisms do you use and which do you avoid?","back":"Use: small public commitments, a visible descriptive norm that most PRs include tests, an injunctive signal, foot-in-the-door. Avoid: large bonuses (compliance without belief, crowd-out) and any message revealing that most people skip tests.","source":"03-social-psychology"},{"id":"c030","module":"m2","type":"discriminate","front":"'The situation determines behaviour' versus 'situations are underestimated': which is the course's claim?","back":"The second. Effect sizes are moderate; people are not infinitely malleable. The claim is that the default dispositional diagnosis is usually wrong, not that structure is all-powerful.","source":"03-social-psychology"},{"id":"c031","module":"m2","type":"discriminate","front":"Milgram: 'blind obedience' or something else? Give the verified number.","back":"The behaviour replicates: 70% continued past 150 V in Burger 2009 (verified) versus roughly 82% in Milgram. But obedience fell with victim proximity, absent authority or a refusing peer. Design lesson: exits, peers, legitimacy of refusal.","source":"03-social-psychology"},{"id":"c032","module":"m2","type":"discriminate","front":"Groupthink as a diagnosis versus groupthink as a checklist: which survives the evidence?","back":"The checklist. Controlled studies do not support cohesion as the cause; the individual mechanisms (self-censorship, pressure on dissenters, directive leadership) are real. Never prescribe 'reduce cohesion'.","source":"03-social-psychology"},{"id":"c033","module":"m2","type":"discriminate","front":"Ego depletion: what did the registered replication find, and what is the rule?","back":"Hagger et al. 2016: 23 labs, N = 2,141, d = 0.04 with the interval including zero (verified). Rule: never build a design on ego depletion or on rationing 'willpower'.","source":"03-social-psychology"},{"id":"c034","module":"m3","type":"recall","front":"What five things must you write down to specify a game?","back":"Players; strategies (complete contingent plans, not single moves); payoffs as the players see them; order of moves; and what each player knows when moving.","source":"04-games-of-strategy"},{"id":"c035","module":"m3","type":"recall","front":"What single question classifies a cooperation problem as PD-shaped or stag-hunt-shaped?","back":"Does a member gain by defecting when everyone else cooperates? Yes: PD (fix set is payoffs, repetition, credible sanctions). No: stag hunt (fix is assurance). The distinction is [E]; any group's classification is [H].","source":"04-games-of-strategy"},{"id":"c036","module":"m3","type":"recall","front":"Name the fix that matches each shape: PD, stag hunt, chicken, battle of the sexes, pure coordination.","back":"PD: change payoffs, repetition with observability, or credible sanctions. Stag hunt: assurance (conditional pledges, thresholds). Chicken: assignment or rotation. Battle of the sexes: a fair tie-break. Pure coordination: a focal point.","source":"04-games-of-strategy"},{"id":"c037","module":"m3","type":"recall","front":"Define Nash equilibrium in one sentence and say what it is not.","back":"A profile from which no player gains by deviating alone. It is a stability test, not a prediction (with several equilibria it predicts nothing) and not an endorsement (mutual defection qualifies because it is stable).","source":"04-games-of-strategy"},{"id":"c038","module":"m3","type":"recall","front":"What makes a threat or sanction subgame-perfect, and why does that matter for enforcement design?","back":"Executing it must be in the enforcer's interest at the moment of enforcement, in every subgame. A sanction that costs the enforcer more than ignoring the violation will not be applied, and violators know it.","source":"04-games-of-strategy"},{"id":"c039","module":"m3","type":"explain","front":"Why is mutual defection the equilibrium of a one-shot PD when both players prefer mutual cooperation?","back":"Defection is dominant: whatever the other does, defecting pays more. Cooperation is a best response to nothing, so no profile containing it is stable against unilateral deviation. Preferring an outcome does not make it an equilibrium.","source":"04-games-of-strategy"},{"id":"c040","module":"m3","type":"explain","front":"Why does making a threat more severe usually make it less credible?","back":"Severity raises the cost of executing it to the threatener, so the other side expects it not to be carried out. Size a threat to what deters, structure it so executing is in your interest at the time, or make it probabilistic.","source":"04-games-of-strategy"},{"id":"c041","module":"m3","type":"explain","front":"Why does a known finite endpoint unravel cooperation in a repeated PD?","back":"In the last round nobody fears retaliation, so both defect; knowing that, the second-to-last round has no shadow either, and the logic rolls back to the start. Cooperation needs a future that is long, uncertain and observable.","source":"04-games-of-strategy"},{"id":"c042","module":"m3","type":"apply","front":"A shared on-call rota is decaying. If everyone else did their shifts, one person skipping still gains. What follows?","back":"PD-shaped. The fix set is payoff change, repetition with observability, or a credible sanction. Assurance mechanisms and clearer schedules address a different shape and will not work here.","source":"04-games-of-strategy"},{"id":"c043","module":"m3","type":"apply","front":"Should a community's code-of-conduct violation be met by an immediate ban? Reason by rollback.","back":"At the moderator's node, banning an established member costs a public fight; ignoring costs little. The ban threat is not subgame-perfect, so it is not credible. Use a cheap, fast, public first response applied by rotation, with scheduled escalation.","source":"04-games-of-strategy"},{"id":"c044","module":"m3","type":"apply","front":"A community wants to tell committed members from tourists before granting privileges. Design the screen.","back":"A multi-week task cheap for people who intend to stay and costly for those who do not. It separates because the cost differs by type. A statement of commitment (cheap talk) or an equal fee for all pools types and reveals nothing.","source":"04-games-of-strategy"},{"id":"c045","module":"m3","type":"apply","front":"A volunteer event needs eight organisers; everyone wants the event, nobody wants to be one of the eight. Which shape?","back":"Two possibilities. If volunteering pays given enough others volunteer: threshold assurance game, fix with conditional pledges ('I'm in if seven others are'). If each strictly prefers others do it regardless: chicken, fix with assignment or rotation.","source":"04-games-of-strategy"},{"id":"c046","module":"m3","type":"discriminate","front":"'Our engineers will work together for years, so repetition guarantees cooperation.' What is the correction?","back":"Repetition permits cooperation as one equilibrium among many, including permanent defection. The group must also coordinate on it and detect defection fast. The folk theorem is an existence result, not a guarantee.","source":"04-games-of-strategy"},{"id":"c047","module":"m3","type":"discriminate","front":"Tit-for-tat as a rule versus the properties of a good repeated-game strategy: which does the course recommend?","back":"The properties: nice, retaliatory, forgiving, clear. Tit-for-tat won Axelrod's tournaments but feuds forever under noise; generous variants do better. Never recommend the rule.","source":"04-games-of-strategy"},{"id":"c048","module":"m3","type":"discriminate","front":"A team is stuck where nobody invests in shared tooling and nobody can improve alone. A manager says 'so this is what they want.' Two errors?","back":"Equilibrium is stable, not preferred: it may be one of several and history picked it. And 'rational' does not mean selfish; consistent preferences can include fairness. Never use equilibrium as approval.","source":"04-games-of-strategy"},{"id":"c049","module":"m3","type":"discriminate","front":"Someone quotes the textbook's discount-factor threshold as the general condition for cooperation. What is wrong?","back":"The threshold in any worked example depends on that example's temptation and cooperative payoffs; raise the temptation and it rises. Quote the condition (future long, uncertain, observable; patience above a payoff-dependent threshold), not the example's number.","source":"04-games-of-strategy"},{"id":"c050","module":"m4","type":"recall","front":"What two directions of inference does Schelling warn against?","back":"Inferring intentions from outcomes (sorting implies strong prejudice) and outcomes from intentions (everyone wants mixing, so mixing will result). Both skip the interaction structure; put a model between them.","source":"05-micromotives-and-macrobehavior"},{"id":"c051","module":"m4","type":"recall","front":"Define a tipping point in the ledger's wording.","back":"An unstable equilibrium in a threshold distribution or adoption curve: below it participation decays, above it snowballs. The scarce resource is low-threshold actors, never charismatic ones.","source":"05-micromotives-and-macrobehavior"},{"id":"c052","module":"m4","type":"recall","front":"What is k (the minimum viable coalition) in Schelling's binary-choice analysis?","back":"The smallest group who, by choosing the cooperative option together, are each better off than under universal defection. It is the pilot size that can sustain itself.","source":"05-micromotives-and-macrobehavior"},{"id":"c053","module":"m4","type":"recall","front":"Name the three shapes the binary-choice diagram can show and the fix for each.","back":"Multi-person PD (defect curve above cooperate curve everywhere, all-cooperate beats all-defect): rules, monitoring or side payments. Coordination with a crossing (two stable corners, unstable interior): seed above critical mass. Stable interior mix: leave alone.","source":"05-micromotives-and-macrobehavior"},{"id":"c054","module":"m4","type":"recall","front":"State exactly what the checkerboard model shows and does not show.","back":"Shows: mild preferences plus interdependence can produce extreme sorting; homogeneity is weak evidence of intolerance. Does not show: that preferences are the main real-world cause, that they are exogenous, or that the outcome is acceptable.","source":"05-micromotives-and-macrobehavior"},{"id":"c055","module":"m4","type":"explain","front":"Why is the mixed state in the bounded-neighbourhood model usually unstable?","back":"Tolerance schedules are cumulative: once composition passes the least tolerant member's limit, that member leaves, worsening the ratio for the next, whose limit is then breached. Departures feed on themselves, so only the corners are stable.","source":"05-micromotives-and-macrobehavior"},{"id":"c056","module":"m4","type":"explain","front":"Why does a gap at the low end of a threshold distribution kill a cascade?","back":"Each person acts only once enough others have. If nobody's threshold is met by the current count, no one moves, however many people would join at higher counts. The cascade needs an unbroken chain from the lowest thresholds upward.","source":"05-micromotives-and-macrobehavior"},{"id":"c057","module":"m4","type":"explain","front":"Why does a half-launch below critical mass poison the next attempt?","back":"Attendance contingent on expected attendance decays below the crossing, and everyone watches it die. That sets the expectation the next launch must overcome, so the effective threshold rises. Recruit a core above critical mass before announcing.","source":"05-micromotives-and-macrobehavior"},{"id":"c058","module":"m4","type":"explain","front":"Why is Schelling's tipping point the same object as the network-effect curve's unstable point?","back":"Both are the crossing where the fraction willing to act given current adoption equals current adoption, with the curve crossing from above. Below it adoption unravels, above it grows; the population form and the adoption-curve form are one model.","source":"10-networks-crowds-markets"},{"id":"c059","module":"m4","type":"apply","front":"Adoption of architecture decision records has sat at a low share for a year despite reminders and a template. What do you check first?","back":"Is the value of writing contingent on others writing and reading? If the curves cross, you are below critical mass: seed a subgroup. If not-writing dominates everywhere, it is an MPD: a rule or gate. If it is a stable interior mix, stop pushing.","source":"05-micromotives-and-macrobehavior"},{"id":"c060","module":"m4","type":"apply","front":"A weekly cross-team demo goes from twelve attendees to seven to three and dies; nobody changed their mind. Plan the relaunch.","back":"Contingent behaviour below critical mass. Identify low-threshold people and guarantee their presence; recruit a core above the estimated crossing before announcing; make attendance visible so perceived matches real; avoid another half-launch.","source":"05-micromotives-and-macrobehavior"},{"id":"c061","module":"m4","type":"apply","front":"A colleague proposes spreading a practice by recruiting 'the three most influential people'. Apply Schelling.","back":"Influence is secondary. Find the low-threshold actors, those who will adopt when few others have, and ensure no gap at the low end. Prestige decides whom people watch; the threshold distribution decides whether a cascade can run.","source":"05-micromotives-and-macrobehavior"},{"id":"c062","module":"m4","type":"apply","front":"Senior engineers have ended up on one team and juniors on the others; nobody assigned by seniority and everyone says they value mixing. Conclude?","back":"Mild preferences not to be the least experienced in a group, plus free movement, can produce this without anyone wanting it. The homogeneity is weak evidence about attitudes; do not infer intentions from the outcome.","source":"05-micromotives-and-macrobehavior"},{"id":"c063","module":"m4","type":"discriminate","front":"Two curves for daily standup attendance: not-attend is above attend at every level, yet all-attend beats all-skip. Coordination or MPD?","back":"Multi-person PD. There is no crossing, so seeding and communication will not move it; only a rule, monitoring or a side payment does. Calling every problem coordination is the standard misreading.","source":"05-micromotives-and-macrobehavior"},{"id":"c064","module":"m4","type":"discriminate","front":"A team welcomes a new rule, then finds several members follow it only because it is a rule. Was the rule unnecessary?","back":"No. That is the signature of an MPD: each prefers all-comply to all-defect, but defecting dominated individually. The rule gives everyone what nobody would choose alone. Consult on the rule, not on voluntary adoption.","source":"05-micromotives-and-macrobehavior"},{"id":"c065","module":"m4","type":"discriminate","front":"Self-enforcing convention versus a norm that needs a rule: how do you tell them apart and why does it matter?","back":"In a convention, unilateral deviation hurts the deviator, so it needs a focal point, not a policeman. In an MPD, deviation pays, so it needs enforcement. Reserve the enforcement budget for genuine MPDs.","source":"05-micromotives-and-macrobehavior"},{"id":"c066","module":"m4","type":"discriminate","front":"'Card, Mas and Rothstein found real tipping, so Schelling was right that preferences cause segregation.' Sort this out.","back":"They found tipping at roughly 5 to 20 percent minority share (verified), higher where measured tolerance is higher. That supports the dynamic, not the cause: attitudes move the threshold, and institutional drivers the model omits remain in play.","source":"05-micromotives-and-macrobehavior"},{"id":"c067","module":"m5","type":"recall","front":"Name Camerer's three amendments to equilibrium prediction.","back":"Social preferences (fairness, reciprocity), limited iterated reasoning (one to two steps on first contact), and learning (early rounds lock in). Amendments, not a rejection; diagnose which one is operating before intervening.","source":"06-behavioral-game-theory"},{"id":"c068","module":"m5","type":"recall","front":"Quote the ultimatum-game numbers with their hedges.","back":"Mean offer about 40%, mode 40-50% (Oosterbeek et al. 2004, verified; student samples). About half of offers below 20% are rejected (background, approximate; falls at high stakes).","source":"06-behavioral-game-theory"},{"id":"c069","module":"m5","type":"recall","front":"Quote the dictator-game numbers and the caveat that travels with them.","back":"Mean giving about 28%; about 64% give something (Engel 2011, verified). It collapses under double-blind anonymity and shifts with take options and earned endowments: fragile norm compliance, not altruism.","source":"06-behavioral-game-theory"},{"id":"c070","module":"m5","type":"recall","front":"Describe the type distribution the course uses to model a group.","back":"Roughly 30% self-interested, about 50% conditional cooperators, a small tail of altruists (background, varies by game and population). Model the group as a distribution, never a representative agent.","source":"06-behavioral-game-theory"},{"id":"c071","module":"m5","type":"recall","front":"What do the beauty-contest and cognitive-hierarchy results say about first-contact reasoning?","back":"First-round average about 35-36 with p = 2/3 (Nagel 1995, verified); mean thinking steps about 1.5 (Camerer, Ho and Chong 2004, verified). People reason one or two steps about others; play converges with repetition.","source":"06-behavioral-game-theory"},{"id":"c072","module":"m5","type":"recall","front":"What happened in Van Huyck's minimum-effort games as group size changed?","back":"Groups of 14-16 fell to the lowest effort (verified) within about ten rounds (background); fixed pairs reached the highest. Weak-link coordination fails at scale; the aggregation rule and group size are design variables.","source":"06-behavioral-game-theory"},{"id":"c073","module":"m5","type":"explain","front":"What did Blount's computer-generated-offer treatment show, and which model class does it favour?","back":"Rejections of low offers fell sharply when the offer came from a random device instead of a person. People punish inferred intentions, not outcomes alone, favouring reciprocity models over pure outcome-based inequity aversion.","source":"06-behavioral-game-theory"},{"id":"c074","module":"m5","type":"explain","front":"Why did median-effort groups not collapse the way minimum-effort groups did?","back":"Under a median rule one low chooser cannot drag the outcome down; groups lock in on the first-round median. The aggregation rule sets how fragile coordination is to a single defector, and early history matters more than drift.","source":"06-behavioral-game-theory"},{"id":"c075","module":"m5","type":"explain","front":"Why do a group's first few interactions matter disproportionately?","back":"Learning drifts toward equilibrium and stalls, and its direction is set by early rounds; median-effort groups lock in on their first outcome. Seed the first rounds deliberately and give feedback on forgone payoffs.","source":"06-behavioral-game-theory"},{"id":"c076","module":"m5","type":"explain","front":"Why should lab results be used for mechanisms and directions rather than as field point estimates?","back":"61% of 18 top-journal economics experiments replicated, with effects about two-thirds of the originals (Camerer et al. 2016, verified); high-stakes rejections fall; samples are WEIRD. Magnitudes in your group are [H].","source":"06-behavioral-game-theory"},{"id":"c077","module":"m5","type":"apply","front":"A twenty-person on-call rotation is only as good as its least-prepared engineer, and preparation has drifted to the minimum. Rank interventions.","back":"Weak-link game. First: shrink the set whose minimum matters (small pods) or change the aggregation rule. Then grow from a coordinated core with visible history; public leader communication naming the target. A bonus alone is the weakest lever.","source":"06-behavioral-game-theory"},{"id":"c078","module":"m5","type":"apply","front":"A platform splits a fixed reward pool unequally; complaints and exits follow every round. Diagnose.","back":"People punish intended unfairness far more than rule-based or unlucky outcomes. The problem is the perceived proposer's choice, not inequality as such. Make the rule impersonal and public before contributions; use a lottery for any discretionary part.","source":"06-behavioral-game-theory"},{"id":"c079","module":"m5","type":"apply","front":"A manager cites lab gift exchange to justify above-market pay for sustained extra effort. What does the evidence support?","back":"Positive reciprocity to a raise is real but weak and decays within hours in the field (Gneezy and List 2006, verified); negative reciprocity to cuts and broken promises is strong. Do not budget on durable extra effort.","source":"06-behavioral-game-theory"},{"id":"c080","module":"m5","type":"apply","front":"A new community's first credit-allocation round is contested; the founders say it will settle with experience. Which amendment, and what to do?","back":"Learning, but the steady state is path-dependent, not automatic. Seed the first rounds deliberately, make the rule public, and give feedback on what each choice would have earned. Waiting locks in the contested pattern.","source":"06-behavioral-game-theory"},{"id":"c081","module":"m5","type":"discriminate","front":"'Dictator giving proves people are altruists.' Correct this.","back":"Giving is fragile, observation-dependent norm compliance: it collapses under double-blind anonymity and shifts with take options. Reciprocity and cued norm compliance drive cooperation; unconditional altruists are a small minority.","source":"06-behavioral-game-theory"},{"id":"c082","module":"m5","type":"discriminate","front":"'Fairness is a universal fifty-fifty.' What do the cross-cultural games actually show?","back":"Mean offers across small-scale societies ran from about 26% to about 58% (Henrich et al. 2001, verified). The disposition to have norms is universal; the content is not. Market integration correlates with fairer offers; causality is unresolved.","source":"06-behavioral-game-theory"},{"id":"c083","module":"m5","type":"discriminate","front":"Coordination failure as a payoff problem versus strategic uncertainty: which is it in weak-link and stag-hunt games?","back":"Strategic uncertainty plus history. Payoffs already favour cooperation; people fear others will play safe. Fixes are informational and social: talk, leadership, focal labels, gradual growth. Money is the last lever, not the first.","source":"06-behavioral-game-theory"},{"id":"c084","module":"m6","type":"recall","front":"Define payoff dominance and risk dominance.","back":"Payoff dominant: the equilibrium best for all if reached. Risk dominant: the best reply against an opponent equally likely to play either way, i.e. the equilibrium with the larger basin of attraction.","source":"07-stag-hunt"},{"id":"c085","module":"m6","type":"recall","front":"State the risk-dominance rule with its conditions and the levers that make payoff dominance reachable.","back":"Risk dominance wins under random mixing, best-response updating, large groups and no communication. Payoff dominance is reachable through correlation: small stable groups, success-visible imitation, public pledges, gradual growth, lower cost of being the lone cooperator.","source":"07-stag-hunt"},{"id":"c086","module":"m6","type":"recall","front":"What is 'correlation of interactions' and why is it Skyrms's master variable?","back":"Any departure from random matching that makes like meet like (location, signals, partner choice). Every mechanism in the book works by making stag hunters meet stag hunters more than chance, which expands the cooperative basin.","source":"07-stag-hunt"},{"id":"c087","module":"m6","type":"recall","front":"What are replicator dynamics a model of?","back":"Success-biased imitation: a strategy's share grows in proportion to its payoff advantage over the population average. It is what 'the group learns' means in these models; agents have no beliefs.","source":"07-stag-hunt"},{"id":"c088","module":"m6","type":"recall","front":"In the illustrative stag hunt (stag/stag 4, stag/hare 0, hare 3), where is the watershed, and what moves it to one half?","back":"The watershed is three quarters stag hunters. Raising the lone-cooperator payoff (stag against hare) from 0 to 2 moves it to one half. Illustrative numbers from the book file, not evidence.","source":"07-stag-hunt"},{"id":"c089","module":"m6","type":"explain","front":"Why does cutting the cost of being the lone cooperator move the watershed more than sweetening the joint outcome?","back":"The watershed is set by how badly a cooperator does against a defector relative to the joint gain. Raising the joint payoff helps only when cooperators already meet; raising the lone-cooperator payoff shrinks the loss in every mismatched encounter.","source":"07-stag-hunt"},{"id":"c090","module":"m6","type":"explain","front":"Why does local interaction help cooperation under imitate-the-best but not under best response?","back":"Best responders react to the neighbourhood mix, and the risk-dominant strategy is a best reply to any sufficiently mixed one (Ellison 1993). Imitators copy the most successful visible agent; a stag hunter inside a cluster earns the high payoff and gets copied at the boundary.","source":"07-stag-hunt"},{"id":"c091","module":"m6","type":"explain","front":"Why does cheap talk expand the stag basin but not rescue a true PD?","back":"In a stag hunt a handshake signal lets cooperators find each other during the transition, and once there the signal can become uninformative without harm. In a PD a mimic who signals and defects earns more and invades, so talk decays without sanctions.","source":"07-stag-hunt"},{"id":"c092","module":"m6","type":"explain","front":"Why is the ratio of structural to strategic adaptation speed decisive?","back":"If partnerships re-sort faster than behaviour is re-evaluated, cooperators associate first, out-earn hare hunters, and get imitated. If behaviour is re-judged while matching is still near random, cooperators see poor payoffs and switch before association can help.","source":"07-stag-hunt"},{"id":"c093","module":"m6","type":"apply","front":"One hundred agents, sixty stag hunters, random matching, success-biased imitation, illustrative payoffs 4/0/3. Predict, and reverse it.","back":"Sixty percent is below the three-quarter watershed, so the population goes to all-hare. Reverse by raising the lone-cooperator payoff to 2 (watershed one half) or by correlating matching so stag hunters meet each other.","source":"07-stag-hunt"},{"id":"c094","module":"m6","type":"apply","front":"A large org rotates everyone across teams every quarter to spread cooperation norms faster. Predict.","back":"Slower or failed spread. Rotation destroys the correlation that lets cooperators meet cooperators and forces re-evaluation of strategies before association can help. Random mixing is the regime under which cooperation is hardest.","source":"07-stag-hunt"},{"id":"c095","module":"m6","type":"apply","front":"A pilot cluster of cooperators sits inside a group whose habit is 'do what most people here do'. What happens?","back":"It gets swamped. Majority-copying looks at what the neighbourhood does, not at who thrives, so boundary members see a defecting majority and defect. Only success-copying lets a cluster convert its boundary; make the pilot's success visible first.","source":"07-stag-hunt"},{"id":"c096","module":"m6","type":"apply","front":"Rolling out blameless post-mortems across forty people, where it is a stag hunt. Set the pacing rule.","back":"Start in two stable teams; make their outcomes visible so success-copying can operate; a public opt-in pledge as a transient handshake; let people join the pilot before the org evaluates it. Evaluate only after the cluster's interior is stable.","source":"07-stag-hunt"},{"id":"c097","module":"m6","type":"discriminate","front":"'Adopting the standard is obviously rational, so teams that refuse are irrational.' What is the correction?","back":"Under uncertainty about the other team, the safe choice is defensible. The failure is structural (basin size) and so is the fix. Never say the efficient equilibrium is the rational one; never say the hold-outs are selfish.","source":"07-stag-hunt"},{"id":"c098","module":"m6","type":"discriminate","front":"Conformist transmission versus success bias: which one spreads cooperation from a cluster?","back":"Success bias (imitate-the-best) does; conformist transmission (copy the majority) does not, because boundary members act on what most neighbours do. State the learning rule every time clustering is invoked.","source":"07-stag-hunt"},{"id":"c099","module":"m6","type":"discriminate","front":"'Skyrms shows cooperation evolves naturally, so institutions are unnecessary.' What is wrong?","back":"The results hold for stag hunts under specific learning rules and structures; they do not rescue true PDs, they need success-biased learning, and under noisy best response risk dominance is long-run stable. Pair Skyrms with Ostrom and Bicchieri.","source":"07-stag-hunt"},{"id":"c100","module":"m6","type":"discriminate","front":"'Pledges only work if they are binding.' What do the models and experiments say?","back":"Pledges in every relevant model and experiment are non-binding, and they still raise stag hunting. What matters is game shape: in a stag hunt the handshake correlates cooperators; in a PD it needs sanctions or repetition behind it.","source":"07-stag-hunt"},{"id":"c101","module":"m7","type":"recall","front":"Define a social norm in Bicchieri's sense.","back":"A rule people prefer to follow on condition that they expect enough others to follow it (empirical expectation) and believe enough others expect them to (normative expectation, possibly sanction-backed). A conditional preference keyed to two expectations.","source":"08-grammar-of-society"},{"id":"c102","module":"m7","type":"recall","front":"Give the four-way norm taxonomy and the expectations each needs.","back":"Descriptive norm: empirical expectations only. Convention: a descriptive norm that is also a coordination equilibrium, so self-enforcing. Social norm: empirical plus normative expectations. Moral norm: neither; followed unconditionally.","source":"08-grammar-of-society"},{"id":"c103","module":"m7","type":"recall","front":"What is pluralistic ignorance?","back":"Most people privately reject a norm but believe most others accept it, and comply. Each infers others' approval from others' compliance, which is driven by the same inference. The norm is a shared misperception.","source":"08-grammar-of-society"},{"id":"c104","module":"m7","type":"recall","front":"What is a trendsetter, and what is a reference network?","back":"Trendsetter: a first mover with low sensitivity to the norm, high autonomy and enough visibility to be credible; the lever for collapsing a bad norm. Reference network: the people whose expectations actually matter to a person; the unit at which to measure and change norms.","source":"08-grammar-of-society"},{"id":"c105","module":"m7","type":"recall","front":"What four items does the two-step expectation measurement ask, plus one?","back":"What do you do; what do most others do; what do most others think you should do; what happens if you do not. Plus a sanction item. Validated but design-sensitive (Bicchieri and Xiao 2009).","source":"08-grammar-of-society"},{"id":"c106","module":"m7","type":"explain","front":"Why does a convention need no normative expectations while a social norm does?","back":"A convention is a coordination equilibrium: given others conform, conforming is already in your interest. A social norm prescribes behaviour against your interest in the underlying mixed-motive game, so only the belief that others expect and may sanction compliance makes conforming preferable.","source":"08-grammar-of-society"},{"id":"c107","module":"m7","type":"explain","front":"How does a norm turn a PD into a stag hunt without changing material payoffs?","back":"With norm-based utility, deviation costs k times the largest loss imposed, but only when the norm is expected to apply. If k is high enough, mutual cooperation becomes an equilibrium beside mutual defection. In the illustrative PD (3,3)/(0,5)/(5,0)/(1,1), k of at least two thirds suffices. Lapsed expectations revert the game.","source":"08-grammar-of-society"},{"id":"c108","module":"m7","type":"explain","front":"Why does ten minutes of relevant talk raise public-goods cooperation, on Bicchieri's account?","back":"It creates or makes salient the empirical and normative expectations a cooperation norm needs: people learn others intend to cooperate and expect them to. Cooperation roughly doubled in Dawes et al. 1977 (background). Only relevant talk works; identity accounts cannot explain that.","source":"08-grammar-of-society"},{"id":"c109","module":"m7","type":"explain","front":"Why are cascades both the engine of bad norms and a reason for optimism?","back":"A cascade aggregates almost no private information, since later actors ignore their own signals, so an unpopular norm can spread fast. By the same token it is fragile: a credible public signal or a visible cluster of deviators can reverse it quickly.","source":"08-grammar-of-society"},{"id":"c110","module":"m7","type":"apply","front":"Every engineer wrote thorough PR descriptions; a new lead writes terse ones and within a month everyone does. What kind of norm was it?","back":"A descriptive norm sustained by empirical expectations only. When the visible behaviour changed, the expectation changed and the practice flipped. A social norm with normative expectations would have sanctioned or ignored the deviation.","source":"08-grammar-of-society"},{"id":"c111","module":"m7","type":"apply","front":"Most of a team privately think weekend messages are inappropriate, most believe colleagues think they are fine, most send them. Diagnose and prescribe.","back":"Pluralistic ignorance. Publish the measured gap credibly to correct normative expectations; recruit a visible trendsetter to stop sending, shifting empirical expectations; consider a coordinated simultaneous switch to remove first-mover cost.","source":"08-grammar-of-society"},{"id":"c112","module":"m7","type":"apply","front":"A rule says 'cite sources'; most posts do not; asked privately, members say others do not care. Classify and choose the lever.","back":"A dead rule: neither empirical nor normative expectations support it, so it is not a social norm being violated. Create both, starting with visible compliance by credible members and expressed expectations. Do not publish that most posts lack sources.","source":"08-grammar-of-society"},{"id":"c113","module":"m7","type":"apply","front":"'No blame in post-mortems' holds after the manager who introduced it leaves and the new one visibly blames. Conclude?","back":"It survived a collapse of expectations, so for these members treat it as internalised or moral. That is the course's operational test; it does not prove norms are generally internalised, a debate that remains open.","source":"08-grammar-of-society"},{"id":"c114","module":"m7","type":"discriminate","front":"Descriptive norm versus social norm: why does the difference decide the intervention?","back":"A descriptive norm flips when the visible majority changes, so change what is visible. A social norm needs normative expectations and can persist while widely violated, so measure and shift what people believe others expect. 'What most do' is never a social norm by itself.","source":"08-grammar-of-society"},{"id":"c115","module":"m7","type":"discriminate","front":"Norms as internalised values versus norms as conditional preferences: what does each imply for a values workshop?","back":"If a norm is conditional, a values workshop targets the wrong thing; expectations are the lever. Assume conditional until the norm survives a collapse of expectations. Only then treat it as internalised.","source":"08-grammar-of-society"},{"id":"c116","module":"m7","type":"discriminate","front":"'A taste for fairness of fixed size' versus cued norm compliance: which does the evidence support, and what caveat remains?","back":"Fair behaviour varies with anonymity, entitlement, wiggle room and information about others, which a fixed taste cannot explain; cue-dependence is [E]. Norm-based utility is the working model, argued from fit not shown to beat inequity aversion, and a substantive fairness concept is still needed.","source":"08-grammar-of-society"},{"id":"c117","module":"m7","type":"discriminate","front":"Script activation versus behavioural priming: why must the course keep them apart?","back":"Behavioural priming (elderly words, money images) failed to replicate; never build on it. Bicchieri's claim is that situational cues select a stored script carrying a norm, which is more robust, but any specific cue-to-norm mapping is still [H].","source":"08-grammar-of-society"},{"id":"c118","module":"m8","type":"recall","front":"Define a common-pool resource and distinguish appropriation from provision problems.","back":"A CPR has subtractable units and costly exclusion. Appropriation: who takes how much of the flow (assignment, timing). Provision: who maintains the stock (contribution, free-riding on upkeep). Real problems mix both and need rules for both.","source":"09-governing-the-commons"},{"id":"c119","module":"m8","type":"recall","front":"Name the three levels of rules with an example of each.","back":"Operational: the daily rotation of fishing spots. Collective-choice: the meeting that can change the rotation. Constitutional: the law and state tolerance that give the group standing to bind its members. Most stalled reforms fail at the middle level.","source":"09-governing-the-commons"},{"id":"c120","module":"m8","type":"recall","front":"List the eight design principles in Cox's split version.","back":"Boundaries of users and of the resource; congruence with local conditions and proportionality of costs to benefits; collective-choice arrangements; monitoring of users and of the resource; graduated sanctions; conflict-resolution mechanisms; recognised right to organise; nested enterprises.","source":"09-governing-the-commons"},{"id":"c121","module":"m8","type":"recall","front":"What is quasi-voluntary compliance?","back":"Complying on condition that most others comply and violators are likely to be caught. Commitment is contingent and fed by visible compliance; it is Bicchieri's conditional preference in field clothing.","source":"09-governing-the-commons"},{"id":"c122","module":"m8","type":"recall","front":"What did Cox, Arnold and Villamayor-Tomás (2010) conclude, and with what caveats?","back":"Across 91 studies (verified) the principles were well supported; they split boundaries, congruence and monitoring into two each. Caveats: publication bias, qualitative coding, and the principles capture structure, not processes like trust and legitimacy.","source":"09-governing-the-commons"},{"id":"c123","module":"m8","type":"explain","front":"Why are first-offence sanctions in durable systems small rather than large enough to make cheating unprofitable?","back":"Compliance is contingent. A small first sanction tells the violator they were seen and tells everyone the rule is alive, preserving the expectation that most comply. Harsh first sanctions drive violations and reports underground; escalation is held for repeat offenders.","source":"09-governing-the-commons"},{"id":"c124","module":"m8","type":"explain","front":"Why does Ostrom treat monitoring and commitment as one problem?","back":"A person's commitment is contingent on believing others comply and violations are likely detected; monitoring generates that belief. People monitor because they benefit from knowing whether their own contingent compliance is warranted. Neither is explicable alone.","source":"09-governing-the-commons"},{"id":"c125","module":"m8","type":"explain","front":"Why is the tragedy of the commons a tragedy of open access rather than of shared property?","back":"Hardin, the PD and Olson assume no communication, no rule-making, no monitoring, no shared future. Where those exist, participants move themselves into a different game. The PD is valid for open access; as a law of nature it is wrong.","source":"09-governing-the-commons"},{"id":"c126","module":"m8","type":"explain","front":"How did the California groundwater basins escape a pumping race without an authority writing the rules?","back":"Incrementally: a lawsuit using a state referee produced shared data; a negotiated judgment defined shares; a court-appointed watermaster; associations as entrepreneurs; districts under enabling law. The state lowered information and enforcement costs; the pumpers designed the rules.","source":"09-governing-the-commons"},{"id":"c127","module":"m8","type":"apply","front":"An org shares a CI cluster; queues are long; the platform team plans per-team quotas with automatic lockout. Predict and propose.","back":"An operational rule imposed from outside, an unaccountable monitor, a nuclear first sanction: expect gaming and hidden workarounds. Instead make usage visible as a by-product of the queue, give affected teams a forum to set and change the rule, and warn before locking out.","source":"09-governing-the-commons"},{"id":"c128","module":"m8","type":"apply","front":"An online community's moderation is run entirely by platform staff; complaints about inconsistent bans are rising. Run the checklist.","back":"Missing: collective-choice (members cannot change rules), accountable monitoring, graduated sanctions, a cheap dispute forum; right to organise ambiguous. Scope flag: attention and civility are not subtractable, so reinterpret boundaries and congruence.","source":"09-governing-the-commons"},{"id":"c129","module":"m8","type":"apply","front":"A new rota rule everyone agrees is better has stalled for a year. Where do you look first?","back":"The collective-choice level: do the people bound by the rota have a legitimate, low-cost way to change it, and does anyone outside recognise their right to? Rewriting the operational rule more clearly will not move it.","source":"09-governing-the-commons"},{"id":"c130","module":"m8","type":"apply","front":"A team's first response to a missed on-call handover is a formal HR warning. Six months later nobody reports handover problems. What happened?","back":"A nuclear first sanction drove violations and reports underground and eroded the information flow monitoring depends on. Silence is not compliance. Replace with a small, quick, public first response and scheduled escalation.","source":"09-governing-the-commons"},{"id":"c131","module":"m8","type":"discriminate","front":"The eight principles as a recipe versus as a diagnostic checklist: which is defensible, and why?","back":"Checklist. Cases were selected on the dependent variable and the principles specify no rules; durable commons run different rules under the same conditions. Use them to name what is missing, never to install features.","source":"09-governing-the-commons"},{"id":"c132","module":"m8"
