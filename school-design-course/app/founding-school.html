ore intensively in Year 8.","Return to it in later years (for example Years 9 and 11), explicitly confronting the need-based explanation each time with generative diagnostics and delayed tests.","Accept it; the test showed they learned it."],"answer":2,"diagnoses":["A maturational theory of conceptual change. The evidence runs the other way: some mechanisms can be taught to 5-8-year-olds before teleology entrenches.","A dosage theory: cover it once but harder. Suppression means the old theory resurfaces unless the new one is repeatedly exercised.","Correct. Intuitive theories are suppressed, not deleted, so the curriculum must spiral with increasingly demanding diagnostics.","Performance-equals-learning. The end-of-unit test measured 'can repeat', not whether the model wins over time."]},{"q":"A student says she 'believes in evolution' and uses the phrase 'natural selection' correctly. What can you conclude about her understanding?","options":["She understands it; acceptance and correct terminology show the model has changed.","Little; you need to see her explain a case starting from a population with variation, because acceptance and understanding are only weakly related.","She misunderstands it, because students who accept evolution usually reason incorrectly.","Nothing can be concluded without a standardized test."],"answer":1,"diagnoses":["Treats acceptance and vocabulary as understanding. Shtulman (2006) found most adults who accepted evolution still reasoned transformationally.","Correct. Ask for a mechanism ('cheetahs got faster; explain how, starting from a population of slower cheetahs') and listen for variation and differential reproduction versus need.","Overcorrects. Acceptance does not predict misunderstanding; it simply does not predict understanding.","A well-designed generative question in class tells you more than a standardized test that may reward terminology."]},{"q":"A Year 10 student solves textbook force problems correctly but, on a new question about a ball thrown upward, says a force pushes it up while it rises. What is the most useful reading?","options":["She has forgotten the unit and needs to reread her notes.","The scientific concept does not yet have the span to work across contexts; the impetus intuition is still cued here, so she needs varied-context practice, predictions and diagrams, and a return to the concept later.","The question was unfair because it was not like the textbook problems.","She has a learning difficulty with abstract reasoning."],"answer":1,"diagnoses":["Treats a model problem as a storage problem; rereading builds familiarity, not a model that wins in new contexts.","Correct. This is the 'can repeat versus model changed' gap (Clement 1982 found the same in engineering students). Probe across contexts and treat the hybrid state as expected.","The new context is exactly what reveals whether the model changed; surface-matched tests hide the problem.","Attributes a near-universal pattern, seen even in physics-trained adults, to an individual deficit."]}],"brief_prompt":"Add a 'core concepts spiral' section to the brief: list five intuitive theories the school will explicitly confront, the change type each needs, at what ages, the diagnostic question, and the anomaly or mechanism you will use. Add your definition of mastery and a line on understanding versus acceptance. Tag each item. Then identify one intuitive theory about schooling in Brief v0 that Modules 1-2 have already disturbed, and write two sentences on what replaced it.","deeper":["books/02-scienceblind.md#The core distinction: \"can repeat the explanation\" vs. \"the model has changed\"","books/02-scienceblind.md#Ch 1 — Why We Get the World Wrong","books/00-foundational-papers.md#5. Chi — Three types of conceptual change (2008) and ICAP (Chi & Wylie 2014)","books/00-foundational-papers.md#6. Vosniadou & Brewer (1992) — mental models of the earth / framework theory","books/00-foundational-papers.md#4. Posner, Strike, Hewson & Gertzog (1982) — accommodation of a scientific conception","books/13-learning-scientific-concepts.md#Ch 6 — A Unified Theory of Conceptual Change in Science Learning (the core chapter)"]},{"id":"m3","num":3,"title":"Curiosity, motivation, and the adolescent mind","level":"Minds","minutes":90,"sources":["03-intellectual-lives-of-children","05-10-to-25","00-foundational-papers","12-why-we-remember"],"hook":"In a classic British study, the same four-year-olds were recorded at home and at nursery school. At home they asked something like 26 questions an hour. Guess the rate at school. Then guess: in a seventh-grade essay study, adding one sentence to the teacher's critical comments changed how many students chose to revise. From what to what?","attempt":{"prompt":"A 15-year-old has stopped doing work in your school's maths class. Her teacher's current message is: 'I'm not going to keep chasing you. It's your choice.' Rewrite the teacher's next conversation with her (what he says first, what he asks, what he offers, what he insists on). Then explain in two sentences what you changed and why. Write it before reading on.","minutes":12},"objectives":["Explain curiosity as an information-gap state that improves memory for its target, including the timing and the limits found in follow-up studies.","Describe what children's intellectual lives look like (inquiry, invention, ideas) and which adult and school behaviours amplify or suppress them.","Diagnose an adult's interaction with a teenager as enforcer, protector or mentor, and rewrite it using transparency, questioning, stress reappraisal, purpose or belonging.","State honestly what the evidence on growth mindset, belonging and wise feedback does and does not show, and why context decides whether brief interventions work."],"ideas":[{"title":"Curiosity is an information-gap state that helps memory for its target","tag":"E","body":"Curiosity is not just a pleasant mood; it changes what gets encoded. Gruber, Gelman and Ranganath (2014) had adults rate trivia questions for how curious they were about the answer, then answer them in an fMRI scanner. After each question came a waiting period of about 14 seconds before the answer, and during the wait an **unrelated face** appeared. A surprise memory test followed.\n\nFindings: answers to high-curiosity questions were remembered much better (roughly 71% versus 54% recall immediately, with the advantage persisting a day later). Faces seen during high-curiosity waits were also recognized better, but only modestly (roughly 42% versus 38%). During high-curiosity anticipation, activity rose in the midbrain dopaminergic region and the nucleus accumbens, reward-related areas, and midbrain-hippocampus connectivity predicted who got the incidental benefit. The interpretation: curiosity sets up a reward-anticipation state that improves hippocampal encoding for a short window.\n\nThe follow-ups are where the design rules come from:\n\n- **Stare and colleagues (2018)** replicated the benefit for answers and faces at a 12-hour delay; post-learning sleep did not increase it.\n- **Murphy and colleagues (2021)** varied when the face appeared. The incidental benefit showed up **only for faces shown shortly after the question**, when curiosity is first elicited, not later in the wait or around the answer. The halo is brief.\n- **Galli and colleagues (2018)** found the incidental effect in older adults in one experiment but not a second.\n- **Keller, Salvi, Leiker, Gruber and Dunsmoor (2024)**: when the unrelated material was **complex school-like facts** (science, English, history) instead of faces, memory for those facts was **worse** after high-curiosity questions. An open question pulls attention toward itself and can crowd out nearby unrelated content.\n\nLimits: adults, small scanner samples, trivia questions; the dopamine role is inferred from brain activity, not measured directly; curiosity was selected, not manipulated. Children and adolescents may differ (Fandakova and Gruber 2021).\n\nSo the robust, usable finding is narrower than the popular version: **curiosity reliably helps memory for the thing you are curious about.** Four design rules follow:\n\n1. **Put the learning objective inside the gap.** Pose the puzzle, have students predict, then deliver the answer, which *is* the content you need them to learn. Your hook for this module was built that way.\n2. **Do not use unrelated attention-grabbers** before dense content in the hope that the curiosity \"spills over\"; with school content it may do the opposite.\n3. **Keep the payoff close.** Put the key material near the moment the gap opens and closes, not after a long wait.\n4. **Curiosity needs knowledge.** You can only notice a gap in something you partly understand. A knowledge-rich curriculum is not the enemy of curiosity; it is its fuel.\n\nThis connects to earlier modules. Posner's \"dissatisfaction\" and Ranganath's **prediction error** (the gap between what you expected and what happened) are close relatives of the curiosity state. A committed prediction that fails, followed promptly by explanation, combines all three."},{"title":"Children's intellectual lives, and how school quietly turns them down","tag":"H","body":"Engel's *The Intellectual Lives of Children* argues that young children do real intellectual work, continuous with adult science, invention and philosophy, and that schools mostly reward them for answering adults' questions instead of developing their own. She organizes that work into three modes:\n\n- **Inquiry**: asking questions, looking, collecting, sorting. A child's bug collection is a dataset: classification, variation, categories. Young children ask many questions and a large share are requests for explanation; when they get a non-answer, they re-ask or offer their own (Frazier, Gelman and Wellman 2009; Chouinard 2007).\n- **Invention**: acting on materials, tinkering, repeating with small variations. A boy scooping mud is running informal experiments. Preschoolers explore more when evidence about how a toy works is ambiguous (Schulz and Bonawitz 2007).\n- **Ideas**: building and revising explanations of abstract things (death, fairness, infinity, what is alive), mostly through extended conversation. Engel's key distinction is between *having* a thought and *pursuing* an idea: returning to it, testing it, extending it over weeks.\n\n**The warning.** Tizard and Hughes (1984) recorded the same four-year-old girls at home and at nursery school: about 26 questions an hour at home versus about 2 at school. In observation logs from Engel's earlier work, kindergarten classes showed a few curiosity episodes per two-hour stretch, and some fifth-grade classrooms went two hours without a single question to the teacher. **Evidence limits:** these are small, older or hand-coded samples; the decline is correlational and may partly reflect development (older children ask fewer questions aloud). Treat it as a strong hypothesis to test in your own school, not a proven effect of schooling.\n\n**The adult is the lever.** Small experiments from Engel's lab found children's curiosity rose or fell with the adult's visible curiosity. And one of the most important studies in this course for a designer: **Bonawitz and colleagues (2011), \"the double-edged sword of pedagogy.\"** When an adult deliberately demonstrated one function of a novel toy, children copied it and discovered fewer of its other functions than children who saw the function by accident. **Instruction transmits efficiently and narrows exploration.** Neither is bad; the choice should be deliberate: demonstrate when the goal is a specific skill, hold back when the goal is exploration.\n\n**Engel's institutional proposal: the Idea Workshop.** A recurring, protected block (for example two or three sessions a week) where small groups develop an idea over many weeks. Children shape the question; teachers coach, provoke and bring materials and expertise; progress is recorded and shared publicly; work is judged by portfolio or exhibition rather than grades. It is not free play and not a project with a preset product. Her key argument is structural: curiosity-friendly teaching left to individual teachers is squeezed out by coverage and testing, so it must be timetabled to survive.\n\n**How to hold this alongside Modules 1-2.** The workshop is [V] (children deserve an intellectual life at school) and [H] (no controlled evaluation shows its effects). It sits beside a knowledge-rich core, not in place of it; Engel herself treats knowledge as the fuel for ideas. Two cheap moves: **audit student-originated questions per hour** in sampled lessons as a leading indicator [H], and give every class a **question parking lot** with scheduled time to take questions up, so following a question does not require derailing a lesson. Watch the equity risk: open-ended time favours children with more background knowledge unless it is scaffolded."},{"title":"Adolescents run on status and respect: enforcer, protector, mentor","tag":"E","body":"Yeager's *10 to 25* starts by rejecting the dominant adult story about adolescents: the \"bad brain\" or incompetence model, in which teenagers are impulsive and irrational because of an immature prefrontal cortex and must therefore be controlled or shielded. His alternative is that young people from roughly 10 to 25 are **exquisitely sensitive to status and respect** because they are developmentally tuned to learn how to earn a place in the social world. They are constantly reading adult signals: am I being treated as a child to be managed, or as a capable person?\n\nThis explains why so many adult-designed programs for adolescents fail. Yeager, Dahl and Dweck (2018) argued that anti-bullying, anti-drug and healthy-eating lectures often fail because they disrespect young people's desire for status and autonomy. In a frequently cited experiment (Bryan, Yeager and colleagues 2016), framing healthy eating as a way to **rebel against manipulative food marketers** (aligning with teenagers' values) led eighth graders to make healthier snack choices than standard health messaging did. The motivation problem was a respect problem.\n\n**The 2x2.** Adults vary on two axes: **standards** (how high the bar) and **support** (how much help, warmth and scaffolding).\n\n- **Enforcer**: high standards, low support. \"My way or the highway.\" Treats struggle as laziness; relies on pressure and punishment. Feels rigorous; produces resentment, disengagement and gaming.\n- **Protector**: high support, low standards. Lowers the bar to spare feelings; rescues students from difficulty. Feels kind; communicates \"I don't think you can do this.\"\n- **Mentor**: high standards and high support. \"This is hard, I believe you can meet it, and I'll help you get there.\"\n\nThe key insight is that **the enforcer and the protector both disrespect young people, from opposite directions**: one disrespects their autonomy and dignity, the other their competence. And most adults do not sit in one quadrant; they **toggle**, protector until frustrated, then enforcer. The mentor stance is a stable position, not a midpoint, and it is learnable if adults have concrete scripts to fall back on when tired.\n\nYeager adds that adults in every era believe \"kids these days\" are worse, a belief that pushes them toward enforcer or protector behaviour and confirms young people's suspicion that adults do not respect them.\n\n**Why this is a design tool.** The 2x2 is the single most usable audit in the book. Run every routine through it: homework policy, late-work policy, discipline ladder, grading, remedial tracking, college counselling. \"Any late assignment gets a zero\" is enforcer. \"Late work accepted anytime, no penalty\" is protector. A mentor version keeps the standard (the work must meet the bar), explains why deadlines matter, asks what got in the way, and sets a concrete support plan and new deadline.\n\n**Evidence status.** Adolescent sensitivity to social evaluation and status is broadly supported. The 2x2 itself is a synthesis, drawing on correlational parenting-style research (Baumrind's authoritative versus authoritarian and permissive styles) and on the specific experiments in the next idea. \"Mentor-mindset training for teachers improves outcomes at scale\" has not been shown by large trials. Tag the stance [E] for its mechanisms, [H] as a whole-school program."},{"title":"The mentor's toolkit: five practices with experiments behind them","tag":"E","body":"Yeager turns the mentor mindset into five practices. Each has at least one experiment behind it, with different strength.\n\n**1. Transparency: say why.** Critical feedback is ambiguous to the recipient: it could mean \"you are capable\" or \"this adult is biased against me or thinks I'm weak.\" Young people fill the gap with the worst reading. In the **wise feedback** study (Yeager, Purdie-Vaughns, Garcia, Cohen and colleagues 2014), seventh graders' essays came back with teacher critique plus a note. In the treatment condition the note said, in effect, *I'm giving you these comments because I have high standards and I know you can meet them*; the control note was bland. Among African American students, about **71% revised** with the wise note versus **about 17%** in control. Effects were smaller for White students, whose baseline trust was higher, and largest for students who most distrusted school. It built on Cohen, Steele and Ross (1999). **Strength:** a well-designed randomized field experiment with a large, coherent effect, but in small samples; large direct replications are limited.\n\n**2. Questioning: ask, don't tell.** Lecturing is status-threatening; sincere questions (\"What were you trying to do? What's your plan for meeting this bar?\") confer respect, give the adult information, and move ownership to the student while the standard stays fixed. Fake Socratic questions are detected instantly. A related experiment: Okonofua, Paunesku and Walton (2016) found a brief intervention encouraging middle-school teachers to understand students' perspectives during misbehaviour roughly **halved suspension rates** over the year.\n\n**3. Stress: reinterpret it, don't remove it.** A racing heart read as \"I can't handle this\" shifts the body toward a threat response; read as \"my body is gearing up,\" toward a challenge response. Yeager and colleagues (2022, *Nature*) found a brief online **synergistic mindsets** intervention (growth mindset plus stress-can-be-enhancing) improved cardiovascular and cortisol responses to a social stressor and some academic outcomes. Strong design, relatively new, mostly one lab. Protectors remove the stress by lowering the bar; enforcers say \"toughen up\"; mentors keep the demand and teach the reappraisal.\n\n**4. Purpose: give a self-transcendent reason.** Students who reflected on how their learning could help others persisted longer on tedious maths problems and, in a field study, modestly improved grades (Yeager and colleagues 2014, \"Boring but important\"). Purpose also confers status: being someone whose work matters.\n\n**5. Belonging: normalize the worry.** At transitions, students ask \"do people like me belong here?\" and read setbacks as proof they do not. Effective belonging interventions do not say \"you belong\"; older peers tell stories showing the worry is **common and temporary**. Walton and Cohen (2011) found a brief intervention raised first-year Black college students' grades over three years. But a 22-institution replication (Walton, Murphy, Logel, Yeager and colleagues 2023) found effects concentrated where the context actually afforded belonging. Context-dependent.\n\n**The trap: script-ification.** Pasting the wise-feedback sentence onto every comment turns it into boilerplate. It works because it is **credible**: backed by genuinely high standards, specific feedback, real support and a real chance to revise. Contradicted by other practices (no revision allowed, low expectations elsewhere), it may be ignored or read as insincere. Train the stance and the moves, and make the surrounding policies (revision, support plans) consistent with them."},{"title":"Motivation follows competence, and seeds need soil","tag":"E","body":"A common founder belief is that motivation must be built before you can teach a disengaged student. The evidence mostly runs the other way: **motivation is largely downstream of competence and of how students interpret their experience.**\n\n**Self-efficacy** (Bandura 1977) is a person's belief that they can succeed at a *specific* task. It predicts what students choose, how hard they try and how long they persist. Its strongest source is **mastery experience**: actually succeeding at something hard. Vicarious experience (seeing similar peers succeed), persuasion and emotional state matter less. Empty praise is seen through. So the most reliable route to confident students is to make them competent through carefully sequenced success; Rosenshine suggests practice should run at a high success rate, around 80%.\n\n**Attributions** (Weiner) matter too. Explaining failure by stable, uncontrollable causes (\"I'm not a maths person\") produces helplessness; explaining it by controllable, changeable causes (strategy, effort, practice) sustains persistence. Teachers send attributional signals without meaning to: unsolicited help, heavy sympathy for failure, or easy praise can all say \"you are low ability.\" Train attributional feedback: \"you don't have the strategy yet; try this.\"\n\n**Growth mindset: what the evidence actually says.** Dweck's work on implicit theories of intelligence became an education fad. The strongest single study is the **National Study of Learning Mindsets** (Yeager and colleagues 2019, *Nature*): a nationally representative sample of more than 12,000 US ninth graders in 65 public high schools, a less-than-one-hour online program, preregistered with independent data collection and analysis. Lower-achieving students' grades rose by about a tenth of a grade point, poor-performance rates fell modestly, and more students took harder maths the next year. **Effects were larger where peer norms supported challenge-seeking**, weak or absent where they did not, and later analyses found the maths effect appeared mainly in classrooms whose teachers held growth-mindset beliefs.\n\nThe wider literature is contested. Sisk and colleagues (2018) found small average effects. Macnamara and Burgoyne (2023) found little to no average effect in high-quality studies and flagged confounds and incentive conflicts. Burnette and colleagues (2023) and Tipton and colleagues (2023) found small effects concentrated in at-risk groups and supportive contexts. The UK EEF school trial found no attainment effect. **Fair summary:** growth-mindset messages are not a general achievement booster; they may help some struggling students where the environment supports the message. Yeager is a lead author of the positive studies; read his account knowing he has a stake.\n\nYeager's own conclusion is the institutional one: **interventions are seeds; context is soil.** A brief student-directed program works only where teachers and peer norms reinforce it. So do not buy a mindset program and declare victory. The durable levers are the adults and the structures: grading that rewards revision toward a fixed standard, feedback that names strategy rather than trait, success rates high enough to build mastery, and norms that make seeking challenge high-status. Avoid **false growth mindset**: praising effort regardless of progress is a protector move.\n\nThe through-line of this module: curiosity, respect and competence are three different engines. Curiosity opens a gap for a specific piece of content. Respect decides whether a teenager will accept the demand. Competence, built through well-designed instruction, is what makes effort feel worth it. None replaces good teaching; each decides whether good teaching lands."}],"worked_example":{"title":"Decision: how does the school give feedback on substantial written work?","steps":["Start from the evidence. In the wise-feedback experiment, critique plus a note stating high standards and belief in the student raised revision rates sharply (about 71% versus 17% among African American seventh graders), with the largest effects for students who most distrusted school.","Name the mechanism: critical feedback is ambiguous, and the student may read it as bias or low expectations. The statement resolves the ambiguity and turns a status threat into a status signal. So the policy must resolve ambiguity credibly, not just add a sentence.","Fix the parts of every feedback return: the standard (what excellent looks like), the specific gap between this work and the standard, a sincere statement of belief that the student can close it, and the concrete next step and support available.","Make revision normal. First drafts are expected to be revised, and a revision window is scheduled in class time, so revising carries no stigma and the belief statement is backed by an actual opportunity.","Withhold grades until after the revision cycle, because grades tend to swamp comments (Butler; Module 6).","Guard against the lethal mutation: no pasted boilerplate. Coaches review a sample of feedback each term for specificity and consistency with the stated standard.","Tag the policy: wise-feedback mechanism [E], noting the small samples and limited direct replication; grade-withholding and the review routine [H], with a prediction that revision rates and revision quality rise, checked by sampling returned drafts; revision as a norm [V]."]},"hinge":[{"q":"Per Gruber and colleagues and the follow-up studies, when does a curiosity state most reliably improve memory?","options":["For any material presented after the answer is revealed, as a reward effect.","For the answer to the question the learner is curious about, and to a small degree for unrelated material shown shortly after the question is posed.","Equally for the answer and for any complex school content presented during the wait.","When the question is easy, so students feel successful."],"answer":1,"diagnoses":["A reward-after model. The benefit is tied to anticipation, and the incidental effect was strongest right after the question, not around the answer (Murphy and colleagues 2021).","Correct. The target effect is robust; the incidental halo is small, brief and timing-dependent.","Ignores Keller and colleagues (2024): with complex school-like facts, high curiosity made memory for unrelated material worse.","Fluency-equals-engagement. An easy question opens no information gap."]},{"q":"A teacher writes on returned essays: 'I'm giving you these comments because I have very high standards and I know you can meet them.' What best explains why this can work?","options":["It raises the student's self-esteem.","It makes the criticism feel less harsh.","It resolves the ambiguity about whether the criticism signals bias or low expectations, protecting the student's status while keeping the bar high.","It works mainly for high-achieving students who already trust the teacher."],"answer":2,"diagnoses":["A self-esteem theory of motivation. The mechanism is about interpreting the adult's intentions, not general self-worth.","The protector theory. Softening is not the mechanism; the standards are stated as high.","Correct. This is why effects were largest for students with the least trust in school.","Reverses the finding: effects were largest for students with low trust, and smaller where baseline trust was high."]},{"q":"A middle school wants students to ask more questions of their own. Based on Engel, which is most likely to work?","options":["A weekly 'wonder hour' of open exploration, with regular lessons unchanged.","Teachers take student questions seriously in lessons (following up, showing their own curiosity, admitting when they don't know), with a question board and scheduled time to return to questions.","Buying more hands-on science kits.","Awarding points to students who ask questions."],"answer":1,"diagnoses":["Curiosity as a scheduled special event. Engel does propose a protected Idea Workshop, but a single hour while every other lesson shuts questions down sends a mixed signal.","Correct. Adult response is the main lever; the question board lets teachers follow up without derailing the lesson.","Materials-produce-curiosity. Kits used as recipes keep the materials and remove the inquiry.","Extrinsic reward for a behaviour that is valuable because it is genuine; likely to produce performed questions."]},{"q":"In the National Study of Learning Mindsets, where did the brief growth-mindset program improve lower achievers' grades most?","options":["Uniformly across all schools; a well-designed program works everywhere.","In schools whose peer norms supported taking on challenges (and, per later analyses, in classrooms of teachers who held growth-mindset beliefs).","Only in high-achieving schools with the most resources.","Nowhere; the study found no effect."],"answer":1,"diagnoses":["Assumes average effects are universal. Heterogeneity was the main scientific result.","Correct. Seeds need soil: brief student-directed messages work where the adult and peer context reinforces them.","Invents a moderator the study did not report; the effect depended on norms, not wealth.","Overcorrects. The average effect was small (about a tenth of a grade point for lower achievers) but real, and larger in supportive contexts."]},{"q":"A 15-year-old has stopped doing her maths work. Which teacher response best fits the mentor mindset?","options":["'If it's not in by Friday it's a zero, and I'll call home.'","'Don't worry about this unit, it's a hard one; just do the first page.'","'This work matters and I know you can do it at the level I'm asking. What's been getting in the way? Let's set a plan: we'll work through the first problems together at lunch Tuesday, and the rest is due Thursday.'","'It's your choice; I'm not going to chase you.'"],"answer":2,"diagnoses":["Enforcer: high standards, no support, no explanation. Likely to be read as a status threat and provoke resistance.","Protector: support with a lowered bar, which signals 'I don't think you can do this.'","Correct. It states the standard and the belief (transparency), asks a sincere question, and pairs a fixed bar with concrete support.","Disengagement (low standards, low support), framed as respecting autonomy. It leaves her alone with the problem."]}],"brief_prompt":"Add a section 'How adults talk to students': the three sentences every adult uses in the three canonical moments (giving criticism, responding to refusal to work, responding to failure), each showing the mentor mindset. Run three existing policies from Brief v0 (for example late work, discipline, grouping) through the enforcer/protector/mentor audit and rewrite any that fail. Add a question-asking norm and how you will measure it. Tag everything, noting which items are [V] commitments rather than evidence claims.","deeper":["books/00-foundational-papers.md#3. Gruber, Gelman & Ranganath (2014) — curiosity and the dopaminergic circuit (+ follow-ups)","books/12-why-we-remember.md#Ch 7 — Turn and Face the Strange (curiosity, novelty, surprise, dopamine)","books/03-intellectual-lives-of-children.md#Ch 1 — Inquiry (questions, information-gathering, collections)","books/03-intellectual-lives-of-children.md#Ch 4 — The Idea Workshop (the institutional proposal)","books/05-10-to-25.md#Ch 2 — The Mentor Mindset","books/05-10-to-25.md#Ch 5 — Transparency","books/05-10-to-25.md#Evidence strength & limits"]},{"id":"m4","num":4,"title":"Instruction: explicit teaching, productive failure, and when each wins","level":"Design","minutes":100,"sources":["01-how-learning-happens","04-productive-failure","00-foundational-papers"],"hook":"In Kapur's studies, students who struggled with a problem before being taught did worse during the lesson and better on the later test. Which later test, exactly, and why would the order reverse? And on which kind of test did the advantage vanish completely?","attempt":{"prompt":"Design a Year 9 lesson (about 60 minutes) introducing standard deviation. Then design it the opposite way: if your first version explained first, make the second one problem-first, or vice versa. Predict which version wins on (i) a procedural quiz at the end of the lesson, (ii) a conceptual test a week later ('why does the formula square the deviations?'), and (iii) a transfer problem a month later in an unfamiliar context. Say why for each.","minutes":15},"objectives":["State the Kirschner, Sweller and Clark argument against minimal guidance, the evidence behind it, and the strongest replies to it.","Describe explicit instruction as it actually works (Rosenshine's principles, guidance fading, constructive moments inside it), and distinguish it from lecturing.","State Kapur's productive failure design, its meta-analytic evidence, and precisely where it does and does not conflict with cognitive load theory.","Given a lesson goal and a learner profile, choose a sequence and defend it with the expertise reversal effect and the conditional rules."],"ideas":[{"title":"Why minimal guidance fails novices","tag":"E","body":"Kirschner, Sweller and Clark (2006) grouped discovery, problem-based, experiential, constructivist and inquiry teaching by one shared feature: learners get **minimal guidance** and are expected to find key information themselves. Their argument follows directly from Module 1. For **novices**, searching a problem space uses up working memory and adds little to long-term memory. Learners can be busy without learning. Fully guided instruction (explicit explanation, worked examples, process worksheets) is more effective and more efficient until learners have enough knowledge to use less.\n\nTheir second argument is the one to remember: **the epistemology of a discipline is not its pedagogy.** Scientists discover things, but they investigate *using* large stores of schemas that novices do not have. Asking children to \"be scientists\" or \"be historians\" does not give them the knowledge that makes scientists and historians effective. Chi, Feltovich and Glaser's (1981) expert-novice sorting study is the evidence underneath: experts see deep structure, novices see surface features. Kirschner's summary: novices need to be taught; experts can inquire.\n\nThe supporting evidence:\n\n- **Mayer (2004)**, \"Should there be a three-strikes rule against pure discovery learning?\", reviewed three waves of research (problem-solving rules in the 1960s, conservation strategies in the 1970s, programming concepts in the 1980s). Pure discovery lost to guided methods each time.\n- **Alfieri and colleagues (2011)** meta-analysis: unassisted discovery did worse than explicit instruction, while *enhanced* or guided discovery did better than other methods.\n- **Clark (1989)**, \"When teaching kills learning\": weaker students taught with less guidance sometimes scored lower after instruction than before, and learners often prefer the method from which they learn least.\n\n**The replies matter as much as the paper.** In 2007, Hmelo-Silver, Duncan and Chinn argued that problem-based and inquiry learning *as actually practised* are heavily scaffolded, so the paper attacked a straw man. Schmidt and colleagues said the same of medical problem-based learning. Kuhn argued that inquiry partly aims at learning *how to inquire*, which content tests do not measure. Sweller and colleagues replied that heavily scaffolded inquiry works *because* it has become more like explicit instruction, and that the critics had not produced controlled comparisons favouring less guidance.\n\nWhere that leaves you: much of the fight is about labels. The robust claim is narrow and strong: **unguided discovery for novices is a weak design.** \"Inquiry\" and \"projects\" are not the same as minimal guidance, and well-scaffolded versions are a separate question. The limits: the strongest controlled evidence is for novices, in well-structured domains (maths, science, technical skills), measured mostly on near-term content knowledge. Transfer, motivation and long-run inquiry skill are measured less often.\n\nA product analogy: you would not onboard a new engineer by handing them the production codebase and saying \"explore.\" You give them a guided path, worked examples of real changes, and gradually harder tickets, and you give senior engineers open-ended problems. Same system, different guidance, set by expertise.\n\n**Design rules** [E]: the default for new content with novices is explicit, guided instruction. Any project, inquiry or discovery block must document its **guidance plan**: what is taught explicitly, when, and with which scaffolds. \"Let them figure it out\" is not a design. And never judge a method by visible busyness or student preference; both can move opposite to learning."},{"title":"Explicit instruction done right is interactive, checked, and fades","tag":"E","body":"\"Explicit instruction\" is widely misread as lecturing. Rosenshine's (2012) *Principles of Instruction*, which combined cognitive science, observations of highly effective teachers and experiments on cognitive supports, describes something much more interactive. The ten principles:\n\n1. Begin with a short **review** of previous learning.\n2. Present new material in **small steps**, with student practice after each step.\n3. Ask **many questions** and check the responses of **all** students.\n4. Provide **models** (worked examples).\n5. **Guide** student practice.\n6. **Check** for understanding.\n7. Obtain a **high success rate** (around 80% in practice).\n8. Provide **scaffolds** for difficult tasks.\n9. Require and monitor **independent practice**.\n10. Engage students in **weekly and monthly review**.\n\nThis is lower-case \"direct instruction\". Distinguish it from Engelmann's scripted capital-D Direct Instruction programs. Rosenshine is the most implementable single document in Kirschner and Hendrick's book and a sensible backbone for a common instructional model, framed as **mechanisms**, not a checklist for grading lessons.\n\n**Guidance fading** is how explicit instruction handles expertise. The progression is full worked examples, then **completion problems** (part of the solution given), then independent problems; in classroom language, I do, we do, you do. Because of the **expertise reversal effect**, the same support that helps a novice burdens an expert, so fading should respond to what students know, ideally using quick diagnostic probes to decide who moves on. Clark called over-guiding knowledgeable learners one of the ways teaching kills learning.\n\n**Scaffolding** is narrower than the word suggests. Wood, Bruner and Ross (1976) described tutors supporting young children through a block-building task: recruiting interest, reducing degrees of freedom, keeping direction, marking critical features, controlling frustration, demonstrating. Real scaffolding is **contingent** (based on continuous diagnosis of what this learner can do) and **temporary**. Permanent sentence starters and hint sheets that never go away are support, not scaffolding.\n\n**Explicit teaching can and should be cognitively active.** Chi's ICAP framework orders engagement as interactive > constructive > active > passive, defined by what students generate. Chi's own self-explanation research found students who explained worked examples to themselves learned more. The reconciliation between \"active learning\" and explicit instruction is to build **constructive moments inside** explicit teaching: self-explanation prompts, predictions before a step is revealed, explain-to-your-partner. Two cautions: ICAP's strict ordering and its behavioural indicators are contested (Thurn and colleagues 2023), and for novices, studying a good example can beat generating. Use ICAP as a design prompt (\"where does every student generate something about the target content?\"), not as \"group work beats teaching.\"\n\n**The scaling target.** Bloom's (1984) \"2 sigma\" finding, that one-to-one tutoring with mastery learning outperformed conventional class teaching by about two standard deviations, came from small, short studies with closely aligned tests. Modern tutoring meta-analyses find large but smaller effects. Treat Bloom as a design target: mastery criteria before moving on, frequent checks, corrective re-teaching, and targeted small-group or high-dosage tutoring for students who fall behind.\n\n**The lethal mutations** (Kirschner and Hendrick's closing warning): Rosenshine turned into an observation checklist; \"direct instruction\" as a long lecture; worked examples with no fading; scaffolds that never come down."},{"title":"Productive failure: generate first, then teach from the attempts","tag":"E","body":"Kapur's *Productive Failure* is the curriculum's strongest evidence-based counterweight to \"always explain first.\" His design move is to flip the sequence for certain goals: **problem solving followed by instruction (PS-I)** instead of instruction followed by problem solving.\n\nIt starts from Module 1's learning-versus-performance distinction, organized as four quadrants crossing short-term performance with long-term learning:\n\n- **Unproductive success**: students do well today but do not understand why the method works and cannot transfer it (memorize the formula, plug in numbers). Kapur's provocative claim is that this is the hidden failure mode of well-run conventional classrooms, invisible because the scores look good.\n- **Productive success**: success now that also lasts (good explicit instruction with practice, worked examples with self-explanation). Kapur accepts this is real and right for many goals.\n- **Unproductive failure**: struggle that teaches little, such as unguided discovery with no consolidation. This is what Kirschner, Sweller and Clark rightly attacked.\n- **Productive failure**: students fail to produce the canonical solution but the attempt prepares them to learn much more from the instruction that follows.\n\n**The design has two phases.** In **generation**, students, usually in small groups, work on a problem they have not been taught to solve, designed to admit many **representations and solution methods** (RSMs), drawing on what they already know. In **consolidation**, the teacher gives full explicit instruction that *builds on* the students' attempts, comparing and contrasting them with the canonical solution so students see which features the expert solution handles and where their own methods break. **Guidance is delayed, not withheld.**\n\nThe signature study: Singapore ninth graders learning **variance**. Productive-failure students first tried to invent a measure of consistency from data and mostly failed to invent standard deviation. After instruction they did as well as instruction-first students on procedural items and better on conceptual understanding and transfer (Kapur 2012, 2014). Two further findings shape design: students who studied *other* students' failed solutions learned less than those who generated their own (**vicarious failure** is weaker), and the **diversity of solutions** a student generates predicts later learning.\n\nKapur's mechanisms, the **Four As**: **Activation** of relevant prior knowledge (including wrong ideas, which surfaces them for conceptual change); **Awareness** of the limits of one's ideas and of the critical features the concept must handle (for variance: spread, sample size, direction of deviations); **Affect** (curiosity and ownership, but also a risk of frustration, so the culture must make early attempts safe and ungraded); and **Assembly**, the teacher-led consolidation into the canonical concept.\n\n**The meta-analysis.** Sinha and Kapur (2021, *Review of Educational Research*) pooled 53 studies and 166 comparisons, mostly maths and science. PS-I beat instruction-first on **conceptual knowledge and transfer**, g = 0.36 (95% CI 0.20 to 0.51), rising to roughly 0.37-0.58 with high fidelity to the design principles. On **procedural knowledge** there was **no difference** (g = -0.03). Older learners (grade 6 up) benefited more than elementary students. Independent converging work: Schwartz and Martin (2004) on inventing variability indices before a lecture; Loibl and Rummel (2014), who found the benefit depended on instruction that built on and contrasted typical student solutions.\n\nThat last point is the single most important implementation fact: **the consolidation is the active ingredient.** A productive-failure problem without a consolidation lesson that uses student work is simply unproductive failure. The highest-leverage teacher training is not \"how to let students struggle\" but \"how to run a compare-and-contrast consolidation from student work.\" Do not repeat press conversions of the effect into multiples of a year with an excellent teacher; they rest on shaky benchmarks."},{"title":"Where the camps actually disagree, and the decision rule","tag":"E","body":"Framed carefully, Kapur and the cognitive load camp agree on more than the culture war suggests. Both reject unguided discovery for novices. Both require full explicit instruction and practice. Kapur's model *ends* in direct instruction. The live disagreement is narrow: **does a short, bounded generation phase before instruction improve what students learn from that instruction?**\n\nCLT's prediction: the search phase wastes working memory, especially for novices on material with high element interactivity. PF's reply: the search activates and differentiates prior knowledge and reveals critical features, so the later instruction is encoded more deeply, and the relevant outcome is conceptual understanding and transfer, where many CLT studies measured procedures.\n\n**The counter-evidence is real.** Ashman, Kalyuga and Sweller (2020) ran a randomized classroom experiment with high element-interactivity material and found explicit-instruction-first students scored substantially higher on application and transfer. Fyfe, DeCaro and Rittle-Johnson (2014) found conceptual instruction before problem solving helped children more in their setting. A companion meta-analysis found PS-I's advantage over *other* preparatory sense-making activities (contrasting cases, studying worked examples before instruction) was not significant (g about 0.22, confidence interval crossing zero). Many included PF studies come from proponents, and critics argue some instruction-first control conditions were weak. So the defensible claim is: **a well-designed preparatory activity before instruction beats instruction-first for conceptual learning**, not \"unassisted struggle beats every alternative.\"\n\nA reconciliation from inside the CLT camp (Kalyuga and Singh 2016): if the first phase aims at motivation and awareness of gaps rather than schema acquisition, a brief PS-I phase can fit within load theory, provided it is short and followed by explicit instruction. The useful mental model from the foundational papers: **guidance is a dial set by expertise, not an ideological position.**\n\n**The conditional rules** (distilled from Kapur and his critics):\n\n1. **Goal is procedural fluency** or a skill with little conceptual depth: teach first, then practise. PF adds nothing there.\n2. **Goal is a load-bearing concept** later ideas depend on (variance, rate, density, proportionality, natural selection) **and** students have relevant prior or intuitive knowledge: consider PF for introducing it.\n3. **Students lack prerequisites** and cannot make any reasonable attempt: teach prerequisites explicitly first.\n4. **Material is very high element interactivity for these learners**: explicit-first, or simplify the problem to a low-floor task.\n5. **Young learners or true novices**: lighter forms (a short \"try it first,\" contrasting cases), expect smaller benefit.\n6. **You cannot guarantee a consolidation that compares student solutions with the canonical one**: do not run PF.\n7. **The task admits only one path**: it is not a PF task.\n8. **The culture punishes wrong answers**: fix the culture first.\n9. **You evaluate by in-lesson success or an immediate procedural quiz**: you will wrongly reject PF; evaluate with delayed conceptual and transfer items.\n10. **Budget**: roughly one generation-plus-consolidation cycle per major concept, not every lesson.\n\nThis is also where Module 2 plugs in. Generation surfaces intuitive theories, and Shtulman's work explains why consolidation must confront them directly: a surfaced misconception left unaddressed persists. And Module 3: struggle is productive for adolescents only when framed as high standards with support. Otherwise students read it as \"I'm not a maths person,\" which is why Kapur puts affect and safe norms inside the design, not beside it."},{"title":"Making it institutional: named lesson types, task banks, and the right measures","tag":"H","body":"A school does not choose between explicit instruction and productive failure once. It chooses a **default**, a small set of **named exceptions** with entry conditions, and the infrastructure that keeps each from mutating.\n\n**Default: explicit instruction for new content** [E]. Most students are novices most of the time in most new content. The default lesson is a review, small steps with worked examples and constructive prompts, guided practice at a high success rate, checks for understanding across all students, then independent practice, with spaced review built into the calendar.\n\n**Named exception: generate-then-consolidate** [E for the mechanism, H for the share of lessons]. A designated lesson type with its own planning template, used to introduce designated core concepts, mostly in maths and science from around grade 6 up. It is not a teacher's improvisation and not a synonym for \"discovery.\"\n\n**Forbidden: discovery without consolidation** [E]. A lesson where students explore and the teacher never assembles the canonical idea is unproductive failure by definition.\n\nThe infrastructure that makes this work:\n\n- **A curated task bank.** Kapur's own advice is that individual teachers inventing PF tasks alone produce high variance in quality. For each designated concept, store: the problem, the anticipated student solutions, the critical features, the consolidation script and the follow-up practice. Version it and improve it after each use, like a shared code library [H].\n- **Protected consolidation time.** The generation phase plus a full consolidation (often a whole lesson) must be in the scope and sequence, or pacing pressure will quietly cut the active ingredient [E: fidelity is the main moderator].\n- **Ungraded generation.** First attempts are framed as expected to fail and never graded, with norms for sharing half-formed ideas [H].\n- **Assessment that can see the difference.** Include delayed conceptual and transfer items, not only immediate procedural checks. Otherwise explicit lessons look better than they are (unproductive success) and PF lessons look worse than they are [E: learning versus performance].\n- **Observation that looks for mechanism.** Walkthrough rubrics should not reward smoothness by default (smoothness is often unproductive success) and should not penalize visible struggle during a designated generation phase. They should flag struggle with no consolidation and smooth lessons with no evidence of understanding [H].\n- **Differentiation by prior knowledge, not labels.** The expertise reversal effect implies the same lesson format cannot be optimal for a novice and an advanced student. Frequent short diagnostics and flexible, temporary grouping follow [E for the principle, H for the cadence].\n- **A guidance plan for every project.** Any project or inquiry unit documents what is taught explicitly, when, and with what scaffolds before it is approved [H].\n\nEngel's Bonawitz finding (Module 3) adds a final consideration: demonstrating first transmits efficiently and narrows exploration. For skills, pay that price gladly. For the few places where exploration is itself the goal, such as an Idea Workshop, hold back on purpose. Knowing which one you are doing, and saying so in the lesson plan, is most of the discipline.\n\nPilot before scaling: run PF in a few units with comparison classes and delayed transfer tests, and treat the results as an improvement cycle (Module 9)."}],"worked_example":{"title":"Decision: what is the school's default lesson structure, and when is it overridden?","steps":["Set the default by who the learners usually are. For new content, most students are novices, so the default is explicit: retrieval starter, small steps with worked examples and self-explanation prompts, guided practice at a high success rate, checks for understanding from all students, independent practice, and scheduled weekly and monthly review (Rosenshine). Tag [E].","Build fading into the default. Worked examples give way to completion problems and then independent problems as short diagnostics show readiness, because the same support that helps novices burdens more expert students (expertise reversal). Tag [E] for the principle, [H] for the specific diagnostic routine.","Define the override. Switch to a generate-then-consolidate lesson only when all four conditions hold: the goal is a load-bearing concept rather than a procedure; students have relevant prior or intuitive knowledge to activate; the problem admits multiple representations and solution methods; and a consolidation that compares student solutions with the canonical one is planned and timetabled. Tag [E] for the conditions, drawn from the meta-analysis moderators and the counter-studies.","Make the override a named lesson type with a template (problem, anticipated solutions, critical features, consolidation script, follow-up practice), stored in a shared task bank, so quality does not depend on each teacher inventing tasks. Tag [H].","Forbid 'discovery' as a lesson type without consolidation, and require every project or inquiry unit to document its guidance plan. Tag [E] for the ban, [H] for the review process.","Set the proportion as a hypothesis, not a quota: roughly one generation-plus-consolidation cycle per core concept, which in practice is a small minority of lessons, concentrated in maths and science from about grade 6. Tag [H], with a prediction: on delayed conceptual and transfer items for designated concepts, PF classes match or beat comparison classes, with no loss on procedural items.","State the value underneath: the school commits to conceptual understanding and transfer, not only procedural performance, and will measure both. Tag [V]."]},"hinge":[{"q":"Kirschner, Sweller and Clark's central argument is that minimally guided instruction fails novices because:","options":["Students lack motivation without a teacher directing them.","Searching a problem space consumes the working memory that would otherwise go to building schemas in long-term memory.","Students are not intelligent enough to discover principles on their own.","Discovery suits science but not mathematics."],"answer":1,"diagnoses":["A motivational misreading. The argument is about cognitive architecture, not willingness.","Correct. It is a load argument grounded in Sweller's means-ends analysis finding, plus the point that a discipline's epistemology is not its pedagogy.","An ability-deficit misreading. Experts can inquire because of their knowledge, not their intelligence; novices of any ability lack the schemas.","A domain misreading. The argument applies to novices in any well-structured domain; the evidence spans maths, science and programming."]},{"q":"Which of these is NOT a requirement for productive failure to work, according to Kapur?","options":["Students have prior knowledge relevant to the problem.","The problem admits multiple representations or solution methods.","Students solve the problem correctly before instruction.","A consolidation phase compares student solutions with the canonical one."],"answer":2,"diagnoses":["This is required: a problem with nothing to activate is just confusing (unproductive failure).","This is required: the diversity of generated solutions predicts learning, and a one-path task is not a PF task.","Correct. Students almost never produce the canonical solution; generating varied, partly wrong attempts is the mechanism.","This is required and is the most important ingredient; the benefit depends on instruction that builds on and contrasts student solutions."]},{"q":"A teacher of experienced Year 12 chemistry students gives them a fully worked example for every new problem type. Their test performance falls. The best explanation is:","options":["Worked examples only work in mathematics.","Expertise reversal: for learners who already have the schemas, studying worked examples is redundant load, and independent problem solving would serve them better.","Year 12 students find examples unmotivating.","The worked examples were badly designed."],"answer":1,"diagnoses":["A domain misreading. The worked example effect appears across well-structured domains.","Correct. The support that helps novices burdens experts, which is why guidance should fade based on what students know.","A motivational explanation for a cognitive effect the evidence already predicts.","Possible, but the pattern is exactly what expertise reversal predicts even for well-designed examples."]},{"q":"In Sinha and Kapur's (2021) meta-analysis, on which outcome did problem-solving-first show essentially no advantage over instruction-first?","options":["Conceptual understanding.","Transfer to new problems.","Procedural knowledge.","None; problem-solving-first won on every outcome."],"answer":2,"diagnoses":["The advantage was on conceptual knowledge (g about 0.36 pooled with transfer).","Transfer is where the advantage was found, together with conceptual knowledge.","Correct. Procedural knowledge showed g about -0.03, no difference, which is why the rule is 'teach procedures first'.","Overgeneralizes the finding. The advantage is specific to conceptual understanding and transfer, and depends on design fidelity."]},{"q":"Walkthrough data show productive-failure lessons score lower than explain-first lessons on 'percentage of students on track by the end of the lesson.' What should you conclude?","options":["Productive failure is failing and should be dropped.","Nothing yet: the metric measures in-lesson performance, which PF is designed to lower; check fidelity (was there a real consolidation?) and compare delayed conceptual and transfer results.","Explain-first lessons are proven superior for all goals.","Teachers need to give more hints during the generation phase so students stay on track."],"answer":1,"diagnoses":["Judges learning by performance during learning, the exact error Module 1 and Kapur warn against.","Correct. Use the right outcome measure and check the active ingredient before deciding; if delayed outcomes are also no better, then investigate task design, prerequisites and consolidation quality.","Overgeneralizes from the wrong metric.","Rescuing during generation removes the mechanism; evidence suggests adding scaffolding to the problem phase does not reliably help."]}],"brief_prompt":"Write the school's 'default lesson and its named exceptions' as a half page: the default structure, the generate-then-consolidate exception with its entry conditions as a checklist a teacher could apply, what is forbidden, and how each will be observed and measured (including delayed transfer items). Tag each line, and add one prediction for the first term.","deeper":["books/00-foundational-papers.md#2. Kirschner, Sweller & Clark (2006) + the expertise reversal effect (Kalyuga et al. 2003)","books/01-how-learning-happens.md#Ch 22 — Why discovery learning is a bad way to discover things","books/01-how-learning-happens.md#Ch 23 — Direct instruction","books/04-productive-failure.md#Part I, Ch 1 — The Problems of Learning","books/04-productive-failure.md#Evidence strength & limits","books/04-productive-failure.md#Institutional design implications"]},{"id":"m5","num":5,"title":"Knowledge, curriculum, and the reading problem","level":"Design","minutes":90,"sources":["06-beyond-the-science-of-reading","10-creating-the-schools-our-children-need","01-how-learning-happens"],"hook":"Take middle-school students who are weak readers but know a lot about baseball, and students who are strong readers but know little about it. Give both groups a passage describing half an inning of a game. Which group understands it better, and what does that imply about the thing we call 'reading comprehension skill'?","attempt":{"prompt":"Your elementary school's reading scores are low. Your literacy lead proposes two changes: double the daily reading block (taking the time from science and social studies) and buy a comprehension-strategies program that teaches a different skill each week (main idea, inference, author's purpose) using short levelled texts. Write the two-paragraph memo you send back: approve, reject or modify, and why.","minutes":10},"objectives":["Explain why reading comprehension is not a transferable, content-free skill, and what that implies for the elementary timetable.","Distinguish decoding instruction (systematic phonics, largely settled) from comprehension, which depends on knowledge and vocabulary.","Evaluate a curriculum by its knowledge sequencing and coherence rather than its skill labels, and explain why curriculum is a cheap, high-leverage decision.","Separate what is robust, what is plausible but unproven, and what is a value choice in the knowledge-rich curriculum argument."],"ideas":[{"title":"Comprehension is mostly knowledge, not a skill","tag":"E","body":"Wexler's argument starts from a model almost everyone in reading research accepts. The **Simple View of Reading** (Gough and Tunmer 1986) says reading comprehension is **decoding multiplied by language comprehension**: if either is zero, comprehension is zero. **Scarborough's Reading Rope** (2001) splits language comprehension into strands that explicitly include **background knowledge** and **vocabulary**. The \"science of reading\" reforms of the last decade operationalized the decoding half (systematic phonics) and, Wexler argues, left the other half to an older skills-and-strategies approach that contradicts cognitive science.\n\nThe emblem study is **Recht and Leslie (1988)**. Middle-school students were grouped by reading ability and by baseball knowledge, read a passage describing half an inning, and showed understanding by re-enacting it with a model and recalling it. Knowledge drove comprehension far more than general reading ability: **weak readers who knew baseball outperformed strong readers who did not.**\n\nThe mechanism is Module 1's. Reading is a working-memory activity. A reader who knows the topic can chunk the text, infer what the author left unsaid, and keep attention for meaning. A reader who does not is processing every element separately and drowns. Writers always leave out what they assume readers know; comprehension depends on filling those gaps.\n\nWhat this means for common practice:\n\n- **Content-free skills lessons** (\"this week: finding the main idea\") practised on unconnected texts treat comprehension as a general skill. But finding the main idea of a text depends on understanding its content. Such lessons build little knowledge and transfer poorly.\n- **Comprehension strategies** (monitoring your understanding, summarizing, questioning) do help, but Willingham's reading of the evidence is that they give a **quick, one-time boost that does not grow with more practice**, like a small bag of tricks that prompts effortful reading. A few sessions deliver most of the benefit. Wexler's position is not \"ban strategies\" but \"teach them briefly, inside content.\"\n- **Levelled reading**, matching each child to texts at their measured level, can keep weaker readers on simpler texts and deny them the complex language and knowledge they most need (a critique she draws partly from Shanahan).\n- **Cutting science and social studies** to protect reading time removes the very knowledge that drives comprehension. Tyner and Kabourek (2020), analysing a large US longitudinal dataset (ECLS-K:2011), found extra **social studies** time in elementary school, not extra ELA time, was associated with better reading; about 30 more minutes a day was linked to clear gains, largest for low-income students, girls and English learners. **This is correlational**, but it points the same way as the mechanism.\n\nThe line to carry: **a reading test is partly a knowledge test in disguise.** Standardized reading tests use passages on unpredictable topics, so they reward children who happen to know about those topics, which mostly means children from knowledge-rich homes. Once decoding is secure, the way to raise comprehension across the board is to raise what children know, across many domains, systematically."},{"title":"Knowledge is what 'skills' are made of, and why that is an equity issue","tag":"E","body":"The comprehension finding is one case of a general rule from the Minds modules: **the thinking skills schools most want to teach are domain-specific and built from knowledge.** Critical thinking about a historical source requires knowing the period. Problem solving in physics requires schemas for the relevant principles (Chi, Feltovich and Glaser 1981). Metacognition requires enough domain knowledge to judge your own knowledge. Wiliam's chapter on a knowledge-rich curriculum makes the same argument from the same evidence: working memory is tiny, long-term memory is vast, and expertise is mostly large, well-organized knowledge that frees working memory for thinking. Teaching \"critical thinking\" or \"problem solving\" as generic skills in isolation produces weak transfer.\n\nThree consequences.\n\n**\"You can just look it up\" is a myth, not a strategy.** Looking something up only helps if you know enough to recognize what you need, search for it, understand what you find and connect it to what you know. Search engines and AI assistants make knowledge more valuable, not less, because judging their output requires knowledge. Ranganath puts the memory-science version neatly: **we remember more by memorizing less**. Organized knowledge lets a few chunks carry many details, and stored knowledge is also what imagination, planning and creativity recombine.\n\n**Ausubel's principle.** \"The most important single factor influencing learning is what the learner already knows.\" Ausubel was against *rote* learning and for **meaningful** learning anchored to existing ideas. A knowledge-rich curriculum means connected, organized understanding built through rich texts, discussion and writing, not lists of facts to memorize. Kirschner and Hendrick's \"zoom out, zoom in\" sequencing (a big-picture spine, units that elaborate it, returns to the big picture) is the practical version.\n\n**Knowledge gaps compound.** Children from more-educated homes arrive with more academic knowledge and vocabulary and keep acquiring it outside school. Because knowledge makes new learning easier, gaps widen over time (**Matthew effects**). A content-light, skills-focused school therefore hands the advantage to children who get knowledge at home, and discovery-heavy or choice-heavy pedagogies widen gaps further for novices. **A shared, knowledge-rich curriculum for every student is an equity tool, not an elitist one** [V backed by E on mechanism].\n\nThe best causal evidence here comes with serious caveats, and you should know both. Grissmer and colleagues (2023) used admission lotteries at nine Colorado Core Knowledge charter schools (about 2,300 applicants) and estimated reading gains of about **16 percentile points** by grades 3-6, with the income gap closing. But: the paper was not peer-reviewed at the time; the curriculum effect cannot be separated from other features of well-run charter schools; the low-income estimate came from one school with about 16 students; and gains appeared by grade 3 and then **stopped growing**, which is awkward for a theory of cumulative knowledge. Encouraging, not proof.\n\nChapter 9 of Kirschner and Hendrick's book adds Geary's point: reading, writing and algebra are biologically secondary. Children do not acquire them by immersion the way they acquire speech, which is why \"they'll pick up knowledge naturally if we give them skills and freedom\" fails most for the children with least at home."},{"title":"Curriculum is the cheap, neglected lever","tag":"E","body":"Wiliam's *Creating the Schools Our Children Need* evaluates reforms the way a product leader evaluates bets: by effect size, cost (money *and* teacher time), how reliably it scales, what it displaces, and how long it takes to pay off. On that screen, **curriculum is one of the highest-return early decisions a school makes**, because schools buy or build materials anyway, so choosing better ones costs little at the margin. Studies of elementary maths textbooks found that the choice of textbook alone produced achievement differences comparable to far more expensive reforms (Agodini and colleagues 2010, a randomized comparison of four curricula; Chingos and Whitehurst 2012, \"Choosing Blindly\").\n\nWiliam distinguishes three curricula, and improvement lives in the gaps between them:\n\n- **Intended**: what is specified.\n- **Enacted**: what is actually taught.\n- **Achieved**: what students actually learn.\n\nThree design principles follow for a founder.\n\n**Coherence is the design variable.** Knowledge compounds only when topics are sequenced so each unit builds on earlier ones, texts cluster around a topic for weeks rather than hopping between unrelated passages (topic clusters repeat vocabulary and concepts, which speeds word learning), and subjects reinforce each other across years. Teacher-by-teacher content choice wastes the compounding: if every Year 3 teacher chooses their own topics, the Year 4 teacher can assume nothing. A school-wide sequence lets each teacher build on what the previous year taught. The product analogy is an API contract between grades.\n\n**Choose what to leave out.** Coverage-driven curricula produce shallow learning; choosing omissions is part of design. Module 2 adds a science-specific point Wexler underplays: some knowledge must be restructured, not just accumulated, so a knowledge curriculum in science still needs the conceptual-change spiral.\n\n**Shared materials make teacher learning productive.** When everyone teaches the same lessons, teachers can plan together, compare student work on the same tasks, and improve one shared set of materials (Modules 6 and 8). A founder who lets every teacher write their own units buys autonomy at the price of almost all collaborative improvement [H].\n\n**Adoption is not enactment.** Wexler reported (in a 2026 piece that postdates the book) an SRI study of four large districts that had used knowledge-building curricula for years: about **two-thirds** of observed comprehension lessons were still \"surface-level\", focused on completing standards-style tasks rather than on the text's meaning. A good curriculum can be taught badly. It needs curriculum-specific professional learning, coaching, aligned internal assessment, and leaders who protect content time. Teacher preparation compounds the problem: Wexler argues most programs teach neither the science of learning nor knowledge-based literacy, so **assume you will re-train every hire** in the learning model and in the curriculum itself, and hire for willingness to teach a shared curriculum well.\n\n**Evaluate by coherence, not by rubric score.** Third-party curriculum reviews can reward alignment with skills-based standards without checking whether knowledge builds across grades. Look at the topic sequence, text clustering and vertical build yourself."},{"title":"Two tracks from kindergarten, and writing as the thinking tool","tag":"E","body":"Wexler's practical design for the early years is **two parallel tracks from the first day of kindergarten**, never one after the other.\n\n**The code track.** Systematic, explicit phonics, with decodable texts for practising the code, finished for most children by the end of grade 2. This is the settled half of the science of reading [E]. Decoding is biologically secondary and needs explicit teaching; it should become automatic so that working memory is free for meaning.\n\n**The knowledge and language track.** Read-alouds, discussion and content units in science, history, geography and the arts, from kindergarten, **never paused for the code work**. Children can understand far more complex language by listening than they can decode, so read-alouds on coherent topics are how young children build knowledge and vocabulary before they can read those texts themselves. Waiting until children \"learn to read\" before teaching content wastes the years when the knowledge gap first opens.\n\n**Writing is the tool that turns content into understanding, if load is managed.** For novices, writing is the most cognitively demanding thing school asks: transcription (handwriting, spelling), syntax, organization and content all compete for working memory, leaving no capacity to think about the content. An open-ended essay prompt for a nine-year-old is therefore often an overload exercise, not rigour. The remedy from Hochman and Wexler's *The Writing Revolution* is **explicit writing instruction starting at the sentence level**, embedded in content, building to outlines and then compositions. Signature activities:\n\n- **Because / but / so**: complete \"Plants need sunlight because...\", \"...but...\", \"...so...\". Each ending requires understanding cause, contrast and consequence in the content.\n- **Appositives**, **subordinating conjunctions** (although, since, unless) and **sentence combining**.\n- **Kernel expansion** (who, what, when, where, why), then **single-paragraph and multi-paragraph outlines**, then revision.\n\nUsed this way, a sentence task is also a retrieval exercise and a check for understanding, so it doubles as formative assessment (Module 6).\n\n**Evidence, honestly.** The principles have support: writing about text improves reading comprehension (Graham and Hebert 2010, *Writing to Read*), and writing-to-learn activities improve content learning modestly (Graham, Kiuhara and MacKay 2020). Sentence-combining research is supportive. But the **branded Hochman method itself lacks controlled trials**, and Wexler co-authored it, so she is not neutral on this point. Tag the principles [E] and the specific sequence [H].\n\n**The design implication across the school.** Sentence-level writing about content becomes a daily routine in every subject from grade 1, not an ELA-only activity [H for the routine]. Reading in history, science and the arts *is* reading instruction. This is also Module 4's expertise reversal applied to literacy: heavy scaffolds for novice writers, faded as competence grows, until older students write extended arguments with less structure because they now have both the knowledge and the automated sentence-level skill to do it."},{"title":"What is settled, what is not, and what is yours to decide","tag":"V","body":"The knowledge-rich curriculum argument is persuasive enough that founders sometimes treat all of it as settled. It is not, and your brief will be stronger if you separate the layers.\n\n**Robust [E]:**\n- Background knowledge strongly predicts, and causally affects, comprehension of a *specific* text.\n- Systematic phonics is necessary for most children.\n- Working-memory limits and schema-based expertise.\n- Strategy instruction gives quick, limited gains that do not grow with more practice.\n- Writing about text improves comprehension; writing to learn has modest positive effects.\n\n**Plausible but less proven [H]:**\n- **That a knowledge curriculum raises general, standardized reading scores at scale.** Integrated content-literacy instruction improves vocabulary and comprehension in a meta-analysis (Hwang, Cabell and Joyner 2022), with clearer effects on content-aligned measures than on general tests. Kim and colleagues' MORE trials found positive effects, but a small one (about 0.11) on a distal reading measure in a first-grade RCT. The Core Knowledge lottery study has the caveats from the second idea. Tyner and Kabourek is correlational. Honest summary: the direction is consistent and positive; the size of short-run effects on general tests is uncertain and often small.\n- **That knowledge compounds year after year.** Theoretically compelling; the Core Knowledge gains plateaued after grade 3.\n- **Specific branded methods** and teacher-prep and scaling claims, which rest on case studies and descriptive reviews.\n\n**Contested.** Strategy-instruction defenders (voices associated with The Reading League, and researchers such as Shanahan and Duke) argue strategies have solid trial support and warn against wholesale rejection; knowledge is one factor among several, alongside vocabulary, syntax and inference. Wexler's answer is \"not either/or, but how much and when,\" though critics say the knowledge camp's rhetoric outruns that nuance. Inquiry advocates (Modules 3, 4 and 7) argue heavy explicit instruction can cost curiosity and agency; Wexler is mostly addressing novices in K-8.\n\n**Values [V], which the science does not settle:**\n- **Which knowledge.** Whose history, which literature, which scientific ideas first, how much local and how much global. A shared canon risks cultural narrowness; a curriculum with no shared content wastes compounding. The cognitive argument is about *coherence and sequence*, and it works with diverse content. Choosing the content is a value decision you should make openly with your community, not disguise as evidence.\n- **Equity as a design commitment**: every student gets the same rich content regardless of placement.\n- **The balance between efficient knowledge-building and time for students' own questions** (Engel's Idea Workshop). Both can coexist; the ratio is a value choice informed by evidence.\n\n**Operational expectations [H].** External standardized reading scores may lag for the first two or three years, because content-agnostic tests under-credit knowledge whose payoff is slow and diffuse. Set this expectation with your board and families in advance, and build **curriculum-embedded assessments** that show whether students are learning what you teach.\n\nThe founder's skill this module trains is the one Module 0 introduced: being able to say, for each part of your literacy and curriculum design, which part is proven, which part is a bet with a prediction, and which part is a commitment you would keep even if the effects turned out small."}],"worked_example":{"title":"Decision: what does the K-5 school day look like?","steps":["Code track first, protected. Decoding is taught systematically and explicitly every day in K-2 (roughly 30-45 minutes), with decodable texts for code practice, aiming for most children to finish the code by the end of grade 2. Tag [E] for systematic phonics, [H] for the minutes.","Knowledge track alongside, from day one. The rest of literacy time is content: read-alouds, discussion and texts on a sequenced set of science, history, geography and arts topics, clustered so each topic lasts weeks, with vocabulary taught in context. Science and social studies are daily, not squeezed out. Tag [E] that knowledg
