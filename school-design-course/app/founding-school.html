ght to the imagined median student.\n\n**What the two bets leave out.** Wiliam has little on motivation, well-being, culture or curiosity, so use Yeager, Engel and Mehta & Fine as counterweights. He is also readier than Bryk to name the answer in advance: his is the *what*, Bryk's the *how*. The founder's synthesis: **pick the best-odds bets from the evidence, then use improvement science to make them work in your building.**\n\n**Staffing consequence.** Select for learnability; build for effectiveness. Invest heavily in years one to three of every teacher's time with you; make TLC participation part of the employment compact [V]; and apply the mentor mindset to adults too: high standards, high support, transparency about why."}],"worked_example":{"title":"Decision: hiring versus development, and the $600k allocation","steps":["Restate the problem in Wiliam's terms: not which options work (all of them do a little) but which yields the most learning per dollar and per teacher-hour for our students, what each displaces, and how fast it pays off. [H for the rubric; it is a decision framework]","Pre-hire signals (credentials, interviews, even a single demo lesson) predict effectiveness weakly, and value-added and single observations are noisy. So hiring cannot carry the strategy. [E]","Variation among teachers already in the building is large, and teachers improve substantially in their early years, longer in supportive environments. The reachable lever is development. [E]","Salary +8%: helps recruitment and retention over years, but spreads thin, recurs forever, and merit-style pay has null trial results. Keep pay competitive and fair; do not buy quality with it. Allocate a modest amount to fair pay, framed as a retention and values decision. [E on merit pay; V on fairness]","Class size 26 to 22: real but modest effects, strongest in early grades, the largest recurring cost, and it forces extra hires. Reject school-wide; fund targeted small-group early-reading intervention instead. [E for the pattern; H for the targeted alternative]","Devices plus adaptive software: medium is not mechanism (Module 1). Fund only a specific mechanism with a plausible effect for our age group, such as spaced retrieval practice, piloted as a PDSA with a practical measure, not a 1:1 rollout. [E that technology does not teach by itself; H for the pilot]","Coaches: fund, but pointed at formative assessment and the curriculum, working through TLCs rather than as freelance experts. Add protected TLC time (the real cost is teacher hours, so cancel a meeting to pay for it) and high-quality shared curriculum materials. [E for sustained, practice-focused PD and curriculum; H for the exact split]","Hire for disciplinary depth and coachability, tested with a teach-take-feedback-reteach work sample; make TLC participation a condition of employment; make years one to three a structured development program. [H for the criteria; V for the compact]","Write the prediction: about 0.1 SD whole-school over two years from the TLC and formative work, measured externally, with leading indicators reviewed termly. [E for the magnitude]","Policy line for the brief: We select for learnability and build for effectiveness; every new initiative names what it replaces."]},"hinge":[{"q":"Wiliam's main argument against building a strategy on firing weak teachers and hiring stronger ones is:","options":["It is unkind to teachers","Our measures of teacher quality are too noisy before and after hiring, replacements are often novices, and change comes too slowly to move the average","Unions make it impossible","Teachers are all roughly equally effective"],"answer":1,"diagnoses":["Values reading of an evidence argument. Wiliam may also hold that value, but his case rests on measurement reliability, supply and time.","Correct. Credentials predict weakly, value-added correlates only about 0.2-0.5 year to year, deselection improves the workforce only as cohorts turn over, and replacements start less effective.","Political-constraint reading. Even with no political barriers, the measurement and supply problems remain.","Reverses the premise. Variation among teachers is large; that is the whole reason teacher quality is the key lever."]},{"q":"Two interventions both report an effect size of 0.4. One was measured on 7-year-olds with a researcher-designed test one week later; the other on 15-year-olds with a standardized test one year later. Which is more impressive?","options":["The first, because 0.4 is large for young children","The second","Neither; 0.4 is 0.4","The first, because a shorter delay gives a cleaner measurement"],"answer":1,"diagnoses":["Reverses the age effect. Young children grow fast relative to the score spread, so effect sizes are naturally larger for them; 0.4 means less for a 7-year-old.","Correct. Older students, a broad standardized test and a delayed measure all deflate effect sizes, so 0.4 under those conditions represents a much larger real change.","Effect sizes as universal currency. They depend on age, test and sample; comparing them raw is the league-table error.","Proximity equals validity. A test right after the intervention on its own content measures short-term performance, which flatters; a delayed broad test shows what lasted."]},{"q":"According to Wiliam, the best-evidenced use of a marginal dollar of school improvement money is:","options":["Reducing class size","Technology","Sustained, school-based teacher development in classroom formative assessment, alongside a strong curriculum","Performance pay"],"answer":2,"diagnoses":["Intuitive and popular. Real but modest effects at very high recurring cost, diluted at scale (STAR versus California).","Modernity theory. Technology does not teach by itself; it helps only when it delivers a specific mechanism.","Correct. It reaches every classroom, is cheap relative to structural change, and has trial evidence at scale (about two months' progress), with curriculum as the cheap complementary lever.","Incentive theory. Randomized US merit-pay trials mostly found no effect; teachers' bottleneck is know-how, not effort."]},{"q":"Tennessee STAR found meaningful gains from small classes. California's statewide class-size reduction produced much smaller gains. The best explanation is:","options":["STAR was a flawed study","California's students were harder to teach","Scaling required mass hiring of less experienced and often uncertified teachers, which offset much of the benefit","Small classes only work in Tennessee"],"answer":2,"diagnoses":["Dismissing strong evidence. STAR was a large randomized trial and is among the most credible studies in education.","Population-difference guess. Student mix may matter at the margin, but the documented mechanism is the change in teacher quality.","Correct. This is scale-up decay with a named mechanism: the reform consumed the very resource (good teachers) that makes classes effective, and moved strong teachers toward advantaged schools.","Context-mysticism. Everything works somewhere does not mean effects are arbitrary; here the mechanism of the failure is known."]},{"q":"A co-founder says: our charter status and freedom from district rules will make us better than local schools. The best response from this module is:","options":["Agreed: lottery studies show charters produce large gains","Structure confers no advantage by itself; choice schools show small average effects with very wide variation, and the good ones win on what they do in classrooms","Wrong: charters perform worse on average","It depends entirely on funding levels"],"answer":1,"diagnoses":["Cherry-picking the tail. Some urban networks show large lottery-based gains; national averages are near zero. Your school is not automatically in the good tail.","Correct. Autonomy is an option, not an asset; it pays only if spent on curriculum, instruction, culture and teacher development.","Overcorrection. Averages are near zero with wide spread, not reliably negative.","Resource reductionism. Funding matters at the margin, but the evidence points to what happens inside classrooms as the differentiator."]}],"brief_prompt":"Add or rewrite Section 7 (Adults) of your brief: hiring criteria and the work-sample you will use, the first-three-years development plan, and the TLC compact. Add a budget table allocating the $600k (or your own discretionary figure) with, for each line, the expected effect in months of learning, the cost in dollars and teacher hours, and what it displaces. Add a one-paragraph initiative-evaluation rubric and a first not-doing list of at least three things. Tag every line E/H/V, and flag any claim that rests on a raw effect size you have not translated for age and test type.","deeper":["books/10-creating-the-schools-our-children-need.md#Section 2 · Ch 3 — Firing Bad Teachers","books/10-creating-the-schools-our-children-need.md#Section 2 · Ch 5 — Reducing Class Size","books/10-creating-the-schools-our-children-need.md#Section 2 · Ch 7 — Expanding School Choice","books/10-creating-the-schools-our-children-need.md#Section 3 · Ch 8 — Moving Forward","books/10-creating-the-schools-our-children-need.md#Section 3 · Ch 10 — A Knowledge-Rich Curriculum","books/10-creating-the-schools-our-children-need.md#Section 3 · Ch 13 — Pulling It All Together","books/10-creating-the-schools-our-children-need.md#Evidence strength & limits","books/07-embedding-formative-assessment.md#Evidence strength & limits"]},{"id":"m9","num":9,"title":"Running the school as an improvement system","level":"Institutions","minutes":100,"sources":["11-improvement-in-action","08-extraordinary-learning-for-all","07-embedding-formative-assessment","10-creating-the-schools-our-children-need","05-10-to-25"],"hook":"Suppose your new advisory program lifts average attendance. Then someone breaks the data out and finds it helps most students, does nothing for many, and makes things worse for a small group who were already the most at risk. Your board wants to roll it out to every grade. What is the first question improvement science asks, and why is 'did it work on average?' the wrong one?","attempt":{"prompt":"Your school's Year 7 maths attainment has been flat for two years. In 15 minutes: (1) sketch the system that produces this result: the people, processes, handoffs and routines, not just the causes you suspect; (2) name three things (drivers) you believe must change; (3) write the first two-week test of one change, including exactly what you will do, with whom, what you predict will happen, and how you will measure it by Friday of week two. Do it before reading on.","minutes":15},"objectives":["Explain why variation in performance, not the average effect, is the central object of improvement, and apply 'see the system' to a school outcome.","Draw a driver diagram (aim, primary drivers, secondary drivers, change ideas) with a measure at each level.","Design a PDSA cycle with a written prediction, a practical measure and a balancing measure, and explain why it is not an A/B test.","Distinguish measurement for accountability, research and improvement, and say what each does to behavior.","Judge where the software analogies (incident review, observability, canary releases) hold and where they break, and state the evidence limits of Bryk's cases."],"ideas":[{"title":"The system produces the result: study variation, not averages","tag":"E","body":"Anthony Bryk ran the Carnegie Foundation for the Advancement of Teaching from 2008 to 2020. *Improvement in Action* (2020) is a casebook; the method comes from its predecessor, *Learning to Improve* (Bryk, Gomez, Grunow & LeMahieu 2015). The diagnosis first, because it is the best-evidenced part.\n\n**Why reform keeps failing.** American reform runs a loop: adopt a big solution, roll it out everywhere, get widely varying results that are mediocre on average, give up, adopt the next big solution. Schools are complex systems: schedules, roles, curricula, data, norms and relationships jointly produce outcomes. Reforms change one part and assume the rest will adjust. It does not, so the same intervention works here, fails there, and averages out to *small effect*. Most reforms fail in **implementation**, not in their ideas. Decades of implementation research (the RAND Change Agent studies onward) support this. Hence Bryk's reframe: not *what works?* but **what works, for whom, under what conditions?** A randomized trial gives you an average; a leader needs to know whether it will work *here* and what to adjust.\n\n**Principle: focus on variation in performance.** Variation is where the information is. Look at the tails: classrooms, teachers or students where things go unusually well (**positive deviants**, often your best source of change ideas) or badly. The goal is **quality reliably at scale**: shrinking the bad tail, not just raising the mean.\n\n*Where the software analogy fits:* reliability engineering. You care about p99 latency, not mean latency. An intervention with a good mean and a fat left tail is a service that is fast on average and times out for 5% of users, and in schools that 5% is disproportionately the students already most disadvantaged. *Where it breaks:* teacher variation is not configuration drift you fix by reverting to a known-good build. It comes from skill, context, relationships and student mix; you reduce it by building capability and support, not by enforcing a spec. And the goal is less variation in **outcomes**, not uniform practice; positive deviants are to be learned from, not flattened.\n\n**Principle: see the system that produces the current outcomes.** A saying from healthcare improvement, usually credited to Paul Batalden: every system is perfectly designed to get the results it gets. Before changing anything, map how the result is produced.\n- **Process map**: the actual steps (how a failing grade becomes an intervention, or does not). Leaks cluster at handoffs and unowned steps. Fresno Unified mapped the path from high school to college as a leaky pipeline and found many losses were **procedural** (forms, deadlines, missing information, course placement), not a lack of ability or ambition. That is funnel analytics, broken out by subgroup, and the analogy holds well.\n- **Fishbone (cause-and-effect) diagram**, built with the people who do the work, then checked against data. Steer toward causes inside the school's control without pretending outside causes do not matter.\n- **Pareto chart**: rank causes by frequency. Often most course failures come from missing assignments rather than failed tests, which tells you where to act first.\n\n*Analogy:* the **blameless post-incident review**. Not *who broke production?* but *what about our system made this failure likely, and why did no safeguard catch it?* A student failing a course is an incident; look for contributing factors. *Where it breaks:* software leaves logs. In schools, causes are spread out, often invisible (a home situation, a friendship ending) and slow to appear, so every root-cause analysis is a **hypothesis**, not a finding.\n\n**The folk theory to retire** is the one behind most staffroom conversations: bad outcomes come from bad people. Mostly they come from processes nobody designed."},{"title":"Aim and driver diagram: your theory of improvement, written down and revisable","tag":"H","body":"Bryk's first principle: **make the work problem-specific and user-centered.** Start from a precisely stated problem, not a solution. *38% of our ninth graders fail at least one core course in fall semester* is a problem. *Let's adopt a tutoring platform* is a solution looking for one; Carnegie calls the habit **solutionitis**, and it is the default failure of leadership teams. Understand the problem as the people who live it do: interview students and teachers, shadow a student's day, map their journey.\n\n*Analogy (a good fit):* product discovery, jobs-to-be-done, falling in love with the problem. *Where it breaks:* your users are required to attend, teachers are both users of the system and the people delivering it, and what a 14-year-old wants (less homework) is not always their long-term interest. User-centered here means serving their long-run interests with judgment, which a satisfaction survey cannot supply.\n\n**The aim statement**: how much, by when, for whom. Example: by June of year two, 90% of ninth graders pass all core courses, with no gap across income or racial subgroups. It works like an OKR except it names the population and the distribution, not only the average.\n\n**The driver diagram** is the single most important tool to learn. Read left to right:\n- **Aim**: the measurable outcome.\n- **Primary drivers**: the few (typically 3-5) areas you believe must change. For ninth-grade course passing: students' academic mindsets, quality of core instruction, an early-warning and response system, transition supports.\n- **Secondary drivers**: the specific structures, processes and norms acting on each primary driver. Under early warning: timely grade data visible to teachers; a weekly team meeting on at-risk students; a clear menu of responses.\n- **Change ideas**: specific, testable changes. Example: advisors text families the same day a student misses a major assignment.\n\nTwo properties make it more than a slide. First, it is a **hypothesis meant to be revised**: PDSA cycles show which drivers actually move the aim, and you update the diagram, like a living architecture decision record. Second, **every node carries a measure**: outcome measures at the aim, driver measures in the middle, process measures at the change ideas. The diagram *is* your measurement plan. Software analogy: a metrics tree bound to a causal hypothesis.\n\n**How it disciplines a school.** Maintain one driver diagram per annual aim, owned by a small improvement team and reviewed each term. Every proposed initiative must attach to a driver or be declined, which is Wiliam's not-doing list (Module 8) given a mechanism. Keep aims to two or three a year [E for focus as an improvement principle; H for the number].\n\n**Where the other books plug in.** A driver diagram is only as good as the theory in it. Module 1-6 content supplies high-quality drivers: retrieval and spacing, formative assessment, knowledge-rich curriculum, belonging and mentor-mindset feedback. Yeager's belonging and productive-persistence work literally supplied drivers for the Carnegie Math Pathways, the community-college network that redesigned remedial maths into credit-bearing statistics and quantitative reasoning courses (Statway and Quantway). Transcend's Graduate Aims and Leaps (Module 7) belong at the *aim* level (what the community wants), not in the drivers, which should be constrained by evidence.\n\n**Tag it [H].** The driver diagram is a disciplined way to hold a theory; the theory in any particular diagram is a hypothesis until your cycles and measures say otherwise."},{"title":"Measure for improvement: practical measures, and the four kinds you need","tag":"E","body":"Bryk's fourth principle: **we cannot improve at scale what we cannot measure.** Schools are usually drowning in measurement and starved of the right kind.\n\n**Three purposes, three kinds of measure**\n- **Accountability measures** (annual state tests, inspection grades) exist to judge. They are lagging, coarse, and arrive long after the year you could have acted. Using them to drive weekly improvement produces gaming and despair.\n- **Research measures** (long validated scales) exist to publish. They are rigorous, slow and burdensome; using them for improvement produces paralysis.\n- **Practical measures** exist to guide the next change. Most schools have plenty of the first two and none of the third.\n\n**Practical measures** (Yeager, Bryk, Muhich, Hausman & Morales 2013, *Practical Measurement*; note Yeager is the author of Module 3's book) are:\n- **specific to the change** being tested, not a general construct;\n- **fast and cheap**: a few items, seconds to minutes, repeated often;\n- **predictive**: shown to relate to the outcome you care about;\n- **actionable**: back in the practitioner's hands this week, in a usable form;\n- **low stakes**: never used to evaluate people, or they get gamed.\nThe Carnegie Math Pathways used a handful of short productive-persistence survey items, answered in seconds at key moments, to flag students at risk early. In your school: weekly count of drafts submitted per student, pulled from the platform you already use; the share of students choosing a misconception distractor on this unit's hinge question; minutes from bell to first student task.\n\n*Analogy (a strong fit):* **observability**. The annual test is quarterly revenue, a lagging indicator. You need the equivalent of request-level metrics and traces: leading indicators close enough to the work to show whether this week's change did anything. *Where it breaks, three ways:* (1) measuring people changes their behavior (Campbell's law, Goodhart's law); servers do not game dashboards, teachers and students do. (2) Every measure costs instructional time and goodwill. (3) Much of what you care about (understanding, belonging, curiosity) can only be measured noisily. This is Mehta & Fine's warning: a narrow measurement culture can quietly push out depth.\n\n**Four kinds of measure for every change** (from the healthcare improvement tradition):\n- **Outcome**: did the aim move? Lagging.\n- **Driver**: did the hypothesized lever move (sense of belonging, share of teachers using early-warning data)?\n- **Process**: was the change actually done as planned (share of families contacted within 24 hours)? Without it you cannot tell a bad idea from a badly executed one.\n- **Balancing**: did we break something else (teacher workload, time lost from core classes, student stress)? These are guardrail metrics, and they are the ones most often forgotten.\n\n**Separating the systems.** Keep improvement data physically and culturally separate from evaluation. Never feed practical measures into teacher appraisal [E that high-stakes use corrupts indicators; V for choosing trust over surveillance]. Accountability measures are reported, not managed to. A diagnostic across two years: if practical measures improve and accountability measures do not, your drivers are probably wrong; if the reverse, suspect gaming or teaching to the test.\n\n**Read charts properly.** Plot measures over time with changes marked. Deming's distinction between **common-cause** variation (the system's normal noise) and **special-cause** variation (a real signal) stops you reacting to every weekly wobble. Simple run-chart rules (for example, six or more consecutive points above the median) help, but with small, noisy classroom samples false signals are easy to see. Treat a single good week as a rumor."},{"title":"PDSA: small, predicted tests, and why they are not A/B tests","tag":"H","body":"Bryk's fifth principle: anchor practice improvement in **disciplined inquiry**. The unit is the **Plan-Do-Study-Act** cycle, organized by the Model for Improvement (Langley and colleagues, *The Improvement Guide*) and its three questions: What are we trying to accomplish? How will we know a change is an improvement? What change can we make that will result in improvement?\n\n**The cycle**\n- **Plan**: state the change, **a written prediction**, and how you will measure it. Who, where, when.\n- **Do**: run it small: one teacher, one class, one or two weeks.\n- **Study**: compare what happened with what you predicted. The gap is the learning.\n- **Act**: adopt, adapt or abandon, and plan the next cycle.\nThen build **ramps**: a series of cycles growing in scale and in the variety of conditions (one teacher, three, a department, the school). Scale only when the change holds across contexts. Bryk's slogan: **learning fast to implement well**. Fail small and fast so you do not fail large and slow.\n\n**Why the prediction is the whole point.** Without one, no result can surprise you, so your theory of the system is never tested or revised; you simply narrate whatever happened as success. The prediction is also the main protection against fooling yourself. Healthcare reviews of PDSA use find it is often done without rigor: no prediction, poor documentation, cycles that do not build on each other. In many districts *continuous improvement* has decayed into templates filled in after the fact, a lethal mutation of the method itself.\n\n*Analogy (partial):* feature flags and canary releases. Ship to 1%, watch the metrics, widen the rollout; the ramp logic transfers well. *Where it breaks, and this matters:* **a PDSA cycle is not an A/B test.** An A/B test uses randomization and large samples to estimate a causal effect with known confidence. A PDSA cycle is usually n = 1 classroom with no control group. It builds practical knowledge by accumulating many small, predicted, observed tests, read on run charts with judgment, and replicated across contexts. It is closer to a developer iterating on a local build against a clear spec. Its failure modes are regression to the mean, novelty effects, and a good week that had nothing to do with the change. And **students cannot be rolled back**: a failed test used real children's learning time, which is why tests start so small and why settled science should constrain what you test.\n\n**What PDSA is for, and not for.** Use it to make proven practices work reliably *here*: how to run hinge questions in Year 7 maths with 30 students and a 50-minute period, how to get redraft time to actually happen, how to make the early-warning meeting produce action. Do not use it to rediscover pedagogy from scratch. Local PDSA results are not evidence on a par with decades of cognitive science; the science should decide which change ideas are worth testing.\n\n**The same loop at three scales.** Formative assessment (Module 6) is PDSA inside a lesson: elicit evidence, interpret, adjust. A TLC is PDSA for a teacher's practice: commit to a technique, try it, report back, revise. Improvement science is formative assessment applied to the institution. Transcend's Test-Drive (Module 7) is a PDSA ramp for a newly designed experience; run it with Bryk's discipline of prediction, practical measures and balancing measures.\n\n**Tag it [H].** The method has a strong record in manufacturing and a substantial but mixed one in healthcare; in schools the evidence is mostly case-based. Its value depends entirely on keeping the discipline."},{"title":"Networks, hubs, leadership, and what the cases can and cannot prove","tag":"H","body":"Bryk's sixth principle: **accelerate learning through networked improvement communities (NICs).** A single school learns slowly: few cases, little variation, no way to tell local luck from a real effect. A network of schools working on the *same* problem, with a shared aim, a shared driver diagram, shared measures and a coordinating hub, runs tests in many contexts at once and sees what holds up. *Analogy (reasonable):* an open-source project with a common roadmap, shared test suite and maintainers who merge contributions. *Where it breaks:* NICs depend on trust and voluntary participation across organizations with different bosses, calendars and incentives, and hubs need long-term funding. None of it is as cheap as a pull request.\n\n**The six cases** (read them as organizational capability, not programs):\n- **Fresno Unified**: mapped the leaky pipeline to college; many losses were procedural and fixable.\n- **New Visions for Public Schools** (NYC): an **analytic hub** building tools that give counselors and teachers a live, student-by-student view of credits, exam requirements and attendance, treating practitioners as users. Data helps only inside routines that say who looks, when, and what they do next. Staff this role at your school like an internal-tools product owner; the classic failure is dashboards nobody opens.\n- **Summit Public Schools**: a radical redesign treated as continuous learning, not a launch. You are Summit: v1 will fail in ways you cannot predict, so budget roles, time and data for learning from the first term. (Its personalized-learning platform later drew controversy in some adopting districts; the book does not settle whether the model works elsewhere.)\n- **High Tech High**: even a strong, admired pedagogy hid inequitable outcomes until data were broken out by subgroup. Improvement had to be framed as professional inquiry, not compliance.\n- **National Writing Project, College-Ready Writers Program**: a NIC on a classroom problem (argument writing). An independent SRI randomized trial found positive effects on teacher practice and student writing, one of the rare places improvement work has RCT support, though for the whole package of content, professional learning and routines.\n- **Menomonee Falls** (Wisconsin): under superintendent Pat Greco, everyone was trained in improvement methods, from teachers and operations staff to the board and students; culture moved from blame to learning. The DevOps-transformation analogy fits, including the lesson that it is mostly culture. Risk: dependence on one leader.\n\n**Leadership decides whether any of this works.** Leaders set aims, give time and roles, make it safe to surface failure, and model inquiry. Improvement run as compliance becomes paperwork. Transcend's learner-centered leadership and routine maintenance point the same way.\n\n**What the book can and cannot prove.** These are case narratives, chosen because they went well, about Carnegie partners, largely from leaders' own accounts, with no comparison groups. They show that improvement practices can be adopted and are associated with improving trends; they cannot show the methods caused those trends, or how often such efforts fail. The cases also concentrate on **measurable secondary-school outcomes** (graduation, credits, attendance, college access). Do not assume transfer is equally easy to hard-to-measure goals like understanding or curiosity. Improvement routines consume adult time, so count that as a balancing measure.\n\n**Institutional design for a founder** [mostly H]: two or three annual aims with subgroup breakdowns; a student-level funnel and early-warning system from day one (early-warning indicators such as attendance and course failure predict later outcomes well [E, Chicago on-track research]); an improvement lead; protected weekly inquiry time; blameless reviews of student failures; all staff trained in basic methods; join or found a NIC; and succession planning, so the system lives in roles and routines, not one person."}],"worked_example":{"title":"Decision: the school's improvement operating system","steps":["Choose one primary aim for year one, stated for a population and a distribution: for example, by June, 85% of Year 7 students reach the unit mastery threshold in maths on the delayed end-of-unit check, with no gap by prior attainment or income. [E for the method of precise aims; V for choosing this aim]","Before choosing solutions, see the system: break current results out by class, teacher and subgroup; Pareto the reasons (missing practice? misconceptions surviving the unit? absences?); shadow two students for a day; map what happens when a student falls behind. Look for positive deviants among your own teachers. [E for the diagnostic stance; H for what you will find]","Draw the driver diagram with an improvement team of three to five people: for example, primary drivers of retrieval and spaced practice built into lessons, in-lesson formative checks acted on, time on task in the first ten minutes, and belonging in maths. Every initiative must attach to a driver or be declined. [H]","Attach a measure to each level: outcome (delayed unit check), driver (hinge-question distractor rates; a two-item belonging pulse each fortnight), process (share of lessons with a planned all-student check), balancing (teacher planning hours; student stress item). [E for the four-measure structure; H for the specific measures]","Run PDSA cycles of two to four weeks, each with a written prediction before it starts and a 30-minute study meeting at the end: roughly three cycles per team per term, ramping from one class to the department only when a change holds. [E for disciplined small tests as method; H for the cadence]","Keep practical measures in a lightweight dashboard separate from the gradebook, and never use them in appraisal. Report accountability measures; do not manage to them. [V; E that high-stakes use corrupts indicators]","Wire the TLCs from Module 6 in as the classroom-level instance of the same loop, and use community codesign sessions from Module 7 to shape the aim, not the drivers. [H; V]","Hold a blameless review whenever a student fails a course: contributing factors, not culprits, feeding the fishbone. [H]","Look outward: find two or three peer schools working on the same problem and share the driver diagram and measures; a network sees variation a single school cannot. [H]","Policy line for the brief: Every change is a test with a prediction; improvement data is for learning, never for judging."]},"hinge":[{"q":"Bryk's principle 'see the system that produces the current outcomes' means:","options":["Build data dashboards so leaders can see results","Map the actual processes, handoffs and conditions that produce the outcome, including the ones nobody designed","Hold everyone accountable for the outcome","Adopt a coherent whole-school program"],"answer":1,"diagnoses":["Tools equal seeing. Dashboards show outcomes, not the process producing them; New Visions' lesson is that data helps only inside routines.","Correct. Process maps, fishbones and conversations with the people doing the work reveal where results are actually produced, like a blameless incident review.","Accountability equals system. Assigning blame to people is exactly what 'every system is perfectly designed to get the results it gets' warns against.","Program equals system. Programs are solutions; seeing the system is diagnosis, and it comes first."]},{"q":"A PDSA cycle run without a written prediction is deficient mainly because:","options":["Nobody will remember what was planned","Without a prediction the result cannot surprise you, so the theory of the system is never tested or revised","Predictions are required for research ethics","Predictions motivate the team"],"answer":1,"diagnoses":["Documentation reading. Record-keeping matters, but you could document a plan perfectly and still learn nothing.","Correct. The gap between prediction and result is the learning, and writing it down first is the main defense against narrating any outcome as success.","Compliance reading. PDSA is not a research protocol; this confuses improvement with research measurement.","Motivational reading. Any motivational effect is incidental; the function is epistemic."]},{"q":"Which of these is a practical measure, in Bryk's sense, for the change 'students revise their writing'?","options":["End-of-year state writing score","A validated 40-item writing self-efficacy scale given each term","A weekly count of drafts submitted per student, pulled from the platform already in use","The teacher's overall impression at the end of the unit"],"answer":2,"diagnoses":["Accountability measure used for improvement. It is lagging and coarse, and arrives too late to guide any change this term.","Research measure. Rigorous but slow, burdensome and not specific to the change; it produces paralysis, not iteration.","Correct. It is specific to the change, cheap, frequent, embedded in the work and back in teachers' hands within days, and it stays low stakes.","Too vague to detect change. An impression is not comparable week to week and is open to confirmation bias."]},{"q":"A teammate says: 'A PDSA cycle is basically an A/B test for teachers.' What is the best correction?","options":["Right; that is why each cycle needs a control group","Wrong: a PDSA is usually n = 1 with no control; it builds practical knowledge through many small predicted tests, run charts and replication across contexts, not statistical inference from one test","Wrong: PDSA cycles are purely qualitative and use no data","Right, except PDSA uses larger samples"],"answer":1,"diagnoses":["Imports the A/B frame. Adding a control to every two-week classroom test is usually impractical and misses how PDSA builds knowledge.","Correct. The ramp logic resembles a canary release, but the inference is different; its protections are the prior prediction, run charts and replication, and students cannot be rolled back.","Overcorrection. PDSA relies on practical measures and run charts; it is disciplined and quantitative where possible.","Reverses the facts. PDSA samples are smaller, which is exactly why self-deception is the main risk."]},{"q":"Your new advisory program raises attendance. Which is a balancing measure you should also be tracking?","options":["Attendance rate","The share of advisors who ran the advisory session as planned","Advisor workload and instructional time lost from core classes","Students' sense of belonging"],"answer":2,"diagnoses":["That is the outcome measure: it tells you whether the aim moved, not what else changed.","That is a process measure: it tells you whether the change was carried out as designed.","Correct. Balancing measures are guardrail metrics that catch improvement in one place quietly breaking something else, and teacher workload is the most often forgotten.","That is a driver measure if belonging is a hypothesized lever for attendance."]}],"brief_prompt":"Write Section 9 (Improvement system) of your brief: your year-one aim (how much, by when, for whom), a driver diagram with three to five primary drivers and a measure at each level, and one fully specified PDSA cycle (change, prediction, practical measure, process measure, balancing measure, study date). State how improvement data is kept separate from appraisal. Then open your brief's Open Hypotheses register and convert three [H] items from earlier modules into PDSA cycles with predictions. Note which software analogy you relied on and one place it could mislead you.","deeper":["books/11-improvement-in-action.md#The six principles","books/11-improvement-in-action.md#The core toolkit (background knowledge, standard Carnegie/IHI practice)","books/11-improvement-in-action.md#Ch 2 — Supporting Improvement Through an Analytic Hub (New Visions for Public Schools)","books/11-improvement-in-action.md#Ch 6 — Transforming a School District (Menomonee Falls, Wisconsin)","books/11-improvement-in-action.md#Evidence strength & limits","books/08-extraordinary-learning-for-all.md#Ch 8 — Deepening Your Design Journey","books/07-embedding-formative-assessment.md#Connections"]},{"id":"m10","num":10,"title":"Integration: tensions, decision rules, and the unified model","level":"Integration","minutes":90,"sources":["00-foundational-papers","01-how-learning-happens","02-scienceblind","03-intellectual-lives-of-children","04-productive-failure","05-10-to-25","06-beyond-the-science-of-reading","07-embedding-formative-assessment","08-extraordinary-learning-for-all","09-in-search-of-deeper-learning","10-creating-the-schools-our-children-need","11-improvement-in-action","12-why-we-remember","13-learning-scientific-concepts"],"hook":"You have now met a dozen authors who seem to disagree about almost everything: explicit teaching versus struggle first, knowledge versus curiosity, standard mechanisms versus community design, measurement versus depth. What if most of those fights disappear once you ask four questions: for whom, for what goal, at what point in expertise, and with what consolidation?","attempt":{"prompt":"Before reading on, and without looking back at earlier modules: write down the five biggest disagreements among the authors you have met. For each, write (a) who you side with, (b) under what specific conditions you would switch sides, and (c) what you would observe in your own school that would tell you it is time to switch. Then take your Brief v0 from Module 0 and, in the margin, re-tag three claims as E, H or V. You will compare both against the model and rules below.","minutes":15},"objectives":["Reproduce the unified three-band model (minds, design, institution) and the improvement loop from memory, and explain each arrow.","For each major tension, state the conditional decision rule, the evidence behind each branch, and the switch signal.","Trace any institutional policy down to the mind-level mechanism it relies on and back up through a practical measure.","Explain why institutions improve through the same mechanisms that make children learn (the symmetry principle), and design for it.","Re-tag Brief v0 correctly, explaining each original tagging error and which module corrected it."],"ideas":[{"title":"The unified model: three bands, constraints up, enablement down, and a loop","tag":"H","body":"Everything in this course fits one picture. Draw it from memory until you can.\n\n**Band 1, Minds (bottom; mostly [E]).**\n- **Working memory**: tiny and fragile, the bottleneck for new material (Sweller).\n- **Long-term memory**: schemas, the seat of expertise; strengthened by effortful retrieval, spacing, and errors followed by correction (Roediger & Karpicke, Cepeda, Bjork, Ranganath).\n- **Prior knowledge**: coherent intuitive theories that assimilate new input and are suppressed, never deleted (Shtulman, Posner, Chi, Vosniadou, Amin).\n- **Motivational state**: curiosity as an information gap that needs knowledge to exist (Gruber, Gelman & Ranganath 2014; Engel), and adolescent sensitivity to status and respect (Yeager).\n\n**Band 2, Design (middle; [E] for mechanisms, [H] for parameters).**\n- **Instruction**: explicit by default, generate-then-consolidate when its conditions hold, guidance fading with expertise (Kirschner, Rosenshine, Kapur).\n- **Curriculum**: coherent, cumulative, knowledge-rich; concepts sequenced by prerequisite (Wexler, Wiliam, Shtulman).\n- **Assessment**: formative, hinge questions, comment-only feedback, success criteria (Wiliam & Leahy).\n- **Relationship**: mentor mindset, wise feedback, question-welcoming norms (Yeager, Engel).\n\n**Band 3, Institution (top; [H] and [V] heavy).**\n- **Adult learning**: TLCs, hiring for learnability, development over selection (Wiliam).\n- **Structure**: schedule, grouping, the grammar of school, apprenticeship features in the core (Mehta & Fine).\n- **Community and purpose**: codesign, which knowledge counts, identity (Samouha et al., Mehta & Fine).\n- **Improvement system**: aim, driver diagram, PDSA, practical measures (Bryk).\n\n**Upward arrows mean *constrains*.** Load limits pacing and guidance. Schemas determine readiness. Intuitive theories determine what must be confronted. Status determines how feedback lands. No institutional or design choice can repeal a band below it; a schedule that ignores spacing, or a feedback policy that ignores status, fails no matter how good it looks on the org chart.\n\n**Downward arrows mean *enables*.** Adult learning makes the right instructional default easy. Structure gives it time and audience. Community decides what is worth knowing. The institution does not teach anyone directly; it makes good design the path of least resistance for every adult, every day.\n\n**The loop is the point.** From the improvement system, practical measures reach down to what is happening in minds (retrieval accuracy, misconception rates on hinge questions, redraft rates, question rates, belonging pulses), and predictions tested there revise the defaults above. **The institution is the thing that learns.**\n\n**Read the badges.** Certainty declines as you go up. Band 1 rests on laboratory and classroom experiments replicated for decades. Band 2 mechanisms are well supported, but parameters (how long, how often, which technique) are local bets. Band 3 rests on a few trials at scale (the EEF formative assessment trial, Tennessee STAR, the Writing Project's RCT), observational case studies (Mehta & Fine, Bryk, Transcend), and values. If your brief's institutional section is mostly [E], you are over-claiming.\n\n**How to use the model.** For any proposal, trace a path. Down: which design mechanism does it enable, and which mind-level constraint does that mechanism respect? Back up: what practical measure would show it working in minds, and which default would you revise if it did not? A proposal with no traceable path (a device rollout justified as engagement, a new schedule justified as innovation) is decoration. A proposal whose path breaks a lower-band constraint is a mistake, however popular. [H: the model is this course's synthesis, not a finding of any single book.]"},{"title":"Design-level tensions are resolved by conditions, not winners","tag":"E","body":"The instructional debates in this curriculum mostly dissolve once you specify for whom, for what goal, at what point in expertise, and with what consolidation. Each rule below has an evidence base on both branches and a **switch signal**: what you would observe in your own school that says change course.\n\n**1. Explicit instruction vs. productive failure** (Kirschner, Sweller & Clark vs. Kapur). **Rule:** default to explicit instruction with worked examples, fading guidance as expertise grows (the expertise-reversal effect). Use generate-then-consolidate only when all four hold: the goal is conceptual understanding or transfer, not procedure; learners have relevant prior knowledge to activate; the problem admits several plausible approaches; and a scripted consolidation compares student methods with the canonical one. Evidence: Kapur's meta-analysis finds benefits for conceptual knowledge and transfer (about g = 0.36, higher with faithful design) and none for procedural knowledge (about -0.03), with larger effects from grade 6 upward. PF is not discovery learning; it satisfies Kirschner's core mechanism because full instruction follows. Never use unguided discovery with novices. **Switch:** if observations show rushed, muddled consolidation, or procedural fluency drops on practical measures, revert to explicit teaching for that unit.\n\n**2. Knowledge vs. curiosity** (Wexler and Wiliam vs. Engel). Largely a false tension. Gruber, Gelman & Ranganath showed curiosity enhances memory for its target, and curiosity requires enough knowledge to notice a gap. Engel's evidence is real, though: children ask far more questions at home than at school (Tizard & Hughes 1984), and demonstration narrows exploration (Bonawitz et al. 2011). **Rule:** a knowledge-rich curriculum is the substrate; curiosity is protected by classroom norms (questions answered and followed up, uncertainty modeled, pacing that allows detours, open the question before giving the answer), not by content-free exploration time. Put the learning objective inside the question, since curiosity's spillover to unrelated material is small and can reverse. **Switch:** if question rates per hour fall year on year, fix the norms, not the curriculum.\n\n**3. Confront misconceptions vs. avoid showing them.** Posner's conditions require dissatisfaction plus an intelligible, plausible, fruitful alternative; Shtulman & Valcarcel (2012) show intuitive theories are suppressed rather than deleted. **Rule:** confront, but only once the correct model is intelligible, with immediate correction, and never leave the wrong model as the last thing students see. Teach mechanism, not just conclusions. **Switch:** if hinge-question distractor rates for a misconception *rise* after a confrontation lesson, students are remembering the confrontation as the content; restructure.\n\n**4. Testing as measurement vs. testing as learning.** Retrieval changes memory (Roediger & Karpicke; Ranganath), and errors followed promptly by correction are learning events. **Rule:** most testing exists for learning: frequent, low stakes, cumulative, comment-only, spaced. A small number of summative points exist for reporting. **Switch:** if students or families treat every check as a judgment, the framing has failed; rename and reframe before changing the practice.\n\n**5. How feedback lands.** High standards and high support are a combination, not a midpoint (Yeager). **Rule:** critique paired with an explicit statement of the high bar and belief the student can meet it; task-focused, never ego-focused (Kluger & DeNisi). **Switch:** if compliance rises while effort quality falls, you have drifted to enforcer; if satisfaction rises while effort quality falls, to protector.\n\nNotice the shape of every rule: a **default**, **named conditions for the exception**, and an **observable trigger** for switching. That is a decision rule a new teacher can use on a Tuesday, which is what makes it institutional rather than philosophical."},{"title":"Institution-level tensions: six rules with switch signals","tag":"H","body":"The institutional tensions have thinner evidence, so the rules are hypotheses to run, not settled answers. Hold each with its switch signal.\n\n**1. Standardization vs. community design** (Wiliam and Wexler's coherence vs. Samouha et al.'s codesign). **Rule:** standardize the mechanisms (retrieval, feedback, TLCs, the default lesson) and the knowledge sequence within each discipline; codesign purpose, culture, the periphery, and knowledge priorities where evidence is silent [V]. Write down in the founding compact which layer is open. **Switch:** if codesign sessions start proposing to change mechanisms (drop phonics, match learning styles), that is a governance failure. Honor the underlying need and answer it in the open layer.\n\n**2. Accountability vs. improvement** (external regimes vs. Bryk). **Rule:** keep the two measurement systems physically and culturally separate. Improvement measures never enter evaluation; accountability measures are reported, not managed to. **Switch:** if practical measures improve for two years while accountability measures do not, your drivers are wrong; if the reverse, someone is gaming or teaching to the test.\n\n**3. Mastery vs. identity and creativity** (No Excuses High vs. Dewey High). **Rule:** mastery first in the core, built on a knowledge sequence and explicit teaching, with one authentic product per course per term; identity and creativity also concentrated in a protected periphery every student joins, with mixed-age leadership ladders. **Switch:** if the periphery becomes the only place students say they learn, the core has failed. If core scores rise and student voice collapses, the periphery is being starved, or the core has drifted to enforcer.\n\n**4. Selecting vs. developing teachers** (folk hire-the-best vs. Wiliam). **Rule:** develop. Hire for disciplinary depth and coachability using work samples; make years one to three a structured development program; TLCs for everyone, indefinitely. **Switch:** if after three years of TLCs the within-school spread in teacher effectiveness has not narrowed, the TLC design is broken. The usual causes are no real accountability for trying techniques, TLC time cannibalized, or turnover.\n\n**5. Structural vs. instructional reform** (schedule and model enthusiasts, and Mehta & Fine's restructuring agenda, vs. Wiliam's cost evidence). **Rule:** spend change capacity on instruction, assessment, curriculum and adult learning first. Keep structure conventional unless a specific instructional need requires a change (for example, longer blocks for lab or studio work), and run that change as a named hypothesis. Remember that a new, independent school gains nothing from its container alone. **Switch:** if instructional work is blocked by structure (no common time for TLCs; no slot for redrafting), change structure minimally and deliberately.\n\n**6. Adolescent autonomy vs. adult direction** (enforcer and protector vs. Yeager's mentor). **Rule:** high standards with high support, transparency about why, sincere questions, and choice within structure. Discipline systems and advisory are audited against this, not only lessons. **Switch:** compliance up while effort quality falls means enforcer drift; satisfaction up while effort quality falls means protector drift.\n\n**Three patterns across all six.**\n- The resolution is almost always **layering**: fix one layer by evidence, open another to values or local choice, and write down which is which. Wiliam's *tight but loose* is the same move applied to teacher practice.\n- Every rule needs an **observable switch signal**, which means a practical measure (Module 9) must exist before the tension becomes live. If you cannot name the signal, you cannot run the rule.\n- The failure modes are **drift**, not dramatic reversal: enforcer drift, periphery starvation, measures quietly entering appraisal, codesign quietly touching mechanisms. Drift is detected by routine maintenance (Transcend) and run charts (Bryk), not by annual strategy retreats."},{"title":"Symmetry: the institution learns through the same mechanisms as the child","tag":"H","body":"The deepest integration in this curriculum is that the Band 1 mechanisms apply to adults and to the organization itself. Several authors state versions of this independently. Mehta & Fine's **symmetry principle**: teachers need the conditions the school wants for students. Kirschner & Hendrick's closing warning: the central problem for a school is not choosing practices but preserving their active ingredient at scale. Bryk: improvement is an organizational capability. Put together, they give you a design method: **design adult and organizational learning with the same science you use for children.**\n\n**Working memory → initiative overload.** A staff juggling eight initiatives is a working memory with too many interacting elements; nothing gets encoded into routine. Wiliam's two or three priorities and a not-doing list is cognitive load theory applied to a faculty.\n\n**Novices need worked examples → new staff need worked examples too.** Expertise reversal applies to teachers. A first-year teacher asked to run an open-ended inquiry cycle on their own practice is a novice given minimal guidance. Give them scripted routines, model lessons, and worked examples of good improvement work first, then fade. Improvement inquiry, like student inquiry, works best for people with enough knowledge to use it.\n\n**Spacing and retrieval → the TLC cadence.** Monthly meetings over two years are spaced practice for adults: try the technique, return a month later to retrieve and report on it, revise. A two-day workshop is massed practice, which Module 1 predicts will feel productive and fade.\n\n**Feedback that can hurt → appraisal design.** Kluger & DeNisi's finding applies to teachers: feedback aimed at the self (ratings, rankings, *needs improvement*) tends to lower performance; task-focused, forward-looking feedback helps. Hence non-evaluative peer observation focused on the teacher's own chosen technique, and a hard wall between improvement data and appraisal.\n\n**Status and respect → the mentor mindset for adults.** Teachers, like adolescents, resist being treated as incompetent or controlled. Mandating a technique and inspecting for it (the traffic-light principal of Module 6) is the enforcer mindset; letting everyone do as they please is the protector. TLCs (choice plus accountability) and learner-centered leadership are the mentor version.\n\n**Formative assessment at three scales.** Elicit evidence, interpret, adjust. In a lesson it is the hinge question. For a teacher it is the TLC's report-back-and-commit cycle. For the institution it is the PDSA cycle with a prediction, a practical measure and a balancing measure. It is one loop at three zoom levels. If your school does it well at one level and not the others, expect the others to erode it.\n\n**Misconceptions → lethal mutations.** Children's intuitive theories assimilate new instruction into old models, producing synthetic models. Organizations do the same to new practices: the grammar of school absorbs reforms (Tyack & Cuban), and techniques keep their names while losing their active ingredients. The countermeasures rhyme too: name the active ingredient explicitly (like teaching the mechanism), watch for the characteristic mutation (like a diagnostic distractor), and **codify** routines in writing so they survive turnover (Van Ness).\n\n**Curiosity and identity → retention.** Mehta & Fine's deepest teachers had learned deeply in a field; teachers whose own practice is a field of inquiry stay and grow (Kraft & Papay: growth continues longer in supportive environments).\n\n**Design test for your brief.** For each adult-facing structure (hiring, onboarding, TLCs, observation, meetings, appraisal), ask: would I design a child's learning this way? If you would never teach a novice with a single lecture, massed and followed by a graded verdict, do not onboard teachers that way either. [H: the symmetry is a strong, cross-book synthesis; its specific applications are hypotheses to test.]"},{"title":"Tagging discipline: evidence, hypothesis, value, and re-tagging your v0","tag":"V","body":"The E/H/V tags are not bureaucracy. They are how a founder avoids the most common failure in education: **laundering values and hunches as evidence**, then being unable to learn because nothing was ever framed as testable.\n\n**What each tag means**\n- **[E] Evidence**: a mechanism or effect with convergent, replicated support, ideally including causal designs. Even within [E], strength varies: a large randomized trial at scale (EEF formative assessment, Tennessee STAR, the Writing Project RCT) beats a meta-analysis of small studies, which beats a single lab finding, which beats an observational case study. Name the strength when it matters.\n- **[H] Hypothesis**: plausible, mechanism-grounded, but untested in your form or context. An [H] is a promise to test: it belongs in your Open Hypotheses register with the PDSA cycle or evidence that would resolve it.\n- **[V] Value**: a commitment about what matters that evidence cannot settle (which knowledge counts, equity of access, joy, community voice). A [V] is not weaker than an [E]; it is a different kind of claim. Register it with one sentence on who might reasonably disagree.\n\n**Split mixed sentences.** Most real design claims mix types. *Every teacher joins a monthly 90-minute TLC for two years, separate from appraisal* is [E] for the package (a trial at scale), [H] for the parameters (size, cadence are defaults), and [V] for the separation (a trust commitment with plausible but untested psychology). Tag each part.\n\n**The typical v0 errors, and which module fixes them**\n- *Students learn best by discovering things for themselves* tagged [E]: contradicted by the novice-guidance evidence. Rewrite with conditions (Modules 1, 4).\n- *Teaching to learning styles* in any form: delete (Module 1).\n- *Small classes will drive our results* tagged [E] with no caveat: [E] that effects are real, modest and expensive; the strategic claim fails on cost (Module 8).\n- *We will be excellent because we are independent and innovative*: contradicted by choice-sector evidence; autonomy is an option, not an asset (Module 8).\n- *Project-based learning produces deeper learning* tagged [E]: [H]. Mehta & Fine's periphery pattern is observational and selection-confounded, and Dewey High shows the failure mode (Module 7).\n- *We'll use data to track progress*: untaggable until it names the decision the data changes and the cycle length (Modules 6, 9).\n- *Every child deserves to be known by an adult* tagged [E]: it is [V] (with some [E] behind belonging). Tagging it [V] makes it stronger, not weaker, because nobody can refute it with a study.\n- *Hire the best teachers* as the strategy: [E] contradicts it as a primary lever; replace it with develop-over-select (Module 8).\n- *Formative assessment will add half a year of learning*: effect-size naivety; plan for about 0.1 SD at scale (Modules 6, 8).\n\n**Heuristics for honest tagging**\n- Obviousness is not evidence: an unstudied obvious claim is [V] or [H].\n- If a claim cites one admired school, it is [H] at best.\n- If a claim quotes an effect size, it must also say age, test type and cost, or it is not yet [E] for your decision.\n- If your Band 3 sections are mostly [E], you are over-claiming; if they are mostly [V], you are hiding from scrutiny.\n- Every [H] should name its switch signal and its first test.\n\n**The point for a founder.** A brief tagged this way is an operating document. The [E] claims become defaults you defend. The [H] claims become your first year of PDSA cycles. The [V] claims become the charter you recruit families and staff around."}],"worked_example":{"title":"One path through the whole model: comment-only marking, traced down to minds and back up through the loop","steps":["Institution band, the policy: formative work receives comments only; every comment requires a student response in protected lesson time; grades appear at a few summative points per term. [E for the mechanism; H for the cadence]","Institution band, adult learning: the policy is built as a habit through TLCs, where teachers choose a feedback technique (find it and fix it, whole-class feedback) and report back monthly. Tight on the active ingredient (students act on comments), loose on the technique. Anticipated lethal mutation: comments written, no response time given. [E for the TLC package; H for the specifics]","Design band, assessment: feedback that moves learning forward. Butler: grades cancel comments. Kluger & DeNisi: self-focused feedback often lowers performance, task-focused feedback helps. Ramaprasad: feedback exists only if used to close the gap. Exemplars and success criteria make the gap visible. [E]","Design band, relationship: how the comment lands depends on trust and status. A wise-feedback frame (high standard, stated belief the student can meet it) raised revision dramatically in Yeager's study, most among students with least reason to trust school. [E]","Minds band, why it works: without a grade, attention stays on the task rather than on ranking (task- vs. ego-involvement; Boekaerts' growth vs. well-being pathways). The required response is generation and retrieval, which strengthen memory. Correcting a flagged error is a prediction-error learning event (Ranganath). A comment focused on one or two criteria respects working-memory limits, and a comment that names the specific misconception targets the prior-knowledge structure that needs to change. [E]","Back up the loop, practical measures: weekly redraft rate per class (process), quality gain between draft and redraft on a small rubric sample (driver), share of students making the same error on the next task (driver). Balancing measures: teacher marking hours, and family complaints about missing grades. [H for these specific measures]","Prediction, written before term one: redraft rate above 80% by week six; marking hours flat or down; the repeat-error rate on the targeted misconception halves by the end of the unit. [H]","Switch signals: if redraft rates rise but quality gains do not, comments are too vague, so fix comment quality in TLCs. If families read every check as a judgment, the framing has failed, so rename and reframe before changing the practice. If marking hours rise, the policy has mutated into more writing, so cut volume. [H]","The lesson: every institutional policy should have a traceable path down to a mind-level mechanism and a measure on the way back up. If you cannot draw both, you have a slogan, not a design."]},"hinge":[{"q":"'Productive failure contradicts Kirschner, Sweller & Clark.' Which is the best assessment?","options":["True; you must pick a side","False; they agree entirely","Mostly false: PF includes full explicit consolidation and targets learners with relevant prior knowledge, so it respects the core mechanism while disagreeing about sequencing for conceptual goals","True for mathematics, false for science"],"answer":2,"diagnoses":["Winner-take-all reading. The debate resolves by conditions (goal, prior knowledge, consolidation), not by a winner.","False harmony. They genuinely differ on how much struggle before instruction helps, and on where the prior-knowledge threshold sits.","Correct. Kirschner, Sweller & Clark attack minimal guidance; PF is generate-then-instruct with scripted consolidation, beneficial for conceptual understanding and transfer and not for procedures.","Domain reading. The boundary is goal type and prior knowledge, not the subject."]},{"q":"Which is the correct chain from institution to mind for the policy 'all teachers use hinge questions'?","options":["The institution mandates it, teachers comply, students learn more","TLCs build the habit; the hinge question makes every student's thinking visible; the teacher's next move adapts; students get instruction matched to their current schema, with misconceptions caught while they can still be corrected","Hinge questions test students, and testing improves memory","Students see that teachers care, so motivation rises"],"answer":1,"diagnoses":["Mandate theory. Mandates produce surface compliance and lethal mutations; habit change needs the TLC structure.","Correct. Each link names the band and mechanism: adult learning, elicitation, contingent teaching, and the prior-knowledge and working-memory constraints in minds.","Retrieval-only reading. True as far as it goes, but it misses the main mechanism, which is the adaptive decision the evidence enables.","Affective-only reading. Relationship matters, but it is not the mechanism by which a hinge question improves learning."]},{"q":"Your brief says: 'Small classes improve learning.' What is the correct tag, and why?","options":["[E], because it is obvious","[E] with a caveat: the effects are real (strongest in early grades) but modest and expensive relative to alternatives, and they shrink at scale","[V], because class size is a values choice","[H], because nobody has studied it"],"answer":1,"diagnoses":["Obviousness as evidence. The tag is right only by luck; the reasoning would let any intuition pass as evidence.","Correct. Tennessee STAR supports a real effect; California shows dilution at scale; the strategic question is cost per unit of learning. If parents value being known, that part is a separate [V].","Over-tagging V to avoid scrutiny. There is strong evidence about class size; a value may also be involved, but it does not replace the evidence.","Ignorance of the literature. Class size is among the most studied questions in education."]},{"q":"At a community design session, families propose replacing systematic phonics in K-2 with a 'balanced literacy' approach they saw at a neighboring school. Under your standardization-vs-codesign rule, you:","options":["Adopt it; community ownership is essential to survival","End community codesign; families should not shape the school","Recognize a proposal to change a mechanism, which the compact fixes by evidence, then surface the underlying need (for example, joy in reading, rich books) and meet it in the open layer, such as read-alouds, knowledge-rich texts and the library","Run a PDSA cycle comparing phonics with balanced literacy in two classes"],"answer":2,"diagnoses":["Voice-validates-mechanism. Early reading mechanics are one of the most settled areas in the curriculum; adopting this would harm children.","Throwing out the signal. Codesign is how you learn needs and build the coalition that sustains the school; the fix is governance of layers, not abolition.","Correct. The compact says which layer is open. The need behind the proposal is real and answerable without abandoning the mechanism.","Misuse of PDSA. Improvement cycles implement settled science locally; they are not for re-testing it on children who cannot be rolled back."]},{"q":"Your brief says: 'Every core course ends each term in an authentic product for a real audience, which will deepen learning.' What is the best tag?","options":["[E], because Mehta & Fine showed it","[H], because it is grounded in a strong but observational, selection-confounded pattern, and needs testing in your core courses with practical measures","[V], because authenticity is a preference","Delete it; there is no evidence at all"],"answer":1,"diagnoses":["Promoting a case study to evidence. Mehta & Fine describe where depth appeared; they did not measure learning outcomes or test the transplant.","Correct. It is a well-grounded hypothesis. Register it with a first test and a switch signal, such as mastery checks on the disciplinary content inside the product.","Under-tagging. There may be a value component, but the causal claim ('will deepen learning') is empirical and testable.","Overcorrection. The periphery pattern, apprenticeship research and motivation research make it a reasonable bet; weak evidence is not no evidence."]}],"brief_prompt":"Re-tag every declarative sentence in Brief v0, splitting sentences that mix evidence, hypothesis and value. Write a one-page changelog: for each tagging error in v0, the original claim, the corrected tag, and the module that fixed it. Add the unified model as a one-paragraph Section 3 preamble showing how your school's structures trace down to mind-level mechanisms. For each of the ten tensions, write your rule and switch signal in one or two lines each, and move every [H] into the Open Hypotheses register with its first test. This is Brief v4; the capstone produces v5.","deeper":["synthesis/learning-design.md#4a. Unified model: learning → design → institution (diagram spec)","synthesis/learning-design.md#4b. Major tensions with conditional decision rules","books/04-productive-failure.md#Evidence strength & limits","books/00-foundational-papers.md#How these six fit together","books/03-intellectual-lives-of-children.md#Connections","books/09-in-search-of-deeper-learning.md#Connections","books/10-creating-the-schools-our-children-need.md#Connections","books/11-improvement-in-action.md#Connections","books/08-extraordinary-learning-for-all.md#Evidence strength & limits"]}],"cards":[{"id":"c001","module":"m1","type":"recall","front":"In Kirschner & Hendrick's working definition, what *is* learning, and which memory structure is the bottleneck?","back":"Learning is a durable change in **long-term memory**. The bottleneck is **working memory**: small, short-lived, able to handle only a few new elements at once.","source":"01-how-learning-happens"},{"id":"c002","module":"m1","type":"recall","front":"Name the three types of cognitive load and what produces each.","back":"- **Intrinsic**: the element interactivity of the material itself\n- **Extraneous**: poor instructional design\n- **Germane**: schema building (redefined in 2019 as the working-memory resources devoted to intrinsic load, not a separate additive load)","source":"00-foundational-papers"},{"id":"c003","module":"m1","type":"explain","front":"Why does the same material overload a novice but feel easy to an expert? Use *element interactivity* and *schema*.","back":"Element interactivity is how many elements must be processed together. Experts have chunked those elements into schemas that working memory treats as a single element, so the effective load collapses. Novices must juggle every element separately.","source":"00-foundational-papers"},{"id":"c004","module":"m1","type":"explain","front":"Why can solving conventional problems by means-ends analysis produce right answers but little learning?","back":"Means-ends search holds the current state, goal, differences and subgoals in working memory. That uses the capacity needed to notice and store the problem's structure, so the answer is found but no schema is built.","source":"00-foundational-papers"},{"id":"c005","module":"m1","type":"recall","front":"What is the worked example effect, and for whom does it hold?","back":"Studying worked solutions produces more learning than solving the equivalent problems. It holds for **novices**; it fades or reverses as expertise grows.","source":"00-foundational-papers"},{"id":"c006","module":"m1","type":"recall","front":"Give the standard three-step guidance-fading progression.","back":"Worked example, then completion problem (partly solved), then independent problem.","source":"00-foundational-papers"},{"id":"c007","module":"m1","type":"apply","front":"Your strongest maths students call worked-example lessons \"boring and slow\" and their gains have flattened. Name the effect and the fix.","back":"**Expertise reversal**: for more expert learners, worked examples are redundant and add load. Fade to completion problems and independent problems for them, using quick diagnostics to decide who moves on.","source":"00-foundational-papers"},{"id":"c008","module":"m1","type":"apply","front":"A teacher reads the text of every slide aloud, word for word. Which design effect is being violated, and what is the fix?","back":"The **redundancy** effect: the same words arriving by ear and by eye add extraneous load. Fix: speak over a sparse visual (diagram, key image) or let students read silently, not both.","source":"01-how-learning-happens"},{"id":"c009","module":"m1","type":"apply","front":"A worksheet puts a diagram on one page and its labels in a key on the next page. Name the effect and the fix.","back":"**Split attention**: learners must hold and match two separated sources in working memory. Fix: integrate the labels directly into the diagram.","source":"01-how-learning-happens"},{"id":"c010","module":"m1","type":"recall","front":"Name Dunlosky et al.'s two high-utility study techniques.","back":"Practice testing (retrieval practice) and distributed (spaced) practice.","source":"01-how-learning-happens"},{"id":"c011","module":"m1","type":"explain","front":"Rereading and highlighting are students' favourite techniques. Why do they mislead students about what they know?","back":"They raise **familiarity**, which produces a feeling of knowing. Familiarity is a separate process from **recollection**: the material feels known on recognition but cannot be retrieved on demand.","source":"12-why-we-remember"},{"id":"c012","module":"m1","type":"discriminate","front":"Distinguish *learning* from *performance*, and name one technique that boosts performance now but is weak for learning.","back":"Performance is momentary success; learning is a durable change that shows up later and in new contexts. Rereading, massing and blocking feel productive now but are weak; retrieval, spacing and interleaving feel hard but are strong.","source":"01-how-learning-happens"},{"id":"c013","module":"m1","type":"explain","front":"Why does Ranganath treat forgetting as a feature, and what does that demand of a curriculum?","back":"Memory exists to guide future action, so the brain keeps what signals likely future use and drops the rest. A curriculum must signal usefulness through repeated, spaced, meaningful retrieval, not single exposures.","source":"12-why-we-remember"},{"id":"c014","module":"m1","type":"explain","front":"Retrieval changes the memory it retrieves. Why does that mean quizzes need immediate corrective feedback?","back":"A recalled memory is re-stored in updated form. If a wrong answer is recalled and left uncorrected, retrieval strengthens the error; feedback while it is active means the corrected version is stored.","source":"12-why-we-remember"},{"id":"c015","module":"m1","type":"recall","front":"What is *hypercorrection*, and how can a teacher exploit it?","back":"Confidently held errors are more easily corrected than low-confidence ones once feedback arrives. Have students commit to an answer and rate confidence **before** giving feedback.","source":"12-why-we-remember"},{"id":"c016","module":"m1","type":"apply","front":"You are setting a school-wide norm for class discussion. Should individual or group recall come first, and why?","back":"Individual first (write it down), then share. Group recall disrupts individuals' own retrieval (**collaborative inhibition**) and hearing others first can import their errors (**social contagion**). The teacher then checks what the group converged on.","source":"12-why-we-remember"},{"id":"c017","module":"m1","type":"discriminate","front":"\"Context-dependent memory means we should teach in the room where the exam will be held.\" What is wrong with this?","back":"Matching one context helps recall there but keeps knowledge context-bound. For durable, transferable knowledge, **vary** the contexts and formats of practice. Context effects in real settings are usually modest anyway.","source":"12-why-we-remember"},{"id":"c018","module":"m1","type":"discriminate","front":"\"Emotional lessons are memorable lessons.\" Correct this claim.","back":"Emotion prioritizes emotionally central content, often at the expense of peripheral details. A dramatic lesson can leave students remembering the drama, not the concept. Make the emotionally charged element the concept itself.","source":"12-why-we-remember"},{"id":"c019","module":"m1","type":"discriminate","front":"\"Cognitive load theory means make learning easy.\" What does CLT actually say?","back":"Reduce **extraneous** load so capacity goes to the intrinsic challenge. Desirable difficulties (retrieval, spacing) deliberately add productive effort, but only difficulties the learner can successfully respond to.","source":"01-how-learning-happens"},{"id":"c020","module":"m1","type":"discriminate","front":"\"Use dual coding for visual learners and podcasts for auditory learners.\" Which two ideas are being confused?","back":"**Dual coding** (everyone benefits from well-combined words and visuals) is confused with **learning styles** (matching mode to a learner's 'style'), for which the meshing hypothesis has no adequate evidence (Pashler et al. 2008). Choose mode by content, not learner.","source":"01-how-learning-happens"},{"id":"c021","module":"m1","type":"explain","front":"Evidence check: how strong is the evidence for the testing effect and spacing, and what is the main limit?","back":"**Robust**: decades of replication, with classroom extensions. Limit: much of it is lab-based (short retention intervals, adult participants, simple materials), so specific classroom prescriptions are extrapolations to test locally.","source":"12-why-we-remember"},{"id":"c022","module":"m1","type":"explain","front":"Evidence check: how strong are the split-attention, redundancy and modality effects in real classrooms?","back":"**Moderate**. They are well established in the lab, but effects shrink outside it. Treat them as design constraints for materials review, not guaranteed classroom gains.","source":"00-foundational-papers"},{"id":"c023","module":"m2","type":"recall","front":"State Posner et al.'s (1982) four conditions for conceptual change.","back":"1. **Dissatisfaction** with the current conception\n2. The new one is **intelligible**\n3. **plausible**\n4. **fruitful**","source":"00-foundational-papers"},{"id":"c024","module":"m2","type":"explain","front":"Why does a single surprising (discrepant-event) demonstration so often fail to change a student's conception?","back":"It may create dissatisfaction but supplies no intelligible, plausible, fruitful alternative. Students explain the anomaly away or file school knowledge in a separate compartment.","source":"00-foundational-papers"},{"id":"c025","module":"m2","type":"recall","front":"What is a *synthetic model*? Give Vosniadou's classic example.","back":"A hybrid of taught information and unrevised presuppositions that passes recall tests but fails prediction tests. Example: the **hollow sphere** Earth, round, with people livin
