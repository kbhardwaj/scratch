(`01-how-learning-happens`; `06-beyond-the-science-of-reading` on systematic phonics) [E]. Developing the teachers you have through coaching and TLCs is the scalable path to teacher quality. At scale it is worth about two months' extra progress, which is modest but cheap per student (`07-embedding-formative-assessment`; `10`) [E for the effect; H for Wiliam's comparative cost estimates]. Tension t06 in money form: developing teachers beats adding more of them.\n\nThe proposal:\n- $200,000 a year for three years for coach, TLC release time and tutoring, which uses the whole gift over its full term\n- a named early-reading fund honoring her late husband, which pays the tutors\n- a visible result for her foundation board: the share of K-2 students at the decoding benchmark, fall to spring, with the tutored group's growth shown separately and a target set in advance [H for the size]\n- a twice-yearly visit to see tutoring and a TLC session in action\n\nIf she insists on class size, offer a compromise with the same logic: tutors run the K-1 literacy block in groups of six, small groups where evidence is strongest, without permanent hires. Her intent, children known and taught well, is yours too [V].\n\n**What a novice would do wrong:** Take the class-size money because it is obviously good and easy to explain, then face the cliff and the hiring problem. Or refuse without an alternative and lose a donor who was willing to be persuaded.","sources":["10-creating-the-schools-our-children-need","07-embedding-formative-assessment","01-how-learning-happens","06-beyond-the-science-of-reading"]},{"id":"k21","title":"The evolution objection","scenario":"Grade-7 life science includes a four-week unit on natural selection. Eleven families from a local congregation write asking that their children be excused, or that \"intelligent design be presented as an alternative theory.\" A second group of six parents objects from the other side. The unit's opening activity has students write and share \"what you believe about where species come from.\" They say this \"gives airtime to creationism\" and embarrassed some children in front of peers. The teacher, Mr. Adeyemi, is anxious. Last year a student cried during the sharing, and he has been getting emails. State standards require evolution, and your jurisdiction allows some opt-outs for specific content but not for core science standards. Your community codesign compact says families help decide \"which knowledge is prioritized where the evidence is silent.\" A board member who belongs to the congregation asks you to \"find a compromise that respects everyone.\" The unit starts in three weeks.","tension":"t11","question":"What do you change, what do you hold, and what do you say to each group? Which two authors are arguing in your head?","considerations":["Is the place of evolution in the curriculum within the codesign compact's open layer?","What is the difference between understanding and acceptance, and what should be assessed?","Which intuitive conceptions of evolution should the unit surface, and is religious belief one of them?","Is the second group's objection to the opening activity correct?","How do you show respect without conceding the science?"],"model_answer":"**Tension:** t11 (Confront the intuitive theory vs build on it); also t04 (Standardization and fidelity vs community co-design), t10 (Conceptual change vs coverage).\n\nHold the science and change the pedagogy. The second group has a point about the opening activity, and fixing it will also make the unit better for the first group's children.\n\nOn the compact (t04): whether evolution is taught is not in the open layer. The evidence is not silent, and the state requires it [V for the governance reading; legal]. Intelligent design will not be presented as a scientific alternative, because it isn't one, and presenting it as one would teach a false model of how science works [V/E]. \n\nWhat you can offer is real respect. Separate understanding from belief. Students are assessed on their ability to reason with natural selection (predict what happens to a population, explain a trait's spread), never on professing acceptance (`02-scienceblind`) [V for respecting conscience; E that understanding and acceptance are weakly related]. Mechanistic understanding may raise acceptance as a by-product [E, modest].\n\nThe opening activity elicits the wrong thing. The misconceptions that matter are specific: evolution as individuals changing because they need to, essentialism about species, and the idea of evolution as purposeful progress (`02`) [E]. Asking children to publicly share religious beliefs doesn't elicit those. It creates status threat, which is how you get a crying student (`05-10-to-25`) [E for adolescents' sensitivity to social evaluation]. Replace it with a prediction task: \"A beetle population lives on dark bark; the bark lightens over 50 years. Predict and explain what happens.\" That surfaces transformational and need-based thinking directly. Then teach variation, inheritance and selection as a mechanism, and confront the intuitions after the model is intelligible (t11) [E for predictable misconceptions; H for this sequence]. Plan revisits in grades 8 and 10 (t10), since these intuitions persist (`13-learning-scientific-concepts`) [E].\n\nThat the new opening reduces status threat is [H]; check it with an exit question. Meet the first group in person. Explain what will be assessed, share the materials, and follow the law on opt-outs. Tell Mr. Adeyemi you back him publicly, and give him the redesigned opening. Log evolution's placement in the value register, with who disagrees and why (`08-extraordinary-learning-for-all`, community trust) [V].\n\n**What a novice would do wrong:** \"Teach the controversy\" to keep the peace. Or excuse the objecting families from the unit. Or dismiss them with contempt. Or defend the belief-sharing activity as eliciting prior ideas when it elicits the wrong ones.","sources":["02-scienceblind","13-learning-scientific-concepts","08-extraordinary-learning-for-all","05-10-to-25"]},{"id":"k22","title":"Grade everything so they take it seriously","scenario":"Your grades 9-10 team of six teachers is in the first year of your new high school. In October they petition you to grade all homework and quizzes, 10% of the course grade each, because \"kids only do what counts.\" The data are mixed. Weekly low-stakes cumulative quizzes, taken in class, have 94% participation. Homework completion is 55%. Teachers report spending about four hours a week writing comments on homework that half the students never submit. One teacher, Jo, has been quietly grading her quizzes since September. In her classes, 12% of students revise quiz errors, against about 60% in the other teachers' classes. The team is frustrated and tired. Two teachers say they feel \"like the only school in the county without real grades.\" Your policy since August: formative work gets comments only; unit tests and end-of-term assessments are graded and make up the course grade. Families see homework completion only at conferences.","tension":"t12","question":"What do you agree to, what do you decline, and what problem are you actually solving? Which two authors are arguing in your head?","considerations":["Which problem is real: quiz seriousness, homework completion, or teacher workload?","What does Jo's pattern suggest, and how much can it bear?","What happens to feedback when grades are attached?","Why is homework not being done? Is it too hard, invisible to families, or pointless?","How could teacher comment-writing time be cut without losing feedback?"],"model_answer":"**Tension:** t12 (Testing as measurement vs testing as learning).\n\nThe petition is the t12 switch signal almost word for word: effort bought with status threat. Split the problem. Quizzes are working and stay ungraded. Homework completion and teacher workload are real problems, so solve them directly rather than through grades.\n\nThe quizzes already get 94% participation without grades. Retrieval with feedback strengthens memory, and low-stakes framing keeps students attending to errors (`12-why-we-remember`; `01-how-learning-happens`) [E]. Jo's classes show the pattern Butler predicts: once a grade is attached, students attend to the grade and stop working with the feedback (`07-embedding-formative-assessment`) [E for the principle; her data is local, one teacher, H]. Talk to Jo as a colleague, not as a disciplinary matter.\n\nHomework is different. Find out why it isn't done before choosing a lever. Ask students anonymously, and check whether homework is new material or retrieval of taught content. Then:\n- Redesign homework as short retrieval of taught material, aimed at about 80% success, so it can be done alone [E for the principle; H for the target].\n- Record completion (done or not done, no grade) and send it to families weekly, so it is visible without being scored.\n- A missing assignment triggers a support plan (a lunch catch-up slot), not a zero (`05-10-to-25`, high standards with support) [H].\n\nCut the workload: four hours a week of comments on half-submitted work is unsustainable and ineffective. Move to whole-class feedback on common errors, plus a required student action in class, such as fixing and re-submitting one problem (`07`; `01`) [E for the principle that feedback must cause student work; H for the workload effect].\n\nThe t12 rule allows a small number of summative points, and your unit tests are those points. If the team needs something to show, report homework completion on the report card as a separate work-habit line, not averaged into the achievement grade [H].\n\nRun it as a PDSA with a prediction: homework completion rises from 55% to 75% in six weeks, while teacher comment time falls below 90 minutes a week (`11-improvement-in-action`). Their time is the balancing measure [V].\n\n**What a novice would do wrong:** Agree to grade everything, killing the feedback mechanism for a problem it wasn't causing. Or refuse and lecture about Butler while ignoring completion and teacher workload, which are both real.","sources":["07-embedding-formative-assessment","01-how-learning-happens","12-why-we-remember","05-10-to-25","11-improvement-in-action"]},{"id":"k23","title":"Where students say they learn","scenario":"Year three, grades 9-11. Your core program is working on its own terms: state math proficiency has risen from 58% to 72%, and AP pass rates are climbing. But the student survey tells another story. Asked \"Where in school do you learn the most?\", 64% name robotics, debate, theatre or the student newspaper; 11% name a core class. Only 22% agree with \"In my classes I get to make something that matters.\" A teacher council proposes cutting the afternoon enrichment block from five to three hours a week to add a math intervention period for everyone. A second group of teachers proposes the opposite: turn all of grade 10 into interdisciplinary projects \"like robotics, but for everything.\" The robotics coach, Dr. Kim, is a retired engineer. She runs design reviews, has seniors coaching freshmen, and holds a public competition twice a year. Your board is delighted with the test scores and doesn't see a problem. You have to decide the grade-10 program for next year by March.","tension":"t07","question":"What do you do with each proposal, and what change do you make to the core? Which two authors are arguing in your head?","considerations":["What does the t07 switch signal say, and has it fired?","What does the periphery have that the core lacks, in Mehta & Fine's terms?","How much of the periphery's appeal comes from self-selection?","Is math intervention for everyone the right response to intervention needed by some?","How do you test a grade-10 project model without betting the grade on it?"],"model_answer":"**Tension:** t07 (Core vs periphery).\n\nThe t07 switch signal has fired: the periphery has become the only place students say they learn, while core scores rise. The core is producing mastery without identity or creativity. Import periphery features into the core. Cut neither the core nor the periphery.\n\nDiagnose what the periphery has. Robotics under Dr. Kim is not unguided. It has practitioner standards, design reviews, older students coaching younger ones, iteration, and a real audience. Mehta & Fine found this pattern across school types (`09-in-search-of-deeper-learning`) [H: robust as description, confounded by self-selection]. Students choose these activities, so part of the survey gap is who shows up. Yeager adds a mechanism: real responsibility and real audiences confer status, which adolescents respond to strongly (`05-10-to-25`) [E for the broad pattern].\n\nProposal one, cutting enrichment for universal math intervention, treats the whole cohort for a problem that affects some students. Target intervention at the students below benchmark through tutoring inside existing time [E for tutoring], and protect the periphery. Starving it is the other t07 failure signal.\n\nProposal two, all-project grade 10, bets a whole grade on a model the school hasn't tested. Projects without planned knowledge building leave novices behind (`00-foundational-papers`; `01-how-learning-happens`) [E]. Test-drive it instead (`08-extraordinary-learning-for-all`) [H]: one grade-10 course next year runs as a project course with a written guidance plan, knowledge checkpoints and a public exhibition, compared against the standard sections.\n\nThe core change, for every course next year: one authentic product per course per term, made for a real audience and critiqued against practitioner standards. Examples: a statistics report for the city council, a history podcast reviewed by the local museum. Ask Dr. Kim to run a short design-review workshop for core teachers [H].\n\nMeasure both sides. Keep the proficiency and AP measures, and add the \"make something that matters\" item and the \"where do you learn\" item as leading indicators. Predict: the core-class share rises from 11% to 25% within a year, with no drop in proficiency. For the board, name the value plainly: the school's definition of deep learning includes identity and creativity, not scores alone [V].\n\n**What a novice would do wrong:** Read the scores as success and dismiss the survey. Or read the survey as a mandate to rebuild grade 10 as projects. Either way, the novice misses that the answer is to move the periphery's specific features into the core.","sources":["09-in-search-of-deeper-learning","05-10-to-25","08-extraordinary-learning-for-all","00-foundational-papers","01-how-learning-happens"]},{"id":"k24","title":"The curiosity audit","scenario":"Your instructional coach, Mira, sampled 40 K-5 lessons across the fall, counting questions asked by students (not answers to teacher questions) per hour. Kindergarten averaged 9.2; grade 1, 7.5; grade 2, 4.1; grade 3, 2.0; grade 4, 1.1; grade 5, 0.6. In most lessons where a student asked something off-script, the teacher said some version of \"good question, we'll get to that\" and moved on; Mira found no instance of the class coming back to it. The grade 4-5 teachers say the knowledge curriculum is too packed: \"we literally cannot stop for questions.\" Two of them propose cutting 45 minutes a day from the knowledge units for a student-chosen \"Inquiry Hour.\" Your literacy lead, Dana, warns that this would gut the knowledge spine you built last year and hurt the students with least background knowledge most. Mira's own reading is that the numbers are about teacher moves, not curriculum. Nobody has checked whether the pacing guide leaves any slack.","tension":"t02","question":"How do you interpret the audit, and what do you change? Which two authors are arguing in your head?","considerations":["What do the question-asking studies show, and how strong are they?","What alternative explanations for the decline exist?","Is knowledge the enemy of curiosity, or its fuel?","What teacher moves and structures protect student questions?","How would you know in a term whether the change worked, and what balancing measure would you watch?"],"model_answer":"**Tension:** t02 (Knowledge-rich curriculum vs curiosity and inquiry).\n\nTreat the audit as a signal about classroom norms, not a verdict on the curriculum. Tension t02's switch signal covers exactly this: falling question rates mean fix norms and pacing, not the curriculum. Keep the spine.\n\nWeigh the evidence honestly. Question-asking declines from home to school and across the early grades in typical classrooms, a direction several studies share, though the samples are small (`03-intellectual-lives-of-children`, Tizard & Hughes; Engel's observations) [E for the direction; the exact rates are not population facts]. Some of the decline may be developmental: older children ask more questions in their heads or find answers elsewhere [H, a live alternative]. The strongest actionable finding is that children's curiosity rises and falls with how adults respond (`03`) [E, small experiments]. Mira's observation, that questions were deferred and never returned to, points straight at that mechanism. Curiosity also needs knowledge: you can only notice a gap in something you partly know (`00-foundational-papers`, Gruber et al.) [E]. Cutting knowledge units would starve the fuel, and hit hardest the children with the least background knowledge at home, which is Dana's point (`06-beyond-the-science-of-reading`) [E for the knowledge gap; V for the equity commitment].\n\nWhat to change:\n- A question parking lot in every room, with one fixed 20-minute slot a week where the class takes up the best questions [H].\n- Teacher moves taught and coached in TLCs: follow-up prompts (\"how could we find out?\"), wait time, and modeling uncertainty (`07-embedding-formative-assessment`) [H].\n- Frame each knowledge unit around a big question that students keep returning to [H].\n- Check the pacing guide and build in about 10% slack for detours. If it is truly packed, cut marginal content, not whole units.\n- Optionally, a weekly 60-minute idea workshop taken from time that shouldn't exist anyway, such as leftover skills practice. It is a value choice [V] with untested effects [H].\n\nRerun the audit next term as a leading indicator, and predict that grade 4-5 rates at least double. The balancing measure is scores on curriculum-embedded knowledge checks, which must hold steady (`11-improvement-in-action`).\n\n**What a novice would do wrong:** Take the teachers' diagnosis at face value and trade knowledge time for Inquiry Hour. Or dismiss the audit as soft data. Or not notice that the lesson data already showed the mechanism: questions deferred and never answered.","sources":["03-intellectual-lives-of-children","00-foundational-papers","06-beyond-the-science-of-reading","07-embedding-formative-assessment","11-improvement-in-action"]}],"tensions":[{"id":"t01","name":"Explicit instruction vs productive failure","pole_a":"Instruct first. Novices searching a problem space spend working memory on search, not schema building; worked examples are among the most replicated effects; explicit-first beat problem-first on high element-interactivity material (Ashman, Kalyuga & Sweller 2020).","pole_b":"Generate first, then instruct. A short designed problem-solving phase activates prior knowledge, exposes what students' ideas cannot do, primes them for the answer, and sets up a consolidation that shows which features matter (Kapur; Sinha & Kapur 2021, g about 0.36 on concepts and transfer).","rule":"IF the goal is a load-bearing concept AND students have relevant prior knowledge to activate AND the problem admits multiple methods AND a scripted consolidation lesson is guaranteed AND early failure is safe, THEN run a named generate-then-consolidate cycle to introduce that concept (about one per major idea). IF the goal is procedural fluency, a foundational skill, or learners cannot produce any attempt, THEN explicit instruction with worked examples first. IF learners are elementary-age, THEN lighter forms and smaller expected benefit.","switch_signal":"Consolidation phases rushed or skipped on observation; delayed conceptual and transfer items show no advantage over explicit-first; procedural fluency falls; students generate one solution or none. Revert that unit to explicit-first. Opposite signal: students pass immediate procedural quizzes and fail delayed transfer (unproductive success), which argues for adding a PF cycle.","evidence":"Both camps reject unguided discovery and PF includes full explicit instruction. PF wins on conceptual knowledge and transfer (g about 0.36, higher with high fidelity), shows no difference on procedures (g about -0.03), helps grade 6 and up more than elementary, and depends on fidelity. Its advantage over other preparatory activities (contrasting cases, worked examples first) was not significant. Many studies are from proponents; treat as an upper estimate. [E] both mechanisms; [H] proportion of lessons and transfer beyond STEM.","sources":["04-productive-failure","00-foundational-papers","01-how-learning-happens","12-why-we-remember"]},{"id":"t02","name":"Knowledge-rich curriculum vs curiosity and inquiry","pole_a":"Knowledge first. Comprehension is knowledge (Recht & Leslie); content-free skills saturate quickly; content-light schooling widens gaps; a coherent sequenced spine compounds; inquiry for novices is inefficient and favours those who already know.","pole_b":"Curiosity first. Children arrive as question-askers and school teaches them to stop (Tizard & Hughes: about 26 questions per hour at home vs 2 at school, small sample); adults who follow up and model curiosity keep children asking; demonstration narrows exploration (Bonawitz 2011); intellectual life is an end in itself.","rule":"IF the decision is what fills K-8 core instructional time, THEN a sequenced knowledge spine with content from kindergarten. IF the decision is classroom norms, THEN protect curiosity through behaviour (questions followed up, a parking lot with scheduled return, teachers modelling not knowing, problem-not-recipe where exploration is the goal) rather than content-free time. IF the school wants a protected block for children's own ideas, THEN adopt it as [V] with an [H] evaluation, sized never to substitute for foundational instruction, with pre-taught vocabulary and background.","switch_signal":"Student-originated question rates per hour fall across grades in your own sampled observations: fix norms and pacing, not the curriculum. Inquiry time shows shallow, repetitive questions and the same children dominating: the spine is too thin or pre-teaching is missing. Standardized reading lagging two to three years after adoption is expected; five years is an implementation audit.","evidence":"Mostly a false tension once Gruber et al. are read properly: curiosity is an information gap and you need knowledge to notice a gap. Knowledge driving comprehension is robust; whole-curriculum effects on general reading tests are positive but often small and can plateau. Engel's counts are small-sample and illustrative; the causal claim that schooling drives the decline is argued, not shown; the Idea Workshop has no outcome evaluation. [E] knowledge; [E] question rates fall in typical classrooms; [H] workshop; [V] intellectual life as aim.","sources":["06-beyond-the-science-of-reading","03-intellectual-lives-of-children","00-foundational-papers","10-creating-the-schools-our-children-need","01-how-learning-happens"]},{"id":"t03","name":"Teacher-led instruction vs student agency","pole_a":"The teacher directs. Small steps, many questions, models, guided practice, high success rates (Rosenshine); cognitive activity matters, not organizational control (ICAP); self-direction and anytime-anywhere models sit in tension with novice-guidance evidence and have mixed evaluations.","pole_b":"The student owns it. Activating students as owners of learning (Wiliam & Leahy); sincere questions confer respect and shift ownership while the standard stays fixed (Yeager); choice, purpose and real responsibility are why the periphery works (Mehta & Fine); experience of agency is a leading indicator (Transcend, correlational).","rule":"IF the learner is a novice in the content, THEN the teacher sets sequence, examples and success criteria, and agency is expressed through generation, self-assessment, choice among structured options and revision. IF diagnostics show expertise, THEN fade guidance toward self-directed projects with checkpoints. In all cases, THEN treat students as capable agents in how they are addressed, in real high-status responsibilities, and in transparency about why.","switch_signal":"Self-directed work produces busy, satisfied students with flat delayed and transfer measures: pull direction back. Teacher-led rooms produce compliance with falling experience-survey scores and question rates: add ownership without removing structure.","evidence":"Agency over what to think and agency over how the lesson runs are different. Strongest evidence: high teacher direction of content for novices, combined with high student generation inside that structure. Status and ownership mechanisms are supported; self-directed models at scale are not. Experience-survey correlations cannot separate cause from selection. [E] direction for novices; [E] status mechanisms; [H] self-directed models.","sources":["01-how-learning-happens","07-embedding-formative-assessment","05-10-to-25","09-in-search-of-deeper-learning","08-extraordinary-learning-for-all","00-foundational-papers"]},{"id":"t04","name":"Standardization and fidelity vs community co-design","pole_a":"Standardize the mechanisms. Tight but loose, non-negotiable active ingredients, shared materials, one spine across grades; practices die by lethal mutation; PF's effect depends on fidelity; adopting a curriculum is not teaching it.","pole_b":"Design with the community. Imposed models get reverted; a diverse design team including students and the least-served families surfaces needs experts miss and sustains the school (Transcend); everything works somewhere, nothing works everywhere (Wiliam, Bryk); identity and purpose cannot be imported (Mehta & Fine).","rule":"IF the layer is purpose, culture, graduate aims, target student experience, the periphery, and which knowledge to prioritise where evidence is silent, THEN co-design it with students and the least-served families and revisit it. IF the layer is a mechanism with robust evidence (phonics, retrieval and spacing, guidance for novices, formative use of evidence, comment-only feedback), THEN hold it tight, adapt only technique, and write this distinction into the compact before the first design session. IF a community proposal would change a mechanism, THEN run an evidence review, not a vote.","switch_signal":"Co-design proposes mechanism changes ('drop phonics'): the compact was unclear; repair governance. Fidelity audits show techniques keeping names and losing mechanisms: retrain on mechanism, loosen nothing. Staff and families describe the school as done to them: the open layer has closed; reopen it.","evidence":"Implementation research supports both halves: reforms without ownership fade, and practices that lose their mechanism stop working. Community-based design as a process has no causal evaluation and comes from the organization that sells it; communities can converge on ineffective ideas and the book is thin on adjudication. [E] imposed models revert and mutation kills mechanisms; [V] co-design; [H] its design-quality benefits.","sources":["10-creating-the-schools-our-children-need","06-beyond-the-science-of-reading","01-how-learning-happens","04-productive-failure","08-extraordinary-learning-for-all","11-improvement-in-action"]},{"id":"t05","name":"Accountability measurement vs improvement measurement","pole_a":"Accountability. Boards and authorizers need comparable, audited annual measures; what is assessed gets taught (IB's depth-demanding assessments moved teaching toward depth); accountability data exposed the weak effects of popular reforms.","pole_b":"Improvement. Practical measures are short, frequent, low-stakes, tied to specific changes and returned within days (Bryk); using accountability measures for improvement gives lagging annual data; using improvement measures for accountability corrupts them (Campbell's law); formative data and TLC observation must stay out of evaluation or safety collapses.","rule":"IF a measure decides a job, salary or rating, THEN it is an accountability measure: multiple measures over multiple years, never a practical measure, never TLC observation. IF a measure is used to learn whether a change worked, THEN it is practical: embedded in the work, returned within days, owned by the team, never reported upward by individual. Report accountability measures honestly; do not manage to them. Track balancing measures (workload, well-being) with every change.","switch_signal":"Practical measures improve for two years while accountability measures do not: the driver diagram is wrong or measures are gamed. Accountability improves while practical measures do not: teaching to the test or insensitive measures. A principal cites PDSA data in an evaluation: the wall is breached; repair it publicly.","evidence":"High-stakes use corrupting indicators is well documented; single-year value-added and single observations are unreliable for consequential decisions (MET). Improvement science's school record rests on case narratives selected for success; healthcare PDSA is often done without rigor. The wall is [E] in reason and [V] in commitment; the improvement system's effect on outcomes is [H].","sources":["11-improvement-in-action","07-embedding-formative-assessment","10-creating-the-schools-our-children-need","09-in-search-of-deeper-learning","01-how-learning-happens"]},{"id":"t06","name":"Selecting teachers vs developing them","pole_a":"Hire and fire. Teacher effects are the largest in-school variable; Hanushek's arithmetic says replacing the bottom 5-10% with average teachers would close national gaps; the rare deep teachers had learned deeply themselves, so hire for disciplinary depth.","pole_b":"Love the one you're with. Credentials and interviews predict effectiveness weakly (Kane, Rockoff & Staiger); identifying weak teachers is slow and costly; merit-pay trials are null; the supply of proven teachers is small; develop the teachers you have through teacher learning communities (EEF trial: about two months' extra progress).","rule":"IF choosing between spending on selection (salary premiums, recruiting) and on development (protected TLC time, coaching, materials), THEN development first, with salary set to retain. IF hiring, THEN use work samples and probes for disciplinary depth, coachability, curiosity and the mentor stance, and make TLC participation a condition of employment. IF a teacher refuses development, THEN treat it as a compact question, not a talent question.","switch_signal":"After two full years of TLCs, within-school variation in practice and practical measures has not narrowed: the TLC design is broken (no accountability for trying techniques, turnover, or meetings that became sharing sessions). Turnover above local norms despite development: working conditions are the problem, not salary first.","evidence":"Both facts hold: teacher effects are large and hiring signals are weak. Development is the only lever a single school can pull at scale, but the TLC model has one large independent trial with a modest effect and its necessary ingredients are untested; broader PD syntheses support sustained, practice-based, collaborative designs. [E] weak hiring signals, null merit pay, modest TLC effect; [H] hiring criteria.","sources":["10-creating-the-schools-our-children-need","07-embedding-formative-assessment","09-in-search-of-deeper-learning"]},{"id":"t07","name":"Core vs periphery","pole_a":"Put the energy where deep learning lives. Across about 30 schools the richest learning was in debate, theatre, robotics, publications, teams and some electives, because of choice, purpose, real performance, apprenticeship and mixed-age community (Mehta & Fine); the periphery gives adolescents status (Yeager) and keeps intellectual life alive (Engel).","pole_b":"The core is the school. Teacher time is finite and all students spend most of it in the core (Wiliam); knowledge is built in required courses (Wexler); the periphery finding is a diagnosis whose cure is to make the core more like the periphery, not to add periphery.","rule":"IF allocating design effort, THEN the core first: every core course, every term, one authentic product for a real audience, with drafts expected and the teacher's disciplinary practice visible, on top of explicit instruction and a knowledge spine. IF allocating budget under pressure, THEN protect the periphery as infrastructure with mixed-age leadership ladders. Never build a two-tier school.","switch_signal":"Students say the only place they learn is a club: the core has failed; redesign core units. Core measures rise while agency, belonging and joy fall and periphery participation drops: the periphery is starved or the core is control-heavy. Authentic products lack rigor on moderation: the feature displaced the spine; restore sequence and critique protocols.","evidence":"The periphery pattern is striking and recurs, but it is ethnographic and selection-confounded: students choose it, groups are small, test pressure is absent, and coaches are highly directive, so it is not evidence for minimal guidance. Importing apprenticeship features into required courses has no outcome data. [E] depth is rare in core classes; [H] importing features; [V] protecting the periphery.","sources":["09-in-search-of-deeper-learning","10-creating-the-schools-our-children-need","05-10-to-25","03-intellectual-lives-of-children","06-beyond-the-science-of-reading"]},{"id":"t08","name":"High standards vs support (enforcer, protector, mentor)","pole_a":"Enforce. No-excuses operating systems deliver coherent instruction and measurable gains for disadvantaged students; high success rates need tight structure; rigor is an equity lever.","pole_b":"Protect. Adolescents under stress need sympathy; well-being is a graduate aim; struggle can read as 'I am not a maths person'; No Excuses High was joyless.","rule":"IF designing any adult-student routine (feedback, discipline, advising, grading, the conversation with the student who stopped working), THEN audit it against the 2x2: does it hold the bar, supply the scaffold, and say why. IF a student fails or refuses, THEN a support plan toward the same standard, not a lowered bar and not a zero. IF a routine lowers status in public, THEN remove it regardless of short-term compliance.","switch_signal":"Compliance rises while effort quality and question rates fall: drifting to enforcer. Satisfaction rises while effort quality and practical measures fall: drifting to protector. Wise-feedback lines appear as boilerplate and revision rates do not move: script has replaced sincerity; coach the stance.","evidence":"Yeager argues both poles are the same error: both communicate disrespect. The mentor mindset is supported by the wise-feedback field experiment (71% vs 17% revision among Black seventh graders; large effect, small sample, limited direct replication), empathic-discipline work, stress-reappraisal experiments and correlational parenting research; the 2x2 as a trained construct at scale is untested. Growth-mindset effects are small and heterogeneous. [E] components; [H] training at scale; [V] dignity.","sources":["05-10-to-25","09-in-search-of-deeper-learning","01-how-learning-happens","04-productive-failure"]},{"id":"t09","name":"Curiosity hooks vs target learning","pole_a":"Hook them first. A curious state improves memory even for incidental faces shown while waiting for an answer (Gruber, Gelman & Ranganath 2014); open with something surprising and the learning rides along.","pole_b":"The hook is the objective. The incidental benefit is small, brief (Murphy 2021), inconsistent (Galli 2018) and reversed for complex school-like facts (Keller, Salvi, Leiker, Gruber & Dunsmoor 2024): the open question pulls processing toward itself; an unrelated hook is extraneous load (Sweller).","rule":"IF opening a lesson or unit, THEN pose a question whose answer is the objective (a prediction, pretest or anomaly the concept explains), right before teaching it, and close it with the target content. IF a proposed hook is exciting and unrelated, THEN cut it, especially before high element-interactivity content. IF the aim is curiosity as a disposition, THEN that belongs to norms and the protected block, not the first two minutes of a maths lesson.","switch_signal":"Hinge data show students remembering the hook and not the content; students retell the story but cannot state the principle; hooks eating more than a few minutes. Conversely, openings that are pure announcement with low engagement on the first retrieval: add a target-bearing question.","evidence":"Curiosity for the target replicates reasonably well; the halo does not, and most work is adults and trivia. Put the objective inside the question and resolve it with the target content. Posner's dissatisfaction condition and Kapur's awareness phase are the same move with the same warning. [E] target curiosity; [E] unrelated hooks can hurt, from one 2024 study; [H] classroom transfer.","sources":["00-foundational-papers","12-why-we-remember","03-intellectual-lives-of-children"]},{"id":"t10","name":"Conceptual change vs coverage","pole_a":"Cover the standards. Pacing guides and accountability tests; breadth of knowledge matters; every hour revisiting a concept is an hour not spent elsewhere (Wiliam's cost lens).","pole_b":"Fewer things, restructured, revisited. Misconceptions are theories; telling produces synthetic models that pass recall tests; old theories coexist with new ones for life; mastery means the scientific model reliably wins, which takes mechanism, multiple representations and returns across years; some concepts need prerequisites (particulate matter before photosynthesis).","rule":"IF a concept is load-bearing and has a documented intuitive rival (force, energy, matter, heat, evolution, proportion), THEN plan it as a multi-year progression with a diagnostic, a mechanism, a named change type, standard representations across grades, and assessment by prediction and transfer items; fund the time by cutting topics nothing later depends on. IF a topic is factual and nothing depends on it, THEN cover it efficiently or cut it. Coverage is never a reason to teach a hard concept once.","switch_signal":"End-of-unit recall high while delayed prediction items show the intuitive model: a spiral is missing or revisits without confronting. Concept-inventory pre/post gains near zero with good pacing compliance: the course is covering. Students holding both models in different contexts: normal waypoint; do not grade it as failure formatively, but plan the return.","evidence":"Which misconceptions, how persistent, coexistence in experts, and lecture leaving them intact are among the most replicated findings in science education. Intervention evidence is thinner: refutation texts, bridging analogies, mechanism teaching and interactive engagement have moderate support; no school-scale multi-year trial; cognitive conflict alone often fails. [E] the problem; [E/H] fixes; [H] any specific spiral schedule.","sources":["02-scienceblind","13-learning-scientific-concepts","00-foundational-papers","09-in-search-of-deeper-learning","10-creating-the-schools-our-children-need"]},{"id":"t11","name":"Confront the intuitive theory vs build on it","pole_a":"Theory-change. Intuitive knowledge is coherent enough to behave like a theory (Shtulman, Vosniadou, Chi, Posner): surface it, create dissatisfaction, supply a better mechanism, reclassify where the error is ontological.","pole_b":"Knowledge-in-pieces. Intuitive knowledge is fragmented p-prims activated by context (diSessa, Hammer, Minstrell via Amin); many misconceptions are productive pieces in the wrong place; treat intuitions as resources; coherence is partly an interview artifact. Kapur's activation phase and Engel's respect for children's theories sit here.","rule":"IF beginning a hard concept, THEN elicit and honour the intuition first, identify productive pieces, and build placeholder structures explicitly. IF the error is ontological (heat as substance, evolution as individual transformation), THEN dedicated instruction on the category is required. IF confronting with an anomaly, THEN do it after the alternative is intelligible, with a mechanism ready and immediate correction, and never leave the wrong model as the last thing seen.","switch_signal":"After a confrontation-heavy unit, hinge distractor rates for the misconception rise: the confrontation is remembered as the content; move the anomaly later and the mechanism earlier. After a resource-heavy unit, students hold refined intuitions but cannot use the scientific model: the restructuring phase was skipped; add explicit concept and category work.","evidence":"The coherence debate is unresolved and method-dependent; Amin's synthesis says both are true at different levels, which is coherent and hard to falsify. Both camps agree telling alone fails, prior ideas must be elicited, and hybrid states are normal. Different concepts (force, energy, matter, species) need different kinds of change. [E] elicitation and mechanism matter; contested structure; [H] any specific sequence.","sources":["13-learning-scientific-concepts","02-scienceblind","00-foundational-papers","04-productive-failure","03-intellectual-lives-of-children"]},{"id":"t12","name":"Testing as measurement vs testing as learning","pole_a":"Assess to measure and report. Families, boards and transcripts need grades; comparable measures are needed to judge reforms; assessment alignment moves teaching toward whatever the assessment demands.","pole_b":"Assess to learn. The testing effect is among the most robust findings in memory research; retrieval rewrites memory; fluency misleads (Roediger & Karpicke, Bjork, Ranganath); formative is a use of evidence; grades swamp comments (Butler); a third of feedback interventions lower performance (Kluger & DeNisi); generation phases must be ungraded (Kapur).","rule":"IF an assessment is formative (most of them), THEN it is frequent, low-stakes, spaced, answered by every student, returned with comments that require action, and never graded. IF summative, THEN few, cumulative, demanding transfer and depth, revision allowed where feasible, and the only source of grades. IF families or students treat every check as a judgment, THEN the communication has failed: rename, explain, show the retrieval rationale.","switch_signal":"Teachers asking for grades on everything so students take it seriously: effort is being bought with status threat; fix feedback so it requires work. Students opting out of or copying retrieval quizzes: the quizzes have become high-stakes in fact. Summative grades stable while delayed transfer is poor: summative points are recall-only; redesign them.","evidence":"The testing effect and grade-swamps-comment are solid, though Butler's samples were small. Revision-rewarding grading has mentor-mindset backing and mixed outcome evidence. Alignment effects are ethnographic but consistent with a long literature. [E] retrieval and comment-only mechanisms; [H] grading policy designs; [V] what to report.","sources":["01-how-learning-happens","12-why-we-remember","07-embedding-formative-assessment","04-productive-failure","10-creating-the-schools-our-children-need"]},{"id":"t13","name":"Structural reform vs instructional reform","pole_a":"Change the structure. The grammar of schooling (periods, silos, seat time, isolated teachers, grades as currency) works against depth whatever the mission says (Mehta & Fine); derive schedule, staffing and space from the target experience (Transcend); institutionalize the workshop or lose it (Engel).","pole_b":"Change the contents, not the container. Class size, choice, governance and autonomy have small or expensive effects and a new school guarantees nothing (Wiliam); method not medium (Kirschner & Hendrick); map the process before redesigning the org chart (Bryk); change capacity is finite.","rule":"IF a structural change is proposed, THEN it must name the instructional or developmental need it serves, the mechanism it enables, and what it displaces; otherwise keep structure conventional and spend change capacity on instruction, assessment and adult learning. IF an instructional default is blocked by structure (no common planning time, no observation slots, no block long enough to iterate a product), THEN change the structure minimally to unblock it.","switch_signal":"TLCs cancelled for lack of time, teachers unable to observe each other, authentic products always rushed, departments in a schedule war: structural blocks get structural fixes, by subject if necessary. A structural redesign occupying leadership for a year while classroom practical measures are flat: the container has eaten the contents.","evidence":"The structural critique is a well-supported diagnosis and an untested prescription; evidence that structure-only reform fails is strong. Some structures are instructional prerequisites: TLC time, near-daily contact for spacing in skill subjects, blocks long enough to iterate, weekly team time for PDSA. [E] structure alone does nothing; [H] each specific change; [V] the periphery.","sources":["09-in-search-of-deeper-learning","08-extraordinary-learning-for-all","10-creating-the-schools-our-children-need","11-improvement-in-action","01-how-learning-happens","03-intellectual-lives-of-children"]},{"id":"t14","name":"Name the answer in advance vs discover it locally","pole_a":"The answers are known; implement them. Decades of cognitive science and a cost lens already say what to do (knowledge-rich curriculum, formative assessment, TLCs); local trial-and-error wastes the scarcest resource; import mechanisms, do not reinvent them (Wiliam, Wexler, Kirschner & Hendrick).","pole_b":"The answers are local; learn them. Reform keeps adopting solutions and rolling them out with variable, mediocre results; outcomes are produced by systems that must be seen; what works, for whom, under what conditions is empirical; small predicted tests build practical knowledge no meta-analysis contains (Bryk; Transcend's map, zoom in, test-drive).","rule":"IF the question is which mechanism, THEN answer from the evidence and adopt. IF the question is how the mechanism works here, for whom it is failing, and what adaptation keeps its active ingredient, THEN answer with a driver diagram, small predicted tests and practical measures. Every change idea attaches to a driver that attaches to a known mechanism; no cycle is run to discover pedagogy from scratch.","switch_signal":"PDSA cycles proposing to test whether retrieval practice or phonics works for our kids: rediscovery drift; redirect to implementation questions. An adopted mechanism failing for a subgroup while leaders insist the evidence says it works: dogma drift; study the variation. PDSA templates filled in after the fact: compliance drift; stop the routine until predictions are written first.","evidence":"Both are right in their own territory. Settled mechanisms should not be rediscovered; how they survive contact with this building is exactly what improvement cycles are for. Bryk's cases mostly concern measurable structural outcomes; fit for hard-to-measure depth is weaker. Wiliam's headline effect sizes have been revised downward; the cost-effectiveness case survives. [E] settled mechanisms; [E/H] improvement as implementation method; [H] its effect on outcomes.","sources":["10-creating-the-schools-our-children-need","11-improvement-in-action","07-embedding-formative-assessment","08-extraordinary-learning-for-all","06-beyond-the-science-of-reading"]}],"brief":[{"id":"s1","title":"Purpose and community","guidance":"Say who the school serves, what \"world-class\" means for these children, and how the community takes part in design. This section is mostly value commitments, and that is fine, as long as they are named as values and not dressed up as findings. Define \"world-class\" through observable outcomes and experiences, not adjectives. State which design layers are open to community codesign (purpose, culture, the periphery, and which knowledge to prioritize where the evidence is silent) and which are mechanisms that go through an evidence review first. This split is the governance rule for tension t04. Leaving it unstated is the most common founding mistake (`08-extraordinary-learning-for-all`).\n\n**Expected tags:** Mostly [V]. Use [E] only for claims about how community ownership affects sustainment. The split between open and closed layers is itself [V], with an [H] that it produces better designs.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\nRiverbend serves 400 children in K-8 on the city's east side. 55% of families qualify for free lunch, 18% of students are learning English, and 14% have an IEP. \"World-class\" here means four checkable things. Every child leaves grade 8 reading fluently and knowing a broad, coherent body of history, science, literature and the arts [V]. Every child produces work for a real audience at least once a term [V]. At least 85% of students agree \"adults here know me and push me\" [V]. Every subgroup's results are within five points of the school average, so variation is treated as a design problem [V].\n\nThe founding design team (six families, three students, four teachers, two neighbors) owns purpose, culture, the periphery and content choices where the evidence is silent [V]. Mechanisms (phonics, retrieval practice, formative assessment, TLCs) go through an evidence review, and the reasoning is explained to the team in writing rather than put to a vote [V]. Community ownership helps new designs survive (`08-extraordinary-learning-for-all`) [E]. That this split yields better designs is [H], logged as H-09.\n\n**Common failures:**\n- Adjectives instead of checkable outcomes (\"innovative\", \"whole child\").\n- Promising the community it will \"design the school\" without saying which layers are open.\n- Tagging values as [E] because a book agrees with them.","default_tag":"V","prompts":["Who exactly does the school serve (ages, neighborhood, needs, languages, share of students with disabilities)?","Write three to five graduate outcomes a stranger could check, spanning intellectual prowess, identity and well-being.","Which design layers are open to families, students and staff, and which are fixed by evidence? Who decides disputes?","Who was in the founding design team, and whose voices are missing?","What would make you say, in year five, that the school had failed its purpose even if test scores were high?"]},{"id":"s2","title":"The three Tuesdays","guidance":"Describe a February Tuesday for three children at different ages (the default is 7, 12 and 16; a K-8 school uses its youngest, middle and oldest bands, for example 7, 10 and 13). For each child, give one lesson minute by minute, plus a sentence on the rest of the day. This section forces the design down to the median classroom, where Mehta & Fine found depth usually is not (`09-in-search-of-deeper-learning`). Tag inline: each design choice visible in the minute-by-minute carries [E], [H] or [V]. The narrative as a whole is a hypothesis about what your system will produce. Test it in year one by shadowing a student for a whole day.\n\n**Expected tags:** Inline tags on each design choice. Mostly [E] for lesson mechanics, [H] for timings and dosages, [V] for what the day prioritizes.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n**Amara, 7 (grade 2), 9:10-9:55, literacy.**\n- 9:10: Five minutes of phonics review of the \"ai/ay\" spelling, chorally then with individual turns, then reading a decodable passage [E].\n- 9:15: Read-aloud from the unit \"The Ancient Nile.\" Four words are pre-taught with pictures. The teacher stops twice to ask a why-question, and every student answers on a whiteboard [E for the mechanisms; H for the frequency].\n- 9:40: Amara writes one because/but/so sentence about the flood season [E for content-embedded sentence work; H for the specific sequence].\n- 9:50: Amara asks \"Why did they wrap the bodies?\" It goes on the question board and is taken up in Friday's question slot [H].\n\nRest of her day: math with a concrete-to-abstract number line, 40 minutes of science, and recess.\n\n**Leo, 10 (grade 5), math.** A five-question retrieval starter mixes last month's fractions with this week's. A worked example is paired with a similar problem for students to try. A hinge question goes up on whiteboards: at 80% or better the class moves on, and below that the teacher re-teaches using the most common distractor [E for mechanisms; H for the threshold].\n\n**Noor, 13 (grade 8), science.** She predicts what happens to the particles when a sealed syringe of air is compressed, commits in writing, then watches a simulation. The explanation that follows targets the \"particles shrink\" misconception (t11) [E]. In the afternoon she runs a design review for grade-6 students in the studio [H].\n\n**Common failures:**\n- Describing the showcase elective instead of the median core lesson.\n- No point at which the teacher learns what every student understands.\n- Leaving the students who are behind out of the narrative.","default_tag":"H","prompts":["Pick a real subject and a real unit for each child. What exactly is being learned in that lesson?","Minute by minute: where is retrieval, where is new content explained, where does the teacher check every student's understanding, and what happens to students who are behind?","Where in each child's day do they ask their own question, and what happens to it?","Where in the 12- or 13-year-old's day do they have status, choice or a real audience?","If a visitor shadowed each child all day, what would they see that contradicts your brochure?"]},{"id":"s3","title":"Model of the learner","guidance":"Write five commitments about memory, prior knowledge and motivation that the school designs around. Each one must be accurate to the evidence, cite a source slug, and be load-bearing: later sections should point back to it by number (\"per L2\"). Then list the folk theories the school explicitly rejects. This is the section the capstone rubric checks first. Learning styles, \"motivation must come before competence\" and \"knowledge is obsolete because you can search for it\" must not appear, except in the rejected list.\n\n**Expected tags:** Mostly [E], with the source slug for each. Add [H] where a mechanism is robust but the claim that it matters at school scale is untested (for example curiosity spillover, mindset messages).\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n- **L1. Learning is a durable change in long-term memory, and working memory is the bottleneck.** New material is taught in small steps, with extraneous load cut (`00-foundational-papers`; `01-how-learning-happens`) [E].\n- **L2. What children already know determines what they can learn next,** including intuitive theories. Those theories are outcompeted over years, not erased in a lesson (`02-scienceblind`; `13-learning-scientific-concepts`) [E].\n- **L3. Retrieval, spacing and correction build memory. Performance during a lesson is not learning** (`01`; `12-why-we-remember`) [E].\n- **L4. Novices need explicit guidance, and guidance fades as expertise grows.** Brief generation before instruction helps for some concepts, under stated conditions (`00`; `04-productive-failure`) [E].\n- **L5. Motivation follows competence and respect.** Curiosity needs enough knowledge to notice a gap. Adolescents invest effort where they are treated as capable (`00`, Gruber et al.; `05-10-to-25`) [E for the mechanisms; H that school-wide routines built on them move outcomes].\n\n*Rejected folk theories:* learning styles, the \"learning pyramid,\" \"digital natives,\" motivation-first, knowledge-is-obsolete, and \"struggle is always good\" (`01`) [E that these are false]. The list is used in interviews and vendor reviews [V].\n\n**Common failures:**\n- Listing ten commitments nobody can remember.\n- Tagging growth-mindset messaging or curiosity spillover as [E] without a caveat.\n- Commitments that no later section depends on.","default_tag":"E","prompts":["What is learning, in one sentence a teacher could use to judge a lesson?","What does the school believe about working memory, long-term memory and prior knowledge, and which source says so?","What does the school believe about intuitive theories: do they get erased, replaced or outcompeted?","What does the school believe about motivation (curiosity, competence, status and respect), and which parts are [E] and which [H]?","Which folk theories does the school reject, and where will staff meet this list (hiring, PD, procurement)?"]},{"id":"s4","title":"Curriculum","guidance":"Sketch the knowledge sequence across grades, the concept progressions (spirals) in science and math, how literacy time is allocated, and what is deliberately excluded. The mechanisms (a coherent, cumulative, prerequisite-mapped sequence, phonics as a separate track, content-embedded writing) are [E]. Which periods, texts and cultures are studied is [V], so log those choices in the value register with who might disagree. Show at least one concept whose progression is designed across three or more grades.\n\n**Expected tags:** [E] for sequencing, knowledge-building, phonics and conceptual prerequisites. [H] for specific sequences and minutes. [V] for content selection and exclusions.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\nRiverbend adopts one knowledge-building ELA curriculum for K-5. It runs alongside a separate systematic phonics track in K-2 with decodable texts. Leveled texts are not used to ration content (`06-beyond-the-science-of-reading`) [E]. History is taught chronologically twice: an introductory pass in grades 1-4 and a deeper pass in grades 5-8, with each unit naming the earlier units it relies on [E for cumulative sequencing; H for this particular spine]. Which civilizations, texts and figures appear is decided by the teaching team with family input and logged as V-03 [V].\n\nScience is built as four long progressions: matter, energy, forces and interactions, and living systems (`13-learning-scientific-concepts`) [E for learning progressions; H for the specific sequence]. The particle model is introduced in grade 3, formalized in grade 5 before photosynthesis, and revisited in grades 7 and 8 [H]. Its target misconceptions include \"particles expand\" and \"gas has no mass\" (`02-scienceblind`) [E].\n\nK-2 daily minutes are 30 of phonics, 45 of knowledge-building ELA, 30 of science or history, and 15 of writing [H]. One fraction model (the number line) is used from grades 3-6 [H].\n\nExcluded: skill-of-the-week comprehension units (`06`) [E], a stand-alone \"21st-century skills\" course [V/E], and teacher-by-teacher unit selection in the core [V].\n\n**Common failures:**\n- \"Knowledge-rich\" asserted with no actual sequence.\n- Presenting content choices as if the science dictated them.\n- No conceptual-prerequisite check (photosynthesis before particles).","default_tag":"E","prompts":["Sketch the sequence for history and science by grade. What does each unit depend on, and what depends on it?","Choose one hard concept (particle model, natural selection, proportional reasoning) and show its progression across grades, with the intuitive theory it must outcompete.","How many daily minutes go to phonics, knowledge-building ELA, writing, science and history in K-2 and in 3-5?","Which representations and vocabulary are standardized across grades?","What is deliberately excluded, and why?","Who owns the curriculum: the school, the department or the individual teacher?"]},{"id":"s5","title":"Instruction","guidance":"Specify the default lesson, the named exceptions and the conditions under which each applies, and the policy on homework and practice. The default is explicit, with guidance fading as expertise grows [E]. Exceptions such as productive failure, the studio, or seminar discussion must state their conditions, and they must be switchable: say what observation or data would send a unit back to the default (tension t01). Unguided discovery is excluded for novices. Show how scaffolding changes between the youngest and oldest students, which makes the expertise-reversal effect visible.\n\n**Expected tags:** [E] for the components of the default lesson and for the exclusion of unguided discovery. [H] for timings, thresholds, how many PF concepts, and homework amounts. [V] for how much open inquiry the school wants at all.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n**Default lesson** [E for components (`01-how-learning-happens`, Rosenshine); H that one shared model beats teacher-by-teacher variation]:\n1. Retrieval starter mixing old and recent material, 5-8 minutes (L3).\n2. The learning intention, separated from the task.\n3. Explicit explanation with worked examples, and redundant text removed from slides (L1, L4).\n4. An all-student check: whiteboards or a hinge question (L2).\n5. Guided practice aiming for about 80% success (L5) [H for the threshold].\n6. Independent practice.\n7. An exit ticket used to plan tomorrow's lesson.\n\n**Exception: productive failure.** Used for up to four designated concepts a year in grades 6-8 math and science. All four conditions must hold: the goal is conceptual, students have relevant prior knowledge, the problem admits several approaches, and a scripted consolidation is protected in the next period (`04-productive-failure`) [E for the conditions; H for the number]. Switch signal: if observed consolidation runs under 20 minutes or delayed transfer falls below the explicit-instruction baseline, the unit reverts (t01).\n\n**Exception: the Friday studio.** It is periphery, with explicit skill clinics and open ideas (s8).\n\n**Scaffolding across ages.** In K-2 nearly everything is modeled first. By grade 8, students attempt problems first in about a fifth of lessons [H].\n\n**Homework.** Retrieval of material already taught, about 10 minutes times the grade number, cumulative, done or not done rather than graded [E for retrieval and spacing; H for the amounts].\n\n**Common failures:**\n- \"Balanced approach\" with no conditions stated.\n- Exceptions with no switch signal.\n- Rewarding engagement in observations.","default_tag":"E","prompts":["Write the default lesson as five to seven phases, each with its mechanism and the learner-model commitment (L1-L5) it serves.","Which exceptions exist? For each: the conditions, who approves it, and the switch signal that sends it back to the default.","How does scaffolding change between grade 1 and grade 8?","What is the homework and practice policy: purpose, amount, success rate, spacing?","What does the observation rubric reward, and what does it refuse to reward (visible activity, student preference)?"]},{"id":"s6","title":"Assessment and feedback","guidance":"Specify the formative toolkit, the grading policy, the standard every hinge question must meet, how mastery is defined, and how results are reported to families. Grading policy must reflect Butler: no grades on formative work (`07-embedding-formative-assessment`) [E]. Reporting must be honest enough that families know where their child stands. Otherwise families will treat every check as a judgment (t12), as in casebook k03. Define mastery for core concepts as success on transfer and delayed items, not on recall.\n\n**Expected tags:** [E] for comment-only formative feedback, retrieval-as-learning, all-student response and generative items. [H] for cadence, thresholds and the hinge-question bank. [V] for the definition of mastery and reporting choices.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n**School-wide routines:** no hands up for answering, mini-whiteboards in every room, planned wait time, and a daily exit ticket (`07-embedding-formative-assessment`) [H for the package; the component techniques have partial evidence].\n\n**Hinge-question standard** [H]. Every hinge question must:\n- be answerable by every student in under a minute\n- have each wrong option map to a named misconception from the unit's register (`02-scienceblind`)\n- come with a decision rule written in advance, for example \"80% or more correct: move on; otherwise re-teach using the most common distractor\"\n- be banked with its results each year\n\n**Grading.** Formative work gets comments only, and each comment requires a student action (Butler; Kluger & DeNisi) [E]. Unit tests and end-of-term assessments are graded against standards [V]. A work-habit line is reported separately from achievement [H].\n\n**Mastery.** A core concept counts as mastered only with success on a novel prediction or transfer item and on a re-test at least four weeks later [E that recall and conceptual items diverge; V for the definition].\n\n**Families** get a monthly one-page note per core subject naming the standard, the distance from it, and the next step. The format was codesigned with the family council (`05-10-to-25`) [H/V].\n\n**Common failures:**\n- Grades plus comments on formative work.\n- Hinge questions with random distractors.\n- Reporting so sparse that families revolt (see k03).","default_tag":"E","prompts":["Which formative routines are school-wide in every classroom, and which are teacher choice?","State the hinge-question standard. What must every hinge question have before it goes in the bank?","What is graded, when, and how is it reported? Where does effort or work habit appear, if anywhere?","How is mastery of a core concept defined?","How often do families hear how their child is doing, in what format, and who codesigned that format?","Which assessment data never leave the classroom or team (for example, never enter evaluation)?"]},{"id":"s7","title":"Adults","guidance":"Cover hiring, the development plan for each teacher's first three years, the TLC compact, and how adults talk to students. Tension t06 sets the default: develop, don't rely on selection. Pre-hire signals predict effectiveness weakly (`10-creating-the-schools-our-children-need`) [E]. Hiring should look for disciplinary depth and coachability, and the development system has to be designed to fill the rest. Apply the mentor mindset to adults as well as to students.\n\n**Expected tags:** [E] for sustained, collaborative, practice-based PD and the TLC package, and for the weakness of credentials as predictors. [H] for hiring criteria, TLC parameters, and keeping TLCs separate from evaluation. [V] for staff culture commitments.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n**Hiring.** A demo lesson followed by one feedback cycle: the candidate re-teaches a segment the next day. Plus a subject-knowledge task and a structured discussion of student work [H; logged as H-01].\n\n**Years one to three.** Curriculum-specific onboarding before August. Fortnightly coaching in year one, monthly in year two. A TLC from week six. No new teacher carries an extra-curricular role in year one [H].\n\n**TLC compact** [E for the package (`07-embedding-formative-assessment`, EEF trial); H for the parameters]:\n- groups of nine, meeting monthly for 90 minutes, for two years\n- a fixed agenda: an opening retrieval activity, a \"how's it going\" round in which each teacher reports specifically on their action plan, new learning, and a personal plan for next month\n- two peer observations per teacher between meetings, focused on the observed teacher's chosen technique, with cover time provided\n- trained facilitators\n- nothing said in a TLC enters appraisal [H]\n\nTime for TLCs comes from cutting the weekly staff meeting to twice a month and ending the practice of grading every piece of written work [V].\n\n**Talking to students.** Major feedback carries a sincere standard-and-belief statement plus a revision chance (`05-10-to-25`) [E, modest replication base]. No public behavior charts [V/H].\n\n**Switch signal.** If within-school variation in effectiveness hasn't narrowed after two full years, redesign the TLCs (t06).\n\n**Common failures:**\n- \"Hire the best\" as the whole strategy.\n- TLCs with no accountability round, or with evaluators in the room.\n- No stated source of time.","default_tag":"E","prompts":["What does the hiring process observe directly (work samples, a feedback cycle, a disciplinary knowledge task)?","What does years one to three look like for a new teacher: coaching, curriculum-specific training, observation?","Write the TLC compact: group size, frequency, duration, agenda, action plans, peer observation, and what never happens (evaluation).","How do adults speak to students (wise feedback, sincere questions, no public status-lowering)?","What does the school stop doing to create time for TLCs?","What would show, after three years, that the development system is not working?"]},{"id":"s8","title":"Structure","guidance":"Cover the schedule, grouping, the periphery, and what is kept conventional, with reasons. Tension t13 says spend change capacity on instruction, assessment and adult learning first, and change structure only where a specific instructional need requires it. Name that need each time you depart from convention. The periphery (studio, clubs, arts, debate) must be protected in the timetable and designed with apprenticeship features. Everything here is a hypothesis unless a source directly supports it.\n\n**Expected tags:** Mostly [H]. Use [E] only where evidence speaks directly (for example daily math supporting spacing, or targeted small-group tutoring). Use [V] for protecting the periphery and for detracking commitments.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n- **Classes.** Two classes of about 22 per grade. K-5 classes are self-contained, with a specialist science teacher from grade 3. Grades 6-8 are departmentalized, with 55-minute periods and math every day, because daily contact supports spaced retrieval [H for the structure; E for spacing].\n- **Planning time.** Grade teams share three common planning periods a week, needed for PDSA cycles and hinge-bank work [H].\n- **Grouping.** Mixed-attainment classes, with flexible, temporary small groups formed by prior knowledge from exit-ticket data. Groups are re-formed every unit [E against fixed labels; H on specifics]. Tutoring for K-2 students below the decoding benchmark takes place in groups of three, four days a week [E].\n- **The periphery.** A Friday studio for grades 3-8 (90 minutes, compulsory for all) with skill clinics, critique, mixed-age mentors and a term exhibition. Protected from test-season cuts [V/H]. Advisory in grades 6-8: 12 students per adult, 20 minutes a day [H].\n- **Kept conventional.** Age-graded classes, the standard calendar, and a 7-hour day. None of these blocks our instructional model, so we are not spending change capacity on them [H].\n\n**Common failures:**\n- Structural novelty (4-day weeks, all-playlist models) with no instructional need behind it.\n- The periphery \"when there's time\".\n- No common planning time for the improvement system.","default_tag":"H","prompts":["What does the weekly timetable look like for K-2, 3-5 and 6-8? Where is common planning time?","How are students grouped, and when and how does grouping change (flexibly, by prior knowledge, temporarily)?","What is the periphery, who takes part (everyone?), and what apprenticeship features does it have?","What do you keep conventional on purpose?","For each structural departure, which instructional need requires it?"]},{"id":"s9","title":"Improvement system","guidance":"Give the year-one aim, the driver diagram, the PDSA cadence, the practical measures, and how improvement data is kept separate from accountability. The aim is a value choice: which problem matters most this year, and for whom. The method (predicted small tests, practical measures, attention to variation) has a strong track record in other sectors, while the school evidence is case-based (`11-improvement-in-action`). Write the rule for tension t05 into the charter: improvement measures never enter evaluation.\n\n**Expected tags:** [V] for the aim and for keeping improvement data out of evaluation. [E] that high-stakes use corrupts indicators and that aggregates hide gaps. [H] for the specific drivers, change ideas and target numbers.\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n**Aim.** By May of year one, 80% of K-2 students reach the decoding benchmark (fall baseline: 52%). The gap between English learners and other students is halved, from 18 points to 9 [V for the aim; H for the size].\n\n**Primary drivers:**\n- the quality of phonics instruction\n- the dosage and quality of tutoring\n- attendance\n- practice at home\n\n**Secondary drivers and change ideas, for example:** a daily five-minute review of sounds previously taught; tutoring groups of three with a fixed routine; a text to families after the second absence.\n\n**Practical measures,** returned to teachers within a week: weekly decoding checks, the share of tutoring sessions delivered, and daily attendance. Balancing measures are teacher prep time and the student-experience \"I like reading\" item [H].\n\n**First PDSA.** Two K classes try a fixed 10-minute sound-review routine for three weeks. Prediction: accuracy on reviewed sounds rises from 60% to 80%.\n\n**Cadence.** Weekly 20-minute team huddles, a fortnightly cycle review, and a termly driver-diagram review.\n\n**Separation.** The board sees aggregate practical measures monthly and accountability measures twice a year. Class-level practical data stays with the teams and never enters appraisal [V]. High-stakes use corrupts indicators (`11-improvement-in-action`) [E].\n\n**Common failures:**\n- Ten aims.\n- PDSA templates filled in after the fact, with no written prediction.\n- Improvement dashboards shown to evaluators (see k18).","default_tag":"E","prompts":["Write one year-one aim: what, how much, by when, for whom (with subgroups).","Draw the driver diagram: aim, primary drivers, secondary drivers, change ideas, and a measure at each level.","Specify the first PDSA cycle: change, prediction, practical measure, balancing measure, duration, and who runs it.","What is the cadence (weekly huddles, fortnightly cycles, termly driver review)?","Which measures go to the board, at what aggregation, and which never leave the teams?","What is the switch signal if practical measures and accountability measures diverge?"]},{"id":"s10","title":"Open hypotheses register","guidance":"List every [H] in sections 3-9, each with the evidence or PDSA cycle that would resolve it. The register is where the brief admits what it doesn't know, and it drives the improvement agenda. A strong register is specific: each entry has a written prediction, a practical measure, a decision rule, and a review date. Make sure your riskiest bets are there, not just your safest.\n\n**Expected tags:** Every entry is [H]. When an entry is resolved, it moves to [E-local] (\"supported in our context\") or is retired, with the date and evidence recorded. Local results never become general [E].\n\n**Register fields (one entry per hypothesis):**\n- **Id:** H-01, H-02, ... (stable; never reused)\n- **Hypothesis:** One sentence, specific enough to be wrong (\"X raises Y by Z for whom\")\n- **Brief section:** Where the [H] tag appears (s3-s9)\n- **Why [H] not [E]:** Mechanism unproven, parameter untested, evidence from other contexts, or case-only evidence\n- **Test:** PDSA cycle, comparison, or evidence review; who runs it; duration\n- **Prediction:** Written before the test, with a number\n- **Practical measure:** What is counted, how often, returned to whom within how many days\n- **Balancing measure:** What could get worse (teacher time, well-being, another subject)\n- **Decision rule / switch signal:** What result leads to adopt, adapt, or abandon\n- **Review date:** When it is next looked at\n- **Status:** open / testing / supported locally (E-local) / abandoned, with date and one-line evidence\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n- **H-01.** Response to one feedback cycle at interview predicts year-one growth. *Test:* score every hire at interview, then correlate with year-one observation growth; n is small, so pool data over three hiring years. *Decision:* drop the feedback cycle from interviews if there is no relationship after three years. *Review:* June, annually.\n- **H-04.** A weekly question slot doubles student question rates in grades 3-5 within a term. *Test:* PDSA in two classes, with the audit protocol run before and after. *Balancing measure:* scores on curriculum-embedded knowledge checks. *Decision:* spread to all classes if rates at least double and knowledge checks hold.\n- **H-06.** PF for four concepts in grades 6-8 improves delayed transfer compared with explicit teaching. *Test:* compare delayed quiz results with the prior year's explicit cohort; check fidelity by observation. *Switch:* revert any unit where consolidation runs under 20 minutes.\n\n**Common failures:**\n- An empty or vague register (\"we'll see how it goes\").\n- Hypotheses with no disconfirming result specified.\n- Only safe hypotheses listed.","default_tag":"H","prompts":["Have you found every [H] tag in sections 3-9 and entered it here?","For each entry, what is the smallest test that could change your mind?","What would you have to see to drop the idea?","Which three hypotheses carry the most risk if they are wrong? Are they scheduled first?"]},{"id":"s11","title":"Value commitments register","guidance":"List every [V] in the brief, with one sentence on who might reasonably disagree and why. The point is not to defend values with evidence. It is to hold them knowingly, to see what they cost, and to prevent values from being laundered as findings. Evidence can inform a value commitment (by revealing its costs) but cannot settle it. At least two of your capstone defense challenges will attack entries here.\n\n**Expected tags:** Every entry is [V]. An entry that cites evidence should say what the evidence informs, not claim that it decides the commitment.\n\n**Register fields (one entry per commitment):**\n- **Id:** V-01, V-02, ...\n- **Commitment:** One sentence, stated as a choice (\"We choose X over Y\")\n- **Brief section:** Where the [V] tag appears\n- **Who might reasonably disagree:** A real group, and their best argument in one sentence\n- **Cost:** What the commitment gives up (money, time, another goal, some families' preferences)\n- **Evidence that informs it:** What evidence says about its costs or consequences, without claiming to decide it\n- **Conflicts with:** Other V entries it can collide with, and which wins\n- **Owner and review:** Who can reopen it, and when\n\n**Example entry (Riverbend, a hypothetical 400-student K-8):**\n\n- **V-01. One common knowledge curriculum for all, with no rationing of content by level.** *Who disagrees:* teachers who see curriculum choice as the core of professional judgment; some families who want the curriculum to center
