<title>Founding School</title>
<meta name="description" content="A self-paced course: learning science to school design to institution building.">

<style>
/* Layout: a drawing-set index down the left (the course's "sheets"), one working sheet on the right. */
:root {
  --paper: #eef1ee;
  --sheet: #fbfcfa;
  --ink: #18262b;
  --ink-2: #4a5a5f;
  --rule: #cfd8d4;
  --accent: #2446b8;
  --accent-ink: #ffffff;
  --accent-soft: #e3e8fa;
  --e: #1f7a5a; --e-soft: #dcefe6;
  --h: #9a6200; --h-soft: #f6ead2;
  --v: #6b3fa8; --v-soft: #ece3f7;
  --bad: #b3261e; --bad-soft: #f8e1df;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111a1d; --sheet: #172226; --ink: #e4ebe8; --ink-2: #9fb0ad; --rule: #2c3b3f;
    --accent: #8ea6ff; --accent-ink: #0d1530; --accent-soft: #1f2a4d;
    --e: #6fd0a8; --e-soft: #16362b; --h: #f0b95a; --h-soft: #3a2c12; --v: #c4a2f2; --v-soft: #2d2140;
    --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111a1d; --sheet: #172226; --ink: #e4ebe8; --ink-2: #9fb0ad; --rule: #2c3b3f;
  --accent: #8ea6ff; --accent-ink: #0d1530; --accent-soft: #1f2a4d;
  --e: #6fd0a8; --e-soft: #16362b; --h: #f0b95a; --h-soft: #3a2c12; --v: #c4a2f2; --v-soft: #2d2140;
  --bad: #ff8a80; --bad-soft: #3d1c1a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.6; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.2rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font-family: var(--mono); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }

.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
.rail { border-right: 1px solid var(--rule); padding: 20px 14px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 2px; padding: 0 8px; }
.brand b { font-family: var(--display); font-weight: 400; font-size: 1.35rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: grid; grid-template-columns: 38px minmax(0,1fr) auto; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: var(--r); color: var(--ink); text-decoration: none; font-size: .93rem; line-height: 1.35; }
.nav a:hover { background: var(--accent-soft); }
.nav a.on { background: var(--ink); color: var(--paper); }
.nav a.on .label, .nav a.on .tick { color: var(--paper); }
.nav .num { font-family: var(--mono); font-size: .75rem; color: var(--ink-2); }
.nav a.on .num { color: var(--paper); }
.tick { font-family: var(--mono); font-size: .75rem; color: var(--e); }
.navgroup { display: flex; flex-direction: column; gap: 2px; }
.navgroup > .label { padding: 0 8px 4px; }
.sync { padding: 0 8px; font-size: .8rem; }

main { padding-block: 28px 80px; padding-inline: clamp(16px, 4vw, 56px); min-width: 0; }
.sheet { max-width: 780px; display: flex; flex-direction: column; gap: 28px; }
.sheet.wide { max-width: 1080px; }
.head { display: flex; flex-direction: column; gap: 10px; }
.titleblock { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--mono); font-size: .75rem; color: var(--ink-2); letter-spacing: .04em; border-top: 1.5px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 6px 0; }
.lede { font-size: 1.1rem; color: var(--ink-2); max-width: 64ch; }

.step { display: flex; flex-direction: column; gap: 12px; }
.step > .label { display: flex; gap: 10px; align-items: center; }
.step > .label::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 68ch; }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.prose h4 { font-family: var(--body); font-size: 1rem; margin: 6px 0 0; }
.prose code { font-family: var(--mono); font-size: .88em; background: var(--accent-soft); padding: 1px 4px; border-radius: 3px; }

.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.attempt { border-style: dashed; border-color: var(--accent); }
.idea { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.idea > summary { cursor: pointer; list-style: none; padding: 14px 20px; display: flex; gap: 12px; align-items: baseline; justify-content: space-between; }
.idea > summary::-webkit-details-marker { display: none; }
.idea > summary h3 { font-size: 1.12rem; }
.idea[open] > summary { border-bottom: 1px solid var(--rule); }
.idea .prose { padding: 16px 20px 20px; }

.tag { font-family: var(--mono); font-size: .7rem; font-weight: 500; letter-spacing: .05em; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.tag.E { background: var(--e-soft); color: var(--e); }
.tag.H { background: var(--h-soft); color: var(--h); }
.tag.V { background: var(--v-soft); color: var(--v); }

.btn { border: 1px solid var(--ink); background: transparent; border-radius: var(--r); padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: .92rem; }
.btn:hover { background: var(--accent-soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { padding: 4px 10px; font-size: .82rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
textarea, input[type=text] { width: 100%; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; line-height: 1.5; }
textarea { min-height: 130px; resize: vertical; }
.saved { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); }

.hinge { display: flex; flex-direction: column; gap: 10px; }
.hinge .q { font-weight: 700; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; display: grid; grid-template-columns: 26px minmax(0,1fr); gap: 8px; background: var(--paper); border: 1px solid var(--rule); border-radius: var(--r); padding: 9px 12px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt .k { font-family: var(--mono); color: var(--ink-2); }
.opt.right { border-color: var(--e); background: var(--e-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.diag { font-size: .93rem; padding: 10px 12px; border-left: 3px solid var(--ink-2); background: var(--paper); }
.diag.right { border-color: var(--e); }
.diag.wrong { border-color: var(--bad); }

.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; }
.steps li::marker { font-family: var(--mono); color: var(--ink-2); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink); min-width: 0; }
a.tile:hover { border-color: var(--accent); }
.tile .big { font-family: var(--display); font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--rule); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.modlist { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
.modrow { display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 14px; align-items: baseline; padding: 12px 4px; border-bottom: 1px solid var(--rule); text-decoration: none; color: var(--ink); }
.modrow:hover { background: var(--sheet); }
.modrow .num { font-family: var(--display); font-size: 1.4rem; color: var(--ink-2); }
.modrow .t { font-weight: 700; }
.modrow .meta { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); text-align: right; }

.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 28px; min-height: 240px; display: flex; flex-direction: column; gap: 16px; }
.card .front { font-family: var(--display); font-size: 1.35rem; line-height: 1.35; }
.card .back { border-top: 1px dashed var(--rule); padding-top: 16px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades .btn { display: flex; flex-direction: column; align-items: center; gap: 0; }
.grades .btn small { font-weight: 400; font-family: var(--mono); font-size: .7rem; color: var(--ink-2); }

.bands { display: flex; flex-direction: column; gap: 14px; }
.band { border: 1px solid var(--rule); border-radius: var(--r); background: var(--sheet); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.band header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.nodes { display: flex; flex-wrap: wrap; gap: 8px; }
.node { border: 1px solid var(--rule); background: var(--paper); border-radius: 99px; padding: 5px 12px; cursor: pointer; font-size: .9rem; display: inline-flex; gap: 8px; align-items: center; }
.node.on { border-color: var(--accent); background: var(--accent-soft); }
.node.linked { border-color: var(--accent); }
.loop { font-size: .95rem; padding: 12px 14px; border: 1.5px dashed var(--accent); border-radius: var(--r); }

.tension { display: flex; flex-direction: column; gap: 10px; }
.poles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.poles > div { background: var(--paper); border-radius: var(--r); padding: 10px 12px; font-size: .93rem; min-width: 0; }
.rule { font-weight: 700; border-left: 3px solid var(--accent); padding-left: 12px; }

.entry { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--rule); }
.tagpick { display: flex; gap: 4px; }
.tagpick button { border: 1px solid var(--rule); background: transparent; border-radius: 99px; font-family: var(--mono); font-size: .72rem; padding: 2px 8px; cursor: pointer; }
.tagpick button.on.E { background: var(--e-soft); color: var(--e); border-color: var(--e); }
.tagpick button.on.H { background: var(--h-soft); color: var(--h); border-color: var(--h); }
.tagpick button.on.V { background: var(--v-soft); color: var(--v); border-color: var(--v); }
.x { border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 1.1rem; line-height: 1; }

.fb { background: var(--accent-soft); border-radius: var(--r); padding: 14px 16px; }
.dstmt { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--rule); }
.conf { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.conf button, .tf button { border: 1px solid var(--rule); background: transparent; border-radius: var(--r); padding: 3px 10px; cursor: pointer; font-family: var(--mono); font-size: .8rem; }
.conf button.on, .tf button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.mtop { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0,1fr); }
  .rail { display: none; position: fixed; inset: 0; z-index: 20; background: var(--paper); height: 100%; padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .rail.open { display: flex; }
  .mtop { display: flex; justify-content: space-between; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); border-bottom: 1px solid var(--rule); padding: 10px 16px; }
  .mtop b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
  .poles { grid-template-columns: minmax(0,1fr); }
  .grades { grid-template-columns: repeat(2, 1fr); }
  .card { padding: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
}

<script type="application/json" id="course-data">{"modules":[{"id":"m0","num":0,"title":"Start here: your cold design, the map, and the tagging discipline","level":"Start","minutes":60,"sources":[],"hook":"Founders almost always know what their school will look like before they know how children learn. You have a picture in your head right now. The most useful thing you can do in the next hour is get that picture onto paper before this course has a chance to change it, so you can see later exactly what changed and why.","attempt":{"prompt":"You have been given a building, a budget for 30 staff, and permission to enroll 400 students aged 5-18 next August. In 40 minutes, write a one-page design: what a Tuesday in February looks like for a 7-year-old, a 12-year-old, and a 16-year-old; how you will know in year two whether it is working; and the three decisions you are least sure about. Do not research. Use what you already believe.\n\nThe point is to generate, not to be right. This page is graded only against your own later work. It becomes **Brief v0**, and every module after this one ends with a change to it.\n\nWhen you finish, before reading on: (a) list the assumptions you made about how children learn that you could not defend to a skeptic; (b) mark each decision on the page [E], [H] or [V] as best you can. You will do this badly. That is expected.","minutes":40},"objectives":["Produce Brief v0: an honest, unresearched design that exposes your current theory of schooling.","Name the three levels (Minds, Design, Institutions) and explain why a claim at one level constrains the level above it.","Tag any design claim as evidence [E], hypothesis [H] or value [V], and split compound claims into their parts before tagging.","Describe how each module runs (hook, attempt, ideas, worked example, hinge questions, brief diff) and why it is built that way."],"ideas":[{"title":"The map: three levels, one spine, and how every module runs","tag":"V","body":"This course compresses roughly 150-180 hours of reading (thirteen books and a set of foundational papers) into about 17 hours. It does that by organizing everything on three levels, and by teaching them in a deliberate order.\n\n**Minds: how learning happens inside one head.** Working memory is tiny; long-term memory is vast; learning is a change in long-term memory. Children arrive with intuitive theories that fight new ideas. Curiosity and a sense of respect change what gets encoded. These are constraints, like physics for an engineer: your school can be creative about many things, but not about these.\n\n**Design: how learning experiences should be built.** Given those constraints, how should a lesson, a unit, a curriculum, a feedback routine and an assessment be designed? Here you meet the explicit-instruction evidence, productive failure, knowledge-rich curriculum and formative assessment.\n\n**Institutions: how a school makes good learning happen reliably.** Most schools already contain a few excellent classrooms. The institutional problem is getting the median classroom on an ordinary Tuesday to be good, year after year, with the staff you actually have. This is about teacher development, curriculum ownership, what you stop doing, and running the school as an improvement system.\n\n**Why bottom-up.** Each level constrains the one above. You cannot judge a lesson design without a model of memory, and you cannot judge a staffing structure without a model of good instruction. So Modules 1-3 are Minds, 4-6 are Design, 7-9 are Institutions, and 10 integrates. But you started top-down, with a whole-school design, on purpose: everything that follows will land as an answer to a question you have already asked yourself.\n\n**How each module runs, and why.** Every module has the same six-part shape, so the structure stops costing you attention by Module 3 (a direct application of cognitive load theory):\n\n- **Hook**: a question you cannot yet answer. An open information gap improves memory for the answer that closes it.\n- **Attempt**: a short design problem you try cold. This is Kapur's productive failure applied to you: it activates what you already believe and shows you where it breaks, so the explanation that follows has somewhere to land. Where you have no relevant prior knowledge, the attempt is replaced by a worked example, because struggle with nothing to activate is wasted time.\n- **Ideas**: the load-bearing knowledge, distilled from the books, with named studies and honest evidence limits.\n- **Worked example**: one design decision reasoned step by step, so you see the thinking before doing it yourself. Worked examples fade as the course goes on.\n- **Hinge questions**: multiple-choice questions where every wrong option maps to a specific misconception. A wrong answer tells you which folk theory is still active and where to go to repair it.\n- **Brief diff**: a small, versioned change to your design brief, with a prediction and a note on what evidence would prove it wrong. The capstone is the brief after many such cycles, with its changelog.\n\nIf you are from software, think of Brief v0 as the first commit, each module as a pull request with a test attached, and the hinge questions as the test suite for your own understanding. The product analogy has one important limit: in a school, the users are children, the release cycle is a year, and you cannot roll back a cohort. That is why the course leans so hard on evidence before you ship."},{"title":"The discipline: tag every claim as evidence, hypothesis, or value","tag":"V","body":"Education is full of confident claims. Some rest on decades of replicated experiments; some are plausible guesses; some are statements about what a community wants for its children. Founders get into trouble when they mix these up, most often by **laundering values as evidence** (\"research shows students need project-based learning\") or **dressing hypotheses as settled** (\"90-minute blocks produce deeper learning\"). Every design claim in this course therefore carries one of three tags.\n\n**[E] Evidence.** The mechanism or effect is supported by a body of research that has replicated across studies and, ideally, settings. Examples: retrieval practice improves long-term retention; worked examples help novices more than unguided problem solving; background knowledge drives comprehension of a specific text. [E] does not mean certain, and it does not mean the effect will be the same size in your building. It means you need a good reason to design against it.\n\n**[H] Hypothesis.** A plausible bet, consistent with evidence, but untested in this form or context. Most specific parameters live here: the 20-minute homework set, the three-week spacing window, the proportion of lessons run as productive failure, the size of a teacher learning group. [H] claims are fine. They are the normal state of a new school. But each one should come with a prediction and a way to find out whether you were wrong.\n\n**[V] Value.** A commitment about what matters, which evidence can inform but cannot settle. Which knowledge every child should learn; whether understanding evolution may be assessed but acceptance never required; whether small classes are worth their cost because families value being known. Values are not second-class. A school without explicit values drifts toward whatever is measured. But a [V] claim should be defended as a value, openly, with your community, and not smuggled in under [E].\n\n**Three rules that make tagging useful.**\n\n1. **Split before you tag.** Most design decisions are bundles. \"Every student has an advisor who meets them weekly to set goals\" contains a mechanism claim (relationships and goal-setting support persistence), a parameter (weekly), and a commitment (every student is known by an adult). Tag each part.\n2. **Tag the transfer, not just the finding.** A study can be solid [E] in its own setting while its application to your school is [H]. Curiosity research, for example, is mostly adults answering trivia questions in a scanner. The finding is real; the classroom application is a hypothesis.\n3. **Evidence has a size and a boundary.** When you tag something [E], you should be able to say roughly how big the effect is, for whom, and where it stops applying. Productive failure, for instance, helps conceptual understanding and transfer but shows no advantage for procedural skill.\n\nYou will find this uncomfortable at first, because it forces you to admit how much of your v0 design is [H] or [V]. That is the point. A founder who knows which parts of the plan are bets can run the school as a learning system. A founder who thinks everything is proven will defend every mistake."}],"worked_example":{"title":"Tagging one decision: \"Grades 6-12 run a daily 20-minute advisory, one adult to twelve students\"","steps":["Split the claim into parts. (1) Adolescents are more motivated when an adult they trust holds high standards with them. (2) A daily 20-minute slot is the right dose. (3) A 1:12 ratio is the right size. (4) Every student should be known well by at least one adult.","Part 1 is a mechanism claim. There is experimental support that respect, belonging and wise feedback change adolescents' effort (Yeager's work, Module 3), but advisory programs as such are less tested. Tag: [E] for the mechanism, [H] that advisory is the vehicle that delivers it.","Parts 2 and 3 are parameters. Nothing in the research sets 20 minutes or twelve students. Tag both [H], and write a prediction: 'By November, at least 90% of students can name an adult who knows their goals; check with a two-question survey.'","Part 4 is a commitment about what the school owes each child. Tag [V]. It would be worth keeping even if achievement effects turned out small, and you should say so openly rather than justifying it with borrowed evidence.","Write the tagged version into the brief: 'Every student is known by an adult [V]. Advisory is our vehicle for mentor-style standards and support [E mechanism / H vehicle]. Daily 20 min, 1:12 [H], review in November against the survey.'"]},"hinge":[{"q":"Why does this course ask you to design a whole school cold, before any content?","options":["To test whether you are already qualified to found a school.","To surface your current theory of schooling and activate what you believe, so later explanations have something specific to confirm or break.","Because learning by discovery is generally more effective than being taught.","It is a warm-up; the real learning starts in Module 1."],"answer":1,"diagnoses":["Treating the attempt as a summative test. It is not graded against any standard except your own later work; its job is generation, not measurement.","Correct. This is productive failure applied to you: generation activates prior knowledge and exposes its limits, which makes the subsequent instruction more meaningful. It works only because instruction follows.","Confuses productive failure with discovery learning. The course holds that unguided discovery is weak for novices; the attempt is short, bounded and followed by explicit teaching.","Underestimates the attempt. Without it, you would read later modules as general information instead of as answers to decisions you have already made, and you would have no baseline to measure your own growth against."]},{"q":"A draft brief says: \"We will use 90-minute blocks because longer periods allow deeper work.\" Which tag fits best?","options":["[E], because deeper work obviously needs more time.","[H], because it is a plausible bet about outcomes that has not been established and should come with a prediction.","[V], because scheduling is a matter of school philosophy.","No tag needed; timetabling is operational, not a design claim."],"answer":1,"diagnoses":["Laundering plausibility as evidence. 'Obviously' is a warning sign; a claim is [E] only if research supports it, with a known size and boundary.","Correct. It predicts a learning outcome, so it is testable. Tag it [H] and write down what you would expect to see and how you would check.","Mis-tagging a testable prediction as a value. Values are about what matters, not about what will happen; this claim is about what will happen.","Timetables are among the most consequential design choices in a school. Leaving them untagged is how untested assumptions become permanent."]},{"q":"Why does the course teach Minds before Design before Institutions, even though you began with an institutional design?","options":["Because institutions matter least for student outcomes.","Because each level constrains the one above: you cannot evaluate a lesson without a model of memory, or a school structure without a model of good instruction.","Because that is the order in which the research was historically done.","Because the Minds material is easiest and builds confidence."],"answer":1,"diagnoses":["Reverses the argument. The institutional level is where the median classroom is made good or bad; it comes last because it depends on the other two, not because it matters least.","Correct. The order follows dependency, like building a system from its lowest-level constraints up. The cold start was top-down so that the bottom-up material answers your own questions.","Historical order is not the logic; much institutional research (school improvement, teacher development) is contemporary with the cognitive research.","Difficulty is not the criterion. The Minds material is in fact dense; it comes first because everything else is evaluated against it."]},{"q":"A well-run study with adults in a brain scanner shows that curiosity about trivia questions improves memory for the answers. How should a claim that 'curiosity hooks improve learning in our Year 5 classes' be tagged?","options":["[E], because the study is peer-reviewed and replicated.","[V], because curiosity is something the school values.","[E] for the mechanism in its original setting, [H] for its transfer to Year 5 classrooms and school content.","It cannot be tagged until the school runs its own randomized trial."],"answer":2,"diagnoses":["Ignores transfer. A solid finding in one population and task does not automatically hold for children learning a curriculum; you must tag the application separately.","Confuses valuing curiosity (legitimately [V]) with the causal claim that hooks improve learning, which is testable.","Correct. Tag the finding and its application separately. As Module 3 shows, later studies found the curiosity effect on unrelated material is small and can even reverse for school-like facts, which is exactly why the transfer step deserves its own tag.","Too strict. [H] exists for this case: act on the plausible bet, state a prediction, and check it with a practical measure. Waiting for a trial before doing anything would freeze the school."]}],"brief_prompt":"Save your one-page design as Brief v0. Under it, add two lists: (1) the assumptions about how children learn that you could not defend to a skeptic; (2) your three least-certain decisions. Then go through the page and tag every decision [E], [H] or [V], splitting compound decisions into parts first. Do not fix anything yet. Module 10 comes back to this page.","deeper":["books/01-how-learning-happens.md#Why it's in this curriculum (the question to read it with)","books/10-creating-the-schools-our-children-need.md#Introduction: the stance","books/04-productive-failure.md#Part I, Ch 1 — The Problems of Learning"]},{"id":"m1","num":1,"title":"How memory and attention actually work","level":"Minds","minutes":90,"sources":["00-foundational-papers","01-how-learning-happens","12-why-we-remember"],"hook":"One student rereads a chapter four times and feels confident. Another reads it once, then takes a hard quiz on it and gets much of it wrong. A week later, who remembers more, and which of them predicted they would?","attempt":{"prompt":"You have 50 minutes to teach 25 twelve-year-olds how to find the area of a trapezoid, and you want them to still be able to do it in June. Design the lesson minute by minute, and say what (if anything) happens in the following weeks. Write it before reading on. Afterwards, check: did you plan any retrieval of prior knowledge (area of a rectangle and triangle)? Any worked examples that fade into problems? Any return to the topic after today?","minutes":12},"objectives":["Explain why working memory is the binding constraint on instruction, name the load types, and say what counts as extraneous load in a real lesson.","Explain why long-term memory, organized as schemas, is what expertise is, and why that makes knowledge the precondition for 'skills'.","Predict which of two lesson or homework designs will produce more durable learning, using retrieval, spacing, interleaving and load arguments.","Distinguish performance during learning from learning itself, and explain why students and teachers systematically confuse them."],"ideas":[{"title":"The bottleneck: a tiny working memory in front of a vast long-term memory","tag":"E","body":"Everything in this course rests on one architectural fact. **Working memory**, the mental workspace where conscious thinking happens, can hold only a few new, interacting elements at once (Cowan's estimate is about four chunks; Sweller's is two to four interacting items) and loses them within seconds unless they are rehearsed. **Long-term memory** is, for practical purposes, unlimited. Kirschner and Hendrick's working definition of learning follows directly: **learning is a change in long-term memory.** If nothing has changed there, nothing has been learned, however busy the lesson looked.\n\nThe limit applies only to *new* information. Knowledge already organized in long-term memory can be pulled into working memory as a single chunk. That organized knowledge is a **schema**. This is why experts seem to have enormous working memories: they do not, they have better libraries. Chase and Simon (1973) showed chess masters recall real game positions far better than novices but lose most of their advantage on random positions. Chi, Feltovich and Glaser (1981) found physics experts sort problems by deep principle (conservation of energy, Newton's second law) while novices sort by surface features (inclined planes, springs). The difference is not general intelligence or a transferable reasoning skill. It is the amount and organization of domain knowledge.\n\nA software analogy helps, with care. Working memory is like a handful of CPU registers; long-term memory is disk; a schema is a compiled library you can call as one instruction instead of re-executing every line. Novices are interpreting everything line by line. Two limits to the analogy: human memory is reconstructive rather than bit-exact (see the fourth idea), and \"loading\" knowledge takes effortful, repeated processing, not a copy operation.\n\nThree consequences shape the whole school:\n\n- **Attention is the scarcest resource in the building.** Slides, worksheets, logins, noise, interruptions and poorly integrated diagrams all spend it. Ranganath adds that most everyday \"forgetting\" is really an **encoding failure**: attention was elsewhere when the information arrived.\n- **Knowledge is not the opposite of skills.** Critical thinking, problem solving and reading comprehension are made of domain knowledge. A school that promises \"skills over content\" is promising something the architecture cannot deliver.\n- **Automate the basics.** Letter-sound knowledge and number facts that run automatically free working memory for the thinking you actually care about.\n\nGeary's distinction explains why this matters so much for school specifically. **Biologically primary** knowledge (speaking a first language, recognizing faces, basic social reasoning) is acquired without instruction. **Biologically secondary** knowledge (reading, algebra, chemistry, history) is culturally recent, effortful, and usually needs explicit teaching and practice. \"Children learn to talk without lessons, so they can learn to read the same way\" fails for this reason. The primary/secondary boundary itself is a plausible theory with limited direct tests, so treat it as a strong heuristic, not a law."},{"title":"Cognitive load: design out the waste, keep the challenge","tag":"E","body":"Sweller's cognitive load theory turns the bottleneck into design rules. The key experiment (Sweller 1988) looked at how novices solve conventional problems: by **means-ends analysis**, holding the current state, the goal, the differences between them, and a stack of subgoals, all at once. That is an effective way to *solve* a problem and a poor way to *learn* from it, because it leaves no capacity to notice the problem's structure. Students can get answers right repeatedly and build no schema.\n\nThree kinds of load:\n\n- **Intrinsic load** comes from the material itself, set by **element interactivity**: how many elements must be processed together. Vocabulary pairs are low; solving a multi-step equation is high. Intrinsic load is relative to the learner: once elements are chunked, the same material becomes easy.\n- **Extraneous load** comes from poor design: a diagram with its labels in a separate legend (split attention), a teacher reading aloud the text that is also on the slide (redundancy), decorative clutter, or unguided search.\n- **Germane load** used to mean effort devoted to building schemas. The 2019 update (Sweller, van Merriënboer and Paas) folded it into intrinsic load, describing it as the working-memory resources allocated to the intrinsic task. Practical upshot: CLT no longer says \"add germane load\"; it says remove waste so capacity goes to the real content.\n\nThe effects that follow are among the best replicated in instructional research: the **worked example effect** (studying worked solutions beats solving equivalent problems, for novices), the **split-attention**, **redundancy** and **modality** effects (a diagram with spoken explanation beats a diagram with written text), and the **completion problem** effect. The most important qualifier is the **expertise reversal effect** (Kalyuga, Ayres, Chandler and Sweller 2003): supports that help novices become redundant or harmful for more expert learners, because the expert must reconcile the support with schemas they already have. Hence **guidance fading**: full worked examples, then completion problems, then independent problems.\n\nA useful product analogy: treat lesson materials like code under review. Extraneous load is unnecessary complexity that users pay for on every run. A school can run a **materials design review** for split attention, redundancy and clutter the way an engineering team runs code review [E for the effects; H that the review process improves outcomes at scale].\n\n**Honest limits.** Load is mostly measured with a single self-report item, which critics (de Jong 2010) argue makes the theory hard to falsify: success means extraneous load fell, failure means intrinsic load was too high. Many classic studies are short, lab-like, and in well-structured domains such as maths and physics; evidence for writing, history interpretation and design is thinner. Split-attention and modality effects shrink outside the lab. CLT also largely ignores motivation, which later modules add back.\n\nTwo misreadings to avoid: **CLT does not mean \"make it easy\"** (it means remove waste so the effort goes to the intrinsic challenge), and **it does not mean lecture** (long uninterrupted talk violates its own principles)."},{"title":"Learning is not performance: retrieval, spacing and interleaving","tag":"E","body":"The most practically important finding in this module is also the most counterintuitive: **the conditions that make performance look good during learning often make long-term retention worse, and vice versa.** Soderstrom and Bjork (2015) call this the learning-versus-performance distinction; Bjork's term for the helpful kind of struggle is **desirable difficulties**.\n\n**Retrieval practice (the testing effect).** Recalling information strengthens it more than restudying it. In Roediger and Karpicke's (2006) studies, students who took recall tests on a passage retained more at a one-week delay than students who spent the same time rereading, even though the rereaders felt more confident and predicted they would do better. Testing, done this way, is a learning event, not only a measurement.\n\n**Spacing.** The same amount of practice spread over days and weeks produces better retention than the same practice massed together (Cepeda and colleagues' 2006 review of the spacing literature is the standard reference). Some forgetting between sessions is not a failure; it is what makes the next retrieval effortful and therefore durable.\n\n**Interleaving.** Mixing problem types in a practice set, rather than doing twenty of one type then twenty of the next, feels harder and lowers in-session scores, but improves later performance because students must learn to *choose* the method, not just execute it (Rohrer and Taylor 2007).\n\nDunlosky and colleagues' (2013) review of ten study techniques rated only two as **high utility**: practice testing and distributed practice. Elaborative interrogation, self-explanation and interleaving were **moderate**. Summarizing, highlighting, the keyword mnemonic, imagery for text and **rereading were low**. Students overwhelmingly use the low-utility ones, because they produce fluency.\n\nRanganath's memory research supplies the mechanism behind that illusion. **Familiarity and recollection are different processes.** Rereading and highlighting build a feeling of knowing (familiarity) without building the ability to retrieve the content on demand (recollection). Recognition-format tests like multiple choice can be passed on familiarity; recall and application cannot.\n\nThis is the vanity-metric problem from product work. In-lesson success, student satisfaction and a smooth-looking lesson are easy to observe and move in the wrong direction under the best techniques. A school that evaluates teaching by how lessons *look* will drift toward massed, blocked, reread, easy practice.\n\n**Make it structural, not optional.** Individual teachers under time pressure will not reliably add spacing and retrieval on their own. Build them into the institution: daily low-stakes review at lesson start, weekly and monthly cumulative quizzes, interleaved homework drawn from earlier weeks, cumulative end-of-year assessment, a school-wide revision calendar, and explicit teaching of these techniques to students, who will not adopt them unprompted [E].\n\n**The lethal mutation to watch for.** \"Retrieval practice\" easily becomes weekly high-stakes tests that students cram for. That removes the active ingredient (low-stakes, effortful, spaced recall with feedback) and keeps only the label. And a difficulty is only desirable if the learner can respond to it successfully: impossible tasks produce failure, not learning."},{"title":"Memory is reconstructive, error-driven, and built for the future","tag":"E","body":"Ranganath's *Why We Remember* reframes memory in a way that changes how you design a school day. Memory is not an archive of the past; it is a tool for predicting and acting in the future. So **forgetting is the default and it is adaptive**: keeping every detail would clog retrieval and prevent generalization. The brain keeps what signals likely future value: what was attended to, what connected to existing knowledge, what was tagged by curiosity, surprise or emotion, and what was retrieved and used again. A school's job, mechanically, is to override forgetting for the things that matter through spaced, meaningful use.\n\n**Memory is reconstructive.** Bartlett's (1932) \"War of the Ghosts\" study showed people retelling an unfamiliar folk tale shortened it and bent it toward their own cultural expectations. Schemas are both the engine of learning (new knowledge attaches to what is there) and a source of distortion (new knowledge gets bent to fit). Expect students to \"remember\" a plausible but wrong version, and design assessment items that detect it.\n\n**Retrieval changes the memory.** Recalling something reactivates it and it is stored again, updated. The strong neuroscience version (reconsolidation) is well established in animals and contested in humans, but the practical rule does not depend on it: **pair retrieval with prompt correction.** Repeatedly retrieving a wrong answer without feedback strengthens the error.\n\n**Errors followed by correction are learning events.** Attempting an answer before studying improves later memory even when the guess is wrong (Kornell, Hays and Bjork 2009). Confidently held errors are corrected especially well once feedback arrives (hypercorrection; Butterfield and Metcalfe 2001). This is the memory-level mechanism under pretests, prediction prompts and productive failure (Module 4), with a hard boundary: it works for brief attempts with fast feedback, not for long unguided struggle.\n\n**Context binds memory.** Divers who learned word lists underwater recalled them better underwater (Godden and Baddeley 1975). Knowledge practiced in only one context tends to stay there. Varying problem framings, formats and settings makes knowledge more portable; mentally reinstating a context (\"remember the pendulum lab\") is a legitimate retrieval cue. Real-world context effects are usually modest.\n\n**Emotion is a spotlight, not glue.** Arousal prioritizes what is central to the emotional event, often at the cost of peripheral detail. A dramatic demonstration can leave students remembering the explosion and not the chemistry, so make the charged element the concept itself. Chronic stress and threat impair flexible learning, which makes psychological safety part of the memory infrastructure.\n\n**Remembering is social.** Groups recalling together often produce less than the same people recalling separately (collaborative inhibition), and one person's error can spread to others (social contagion of memory). The design rule is simple: **individual retrieval first, then share**, and the teacher checks what the group converged on.\n\nEvidence note: the behavioral findings here (testing effect, spacing, schema effects, reconstructive memory, generation-before-feedback, collaborative inhibition) are robust. The brain-region explanations add a mechanism but rarely a new prescription. Ranganath is a lab scientist, not an education researcher; his classroom asides are hypotheses to test."},{"title":"What students think about is what they remember, and the myths that distract you","tag":"E","body":"Willingham's line, used throughout Kirschner and Hendrick, is that **memory is the residue of thought**. Students remember what they spent their thinking on. Craik and Lockhart's (1972) levels-of-processing framework and Craik and Tulving's (1975) experiments made the point: words judged for meaning were recalled far better than words judged for their letters or sound. The design test for any task is therefore brutally simple: **what will students actually be thinking about?** A poster on photosynthesis may be an hour of thinking about fonts and layout. A \"fun\" simulation may be an hour of thinking about the controls. (The framework has a known weakness: \"depth\" is hard to define independently of the memory it predicts, and transfer-appropriate processing shows the best encoding depends on how the memory will later be used.)\n\n**Dual coding is real; learning styles are not.** Paivio's dual coding theory and Mayer's multimedia principles show that well-designed combinations of words and visuals help *all* learners: words plus pictures beat words alone, labels belong next to the thing they label, narration beats on-screen text for animations, and decoration hurts. That is completely different from the **meshing hypothesis**, the idea that matching instruction to a student's preferred style (visual, auditory, kinesthetic) improves learning. Pashler, McDaniel, Rohrer and Bjork (2008) specified the experimental design needed to show meshing and found almost no studies that used it; the few that did contradicted it. People have preferences; teaching to them does not help. **Choose the mode by the content** (a map for geography, a spoken story for narrative), not by the learner.\n\n**Media are delivery trucks, not nutrition.** Clark's (1983) review argued that learning gains attributed to a medium (television, computers, tablets) came from the instructional method, novelty or better materials that came with it. Kozma countered that some media afford unique methods, such as simulations; Clark replied that the method is what matters. For a founder this becomes a procurement rule: **every technology purchase must name the instructional mechanism it enables** (spaced retrieval, adaptive practice, immediate feedback) and a plausible effect size. \"Engaging\" is not a mechanism. This matters doubly for AI tutors: Bloom's famous \"2 sigma\" result for one-to-one tutoring with mastery learning came from small, short studies with closely aligned tests; modern meta-analyses of high-dosage tutoring find large but much smaller effects (roughly 0.3-0.4 SD, Nickow, Oreopoulos and Quan 2020). Hold vendors to real numbers.\n\n**Metacognition is domain-bound.** Knowing what you know requires knowing the domain. Novices are badly calibrated: they mistake fluency for mastery. So \"learning to learn\" courses taught in isolation transfer poorly. Teach study strategies inside subjects and give students objective calibration evidence (a low-stakes quiz) instead of asking \"does everyone understand?\"\n\n**A myth firewall.** Kirschner and Hendrick recommend an explicit institutional list of debunked ideas, used in hiring, training, procurement and parent communication: learning styles, the \"learning pyramid\" percentages (fabricated), digital natives who multitask well, left-brain/right-brain learners, and \"you can just look it up.\" [E that the myths are false; V to make rejecting them a hiring criterion.]"}],"worked_example":{"title":"Decision: how should homework work in this school?","steps":["Start from purpose. New learning should happen with a teacher present, where misconceptions can be caught. The purpose of homework is therefore retention, so its mechanism must be retrieval, not rereading or copying notes.","Apply spacing. Retention benefits most when practice returns to material after some forgetting. So homework should mostly cover material from one to three weeks ago, not today's lesson.","Apply interleaving. Mixed problem sets force students to choose methods and improve later performance, even though they feel harder and lower in-session scores (Rohrer and Taylor 2007). So homework sets are mixed, never 20 of one type.","Apply cognitive load. Without a teacher, a novel problem type becomes unguided search, which builds little. So homework excludes new problem types; everything in it has been taught and practised in class.","Apply error correction. Retrieving a wrong answer without feedback strengthens the error; feedback right after an attempt makes the correction stick. So homework must be self-checking (answers available after the attempt), and the next lesson opens with a short review of the most-missed items.","Write the policy and tag it: 'Homework is a short, self-checking, mixed retrieval set drawn from the last three weeks. New material never appears in homework. Most-missed items are re-taught at the start of the next lesson.' Mechanisms [E]. The 20-minute length and three-week window [H], with a prediction: cumulative quiz scores on older topics rise over the first term compared with the previous year's cohort or a pilot class."]},"hinge":[{"q":"A teacher explains a new concept using a slide with a diagram and a paragraph of text, which she reads aloud. Which change most reduces extraneous load?","options":["Remove the diagram so students can focus on the words.","Remove the on-screen paragraph and keep the diagram while she explains aloud.","Give students the slide to read silently first, then explain it.","Add a second worked example to the same slide."],"answer":1,"diagnoses":["Believes fewer channels are always better; misses the modality effect. A diagram with spoken explanation uses both channels well.","Correct. Reading text while hearing the same text read aloud is redundancy, pure extraneous load. Diagram plus narration uses the visual and auditory channels without duplication.","Believes pre-exposure reduces load. It keeps the redundancy and splits attention across time.","Conflates more examples with less load. Crowding the slide adds extraneous load; a second example belongs on its own, after the first is understood."]},{"q":"Two Year 9 classes learn the same 12 topics over a term. Class A studies each topic in one block of three lessons. Class B returns to each topic every few weeks. On an end-of-term test, which result is most likely?","options":["Class A scores higher, because uninterrupted focus builds deeper understanding.","Class B scores higher, even though its students felt they were learning less during the term.","They score about the same, because total practice time is equal.","Class B scores higher only on the topics it saw most recently."],"answer":1,"diagnoses":["The fluency illusion: blocked practice feels productive and looks good in the moment but produces weaker retention.","Correct. Spacing and interleaving produce better retention despite feeling harder; the gap between how learning feels and how well it lasts is the central point.","Treats time-on-task as the only variable; ignores how practice is distributed, which is one of the most robust effects in the field.","A recency-only model of memory. Spacing benefits all revisited topics, because each return strengthens retrieval."]},{"q":"A student says: \"I understand it when you explain it, but I can't do it on the test.\" What is the most likely mechanism?","options":["Test anxiety.","Her learning style does not match the test format.","Following an explanation loads working memory far less than generating a solution; she has not yet built and practised the schema that lets her generate one.","She has not memorized enough facts."],"answer":2,"diagnoses":["Reaches for an affective explanation first. Anxiety is possible, but it is not the default mechanism and it would not explain why she can follow but not produce.","The learning-styles myth. Matching instruction to preferred style has no adequate evidence.","Correct. Recognizing a solution is not the same as producing one. The fix is guided practice, worked examples fading into problems, and spaced retrieval until she can generate it.","Partly right at the wrong level. Knowledge matters, but as organized schemas that can be retrieved and applied, not as a list of facts."]},{"q":"A department runs a weekly low-stakes quiz but returns marked answers two weeks later. What single change would most improve its effect on learning?","options":["Make the quiz count toward grades so students take it seriously.","Give the correct answers immediately after students attempt each quiz.","Replace the quiz with a rereading session of the week's notes.","Make the quiz shorter so students are less stressed."],"answer":1,"diagnoses":["Raising stakes invites cramming and anxiety and turns retrieval practice into a high-stakes test, a classic lethal mutation.","Correct. Retrieval followed promptly by feedback lets the corrected version be what is stored; retrieving errors without feedback can strengthen them, and confident errors are the most correctable when feedback is fast.","Swaps a high-utility technique for a low-utility one that builds familiarity rather than retrievable knowledge.","Length is not the problem; the delay in feedback is. Low stakes already limit stress."]},{"q":"A teacher proposes podcasts for 'auditory learners' and diagrams for 'visual learners'. What is the best response?","options":["Good idea: matching mode to style improves learning.","Use words and well-designed visuals together for everyone, and choose the mode by what the content needs, not by the student's preference.","Use only text, because multimedia increases load.","Let students pick whichever format they enjoy most, since enjoyment drives learning."],"answer":1,"diagnoses":["The meshing hypothesis. Pashler et al. (2008) found no adequate evidence for it.","Correct. This is dual coding: combining words and visuals helps all learners when designed well. Mode should follow content.","Over-applies load theory. Well-integrated words and visuals reduce load; only redundant or split-attention designs increase it.","Enjoyment and preference are poor proxies for learning; learners often prefer the methods from which they learn least."]}],"brief_prompt":"Rewrite the Tuesday in February for your 12-year-old so that it contains: explicit retrieval of earlier material at the start of lessons, at least one worked-example sequence that fades into independent problems, and a spacing policy (what returns, when). Add a homework policy using the worked example as a model. Add one line stating the school's position on cognitive load and one on the myth firewall. Tag each claim, and for every [H] write a prediction and how you would check it.","deeper":["books/00-foundational-papers.md#1. Sweller — Cognitive Load Theory (1988; 1998; 2019)","books/01-how-learning-happens.md#Ch 7 — Take a load off me (cognitive load theory)","books/01-how-learning-happens.md#Ch 26 — Learning techniques that really work","books/01-how-learning-happens.md#Ch 31 — Did you hear the one about the kinaesthetic learner...?","books/12-why-we-remember.md#Ch 8 — Press Play and Record (reconsolidation, malleability, retrieval)","books/12-why-we-remember.md#Ch 9 — Some Pain, More Gain (errorful learning)"]},{"id":"m2","num":2,"title":"Why learners are not blank slates: intuitive theories and conceptual change","level":"Minds","minutes":90,"sources":["02-scienceblind","13-learning-scientific-concepts","00-foundational-papers"],"hook":"College-educated adults are asked to judge statements as true or false as fast as they can. 'The moon has gravity' and 'air is made of matter' are both true. Are they answered as quickly and accurately as statements like 'rocks are made of matter'? And what happens to biology professors asked, under time pressure, whether a tree is alive?","attempt":{"prompt":"A 9-year-old insists that a thick wool sweater 'makes heat'; that is why you feel warm in it. Design a 15-minute intervention to change her mind. Then predict, honestly, what she will say if you ask her about sweaters a month later. Write both before reading on.","minutes":12},"objectives":["Explain why misconceptions are coherent intuitive theories rather than gaps, and why telling the right answer rarely fixes them.","Distinguish 'can repeat the explanation' from 'the model has changed', and write a generative question that tells them apart.","Classify a misconception by the kind of change it needs (belief revision, model transformation, differentiation, coalescence, ontological shift) and say what teaching each needs.","Apply Posner's four conditions, and their known limits, to design a conceptual-change sequence that spirals across years."],"ideas":[{"title":"Misconceptions are theories, not gaps","tag":"E","body":"Cognitive load theory treats prior knowledge mostly as an asset: schemas make new learning easier. Shtulman's *Scienceblind* is the necessary counterweight. **Some prior knowledge is a competing theory**, and adding correct information to it does not replace it.\n\nLong before school, children build **intuitive theories** of how the world works: coherent, causal, predictive frameworks built from everyday perception. They are not random errors. They work well enough in daily life, which is exactly why nothing pushes children to revise them. Shtulman walks through twelve domains (matter, energy, gravity, motion, cosmos, earth, life, growth, inheritance, illness, adaptation, ancestry). A few examples:\n\n- **Motion (impetus).** Pushing an object gives it an internal force that carries it forward and gradually runs out. McCloskey, Caramazza and Green (1980) found college students, many of whom had taken physics, predicted that a ball leaving a spiral tube would keep curving. Clement (1982) found engineering students who had passed mechanics saying a force pushes a tossed coin upward while it rises.\n- **Energy.** Heat, cold and sound are substances that flow, get trapped and get used up. Heat and temperature are the same thing.\n- **Cosmos.** Seasons happen because the earth is closer to the sun in summer. In the documentary *A Private Universe*, many Harvard graduates and faculty gave exactly that explanation.\n- **Growth.** A plant's mass comes from the soil. (It comes mostly from carbon dioxide in the air.)\n- **Adaptation.** Evolution happens because a whole population *needs* to change, and changes acquired in life are passed on.\n\nA striking feature: **children's theories often match earlier scientific theories**. Impetus physics was held by medieval natural philosophers; caloric theory treated heat as a fluid; vitalism, Lamarckian inheritance and fixed species essences were serious positions. The seventeenth-century Florentine experimenters themselves failed to separate heat from temperature (Wiser and Carey 1983). So the problem is not childish thinking. These ideas are genuinely hard to reach without special tools and data, which also gives teachers a respectful way to discuss them: \"serious scientists once thought this too.\"\n\nThe consequence for teaching is that **learning science is theory change, not fact accumulation**. New facts get absorbed into the old framework unless the framework itself is challenged. The Force Concept Inventory (Hestenes, Wells and Swackhamer 1992) made this measurable: traditional lecture courses produced small gains on conceptual items even when students could solve textbook problems, and Hake (1998), comparing about 6,000 students, found interactive-engagement courses roughly doubled the normalized gains.\n\nA product analogy: an intuitive theory is like a legacy system that works fine for everyday workloads. You cannot just add a new feature on top; the new module gets wrapped by the old architecture and quietly inherits its assumptions. Migration needs a plan.\n\nTwo caveats. The descriptive evidence (which misconceptions exist, how common they are, how they survive lectures) is among the most replicated in education research. The evidence on *what fixes them* is much thinner: mostly small, short trials, none at school scale over years. And Shtulman covers physical and life sciences; the same mechanisms plausibly apply in mathematics (\"multiplication makes bigger\"), history and economics, but that is extrapolation."},{"title":"Suppressed, never deleted: can repeat versus model changed","tag":"E","body":"The signature finding of *Scienceblind* is that intuitive theories are not erased by learning science. They are **suppressed**, and the scientific theory has to out-compete them every time it is used.\n\nShtulman and Valcarcel (2012) had about 150 college-educated adults verify about 200 statements as quickly as possible. Statements where intuition and science **conflict** (\"the moon has gravity\", \"air is made of matter\", where intuition says no) were answered more slowly and less accurately than statements where they agree, across all ten domains tested. Older adults show the same conflict cost decades after school (Shtulman and Harrington 2016). Under time pressure, **biology professors** were slower and less accurate at classifying plants as alive (Goldberg and Thompson-Schill 2009), and **professional physical scientists** endorsed unwarranted purpose-based explanations such as \"trees produce oxygen so that animals can breathe\" more often when rushed (Kelemen, Rottman and Seston 2013). Neuroimaging work suggests experts recruit inhibitory control when evaluating intuitive-but-wrong physics. (Caveats: effects are in reaction time and accuracy on a lab task; \"persistence\" is an interpretation; the imaging samples are small.)\n\nSo **mastery has two layers**: (1) the student can produce the correct explanation; (2) the correct model reliably wins when intuition competes. Most tests measure only the first.\n\nVosniadou and Brewer (1992) showed what telling alone produces. Children in grades 1, 3 and 5 answered **generative questions** that memorized facts cannot answer (\"If you walked in a straight line for many days, where would you end up? Is there an edge to the earth?\") and made drawings and clay models. Many held consistent **synthetic models**: a **dual earth** (a flat one we live on plus a round one in the sky), a **hollow sphere** (people live on a flat floor inside a ball), a **flattened sphere**. Each is a logical compromise between the adult statement \"the earth is round\" and unrevised presuppositions: the ground is flat, down is an absolute direction. The child who says \"the earth is round\" on a test may believe we live inside a bowl.\n\nThis finding has a real critique. Nobes, Siegal, Panagiotaki and colleagues found that with forced-choice tasks and ready-made 3D models, many young children picked the scientific sphere, and their knowledge looked fragmented rather than coherent. The debate is partly about what counts as knowing. What both sides accept is the part that matters for a founder: **instruction can produce hybrids that pass surface tests while resting on an unchanged framework.**\n\nShtulman's contrast table is the practical tool:\n\n- Familiar question (\"What causes seasons?\"): both the student who *can repeat* and the student whose *model changed* answer correctly.\n- Novel transfer question (\"Why is it summer in Australia in December?\"): only the second derives it.\n- Prediction before a demonstration, answering under time pressure, and a delayed test months later all separate the two.\n\n**Good diagnostic questions** are generative (about a situation not directly taught), make wrong answers diagnostic (each distractor maps to a known intuitive theory, as in concept inventories), require prediction before observation, ask for mechanism rather than a label, and include conflict items where intuition and science disagree. This is exactly the design of the hinge questions you are answering in this course."},{"title":"Not all misconceptions are the same kind of problem","tag":"E","body":"Treating every wrong idea the same way wastes teaching time. Chi (2008) distinguishes three kinds of change, by how the learner's prior knowledge is structured:\n\n1. **Belief revision.** A single false belief (\"the heart oxygenates blood\") is contradicted and replaced. Relatively easy: refutation texts, explicit correction and self-explanation work.\n2. **Mental model transformation.** A set of interrelated beliefs forms a flawed but coherent model, such as a single-loop model of circulation. Change needs a sequence of revisions or a whole-model shift, supported by students explaining the model to themselves as they repair it.\n3. **Categorical (ontological) shift.** The hardest case. The concept is placed in the **wrong category of thing**. Students treat heat, electric current, light and diffusion as **substances** that flow and get stored, when they are **emergent processes**: patterns produced by many agents interacting with no central control. Because category membership decides which properties the mind can even attribute, no quantity of facts fixes it. The learner must first learn the new category (what emergent processes are like: traffic jams, diffusion, markets, natural selection in a population) and then recognize the concept belongs there. Slotta and Chi (2006) found teaching the emergent-process category first improved later physics learning, in small studies.\n\nShtulman and Carey describe the same terrain in structural terms. Some concepts need **differentiation**: one undifferentiated concept splits into two (heat versus temperature; weight versus density). Some need **coalescence**: separate concepts merge (plants and animals into \"living things\"). Some need **reanalysis** into a new ontology (heat as process; species as variable populations rather than fixed essences).\n\nCarey adds a harder claim: some scientific concepts **cannot be defined from the learner's existing concepts at all**. They must be **bootstrapped**. Learners first acquire an external **placeholder structure** whose meaning they do not yet grasp (the count list, a formula such as density = mass/volume, a particle diagram) and then fill it with meaning through modelling, analogy, limiting cases and thought experiments. Symbols come first; meaning follows. This is why \"explain it clearly\" is not a plan for some concepts. The curriculum has to design both the placeholder and the meaning-making activities that fill it.\n\nThe categorical-shift account is contested. Gupta, Hammer and Redish (2010) argue that experts often reason productively about energy and current *as if* they were substances, and that learners' ontologies shift with context; on this view, the goal is flexibility, not a ban on substance talk. Evidence for teaching the emergent-process category is promising but small-scale.\n\n**What a founder does with this.** For each subject, keep a **hard concepts register**: the handful of load-bearing concepts that are known to be hard (force and motion, heat and temperature, density, fractions as numbers, natural selection, equilibrium), the misconception type for each, the presuppositions behind it, and a multi-year progression [H]. A single false belief can be fixed in a lesson with feedback. A category error needs dedicated, cross-subject work on the category, repeated over years. Planning both the same way guarantees one of them is mis-planned."},{"title":"How change actually happens: dissatisfaction plus a better mechanism","tag":"E","body":"Posner, Strike, Hewson and Gertzog (1982) gave science education its classic model. Modelled on paradigm shifts in the history of science, it says a learner **accommodates** (restructures) rather than **assimilates** (absorbs into the old structure) only when four conditions hold:\n\n1. **Dissatisfaction** with the current conception: it fails on something the learner cares about.\n2. The new conception is **intelligible**: the learner can build a representation of what it says.\n3. It is **plausible**: it looks as if it could be true and fits other beliefs.\n4. It is **fruitful**: it resolves the anomaly and predicts more than the old view.\n\nThis produced the **cognitive conflict** strategy: elicit a prediction, confront it with a discrepant event, introduce the scientific idea as the resolution. It is still a good checklist for any explanation of a hard concept.\n\nIts limits are just as important, and the authors named some themselves. Strike and Posner (1992) concluded the original was too rational and too cold; many misconceptions are fragmentary or formed on the spot rather than well-articulated theories. Pintrich, Marx and Boyle (1993) argued that motivation and classroom context decide whether conflict leads anywhere. Chinn and Brewer (1993) listed seven ways people respond to anomalous data, only one of which is changing their theory; the others include ignoring it, rejecting it, holding it in abeyance and reinterpreting it. That is why your sweater demonstration in the attempt probably fails: a thermometer that stays cold inside a sweater gets assimilated (\"the heat takes a while to come out\").\n\nWhat works better, per Shtulman, is **mechanism**. Teaching *how* something works shifts reasoning more than teaching the conclusion or a rule:\n\n- Au and colleagues (2008) taught children that **germs are living things that reproduce**; this improved their reasoning and hygiene behaviour more than teaching rules such as \"wash your hands.\"\n- Ranney and Clark (2016) found very few US adults could explain the greenhouse mechanism, and a short mechanistic explanation increased acceptance of human-caused warming across the political spectrum.\n- Slaughter and Lyons (2003) taught preschoolers a simple body-as-machine model (organs keep you alive), which improved their understanding of death.\n- Kelemen and colleagues (2014) used a picture storybook to teach 5-8-year-olds variation-plus-selection natural selection; children generalized it to new animals and retained it months later.\n\nThree design moves follow. **Predict, observe, explain**: get a committed prediction before any demonstration, because a confident wrong prediction followed by correction is a strong learning event (Module 1's hypercorrection). **Bridging analogies** (Clement): chain from a case where intuition is right (a spring pushes back) to the target (a table pushes up on a book). **Start early and spiral**: some mechanisms can be taught to young children before contrary intuitions entrench, and because the old theory resurfaces, core concepts must return across years with harder diagnostics each time rather than being \"covered\" once.\n\nPosner's first condition and curiosity (Module 3) are close relatives: a well-built anomaly opens an information gap the learner wants closed. Conceptual change is also expensive in working memory (holding two models and the conflict between them), which is a load-theory argument for **explicit, well-scaffolded** conceptual change, not open discovery."},{"title":"Pieces, levels and the external half of a concept","tag":"H","body":"There is a forty-year argument underneath this module. The **theory-change** camp (Carey, Vosniadou, Chi, Posner, Shtulman) holds that intuitive knowledge is organized into coherent theories that must be restructured. The **knowledge-in-pieces** camp (diSessa, Hammer, Minstrell) holds that intuitive physics is many small, self-explanatory fragments called **p-prims** (\"more effort gives more result\", \"things die away\", \"balancing\"), cued by context, often correct in their home context and wrong only when misapplied. On this view there is nothing coherent to replace; learning means **reorganizing and refining** pieces into a concept that works reliably across situations. diSessa and Sherin call such a concept a **coordination class** and ask about its **span** (does it work across contexts?) and **alignment** (does it read out the same thing everywhere?). Evidence for pieces: students give inconsistent answers to problems that are identical in physics but look different on the surface. A third camp, **situated, embodied and distributed** cognition (Hutchins, conceptual metaphor theory), says concepts live partly in the body, in language, in tools and in social practice.\n\nAmin's *Learning Scientific Concepts* (2025) argues these are not rivals but descriptions at **different levels of analysis**, and builds a Unified Theory of Conceptual Change on Carey's account of concepts and Hutchins' multilevel method. One way to read the levels (a reconstruction, not Amin's text): moment-to-moment activation of pieces and metaphors; individual restructuring over weeks and years; placeholder structures carried by tools, representations and talk; and the discipline's own concepts built over centuries. **This synthesis is theoretical.** It has no effect sizes; treat it as a lens, tagged [H].\n\nThe lens still earns its place, because it produces concrete design choices:\n\n- **A concept lives partly outside the head.** Energy bar charts, force diagrams, particle models and the words teachers use carry the scientific concept before students internalize it. So **standardize representations and vocabulary across grades** (one energy representation, one force-diagram convention, \"energy is transferred\" rather than \"heat flows\"), and audit materials for misleading metaphors [H].\n- **Intuitions are raw material as well as obstacles.** Recruit productive intuitions deliberately (bridging analogies) rather than only refuting.\n- **Test span, not one right answer.** Probe the same concept in several contexts, pre and post, with validated inventories where they exist (the FCI in physics) [E].\n- **Expect hybrid states and budget time for them.** Pacing guides should allow returns to core concepts, and formative grading should not punish intermediate models [H].\n- **Different concepts are learned differently.** Force may be mostly an ontological restructuring of an intuitive concept; energy may be more a matter of bootstrapping a new abstract quantity through representation. No single misconception-busting method fits all.\n\nOne more distinction from Shtulman belongs here because it becomes a policy: **understanding and acceptance are different variables.** Shtulman (2006) found most adults, including many who accepted evolution and had studied biology, reasoned **transformationally** (the population changes because it needs to) rather than **variationally** (individuals vary; those with advantageous heritable variants leave more offspring). Acceptance was barely related to understanding. So a school can assess whether students reason correctly with the evolutionary or climate model while never requiring them to profess belief [E that the variables differ; V for the policy]."}],"worked_example":{"title":"Decision: how does the science curriculum handle the hard concepts?","steps":["Identify the intuitive theory each hard concept meets, using the known catalogue (impetus, heat as substance, flat or synthetic earth, seasons by distance, weight and density merged, plant mass from soil, essentialist inheritance, transformational evolution). Write one cheap diagnostic question per concept, for example: 'A 1 g seed grows into a 500 kg tree. Where did the 500 kg come from?'","Classify the change each needs: belief revision, model transformation, differentiation, coalescence or ontological shift. This decides the teaching. Heat needs the emergent-process category taught first; seasons needs a model transformation with a physical model and tilt.","Map prerequisites across subjects. Photosynthesis needs 'gases are matter and have mass' and a particle model first; natural selection needs within-species variation first. A school that teaches photosynthesis before students accept that air has mass is building on sand.","Design each first encounter as predict, observe, explain: a committed prediction, an anomaly that fails visibly (and repeatedly, not once), then an explicit, intelligible mechanism in more than one representation, connected to something students already accept, and shown to predict something new (Posner's four conditions).","Standardize the representations and vocabulary used for each concept across grades, so each year builds on the last instead of re-teaching a new notation.","Schedule returns. Because the intuitive theory is suppressed rather than deleted, each concept reappears in at least two later years with harder, generative diagnostics and a delayed re-test. 'Mastered' means success on novel prediction and transfer items and on a delayed re-test, not recall of the explanation.","Resulting policy: a core-concepts spiral of roughly 15 concepts, each with a documented intuitive theory, change type, diagnostic question, canonical anomaly, representation standard and three-year revisit schedule. Tags: mechanism [E]; the count and the schedule [H]; the definition of mastery [V] informed by [E]."]},"hinge":[{"q":"A student correctly answers 'the earth is round' on a test. Which follow-up best reveals whether they hold a scientific model?","options":["Ask them to explain why the earth is round.","Ask where people live on the earth and where the sky is, and have them draw it; ask what would happen if they walked in a straight line for many days.","Ask a harder question about gravity.","Accept the answer; the misconception is fixed."],"answer":1,"diagnoses":["Believes verbal explanation reveals the model. Students reproduce taught phrases; a correct sentence is compatible with a synthetic model.","Correct. Generative questions and drawings cannot be answered from a memorized sentence, so they surface hollow-sphere or dual-earth models (Vosniadou and Brewer 1992).","Assumes understanding progresses by difficulty rather than by model coherence. A harder question may just produce a different memorized answer.","The belief-equals-model confusion: 'can repeat' is taken as 'model changed'."]},{"q":"Which misconception does Chi's framework predict will be hardest to change by demonstration and explanation alone?","options":["Heavier objects fall faster.","Heat is a substance that flows into cold things.","Plants get their mass from the soil.","Seasons are caused by the earth's distance from the sun."],"answer":1,"diagnoses":["Robust, but the concept stays in the right category (motion of objects); demonstrations plus explanation can work, especially with committed predictions.","Correct. It is a categorical error: a process treated as a substance. Demonstrations get assimilated into the substance theory, so the emergent-process category has to be taught.","A factual and model error (where the mass comes from) that needs prerequisite knowledge (gases have mass), not a category shift.","Common and sticky, but a mental-model problem (tilt and angle of sunlight), not an ontological one."]},{"q":"A school teaches evolution in Year 8 and most students give the scientific view on the end-of-unit test. Two years later most give need-based, purpose-based explanations again. What is the best institutional response?","options":["Teach it later, when students are more mature.","Teach it m
