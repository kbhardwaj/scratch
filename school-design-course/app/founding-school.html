ge-building ELA curriculum across K-5 with a separate systematic phonics track in K-2. The ELA units are sequenced (grade 1 studies the human body and early civilizations; grade 2 the War of 1812 and insects) and texts cluster around each topic. Materials cost $38,000, plus four days of training. Seven of the twelve teachers push back. Most come from a balanced-literacy district. They love their leveled classroom libraries and their weekly \"skill of the week\" mini-lessons (main idea, inference, author's purpose) taught on short unrelated passages. They say a common program will \"kill their creativity and the kids' love of reading.\" Two say privately they will leave if it is imposed. A parent on your founding council forwards an op-ed arguing that \"reading is a skill, not a subject.\" The first state reading test, in grade 3, is eighteen months away. Dana says a partial adoption is worse than none.","tension":"t04","question":"Do you adopt the common curriculum, let teachers choose, or compromise? Which two authors are arguing in your head?","considerations":["What does the evidence say about topic knowledge, decoding and strategy instruction as drivers of comprehension?","Which layer of the literacy program is a mechanism to standardize, and which is open to teacher and community choice?","What can you honestly promise the board about grade-3 scores in eighteen months?","What do teachers mean by \"creativity\", and which part of it can survive a common spine?","Adoption is not implementation. What support makes the curriculum actually get taught?"],"model_answer":"**Tension:** t04 (Standardization and fidelity vs community co-design); also t02 (Knowledge-rich curriculum vs curiosity and inquiry).\n\nAdopt the common spine. Be explicit about what is tight and what is loose, and invest in making it work rather than in winning the argument.\n\nThe evidence is lopsided on the mechanism. Comprehension of a text depends heavily on knowing its topic (Recht & Leslie) [E]. Systematic phonics is necessary for most children [E]. Strategy instruction gives quick gains that stop growing with more practice, so weekly skill-of-the-week lessons crowd out knowledge (`06-beyond-the-science-of-reading`, `01-how-learning-happens`) [E]. Knowledge compounds only when topics are sequenced across grades. Teacher-by-teacher choice destroys that compounding (`10-creating-the-schools-our-children-need`) [E for the mechanism]. That a whole-school spine yields large gains on general reading tests is [H], and effects on distal tests often lag two to three years. Say that to the board now, not in eighteen months.\n\nTension t04 says: standardize the mechanisms and the knowledge sequence; codesign the rest. So state the tight layer (unit sequence, text sets, phonics scope and sequence, daily content-embedded writing) and the loose layer (how teachers run discussion, read-aloud extensions, classroom routines). Keep the classroom libraries for independent choice reading, but stop using levels to ration which content a child meets (`06`) [E]. On t02, curiosity is protected by norms such as question journals and time to follow up, not by content-free time [H]. That speaks directly to the \"love of reading\" worry.\n\nImplementation is where adoptions die (`06`, SRI observations). Fund curriculum-specific coaching, not just four launch days, and have the TLCs work on hinge questions for the new units (`07-embedding-formative-assessment`) [H]. Measure robust comprehension in observation, knowledge on curriculum-embedded checks, and decoding on a screener three times a year.\n\nIf two teachers leave, you accept the cost. The shared rich curriculum is an equity commitment: every child gets the same content whatever they bring from home [V]. Name that in the register, along with who disagrees and why.\n\n**What a novice would do wrong:** Let each teacher choose, calling it professional autonomy, and lose coherence. Or impose the program by memo and treat purchase as implementation. Or layer the new curriculum on top of the old skills block, doubling the load and teaching neither well.","sources":["06-beyond-the-science-of-reading","10-creating-the-schools-our-children-need","01-how-learning-happens","07-embedding-formative-assessment","03-intellectual-lives-of-children"]},{"id":"k03","title":"The no-grades revolt","scenario":"Your grades 6-8 school gives comment-only feedback on all formative work. Grades appear twice a year, on summative assessments, reported as levels against standards. In October, 41 of 180 families sign a letter demanding letter grades on all assignments. Dr. Lin, a surgeon, leads it: \"My daughter has no idea whether she is doing well. Without grades there's no accountability, and high schools want GPAs.\" Another parent, Mrs. Ortiz, says her son \"stopped trying because nothing counts.\" Sixty parents turn up to the meeting. Your grade-7 team brings data: 74% of students revise their work after comments, against roughly 31% at the schools the teachers came from. Board chair Alan calls you afterwards: \"Just add letter grades to everything. It's a PR problem, not a hill to die on.\" Your monthly family newsletter has never explained the feedback policy beyond one paragraph in the August handbook. Nobody has checked whether students act on the comments in every class, or only in grade 7.","tension":"t12","question":"What do you change, what do you keep, and how do you run the next month? Which two authors are arguing in your head?","considerations":["What does Butler's work say happens to comments when a grade is attached?","Which parent concern is legitimate and unmet by the current system?","What does the t12 rule say when families treat every check as a judgment?","Which parts of assessment are open to family codesign and which are mechanisms?","What is going on with Mrs. Ortiz's son, and how would you find out?"],"model_answer":"**Tension:** t12 (Testing as measurement vs testing as learning); also t04 (Standardization and fidelity vs community co-design).\n\nKeep the mechanism and fix the communication and reporting. The t12 rule covers this exactly: when families treat every check as a judgment, the communication has failed, not the mechanism.\n\nThe mechanism is well supported. Grades attached to comments tend to swamp them: students look at the grade and ignore the comment (Butler) [E]. About a third of feedback interventions make performance worse, mostly when feedback focuses on the self rather than the task (Kluger & DeNisi; `07-embedding-formative-assessment`) [E]. The 74% revision rate is local, uncontrolled evidence that the policy does what it is meant to [H]. Share it anyway.\n\nDr. Lin's underlying complaint is fair. Families deserve an accurate picture of where their child stands [V], and a twice-yearly level does not give them one. So change the reporting, not the grading of formative work. Send a short monthly progress note per subject naming the standard, the child's current distance from it, and the next step (`05-10-to-25`) [H]. Share annotated exemplars so families can see what \"secure\" looks like. Keep summative grades at fixed points, and say plainly that high school transcripts will carry them. For a sixth grader, the GPA concern is years away.\n\nUse t04 here. Invite families to codesign the reporting format: frequency, layout, and conference structure (`08-extraordinary-learning-for-all`) [V/H]. Whether formative work is graded is not on the table, and you say why in one paragraph of plain language, not a literature review.\n\nTreat Mrs. Ortiz's son as data. Find out whether his comments ask him to do anything, and whether he receives them as respect or as judgment. Some classes may be writing comments with no required action, which is a known lethal mutation [H].\n\nRun it as a PDSA. Predict that the share of parents agreeing \"I know how my child is doing\" rises from its current level to at least 70% within two reporting cycles. Keep tracking revision rates as the balancing measure (`11-improvement-in-action`).\n\n**What a novice would do wrong:** Cave and grade everything, destroying the mechanism to fix a communication problem. Or defend the policy with citations, treating parents as a misconception to correct, and miss that the reporting gap is real.","sources":["07-embedding-formative-assessment","01-how-learning-happens","05-10-to-25","08-extraordinary-learning-for-all","11-improvement-in-action"]},{"id":"k04","title":"The project-based evangelist and the data","scenario":"Ms. Okafor teaches grade-8 science and came to you from a well-known project-based network. Her six-week unit, \"Design a water filter for our town,\" has teams researching, prototyping and pitching to a city engineer. Students adore it: her classes score 4.6 out of 5 on the student-experience survey, the highest in the school. The other grade-8 teacher, Mr. Hale, taught the same chemistry (mixtures, solubility, the particle model) through three weeks of explicit instruction and worked examples, then a one-week build. On the common unit test Ms. Okafor's two sections averaged 52% and Mr. Hale's two averaged 71%. On a delayed quiz six weeks later the numbers were 41% and 63%. Ms. Okafor says the test measures the wrong things: \"They learned to collaborate and think like engineers.\" She wants to extend the approach to grade 7 next term and has already drafted two units. Several of her parents have emailed to praise her. Mr. Hale, quieter, says he would like his students to do more real projects but doesn't know how to fit them in.","tension":"t03","question":"What do you decide about grade 7, and what do you ask of each teacher? Which two authors are arguing in your head?","considerations":["How much can you conclude from two teachers and four sections?","Which of Kapur's four quadrants does Ms. Okafor's unit fall into?","Her claimed outcomes (collaboration, engineering thinking) are unmeasured. What is the honest status of that claim?","What does the t07 rule say about authentic products in the core?","How do you hold Ms. Okafor to a high standard without losing her?"],"model_answer":"**Tension:** t03 (Teacher-led instruction vs student agency); also t07 (Core vs periphery), t01 (Explicit instruction vs productive failure).\n\nDon't extend the unit to grade 7 yet, and don't ban projects. Ask both teachers to co-design one unit that keeps the product and builds in the knowledge.\n\nFour sections and two teachers confound method with teacher and class, so on its own the comparison is [H]. But the direction matches a strong body of evidence that minimally guided work leaves novices without the knowledge (`00-foundational-papers`, Kirschner, Sweller & Clark; `01-how-learning-happens`) [E]. The delayed-quiz gap matters most, because it measures learning rather than performance. In Kapur's terms this unit looks like unproductive success: high engagement, weak durable knowledge (`04-productive-failure`) [E for the framework]. It also trips the t03 switch signal: busy, satisfied students with flat delayed measures, so pull direction back. The survey score doesn't change that: student preference is a poor proxy for learning [E].\n\nMs. Okafor's claim about collaboration and engineering thinking may be true, but it is unmeasured [H]. If the school values those outcomes [V], define them and assess them with a rubric, so they stop working as an unfalsifiable shield.\n\nThe t07 rule: design the core first, with one authentic product per course per term on top of explicit instruction and a knowledge spine. So the water filter stays, and it becomes the unit's culminating product. Require a written guidance plan: what is taught explicitly, when, with which worked examples, and where hinge questions check the particle model before building starts (`00`) [H for the review process]. If she wants students to struggle productively, one PF-style introduction to solubility is defensible, provided a consolidation lesson follows (t01; `04`) [E].\n\nMake the teachers co-designers: her project craft, his explicit sequence. Write a prediction: the delayed quiz reaches 65% or higher in both sections, while the experience survey stays at 4.3 or above. Decide about grade 7 when the result is in.\n\nTalk to Ms. Okafor with the mentor mindset (`05-10-to-25`): hold a high bar, be transparent about why, and say you believe she can meet it. Her gift for engagement is real, and you want it attached to learning (`09-in-search-of-deeper-learning`) [V].\n\n**What a novice would do wrong:** Side with the data and forbid projects, losing a strong teacher and the identity dimension of the core. Or side with the enthusiasm and scale it. Or treat a two-teacher comparison as proof in either direction.","sources":["00-foundational-papers","01-how-learning-happens","04-productive-failure","09-in-search-of-deeper-learning","05-10-to-25"]},{"id":"k05","title":"The board wants gains in year one","scenario":"Your charter school opens with 320 students in K-8. 58% qualify for free lunch, and entering students in grades 3-8 average around the 35th percentile on last year's state test. At the August board meeting, chair Robert, a private-equity partner, proposes a target: raise state-test proficiency from 31% to 45% by spring. He wants a monthly dashboard showing progress against the target and a $60,000 teacher bonus pool paid out by grade-level gains. Two other board members nod. One asks why you need \"all this TLC stuff\" if you hire well. Your plan rests on a knowledge-rich curriculum, formative assessment built through TLCs, and systematic phonics with a screening protocol. The sources suggest those produce real but modest gains, often around 0.1 SD over two years at whole-school scale, and knowledge curricula may lag on distal tests. Your authorizer reviews the charter in year three. Robert ends the meeting by saying: \"What gets measured gets managed.\" You have three weeks to bring back a response.","tension":"t05","question":"What do you bring back to the board in three weeks? Which two authors are arguing in your head?","considerations":["How large a gain is a 14-point proficiency jump in one year, next to realistic effect sizes?","What happens to indicators when they carry high stakes?","What does the evidence say about teacher merit pay?","Which measures could the board legitimately watch monthly?","What is the t05 switch signal, and how would you use it over two years?"],"model_answer":"**Tension:** t05 (Accountability measurement vs improvement measurement).\n\nBring back two measurement systems that stay separate, a realistic accountability target, and a year-one improvement aim the board can watch. Decline the bonus pool.\n\nStart with honest numbers. A whole-school formative-assessment program realistically yields about 0.1 SD over two years (`07-embedding-formative-assessment`, EEF) [E]. Knowledge-rich curricula show consistent but often small short-run effects on distal reading tests, with a lag of two to three years (`06-beyond-the-science-of-reading`) [H]. A 14-point jump in proficiency in year one would be extraordinary. Chasing it would push the school toward test preparation and narrowing, which raises scores in the short term without raising learning [H]. Robert's slogan is half right: what gets measured gets managed, and that is the risk. High-stakes indicators get corrupted (Campbell's law; `11-improvement-in-action`) [E].\n\nPropose this. Accountability measures (state test, authorizer metrics) are reported to the board twice a year with a two-year target set against comparable schools. Improvement measures (decoding screener pass rates in K-2, cumulative quiz accuracy, attendance, on-track indicators by subgroup) go to the board monthly, in aggregate, as leading indicators. They are never used to evaluate or pay teachers (tension t05 rule) [E/V]. Give a precise year-one aim, for example: raise the share of K-2 students at the decoding benchmark from the fall baseline to 75% by May, with the gap between subgroups halved.\n\nOn the bonus pool: randomized US merit-pay trials have mostly found null effects (`10-creating-the-schools-our-children-need`, POINT; Fryer) [E]. Grade-level payouts also turn practical measures into stakes. Offer to put the money into tutoring for students below benchmark instead. On \"why TLCs if we hire well\": pre-hire signals predict effectiveness weakly (`10`) [E].\n\nGive the board a switch signal it can hold you to. If the practical measures improve for two years and state results do not, your drivers are wrong and you will change them. If the reverse happens, someone is gaming the measures (`11`). Respecting the board's accountability to the authorizer is a [V] you should say out loud.\n\n**What a novice would do wrong:** Accept the target and quietly pivot to test prep. Or refuse any numeric targets and look unaccountable. Or send the board teacher-level practical measures, which turns the improvement system into surveillance within a term.","sources":["11-improvement-in-action","10-creating-the-schools-our-children-need","07-embedding-formative-assessment","06-beyond-the-science-of-reading"]},{"id":"k06","title":"The chair in the classroom","scenario":"Jamal, 13, is in grade 8. In a science lesson, Mr. Brandt told him in front of the class to put his phone away \"for the third time, like I said, you're not special.\" Jamal said \"get out of my face,\" stood up and pushed his chair over. No one was hurt. Mr. Brandt wants a three-day suspension: \"If he's back tomorrow, I've lost that room.\" Jamal's advisor, Ms. Reyes, tells you he has been sleeping at his aunt's for two weeks because of trouble at home. Your handbook says physical aggression carries \"up to a three-day suspension.\" Two other teachers are watching how you handle it. One of them says in the staff room, \"If nothing happens, the kids run the building.\" Jamal's mother is coming in at 3 p.m. It is now 11:40, and you haven't spoken to Jamal. Your school's suspension rate so far this year is low, but the four suspensions to date have all been boys of color, and one board member has already asked about it.","tension":"t08","question":"What do you do between now and 3 p.m., and over the next two weeks? Which two authors are arguing in your head?","considerations":["What would the enforcer, protector and mentor responses each look like?","How reliable will everyone's memory of the incident be by 3 p.m.?","What does the evidence on empathic discipline show, and how strong is it?","What does Mr. Brandt need, and what does he need to hear?","What system-level signal is sitting in the suspension data?"],"model_answer":"**Tension:** t08 (High standards vs support (enforcer, protector, mentor)).\n\nHold the standard and give support. That means a real consequence that doesn't humiliate Jamal, a repair with Mr. Brandt, and a separate coaching conversation with Mr. Brandt.\n\nFirst, before 3 p.m., get short written accounts from Mr. Brandt, Jamal and two student witnesses. Memory is reconstructive and drifts with retelling, so decisions should rest on contemporaneous records collected with neutral questions (`12-why-we-remember`) [E].\n\nWith Jamal, open with sincere questions rather than a verdict. Explain the purpose of the rule and state the standard: pushing furniture in a classroom is not acceptable, whatever came before it. Adolescents are acutely sensitive to status and respect. Messages that treat them as controlled or incompetent provoke resistance, while transparency about intent reduces it (`05-10-to-25`) [E for the broad pattern]. Empathic, relationship-preserving discipline reduced suspensions in a field experiment (Okonofua et al. 2016) [E, one well-designed study; H for your version]. A proportionate consequence might be a day of in-school reflection, the phone kept at the office for two weeks, and a facilitated repair conversation with Mr. Brandt before he returns to that class [H]. Suspend only if there is an ongoing safety risk. Tell his mother the same thing you tell Jamal, and ask what support he needs at home. Connect him with Ms. Reyes for a check-in plan.\n\nMr. Brandt's worry about authority is real, so back him visibly on the standard. Separately, and privately, coach him: \"you're not special\" in front of peers lowered Jamal's status and helped escalate things. The mentor stance applies to adults too: a high bar for how he speaks to students, and support in finding other phrases [V/H]. Check the phone policy is being applied the same way in every class (`12`, divided attention) [E].\n\nThen look at the system. All four suspensions have been boys of color. Treat that as variation to investigate, not a coincidence. Run a blameless review of the referral process by subgroup (`11-improvement-in-action`) [V/H]. The t08 switch signals apply: if compliance rises while effort quality falls, you have drifted to enforcer.\n\n**What a novice would do wrong:** Suspend for three days to back the teacher (enforcer). Or waive any consequence because of the home situation and undercut Mr. Brandt (protector). Or decide on remembered accounts and never look at the pattern in the data.","sources":["05-10-to-25","12-why-we-remember","11-improvement-in-action"]},{"id":"k07","title":"The vendor's 0.6","scenario":"A vendor pitches \"MathLeap,\" an adaptive practice platform for grades 3-8. The headline slide reads \"Effect size 0.6: equivalent to 1.5 extra years of learning.\" Their white paper describes 212 students in four suburban schools over ten weeks. The outcome was the platform's own end-of-module assessment, and the only comparison was to \"national norms.\" The platform costs $45 per student per year, about $14,400 for your 320 students. The vendor recommends three 30-minute sessions a week, replacing independent practice. Your math lead, Keisha, is excited. She says the adaptive engine \"personalizes to each child.\" Teachers already have their two hours a month of TLC time committed to hinge questions. A parent who works in ed-tech has offered to \"connect you with the founders.\" The vendor is offering a 40% discount if you sign by the end of the month, and a free dashboard for the board. Keisha notes the current practice routine has no built-in spacing: homework sets only cover the current week's topic.","tension":"t13","question":"Do you buy, pilot, or pass, and what do you need to know first? Which two authors are arguing in your head?","considerations":["How much should the outcome measure, the sample and the missing control group discount a 0.6?","What instructional mechanism would the platform have to enable to help?","What does it displace, in minutes and in teacher attention?","Keisha's point about missing spacing: is there a real problem the tool could solve?","How would you design a test that could actually change your mind?"],"model_answer":"**Tension:** t13 (Structural reform vs instructional reform); also t05 (Accountability measurement vs improvement measurement).\n\nDon't make a platform decision. If the mechanism fits a real gap, run a bounded, predicted pilot. The discount deadline is a sales tactic, not a reason.\n\nDiscount the number first. Effect sizes depend heavily on the measure, the sample and the duration. Outcomes on the vendor's own assessment, closely aligned to what the platform practises, inflate effects. A comparison to national norms with no control group can't separate the tool from ordinary growth (`10-creating-the-schools-our-children-need`) [E]. By common field benchmarks, 0.6 from a real-world study would be implausibly large. Converting it to \"1.5 years of learning\" stacks one shaky benchmark on another [E].\n\nNext, name the mechanism. Technology doesn't teach. Methods do, and a tool is worth buying only if it enables one (`01-how-learning-happens`, Clark) [E]. Keisha has found a real gap: your practice has no spacing or cumulative retrieval. Spaced, interleaved retrieval with feedback is strongly supported [E], and adaptive software could plausibly deliver it [H]. \"Personalizes to each child\" is not a mechanism until someone says what it adapts, to what evidence, and how.\n\nThen count the cost in the scarce resource. Ninety minutes a week displaces independent practice that teachers currently watch and use formatively (`07-embedding-formative-assessment`) [H]. Tension t13's test applies: name the need, the mechanism, and what the change displaces.\n\nWhat you ask the vendor for: independent evaluations, results on a distal measure, a comparison group, subgroup results, and data-privacy terms for minors [V/legal]. What you run: two grade-5 classes use the tool for its spaced-review function for eight weeks, with two classes as comparison. Write the prediction down (for example, a 10-point gain on your own cumulative quiz relative to comparison). Track teacher time as the balancing measure (`11-improvement-in-action`) [H]. You could also fix the spacing gap for free, by making homework cumulative, and test that against the tool. Decline the board dashboard: a dashboard nobody asked for tends to become an accountability instrument (t05).\n\n**What a novice would do wrong:** Buy on the headline number and the discount. Or dismiss all ed-tech on principle and miss the real spacing gap. Or run a pilot with no comparison group and call it a success because usage and satisfaction were high.","sources":["10-creating-the-schools-our-children-need","01-how-learning-happens","11-improvement-in-action","07-embedding-formative-assessment"]},{"id":"k08","title":"The Socratic AI tutor","scenario":"A well-funded nonprofit offers your school a free AI tutor for grades 5-8 math. Its design principle is that it never gives answers: it only asks guiding questions, \"like Socrates.\" They propose that students spend 40 of each 60-minute math period with the tutor while the teacher circulates. Their evidence is enthusiasm surveys and a pilot where \"time on task rose 30%.\" Your grade-6 teacher, Ana, tried it for a week on dividing fractions. Her six strongest students loved it and asked for more. Nine of her 27 students spent twenty minutes going back and forth with it and still couldn't do basic items on her exit ticket. Two worked out that typing \"idk\" repeatedly made the tutor reveal nearly every step, and copied them. Board member Kira, a former Google product lead, says: \"This is where everything is going. Don't be the school that missed it.\" The nonprofit wants an answer within a month and would publicize your school as a launch partner. Ana says it saved her no time at all.","tension":"t03","question":"What role, if any, does the AI tutor get, and how will you know if you were wrong? Which two authors are arguing in your head?","considerations":["For novices meeting a new procedure, what does never giving the answer do to working memory?","Why did the strong students love it while nine struggled? Which effect names this pattern?","Does the tutor meet Kapur's conditions for productive struggle?","Is time on task a learning measure?","Where might AI plausibly help, and what counts as evidence for that?"],"model_answer":"**Tension:** t03 (Teacher-led instruction vs student agency); also t01 (Explicit instruction vs productive failure), t13 (Structural reform vs instructional reform).\n\nDon't hand the AI 40 minutes of core instruction. Keep the explicit default lesson, and test the AI in narrower roles where its mechanism is plausible. Everything about AI tutoring here is [H]. The evidence for durable learning gains at scale is not yet in.\n\nThe design principle is the problem. Tension t03 says the teacher (here, the tool) sets sequence and examples for novices. For a new procedure, endless guiding questions are a form of minimal guidance: students search for the solution in working memory instead of studying a worked example (`00-foundational-papers`, Kirschner, Sweller & Clark; Sweller) [E]. Ana's week shows the expertise-reversal pattern. Students who already had the schema benefited from being prompted, and novices floundered (`01-how-learning-happens`) [E for the principle]. Nor is this productive failure (t01). PF works for conceptual goals, with learners who have relevant prior knowledge, and only when a teacher-led consolidation compares student attempts with the canonical method (`04-productive-failure`) [E]. The tutor has no consolidation, and dividing fractions is here being practised as a procedure. The \"idk\" exploit also shows students routing around effortful retrieval, which is where the memory benefit comes from (`12-why-we-remember`) [E].\n\n\"Time on task rose 30%\" measures activity, not learning, and activity is a poor proxy [E]. A tool that helps strong students and stalls weak ones widens gaps. That is a [V] problem as well as an evidence problem.\n\nPlausible roles, each run as a PDSA with a written prediction and a delayed cumulative quiz (`11-improvement-in-action`) [H]:\n- a 10-minute practice slot for students who have passed a mastery check, with the tool giving worked steps after one attempt\n- teacher-side use: drafting hinge questions, practice sets and feedback, where Ana's time is the measure\n\nReport the bottom third separately. Review data-privacy terms for minors first [V/legal]. Tension t13: until a tool names its need, mechanism and displacement, it is a test, not a platform decision.\n\nTo Kira, in product terms: the risk is not missing the future but shipping an unvalidated feature to your most vulnerable users, 40 minutes a day. Offer her a seat on the review.\n\n**What a novice would do wrong:** Adopt for novelty and launch-partner publicity, and judge success by engagement. Or ban AI outright and forgo the plausible teacher-side gains. Or look only at averages and miss that the gain for strong students is paid for by the weakest.","sources":["00-foundational-papers","01-how-learning-happens","04-productive-failure","11-improvement-in-action","12-why-we-remember"]},{"id":"k09","title":"The PDSA that failed","scenario":"Your grades 4-5 team of four teachers ran a PDSA cycle. The change idea: a daily three-question exit ticket in math, with students regrouped the next morning for ten minutes of re-teaching or extension. The written prediction: the share of students scoring at least 2 out of 3 on the Friday cumulative quiz would rise from 48% to 65% within four weeks. The result was 51%. Team lead Sam wants to drop it: \"We tried it. It didn't work.\" Lucia points out that she only regrouped on two of the ten days, because sorting 27 exit tickets took her 25 minutes each afternoon. In Mr. Diaz's class, the share went from 44% to 63%; he used mini-whiteboards and sorted students on the spot. Your operations director, Grant, is building the quarterly board slide \"Initiatives: status.\" He has marked everything green and asks you to mark this one green too: \"The board doesn't need the noise.\" The team's next meeting is Thursday.","tension":"t14","question":"What happens on Thursday, and what goes on the board slide? Which two authors are arguing in your head?","considerations":["What exactly was tested: formative assessment, or one way of implementing it?","What do Lucia's fidelity problem and Mr. Diaz's result tell you?","Four weeks, four classes: what are the limits of inference?","What does marking it green do to the improvement culture?","What does the next cycle look like, with a new prediction?"],"model_answer":"**Tension:** t14 (Name the answer in advance vs discover it locally); also t05 (Accountability measurement vs improvement measurement).\n\nA missed prediction is information. Don't drop the change, and don't paint it green. Spend Thursday on the Study step, and report the result honestly.\n\nStudy first. The team didn't test whether short-cycle formative assessment works. That is well supported as a practice, and improvement cycles should implement proven mechanisms rather than rediscover them (t14; `11-improvement-in-action`; `07-embedding-formative-assessment`) [E]. They tested one way of doing it, and that way broke on a process step: sorting took 25 minutes, so the regrouping mostly didn't happen. That is exactly the kind of process leak Bryk's cases turn on [H for the diagnosis]. Mr. Diaz's class is the most useful data point you have. The same aim was met with a different elicitation method. Bryk's central instruction is to learn from variation: ask why it worked there and failed here [E for the principle].\n\nBe humble about inference. Four weeks and four classes are open to noise and regression to the mean. So use a run chart over more weeks, not a before-and-after pair (`11`) [E about the method's weakness].\n\nNext cycle: all four teachers use a single hinge question on mini-whiteboards, sorted in the room in two minutes. Mr. Diaz shows the routine at the start of Thursday's meeting. New prediction: 60% by week four, with a balancing measure of teacher prep time under ten minutes a day. Lucia shouldn't be blamed for low fidelity. The design made fidelity unaffordable, and making it safe to surface that is the leader's job (`11`, Menomonee Falls) [H].\n\nOn the slide, write \"Tested; prediction missed (51% vs 65%); cause identified; cycle 2 running.\" Tell Grant why: the board should see a school that learns, and green-washing teaches staff that the real game is appearances. Keeping improvement data honest and out of accountability theatre is a [V] commitment and the core of tension t05. If Grant needs a traffic light, add a fourth colour: \"learning.\"\n\n**What a novice would do wrong:** Conclude \"exit tickets don't work\" from one four-week cycle. Or mark it green to avoid noise. Or blame Lucia for fidelity rather than redesigning the routine so fidelity is cheap.","sources":["11-improvement-in-action","07-embedding-formative-assessment","10-creating-the-schools-our-children-need"]},{"id":"k10","title":"The grade-7 slide","scenario":"Your student-experience survey shows a sharp drop. Among last year's grade-6 students, now in grade 7, agreement with \"I care about doing well in my classes\" fell from 78% in spring to 49% in November. Homework completion fell from 88% to 57%. Referrals for low-level disruption doubled. The grade-7 team proposes three things: a stricter homework policy with lunchtime detentions for missing work, effort points on report cards, and a growth-mindset poster campaign launched with an assembly. Advisor Mateo tells you what students say to him: \"school is for babies,\" \"they tell us what to do every minute,\" \"nothing we do matters to anyone.\" The grade-7 day is seven 45-minute periods of core classes. Electives don't start until grade 8. Grade-7 students hold no roles in the school. Their homework is mostly worksheets marked right or wrong. Teachers report that a third of the homework is \"too hard for them to do alone,\" which is why many don't try.","tension":"t08","question":"What do you do about grade 7 this term? Which two authors are arguing in your head?","considerations":["Is this a character problem, a competence problem, a respect problem, or several?","What does the evidence say about growth-mindset messaging on its own?","What would enforcer, protector and mentor responses each look like?","What does \"too hard to do alone\" imply about homework design?","What would you measure to know within eight weeks whether you were right?"],"model_answer":"**Tension:** t08 (High standards vs support (enforcer, protector, mentor)); also t07 (Core vs periphery).\n\nRead this as a respect and competence problem more than a willpower problem. Answer it with the mentor mindset: keep the standard rather than lowering it out of sympathy [V], raise support, and give grade 7 real status.\n\nThe student comments are a textbook pattern. Adolescents respond sharply to being treated as controlled or incompetent, and they withdraw effort to protect status (`05-10-to-25`) [E for the broad pattern]. The team's plan would likely backfire on both levels. Detentions push toward the enforcer quadrant: compliance may rise while effort quality falls, which is the t08 switch signal. Posters and a mindset assembly have weak support. Brief mindset messages show small average effects, concentrated in some groups and supportive contexts, and a large UK school trial found no attainment effect (`05`) [E]. Effort points risk rewarding effort that isn't tied to progress, the \"false growth mindset\" [H].\n\nFix competence first. Motivation is largely downstream of success (`01-how-learning-happens`) [E]. Homework that a third of students can't do alone guarantees avoidance. Redesign it as retrieval of material already taught, aimed at roughly 80% success [E for the principle; H for the number]. Record missing work and follow up with a support plan, not a zero.\n\nThen build status and purpose, each change run as a small test (`11-improvement-in-action`) [H]:\n- grade-7 students tutor grade-4 students once a week in math facts\n- each core course ends the term with work shown to a real audience (`09-in-search-of-deeper-learning`)\n- students lead one advisory segment a week\n- open one elective or club block for grade 7 (t07) by moving an elective period down from grade 8\n\nOn major assignments, give wise feedback with a sincere statement of the high standard and your belief the student can reach it, plus a revision opportunity (`05`) [E, modest replication base]. Add brief purpose reflections tied to the boring-but-important work (\"who could this help?\") [E, modest].\n\nRe-run the survey item and measure homework quality, not just completion, in eight weeks. Watch the t08 signals: if satisfaction rises while effort quality falls, you've drifted to protector.\n\n**What a novice would do wrong:** Treat it as a character deficit: detentions, effort points and posters. Or swing to protector: drop homework and lower the bar to win back goodwill. Either way, the novice never checks whether the work was doable.","sources":["05-10-to-25","01-how-learning-happens","09-in-search-of-deeper-learning","07-embedding-formative-assessment","11-improvement-in-action"]},{"id":"k11","title":"Ancient Egypt, three times","scenario":"In year two your new instructional lead, Hannah, audits the K-8 curriculum as it is actually taught. Ancient Egypt appears in grades 2, 3 and 6, each time as a fresh four-week unit on pyramids and mummification with no reference to earlier units. The Industrial Revolution appears nowhere. Grade 5 science teaches photosynthesis, but no grade teaches the particle model of matter before grade 7. Grade 4 calls it \"claim and proof\" while grade 6 calls it \"thesis and evidence.\" Three math teachers use three different visual models for fractions. Each unit, taken alone, is well taught and popular with parents. Paul, in grade 3, says the Egypt unit is his \"signature\": students build a museum and families come to the opening. Hannah proposes a full K-8 sequence to be written by June. Two teachers have asked whether this means \"a script.\" Your board chair thinks the audit is \"inside baseball\" and asks why it matters if each class is good.","tension":"t04","question":"What do you change, in what order, and how do you handle Paul? Which two authors are arguing in your head?","considerations":["Why does repetition without building differ from spaced retrieval?","Which conceptual prerequisites are being violated?","Why would inconsistent vocabulary and representations across grades matter?","Which curriculum choices are [V] and open to the team, and which are mechanisms?","What can Paul keep?"],"model_answer":"**Tension:** t04 (Standardization and fidelity vs community co-design); also t02 (Knowledge-rich curriculum vs curiosity and inquiry), t10 (Conceptual change vs coverage).\n\nBuild a school-owned K-8 knowledge sequence over two years. Standardize representations and vocabulary now, fix prerequisite violations first, and keep what makes Paul's unit great while changing where the content sits.\n\nAnswer the board chair with the mechanism. Knowledge compounds only when each unit builds on earlier ones, so a set of good but disconnected units wastes that compounding (`06-beyond-the-science-of-reading`; `10-creating-the-schools-our-children-need`) [E for the mechanism; H for the size of the gain]. Egypt three times is not spaced retrieval. Each unit starts fresh, so students relearn rather than retrieve and extend. Memory research supports cumulative sequences where later units re-use earlier ones (`12-why-we-remember`) [E]. The audit's second finding is more urgent: photosynthesis before the particle model violates a conceptual prerequisite, which invites synthetic models (t10; `02-scienceblind`) [E that the dependency is real; H for the best sequence]. Put the particle model in grade 5 before photosynthesis next year.\n\nStandardize representations and vocabulary across grades this term: one fraction model, one claim-evidence vocabulary. Inconsistent representations make students re-learn the same idea under new names, and experts need a stable external form of a concept to build on (`13-learning-scientific-concepts`) [H].\n\nTension t04 sets the process. The sequence mechanism (cumulative, prerequisite-mapped, each unit re-using earlier ones) is fixed. Which civilizations and periods to study is [V], decided by the teaching team with community input, and logged in the register with who might disagree. Map dependencies first, then flag units nothing later builds on (`12`) [H].\n\nFor Paul: the museum is an authentic product with an audience, the kind of feature you want in the core. Keep grade 3 as the Egypt year with a planned deeper second pass in grade 6, and move grade 2 to a different civilization. Or keep his museum format and let Egypt move. Ask him to co-lead the grade-2 redesign using his exhibition model. Answer the \"script\" worry directly: the sequence fixes what is learned when, not how teachers teach it (t02: curiosity is protected by norms, not by content chaos).\n\n**What a novice would do wrong:** Leave everyone's units alone out of respect for autonomy, or call the repetition \"spiraling.\" Or impose a purchased sequence in one summer with no teacher involvement, and have it quietly ignored by October.","sources":["06-beyond-the-science-of-reading","10-creating-the-schools-our-children-need","12-why-we-remember","02-scienceblind","13-learning-scientific-concepts"]},{"id":"k12","title":"The TLC that ticks boxes","scenario":"It is month seven of your teacher learning communities. You sit in on one group of ten, which meets monthly for 90 minutes. The first 15 minutes are announcements. Then comes a \"how's it going\" round in which each teacher says one sentence, usually \"good, I tried exit tickets.\" The next 40 minutes go on planning a field trip. No teacher has a written personal action plan. The log shows 3 peer observations completed out of an expected 30. The facilitator, Greg, is a warm, well-liked veteran. He tells you, \"People are exhausted. I didn't want to push.\" A staff survey rates the TLC 3.1 out of 5 for usefulness. Two teachers ask to replace it next year with \"choice PD,\" where each person picks conferences or online courses. Meanwhile the weekly Tuesday staff meeting, 60 minutes long, is mostly logistics that could be an email. No cover has been arranged for peer observations: teachers were told to \"find a free period.\" Greg was given the facilitator role in August with a one-hour briefing.","tension":"t06","question":"Do you keep, change or replace the TLC, and what do you do this month? Which two authors are arguing in your head?","considerations":["Which active ingredients of the TLC model are missing?","Is the problem teacher motivation, facilitator skill, time, or design?","What does \"choice PD\" usually deliver?","How do you add accountability without turning TLCs into evaluation?","What does the t06 switch signal say, and when does it apply?"],"model_answer":"**Tension:** t06 (Selecting teachers vs developing them).\n\nKeep the TLC and fix it. What you are seeing is a lethal mutation: it has the name and the calendar slot but has lost its active ingredients. Start with time and facilitation, not with the teachers.\n\nDiagnose against the model. The version tested at scale has a standard agenda, a personal action plan per teacher, an accountability round where each teacher reports specifically on what they tried and what happened, peer observation between meetings, and small steps sustained over two years (`07-embedding-formative-assessment`) [E for the package; H for which ingredients are necessary]. Your group has almost none of them. The 3.1 survey score is a verdict on the mutation, not the model.\n\nThe causes are organizational. Exhaustion is real, and the fix is to stop something else. Cut the Tuesday logistics meeting to an email and give that hour back as protected peer-observation time with cover arranged (`10-creating-the-schools-our-children-need`, the \"stop doing\" list) [V/H]. Greg was given a hard facilitation job with one hour of preparation. He is a novice at this role, and novices need worked examples. So give him the standard agenda, a scripted accountability round, and a chance to watch a strong session, and co-facilitate the next meeting with him (`11-improvement-in-action`, on not carrying discovery over to novice adults) [H]. Coach him with the mentor mindset: warmth is an asset, and holding the bar is part of support (`05-10-to-25`) [H].\n\nKeep accountability peer-based and non-evaluative. Leaders don't attend to judge, and nothing from TLCs enters appraisal (`07`) [H]. Track three practical measures: action plans written, observations completed, and one line per teacher per month on what changed in their classroom.\n\nDecline \"choice PD,\" and explain why. One-off, individually chosen courses rarely change classroom practice; sustained, practice-based, collaborative designs do better (`10`) [E for the general PD pattern]. Choice already lives inside the TLC, since teachers choose their own techniques (tight but loose). The t06 switch signal needs two full years: if within-school variation in practice hasn't narrowed by then, the TLC design is broken. You aren't there. You're at \"never actually ran it.\"\n\n**What a novice would do wrong:** Cancel the TLCs because teachers don't like them. Or bolt on compliance forms and send an evaluator, killing psychological safety. Or replace Greg abruptly instead of equipping him.","sources":["07-embedding-formative-assessment","10-creating-the-schools-our-children-need","11-improvement-in-action","05-10-to-25"]},{"id":"k13","title":"The students who can say \"particles\"","scenario":"Rosa teaches grade-6 science. Her three-week unit on states of matter used clear explicit instruction: well-designed slides, worked examples, labeled particle diagrams. The end-of-unit test averaged 86%. Students could define \"particle,\" state that \"particles in a solid are packed tightly,\" and label diagrams of all three states. On her own initiative, Rosa then gave two items adapted from a concept inventory. First: \"When water evaporates from a puddle, what happens to the water particles?\" 58% chose \"they disappear\" or \"they turn into air.\" Second: \"Draw the particles of a gas in a sealed jar.\" 61% drew particles clumped at the bottom with \"air\" between them. When you ask one student, Maya, to explain her drawing, she says confidently that \"the particles get bigger when they are heated, that's why it expands.\" Rosa is discouraged: \"I taught it better than I've ever taught it.\" Her department head says the test scores are what count, and that the unit should be marked complete so grade 6 can move on to cells as planned.","tension":"t10","question":"Did the students learn the particle model? What do you do next, in this unit and across grades? Which two authors are arguing in your head?","considerations":["Why can students score 86% on the test and still hold an intuitive model?","What kind of misconception is \"particles get bigger when heated\"?","What does the t11 rule say about when and how to confront it?","What should \"mastered\" mean for a concept like this?","What should happen in grades 7 and 8, and in Rosa's professional learning?"],"model_answer":"**Tension:** t10 (Conceptual change vs coverage); also t11 (Confront the intuitive theory vs build on it).\n\nNo. Many students learned to say the particle model without reasoning with it. Don't mark the unit complete. Spend three or four more lessons now, and change how the school defines mastery for core concepts.\n\nTelling produces \"can repeat\" knowledge and synthetic models, where scientific vocabulary is layered onto an intuitive theory rather than replacing it (`02-scienceblind`; `00-foundational-papers`, Vosniadou, Chi) [E]. Maya attributes a property of the whole substance (expansion) to individual particles. High recall with the intuitive model intact is the t10 switch signal: coverage without conceptual change. Recall items can't detect this. Generative prediction and transfer items can [E]. Rosa did exactly the right thing by probing. Say so to her, publicly.\n\nApply the t11 rule: confront, but only once the correct model is intelligible, and always correct immediately. Here that means:\n- students predict what happens to particles in the sealed jar and in the evaporating puddle\n- they commit to a written answer, then see a simulation of moving particles with empty space between them\n- they explain why the \"bigger particles\" idea is tempting and where it fails\n- the lesson ends on the scientific model, with students re-drawing the jar\n\nPredict-observe-explain sequences have support beyond physics lecture comparisons [E for physics; H for generalization]. Put the Maya-type misconception into the unit's hinge-question bank as a distractor, so teachers find it in real time next year (`07-embedding-formative-assessment`) [H for the bank].\n\nAcross grades, the scientific model competes with the intuitive one rather than erasing it, and reversion under load is normal (`13-learning-scientific-concepts`; `12-why-we-remember`) [E]. Schedule spaced revisits of the particle model in grades 7 and 8, and standardize one particle representation from grade 5 onward [H].\n\nChange the definition: a core concept counts as \"mastered\" only when students succeed on novel prediction items and on a delayed re-test, not on recall of the explanation. The evidence says recall and conceptual assessments diverge [E]. Making that the standard is [V]. Give Rosa and her colleagues PD on common intuitive theories in their domain, since teachers often hold them too (`02`) [H for the training effect].\n\n**What a novice would do wrong:** Take 86% as proof of learning and move on. Or re-teach the same slides more slowly. Or conclude explicit instruction failed and switch to open discovery, which would entrench the intuitive model further.","sources":["02-scienceblind","13-learning-scientific-concepts","00-foundational-papers","07-embedding-formative-assessment","12-why-we-remember"]},{"id":"k14","title":"The volcano everyone remembers","scenario":"Ben's grade-4 unit on plate tectonics opened with a baking-soda-and-vinegar volcano erupting across a tray, followed by a four-minute video of Hawaiian lava flows. The room erupted too. He then spent 30 minutes explaining plate boundaries with a diagram. A week later, the retrieval quiz asked: \"Why do most earthquakes happen where they do?\" 23 of 26 students wrote about the volcano: the foam, the lava, \"it exploded because of the chemicals.\" Five mentioned plates; two mentioned boundaries. Students told the coach it was \"the best lesson ever.\" Imani, another grade-4 teacher, proposes a school-wide expectation of \"a WOW hook every lesson.\" She points to the class blog, where parents left 40 comments on the volcano photos. Your coach notes that the baking-soda reaction has nothing to do with how real volcanoes work. Ben feels proud and confused at once. He knows the quiz went badly but thinks the excitement \"must have helped somehow.\" The science block is 45 minutes a day, and the unit has six more lessons.","tension":"t09","question":"What do you tell Ben and Imani, and how should the next lesson open? Which two authors are arguing in your head?","considerations":["What does the research on curiosity and memory show about the target versus incidental material?","What did students' memories latch on to, and why?","Could the demonstration itself have planted a misconception?","How do you keep the joy without letting it replace the content?","What should the observation rubric reward?"],"model_answer":"**Tension:** t09 (Curiosity hooks vs target learning); also t02 (Knowledge-rich curriculum vs curiosity and inquiry), t11 (Confront the intuitive theory vs build on it).\n\nThe hook worked, on itself. Students remember what they were curious and emotional about, and here that was the foam, not the plates. Redesign hooks so the thing students are curious about is the learning objective.\n\nThe mechanism is specific. Curiosity strongly improves memory for the answer to the question you are curious about. The spillover to other material presented nearby is small, brief and inconsistent, and in a 2024 study it reversed for complex material (`00-foundational-papers`, Gruber, Gelman & Ranganath 2014; `12-why-we-remember`, Keller et al.) [E, mostly adult lab work; H for grade-4 classrooms]. Emotion also spotlights whatever is central in the experience (`12`) [E]. In this lesson, the central, exciting element was a chemical reaction unrelated to plate tectonics. Worse, a baking-soda eruption suggests volcanoes are chemical explosions, which may plant a misconception the unit then has to undo (t11) [H].\n\nNext lesson, apply the t09 rule: open with a question whose answer is the objective (`00`) [E for target memory]. Show a world map of the last 1,000 earthquakes and ask: \"Why are they in lines, and why is there almost nothing in Kansas?\" Students predict and commit, then the explanation of plate boundaries answers the question they are holding. That is an information gap, and it needs prior knowledge to be felt. Tension t02 says knowledge is the substrate of curiosity, not its rival [E]. Keep the lava video, but place it after the mechanism, as an example of what happens at a boundary. Re-run the retrieval question in a week and compare. That's a quick PDSA.\n\nTo Imani: decline \"a WOW every lesson\" as a standard. Adopt \"every lesson opens with a question whose answer is the objective.\" It keeps the energy and points it at the content. Blog comments and \"best lesson ever\" measure enjoyment, and student preference is a poor proxy for learning, so don't reward it in observation (`01-how-learning-happens`) [E]. The joy itself is worth keeping. Children's delight in the world matters in its own right (`03-intellectual-lives-of-children`) [V]. The job is to attach it to the ideas.\n\n**What a novice would do wrong:** Conclude that hooks work because students loved the lesson, and mandate more of them. Or ban hooks as fluff and lose a real curiosity mechanism. Or never notice that the demonstration taught the wrong model.","sources":["00-foundational-papers","12-why-we-remember","03-intellectual-lives-of-children","01-how-learning-happens"]},{"id":"k15","title":"The rushed consolidation","scenario":"Last year your grades 7-9 math department adopted productive failure for six core concepts a year, including variability (standard deviation) and slope as rate. This term your coach observed 14 PF lessons. On average the generation phase ran 38 minutes against a planned 20. Consolidation averaged 9 minutes against a planned 25, often ending at the bell with the teacher showing the formula on the board. In 9 of the 14 lessons the teacher never compared student methods with the canonical one. On a delayed transfer quiz on variability, PF classes averaged 54%; last year's explicit-instruction classes averaged 60%. Department head Luis says: \"PF doesn't work with our kids. We go back to explicit instruction for everything.\" Ayesha taught two of the observed lessons, both with full consolidations that put three student solutions side by side before introducing the formula. Her classes averaged 71%. The remaining four PF concepts are scheduled for next term, and the department meets Monday.","tension":"t01","question":"What do you decide on Monday about the remaining PF concepts? Which two authors are arguing in your head?","considerations":["Did the department test PF, or a low-fidelity version of it?","What is the active ingredient in Kapur's design?","What does the t01 switch signal say, and how literally should you apply it?","How much weight should Ayesha's two lessons carry?","What would make consolidation structurally protected rather than dependent on willpower?"],"model_answer":"**Tension:** t01 (Explicit instruction vs productive failure).\n\nWhat the department ran was unproductive failure, not PF. Fix the design for two concepts where you can guarantee consolidation. Revert the rest to explicit instruction this year.\n\nThe pattern matches Kapur's own boundary conditions. The consolidation phase, where student methods are compared with the canonical one, is the active ingredient. High-fidelity implementations produce the benefit (g roughly 0.37-0.58 on conceptual and transfer outcomes), and low-fidelity ones show little or none (`04-productive-failure`, Sinha & Kapur 2021) [E]. Nine of fourteen lessons skipped the comparison, and the average consolidation was a third of plan. The 54% measures that mutation. Luis's conclusion tests the wrong thing, though his instinct to protect the default is sound. Explicit instruction is the school default for good reasons (`00-foundational-papers`; `01-how-learning-happens`) [E].\n\nThe t01 switch signal says: if observation shows weak consolidation, revert to explicit for that unit. Apply it, but narrowly. Ayesha's 71% is two lessons and one teacher, so it is [H], but it shows the design can work in your context.\n\nFor next term, choose the two concepts that best meet all four conditions: a conceptual goal, relevant prior knowledge, multiple plausible approaches, and a scripted consolidation. Then make consolidation structural rather than a matter of willpower:\n- split each PF lesson across two periods, generation in one and the full consolidation in the next, so the bell can't eat it\n- timebox generation at 20 minutes, visibly\n- build a task bank with anticipated student solutions and a consolidation script, starting with Ayesha's (`04`) [H]\n- run the remaining two concepts explicitly\n\nAim PD at the hard teacher moves: monitoring without rescuing, choosing which solutions to display, and running the compare-and-contrast (`04`) [H]. Hinge questions at the end of consolidation show whether the canonical idea landed (`07-embedding-formative-assessment`).\n\nRun it as a PDSA (`11-improvement-in-action`). Predict that PF classes reach 65% or higher on the delayed transfer quiz, with observed consolidation of at least 20 minutes in 90% of lessons. Evaluate on delayed and transfer items, never on in-lesson success (`04`) [E]. Judging methods by durable learning is itself a [V].\n\n**What a novice would do wrong:** Accept \"PF doesn't work\" on evidence from a version that left out its active ingredient. Or insist teachers carry on unchanged because \"research says it works.\" Either way, no one asks what was actually implemented.","sources":["04-productive-failure","00-foundational-papers","01-how-learning-happens","07-embedding-formative-assessment","11-improvement-in-action"]},{"id":"k16","title":"The design team's proposals","scenario":"You committed to community codesign. Your founding design team has 16 members: six parents, four students from grades 7-8, four teachers and two community members. At the kickoff you said, \"This community will design this school.\" After five evening sessions the team votes 13-3 for a package:\n- every student learns in their preferred learning style (visual, auditory or kinesthetic), identified by a questionnaire\n- self-paced digital playlists for grades 4-8 math and ELA \"so kids can go at their own pace\"\n- a four-day instructional week with Fridays for passion projects\n- an advisor for every student, meeting daily\n- student-led conferences instead of parent-teacher conferences\n\nThe three \"no\" votes were teachers. The parents are energized and have told other families about the plan. Two local reporters have asked for interviews. Your charter application is due in six weeks and must describe the instructional model. Your teachers quietly tell you they will not teach to learning styles.","tension":"t04","question":"What do you take back to the design team, and how? Which two authors are arguing in your head?","considerations":["Which proposals sit in the layer that community codesign should own, and which are mechanisms?","What is the evidence status of each of the five proposals?","What promise did you make at kickoff, and was it well-formed?","What legitimate value sits underneath the learning-styles and playlist proposals?","How do you keep the coalition while declining parts of its package?"],"model_answer":"**Tension:** t04 (Standardization and fidelity vs community co-design); also t13 (Structural reform vs instructional reform).\n\nAdopt what belongs to the community's layer, decline or narrow what conflicts with the evidence, and own your governance mistake. Your kickoff promise didn't say which layer was open, and that is on you, not the team.\n\nSort the proposals by layer, using the t04 rule: standardize mechanisms, codesign purpose, culture and the periphery.\n- *Advisory* and *student-led conferences* sit squarely in the community's layer and fit the evidence on adolescent status and respect (`05-10-to-25`) [V/H]. Adopt both.\n- *Learning styles* can't be adopted. Matching instruction to a diagnosed style doesn't improve learning; that is among the most thoroughly tested myths (`01-how-learning-happens`) [E]. The value underneath it, that every child is known and taught well, is legitimate [V]. Meet it with formative assessment and flexible grouping by prior knowledge [E].\n- *Self-paced playlists* for novices are minimally guided by design (`00-foundational-papers`) [E], and evaluations of personalized-learning models show modest, variable effects (`08-extraordinary-learning-for-all`) [E, mixed]. Offer a narrow version: self-paced spaced-review practice after explicit teaching, run as a pilot [H].\n- *The four-day week* is a structural change with no learning mechanism, and it cuts instructional time by a fifth (`10-creating-the-schools-our-children-need`, structure changes the container) [H]. Tension t13 says keep structure conventional unless instruction needs the change. Offer a protected weekly passion-project block as the periphery instead.\n\nProcess matters as much as the answers. Go back to the team in person. Explain that you should have said at kickoff which layers were open, and propose a written compact: the community decides purpose, culture, the periphery and which knowledge to prioritize where evidence is silent. Mechanisms go through an evidence review first. Add that review as a standing step in the design process; the book leaves this gap and it is our addition (`08`) [H]. Show your reasoning on each item in plain language, and let the team revise the playlist and passion-block versions. For the reporters, wait until the team has seen the revised package.\n\nFor the charter application, describe the explicit-instruction default and the formative system. Name advisory and student-led conferences as community-designed commitments [V].\n\n**What a novice would do wrong:** Rubber-stamp the vote because community voice feels like legitimacy. Or quietly override it in the charter application, which destroys trust and invites the design to be reverted later. The skill is sorting by layer in the open.","sources":["08-extraordinary-learning-for-all","01-how-learning-happens","00-foundational-papers","10-creating-the-schools-our-children-need","05-10-to-25"]},{"id":"k17","title":"The misconception that got stronger","scenario":"Noor teaches grade-8 physics. She designed a \"confront the misconception\" lesson on forces. She presented the claim \"a moving object needs a force to keep it moving\" and had groups spend 20 minutes building the strongest case for it, drawing on everyday experience: pushed carts stop, thrown balls fall. The class made a large poster of the best arguments. In the last ten minutes she explained Newton's first law. A hinge question before the unit found 62% of students choosing the \"needs a force to keep moving\" distractor. The day after the lesson, 68% chose it; one week later, 71%. The poster is still on the wall; students point to it when they argue. Noor is bewildered. She had read that misconceptions must be confronted, and her students were more engaged than she had ever seen them. A colleague says the lesson proves you should \"never show students wrong ideas, just teach the right one.\" Noor has two more force lessons before the unit test.","tension":"t11","question":"What went wrong, and what should the next two lessons look like? Which two authors are arguing in your head?","considerations":["What did students actually rehearse for twenty minutes?","What does the t11 rule require, and which part did the lesson violate?","Is the colleague's conclusion (never show wrong ideas) justified?","What do the intuitive-theory and memory literatures say about coexistence and retrieval of wrong models?","What does the poster do every day it stays up?"],"model_answer":"**Tension:** t11 (Confront the intuitive theory vs build on it).\n\nThe lesson rehearsed the misconception. Twenty minutes building the case for impetus, a poster of it, ten minutes of correction: students elaborated the wrong model far more than the right one. The t11 switch signal has fired. Distractor rates rose after a confrontation lesson, so the confrontation is being remembered as the content.\n\nThe rule for t11 is: confront, but only once the correct model is intelligible, always with immediate correction, and never leave the wrong model as the last thing seen or the most rehearsed. The lesson broke all three. Memory strengthens whatever is retrieved and elaborated (`12-why-we-remember`) [E], and the poster is a daily spaced retrieval cue for impetus. Anomalous data alone often fails to change minds, because students explain it away (`02-scienceblind`) [E]. And intuitive and scientific ideas coexist into adulthood, so the scientific one has to be built strong enough to win (`13-learning-scientific-concepts`) [E].\n\nThe colleague draws the wrong lesson: avoiding intuitions leaves them intact. The problem was sequence and proportion.\n\nFor the next two lessons:\n- Take the poster down today. Replace it with a two-column contrast: \"what it feels like\" and \"what is happening,\" where the second column names friction as a force.\n- Open with a quick prediction on a puck sliding on ice, then on a space probe, and have students commit in writing (`04-productive-failure`, generation surfaces prior ideas) [E].\n- Teach the mechanism: friction and air resistance are forces, and removing them removes the slowing. Use bridging analogies from rough to smooth surfaces [E, moderate].\n- Use a short refutation text that states the intuition, says why it is tempting, and explains why it fails [E, moderate].\n- Have each student write why their earlier prediction made sense and what corrects it. Confident errors followed by correction are remembered well (`12`, hypercorrection) [E].\n- End every lesson on the scientific model; being wrong in public must stay safe [V].\n\nRe-run the hinge question after two days and again after two weeks (`07-embedding-formative-assessment`) [H]. Schedule a revisit in grade 9, because reversion under load is normal.\n\n**What a novice would do wrong:** Conclude from the colleague's comment that misconceptions should never be named. Or give students even more debate time \"because they were so engaged.\" Or leave the poster up because it looks like good student work.","sources":["02-scienceblind","13-learning-scientific-concepts","12-why-we-remember","04-productive-failure","07-embedding-formative-assessment"]},{"id":"k18","title":"The dashboard that became a stick","scenario":"At your request, upper-school principal Denise set up practical measures for the improvement system: weekly exit-ticket accuracy by class, the percentage of students revising work after feedback, and daily attendance. For one term, teachers entered data carefully and the weekly improvement huddles were lively; people compared routines and borrowed ideas. In January Denise began showing a ranked table of classes at staff meetings. In mid-year evaluations she wrote that two teachers were \"bottom quartile on revision rate.\" Within three weeks the dashboard revision rate jumped from 48% to 81%. Your spot-check of 30 \"revised\" pieces finds 19 with one-word edits. Two teachers have stopped submitting exit-ticket data, citing \"tech issues.\" The huddles are now quiet and short. Denise is pleased with the jump and has asked you to present it to the board as a success. She believes she is \"using data to drive instruction,\" as her previous district trained her to.","tension":"t05","question":"What do you do this week, and how do you prevent this from happening again? Which two authors are arguing in your head?","considerations":["What does the jump from 48% to 81% actually show?","What rule does tension t05 set for improvement measures?","What do you owe the two teachers named in evaluations?","How do you correct Denise without making her the villain?","What can you still trust in the January-onward data?"],"model_answer":"**Tension:** t05 (Accountability measurement vs improvement measurement).\n\nThe jump is not improvement. It is the measure being gamed. Stop the ranking now, withdraw the evaluative use, and rebuild the conditions that made the data honest, while treating Denise as a capable leader who used the wrong tool.\n\nThis is Campbell's law on schedule: once an indicator carries stakes, people manage the indicator rather than the thing it measures (`11-improvement-in-action`) [E]. The spot-check proves it, and the missing submissions and quiet huddles are the other symptoms. The t05 rule is explicit: improvement measures are never used in evaluation. Its switch signal has fired: the wall is breached, so repair it publicly. Two measurement systems have to stay separate, physically and culturally.\n\nThis week:\n- Tell staff the ranking and evaluative comments were a mistake, both end today, and the two evaluation references will be removed. Fairness requires it: a single practical measure over a few weeks is not a valid basis for a consequential judgment (`10-creating-the-schools-our-children-need`) [E; V for the fairness commitment]. Say \"we\": you built the system and didn't write the rule down.\n- Flag January-onward revision data as unreliable, and don't present the jump to the board.\n- Tighten the measure itself: a revision counts only if it addresses the comment, judged on a quick sample [H].\n\nWith Denise, be direct and respectful. She wants to act on data, which is right. Give her the right move. In improvement work, variation is for learning: ask the teacher whose revision rate is highest to show the routine in a huddle, rather than ranking the lowest (`11`) [E for the principle]. Her evaluation work still matters, but it runs on a separate system with multiple measures over multiple years (`10`) [E].\n\nTo prevent a repeat, write the separation into your improvement charter: which measures are improvement, who sees them at what level of aggregation, and that they never enter appraisal [V]. Add a balancing measure for trust: a two-question staff pulse on whether it's safe to report bad data. Leaders who model surfacing failure were the common thread in Bryk's stronger cases (`11`, Menomonee Falls) [H].\n\n**What a novice would do wrong:** Present 81% to the board as a win. Or scrap practical measures altogether because \"data got political.\" Or publicly blame Denise, which teaches everyone that surfacing problems is dangerous, the same lesson the dashboard just taught.","sources":["11-improvement-in-action","10-creating-the-schools-our-children-need","07-embedding-formative-assessment"]},{"id":"k19","title":"The maker studio nobody wants touched","scenario":"Every Friday afternoon, grades 5-8 have two hours of \"Maker Studio,\" an open-ended block where students choose projects and use the tools, electronics and materials available. The teacher, Felix, is deliberately hands-off: \"I don't want to kill their ideas.\" On the student survey, 91% name it their favorite part of the week. Your instructional coach spent three Fridays observing. About a third of students build increasingly ambitious things with growing skill; most of them already had tinkering experience at home. About a third repeat the same simple project, such as a cardboard phone stand, for weeks. The last third mostly chat, and several can't use the basic tools safely. The coach proposes turning the studio into sequenced explicit lessons, with a skills curriculum and assessments, \"to bring it in line with the default lesson.\" Felix says he'll quit if that happens. Parents rave about the studio in every survey. Two students from the ambitious third have entered a regional competition.","tension":"t07","question":"Do you redesign the studio, leave it alone, or something else? Which two authors are arguing in your head?","considerations":["What does Mehta & Fine's periphery actually look like, and is it unguided?","Which third of the students is the studio failing, and why might it split this way?","Where does explicit teaching belong in a creative studio, and where does it narrow exploration?","What does the t07 rule protect, and what does protection require?","What should you measure without turning the studio into a class?"],"model_answer":"**Tension:** t07 (Core vs periphery); also t03 (Teacher-led instruction vs student agency).\n\nProtect the studio as periphery, but don't mistake protection for leaving it undesigned. Add apprenticeship structure while keeping ideas open. Don't turn it into the default lesson.\n\nThe t07 rule protects a periphery every student takes part in, because that is where identity and creativity get room. Mehta & Fine's periphery (theatre, robotics, debate) is not unguided. It works through coaching, modeling, critique, practitioner standards and a public performance, and its directors are often highly directive (`09-in-search-of-deeper-learning`) [H: a strong descriptive pattern, but confounded by who chooses to take part]. Felix's studio has choice and tools but no apprenticeship, and the three-way split is what the evidence predicts. Students with prior skill thrive with minimal guidance. Novices stall or drift (t03; `00-foundational-papers`) [E]. Open-ended time also tends to favor children who bring knowledge and experience from home, unless it is scaffolded (`03-intellectual-lives-of-children`) [H]. The children being left behind are the ones the school most needs to reach, which is a [V] reason to act.\n\nBe careful where explicit teaching goes. Demonstrating one way to do something makes children less likely to explore other ways (Bonawitz et al.; `03`) [E]. So teach tools and techniques explicitly, and leave the ideas open. Changes, co-designed with Felix:\n- a 15-minute skill clinic at the start of each session (soldering, cutting safely, simple circuits), with a tool-safety check-off\n- a one-paragraph project proposal and a mid-point critique using a simple protocol\n- mixed-age mentors, pairing the ambitious third with newer students, which also gives them status (`05-10-to-25`) [H]\n- an exhibition at the end of each term for a real audience\n\nMeasure lightly: the share of students whose project advances at each three-week check, tool-safety completion, exhibit quality, and whether the survey stays high [H]. Run it as a one-term test (`11-improvement-in-action`).\n\nTo Felix: his instinct to protect ideas is right, and the plan keeps it. What he hasn't provided is the coaching that turns choice into craft. Present the redesign as making his studio work for all three thirds (`05`, mentor mindset) [V].\n\n**What a novice would do wrong:** Accept the coach's plan and convert the studio into a scripted class, starving the periphery. Or leave it alone because students love it, ignoring the two thirds for whom love isn't learning.","sources":["09-in-search-of-deeper-learning","03-intellectual-lives-of-children","00-foundational-papers","05-10-to-25","11-improvement-in-action"]},{"id":"k20","title":"The donor and the class sizes","scenario":"A local donor, Mrs. Hartley, offers $600,000 over three years. Her stated preference is to cut K-3 class sizes from 24 to 18: \"Everyone knows small classes are better. My grandchildren's school has 15.\" With eight K-3 classes, that means hiring four more teachers. At roughly $95,000 each fully loaded, that is $380,000 a year, so the gift would fund the reduction for about a year and a half. You would also need four classrooms you don't have, and the local teacher market is tight: you filled your last opening with your third choice. Your own plan needs $200,000 a year: an instructional coach, release time for TLCs and peer observation, and high-dosage small-group tutoring for the roughly 20% of K-2 students below benchmark on your decoding screener. Mrs. Hartley says she will \"let the experts decide,\" but she wants a \"visible result\" she can show her foundation board in eighteen months. She would also like to name something after her late husband, a former teacher.","tension":"t13","question":"What do you propose to Mrs. Hartley? Which two authors are arguing in your head?","considerations":["What does the evidence say about class-size reduction, including scaled implementations?","What happens when the gift runs out in eighteen months?","How does hiring four more teachers in a tight market affect average teacher quality?","What is the benefit per dollar of targeted tutoring and teacher development?","What visible result can you honestly promise?"],"model_answer":"**Tension:** t13 (Structural reform vs instructional reform); also t06 (Selecting teachers vs developing them).\n\nPropose your plan, framed as \"small classes where it matters most.\" Offer a visible result you can actually deliver, and a naming opportunity that honors a teacher.\n\nClass-size reduction has real but modest positive effects, and it is expensive per unit of gain. Tennessee's STAR experiment found benefits. California's statewide rollout diluted them, partly because rapid hiring pulled less experienced teachers into classrooms (`10-creating-the-schools-our-children-need`) [E]. Your situation has both risks. Four hires in a market where you already went to your third choice would likely lower average teacher quality. And the money runs out at eighteen months, leaving either layoffs or a budget cliff. Tension t13 applies: class size changes the container; instruction and adult learning change the contents. Spend change capacity there first.\n\nThe alternative targets the same intuition, more attention for young children, where it pays most. High-dosage small-group tutoring for students behind in early reading has strong support
