e drives comprehension; [H] for exact time allocations.","Strategies briefly, inside content. Comprehension monitoring and summarizing are taught in short episodes within content lessons, not as a skill-of-the-week strand. Tag [E] for diminishing returns, [H] for the dose.","Writing embedded in every unit, sentence level first. Because/but/so, sentence combining and outlines about the content being studied, building toward paragraphs by the upper grades. Tag [E] for the principles, [H] for the specific method.","Fix the sequence school-wide. The topic sequence is shared across classes and years, so the Year 3 teacher can assume what Year 2 taught, and retrieval of earlier topics is built into later units. Tag [H] for the particular sequence; [V] for the choice of which knowledge matters.","Assess what you teach. Curriculum-embedded checks on the content and vocabulary taught, plus decoding screens, sit alongside external tests, and the board is told in advance that external reading scores may lag for two or three years. Tag [H].","Resulting policy: in K-2, literacy time is split roughly 40% code and 60% knowledge and language, then becomes knowledge-dominant from grade 3; content subjects are daily; writing about content is daily in every subject. The split is [H], with a prediction to check: decoding benchmarks met by end of grade 2, and rising scores on curriculum-embedded knowledge and vocabulary measures each term."]},"hinge":[{"q":"A Year 4 student decodes fluently but comprehends poorly across many texts. Which lever is most likely to help?","options":["More comprehension-strategy lessons.","More silent reading time with self-chosen books.","Building background knowledge and vocabulary on the topics of the texts she reads, through coherent content units.","Phonics review."],"answer":2,"diagnoses":["The skills theory of comprehension. Strategies give a small, quick boost that saturates; more of them will not fix a knowledge gap.","The volume theory. Reading volume helps, but self-chosen texts that hop between topics build knowledge slowly and unevenly.","Correct. Once decoding is secure, comprehension depends mainly on topic knowledge and vocabulary (Simple View of Reading; Recht and Leslie).","Misdiagnosis. Decoding is not the bottleneck; the Simple View separates the two components for exactly this reason."]},{"q":"Wiliam argues curriculum choice is a high-leverage decision mainly because:","options":["A good curriculum is a substitute for good teachers.","It shapes what is actually taught at low marginal cost, and coherence across years lets knowledge compound; textbook choice alone has shown effects comparable to costlier reforms.","Curriculum standards are legally required.","Students prefer structured content."],"answer":1,"diagnoses":["Overstates it. Wiliam pairs curriculum with teacher development; a curriculum can still be taught badly (adoption is not enactment).","Correct. The argument is benefit per unit cost plus compounding coherence.","A compliance reading; legal requirement says nothing about leverage.","A preference reading; learner preference is a poor guide to what produces learning."]},{"q":"Which claim is best tagged [V] rather than [E]?","options":["Systematic phonics improves decoding for most children.","Background knowledge improves comprehension of a text on that topic.","Every child should study the history of their own country before other countries' histories.","Writing about content tends to improve learning of that content."],"answer":2,"diagnoses":["Over-tagging settled evidence as a value.","Over-tagging robust evidence as a value.","Correct. It is a choice about which knowledge matters; evidence can inform the sequence but cannot settle what a community wants children to know.","Over-tagging. The principle has modest positive evidence ([E]); a specific method would be [H]."]},{"q":"A board member cites the Core Knowledge lottery study as proof that a knowledge curriculum closes the income achievement gap. What is the most accurate response?","options":["Agree: a lottery design proves the curriculum caused the gains.","Encouraging but not proof: the paper was not peer-reviewed at the time, the curriculum cannot be separated from other features of the schools, the low-income estimate rests on about 16 students at one school, and gains plateaued after grade 3.","Reject it: charter school studies are always biased.","It is irrelevant, because reading gains do not matter if students are happy."],"answer":1,"diagnoses":["Confuses a strong design for the school effect with proof of the curriculum's specific effect and of gap-closing.","Correct. The mechanism is well supported; the size of effects on general tests and the gap-closing claim are [H]. Plan to measure your own effects.","Dismisses evidence by category. Lottery studies are among the better designs available; the issue is what exactly they can attribute.","Sets up a false trade-off and sidesteps the evidence question."]},{"q":"Two years after adopting a highly rated knowledge-building curriculum, observers find most comprehension lessons are worksheet-style standards tasks. What is the best next step?","options":["Switch to a different curriculum with a higher rating.","Invest in curriculum-specific coaching, observe for lessons focused on the text's meaning, align internal assessments to the content, and remove competing test-prep materials.","Add a comprehension-strategies program on top.","Accept it; the curriculum is in place, so results will follow."],"answer":1,"diagnoses":["Treats an enactment problem as a selection problem; the same gap would likely reappear with a new product.","Correct. Adoption is not enactment (the SRI finding: about two-thirds of lessons stayed surface-level). The lever is implementation support and aligned measures.","Pulls instruction further toward content-free skills practice, the pattern the curriculum was meant to replace.","Confuses the intended curriculum with the enacted one; outcomes depend on what is actually taught."]}],"brief_prompt":"Add a K-5 knowledge sequence sketch (about six science and social studies topics per year is enough) and your literacy time allocation for K-2 and grades 3-5. Add the writing routine you will use across subjects. Add one paragraph, explicitly marked [V], on how the school will decide what knowledge counts and who is involved in deciding. Finally, rewrite your 7-year-old's Tuesday in February so it shows both tracks.","deeper":["books/06-beyond-the-science-of-reading.md#Ch 2 — Why the Reading Crisis Is Actually a Learning Crisis","books/06-beyond-the-science-of-reading.md#Ch 5 — How Writing Instruction Can Harness the Power of Cognitive Science","books/06-beyond-the-science-of-reading.md#Evidence strength & limits","books/10-creating-the-schools-our-children-need.md#Section 3 · Ch 9 — Why Curriculum Matters","books/10-creating-the-schools-our-children-need.md#Section 3 · Ch 10 — A Knowledge-Rich Curriculum","books/01-how-learning-happens.md#Ch 11 — What you know determines what you learn"]},{"id":"m6","num":6,"title":"Formative assessment as the engine of the classroom","level":"Design","minutes":90,"sources":["07-embedding-formative-assessment","10-creating-the-schools-our-children-need","01-how-learning-happens","02-scienceblind","05-10-to-25"],"hook":"Ruth Butler handed back students' work in three ways: comments only, grades only, or grades plus comments. Only one group improved on the next task. Which one, and what does that do to the gradebook you were planning to build?","attempt":{"prompt":"Write a single multiple-choice question (four options) for the end of a Year 8 lesson on photosynthesis. Its job: tell the teacher, in under a minute, whether to move on tomorrow or reteach. Then, for each wrong option, write one sentence on what a student who picks it must be thinking and what the teacher should do about it. Finally, write one sentence on how the school would make sure every teacher actually uses questions like this, not just on the day of the training. Do it cold; you will compare it to the design rules below.","minutes":12},"objectives":["Explain what makes an assessment formative (the decision it changes, not the instrument), and why the short cycle carries most of the value.","Write a hinge question whose every distractor diagnoses a named misconception, with a pre-set decision threshold.","Design a grading and feedback policy grounded in Kluger & DeNisi and Butler, and say which parts are evidence and which are cadence guesses.","Design a teacher learning community (TLC) that changes habits rather than shares ideas, using choice, flexibility, small steps, accountability and support.","State a realistic whole-school effect size for formative assessment (about 0.1 SD at scale) and explain why the famous 1998 numbers were larger."],"ideas":[{"title":"Formative is a use of evidence, not a kind of test","tag":"E","body":"Most people hear *assessment* and think *test*. Wiliam and Leahy move the word from the instrument to the decision: an assessment is formative **to the extent that** evidence of learning is elicited, interpreted and used, by the teacher, the student or a peer, to make a better next step than would have been made without it. The same ten-question quiz is formative on Monday if the teacher regroups students on Tuesday because of it, and merely summative if the scores go into a tracker nobody opens until report cards.\n\n**Three cycle lengths.** Long cycle (terms, across units); medium cycle (within and between units, days to weeks); short cycle (minute by minute, day by day). Most school data systems, such as benchmark tests and termly dashboards, run on the long cycle and rarely change Thursday's lesson. The payoff concentrates in the short cycle, because that is where decisions about the students in front of you actually change. Product analogy: the quarterly revenue report versus an alert that fires while the incident is still live. Both are data; only one changes what you do in time.\n\n**Decision-driven data collection.** Reverse the usual order. Do not collect data and then ask what it means. Name the decision first (move on or reteach? which four students need me at the back table?) and design the smallest piece of evidence that informs it. This one habit prevents most dashboards nobody acts on.\n\n**Where the idea came from, and how big the effect really is.** Scriven (1967) distinguished formative from summative evaluation of curricula; Bloom carried the word into mastery learning. Black & Wiliam's 1998 review of roughly 250 studies (popularized as *Inside the Black Box*) reported gains typically around 0.4 to 0.7 SD, largest for lower achievers. That number built a movement, and it is too high to plan with. It came from a narrative synthesis, not a formal meta-analysis. Bennett (2011) called the concept ill-defined; Kingston & Nash (2011) found a weighted mean nearer 0.2 and few high-quality studies. Wiliam has conceded the 1998 figures were not precise estimates. The KMOFAP project (1999-2001, about 24 maths and science teachers) found roughly 0.3 SD on external measures, and its main lesson was that teachers could not simply be told the research; they had to rebuild practice in their own rooms over time.\n\nThe strongest test is the **EEF randomized trial of the Embedding Formative Assessment programme**: 140 English secondary schools, about 25,000 pupils, monthly TLC workshops run from resource packs, plus peer observation. Result: about **two months' additional progress** on GCSE Attainment 8 (effect about 0.09; 0.11 excluding schools already running something similar), with a very high security rating.\n\n**How to hold this.** Plan for roughly 0.1 SD across a whole school over two years from a cheap, scalable programme. That is not magic, but at its cost it is among the best bets available (Module 8 does the comparison). Treat anyone promising 0.5 at scale as a vendor, not a researcher; the fall from 0.4-0.7 in small studies to about 0.1 at scale is ordinary scale-up decay, not failure.\n\n**Folk theory to retire:** formative means low-stakes quizzes plus a data platform. Stakes and frequency do not define it; use does. Frequent *grading* can even do harm (see the feedback idea below)."},{"title":"Make every student's thinking visible: hinge questions and the elicitation toolkit","tag":"E","body":"Teaching is contingent: you cannot choose the next move without knowing what students currently think. The default classroom gets that evidence from raised hands, meaning the three confident volunteers. That is a biased sample, like a satisfaction survey only happy customers answer. A teacher who hears three right answers and moves on has learned almost nothing about the other 27.\n\n**The core techniques**\n- **No hands up.** Hands are for asking, not answering. The teacher chooses, often at random (named sticks, a randomizer). Everyone has to think because anyone may be called, and the teacher gets a representative sample. Pair it with norms like *I don't know yet, come back to me* or it becomes a status threat, which Yeager (Module 3) predicts adolescents will resist.\n- **Wait time.** Mary Budd Rowe found teachers typically wait about one second after asking; three seconds or more produces longer, better answers and wider participation. Probably the cheapest intervention in this course.\n- **All-student response.** Mini-whiteboards, ABCD cards, finger votes, polls. Everyone answers at once, so you see a distribution, not an anecdote.\n- **Exit tickets.** One question at the door; sort answers into piles; tomorrow's opening changes. If tomorrow does not change, it was a ritual.\n- **Interpretive listening** (Brent Davis): listen to understand what the student is thinking, not only to check whether they said the answer you were waiting for.\n\n**The hinge question: the smallest complete unit of formative assessment.** It sits at the point where the lesson forks. Design rules: every student answers; students need about a minute; you can read the room in about 30 seconds; it is hard to get right for the wrong reason; and, the rule most people miss, **every wrong option maps to a specific, known misconception**, so a wrong answer tells you *what* to fix, not only *that* something is wrong. Set the threshold before you ask (for example: if nearly all are right, move on and pull the few aside; otherwise reteach a different way).\n\nThis is where Module 2 pays off. Shtulman, Vosniadou and Posner showed that wrong answers are systematic; they come from coherent intuitive theories. **A good distractor is a named intuitive theory.** For photosynthesis, the option *most of a tree's mass comes from the soil* is the soil-as-food theory that van Helmont's willow experiment overturned. A recall question (*which gas do plants take in?*) cannot catch it: a student can recite *carbon dioxide* and still believe the mass comes from the ground, which is Vosniadou's synthetic model in action.\n\n**Institutional move.** Diagnostic questions are hard to invent live, so treat them as **curriculum assets**: a school-owned bank of hinge questions per unit, each with its distractor rationales, maintained like a shared test suite and improved when data shows a distractor nobody picks. Put whiteboards in every room. Make no-hands-up and all-student response school-wide defaults so students meet the same routine in every class.\n\n**Evidence honesty.** Wait time and the general value of eliciting and using evidence have research behind them. Most named techniques (hinge questions, exit tickets, lolly sticks) are practitioner-derived and have not been isolated in randomized trials. They are bets grounded in mechanism and in the tested package, not individually proven components. Tag the bank [H], the principle [E]."},{"title":"Feedback can hurt: grades, comments, and what the student does next","tag":"E","body":"Feedback feels obviously good. The evidence says it is a powerful drug with a real rate of harmful side effects.\n\n**Kluger & DeNisi (1996).** A meta-analysis of about 600 effect sizes. Feedback improved performance on average, but in roughly **38% of cases it made performance worse**. The pattern: feedback that directs attention to the self (praise, ranking, ego, *you're so clever*) tends to hurt; feedback directed at the task and how to improve it tends to help. Hattie & Timperley (2007) give the complementary levels: task, process, self-regulation, self. The self level is the weakest.\n\n**Butler (1987/1988).** Students got comments only, grades only, or grades plus comments. Only the comments-only group improved. Adding a grade wiped out the comment: students look at the number, compare it with a neighbor's, and stop reading. Hence **comment-only marking** on formative work, or grades delayed until the student has acted on the comments. Caveat: Butler's samples were small and specific; the pattern has been conceptually replicated rather than tested at scale.\n\n**Feedback is defined by use.** Ramaprasad (1983): feedback is information about the gap between where the learner is and where they need to be, *used to close that gap*. Information nobody uses is not feedback; it is data. Two practical rules follow. Feedback should be **more work for the recipient than the donor**, and it should look forward (what to do next) rather than narrate what went wrong. Think of a coach's correction, not a verdict.\n\n**Techniques that make students do the work**\n- **Find it and fix it**: tell the student there are five errors in this section, not where they are.\n- **Focused marking**: comment on one or two criteria, not everything.\n- **Whole-class feedback**: read the whole set, write the four or five most common issues on the board, each student decides which apply and redrafts.\n- **Protected redraft time** in lessons, so acting on feedback is part of the timetable, not homework that never happens.\n\n**Relationship is part of the mechanism.** The same comment can motivate or deflate depending on whether the student believes the teacher thinks they can improve. Yeager's wise-feedback study (Module 3) is the sharpest demonstration: a short note stating high standards and belief in the student raised essay revision among Black seventh graders from about 17% to about 71%. Boekaerts' model explains why: at every moment a student is choosing between a growth pathway (engage with the task) and a well-being pathway (protect myself). Rankings, public leaderboards and frequent grades push students toward self-protection, which looks like laziness from the front of the room.\n\n**Policy consequences for your school.** Judge marking by what students do with it, not by how much red ink teachers produce. Ban or delay grades on formative work; require a student response to feedback; build redraft time into lessons. A bonus a product person will appreciate: this *reduces* teacher workload, because detailed written marking that nobody acts on is the most expensive low-value activity in most schools.\n\n**Folk theory to retire:** more feedback, and more detailed feedback, is always better. Volume is not the variable. Focus, task orientation, trust, and a required student action are."},{"title":"Clear targets, and students as resources for each other and owners of their learning","tag":"E","body":"The five strategies come from a simple grid (Leahy, Lyon, Thompson & Wiliam 2005; Thompson & Wiliam 2008): three processes (where the learner is going, where the learner is now, how to get there) crossed with three agents (teacher, peer, learner). The teacher-side strategies are **clarify intentions and success criteria**, **elicit evidence**, and **give feedback that moves learning forward**. The other two put students to work: **peers as learning resources** and **learners as owners of their learning**. One big idea sits over all five: use evidence of learning to adapt teaching to meet learning needs. The grid is useful as a shared observation and planning language across every subject.\n\n**Strategy 1: students cannot hit a target they cannot see.** Many students, disproportionately disadvantaged ones, fail not from lack of ability but from not knowing what quality looks like in a domain. But copying an objective off the board is an empty ritual; the aim is understanding, not announcement. Four distinctions do the work:\n- **Learning intention vs. task.** *Make a poster about volcanoes* is an activity. What is to be learned?\n- **Context-specific vs. context-free.** *Write to the council about the skate park* vs. *use evidence to support a claim*. Make the transferable intention visible so learning generalizes.\n- **Product vs. process criteria**: what finished work looks like vs. what you do to get there. Rubrics that say *some detail* vs. *a lot of detail* are close to useless.\n- **Exemplars beat descriptors.** Quality in complex work is often tacit (Sadler's guild knowledge). Students learn it by comparing and ranking real samples of work.\nYou may delay announcing the intention when announcing it would spoil an inquiry (this is where Kapur's generate-first lessons fit); the requirement is that by the end students know what they learned.\n\n**Strategy 4: peers as resources.** One teacher cannot give 28 students enough feedback. Slavin's synthesis sets the conditions for group work to beat individual work: **group goals** (the group succeeds together) *and* **individual accountability** (each member's learning counts, so nobody free-rides). Without both, group work is often worse than working alone. Peer assessment helps the *assessor* at least as much as the assessed, because judging work against criteria builds the sense of quality that self-assessment needs. Tools: two stars and a wish, pre-flight checklists before submission, reporter chosen at random from the group.\n\n**Strategy 5: learners as owners.** The long-run target is self-regulated learners who monitor their own understanding and pick strategies. Self-assessment is a skill that must be taught with criteria and exemplars; until then students' self-reports are poorly calibrated. Motivation is as much an outcome of successful learning as a cause of it (this echoes Module 3). Watch **traffic lights**, the classic lethal mutation: students show red, amber or green cards, the teacher never acts on the signal, and students learn to show green to avoid attention.\n\n**Design implications.** Curriculum documents should separate intentions from tasks and ship annotated exemplars at several quality levels [H]. All group work is designed with group goals plus individual accountability [E, Slavin]. Peer and self assessment are taught as explicit skills with common school-wide protocols from the early grades [H]. Minimize ego-involving displays such as public rankings and ability-labelled tables [E for the mechanism, V for the choice]."},{"title":"Teachers change habits, not knowledge: the teacher learning community","tag":"E","body":"This is the institutional half of the argument, and the reason Module 6 bridges into Institutions. The claim: teachers do not lack knowledge; they lack a way to change **habits**. Teaching is a real-time performance with hundreds of decisions an hour, most of them automatic. Knowing about hinge questions does not make you use one at minute 23 of a messy lesson, any more than reading about a golf swing changes yours. One-off workshops, conferences and inspirational speakers transmit knowledge and change little. Habit change needs practice in your own classroom, repeated over months, with follow-up, for about two years.\n\n**Five design principles for teacher change**: **choice** (teachers pick the techniques that fit their room), **flexibility** (adapt within limits), **small steps** (one or two changes at a time), **accountability** (commit to colleagues and report back; accountability for trying and reflecting, not for outcomes), and **support** (time, peers, materials, leadership backing).\n\n**The standard TLC spec**\n- **Size**: about 8-12 teachers. Smaller gets fragile when people are absent; larger leaves no time for everyone to report. Mixed subjects are fine, because the shared content is pedagogy. Led by a trained teacher leader who facilitates rather than lectures.\n- **Cadence**: monthly, roughly 75-120 minutes, for about two years. Monthly because teachers need three or four weeks to try a technique repeatedly; more often means nothing to report, less often means momentum dies.\n- **Agenda**: introduction; a short starter; **How's it going?** (the heart, often half the meeting: each teacher reports what they committed to try, what happened, what they would change); new learning; **personal action planning** (write down the technique for next month, and sometimes what you will stop doing to make room); review.\n- **Between meetings**: peer observation focused on what the *observed* teacher asked to be watched for. Developmental, never evaluative.\n\n**Tight but loose** (Thompson & Wiliam 2008). Be tight on the core theory (the big idea and five strategies) and on process (meetings, plans, observation). Be loose on which techniques each teacher adopts. Too tight kills ownership; too loose breeds **lethal mutations**, where a technique keeps its name and loses its active ingredient: no hands up where the same three students are always picked; traffic lights nobody acts on. Product analogy: tight on the API contract, loose on the implementation, with tests that check the contract.\n\n**Why it works (the causal story).** Repeated trial in real classrooms at spaced intervals targets habit directly; saying in front of colleagues that you will try something creates supportive accountability; improvement becomes normal rather than remedial; and packaged materials make it cheap to run without scarce experts. Evidence: the TLC model came out of ETS's Keeping Learning on Track work and was tested in the EEF trial described above (140 schools, about two months' extra progress). Which ingredients are necessary has not been isolated, so the parameters (size, cadence) are sensible defaults to tune [H], not optimized constants.\n\n**Leadership requirements.** Protect the time, usually by stopping lower-value things such as routine meetings or volume marking. Never use TLC content in performance evaluation [H: psychological-safety reasoning, not directly tested]. Keep the agenda on formative practice and do not let it drift into logistics. Wiliam's refrain: every teacher needs to improve, not because they are not good enough, but because they can always be better."}],"worked_example":{"title":"Decision: the school's assessment, feedback and teacher-learning policy","steps":["Start from the mechanism, not the tool. Kluger & DeNisi show feedback can lower performance when it points at the self; Butler shows grades cancel comments. So the policy question is not how much feedback but what kind, and what the student must do with it. [E]","Formative work gets comments only; grades appear at a small number of summative points per term, and only after students have acted on the comments for that unit. [E for the mechanism; H for how many summative points, which you will tune]","Every comment requires a student action in lesson time: redraft, find-and-fix, or answer three targeted questions. Marking is judged by the student response it produces, not by volume. Written marking load drops, which is itself a reason teachers will accept the policy. [E for task-focused feedback; H for the specific routines]","Every lesson contains at least one planned, all-student evidence point, a hinge question or whiteboard check, with a threshold set before it is asked; exit tickets are sorted and change the next lesson's opening. [E for eliciting and using evidence; H for this cadence]","The school owns a hinge-question bank per unit with distractor rationales keyed to named misconceptions from the conceptual-change literature, reviewed each term using response data. [H]","Success criteria are shared through annotated exemplars at several quality levels, co-constructed with students where possible; planning templates separate the learning intention from the task. [E for exemplars and criteria clarity; H for the template]","Every teacher joins a TLC: 8-12 people, monthly, 90 minutes, a two-year arc, the standard agenda, a personal action plan, and one peer observation per month on the observed teacher's chosen focus. Time comes from cancelling one routine meeting a month. TLC content never enters appraisal. [E for the package (EEF trial); H for the parameters; V for keeping it separate from evaluation]","Set expectations in writing: the target is about 0.1 SD of whole-school gain over two years, measured on the external measure, with hinge-question distractor rates and redraft rates as leading indicators. [E for the realistic effect size; H for the leading indicators]","Policy line for the brief: Formative work is for learning, so it gets comments that students must act on; teachers get better together, monthly, for years."]},"hinge":[{"q":"Which of these is a formative use of a test?","options":["A quiz returned with scores so students know where they stand","A quiz whose results the teacher uses to regroup students for the next two lessons","Any quiz that is low-stakes and not recorded","A quiz the teacher wrote herself rather than one from an external body"],"answer":1,"diagnoses":["Information-to-student equals formative. Knowing where you stand changes nothing unless someone makes a different next-step decision; a bare score can even push students into ego-involvement.","Correct. Formative is defined by use: evidence was elicited, interpreted, and it changed what happens next for specific students.","Stakes define formativeness. Low stakes help, but a low-stakes quiz whose results change nothing is not formative, and a high-stakes test can be used formatively.","Authorship defines formativeness. Who wrote the instrument is irrelevant; what matters is whether the evidence changes the next decision."]},{"q":"A hinge question is well designed if:","options":["About half the class gets it right","Each wrong option corresponds to a specific misconception and the teacher can act on the result in the same lesson","It requires an extended written answer so students show their full reasoning","It is asked at the very end of the lesson so it covers everything"],"answer":1,"diagnoses":["Difficulty-calibration theory, borrowed from test design. A hinge exists to support a decision, not to spread scores; if nearly everyone is right, that is useful information too.","Correct. Diagnostic distractors tell you what to fix, and a response that can be read in about 30 seconds lets the lesson change while it is still happening.","Rigor equals length. Extended answers cannot be read for 30 students in real time, so they cannot drive a decision at the hinge point.","Timing error. A hinge sits at the fork in the lesson, mid-lesson, so the lesson can still change; an end-of-lesson check is an exit ticket, which informs tomorrow instead."]},{"q":"A school runs a two-day formative assessment workshop with a famous speaker. Nine months later, practice is unchanged. What is Wiliam and Leahy's most likely explanation?","options":["The teachers are resistant to change","The techniques do not work in this school's context","Practice changes only through sustained, small, accountable steps with peer support; workshops transmit knowledge, not habits","The school needed a follow-up workshop to reinforce the message"],"answer":2,"diagnoses":["Attribution to disposition. This is the fundamental attribution error applied to staff; Bryk would say the system that delivered the workshop produced the result.","Evidence-does-not-transfer. The techniques were never actually tried, so the context was never tested; nothing can be concluded about fit.","Correct. Teaching is habitual real-time performance, and habit change needs repeated practice in one's own room with spaced follow-up, which is what the TLC structure provides.","More of the same. A second workshop repeats the delivery mechanism that failed; the missing ingredient is practice plus accountability over months."]},{"q":"A new principal requires every teacher to use traffic-light cards daily and checks for them on walkthroughs. What is the most likely result?","options":["Strong gains, because consistency across classrooms is what formative assessment needs","The cards appear in every room but teachers stop acting on the signals and students show green to avoid attention: a lethal mutation","Teachers will refuse outright, so nothing changes","Gains for younger students only, since traffic lights are a primary-school technique"],"answer":1,"diagnoses":["Consistency of surface equals consistency of mechanism. The active ingredient is the teacher acting on the signal; a walkthrough can see the cards but not the adaptation.","Correct. This plan is tight on the technique and loose on the idea, the reverse of tight-but-loose. It produces compliance displays whose active ingredient is gone. Better: tight on the big idea and TLC process, with teacher choice of technique.","Adoption-is-the-risk. Open refusal is rare; the realistic failure is quiet surface compliance, which is harder to detect.","Age-appropriateness theory. The problem is mutation under an evaluative mandate, not the age of the students."]}],"brief_prompt":"Add Section 6 (Assessment and feedback) and the TLC part of Section 7 (Adults) to your brief. Include: your grading policy (what gets comments, what gets grades, when), the required student response to feedback, the all-student evidence standard for every lesson, and the TLC spec (size, cadence, agenda, where the time comes from, separation from appraisal). Tag every sentence E/H/V. Append two hinge questions for a lesson in your core curriculum, each with a rationale for every distractor naming the misconception it detects and the pre-set move-on threshold. Write one prediction: what redraft rate or distractor rate would you expect to see by the end of term one if the policy is working?","deeper":["books/07-embedding-formative-assessment.md#Background you need first: Black & Wiliam (1998) and where \"formative assessment\" comes from","books/07-embedding-formative-assessment.md#Ch 2 — Your Professional Learning (the institutional mechanism: Teacher Learning Communities)","books/07-embedding-formative-assessment.md#Ch 4 — Strategy 2: Engineering Effective Discussions, Tasks, and Activities That Elicit Evidence of Learning","books/07-embedding-formative-assessment.md#Ch 5 — Strategy 3: Providing Feedback That Moves Learning Forward","books/07-embedding-formative-assessment.md#Evidence strength & limits","books/10-creating-the-schools-our-children-need.md#Section 3 · Ch 12 — Creating a Learning Environment for Educators","books/01-how-learning-happens.md#Ch 35 — Lethal mutations: the dirty dozen (new in the 2nd edition)"]},{"id":"m7","num":7,"title":"The grammar of school and where deeper learning lives","level":"Institutions","minutes":90,"sources":["09-in-search-of-deeper-learning","08-extraordinary-learning-for-all","10-creating-the-schools-our-children-need","01-how-learning-happens"],"hook":"Two researchers spent about six years and roughly 750 hours watching classes in 30 of America's most admired high schools, looking for deep learning. They found most of it in the same place in almost every school, and it was not the place the schools were built around. Where was it?","attempt":{"prompt":"You must pick a 9th-grade schedule. Option A: eight 45-minute periods of conventional subjects. Option B: four 90-minute blocks, one of which is a daily interdisciplinary studio where students build projects for a public exhibition. Choose one and defend it in about 200 words. Then predict, concretely, the most likely way your choice goes wrong by February of year one, and who notices first.","minutes":12},"objectives":["Describe what Mehta & Fine actually observed (method, rarity of depth in the core, the periphery pattern) and the limits of that evidence.","Explain the four case schools' signature strengths and failures, and why the authors' ideal combines the progressive vision with the no-excuses operating system.","Apply the mastery, identity and creativity lens, and the six periphery features, to redesign a core course.","Use Transcend's blueprint (aims, then student experience, then elements) and say which layers are open to community codesign and which are bounded by evidence."],"ideas":[{"title":"Deep learning is rare, and the grammar of school is part of why","tag":"E","body":"Jal Mehta (a Harvard sociologist) and Sarah Fine (a former English teacher) went looking for schools that had cracked **deeper learning**. They visited 30 high schools chosen for reputations for innovation or excellence, over about six years and roughly 750 hours of observation, shadowed students for whole days, interviewed students, teachers and leaders, and studied four schools in depth.\n\n**Their definition is the most useful tool in the book.** Deeper learning is where three things happen together:\n- **Mastery**: real understanding of a domain's knowledge and ways of reasoning.\n- **Identity**: the learner starts to see the domain as part of who they are (*I am a writer*, *I do science*).\n- **Creativity**: the learner moves from receiving the field to producing something within it.\nEach alone is common. Mastery without identity gives students who can pass the exam and never open the subject again. Identity without mastery gives enthusiastic students who cannot do the work. Creativity without mastery gives products that look impressive and contain little.\n\n**What they saw.** Even in schools selected *because* they were admired, most core classes were teacher talk, coverage, worksheets, recall questions, and students waiting for time to pass. Deep learning existed in pockets (a class here, a teacher there) in nearly every school and was almost never a property of the whole school. Shadowing whole days showed the student's experience to be fragmented: six or seven unrelated blocks, each with a different adult and different expectations, none requiring the student to own anything. Many students were compliant, bored, or strategically **doing school** (Denise Pope's term for performing grades without learning). Adults mostly did not know how the whole day felt. This matches decades of earlier observation research, such as Goodlad's *A Place Called School* (1984).\n\n**The diagnosis: the grammar of schooling.** Tyack & Cuban (1995) named the durable, taken-for-granted structures of school: age-graded classes, subject silos, fixed periods, Carnegie units (credit for seat time), one teacher per room, grades as currency. On top sits a transmission model: students receive a field's conclusions but never practice the field, and teachers work alone with little shared picture of good work. Reforms that ignore the grammar get absorbed by it. Product analogy: the grammar is the platform. Ship a feature that fights the platform's defaults and it slowly gets reshaped into what the platform wanted all along.\n\n**Two design consequences.** First, your structure (schedule, course grain size, how time and credit are counted) is itself a curriculum; it teaches students what school is for whether you intend it or not. Second, judge your school from the student's seat. Leaders shadowing a full student day, regularly, will see what showcase lessons and dashboards hide [H: well grounded descriptively; its effect on improvement is untested].\n\n**Evidence limits you must carry.** This is qualitative, comparative case research: careful and theory-building, not causal. Schools were chosen for reputation, not sampled. Depth was judged by trained observers, not measured through learning outcomes or transfer, so we never learn whether one school's graduates understood more mathematics than another's. The mastery-identity-creativity lens is the authors' own; a researcher from the explicit-instruction tradition might score the same lessons differently. Tag the *description* (depth is rare in the core) as [E, observational]; tag the prescriptions as [H]."},{"title":"Every school model has a signature failure","tag":"H","body":"Mehta & Fine profile four schools under pseudonyms. Read them as four architectures, each with a known failure mode you should put in your risk register on day one.\n\n**Dewey High (progressive, project-based; resembles High Tech High).** Strengths: interdisciplinary projects, public exhibitions, strong relationships, student voice, teachers designing their own curriculum; students felt known and liked school. Failure: quality varied enormously by teacher and project. Some projects were activity without learning; the widely cited example is students folding origami in maths who could not say what mathematics they were learning. Without explicit disciplinary goals and a shared, specific picture of excellent work, *project* became a container that could be full or empty. Radical teacher autonomy produced both the best and the weakest teaching, and there was no mechanism for spreading what the best teachers knew. Signature failure: **engagement without mastery**.\n\n**No Excuses High (a high-performing charter).** Strengths: the most organizationally impressive school in the study. A coherent instructional model, frequent observation and feedback, data use, a shared adult culture, and staff who kept studying and refining practice; strong test results for low-income students of color. It was a powerful **learning organization for adults**. Failure: for students it was largely joyless and controlled; they were rarely treated as thinkers. It raised floors, not ceilings, and burnout and turnover were real costs. Signature failure: **compliance without agency**.\n\n**IB High (International Baccalaureate).** The closest thing to a *system* for depth: an external curriculum, externally assessed tasks that demand analysis and sustained inquiry (Extended Essay, Theory of Knowledge), shared vocabulary, and a global professional community. Because the assessments demand depth, teaching to them pulls toward depth, the opposite of most state tests. Failures: IB and non-IB students effectively attended different schools, and depth depended on teachers who understood the philosophy rather than treating IB as a heavier syllabus. Signature failure: **a two-tier school**.\n\n**Attainment High (respected comprehensive).** Good conventional results, running on GPA, AP counts and admissions. Top-track students optimized for grades at the cost of curiosity and well-being; lower tracks got a thinner curriculum and lower expectations. Signature failure: **performance instead of learning**.\n\n**The synthesis that matters.** What No Excuses High did well (shared instructional language, coaching, tight feedback loops, adult learning) is exactly what Dewey High lacked, and vice versa. The authors' implied ideal: **a rich vision of learning run on a disciplined adult operating system**. From IB, add the strongest lever they found: **alignment**. When curriculum, assessment and professional learning all reward depth, teaching bends toward depth; when assessment rewards recall, it bends toward recall. Their conditions for moving from pockets to systems: a clear shared vision of deep work, specific enough to guide practice; organizational capacity for adult learning; alignment; restructuring parts of the grammar; making the core more like the periphery; equity by design (no enclave); and leadership that protects depth from accountability pressure.\n\n**Why this is tagged [H].** Each model is represented by one pseudonymous school. Reviewers (for instance in *Education Next*) argued the book gives no-excuses schools too little credit for measured gains among disadvantaged students. The four-way comparison is a vivid, plausible design vocabulary, not a verdict on the models. Use it to ask: whichever model you lean toward, what is its known failure, and what will you build on day one to prevent it?"},{"title":"The periphery out-teaches the core, so use it as the prototype","tag":"H","body":"The book's most cited finding: across the 30 schools, the most consistent sites of deep learning were **electives and extracurriculars**: theatre, debate, robotics, Model UN, the newspaper, music, athletics, some arts and technical courses. There students showed mastery, identity and creativity together, often in the same building where the core felt flat.\n\n**Why the periphery works (six features)**\n1. **Choice**: students opt in, which brings motivation and belonging.\n2. **Purpose and real performance**: a game, a show, a competition, a publication, with a real audience and real stakes.\n3. **Apprenticeship**: students do the actual activity of the field, not a school version of it, alongside adults who practice it.\n4. **Community across ages**: older students coach younger ones; novices see what expertise looks like; there is a path from newcomer to leader (Lave & Wenger's legitimate peripheral participation).\n5. **Time and iteration**: rehearsals and drafts, where failure is expected and useful.\n6. **Identity**: students become *a debater* or *an actor*, not a student taking a course.\nThe core is required, coverage-driven, individually graded, age-segregated and detached from real practice; it reverses every one of these features. Schools treat the periphery as optional and cut it first, yet it is where the learning they claim to want most often happens.\n\n**The caveats are large.** Students who choose debate were already motivated (selection). The periphery faces no state test and has smaller, self-selected groups, so the comparison is not like for like. Voluntariness is hard to transplant into a required course. And, crucially for this curriculum, **the periphery is full of explicit instruction**. Coaches drill, directors model, editors mark up drafts line by line. Kirschner, Sweller & Clark's warning against minimal guidance for novices is not contradicted here; the periphery works partly because it is highly guided. *Authentic* means authentic purpose and audience, not absence of teaching. Brown, Collins & Duguid's situated-cognition claims were likewise criticized by Anderson, Reder & Simon (1996) as overstated; the reconciliation is cognitive apprenticeship: explicit modelling and scaffolding toward authentic practice.\n\n**Deeper teaching in the core.** A minority of core teachers, in every type of school, produced depth. They shared a **disciplinary stance** (the subject as a living field of inquiry, not a topic list), treated students as apprentice practitioners, combined **rigor with joy**, used apprenticeship moves (model, scaffold, hand over), and covered fewer topics more deeply. Most had built that capacity outside or despite their school: graduate study, writing projects, earlier careers. Hence the **symmetry principle**: teachers need the conditions the school wants for students (mastery, identity, creativity, community). Teachers who never learned deeply in a field struggle to create depth for others.\n\n**The design move.** Treat the periphery as the prototype for the core, not a reward for finishing it. Ask of every core course: What is the performance? Who is the audience? Who is the more expert practitioner? How does a novice become a leader? Where does student choice enter? Then keep what makes the core the core: a knowledge sequence, explicit teaching for novices, and mastery checks. Do not solve this by adding a studio block and leaving the core alone; that recreates the finding inside your own timetable, with the depth in the new block and the core still shallow.\n\n**Tag honestly.** The periphery pattern is a strong, recurring description [E, observational, selection-confounded]; importing its features into required courses is a hypothesis [H] you will test."},{"title":"Designing with a community: aims, experience, elements, and where voice is bounded","tag":"V","body":"Mehta & Fine show what is wrong with the student experience. Samouha, Wetzler & Henry Wood (Transcend) offer a process for designing a better one *with* the people who will live in it. Read it as product development for schools, including the parts of product development that go wrong.\n\n**The target.** **Graduate Aims** in three areas, synthesized from more than 30 outcome frameworks: **intellectual prowess** (deep knowledge and the ability to use it), **wayfinding** (purpose, identity, self-direction, career and life navigation), and **well-being**. Then ten **Leaps**, shifts in the *student experience* from industrial-era patterns: for example rote activity to rigorous learning, irrelevance to relevance, isolation to connection, passive compliance to active self-direction, unequal expectations to high expectations with unlimited opportunities. The Leaps are a design language, not a model; a community prioritizes a few rather than claiming all ten (nobody makes every leap at once; two to four is a sensible start). Transcend's Leaps Student Voice Survey, with published psychometric reports, turns them into a leading indicator you can track each term.\n\n**The blueprint has three layers, designed top-down**: (1) aims and guiding concepts; (2) the **student experience**, meaning what a day, week and year actually feel like; (3) the **elements**: schedule, staffing, curriculum, assessment, culture, space, technology, partnerships, budget, policy. The classic failure is designing elements first (a device rollout, a new bell schedule) with no stated experience they are meant to produce. That is shipping infrastructure without a user story.\n\n**The process.** A diverse **design team** including students and families, deliberately recruiting the least-served voices. A repeating design cycle, used as **Map It** (whole-school vision), **Zoom In** (design one part of the experience in detail), **Test-Drive** (pilot with success measures set in advance), **Look Ahead** (keep, change or drop), then scale, re-map and routine maintenance. Tend **community conditions** (trust, urgency, shared vision, capacity) as deliberately as the design, because a technically good design the community does not own gets quietly reverted. **Codify** what works: Van Ness Elementary's whole-child routines spread to other schools because they were written down as teachable practice. Northern Cass shows the deepest structural change (competency-based progression, no letter grades) and how much work it pushes into transcripts, reporting and teacher workload. Map your **policy envelope** (seat-time rules, testing, credits, accreditation) early.\n\n**Evidence limits.** A practitioner framework by the organization that sells the process. There is no causal evaluation of community-based design. The four cases are selected success stories with uncontrolled outcomes. Transcend's large *Beyond Fine* analysis links better-reported experience to grades, test scores and attendance, but it is correlational and self-published. Competency-based education has a thin, mixed causal record. Several Leaps are value commitments, and *active self-direction* and *anytime, anywhere learning* are in real tension with the novice-guidance evidence.\n\n**The rule that makes it safe.** Community voice is excellent at defining **needs and priorities** and poor at validating **mechanisms**. If a focus group asks for teaching matched to learning styles, take the underlying need seriously (*instruction doesn't fit my child*) and answer it with evidence-based customization such as pace, formative feedback and choice of context, not with a debunked mechanism. Standardize the mechanisms (retrieval, feedback, TLCs, the default lesson, the knowledge sequence within a discipline). Codesign purpose, culture, the periphery, and knowledge priorities where the evidence is silent. Write down which layer is open, in the founding compact, before the first session."}],"worked_example":{"title":"Decision: how does the school bring apprenticeship into the core, not just the periphery?","steps":["Name the features that make the periphery work: choice, real purpose and audience, apprenticeship to a practitioner, mixed-age community, iteration, identity. [E, observational and selection-confounded]","Reject the tempting design: adding a studio block and leaving the core untouched. That reproduces Mehta & Fine's finding inside your own timetable: depth in the new block, shallow core. [H]","Redesign each core disciplinary course so every unit or term ends in a product with a real audience (a published piece, a public problem-solving defense, a data report for a local body), drafts are expected and critiqued, and the teacher's own disciplinary practice is visible. [H]","Keep the knowledge sequence and explicit teaching. The product is the destination of a knowledge-building unit, not a replacement for it; the periphery itself is heavily coached, and novices still need guidance (Kirschner, Sweller & Clark). [E for novice guidance; H for the combination]","Guard against Dewey High's failure: each product has explicit disciplinary learning goals, annotated exemplars and a critique protocol, and the maths or science in it is checked by a hinge question or short assessment, not inferred from how good the poster looks. [H, informed by E from Module 6]","Borrow No Excuses High's operating system without its theory of learning: shared instructional language, frequent developmental observation, common planning, and TLCs, pointed at the richer vision. Track joy and agency as outcomes, or control-heavy routines will quietly optimize them away. [H; V for tracking joy]","On structure there is a real tension. Mehta & Fine recommend restructuring parts of the grammar (longer blocks, fewer topics); Wiliam's evidence says structural change alone buys little and eats change capacity. Resolution: keep the schedule mostly conventional in year one, lengthen blocks only where a specific instructional need requires it (for example, lab or studio work), and test that change as an explicit hypothesis. [H]","Hire and develop teachers who have done the discipline, not only taught it, and give them adult learning with its own depth (symmetry). [H]","Protect and fund the periphery anyway, with mixed-age leadership ladders and access for every student. It is where identity lives. [V]","Policy line for the brief: Every core course, every term, one authentic product, built on a knowledge sequence, and assessed for mastery."]},"hinge":[{"q":"According to Mehta & Fine, the main reason electives and clubs often show deeper learning than core classes is:","options":["Students choose them, so they are more motivated","They combine real purpose and audience, apprenticeship to practitioners, mixed-age community and iteration, as well as choice","They are not tested","They have smaller classes"],"answer":1,"diagnoses":["Choice-only theory. Choice is one of the features, and selection is a real confound, but it cannot explain why the same students go flat in required courses that lack the other features.","Correct. The periphery bundles several structural features the core reverses; choice is one of six, alongside purpose, apprenticeship, community, iteration and identity.","Testing-kills-learning theory. The lack of test pressure is an acknowledged confound, but IB High shows that assessment demanding depth can pull teaching toward depth.","Resource explanation. Group size differs, but Module 8 shows class size alone has modest effects; the features that matter are about the nature of the work."]},{"q":"A founder plans a project-based school with no traditional courses. Mehta & Fine's evidence suggests the most likely failure mode is:","options":["Students will be bored","Disciplinary mastery will be uneven, and some projects will be activity without learning","Teachers will refuse to teach that way","Parents will withdraw their children"],"answer":1,"diagnoses":["Engagement-is-the-risk. Dewey High's students were engaged and liked school; engagement was not the problem.","Correct. This is Dewey High's signature failure (the origami-in-maths problem): without explicit disciplinary goals, exemplars and a system to spread good designs, quality depends on which teacher you get.","Adoption-is-the-risk. Teachers at Dewey High chose it and embraced the model; autonomy produced variance, not refusal.","Market-is-the-risk. Possible, but not what the observational evidence speaks to; the evidence is about uneven rigor."]},{"q":"Deeper learning in Mehta & Fine's sense requires:","options":["Student choice of topic","Mastery, identity and creativity together","Interdisciplinary content","A technology-rich environment"],"answer":1,"diagnoses":["Choice equals depth. Choice can support identity, but a freely chosen shallow project is still shallow.","Correct. Each alone is common; their combination is what the authors observed in the richest learning, and it gives you a test to apply to any course.","Integration equals depth. Interdisciplinary units can be as shallow as any other; depth is about the learner's relationship to a field.","Tools equal depth. Nothing in the definition concerns technology; Module 1's point that medium is not mechanism applies here too."]},{"q":"Which conclusion does Mehta & Fine's evidence actually support?","options":["Extracurriculars cause deeper learning, so required academics should be replaced with clubs","Project-based schools produce better learning outcomes than no-excuses schools","Deep learning was rare in the core classes even of admired schools, and recurred in the periphery; this is a robust pattern, not causal proof","Longer blocks produce deeper learning"],"answer":2,"diagnoses":["Correlation-as-causation plus misreading the prescription. The evidence is selection-confounded, and the authors want the core made more like the periphery, keeping mastery, not academics abolished.","Outcome claim the study cannot make. There were no learning-outcome measures and one school per model; the authors praise No Excuses High's adult systems.","Correct. The strength of the book is descriptive: a recurring pattern across 30 reputationally selected schools. The prescriptions are well-grounded hypotheses.","Structure-as-solution. Longer blocks are one of the authors' proposals, not a finding; Wiliam's evidence cautions that structure alone changes little."]},{"q":"Your founding design team's family focus groups strongly favor teaching students in their preferred learning style. Using Transcend's process as this module bounds it, you should:","options":["Adopt it: community ownership is a design requirement","Ignore it: community input should not touch pedagogy","Treat it as evidence of a real need (instruction does not fit some children) and meet that need with evidence-based customization such as pace, feedback and choice of context","Put it to a vote of the whole community"],"answer":2,"diagnoses":["Voice-validates-mechanism. Ownership matters, but communities can converge on popular, ineffective ideas; learning-styles matching is not supported by evidence.","Voice-is-noise. This discards a real signal and damages the community conditions the design depends on; the need is legitimate even though the proposed mechanism is wrong.","Correct. Voice defines needs and priorities; evidence constrains mechanisms. The founding compact should say which layer is open to codesign.","Majority-rule-on-mechanism. Voting settles values questions, not empirical ones."]}],"brief_prompt":"Rewrite the 16-year-old's Tuesday in Section 2 of your brief so that at least one core course shows apprenticeship features (a real product, an audience, drafts, a practitioner-teacher), and note what you deliberately kept conventional and why. In Section 1, draft Graduate Aims across intellectual prowess, wayfinding and well-being, and pick two to four priority experience shifts. Add a paragraph on community codesign that names which layers are open (purpose, culture, periphery, knowledge priorities where evidence is silent) and which are fixed by evidence (core mechanisms), tagged V and H. Add to your risk register the signature failure of whichever model your school most resembles, and the day-one countermeasure.","deeper":["books/09-in-search-of-deeper-learning.md#Ch 1 — The State of Deeper Learning in American High Schools","books/09-in-search-of-deeper-learning.md#Ch 3 — No Excuses Schools: Benefits and Tradeoffs (No Excuses High)","books/09-in-search-of-deeper-learning.md#Ch 6 — Deeper Learning at the Margins: Why the Periphery Is More Vital than the Core","books/09-in-search-of-deeper-learning.md#Ch 7 — Deeper Teaching: Rigor, Joy, and Apprenticeship","books/09-in-search-of-deeper-learning.md#Evidence strength & limits","books/08-extraordinary-learning-for-all.md#Ch 2 — Community-Based Design","books/08-extraordinary-learning-for-all.md#Evidence strength & limits","books/01-how-learning-happens.md#The 5-10 ideas you must carry out of this book"]},{"id":"m8","num":8,"title":"What actually moves outcomes: teachers, policy, and the evidence","level":"Institutions","minutes":90,"sources":["10-creating-the-schools-our-children-need","01-how-learning-happens","11-improvement-in-action","07-embedding-formative-assessment","06-beyond-the-science-of-reading"],"hook":"Wiliam's rough summary of the research: with the most effective teachers, students learn in about half the usual time; with the least effective, it takes about twice as long. If teachers matter that much, why does he argue that trying to hire your way to a great faculty barely moves the average?","attempt":{"prompt":"You have $600k a year of discretionary budget for a 400-student school. Options: (1) cut class sizes from 26 to 22; (2) hire an instructional coach for each department; (3) buy 1:1 devices plus adaptive maths and reading software; (4) raise salaries 8% to attract stronger applicants; (5) anything else you can name. Allocate the money and justify each line in one or two sentences. Then write down the one number you would most want to know before committing, and why.","minutes":12},"objectives":["Evaluate any initiative on five criteria: effect on learning, cost in money and teacher time, scalability, opportunity cost, and time to impact.","Explain why teacher quality is the biggest in-school lever, yet selection, deselection and incentive pay are weak ways to raise it.","Rank the common structural reforms (class size, choice, copying other countries) by evidence and cost, and explain the ranking.","Read an effect size and name its main traps: student age, test proximity, sample restriction, and scale-up decay.","State Wiliam's two priorities (knowledge-rich curriculum; developing existing teachers through formative assessment in TLCs) and defend them on cost-effectiveness."],"ideas":[{"title":"Think like a portfolio manager: benefit per unit of scarce resource","tag":"H","body":"*Creating the Schools Our Children Need* is the curriculum's resource-allocation book. Wiliam's starting point: education does not lack good ideas; it has too many good-sounding ideas competing for the same limited money, teacher hours and leadership attention. So the question is never *does it work?* (almost everything works a little, somewhere) but **is this the best use of what it consumes?**\n\n**Five criteria for every initiative**\n1. **Effect** on student learning, ideally expressed in months of learning for your students' age, not a raw effect size.\n2. **Cost**, in dollars *and* teacher hours. A free app that consumes three hours of teacher training and a weekly data meeting is not free.\n3. **Scalability**: does it work in ordinary schools with ordinary teachers, without the enthusiasts who designed it?\n4. **Opportunity cost**: what it pushes out of a full week. Every hour of meetings is an hour not planning, marking or resting.\n5. **Time to impact**: a decade-long lever is a different bet from a one-year one.\n\n**\"Everything works somewhere, nothing works everywhere.\"** Context changes the effect. Research cannot tell you exactly what to do; it can tell you which bets have the best odds. This is the same point Bryk makes as *what works, for whom, under what conditions* (Module 9). Borrow **mechanisms** that have causal evidence and test them locally; do not copy **policies** because they are attached to a famous school or country.\n\n**The binding constraint is usually teacher time, not money.** Wiliam's hardest leadership lesson: the job is **stopping things**, de-implementing good-but-not-best initiatives so the best ones get done properly. Initiative overload is the default failure mode of schools, and it maps precisely onto Module 1: a staff with too many simultaneous initiatives is a working memory with too many interacting elements. Nothing gets encoded.\n\n**Product translation.** You already know this pattern as prioritization by expected value per unit cost, with a roadmap that has a *not doing* list. Two differences matter. First, the variance is larger than in most product work, and your sample is tiny (one school), so humility about local effects is warranted. Second, the cost of a failed bet is paid in children's learning time, which you cannot refund, so the bar for untested structural bets should be higher, not lower.\n\n**Design rules for your founding document** [H for all; the logic is strong, but evidence on de-implementation itself is thinner than the argument for it]:\n- Name **two or three priorities** and publish a **not doing** list.\n- Every new proposal must name what it replaces, its expected effect in months, and its cost in teacher hours.\n- Budget teacher time explicitly, like money: hours per teacher per month for professional learning, planning and meetings.\n- Commit to a three-to-five-year horizon on the core priorities. Changing initiatives every year guarantees none of them embed.\n\n**Folk theory to retire:** a new school, free of legacy, should try many innovations at once because it can. Autonomy lets you choose well; it does not repeal the time budget."},{"title":"Teachers matter most, and you cannot select your way there","tag":"E","body":"The premise is not in dispute. Teacher quality is the largest in-school variable, and differences between classrooms in the same school dwarf differences between schools. Wiliam's summary (a rhetorical rounding of value-added research; exact multipliers vary by study): with the best teachers students learn in roughly half the time; with the weakest, about twice as long.\n\nThe surprise is what follows. Three popular ways to raise teacher quality are weak.\n\n**1. Hiring smarter people.** What you can see at hiring (degrees, certification, college selectivity, licensure scores, even subject-knowledge tests) predicts later effectiveness only weakly. Kane, Rockoff & Staiger (2008), in New York City, found certified, uncertified and alternatively certified teachers differed little on average, while variation *within* each group was huge. Teach For America evaluations show small positive effects in some subjects, not transformation. Raising entry bars also reduces supply, and in shortage subjects a higher bar can mean more vacancies filled by substitutes.\n\n**2. Firing weak teachers (deselection).** Hanushek estimated that replacing the bottom 5-10% of US teachers with average ones would bring national achievement near the top countries. The arithmetic works; the practice does not. **Measurement**: value-added estimates are noisy, with year-to-year correlations for the same teacher of roughly 0.2-0.5, so many teachers in the bottom group one year are not the next. The Gates MET project (2010-2013) showed classroom observation is unreliable unless you use multiple trained observers across multiple lessons. **Time**: deselection improves the workforce only as cohorts turn over, over a decade or more. **Supply**: replacements are often novices, who are on average less effective in their first years. **Climate**: a threat culture discourages risk-taking and collaboration and drives good people away. Removing a truly ineffective teacher is sometimes necessary: HR hygiene, not an improvement strategy.\n\n**3. Paying good teachers more.** Individual merit pay relies on that same unreliable measurement and can damage collaboration. The Nashville POINT trial (Springer et al. 2010; bonuses up to $15,000) found no significant effect; Fryer's NYC school-wide bonus study (2013) found none either. A loss-framed design in Chicago Heights (Fryer, Levitt, List & Sadoff 2012) did show effects, but that is thin evidence and hard to scale. The underlying point: most teachers already work hard. The bottleneck is knowing *how* to improve, not motivation. Pay competitively and fairly for recruitment and retention [V/H], but do not expect incentive pay to raise teaching quality [E].\n\n**What this means for a founder.** You cannot select your way to a great faculty, so design to **develop** whoever you hire. Teachers improve a great deal in their first few years (Rockoff 2004), and growth continues longer in supportive professional environments (Kraft & Papay 2014). A school where teachers visibly get better is also a retention strategy. Hire for disciplinary knowledge and **coachability**, and test both with job-relevant work samples (teach a short lesson, take feedback, reteach; respond to real student work) rather than trusting credentials or a single polished demo [H: plausible, test it in your own hiring]. Never base high-stakes decisions on single-year value-added or single observations [E]."},{"title":"Structural reforms change the container, not the contents","tag":"E","body":"The second half of Wiliam's list of reforms that will not help much is structural. Each has real evidence behind it. The point is not that it does nothing; it is that it does too little for what it costs, or does not survive scale.\n\n**Class size.** Tennessee STAR (1985-89) is one of the best randomized trials in education: K-3 classes of about 13-17 versus 22-25 produced gains of roughly 0.15-0.2 SD, larger for Black and low-income students. So small classes help, especially early. Then California reduced class sizes statewide in 1996 and got much smaller gains (Jepsen & Rivkin 2009). Scaling required hiring huge numbers of new, often uncertified teachers; stronger teachers moved to more advantaged schools; space ran out. The loss in teacher quality ate much of the benefit. Class-size reduction is also the most expensive recurring cost you can choose, because salaries are the biggest budget line, and it is hard to reverse. Founder rules: do not make small classes your main value proposition or spend on them before teacher learning [E]; targeted small groups for early reading or catch-up may capture much of the benefit at a fraction of the cost [H]; and if parents value small classes for being known and cared for, that is a legitimate value, so name it honestly as [V].\n\n**Copying other countries.** PISA and TIMSS show what is possible, but features of Finland, Singapore or Shanghai are tangled with culture, teacher status, demographics, private tutoring and social policy. A system can succeed despite a policy, not because of it, and many policy mixes produce high scores. Borrow mechanisms with causal evidence (for example, collaborative teacher inquiry of the lesson-study kind, adapted as a principle), not policies.\n\n**School choice and charters.** CREDO's national studies found average charter effects near zero with **very wide variation**; lottery studies of Boston charters and KIPP found large positive effects; some voucher programs (Louisiana, around 2013-15) showed negative first-year maths effects. Because variation *between* schools is small compared with variation *within* them, reshuffling students among schools has a limited ceiling. The charters that succeed do so because of what happens inside classrooms: curriculum, instruction, culture, teacher development.\n\n**The sentence to write on your wall: being a new or independent school confers no advantage by itself.** Autonomy is only an asset if you spend it on the classroom-level levers. Every founder is tempted to believe the new container is the innovation. It is not. The contents are.\n\n**How this connects.** Mehta & Fine (Module 7) reached a compatible conclusion from observation: models, governance and structure did not reliably produce depth; adult learning and alignment did. Bryk (Module 9) explains the mechanism: structural reforms change one part of a complex system and assume the rest adjusts, which is why the same reform works in some places, fails in others, and averages out small.\n\n**Evidence strength.** STAR, CREDO and the lottery studies are strong. The comparative claim that teacher development beats class size per dollar is Wiliam's reasoned estimate from separate literatures, not a head-to-head trial [H for the ranking; E for the components]. Critics also note a possible double standard: the author's own field, formative assessment, gets a gentler reading. His case survives the smaller at-scale estimates (about 0.1 SD) on cost, but not his early doubling-the-speed rhetoric."},{"title":"Reading effect sizes without getting fooled","tag":"E","body":"An effect size (standardized mean difference) is the gap between two groups measured in standard deviations. It looks like a universal currency, which is exactly why it misleads. Vendors, consultants and league tables (Hattie's ranking is the famous one) compare numbers that cannot be compared. Four traps catch almost everyone.\n\n**1. Age.** Young children learn fast relative to the spread of scores; teenagers learn slowly relative to it. A year of normal growth is a large effect in the early grades and roughly 0.25-0.4 SD at secondary (Bloom, Hill, Black & Lipsey 2008). So an effect of 0.2 can mean a few weeks of extra learning for a 7-year-old and most of a year for a 15-year-old. **Translate effect sizes into months of learning for the age in question** before comparing anything.\n\n**2. The test.** A researcher-designed test closely aligned to what the intervention taught produces much bigger effects than a broad standardized test of the same subject. A narrow test measures whether students learned the taught content; a broad one measures whether it moved the general achievement you care about. Both are legitimate, but they are not the same number.\n\n**3. The sample.** Studying a restricted group (only struggling readers, only one ability band) shrinks the standard deviation and inflates the effect size. Timing matters too: a measure taken a week after the intervention flatters; one taken a year later tells you what lasted (Module 4's point that short-term performance lies).\n\n**4. Scale-up decay.** Small studies run by enthusiastic designers produce larger effects than the same idea run by ordinary teachers across many schools. Formative assessment is this module's own case study: roughly 0.4-0.7 in the 1998 review, about 0.3 in KMOFAP, about 0.1 in the 140-school EEF trial. Nothing failed. That is what scale does.\n\n**A practical reading protocol** for any claim that crosses your desk (a vendor deck, a board member's article, an AI tutoring pilot):\n- Who were the students (age, prior attainment), and how does that compare with yours?\n- What test, and who designed it? How long after the intervention?\n- Randomized, or a before-after comparison with no control?\n- Who delivered it: the designers, or ordinary staff?\n- What did it cost, including teacher time, and what would it displace?\n- Has it been replicated at scale, and what happened to the effect?\n\n**Worked contrast.** Two interventions each report 0.4. One was measured on 7-year-olds, with a researcher-built test, a week later. The other on 15-year-olds, with a standardized test, a year later. The second is far more impressive: older students, a broad test and a delayed measure all *deflate* effect sizes, so the same number represents a much larger real change.\n\n**Why a founder must own this skill.** Every week someone will offer you a number. Kraft (2020) and Simpson (2017) extended the critique of comparing effect sizes. The discipline is not cynicism; Wiliam's own recommendations are built on effect sizes, read carefully. It is the education version of refusing to compare conversion rates across different funnels, segments and time windows."},{"title":"The two bets: a knowledge-rich curriculum and developing the teachers you have","tag":"E","body":"Having ruled out the popular levers, Wiliam names two priorities. Almost everything else is lower.\n\n**Bet 1: curriculum.** Content and its sequence, and the materials teachers use, are a major and under-used lever, and cheap, because schools buy materials anyway. Randomized comparisons of elementary maths curricula (Agodini et al. 2010) and the Brookings analysis *Choosing Blindly* (Chingos & Whitehurst 2012) suggest that choosing between textbooks can produce differences comparable to expensive reforms at near-zero marginal cost. Distinguish the **intended** curriculum (specified), the **enacted** curriculum (taught) and the **achieved** curriculum (learned); improvement lives in the gaps between them. Adopting a curriculum does not mean it is being taught, which is Wexler's warning in Module 5.\n\nWhy *knowledge-rich*? Module 1's architecture: working memory is tiny, long-term memory is vast, and expertise is organized knowledge that frees working memory for thinking. Critical thinking, problem solving and creativity are not generic skills that transfer without content. Reading comprehension, once decoding is fluent, depends heavily on topic knowledge (Recht & Leslie 1988: weak readers who knew baseball out-comprehended strong readers who did not, on a baseball passage). And it is an **equity** lever: advantaged children pick up background knowledge at home, so a school that does not teach it systematically widens gaps. Protect elementary time for science, history, geography and the arts as knowledge-building, not only literacy and numeracy skills blocks. *Which* knowledge is a value choice [V], so make it explicitly with your community. Causal evidence for whole curricula is growing (a Core Knowledge charter lottery study, Grissmer et al. 2023, postdates the book); in 2018 Wiliam argued mainly from mechanism.\n\n**Bet 2: improve the teachers you already have.** Wiliam calls it *love the one you're with*. Most professional development as delivered (one-off workshops, generic inspiration) shows little measurable effect; TNTP's *The Mirage* (2015) found high spending and hard-to-detect results. The **content** of development should be classroom formative assessment, because it applies across subjects and ages, works on the short cycle, and has meaningful effects at low cost. The **process** should be TLCs: monthly, multi-year, teacher-chosen techniques, small steps, peer accountability (Module 6). Evidence published around or after the book strengthens the case: the EEF trial (about two months' extra progress across 140 schools) and syntheses of PD mechanisms such as Sims et al. (2021), which favor sustained, practice-focused designs. The exact TLC parameters remain sensible defaults, not proven optima.\n\n**Why these two together.** Shared, school-wide materials make teacher collaboration far more productive, because everyone is improving the same lessons. Formative assessment without a good curriculum adapts toward nothing; a good curriculum without formative assessment is tau
