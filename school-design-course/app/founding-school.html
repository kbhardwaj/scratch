their own heritage more strongly. *Cost:* some teacher attrition and less local responsiveness. *Evidence informs:* knowledge gaps widen inequality (`06-beyond-the-science-of-reading`), but that doesn't settle whose knowledge.\n- **V-05. Understanding is assessed; belief is never required.** *Who disagrees:* some science advocates, who want acceptance of evolution and climate science treated as a learning outcome; some religious families, who want alternatives presented. *Cost:* tension on both flanks (see k21).\n- **V-07. The Friday studio is protected even in test season.** *Who disagrees:* board members focused on accountability, and teachers of students far behind, who would rather have the time for intervention. *Cost:* 90 minutes a week of core time.\n\n**Common failures:**\n- Values listed with no dissenters (\"everyone agrees children matter\").\n- Values defended with evidence as if evidence settled them.\n- A register shorter than the number of [V] tags in the brief.","default_tag":"V","prompts":["Have you found every [V] in the brief and entered it here?","For each value: who would reasonably disagree (a real group, not a straw man), and what is their best argument?","What does the commitment cost (money, time, other goals, some families)?","Which values conflict with each other, and which wins when they do?"]}],"diagnostic":[{"id":"d1","statement":"Students learn better when they are taught in their preferred learning style (visual, auditory or kinesthetic).","correct":false,"folk_theory":"Learning styles: matching teaching to a student's preferred mode improves learning.","explanation":"People have preferences, but Pashler, McDaniel, Rohrer and Bjork (2008) found almost no studies with the design needed to test matching, and those that used it contradicted it. What helps everyone is combining well-designed words and visuals (dual coding), with the mode chosen by the content.","module":"m1"},{"id":"d2","statement":"Testing students is mainly a way of measuring learning; the learning itself happens during teaching.","correct":false,"folk_theory":"Testing is measurement only.","explanation":"Retrieval is itself a learning event. Recalling information strengthens it more than restudying (the testing effect; Roediger and Karpicke 2006), especially when feedback follows promptly. Low-stakes quizzing is one of the two high-utility techniques in Dunlosky and colleagues' 2013 review.","module":"m1"},{"id":"d3","statement":"Students who reread their notes several times usually feel more confident than students who quiz themselves, yet remember less a week later.","correct":true,"folk_theory":"Fluency means learning: if it feels easy and familiar, it has been learned.","explanation":"Rereading builds familiarity, a feeling of knowing, without building the ability to recall. Retrieval practice feels harder and produces better delayed retention. Learners and teachers systematically mistake performance during learning for learning itself.","module":"m1"},{"id":"d4","statement":"If a child confidently says 'the earth is round', they have no misconception about the earth's shape.","correct":false,"folk_theory":"A correct statement means a correct mental model.","explanation":"Vosniadou and Brewer (1992) found many children who said the earth is round held synthetic models: a flat earth plus a round one in the sky, or people living on a flat floor inside a hollow sphere. Generative questions and drawings reveal the model; the memorized sentence does not.","module":"m2"},{"id":"d5","statement":"A student can correctly explain on a test that seasons are caused by the earth's tilt and still reason, in a new question, that it is summer because the earth is closer to the sun.","correct":true,"folk_theory":"Once taught, a misconception is replaced.","explanation":"Intuitive theories are suppressed, not deleted. Students can repeat the taught explanation while the old theory still drives predictions in new contexts; even experts are slower and less accurate when intuition and science conflict (Shtulman and Valcarcel 2012).","module":"m2"},{"id":"d6","statement":"A 14-year-old who does not care about school mainly lacks motivation, which must be built before you can teach them.","correct":false,"folk_theory":"Motivation precedes competence.","explanation":"Motivation is largely downstream of competence and of how students read adult intentions. Self-efficacy grows mainly from mastery experiences, and adolescents respond to high standards paired with real support and respect (Yeager's mentor mindset). Teaching well, with success built in, is usually how motivation is built.","module":"m3"},{"id":"d7","statement":"For teenagers, adding a short, sincere statement of high standards and belief in them to critical feedback can substantially increase how many choose to revise their work.","correct":true,"folk_theory":"Feedback works through its content alone; tone and framing are soft extras.","explanation":"In the wise-feedback experiment (Yeager and colleagues 2014), about 71% of African American seventh graders revised with such a note versus about 17% in control, with the largest effects for students who distrusted school. The samples were small, and it works only when the standards and support are real.","module":"m3"},{"id":"d8","statement":"Letting students discover principles for themselves generally produces deeper learning than explaining the principles to them.","correct":false,"folk_theory":"Discovery is the natural and deepest way to learn.","explanation":"For novices, unguided discovery repeatedly loses to guided and explicit instruction (Mayer 2004; Kirschner, Sweller and Clark 2006; Alfieri and colleagues 2011). Searching a problem space uses up working memory that would otherwise build knowledge. Guidance should fade as expertise grows.","module":"m4"},{"id":"d9","statement":"Letting students struggle with a problem before explaining the idea is usually a waste of instructional time.","correct":false,"folk_theory":"Explanation must always come first.","explanation":"It depends on the goal. For load-bearing concepts where students have relevant prior knowledge, a designed generation phase followed by consolidation that builds on students' attempts improved conceptual understanding and transfer (Sinha and Kapur 2021, g about 0.36), with no advantage for procedural skills. Without the consolidation, the struggle is wasted.","module":"m4"},{"id":"d10","statement":"Because facts can be searched instantly, schools should focus on skills such as critical thinking rather than on knowledge.","correct":false,"folk_theory":"Knowledge is obsolete; skills are generic and transferable.","explanation":"Critical thinking, problem solving and reading comprehension are domain-specific and built from knowledge in long-term memory. Weak readers who knew baseball understood a baseball passage better than strong readers who did not (Recht and Leslie 1988). You need knowledge to search well and to judge what you find.","module":"m5"},{"id":"d11","statement":"Once children can decode fluently, their understanding of a particular text depends more on what they already know about its topic than on general reading skill.","correct":true,"folk_theory":"Reading comprehension is a general skill that transfers to any text.","explanation":"Comprehension is decoding times language comprehension (the Simple View of Reading), and language comprehension depends heavily on background knowledge and vocabulary. Comprehension strategies give a small, quick boost that does not keep growing.","module":"m5"},{"id":"d12","statement":"Giving students a grade plus a comment on their work helps them more than giving the comment alone.","correct":false,"folk_theory":"More feedback information is always better.","explanation":"Butler (1987/88) found students given comments only improved, while those given grades, or grades plus comments, did not: the grade swamped the comment. Hence comment-only marking on formative work, or grades delayed until students have acted on the comments.","module":"m6"},{"id":"d13","statement":"A school with great teachers and a rigorous curriculum will produce deep learning in most of its classrooms.","correct":false,"folk_theory":"Good inputs automatically yield deep learning; structure is neutral.","explanation":"Mehta and Fine spent about 750 hours in 30 admired high schools and found deep learning was the exception, living mostly at the periphery (electives, clubs, teams) rather than in core classes. The 'grammar of schooling' (periods, subject silos, coverage, grades) works against depth unless it is deliberately redesigned.","module":"m7"},{"id":"d14","statement":"The most reliable way to raise a school's results is to hire better teachers.","correct":false,"folk_theory":"Selection beats development.","explanation":"Teacher quality matters enormously, but credentials and other signals visible at hiring predict effectiveness only weakly (Kane, Rockoff and Staiger 2008), and removing weak teachers is slow and unreliable. Wiliam's case is to improve the teachers you have through sustained, school-based development.","module":"m8"},{"id":"d15","statement":"Reducing class sizes is one of the most cost-effective ways to raise achievement.","correct":false,"folk_theory":"Smaller classes are the obvious quality lever.","explanation":"Smaller classes help somewhat, especially in the early grades (Tennessee STAR, roughly 0.15-0.2 SD), but they are very expensive, and at scale force mass hiring of less experienced teachers, which diluted California's gains. Per dollar, curriculum and teacher development look much better.","module":"m8"},{"id":"d16","statement":"When an intervention works well in a pilot, the next step is to roll it out school-wide.","correct":false,"folk_theory":"Scale what works on average.","explanation":"Bryk's improvement science says results vary by classroom and context, and the question is why something works here and fails there. Move through widening cycles of testing (one teacher, then several, then a department), with predictions and practical measures, and scale only once it holds across conditions.","module":"m9"}],"model":{"bands":[{"id":"minds","title":"Minds: how learners work","certainty":"Mostly [E]. Robust: working memory limits, worked examples for novices, expertise reversal, retrieval and spacing, prior-knowledge effects, persistence of intuitive theories, curiosity for the target, adolescent status sensitivity. Thin: incidental curiosity spillover, reconsolidation in humans, mindset effects, wise-feedback replication base; most samples are adults in labs.","nodes":[{"id":"m1","label":"Working memory bottleneck","summary":"Working memory holds a few interacting elements for seconds. Intrinsic load comes from the material; extraneous load from poor design (split attention, redundancy, clutter). Everything in the design band is a way to conserve this capacity for the target.","tag":"E","links":["d1","d5"],"sources":["00-foundational-papers","01-how-learning-happens"]},{"id":"m2","label":"Schemas are expertise","summary":"Experts chunk; they do not have more working memory. Physics experts sort problems by principle, novices by surface. Schemas let a learner remember more by memorizing less, so knowledge compounds and so do gaps.","tag":"E","links":["d1","d3"],"sources":["00-foundational-papers","01-how-learning-happens","12-why-we-remember"]},{"id":"m3","label":"Prior knowledge drives comprehension","summary":"Weak readers who knew baseball out-comprehended strong readers who did not (Recht & Leslie). Comprehension is knowledge applied to a text, not a transferable skill. Find out what the learner knows and teach accordingly.","tag":"E","links":["d3","d6"],"sources":["06-beyond-the-science-of-reading","01-how-learning-happens","12-why-we-remember"]},{"id":"m4","label":"Retrieval, spacing, corrected error","summary":"Effortful recall, spaced and interleaved practice, and being wrong then promptly corrected build durable memory; rereading and massed practice build confidence without retention. Learning and performance are different variables and can move in opposite directions.","tag":"E","links":["d2","d5","d7"],"sources":["01-how-learning-happens","12-why-we-remember","04-productive-failure"]},{"id":"m5","label":"Intuitive theories outcompeted, not deleted","summary":"Children build causal frameworks (impetus, heat as substance, flat ground, essentialism). Instruction fuses with them into synthetic models that pass recall and fail prediction. Experts still carry the old theory under time pressure. Change needs dissatisfaction plus an intelligible, plausible, fruitful alternative, and the type of change sets the difficulty.","tag":"E","links":["d4","d2","d6"],"sources":["02-scienceblind","13-learning-scientific-concepts","00-foundational-papers"]},{"id":"m6","label":"Curiosity: a gap on the target","summary":"An open question the learner wants closed improves memory for its answer. Spillover to unrelated material is small, brief, inconsistent and reverses for complex school facts (Keller et al. 2024). Curiosity needs enough knowledge to notice a gap.","tag":"E","links":["d9","d2"],"sources":["00-foundational-papers","12-why-we-remember","03-intellectual-lives-of-children"]},{"id":"m7","label":"Adolescent status and respect","summary":"Motivation problems are often respect problems. Critical feedback is ambiguous; a sincere statement of high standards plus belief resolves it (71% vs 17% revision in a small field experiment). Status threat produces resistance; conferred respect produces effort.","tag":"E","links":["d7","d8","d10"],"sources":["05-10-to-25"]},{"id":"m8","label":"Motivation follows competence","summary":"Self-efficacy grows from mastery experiences; attributions and mindsets shape persistence with small, heterogeneous effects. Engineer a high success rate and controllable causes; do not wait for motivation before teaching.","tag":"E","links":["d8"],"sources":["01-how-learning-happens","05-10-to-25"]},{"id":"m9","label":"Safety and attention as infrastructure","summary":"Divided attention impairs encoding; chronic threat narrows flexible learning; errors are productive only where they are safe. Kapur's affect condition, Yeager's stress reappraisal and Ranganath's emotion chapters converge.","tag":"H","links":["d2","d8"],"sources":["12-why-we-remember","05-10-to-25","04-productive-failure"]}]},{"id":"design","title":"Design: how learning experiences are built","certainty":"[E] for mechanisms, [H] for parameters. Solid: explicit-first for novices, PF for concepts under conditions, knowledge drives comprehension, grades swamp comments, formative use of evidence. Thin: whole-curriculum effects on general tests, specific doses and cadences, mentor-mindset training at scale, apprenticeship features transplanted into required courses.","nodes":[{"id":"d1","label":"Guidance dial: explicit, then fade","summary":"Novices learn best from worked examples, small steps, many checks, and guided then independent practice. The same supports become redundant load once schemas exist (expertise reversal). Unguided discovery for novices is rejected by every source.","tag":"E","links":["i3","i4"],"sources":["00-foundational-papers","01-how-learning-happens"]},{"id":"d2","label":"Generate-then-consolidate for core concepts","summary":"A short designed problem-solving phase before instruction beats instruction-first on conceptual knowledge and transfer (g about 0.36; no difference on procedures; stronger from grade 6 up) when the concept is load-bearing, students have knowledge to activate, the problem admits multiple methods, and a consolidation compares student solutions with the canonical one. Without consolidation it is unproductive failure.","tag":"E","links":["i4","i8"],"sources":["04-productive-failure","00-foundational-papers","12-why-we-remember"]},{"id":"d3","label":"Knowledge-rich, coherent curriculum","summary":"Decoding is taught systematically and separately; knowledge in science, history, geography and the arts runs from kindergarten, sequenced so units build and texts cluster. Comprehension strategies are short and embedded; writing is taught at sentence level inside content. Mechanism is [E], scale effects [H], content choice [V].","tag":"E","links":["i4","i6"],"sources":["06-beyond-the-science-of-reading","10-creating-the-schools-our-children-need","01-how-learning-happens"]},{"id":"d4","label":"Conceptual-change design","summary":"Each hard concept gets a named intuitive theory, a diagnostic, a canonical anomaly, a mechanism rather than a conclusion, multiple representations, and planned returns across years. Cognitive conflict alone fails. Assess with prediction and transfer items because recall cannot detect synthetic models.","tag":"H","links":["i4","i7"],"sources":["02-scienceblind","13-learning-scientific-concepts","00-foundational-papers"]},{"id":"d5","label":"Structural retrieval and spacing","summary":"Daily retrieval starters, cumulative quizzes, interleaved homework from prior weeks, cumulative end-of-year assessment, individual recall before group discussion. Homework is retrieval of old material, never new content.","tag":"E","links":["i3"],"sources":["01-how-learning-happens","12-why-we-remember"]},{"id":"d6","label":"Formative assessment: every student, every lesson","summary":"Formative is a use of evidence, not a kind of test. No hands up, all-student response, hinge questions with misconception-keyed distractors, exit tickets that plan tomorrow. Realistic whole-school effect about 0.1 SD over two years, still among the best buys.","tag":"E","links":["i1"],"sources":["07-embedding-formative-assessment","10-creating-the-schools-our-children-need"]},{"id":"d7","label":"Feedback that moves learning and protects status","summary":"A third of feedback interventions lower performance; grades swamp comments (Butler); wise feedback resolves the ambiguity of criticism. So: comment-only on formative work, feedback that requires student work, revision expected, and a sincere statement of standard plus belief.","tag":"E","links":["i1","i9"],"sources":["07-embedding-formative-assessment","05-10-to-25","01-how-learning-happens"]},{"id":"d8","label":"Mentor stance: high standards, high support, say why","summary":"Enforcer and protector both read as disrespect. The mentor holds the bar, scaffolds the climb, explains why, asks sincere questions, and frames stress as fuel. Applies to discipline, advising and grading. Components [E]; the trained 2x2 at scale [H].","tag":"H","links":["i5","i7"],"sources":["05-10-to-25","01-how-learning-happens"]},{"id":"d9","label":"Curiosity on target; intellectual life protected","summary":"Open the question right before teaching its answer; never use unrelated hooks to prime hard content. Separately, protect children's own questions: teachers who follow up and model curiosity keep question rates up; a protected block for pursuing ideas is a value choice with untested outcomes.","tag":"H","links":["i10"],"sources":["03-intellectual-lives-of-children","00-foundational-papers","12-why-we-remember"]},{"id":"d10","label":"Apprenticeship features in the core","summary":"Deep learning (mastery, identity, creativity together) shows up where students make real things for real audiences, revise toward a standard, and learn from practitioners. Evidence is observational and selection-confounded; the bet is to import these features into required courses without abandoning guidance and the knowledge spine.","tag":"H","links":["i5"],"sources":["09-in-search-of-deeper-learning","05-10-to-25","07-embedding-formative-assessment"]}]},{"id":"institution","title":"Institution: how good learning happens consistently","certainty":"[H] and [V] heavy. Solid: the TLC delivery model (one large trial), weak hiring signals, null merit pay, modest costly class-size effects, Campbell's law. Thin: community co-design as a method, improvement science in schools (case narratives), deeper-learning prescriptions (ethnography), leadership dependence and turnover.","nodes":[{"id":"i1","label":"Develop the teachers you have (TLCs)","summary":"Teacher quality is the largest in-school lever; hiring signals are weak; deselection and merit pay have not worked. Groups of 8-12 meeting monthly for 75-120 minutes over two years, each committing to one or two techniques, with peer observation and accountability. One 140-school trial: about two months' extra progress.","tag":"E","links":["i8"],"sources":["07-embedding-formative-assessment","10-creating-the-schools-our-children-need"]},{"id":"i2","label":"Benefit per teacher-hour; stop doing","summary":"Class size, technology, structure and choice have small or expensive effects. Effect sizes shrink with age, inflate with proximal tests, and cannot be ranked across studies. Every proposal states effect, cost in teacher-hours, scalability and what it displaces. Publish a stop-doing list yearly.","tag":"E","links":["i1","i4","i5"],"sources":["10-creating-the-schools-our-children-need"]},{"id":"i3","label":"Common model, tight but loose","summary":"Rosenshine plus cognitive apprenticeship as shared language for planning, observation and coaching, framed as mechanisms not a checklist. Name the active ingredient of every practice and its likely lethal mutation.","tag":"H","links":["i8"],"sources":["01-how-learning-happens","07-embedding-formative-assessment","10-creating-the-schools-our-children-need"]},{"id":"i4","label":"School-owned materials and banks","summary":"A sequenced knowledge spine per subject, a bank of misconception-keyed hinge questions per unit, curated generate-then-consolidate tasks with consolidation scripts, and a hard-concepts register with multi-year progressions. Teachers do not invent alone.","tag":"H","links":["i8"],"sources":["06-beyond-the-science-of-reading","07-embedding-formative-assessment","04-productive-failure","02-scienceblind","13-learning-scientific-concepts"]},{"id":"i5","label":"Core designed for depth; periphery protected","summary":"The grammar of school pushes toward doing school. Change structure only where an instructional need requires it; put an authentic product in every core course; fund clubs, arts, debate and publications as infrastructure with mixed-age ladders. No two-tier school.","tag":"H","links":["i10"],"sources":["09-in-search-of-deeper-learning","10-creating-the-schools-our-children-need"]},{"id":"i6","label":"Community co-design, bounded by evidence","summary":"Graduate aims across intellectual prowess, wayfinding and well-being; a concrete target student experience; a design team including students and the least-served families. The compact says which layer is open: purpose, culture, periphery and content priorities are co-designed; phonics, retrieval, feedback and novice guidance are not up for a vote.","tag":"V","links":["i8"],"sources":["08-extraordinary-learning-for-all","11-improvement-in-action"]},{"id":"i7","label":"Symmetry: adults learn as students learn","summary":"Teachers who teach deeply usually learned deeply. Give adults mastery, identity and creativity in their discipline; give novice teachers worked examples, not discovery; treat development as retrieval, spacing and feedback for adults. TLCs and PDSA teams are the structures.","tag":"H","links":["i1","i8"],"sources":["09-in-search-of-deeper-learning","07-embedding-formative-assessment","11-improvement-in-action","00-foundational-papers"]},{"id":"i8","label":"Improvement system: aim, drivers, PDSA","summary":"Two or three aims per year by subgroup; a living driver diagram every initiative attaches to; two-to-four-week cycles with a written prediction, a practical measure returned within days, and a study meeting. Variation is the problem: ask for whom and under what conditions before scaling. Improvement implements proven content; it does not discover pedagogy.","tag":"H","links":["d1","d6","i9"],"sources":["11-improvement-in-action","08-extraordinary-learning-for-all"]},{"id":"i9","label":"Improvement data walled from accountability","summary":"Practical measures never enter teacher evaluation; accountability measures are reported, not managed to; single-year value-added and single observations never drive consequential decisions. Balancing measures (workload, well-being) travel with every change. [E] that high-stakes use corrupts; [V] trust over surveillance.","tag":"V","links":["i8"],"sources":["11-improvement-in-action","07-embedding-formative-assessment","10-creating-the-schools-our-children-need"]},{"id":"i10","label":"Leading indicators of minds and experience","summary":"Student-experience surveys each term, sampled counts of student-originated questions per hour by grade, whole-day student shadowing by leaders, revision rates, hinge-question misconception rates. These are the loop's sensors; test scores are lagging.","tag":"H","links":["i8"],"sources":["08-extraordinary-learning-for-all","03-intellectual-lives-of-children","09-in-search-of-deeper-learning","07-embedding-formative-assessment"]},{"id":"i11","label":"Leadership: safety, time, succession","summary":"Improvement run as compliance becomes paperwork. The leader models inquiry, protects weekly team time in the master schedule, budgets teacher time like money, writes the operating system into roles and documents so it survives turnover, and holds a three-to-five-year horizon.","tag":"H","links":["i8","i1"],"sources":["11-improvement-in-action","10-creating-the-schools-our-children-need","08-extraordinary-learning-for-all"]}]}],"chain":["A learner holds only a few new elements at once; every school decision spends that capacity on the target or wastes it.","Organized knowledge in long-term memory is the way around the limit; expertise, comprehension and thinking run on schemas, so knowledge is the product.","Knowledge gets there through effortful spaced retrieval and corrected error, not rereading or fluency; learning is not performance.","Learners arrive with intuitive theories that are outcompeted, not deleted; hard concepts need diagnosis, mechanism and multi-year returns.","Encoding is gated by state: a gap on the target helps; status threat and unsafe errors shut effort down.","So instruction is explicit and worked-example-led for novices, fading with expertise, with generate-then-consolidate reserved for core concepts under conditions.","So the curriculum is a coherent cumulative knowledge spine owned by the school, with hard concepts planned as progressions.","So assessment elicits evidence from every student and changes the next step; feedback is comment-only, requires work, and protects status.","None of this happens reliably by itself: teaching runs on habit and practices die by mutation, so the institution makes the right defaults easy through a common model, shared materials and sustained peer-accountable development.","Teacher time is the scarcest resource; every initiative is judged by benefit per adult hour, and the leader stops good things.","The grammar of school pushes against depth; the core is designed for depth on purpose and the periphery protected.","The school itself learns: few aims, a driver diagram, small predicted tests, practical measures walled from accountability, community co-designing purpose while evidence bounds mechanism."],"laws":["Working memory is the budget. Every lesson, slide, routine and building decision either spends it on the target or wastes it.","Knowledge in long-term memory is the product. The curriculum is a sequenced, cumulative knowledge spine owned by the school, from kindergarten, in every subject.","Guidance is a dial, not a side. Explicit, worked-example-led instruction is the default for novices; guidance fades with expertise; generate-then-consolidate is a named exception with conditions; unguided discovery is not a lesson type.","Learning is not performance. Retrieval, spacing and interleaving are structural; homework is old material; lessons are judged by delayed and transfer outcomes.","Students are not blank. Every hard concept has a named intuitive theory, a diagnostic, a mechanism and a multi-year revisit schedule; recall tests are not evidence of change.","Open the gap on the target, then close it. Hooks lead into the objective, never beside it. Children's own questions are protected as an end, not a tool.","High standards, high support, and say why. Enforcer and protector stances are both disrespect. Errors are safe, revision is expected, and nothing lowers a student's status in public.","Assessment is formative only if it changes the next decision. Every lesson elicits evidence from every student; comments without grades on formative work; few summative points.","Improve the teachers we have. Hire for disciplinary depth and coachability; develop through monthly, multi-year, peer-accountable learning communities; keep development separate from evaluation.","Teacher time is the scarcest resource. Every initiative states effect, cost in adult hours, and what it displaces. A stop-doing list is published every year.","The core is designed for depth; the periphery is protected. Every core course ends in a real product for a real audience; structure changes only when instruction needs it; no two-tier school.","The school learns in the open. Few aims, a living driver diagram, small predicted tests, practical measures returned in days and never used for evaluation, variation studied before scaling. The community co-designs purpose and experience; the evidence sets the mechanisms."],"loop":"The institution is the thing that learns. Aim (i8) leads to a driver diagram naming which design defaults (band 2) should move which mind-level mechanisms (band 1); a small test runs with a written prediction; a practical measure is taken from the work (retrieval scores, hinge misconception rates, revision rates, question rates, experience surveys: i10) and returned within days; a study meeting revises the default or the theory; the cycle repeats and scales only when it works across contexts and subgroups. The loop breaks in two predictable ways: when its measures are used for accountability (i9), and when it is asked to rediscover pedagogy that decades of evidence have settled. Formative assessment is the same loop at lesson scale, TLCs at teacher scale, PDSA at school scale."}}</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("course-data").textContent);
const MODULES = DATA.modules || [];
const CARDS = DATA.cards || [];
const CASES = DATA.cases || [];
const TENSIONS = DATA.tensions || [];
const BRIEF = DATA.brief || [];
const MODEL = DATA.model || { bands: [] };
const DIAG = DATA.diagnostic || [];
const DAY = 86400000;

/* ---------- state + persistence ---------- */
const blank = () => ({ v: 1, updatedAt: 0, started: Date.now(), modules: {}, cards: {}, cases: {}, brief: {}, diag: [] });
let S = blank();
const LS_KEY = "founding-school-state";
try { const raw = localStorage.getItem(LS_KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch (e) {}

let db = null, stateRef = null, syncNote = "Saved in this browser";
let writing = false, pending = false, timer = null;
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (!stateRef) return;
  clearTimeout(timer);
  timer = setTimeout(flush, 1200);
}
async function flush() {
  if (!stateRef) return;
  if (writing) { pending = true; return; }
  writing = true;
  try { await stateRef.set(JSON.parse(JSON.stringify(S))); syncNote = "Synced to your account"; }
  catch (e) { syncNote = e && e.code === "quota_exceeded" ? "Account storage is full; saved in this browser" : "Saved in this browser (sync paused)"; }
  writing = false;
  renderSync();
  if (pending) { pending = false; flush(); }
}
async function connect() {
  if (!window.claude || !window.claude.use) return;
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d;
    stateRef = db.doc("data/users/" + id + "/state");
    const snap = await stateRef.get();
    if (snap.exists) {
      const remote = snap.data();
      if ((remote.updatedAt || 0) > (S.updatedAt || 0)) { S = Object.assign(blank(), JSON.parse(JSON.stringify(remote))); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} route(); }
      else if ((S.updatedAt || 0) > (remote.updatedAt || 0)) flush();
    } else if (S.updatedAt) flush();
    syncNote = "Synced to your account";
    renderSync();
  } catch (e) { /* stay local */ }
}

/* ---------- Claude mentor ---------- */
let samplePromise = null;
function getSample() {
  if (!samplePromise) samplePromise = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  return samplePromise;
}
const SAMPLE_MSG = {
  not_granted: "Mentor feedback is turned off for this page.", sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "Too many requests just now. Try again in a minute.", session_expired: "Sign in to claude.ai again, then retry.",
  prompt_too_large: "That was too long to send. Shorten your answer and retry.", refused: "Claude declined this one. Rephrase and retry."
};
async function mentor(outEl, btn, prompt) {
  const sample = await getSample();
  if (!sample) { outEl.hidden = false; outEl.textContent = "Mentor feedback works when this page is opened on claude.ai."; return; }
  btn.disabled = true; outEl.hidden = false; outEl.textContent = "Thinking...";
  try {
    await sample(prompt, { modelTier: "default", cache: false, onText: ({ text }) => { outEl.innerHTML = md(text); } });
  } catch (e) {
    if (e && e.code === "cancelled") return;
    outEl.innerHTML = (e && e.text ? md(e.text) + "<p class='muted'>(interrupted)</p>" : "") + "<p class='muted'>" + esc(SAMPLE_MSG[e && e.code] || "Couldn't reach Claude. Try again.") + "</p>";
  } finally { btn.disabled = false; }
}
const MENTOR_VOICE = "You are a demanding but supportive mentor (high standards, high support) coaching a learner who is designing a K-12 school from scratch. They have a software/product background. Be specific and concise (under 250 words). Use markdown bullets. Tag institutional claims as [E] evidence, [H] hypothesis, [V] value where useful.";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function inline(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
          .replace(/\[(E|H|V)\]/g, '<span class="tag $1">$1</span>');
}
function md(src) {
  const lines = esc(src || "").split(/\n/);
  let out = "", list = null, para = [];
  const flushP = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeL = () => { if (list) { out += "</" + list + ">"; list = null; } };
  for (const raw of lines) {
    const l = raw.trim();
    let m;
    if (!l) { flushP(); closeL(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { flushP(); closeL(); out += "<h4>" + inline(m[1]) + "</h4>"; continue; }
    if ((m = l.match(/^[-*]\s+(.*)/))) { flushP(); if (list !== "ul") { closeL(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { closeL(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    closeL(); para.push(l);
  }
  flushP(); closeL();
  return out;
}
const tagChip = t => t ? `<span class="tag ${esc(t)}" title="${{ E: "Supported by evidence", H: "Hypothesis to test", V: "Value commitment" }[t] || ""}">${esc(t)}</span>` : "";
const modState = id => (S.modules[id] = S.modules[id] || { hinge: {}, attempt: "", brief: "", done: false });
const L = "ABCDEFGH";
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const saveSoon = debounce(save, 600);
function bookName(slug) {
  const s = String(slug).replace(/^books\//, "").replace(/\.md.*$/, "").replace(/^\d+-/, "").replace(/-/g, " ");
  return s.charAt(0).toUpperCase() + s.slice(1);
}

/* ---------- SRS (SM-2 lite) ---------- */
function cardState(id) { return S.cards[id]; }
function dueCards() {
  const now = Date.now();
  const unlocked = new Set(MODULES.filter(m => modState(m.id).done || m.id === "m0").map(m => m.id));
  const seen = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].due <= now);
  const fresh = CARDS.filter(c => !S.cards[c.id] && unlocked.has(c.module));
  const newToday = Object.values(S.cards).filter(c => c.firstSeen && now - c.firstSeen < DAY).length;
  return seen.sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).concat(fresh.slice(0, Math.max(0, 20 - newToday)));
}
function grade(id, g) {
  const now = Date.now();
  const c = S.cards[id] || { ease: 2.5, interval: 0, reps: 0, firstSeen: now, lapses: 0 };
  if (g === 0) { c.reps = 0; c.lapses++; c.interval = 0; c.ease = Math.max(1.3, c.ease - 0.2); c.due = now + 10 * 60000; }
  else {
    c.reps++;
    if (c.reps === 1) c.interval = g === 3 ? 3 : 1;
    else if (c.reps === 2) c.interval = g === 3 ? 7 : 3;
    else c.interval = Math.round(c.interval * c.ease * (g === 1 ? 0.6 : g === 3 ? 1.3 : 1));
    c.ease = Math.max(1.3, c.ease + (g === 1 ? -0.15 : g === 3 ? 0.15 : 0));
    c.due = now + c.interval * DAY;
  }
  S.cards[id] = c; save();
}

    <p class="lede">Experts in this field disagree for real reasons. You won't pick a side for good. You'll know which conditions favor which pole, and what signal should make you switch.</p></header>
    ${TENSIONS.map(t => `<section class="panel tension"><h3>${esc(t.name)}</h3>
      <div class="poles"><div><span class="label">Pole A</span><div class="prose">${md(t.pole_a)}</div></div><div><span class="label">Pole B</span><div class="prose">${md(t.pole_b)}</div></div></div>
      ${t.evidence ? `<div class="prose muted">${md(t.evidence)}</div>` : ""}
      <p class="rule">${inline(esc(t.rule))}</p>
      ${t.switch_signal ? `<p><span class="label">Switch signal</span><br>${inline(esc(t.switch_signal))}</p>` : ""}
      ${(t.sources || []).length ? `<p class="label">${t.sources.map(bookName).map(esc).join(" &middot; ")}</p>` : ""}</section>`).join("")}</div>`;
}

let openCase = null;
function viewCases() {
  if (openCase) {
    const k = CASES.find(c => c.id === openCase); const st = S.cases[k.id] = S.cases[k.id] || { answer: "", revealed: false };
    const t = TENSIONS.find(x => x.id === k.tension);
    return `<div class="sheet"><div class="row"><button class="btn small" id="backCases">All cases</button></div>
      <header class="head"><span class="label">Case ${esc(k.id.toUpperCase())}${t ? " &middot; " + esc(t.name) : ""}</span><h1>${esc(k.title)}</h1></header>
      <div class="prose">${md(k.scenario)}</div>
      <div class="panel attempt"><p class="q"><strong>${inline(esc(k.question || "What do you do?"))}</strong></p>
        <label class="label" for="case-ans">Your decision and reasoning</label>
        <textarea id="case-ans" placeholder="Decide, then tag your reasoning [E], [H] or [V].">${esc(st.answer)}</textarea>
        <div class="row"><button class="btn" id="caseFb">Get mentor feedback</button><button class="btn primary" id="reveal">${st.revealed ? "Hide" : "Reveal"} model answer</button></div>
        <div class="fb prose" id="case-out" hidden></div></div>
      ${st.revealed ? `<section class="step reveal"><span class="label">Considerations</span><div class="prose"><ul>${(k.considerations || []).map(c => `<li>${inline(esc(c))}</li>`).join("")}</ul></div>
        <span class="label">Model answer</span><div class="prose">${md(k.model_answer)}</div>
        ${(k.sources || []).length ? `<p class="label">${k.sources.map(bookName).map(esc).join(" &middot; ")}</p>` : ""}</section>` : ""}
    </div>`;
  }
  return `<div class="sheet"><header class="head"><span class="label">${CASES.length} founder dilemmas</span><h1>Casebook</h1>
    <p class="lede">Realistic situations a founder hits in the first three years. Commit to a decision in writing before you look at the model answer.</p></header>
    <div class="modlist">${CASES.map((k, i) => { const t = TENSIONS.find(x => x.id === k.tension); const st = S.cases[k.id];
      return `<a class="modrow" href="#cases" data-case="${esc(k.id)}"><span class="num">${i + 1}</span><span><span class="t">${esc(k.title)}</span><br><span class="muted">${t ? esc(t.name) : ""}</span></span><span class="meta">${st && st.answer ? "answered" : ""}</span></a>`; }).join("")}</div></div>`;
}
function bindCases() {
  document.querySelectorAll("[data-case]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openCase = a.dataset.case; route(); window.scrollTo(0, 0); }));
  const back = $("#backCases"); if (back) back.addEventListener("click", () => { openCase = null; route(); });
  if (!openCase) return;
  const k = CASES.find(c => c.id === openCase), st = S.cases[k.id];
  $("#case-ans").addEventListener("input", e => { st.answer = e.target.value; saveSoon(); });
  $("#reveal").addEventListener("click", () => { st.revealed = !st.revealed; save(); route(); });
  $("#caseFb").addEventListener("click", e => {
    if (!st.answer.trim()) { const o = $("#case-out"); o.hidden = false; o.textContent = "Write your decision first."; return; }
    mentor($("#case-out"), e.currentTarget, `${MENTOR_VOICE}

Evaluate the learner's decision on this founder dilemma against the model answer. Say what they got right, what they missed (especially evidence they ignored or values they left implicit), whether their [E]/[H]/[V] tags are honest, and give one sharper version of their decision in 2-3 sentences. Don't restate the whole model answer.

Case: ${k.title}
${k.scenario}
Question: ${k.question}
Considerations: ${(k.considerations || []).join("; ")}
Model answer: ${k.model_answer}

Learner's answer:
${st.answer}`);
  });
}

function viewDiagnostic() {
  const runs = S.diag || [];
  const cur = S._diagDraft = S._diagDraft || {};
  const complete = DIAG.every(d => cur[d.id] && cur[d.id].a != null && cur[d.id].c);
  const last = runs[runs.length - 1], first = runs[0];
  const score = r => DIAG.filter(d => r.answers[d.id] && r.answers[d.id].a === d.correct).length;
  const overconf = r => DIAG.filter(d => r.answers[d.id] && r.answers[d.id].a !== d.correct && r.answers[d.id].c >= 4).length;
  const results = last ? `<section class="panel reveal"><span class="label">Last run &middot; ${new Date(last.at).toLocaleDateString()}</span>
      <h3>${score(last)} of ${DIAG.length} right &middot; ${overconf(last)} confident mistakes</h3>
      ${runs.length > 1 ? `<p class="muted">First run: ${score(first)} right, ${overconf(first)} confident mistakes.</p>` : ""}
      <div class="prose"><ul>${DIAG.map(d => { const a = last.answers[d.id]; const ok = a && a.a === d.correct;
        return `<li><strong>${ok ? "Right" : "Wrong"}${a ? ", confidence " + a.c : ""}:</strong> ${inline(esc(d.statement))} <em>(${d.correct ? "true" : "false"})</em><br><span class="muted">${inline(esc(d.explanation))}${d.folk_theory && !ok ? " Folk theory: " + inline(esc(d.folk_theory)) : ""}</span></li>`; }).join("")}</ul></div></section>` : "";
  return `<div class="sheet"><header class="head"><span class="label">Take it on day 1 and again at the end</span><h1>Diagnostic</h1>
    <p class="lede">True or false, then how sure you are. Confident mistakes matter most: they are intuitive theories, and the course is built to change them.</p></header>
    ${results}
    <section class="step"><span class="label">${runs.length ? "Retake" : "Take the diagnostic"}</span>
    ${DIAG.map((d, i) => { const a = cur[d.id] || {}; return `<div class="dstmt"><p><span class="label">${i + 1}.</span> ${inline(esc(d.statement))}</p>
      <div class="row"><div class="tf">${[["True", true], ["False", false]].map(([l, v]) => `<button class="${a.a === v ? "on" : ""}" data-d="${esc(d.id)}" data-a="${v}">${l}</button>`).join(" ")}</div>
      <div class="conf"><span class="label">Sure?</span>${[1, 2, 3, 4, 5].map(c => `<button class="${a.c === c ? "on" : ""}" data-d="${esc(d.id)}" data-c="${c}" aria-label="Confidence ${c}">${c}</button>`).join("")}</div></div></div>`; }).join("")}
    <div class="row"><button class="btn primary" id="scoreDiag" ${complete ? "" : "disabled"}>Score it</button><span class="muted">${complete ? "" : "Answer every item and rate your confidence."}</span></div></section></div>`;
}
function bindDiagnostic() {
  const cur = S._diagDraft;
  document.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => { (cur[b.dataset.d] = cur[b.dataset.d] || {}).a = b.dataset.a === "true"; save(); route(); }));
  document.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => { (cur[b.dataset.d] = cur[b.dataset.d] || {}).c = +b.dataset.c; save(); route(); }));
  $("#scoreDiag").addEventListener("click", () => { S.diag.push({ at: Date.now(), answers: cur }); S._diagDraft = {}; save(); route(); window.scrollTo(0, 0); });
}

/* ---------- router ---------- */
function route() {
  const h = (location.hash || "#home").slice(1);
  const main = $("#main"); const y = window.scrollY;
  const m = MODULES.find(x => x.id === h);
  if (m) { main.innerHTML = viewModule(m); bindModule(m); }
  else if (h === "cards") { main.innerHTML = viewCards(); bindCards(); }
  else if (h === "brief") { main.innerHTML = viewBrief(); bindBrief(); }
  else if (h === "model") { main.innerHTML = viewModel(); bindModel(); }
  else if (h === "tensions") { main.innerHTML = viewTensions(); }
  else if (h === "cases") { main.innerHTML = viewCases(); bindCases(); }
  else if (h === "diagnostic") { main.innerHTML = viewDiagnostic(); bindDiagnostic(); }
  else { main.innerHTML = viewHome(); }
  renderNav(m ? m.id : (h || "home"));
  if (route.last === h) window.scrollTo(0, y); else window.scrollTo(0, 0);
  route.last = h;
  $("#rail").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded", "false");
}
window.addEventListener("hashchange", () => { if (location.hash !== "#cases") openCase = null; cardQueue = []; showBack = false; route(); });
$("#menuBtn").addEventListener("click", () => { const r = $("#rail"); r.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", String(r.classList.contains("open"))); });
route();
connect();
})();
</script>
